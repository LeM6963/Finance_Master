<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>PE/IB Mastery — Préparation entretiens Private Equity & Banque d'investissement</title>
<style>
:root{
  --accent:#E8743B; --accent-soft:#FCEDE4; --accent-ink:#B5481E;
  --gold:#C9A227; --green:#1E9E6A; --blue:#2F6FED; --violet:#7C5CE0; --red:#C0392B;
  --bg:#FAF8F4; --surface:#FFFFFF; --surface-2:#F4F1EA;
  --ink:#1B1A18; --ink-2:#54514B; --muted:#8A867E; --line:#ECE7DD;
  --shadow:0 1px 2px rgba(20,16,8,.04), 0 8px 24px rgba(20,16,8,.05);
  --radius:18px; --radius-sm:12px; --maxw:1180px;
}
[data-theme=dark]{
  --accent:#F2865A; --accent-soft:#3A2519; --accent-ink:#F6A782;
  --bg:#15140F; --surface:#1E1C17; --surface-2:#26241D;
  --ink:#F3F0E9; --ink-2:#C4BFB4; --muted:#8E8A7F; --line:#312E26;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
html,body{margin:0;min-height:100%;}
body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none;cursor:pointer;}
button{font:inherit;cursor:pointer;}
::selection{background:var(--accent-soft);}
h1,h2,h3,h4{letter-spacing:-.01em;}
.hidden{display:none !important;}

/* shell */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh;}
.sidebar{background:var(--surface);border-right:1px solid var(--line);padding:16px 14px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto;}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 14px;}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--gold));display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;flex:none;}
.brand b{font-size:14.5px;} .brand span{display:block;font-size:11px;color:var(--muted);}
.nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:14px 10px 6px;}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;color:var(--ink-2);font-weight:500;font-size:14px;}
.nav a:hover{background:var(--surface-2);color:var(--ink);}
.nav a.active{background:var(--accent-soft);color:var(--accent-ink);font-weight:600;}
.nav a .ic{width:18px;text-align:center;flex:none;}
.nav a .badge{margin-left:auto;font-size:11px;font-weight:700;background:var(--accent);color:#fff;border-radius:999px;padding:1px 7px;}
.side-foot{margin-top:auto;padding-top:10px;border-top:1px solid var(--line);}
.rankmini{display:flex;align-items:center;gap:10px;padding:8px 6px;}
.rankmini .av{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:16px;flex:none;}
.rankmini b{font-size:13px;display:block;} .rankmini span{font-size:11px;color:var(--muted);}

.main{display:flex;flex-direction:column;min-width:0;}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 24px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:saturate(140%) blur(10px);border-bottom:1px solid var(--line);}
.burger{display:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 11px;}
.search{flex:1;max-width:520px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 13px;color:var(--muted);font-size:14px;}
.search .kbd{margin-left:auto;font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:var(--surface-2);}
.tb-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:7px;}
.tb-btn:hover{color:var(--ink);}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.seg button{border:0;background:transparent;font-size:13px;font-weight:600;color:var(--muted);padding:8px 12px;}
.seg button.on{background:var(--accent-soft);color:var(--accent-ink);}

.content{padding:26px 24px 70px;max-width:var(--maxw);width:100%;margin:0 auto;}
.hello h1{font-size:25px;margin:0 0 2px;}
.hello p{color:var(--ink-2);margin:0 0 20px;}
.grid{display:grid;gap:18px;}
.cols-3{grid-template-columns:repeat(3,1fr);} .cols-2{grid-template-columns:1.4fr 1fr;} .cols-2e{grid-template-columns:1fr 1fr;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);}
.card h3{margin:0 0 2px;font-size:15px;} .card .cap{font-size:12px;color:var(--muted);margin:0 0 14px;}
.stat .v{font-size:30px;font-weight:750;} .stat .l{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;}
.flame{color:var(--accent);} .up{color:var(--green);font-size:12px;font-weight:700;}
.ladder{display:flex;align-items:center;gap:6px;margin-top:8px;}
.ladder .step{flex:1;height:6px;border-radius:999px;background:var(--surface-2);}
.ladder .step.done{background:linear-gradient(90deg,var(--accent),var(--gold));}
.ladder .step.cur{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.ranknames{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:8px;}
.ranknames b{color:var(--accent-ink);}
.ring{width:96px;height:96px;border-radius:50%;flex:none;display:grid;place-items:center;}
.ring .inner{width:74px;height:74px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center;}
.ring .inner b{font-size:20px;} .ring .inner span{font-size:10px;color:var(--muted);display:block;}
.goal-list{margin:0;padding:0;list-style:none;font-size:14px;}
.goal-list li{display:flex;align-items:center;gap:10px;padding:6px 0;color:var(--ink-2);}
.goal-list .chk{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:11px;flex:none;}
.goal-list .chk.done{background:var(--green);border-color:var(--green);color:#fff;}
.goal-list .done-txt{text-decoration:line-through;color:var(--muted);}
.mrow{display:flex;align-items:center;gap:12px;margin:11px 0;}
.mrow .name{width:130px;font-size:13.5px;font-weight:600;}
.mrow .track{flex:1;height:9px;background:var(--surface-2);border-radius:999px;overflow:hidden;}
.mrow .fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--gold));}
.mrow .pct{width:42px;text-align:right;font-size:12.5px;color:var(--muted);font-weight:700;}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;font-weight:700;border:0;border-radius:11px;padding:11px 16px;font-size:14px;}
.btn:hover{filter:brightness(1.05);} .btn.ghost{background:var(--surface-2);color:var(--ink);} .btn.sm{padding:7px 12px;font-size:13px;border-radius:9px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.due{display:flex;align-items:center;gap:14px;padding:11px 12px;border:1px solid var(--line);border-radius:13px;}
.due+.due{margin-top:9px;}
.tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;}
.due b{font-size:14px;} .due small{color:var(--muted);} .due .go{margin-left:auto;font-weight:700;color:var(--accent);}
.section-h{display:flex;align-items:center;justify-content:space-between;margin:28px 0 14px;gap:12px;flex-wrap:wrap;}
.section-h h2{font-size:19px;margin:0;}
.muted{color:var(--muted);font-size:13px;}
.badges{display:flex;gap:12px;flex-wrap:wrap;}
.badge2{width:74px;text-align:center;font-size:10.5px;color:var(--ink-2);}
.badge2 .b{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-size:22px;margin:0 auto 5px;background:var(--surface-2);}
.badge2.lit .b{background:linear-gradient(135deg,var(--accent),var(--gold));color:#fff;box-shadow:var(--shadow);}
.badge2.locked{opacity:.42;}
.flag{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.04em;padding:2px 6px;border-radius:6px;vertical-align:middle;}
.flag.v{background:rgba(30,158,106,.15);color:var(--green);} .flag.a{background:rgba(201,162,39,.2);color:#9A7B12;}
.flag.e{background:rgba(124,92,224,.16);color:var(--violet);} .flag.corr{background:rgba(232,116,59,.16);color:var(--accent-ink);}
.note{font-size:12.5px;color:var(--accent-ink);background:var(--accent-soft);border-radius:10px;padding:9px 12px;margin-top:10px;}
.term{border-bottom:1.5px dotted var(--accent);cursor:help;position:relative;}
.term .tip{position:absolute;left:0;bottom:135%;width:260px;max-width:72vw;background:var(--ink);color:#fff;padding:10px 12px;border-radius:10px;font-size:12.5px;line-height:1.45;font-weight:400;opacity:0;pointer-events:none;transform:translateY(4px);transition:.15s;z-index:40;box-shadow:var(--shadow);}
.term .tip b{color:var(--accent);}
.term:hover .tip,.term:focus .tip{opacity:1;transform:translateY(0);}
.prose{font-size:15px;color:var(--ink-2);} .prose h4{color:var(--ink);font-size:16px;margin:18px 0 6px;} .prose p{margin:8px 0;} .prose b{color:var(--ink);}
.prose ul{margin:8px 0;padding-left:20px;} .prose li{margin:4px 0;}
.figtable{border-collapse:collapse;width:100%;margin:12px 0;font-size:13px;}
.figtable th,.figtable td{border:1px solid var(--line);padding:7px 10px;text-align:right;}
.figtable th:first-child,.figtable td:first-child{text-align:left;}
.figtable th{background:var(--surface-2);font-weight:700;color:var(--ink);}
.figcap{font-size:12px;color:var(--muted);margin-top:4px;}
.crumb{font-size:13px;color:var(--muted);margin-bottom:6px;} .crumb a{color:var(--accent);}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);margin-right:6px;}

/* flashcard */
.fc{perspective:1200px;}
.fc .inner{border-radius:16px;border:1px solid var(--line);background:var(--surface);padding:30px;min-height:190px;display:grid;place-items:center;text-align:center;box-shadow:var(--shadow);cursor:pointer;}
.fc .q{font-size:18px;font-weight:600;} .fc .a{font-size:15px;color:var(--ink-2);margin-top:14px;}
.srs{display:flex;gap:8px;margin-top:14px;}
.srs button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 6px;font-size:12.5px;font-weight:700;}
.srs .again{color:var(--red);} .srs .hard{color:var(--gold);} .srs .good{color:var(--blue);} .srs .easy{color:var(--green);}
.progressbar{height:7px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-bottom:18px;}
.progressbar > div{height:100%;background:var(--accent);transition:width .3s;}

/* qcm */
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:9px 0;font-size:14.5px;}
.opt:hover{border-color:var(--accent);}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);}
.opt.right{border-color:var(--green);background:rgba(30,158,106,.08);}
.opt.wrong{border-color:var(--red);background:rgba(192,57,43,.07);}
.opt .mk{width:21px;height:21px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;font-size:12px;}
.opt .why{display:block;font-size:12.5px;color:var(--muted);margin-top:4px;}
.expl{font-size:13.5px;color:var(--ink-2);background:var(--surface-2);border-radius:12px;padding:13px 15px;margin-top:10px;}

/* excel grid */
.sheet{overflow:auto;border:1px solid var(--line);border-radius:12px;}
table.xl{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;min-width:100%;}
table.xl th,table.xl td{border:1px solid var(--line);padding:0;min-width:92px;height:34px;text-align:right;}
table.xl thead th,table.xl tbody th{background:var(--surface-2);color:var(--muted);font-weight:600;text-align:center;min-width:34px;width:34px;}
table.xl td .lbl{padding:6px 9px;color:var(--ink-2);text-align:left;}
table.xl td .inp{padding:6px 9px;color:var(--blue);font-weight:600;}
table.xl td.link .inp{color:var(--green);}
table.xl td input{width:100%;height:34px;border:0;background:rgba(232,116,59,.06);padding:6px 9px;text-align:right;font:inherit;color:var(--ink);outline:2px solid transparent;}
table.xl td input:focus{outline:2px solid var(--accent);}
table.xl td.ok{background:rgba(30,158,106,.12);} table.xl td.ko{background:rgba(192,57,43,.1);}
.kbdkey{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 7px;font-size:12px;background:var(--surface-2);font-weight:600;margin:0 2px;}

/* command palette */
.modal-bg{position:fixed;inset:0;background:rgba(20,16,8,.4);backdrop-filter:blur(2px);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding-top:12vh;}
.cmdk{width:560px;max-width:92vw;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.25);overflow:hidden;}
.cmdk input{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font-size:16px;background:transparent;color:var(--ink);outline:none;}
.cmdk .res{max-height:50vh;overflow:auto;padding:6px;}
.cmdk .r{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;font-size:14px;}
.cmdk .r:hover,.cmdk .r.hl{background:var(--surface-2);}
.cmdk .r .k{font-size:11px;color:var(--muted);margin-left:auto;text-transform:uppercase;letter-spacing:.05em;}
.empty{text-align:center;color:var(--muted);padding:40px 20px;}
.empty .big{font-size:34px;margin-bottom:8px;}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;z-index:80;box-shadow:var(--shadow);opacity:0;transition:.25s;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}
.toast.xp{background:linear-gradient(135deg,var(--accent),var(--gold));}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;margin:4px 6px 0 0;}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);}
.field{margin:12px 0;} .field label{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:5px;}
.field input[type=range]{width:100%;} .field select,.field input[type=number],.field input[type=text]{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--surface);color:var(--ink);font:inherit;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.modcard{display:flex;flex-direction:column;gap:8px;}
.modcard .top{display:flex;align-items:center;gap:8px;}
.modcard .lvl{font-size:11px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border-radius:6px;padding:2px 7px;}
.modcard .ttl{font-size:15.5px;font-weight:650;}
.modcard .obj{font-size:13px;color:var(--ink-2);}
.modcard .meta{font-size:12px;color:var(--muted);margin-top:auto;display:flex;gap:10px;align-items:center;}
.donebadge{color:var(--green);font-weight:700;}
.list-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}

@media(max-width:920px){
  .app{grid-template-columns:1fr;}
  .sidebar{position:fixed;z-index:50;width:248px;transform:translateX(-110%);transition:.2s;box-shadow:var(--shadow);}
  .sidebar.open{transform:none;}
  .burger{display:block;}
  .cols-3,.cols-2,.cols-2e{grid-template-columns:1fr;}
  .content{padding:18px 16px 70px;}
}
</style>
</head>
<body data-theme="light">
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <button class="burger" id="burger">☰</button>
      <div class="search" id="searchbar"><span>⌕</span><span data-t="search">Rechercher…</span><span class="kbd">⌘K</span></div>
      <div class="seg" id="langseg">
        <button data-lang="fr">FR</button><button data-lang="en">EN</button>
      </div>
      <button class="tb-btn" id="themebtn">🌙</button>
    </div>
    <div class="content" id="view"></div>
  </div>
</div>
<div id="modal-root"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   PE/IB Mastery — single-file, data-driven interview-prep platform.
   Engines: persistence, i18n, SRS (SM-2), QCM, Excel evaluator, case,
   gamification, personalization, dashboard, Cmd+K. Content is injected below.
   ========================================================================= */

/* ---------- 1. PERSISTENCE (window.storage → memory → JSON export/import) ---------- */
const Store = (function(){
  const KEY='pe_ib_platform_state_v1', VER=1;
  function memBackend(){const m=Object.create(null);return{durable:false,async get(k){return k in m?m[k]:null},async set(k,v){m[k]=v},async remove(k){delete m[k]}};}
  function wsBackend(ws){
    if(!ws||typeof ws!=='object')return null; let g,s,r;
    if(typeof ws.getItem==='function'&&typeof ws.setItem==='function'){g=k=>ws.getItem(k);s=(k,v)=>ws.setItem(k,v);r=typeof ws.removeItem==='function'?k=>ws.removeItem(k):null;}
    else if(typeof ws.get==='function'&&typeof ws.set==='function'){g=k=>ws.get(k);s=(k,v)=>ws.set(k,v);r=typeof ws.remove==='function'?k=>ws.remove(k):(typeof ws.delete==='function'?k=>ws.delete(k):null);}
    else return null;
    return{durable:true,async get(k){return await g(k)},async set(k,v){await s(k,v)},async remove(k){r?await r(k):await s(k,null)}};
  }
  const backend = wsBackend(typeof window!=='undefined'?window.storage:undefined) || memBackend();
  let cache=null, loaded=false;
  async function getState(){ if(!loaded){const raw=await backend.get(KEY); try{const o=raw==null?null:(typeof raw==='string'?JSON.parse(raw):raw); cache=o&&o.__v?o.state:o;}catch(e){cache=null;} loaded=true;} return cache; }
  async function setState(s){ cache=s;loaded=true; await backend.set(KEY,JSON.stringify({__v:VER,state:s})); return s; }
  async function exportJSON(){ return JSON.stringify({app:'pe-ib-platform',schemaVersion:VER,exportedAt:new Date().toISOString(),state:await getState()},null,2); }
  async function importJSON(t){ let p; try{p=JSON.parse(t)}catch(e){throw new Error('JSON invalide')} const inc=(p&&p.state!==undefined)?p.state:p; if(!inc||typeof inc!=='object')throw new Error('État introuvable'); return setState(inc); }
  return {getState,setState,exportJSON,importJSON,durable:backend.durable};
})();

/* ---------- 2. CONTENT (injected at build) ---------- */
const CONTENT = /*<<CONTENT>>*/{"modules":[],"flashcards":[],"qcm":[],"exercises":[],"cases":[],"glossary":[]}/*<<END>>*/;

/* ---------- 3. INDEXES ---------- */
const IDX = {
  modules:CONTENT.modules||[], flashcards:CONTENT.flashcards||[], qcm:CONTENT.qcm||[],
  exercises:CONTENT.exercises||[], cases:CONTENT.cases||[], glossary:CONTENT.glossary||[],
};
IDX.moduleById={}; IDX.modules.forEach(m=>IDX.moduleById[m.id]=m);
IDX.exerciseById={}; IDX.exercises.forEach(e=>IDX.exerciseById[e.id]=e);
IDX.caseById={}; IDX.cases.forEach(c=>IDX.caseById[c.id]=c);
IDX.glossMap={}; IDX.glossary.forEach(g=>{ const keys=[g.term].concat(g.aliases||[]); keys.forEach(k=>{ if(k) IDX.glossMap[norm(k)]=g; }); });
function norm(s){return String(s).toLowerCase().replace(/\s+/g,' ').replace(/[.,;:]+$/,'').trim();}
const TOPICS=['M&A','LBO','DCF','WACC','Valuation','LevFin','Restructuring','VC','ECM','DCM','Accounting','ProjectFinance','Excel','Markets','Fit'];
function cardsOfTopic(t){return IDX.flashcards.filter(c=>c.topic===t);}
function fcByModule(id){return IDX.flashcards.filter(c=>c.moduleId===id);}
function qcmByModule(id){return IDX.qcm.filter(q=>q.moduleId===id);}

/* ---------- 4. STATE ---------- */
let S=null, LANG='fr';
function todayStr(){return new Date().toISOString().slice(0,10);}
function defaultState(){
  return {
    schemaVersion:1,
    settings:{lang:'fr',theme:'light',dailyCardGoal:15,dailySectionGoal:1},
    profile:{selfLevel:null,diagnosticLevel:null,goals:[],weakTopics:[],onboarded:false},
    game:{xp:0,rank:'stagiaire',streak:{current:0,best:0,lastActiveDate:null},
      mastery:{}, badges:[], dailyProgress:{date:todayStr(),cards:0,sections:0}},
    srs:{}, qcmHistory:[], completedSections:[], completedExercises:[], completedCases:[],

  const m={};
  TOPICS.forEach(t=>{
    const cards=IDX.flashcards.filter(c=>c.topic===t), qs=IDX.qcm.filter(q=>q.topic===t);
    const total=cards.length+qs.length; if(!total){m[t]=0;return;}

/* ---------- 8. EXCEL ENGINE (formula evaluator) ---------- */
const XL=(function(){
  function colToNum(c){let n=0;for(let i=0;i<c.length;i++)n=n*26+(c.charCodeAt(i)-64);return n;}
  function tokenize(f){

      if(ch===' '){i++;continue;}

        else if(/^[A-Za-z]{1,3}[0-9]{1,4}$/.test(name)){t.push({t:'ref',v:name.toUpperCase()});}
        else {t.push({t:'name',v:name.toUpperCase()});}
        i=j;continue;}
      if(ch==='"'){let j=i+1;while(j<s.length&&s[j]!=='"')j++;t.push({t:'str',v:s.slice(i+1,j)});i=j+1;continue;}
      const two=s.slice(i,i+2); if(['<=','>=','<>'].includes(two)){t.push({t:'op',v:two});i+=2;continue;}
      if('+-*/^(),:&=<>%'.includes(ch)){t.push({t:'op',v:ch});i++;continue;}
      i++;
    }
    return t;
  }
  function parse(tokens){
    let p=0;
    const peek=()=>tokens[p], eat=()=>tokens[p++];
    function parseExpr(){return parseCmp();}
    function parseCmp(){let l=parseAdd();while(peek()&&peek().t==='op'&&['=','<','>','<=','>=','<>'].includes(peek().v)){const op=eat().v;const r=parseAdd();l={n:'cmp',op,l,r};}return l;}
    function parseAdd(){let l=parseMul();while(peek()&&peek().t==='op'&&['+','-','&'].includes(peek().v)){const op=eat().v;const r=parseMul();l={n:'bin',op,l,r};}return l;}
    function parseMul(){let l=parsePow();while(peek()&&peek().t==='op'&&['*','/'].includes(peek().v)){const op=eat().v;const r=parsePow();l={n:'bin',op,l,r};}return l;}
    function parsePow(){let l=parseUnary();while(peek()&&peek().t==='op'&&peek().v==='^'){eat();const r=parseUnary();l={n:'bin',op:'^',l,r};}return l;}
    function parseUnary(){if(peek()&&peek().t==='op'&&peek().v==='-'){eat();return{n:'neg',e:parseUnary()};}if(peek()&&peek().t==='op'&&peek().v==='+'){eat();return parseUnary();}return parsePost();}

    function parseAtom(){

      if(tk.t==='str'){eat();return{n:'str',v:tk.v};}
      if(tk.t==='func'){const name=eat().v;eat();/*(*/ const args=[]; if(peek()&&!(peek().t==='op'&&peek().v===')')){args.push(parseExpr());while(peek()&&peek().t==='op'&&peek().v===','){eat();args.push(parseExpr());}} if(peek()&&peek().t==='op'&&peek().v===')')eat(); return{n:'call',name,args};}
      if(tk.t==='ref'){eat(); if(peek()&&peek().t==='op'&&peek().v===':'){eat();const r2=eat();return{n:'range',a:tk.v,b:r2.v};} return{n:'ref',v:tk.v};}

    const c1=colToNum(ma[1]),c2=colToNum(mb[1]),r1=+ma[2],r2=+mb[2]; const out=[];
    for(let r=Math.min(r1,r2);r<=Math.max(r1,r2);r++)for(let c=Math.min(c1,c2);c<=Math.max(c1,c2);c++){let cc='';let n=c;while(n>0){cc=String.fromCharCode(64+((n-1)%26)+1)+cc;n=Math.floor((n-1)/26);}out.push(cc+r);}

    let flo=f(lo),fhi=f(hi); if(flo*fhi>0){ // fallback scan
      let best=null,bestAbs=Infinity; for(let r=-0.99;r<=5;r+=0.0005){const v=Math.abs(f(r));if(v<bestAbs){bestAbs=v;best=r;}} return best; }

        case 'bin':{const l=ev(a.l),r=ev(a.r); if(a.op==='&')return String(l)+String(r); const x=num(l),y=num(r); switch(a.op){case'+':return x+y;case'-':return x-y;case'*':return x*y;case'/':return y===0?'#DIV/0!':x/y;case'^':return Math.pow(x,y);}}
        case 'cmp':{const x=ev(a.l),y=ev(a.r);const nx=typeof x==='number'?x:num(x),ny=typeof y==='number'?y:num(y);switch(a.op){case'=':return x===y||nx===ny;case'<>':return!(x===y||nx===ny);case'<':return nx<ny;case'>':return nx>ny;case'<=':return nx<=ny;case'>=':return nx>=ny;}}
        case 'call':{

            case'NPV':{const rate=num(ev(A[0]));const vals=[];for(let i=1;i<A.length;i++){const v=ev(A[i]);if(Array.isArray(v))v.forEach(z=>vals.push(num(z)));else vals.push(num(v));}return npv(rate,vals);}

  // Evaluate a whole sheet: cells = {ref:{value|formula}}; returns {ref:value}
  function evalSheet(cells){
    const out={}, stack={};
    function getRef(ref){

function isModuleDone(id){ const fc=fcByModule(id); const total=(IDX.moduleById[id].content.concepts||[]).length+1; const secDone=S.completedSections.filter(s=>s.startsWith(id+'#')).length; return secDone>=total; }
function moduleProgress(id){ const m=IDX.moduleById[id]; if(!m)return 0; const total=(m.content.concepts?m.content.concepts.length:0)+1; const done=S.completedSections.filter(s=>s.startsWith(id+'#')).length; return total?Math.min(1,done/total):0; }

/* ----- Flashcard review session ----- */
function buildQueue(query){
  let pool=IDX.flashcards.slice();
  if(query.module)pool=pool.filter(c=>c.moduleId===query.module);
  if(query.topic)pool=pool.filter(c=>c.topic===query.topic);
  let due=pool.filter(c=>isDue(c.id));
  if(!due.length)due=pool.slice(0,Math.min(20,pool.length)); // free session if nothing due
  return due.sort(()=>Math.random()-0.5);
}
let SESSION=null;
function viewReview(v,query){
  if(!SESSION||SESSION.type!=='review'||SESSION.key!==JSON.stringify(query)){ SESSION={type:'review',key:JSON.stringify(query),queue:buildQueue(query),i:0,flipped:false,done:0}; }
  const s=SESSION;
  if(s.i>=s.queue.length){ return sessionDone(v,`${s.done} ${LANG==='fr'?'cartes revues':'cards reviewed'}`,'#/dashboard'); }
  const card=s.queue[s.i];
  v.innerHTML=`<div class="crumb"><a href="#/dashboard">${tt('dashboard')}</a> › ${tt('review')}</div>
  <div class="progressbar"><div style="width:${Math.round(s.i/s.queue.length*100)}%"></div></div>
  <div class="row" style="justify-content:space-between"><span class="pill">${card.topic}</span><span class="muted">${s.i+1} / ${s.queue.length}</span></div>
  <div class="fc" style="margin-top:12px"><div class="inner" id="fcInner"><div><div class="q">${renderText(card.front)}</div><div class="a" id="fcA">${s.flipped?renderText(card.back):'→ '+tt('reveal')}</div>${s.flipped?corrNote(card.correction):''}</div></div></div>
  ${s.flipped?`<div class="srs"><button class="again" data-g="0">${tt('again')}</button><button class="hard" data-g="1">${tt('hard')}</button><button class="good" data-g="2">${tt('good')}</button><button class="easy" data-g="3">${tt('easy')}</button></div>`:`<div style="margin-top:14px"><button class="btn" id="flip">${tt('reveal')}</button></div>`}`;
  const flip=()=>{s.flipped=true;render();};
  document.getElementById('fcInner').onclick=()=>{if(!s.flipped)flip();};
  if(document.getElementById('flip'))document.getElementById('flip').onclick=flip;
  v.querySelectorAll('.srs button').forEach(b=>b.onclick=()=>{reviewCard(card.id,+b.dataset.g);s.done++;s.i++;s.flipped=false;render();});
}
function sessionDone(v,msg,back){
  v.innerHTML=`<div class="card" style="text-align:center;padding:50px 20px"><div style="font-size:42px">🎉</div><h2>${tt('finishSession')}</h2><p class="muted">${msg}</p><div style="margin-top:14px"><a class="btn" href="${back}">${tt('backDash')}</a></div></div>`;
  SESSION=null;
}

function viewQcmList(v,query){
  if(query.module)return viewQuiz(v,query);
  const byTopic={}; IDX.qcm.forEach(q=>{(byTopic[q.topic]=byTopic[q.topic]||[]).push(q);});
  let h=`<div class="hello"><h1>${tt('qcm')}</h1><p>${IDX.qcm.length} ${LANG==='fr'?'questions · choisis un thème ou lance un mix':'questions · pick a topic or start a mix'}</p></div>
  <div style="margin-bottom:16px"><a class="btn" href="#/quiz?mix=1">${LANG==='fr'?'Mix aléatoire (10)':'Random mix (10)'} ▶</a></div><div class="list-grid">`;
  Object.keys(byTopic).forEach(t=>{h+=`<a class="card modcard" href="#/quiz?topic=${encodeURIComponent(t)}"><div class="top"><span class="tag">${t}</span></div><div class="ttl">${t}</div><div class="meta"><span>${byTopic[t].length} QCM</span></div></a>`;});
  v.innerHTML=h+`</div>`;

function viewQuiz(v,query){
  if(!SESSION||SESSION.type!=='quiz'||SESSION.key!==JSON.stringify(query)){
    let pool=IDX.qcm.slice();
    if(query.module)pool=pool.filter(q=>q.moduleId===query.module);
    else if(query.topic)pool=pool.filter(q=>q.topic===query.topic);
    if(query.mix)pool=pool.sort(()=>Math.random()-0.5).slice(0,10);
    SESSION={type:'quiz',key:JSON.stringify(query),queue:pool.sort(()=>Math.random()-0.5),i:0,sel:[],answered:false,correct:0};
  }
  const s=SESSION;
  if(s.i>=s.queue.length){ if(s.queue.length&&s.correct===s.queue.length)awardBadge('perfect_qcm'); return sessionDone(v,`${s.correct} / ${s.queue.length} ${LANG==='fr'?'bonnes réponses':'correct'}`,'#/qcm'); }
  const q=s.queue[s.i];
  v.innerHTML=`<div class="crumb"><a href="#/qcm">${tt('qcm')}</a> › ${q.topic}</div>
  <div class="progressbar"><div style="width:${Math.round(s.i/s.queue.length*100)}%"></div></div>
  <div class="row" style="justify-content:space-between"><span class="pill">${q.topic}</span><span class="muted">${s.i+1} / ${s.queue.length}</span></div>
  <div class="card" style="margin-top:12px"><div style="font-size:16.5px;font-weight:600;margin-bottom:6px">${renderText(q.stem)}</div>${q.multi?`<div class="muted" style="margin-bottom:6px">${LANG==='fr'?'(plusieurs réponses possibles)':'(multiple answers)'}</div>`:''}
  <div id="opts">${q.options.map(o=>{let cls='opt';if(s.answered){if(o.correct)cls+=' right';else if(s.sel.includes(o.id))cls+=' wrong';}else if(s.sel.includes(o.id))cls+=' sel';return `<div class="${cls}" data-id="${o.id}"><span class="mk">${s.answered?(o.correct?'✓':(s.sel.includes(o.id)?'✕':'')):''}</span><span>${renderText(o.text)}${s.answered&&o.why?`<span class="why">${renderText(o.why)}</span>`:''}</span></div>`;}).join('')}</div>
  ${s.answered?`<div class="expl"><b>${LANG==='fr'?'Explication':'Explanation'}.</b> ${renderText(q.explanation)}${q.workings?`<br><br><b>${LANG==='fr'?'Calcul':'Working'} :</b> ${renderText(q.workings)}`:''}</div>${corrNote(q.correction)}
  <div style="margin-top:12px"><button class="btn" id="nextq">${tt('next')} →</button></div>`:`<div style="margin-top:12px"><button class="btn" id="validate" disabled>${tt('check')}</button></div>`}</div>`;
  if(!s.answered){
    v.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{const id=el.dataset.id;if(q.multi){s.sel.includes(id)?s.sel=s.sel.filter(x=>x!==id):s.sel.push(id);}else s.sel=[id];render();});
    const val=document.getElementById('validate'); if(s.sel.length)val.disabled=false;
    val.onclick=()=>{s.answered=true;const correctIds=q.options.filter(o=>o.correct).map(o=>o.id).sort();const ok=JSON.stringify(s.sel.slice().sort())===JSON.stringify(correctIds);S.qcmHistory.push({qcmId:q.id,correct:ok,at:new Date().toISOString()});if(ok){s.correct++;S.counters.correctQcm++;tickActivity();addXP(15,LANG==='fr'?'bonne réponse':'correct');}recomputeMastery();save();render();};
  } else { document.getElementById('nextq').onclick=()=>{s.i++;s.sel=[];s.answered=false;render();}; }
}

function colName(n){let c='';while(n>0){c=String.fromCharCode(64+((n-1)%26)+1)+c;n=Math.floor((n-1)/26);}return c;}
function viewExercise(v,id){
  const e=IDX.exerciseById[id]; if(!e){v.innerHTML=`<div class="card">${tt('empty')}</div>`;return;}
  if(!SESSION||SESSION.type!=='xl'||SESSION.id!==id){ SESSION={type:'xl',id,inputs:{},checked:false,revealed:false}; }
  const s=SESSION; const g=e.grid||{rows:1,cols:1,cells:{}};
  // header
  let h=`<div class="crumb"><a href="#/excel">${tt('excel')}</a> › ${e.topic}</div>
  <div class="hello"><div class="row"><span class="pill">N${e.level}</span><span class="pill">${e.topic}</span>${flagBadge(e.source)}</div><h1 style="font-size:20px">${renderText(e.prompt)}</h1></div>`;
  // grid
  h+=`<div class="card"><div class="sheet"><table class="xl"><thead><tr><th></th>${Array.from({length:g.cols},(_,c)=>`<th>${colName(c+1)}</th>`).join('')}</tr></thead><tbody>`;
  for(let r=1;r<=g.rows;r++){ h+=`<tr><th>${r}</th>`;
    for(let c=1;c<=g.cols;c++){ const ref=colName(c)+r; const cell=g.cells[ref];
      if(!cell){h+=`<td></td>`;continue;}
      if(cell.role==='label'){h+=`<td><div class="lbl">${esc(cell.label||L(cell.label)||'')}</div></td>`;}
      else if(cell.role==='input'||cell.role==='link'){h+=`<td class="${cell.role==='link'?'link':''}"><div class="inp">${fmtNum(cell.value,cell.numFmt)}</div></td>`;}
      else if(cell.role==='formula'){const val=s.inputs[ref]!==undefined?s.inputs[ref]:'';const status=s.checked?(checkOk(e,ref,s)?'ok':'ko'):'';h+=`<td class="${status}"><input data-ref="${ref}" value="${esc(val)}" placeholder="=…" autocomplete="off"></td>`;}
      else if(cell.role==='check'){h+=`<td><div class="lbl" style="color:var(--red)">${esc(cell.label||'')}</div></td>`;}
      else h+=`<td></td>`;
    } h+=`</tr>`;
  }
  h+=`</tbody></table></div>
  <div class="row" style="margin-top:14px"><button class="btn" id="xlcheck">${tt('check')}</button><button class="btn ghost" id="xlreveal">${tt('solution')}</button></div>`;

  if(s.revealed){ h+=`<div class="card prose" style="margin-top:12px"><h4>${LANG==='fr'?'Corrigé':'Solution'}</h4>${prose(e.solution)}<div class="muted" style="margin-top:8px">${Object.keys(g.cells).filter(k=>g.cells[k].role==='formula').map(k=>`<code>${k}</code> = <code>${esc(g.cells[k].formula||'')}</code>`).join(' &nbsp; ')}</div></div>`; }

function buildEvalCells(e,s){ const g=e.grid; const cells={}; Object.keys(g.cells).forEach(ref=>{const c=g.cells[ref]; if(c.role==='input'||c.role==='link')cells[ref]={value:c.value}; else if(c.role==='formula'){const f=s.inputs[ref]; cells[ref]= (f&&f[0]==='=')?{formula:f}:(f!==undefined&&f!==''?{value:isNaN(+f)?f:+f}:{value:0}); }}); return cells; }
function checkResult(e,ck,s){ const cells=buildEvalCells(e,s); const out=XL.evalSheet(cells); let got=out[ck.cell]; const ok=typeof got==='number'&&Math.abs(got-ck.expected)<=(ck.tolerance||0.01); return {ok,got}; }
function checkOk(e,ref,s){ const ck=(e.checks||[]).find(c=>c.cell===ref); if(!ck)return true; return checkResult(e,ck,s).ok; }
function fmtNum(v,fmt){ if(v===''||v===undefined||v===null)return''; if(typeof v!=='number'){return esc(String(v));} if(fmt&&fmt.indexOf('%')>=0)return (v*100).toFixed(fmt.indexOf('0.0')>=0?1:0)+'%'; if(fmt&&fmt.indexOf('x')>=0)return v.toFixed(1)+'x'; if(fmt&&fmt.indexOf('#,##0')>=0)return Math.round(v).toLocaleString('fr-FR'); return (Math.round(v*100)/100).toLocaleString('fr-FR'); }

  <div class="card"><h3>${LANG==='fr'?'Préférences':'Preferences'}</h3>
   <div class="field"><label>${LANG==='fr'?'Objectif quotidien (cartes)':'Daily goal (cards)'}</label><input type="number" id="setgoal" min="5" max="100" value="${S.settings.dailyCardGoal}"></div>
   <div class="row"><span class="muted">${LANG==='fr'?'Persistance':'Persistence'} : <b>${Store.durable?(LANG==='fr'?'durable (window.storage)':'durable (window.storage)'):(LANG==='fr'?'mémoire (utilise l’export)':'memory (use export)')}</b></span></div>
  </div>
  <div class="card"><h3>${LANG==='fr'?'Données & portabilité':'Data & portability'}</h3><p class="cap">${LANG==='fr'?'Exporte ta progression en JSON, ou importe-la sur une autre machine.':'Export your progress as JSON, or import it on another machine.'}</p>
   <div class="row"><button class="btn ghost" id="exp">⬇ ${LANG==='fr'?'Exporter':'Export'}</button><button class="btn ghost" id="imp">⬆ ${LANG==='fr'?'Importer':'Import'}</button><button class="btn ghost" id="rst" style="color:var(--red)">${LANG==='fr'?'Réinitialiser':'Reset'}</button></div>
   <div class="field" style="margin-top:12px"><textarea id="io" style="width:100%;min-height:120px;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:ui-monospace,monospace;font-size:12px;background:var(--surface)"></textarea></div>
  </div>`;
  document.getElementById('setgoal').onchange=e=>{S.settings.dailyCardGoal=Math.max(5,+e.target.value||15);save();};
  document.getElementById('exp').onclick=async()=>{document.getElementById('io').value=await Store.exportJSON();toast(LANG==='fr'?'Exporté ci-dessous':'Exported below');};
  document.getElementById('imp').onclick=async()=>{try{await Store.importJSON(document.getElementById('io').value);await loadState();toast(LANG==='fr'?'Import réussi':'Imported');render();}catch(e){toast('⚠ '+e.message);}};
  document.getElementById('rst').onclick=async()=>{if(confirm(LANG==='fr'?'Tout réinitialiser ?':'Reset everything?')){S=defaultState();await Store.setState(S);LANG=S.settings.lang;applyTheme();render();}};
}

/* ---------- 12. Cmd+K ---------- */
function openCmdK(){
  modal(`<div class="cmdk" onclick="event.stopPropagation()"><input id="cmdkin" placeholder="${tt('search')}" autocomplete="off"><div class="res" id="cmdkres"></div></div>`,true);
  const inp=document.getElementById('cmdkin'); inp.focus(); let hl=0,results=[];
  function search(q){
    q=q.toLowerCase().trim(); results=[];
    if(!q){results=[{t:tt('dashboard'),h:'#/dashboard',k:'nav'},{t:tt('review'),h:'#/review',k:'nav'},{t:tt('generate'),h:'#/generate',k:'nav'},{t:tt('glossary'),h:'#/glossary',k:'nav'}];}
    else{
      IDX.modules.forEach(m=>{if(norm(L(m.title)).includes(q))results.push({t:L(m.title),h:'#/module/'+m.id,k:'module'});});
      IDX.glossary.forEach(g=>{if(norm(g.term).includes(q)||(g.aliases||[]).some(a=>norm(a).includes(q)))results.push({t:g.term+' — '+L(g.definition).slice(0,50)+'…',h:'#/glossary?q='+encodeURIComponent(g.term),k:'terme'});});
      IDX.flashcards.forEach(c=>{if(norm(L(c.front)).includes(q))results.push({t:L(c.front),h:'#/review?module='+c.moduleId,k:'carte'});});
      IDX.qcm.forEach(c=>{if(norm(L(c.stem)).includes(q))results.push({t:L(c.stem),h:'#/quiz?module='+c.moduleId,k:'QCM'});});
      results=results.slice(0,20);
    }
    hl=0;draw();
  }
  function draw(){document.getElementById('cmdkres').innerHTML=results.length?results.map((r,i)=>`<div class="r ${i===hl?'hl':''}" data-i="${i}"><span>${esc(r.t).slice(0,70)}</span><span class="k">${r.k}</span></div>`).join(''):`<div class="empty">${tt('empty')}</div>`;
    document.querySelectorAll('#cmdkres .r').forEach(el=>el.onclick=()=>{go(results[+el.dataset.i].h);closeModal();});}
  inp.oninput=()=>search(inp.value);
  inp.onkeydown=e=>{if(e.key==='ArrowDown'){hl=Math.min(results.length-1,hl+1);draw();e.preventDefault();}else if(e.key==='ArrowUp'){hl=Math.max(0,hl-1);draw();e.preventDefault();}else if(e.key==='Enter'){if(results[hl]){go(results[hl].h);closeModal();}}else if(e.key==='Escape')closeModal();};
  search('');
}

/* ---------- 13. MODAL / TOAST / THEME / LANG ---------- */
function modal(html,bareForCmdk){const root=document.getElementById('modal-root');root.innerHTML=`<div class="modal-bg" id="mbg">${bareForCmdk?html:`<div class="card" style="max-width:480px;width:92vw" onclick="event.stopPropagation()">${html}</div>`}</div>`;document.getElementById('mbg').onclick=closeModal;}
function closeModal(){document.getElementById('modal-root').innerHTML='';}
let toastTimer=null;
function toast(msg,cls){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show'+(cls?' '+cls:'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.className='toast',1900);}
function applyTheme(){document.body.dataset.theme=S.settings.theme;document.getElementById('themebtn').textContent=S.settings.theme==='dark'?'☀️':'🌙';document.documentElement.lang=LANG;document.querySelectorAll('#langseg button').forEach(b=>b.classList.toggle('on',b.dataset.lang===LANG));document.querySelectorAll('[data-t]').forEach(el=>el.textContent=tt(el.dataset.t));}

/* ---------- 14. BOOT ---------- */
(async function boot(){
  await loadState(); recomputeMastery(); applyTheme();
  document.getElementById('themebtn').onclick=()=>{S.settings.theme=S.settings.theme==='dark'?'light':'dark';applyTheme();save();};
  document.getElementById('langseg').onclick=e=>{const b=e.target.closest('button');if(!b)return;LANG=b.dataset.lang;S.settings.lang=LANG;applyTheme();save();render();};
  document.getElementById('burger').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('searchbar').onclick=openCmdK;
  window.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCmdK();}});
  window.addEventListener('hashchange',render);
  render();
})();
</script>
