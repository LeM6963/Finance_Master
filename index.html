ed and a debt maturity wall (senior bullet) in 12 months. The sponsor hires a debtor advisor; a special situations fund has accumulated unsecured debt on the secondary market. All figures are illustrative."},"data":[{"caption":{"fr":"Structure de capital (M€)","en":"Capital structure (€m)"},"columns":["Tranche","Montant","Taux/Terme"],"rows":[["Senior secured (bullet 12m)",100,"E+450bps"],["Unsecured (mezz/bonds)",60,"10%"],["Dette nette totale",165,"5,5x EBITDA"],["EBITDA",30,"vs 38 au closing"]]}],"stages":[{"prompt":{"fr":"Étape 1 — Diagnostic : posez le levier, identifiez le covenant brisé et le mur de dette.","en":"Stage 1 — Diagnosis: state the leverage, identify the breached covenant and the maturity wall."},"guidedQuestions":[{"fr":"Quel est le levier net actuel ?","en":"What is the current net leverage?"},{"fr":"Le covenant de 4,5x est-il respecté ?","en":"Is the 4.5x covenant respected?"}],"reveal":{"fr":"Levier net = 165 / 30 = 5,5x, au-dessus du covenant de 4,5x : il y a [[covenant breach]]. Pire, la tranche senior secured de 100 M€ est un bullet remboursable dans 12 mois (le [[maturity wall]]) sans cash ni refinancement disponible. La société est techniquement en défaut de covenant et face à un risque imminent de cessation des paiements.","en":"Net leverage = 165 / 30 = 5.5x, above the 4.5x covenant: there is a [[covenant breach]]. Worse, the €100m senior secured tranche is a bullet repayable in 12 months (the [[maturity wall]]) with no cash or refinancing available. The company is technically in covenant default and faces imminent payment-default risk."}},{"prompt":{"fr":"Étape 2 — Options : comparez rééchelonnement, conversion dette/equity et cession.","en":"Stage 2 — Options: compare rescheduling, debt/equity conversion and a sale."},"guidedQuestions":[{"fr":"Quelle option préserve le mieux la valeur en continuité ?","en":"Which option best preserves going-concern value?"}],"reveal":{"fr":"Trois voies : (1) Rééchelonnement (amend & extend) — repousser le bullet et obtenir un waiver de covenant, simple mais ne réduit pas le levier ; (2) [[debt-to-equity swap]] — les créanciers unsecured convertissent en equity, désendettant à ~3,3x (100/30), au prix de la dilution/effacement du sponsor ; (3) [[plan de cession]] — vendre l'activité, libre de passif, mais avec décote distressed. La conversion préserve le mieux la going-concern value tout en restaurant la solvabilité.","en":"Three routes: (1) Rescheduling (amend & extend) — push out the bullet and get a covenant waiver, simple but does not cut leverage; (2) [[debt-to-equity swap]] — unsecured creditors convert to equity, deleveraging to ~3.3x (100/30), at the cost of sponsor dilution/wipeout; (3) [[plan de cession]] — sell the business free of liabilities, but at a distressed discount. Conversion best preserves going-concern value while restoring solvency."}},{"prompt":{"fr":"Étape 3 — Valeur de référence : estimez going-concern value et valeur de liquidation.","en":"Stage 3 — Reference value: estimate going-concern value and liquidation value."},"guidedQuestions":[{"fr":"À 4,0x d'EBITDA, quelle EV en continuité ?","en":"At 4.0x EBITDA, what is the going-concern EV?"},{"fr":"La liquidation couvre-t-elle l'unsecured ?","en":"Does liquidation cover the unsecured?"}],"reveal":{"fr":"Going-concern : EV ≈ 30 × 4,0 = 120 M€ (multiple déprimé reflétant le distressed). Valeur de liquidation des actifs : ≈ 90 M€ (vente morcelée d'un actif industriel, décote forte). La [[liquidation value]] (90) est inférieure à l'EV en continuité (120) : il y a une prime de continuité de 30 M€ à préserver, ce qui justifie une réorganisation plutôt qu'une liquidation.","en":"Going-concern: EV ≈ 30 × 4.0 = €120m (depressed multiple reflecting distress). Asset liquidation value: ≈ €90m (piecemeal sale of an industrial asset, heavy discount). [[liquidation value]] (90) is below going-concern EV (120): there is a €30m going-concern premium to preserve, justifying reorganisation over liquidation."}},{"prompt":{"fr":"Étape 4 — Waterfall de recouvrement par tranche sur la base de l'EV en continuité (120 M€).","en":"Stage 4 — Recovery waterfall by tranche on going-concern EV (€120m)."},"guidedQuestions":[{"fr":"Quel recouvrement pour le senior, l'unsecured, le sponsor ?","en":"What recovery for senior, unsecured, sponsor?"},{"fr":"Quelle est la fulcrum security ?","en":"Which is the fulcrum security?"}],"reveal":{"fr":"Sur 120 M€ disponibles : senior secured (100) servi à 100% → reste 20 ; unsecured (60) reçoit 20, soit 33% de recouvrement → c'est la [[fulcrum security]] ; equity sponsor : 0 (effacé). L'unsecured, partiellement remboursé, est le point de rupture qui capte l'equity de la newco dans une conversion.","en":"On €120m available: senior secured (100) paid 100% → 20 left; unsecured (60) gets 20, a 33% recovery → it is the [[fulcrum security]]; sponsor equity: 0 (wiped out). The unsecured, partially repaid, is the break point that captures newco equity in a conversion."}},{"prompt":{"fr":"Étape 5 — Issue : structurez la conversion et le loan-to-own du fonds special situations.","en":"Stage 5 — Outcome: structure the conversion and the special situations fund's loan-to-own."},"guidedQuestions":[{"fr":"Combien le fonds gagne-t-il s'il a acheté l'unsecured à 35 cents ?","en":"How much does the fund make if it bought the unsecured at 35 cents?"}],"reveal":{"fr":"Le senior est étendu (amend & extend) ; l'unsecured (fulcrum) est converti en 100% de l'equity de la newco désendettée. Le fonds [[loan-to-own]] avait acheté les 60 M€ d'unsecured à 35 cents (21 M€ déboursés) et détient désormais une equity valant ≈ 20 M€ de valeur de recouvrement immédiate mais surtout l'intégralité du capital d'une société recapitalisée à 3,3x : à mesure que l'EBITDA se redresse vers 38 M€, l'EV remonte vers 150 M€, l'equity créée dépassant largement les 21 M€ investis (MoM cible > 2x). Le sponsor historique est effacé. Issue : réorganisation par conversion, contrôle au créancier devenu actionnaire.","en":"Senior is extended (amend & extend); the unsecured (fulcrum) is converted into 100% of the deleveraged newco's equity. The [[loan-to-own]] fund had bought the €60m unsecured at 35 cents (€21m disbursed) and now holds equity worth ≈ €20m of immediate recovery value but, crucially, the entire capital of a company recapitalised at 3.3x: as EBITDA recovers toward €38m, EV rises toward €150m, with created equity far exceeding the €21m invested (target MoM > 2x). The legacy sponsor is wiped out. Outcome: reorganisation by conversion, control passing to the creditor-turned-shareholder."}}]},{"id":"case.p2p","type":"caseStudy","level":5,"topic":"M&A","tags":["take-private","P2P","LBO","OPA","squeeze-out"],"difficulty":5,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"title":{"fr":"Take-private européen d'un éditeur de logiciels coté","en":"European take-private of a listed software vendor"},"dealType":"public-to-private","realDeal":false,"scenario":{"fr":"Un fonds mid-cap européen (style Bridgepoint/EQT) vise « NordSoft SA », éditeur de logiciels B2B coté à Paris. Capitalisation 1,5 Md€ (75 M actions à 20 €), dette nette 0,3 Md€, EBITDA 0,18 Md€. Le fondateur et un family office détiennent ensemble 28% du capital. Le fonds prépare un [[take-private]] financé en [[LBO]], avec l'objectif de retirer la société de la cote, accélérer un build-up et sortir à 5 ans. Tous les chiffres sont pédagogiques.","en":"A European mid-cap fund (Bridgepoint/EQT style) targets 'NordSoft SA', a B2B software vendor listed in Paris. Market cap EUR 1.5bn (75m shares at EUR 20), net debt EUR 0.3bn, EBITDA EUR 0.18bn. The founder and a family office together hold 28% of capital. The fund prepares an [[LBO]]-financed [[take-private]], aiming to delist the company, accelerate a build-up and exit in 5 years. All figures are illustrative."},"data":[{"caption":{"fr":"Données de la cible","en":"Target data"},"columns":["Poste","Valeur"],"rows":[["Actions","75 M"],["Cours non affecté","20 €"],["Capitalisation","1,5 Md€"],["Dette nette","0,3 Md€"],["EBITDA","0,18 Md€"],["Bloc fondateur + family office","28%"]]}],"stages":[{"prompt":{"fr":"Étape 1 — Prix d'offre. Le fonds vise une prime de 30% sur le cours non affecté. Calculez le prix par action, l'equity value et l'[[Enterprise Value]] de l'offre.","en":"Stage 1 — Offer price. The fund targets a 30% premium over the unaffected price. Compute the price per share, equity value and offer [[Enterprise Value]]."},"guidedQuestions":[{"fr":"Sur quel cours applique-t-on la prime ?","en":"On which price is the premium applied?"},{"fr":"Comment passe-t-on de l'equity value à l'EV ?","en":"How do you move from equity value to EV?"}],"reveal":{"fr":"Prix d'offre = 20 € × 1,30 = 26 €/action. Equity value = 26 € × 75 M = 1,95 Md€. EV = 1,95 + 0,3 (dette nette) = 2,25 Md€. Multiple d'entrée = 2,25 / 0,18 ≈ 12,5x EBITDA — cohérent pour un éditeur de logiciels de qualité.","en":"Offer price = EUR 20 × 1.30 = EUR 26/share. Equity value = EUR 26 × 75m = EUR 1.95bn. EV = 1.95 + 0.3 (net debt) = EUR 2.25bn. Entry multiple = 2.25 / 0.18 ≈ 12.5x EBITDA — consistent for a quality software vendor."}},{"prompt":{"fr":"Étape 2 — Sécurisation. Avant l'annonce, que négocie le fonds avec le fondateur et le family office, et pourquoi est-ce déterminant ?","en":"Stage 2 — Locking up. Before announcement, what does the fund negotiate with the founder and the family office, and why is it decisive?"},"guidedQuestions":[{"fr":"Quel instrument verrouille leur soutien ?","en":"Which instrument locks in their support?"},{"fr":"Quel signal cela envoie-t-il au marché ?","en":"What signal does it send to the market?"}],"reveal":{"fr":"Le fonds obtient des [[engagements irrévocables]] (irrevocables) du fondateur et du family office sur leurs 28%. Combinés à une [[fairness opinion]] indépendante mandatée par le board, ils sécurisent un socle solide, dé-risquent l'atteinte du seuil et réduisent fortement la probabilité d'une contre-offre.","en":"The fund secures [[irrevocable undertakings]] from the founder and family office on their 28%. Combined with an independent [[fairness opinion]] mandated by the board, they lock in a solid base, de-risk reaching the threshold and sharply lower the probability of a counter-bid."}},{"prompt":{"fr":"Étape 3 — Financement LBO. Structurez le financement de l'EV de 2,25 Md€ via un [[bidco]], en respectant la condition de certain funds.","en":"Stage 3 — LBO financing. Structure the financing of the EUR 2.25bn EV via a [[bidco]], respecting the certain funds condition."},"guidedQuestions":[{"fr":"Quel levier sur EBITDA est réaliste ?","en":"What leverage on EBITDA is realistic?"},{"fr":"Pourquoi le financement doit-il être committé avant l'offre ?","en":"Why must financing be committed before the offer?"}],"reveal":{"fr":"Levier ≈ 5,5x EBITDA → dette d'acquisition ≈ 1,0 Md€ ([[unitranche]] ou TLB + RCF). Equity du fonds ≈ 2,25 − 1,0 = 1,25 Md€ (incluant un possible roll-over du fondateur). Le financement est souscrit via un [[bidco]] et doit être committé (certain funds) avant le lancement : le régulateur l'exige pour garantir la certitude de paiement aux actionnaires.","en":"Leverage ≈ 5.5x EBITDA → acquisition debt ≈ EUR 1.0bn ([[unitranche]] or TLB + RCF). Fund equity ≈ 2.25 − 1.0 = EUR 1.25bn (including a possible founder roll-over). Financing is drawn through a [[bidco]] and must be committed (certain funds) before launch: the regulator requires it to guarantee payment certainty to shareholders."}},{"prompt":{"fr":"Étape 4 — Structure de l'offre et contrôle total. Quel mécanisme choisir et comment atteindre 100% ?","en":"Stage 4 — Offer structure and full control. Which mechanism to choose and how to reach 100%?"},"guidedQuestions":[{"fr":"OPA ou scheme ? La cible est française.","en":"Tender offer or scheme? The target is French."},{"fr":"Quel seuil déclenche le retrait obligatoire ?","en":"Which threshold triggers the mandatory buyout?"}],"reveal":{"fr":"Cible française cotée à Paris → [[OPA]] sous l'égide de l'[[AMF]]. L'offre vise ≥90% du capital et des droits de vote ; les 28% d'irrévocables y contribuent fortement. Une fois ≥90% atteint, le fonds lance un [[squeeze-out]] (retrait obligatoire) rachetant les minoritaires résiduels à 26 €, atteint 100% et radie le titre. (Un scheme à ≈75% homologué serait l'équivalent en droit anglais, mais ne s'applique pas ici.)","en":"French target listed in Paris → [[OPA]] (tender offer) under the [[AMF]]. The offer aims for ≥90% of capital and voting rights; the 28% irrevocables strongly help. Once ≥90% is reached, the fund launches a [[squeeze-out]] (mandatory buyout) acquiring residual minorities at EUR 26, reaches 100% and delists. (A ~75% sanctioned scheme would be the English-law equivalent, but does not apply here.)"}},{"prompt":{"fr":"Étape 5 — Sortie à 5 ans. Avec un build-up portant l'EBITDA à 0,30 Md€ et une sortie à 13x, estimez le [[MoM]] sur l'equity du fonds.","en":"Stage 5 — Exit in 5 years. With a build-up lifting EBITDA to EUR 0.30bn and a 13x exit, estimate the [[MoM]] on fund equity."},"guidedQuestions":[{"fr":"Quelle EV de sortie ?","en":"What exit EV?"},{"fr":"Quelle dette nette de sortie après désendettement ?","en":"What exit net debt after deleveraging?"}],"reveal":{"fr":"EV de sortie = 13x × 0,30 = 3,9 Md€. Dette nette de sortie ≈ 0,6 Md€ (1,0 Md€ initial + ≈0,4 Md€ tirés pour les bolt-ons − ≈0,8 Md€ de cash-flow de désendettement). Equity de sortie = 3,9 − 0,6 = 3,3 Md€. MoM = 3,3 / 1,25 ≈ 2,6x sur 5 ans, soit un IRR ≈ 2,6^(1/5) − 1 ≈ 21%. La création de valeur combine croissance d'EBITDA (build-up + organique), re-rating modéré (12,5x → 13x) et désendettement.","en":"Exit EV = 13x × 0.30 = EUR 3.9bn. Exit net debt ≈ EUR 0.6bn (EUR 1.0bn initial + ~EUR 0.4bn drawn for bolt-ons − ~EUR 0.8bn deleveraging cash flow). Exit equity = 3.9 − 0.6 = EUR 3.3bn. MoM = 3.3 / 1.25 ≈ 2.6x over 5 years, i.e. an IRR ≈ 2.6^(1/5) − 1 ≈ 21%. Value creation combines EBITDA growth (build-up + organic), modest re-rating (12.5x → 13x) and deleveraging."}}]},{"id":"case.ipo","type":"caseStudy","level":5,"topic":"ECM","tags":["IPO","ECM","valuation","greenshoe"],"difficulty":5,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"realDeal":false,"title":{"fr":"IPO d'un éditeur de logiciels européen sur Euronext Paris","en":"IPO of a European software company on Euronext Paris"},"dealType":"IPO","scenario":{"fr":"« NovaSoft », éditeur de logiciels B2B français détenu à 70 % par un fonds de PE européen (de type Eurazeo/Bridgepoint), prépare son introduction en bourse sur Euronext Paris. CA 200 M€, EBITDA 50 M€, dette nette 100 M€, croissance ~15 %/an. Le sponsor veut monétiser une partie de sa participation tout en laissant la société lever de l'argent neuf pour son désendettement. Vous êtes à l'ECM desk d'une banque [[bookrunner]]. Tous les chiffres sont EXEMPLE_PEDAGOGIQUE.","en":"'NovaSoft', a French B2B software company 70%-owned by a European PE fund (Eurazeo/Bridgepoint-type), is preparing its IPO on Euronext Paris. Revenue €200m, EBITDA €50m, net debt €100m, growth ~15%/year. The sponsor wants to monetise part of its stake while letting the company raise fresh money to deleverage. You sit on a [[bookrunner]] ECM desk. All figures are EXEMPLE_PEDAGOGIQUE."},"data":[{"caption":{"fr":"Données financières (M€)","en":"Financials (€m)"},"columns":["Poste","Valeur"],"rows":[["CA","200"],["EBITDA","50"],["Dette nette","100"],["Croissance","~15%"]]},{"caption":{"fr":"Comparables boursiers (EV/EBITDA)","en":"Trading comps (EV/EBITDA)"},"columns":["Pair","Multiple"],"rows":[["SaaS A","14x"],["SaaS B","16x"],["Médiane","15x"]]}],"stages":[{"prompt":{"fr":"Étape 1 — Valorisation. Estimez l'Enterprise Value et l'equity value de NovaSoft via les comparables boursiers, puis confrontez à un DCF.","en":"Stage 1 — Valuation. Estimate NovaSoft's Enterprise Value and equity value via trading comps, then cross-check with a DCF."},"guidedQuestions":[{"fr":"Quel multiple EV/EBITDA appliquer et pourquoi ?","en":"Which EV/EBITDA multiple to apply and why?"},{"fr":"Comment passe-t-on de l'EV à l'equity value ?","en":"How do you go from EV to equity value?"}],"reveal":{"fr":"Médiane des comps = 15x EBITDA. EV = 15 × 50 = 750 M€. Equity value = EV − dette nette = 750 − 100 = 650 M€. Un DCF (croissance ~15 %, WACC ~10 % APPROXIMATE) donnerait un ordre de grandeur cohérent, disons 620–700 M€, validant la fourchette. On retient une equity value de référence ~650 M€.","en":"Comps median = 15x EBITDA. EV = 15 × 50 = €750m. Equity value = EV − net debt = 750 − 100 = €650m. A DCF (growth ~15%, WACC ~10% APPROXIMATE) would yield a consistent magnitude, say €620–700m, validating the range. We anchor a reference equity value of ~€650m."}},{"prompt":{"fr":"Étape 2 — Fourchette de prix. La société émettra 32,5 millions d'actions au total. Déduisez une fourchette de prix par action.","en":"Stage 2 — Price range. The company will have 32.5 million shares in total. Derive a per-share price range."},"guidedQuestions":[{"fr":"Prix central = equity value / nombre d'actions ?","en":"Central price = equity value / number of shares?"},{"fr":"Pourquoi proposer une fourchette plutôt qu'un prix unique ?","en":"Why propose a range rather than a single price?"}],"reveal":{"fr":"Prix central = 650 M€ / 32,5 M actions = 20 €/action. On propose une fourchette indicative de ~18–22 € pour laisser le [[bookbuilding]] fixer le prix selon la demande. Les bornes encadrent ±10 % autour du point central.","en":"Central price = €650m / 32.5m shares = €20/share. We propose an indicative range of ~€18–22 to let [[bookbuilding]] set the price based on demand. The bounds bracket ±10% around the central point."}},{"prompt":{"fr":"Étape 3 — Taille et structure de l'offre. On offre 30 % du capital, dont 50 % primaire et 50 % secondaire. Dimensionnez les tranches au point central.","en":"Stage 3 — Size and structure. 30% of capital is offered, split 50% primary / 50% secondary. Size the tranches at the central price."},"guidedQuestions":[{"fr":"Qui reçoit le produit de chaque tranche ?","en":"Who receives the proceeds of each tranche?"},{"fr":"Quel effet la tranche primaire a-t-elle sur la dette nette ?","en":"What effect does the primary tranche have on net debt?"}],"reveal":{"fr":"Offre de base = 30 % × 650 = 195 M€. Primaire = 97,5 M€ (vers NovaSoft, qui réduit sa dette nette de 100 à ~2,5 M€) ; secondaire = 97,5 M€ (vers le sponsor PE). Le [[free float]] post-IPO atteint ~30 %, au-dessus du minimum Euronext (~25 % APPROXIMATE).","en":"Base offer = 30% × 650 = €195m. Primary = €97.5m (to NovaSoft, cutting net debt from 100 to ~€2.5m); secondary = €97.5m (to the PE sponsor). Post-IPO [[free float]] reaches ~30%, above the Euronext minimum (~25% APPROXIMATE)."}},{"prompt":{"fr":"Étape 4 — Greenshoe et lock-up. Ajoutez une option de surallocation de 15 % et précisez les engagements de lock-up.","en":"Stage 4 — Greenshoe and lock-up. Add a 15% over-allotment option and specify lock-up undertakings."},"guidedQuestions":[{"fr":"Quelle taille maximale l'offre peut-elle atteindre ?","en":"What maximum size can the offer reach?"},{"fr":"À quoi sert le lock-up pour le sponsor PE ?","en":"What is the lock-up for regarding the PE sponsor?"}],"reveal":{"fr":"[[greenshoe]] = 15 % × 195 = ~29 M€, portant la taille maximale à ~224 M€. Le syndicat survend puis stabilise le titre les premiers jours. Le sponsor et le management acceptent un [[lock-up]] de ~180 jours APPROXIMATE pour rassurer le marché sur l'absence de cession soudaine après l'IPO.","en":"[[greenshoe]] = 15% × 195 = ~€29m, lifting the maximum size to ~€224m. The syndicate over-sells then stabilises the stock in the first days. The sponsor and management accept a ~180-day [[lock-up]] APPROXIMATE to reassure the market that no sudden sale will follow the IPO."}},{"prompt":{"fr":"Étape 5 — Pricing et allocation. Le livre est sursouscrit 4x avec une majorité d'investisseurs long-only. Fixez le prix d'offre et expliquez l'allocation.","en":"Stage 5 — Pricing and allocation. The book is 4x oversubscribed with a majority of long-only investors. Set the offer price and explain allocation."},"guidedQuestions":[{"fr":"Faut-il fixer le prix en haut de fourchette ?","en":"Should the price be set at the top of the range?"},{"fr":"Pourquoi privilégier les long-only dans l'allocation ?","en":"Why favour long-only in allocation?"}],"reveal":{"fr":"Avec une sursouscription de 4x et un livre de qualité, on price en haut de fourchette mais en gardant une légère [[décote d'IPO]] : prix d'offre = 21 € (vs 22 € en borne haute). On alloue prioritairement les investisseurs long-only de qualité (stabilité de l'actionnariat) et on réduit les ordres spéculatifs pour limiter le flowback au premier jour.","en":"With 4x oversubscription and a quality book, we price at the top of the range while keeping a small [[IPO discount]]: offer price = €21 (vs €22 top bound). We allocate primarily to quality long-only investors (shareholder stability) and scale back speculative orders to limit first-day flowback."}},{"prompt":{"fr":"Étape 6 — Performance du premier jour. À 21 € le titre ouvre puis clôture à 23,1 €. Calculez le pop et jugez le succès de l'opération.","en":"Stage 6 — First-day performance. At €21 the stock opens then closes at €23.1. Compute the pop and judge the deal's success."},"guidedQuestions":[{"fr":"Pop = (cours clôture − prix d'offre) / prix d'offre ?","en":"Pop = (closing price − offer price) / offer price?"},{"fr":"Un pop de cet ordre est-il sain ?","en":"Is a pop of this magnitude healthy?"}],"reveal":{"fr":"Pop = (23,1 − 21) / 21 = +10 %. C'est un pop modéré et sain (~+5 à +15 % APPROXIMATE) : il récompense les investisseurs primaires sans signaler une décote excessive ni de valeur massivement laissée sur la table. IPO réussie. Si le cours reste au-dessus du prix d'offre, le syndicat exerce le [[greenshoe]] ; s'il avait chuté sous 21 €, il aurait racheté pour stabiliser.","en":"Pop = (23.1 − 21) / 21 = +10%. A moderate, healthy pop (~+5 to +15% APPROXIMATE): it rewards primary investors without signalling an excessive discount or large value left on the table. Successful IPO. If the stock stays above the offer price, the syndicate exercises the [[greenshoe]]; had it fallen below €21, it would have bought back to stabilise."}}]},{"id":"case.lbo.sponsor","type":"caseStudy","level":4,"topic":"LBO","tags":["LBO","LevFin","Valuation","MoM","IRR"],"difficulty":4,"source":{"flag":"EXEMPLE_PEDAGOGIQUE","ref":"Cas pédagogique inspiré d'un LBO mid-cap français (style Bridgepoint/PAI/Ardian)"},"title":{"fr":"LBO sponsor mid-cap : de la valorisation d'entrée au calcul du MoM/IRR","en":"Mid-cap sponsor LBO: from entry valuation to MoM/IRR"},"dealType":"LBO-sponsor","realDeal":false,"scenario":{"fr":"Un fonds européen mid-market — appelons-le « Garonne Capital » dans la lignée de Bridgepoint, PAI Partners ou Ardian — étudie le rachat de Proxima, ETI française de services techniques B2B basée à Lyon. Proxima réalise 200 M€ de chiffre d'affaires et 30 M€ d'[[EBITDA]] (marge 15 %), avec une croissance organique de 6 %/an et des [[capex]] modérés. Le management reste en place et co-investit. L'horizon de détention visé est de 5 ans. Vous êtes l'associate qui construit le [[LBO]] : prix d'entrée, structuration de la dette, désendettement, puis sortie. Tous les chiffres sont illustratifs.","en":"A European mid-market fund — call it \"Garonne Capital,\" in the vein of Bridgepoint, PAI Partners or Ardian — is studying the buyout of Proxima, a French mid-cap B2B technical-services company based in Lyon. Proxima posts 200 M€ revenue and 30 M€ of [[EBITDA]] (15% margin), with 6%/yr organic growth and moderate [[capex]]. Management stays on and co-invests. The targeted holding period is 5 years. You are the associate building the [[LBO]]: entry price, debt structuring, deleveraging, then exit. All figures are illustrative."},"data":[{"caption":{"fr":"P&L et cash-flow prévisionnels (M€)","en":"Projected P&L and cash flow (€m)"},"columns":["","Entrée (Y0)","Y1","Y2","Y3","Y4","Y5 (sortie)"],"rows":[["Chiffre d'affaires",200,212,225,238,252,267],["EBITDA",30,32.5,35.1,37.8,40.6,43.5],["Marge EBITDA %",15,15.3,15.6,15.9,16.1,16.3],["FCF after debt service (cumul paydown)",0,8,17,27,38,50]]},{"caption":{"fr":"Sources & Uses à l'entrée (M€)","en":"Sources & Uses at entry (€m)"},"columns":["Sources","M€","Uses","M€"],"rows":[["Dette senior (Term Loan B)",120,"Enterprise Value (8,0x)",240],["Dette subordonnée / mezzanine",30,"Frais de transaction (2%)",5],["Équity sponsor + management",95,"",0],["Total Sources",245,"Total Uses",245]]}],"stages":[{"prompt":{"fr":"Étape 1 — Valorisation d'entrée. Sur la base de 30 M€ d'[[EBITDA]] et d'un multiple d'entrée de 8,0x [[EV/EBITDA]] (cohérent avec un actif de services de qualité mid-cap en France), calculez l'[[Enterprise Value]] d'entrée. La cible a 10 M€ de dette nette existante : quel est le prix des fonds propres (equity value) payé aux vendeurs ?","en":"Stage 1 — Entry valuation. With 30 M€ of [[EBITDA]] and an entry multiple of 8.0x [[EV/EBITDA]] (consistent with a quality mid-cap French services asset), compute the entry [[Enterprise Value]]. The target carries 10 M€ of existing net debt: what is the equity price paid to the sellers?"},"guidedQuestions":[{"fr":"EV = multiple × EBITDA ?","en":"EV = multiple × EBITDA?"},{"fr":"Equity value vendeurs = EV − dette nette existante ?","en":"Sellers' equity value = EV − existing net debt?"}],"reveal":{"fr":"EV d'entrée = 8,0x × 30 M€ = 240 M€. Equity value payée aux vendeurs = 240 − 10 (dette nette existante) = 230 M€. C'est l'[[Enterprise Value]] qui sert d'ancrage au financement : 8,0x sur un actif mid-cap de services en France est un multiple plausible (souvent 7–10x selon la qualité et la récurrence du revenu).","en":"Entry EV = 8.0x × 30 M€ = 240 M€. Equity value paid to sellers = 240 − 10 (existing net debt) = 230 M€. The [[Enterprise Value]] anchors the financing: 8.0x for a French mid-cap services asset is plausible (often 7–10x depending on quality and revenue recurrence)."}},{"prompt":{"fr":"Étape 2 — Sources & Uses. On structure 4,0x d'[[EBITDA]] de dette senior et 1,0x de mezzanine, plus 5 M€ de frais de transaction (~2 % de l'EV). Construisez le tableau Sources & Uses et déduisez le chèque d'[[equity]] du sponsor (et management).","en":"Stage 2 — Sources & Uses. We structure 4.0x [[EBITDA]] of senior debt and 1.0x of mezzanine, plus 5 M€ of transaction fees (~2% of EV). Build the Sources & Uses table and derive the sponsor (and management) [[equity]] check."},"guidedQuestions":[{"fr":"Total Uses = EV + frais ?","en":"Total Uses = EV + fees?"},{"fr":"Equity = Uses − dette totale ?","en":"Equity = Uses − total debt?"}],"reveal":{"fr":"Uses : EV 240 + frais 5 = 245 M€. Sources : dette senior 4,0x × 30 = 120 ; mezzanine 1,0x × 30 = 30 ; soit 150 M€ de dette totale (5,0x). Équity = 245 − 150 = 95 M€. Le [[leverage]] d'entrée à 5,0x est dans la fourchette mid-cap FR (typiquement 4,5–5,5x). Le sponsor met l'essentiel des 95 M€, le management ~3–5 M€ en co-investissement.","en":"Uses: EV 240 + fees 5 = 245 M€. Sources: senior debt 4.0x × 30 = 120; mezzanine 1.0x × 30 = 30; i.e. 150 M€ total debt (5.0x). Equity = 245 − 150 = 95 M€. Entry [[leverage]] at 5.0x sits in the FR mid-cap range (typically 4.5–5.5x). The sponsor funds most of the 95 M€, with management co-investing ~3–5 M€."}},{"prompt":{"fr":"Étape 3 — Structuration de la dette et service annuel. Le Term Loan B (120 M€) porte ~5,5 % d'intérêt, la mezzanine (30 M€) ~9 %. Estimez la charge d'intérêts de la première année et commentez la couverture par l'EBITDA.","en":"Stage 3 — Debt structuring and annual service. The Term Loan B (120 M€) bears ~5.5% interest, the mezzanine (30 M€) ~9%. Estimate Year 1 interest expense and comment on EBITDA coverage."},"guidedQuestions":[{"fr":"Intérêts = 5,5% × 120 + 9% × 30 ?","en":"Interest = 5.5% × 120 + 9% × 30?"},{"fr":"Ratio de couverture EBITDA / intérêts ?","en":"EBITDA / interest coverage ratio?"}],"reveal":{"fr":"Intérêts Y1 ≈ 0,055 × 120 + 0,09 × 30 = 6,6 + 2,7 = 9,3 M€. Couverture = 32,5 / 9,3 ≈ 3,5x — confortable. Le TLB est typiquement [[bullet]] (remboursé in fine) avec un [[cash sweep]] sur le FCF excédentaire ; la mezzanine est souvent en [[PIK]] partiel. La charge d'intérêts pèse mais l'[[EBITDA]] croissant l'allège chaque année.","en":"Y1 interest ≈ 0.055 × 120 + 0.09 × 30 = 6.6 + 2.7 = 9.3 M€. Coverage = 32.5 / 9.3 ≈ 3.5x — comfortable. The TLB is typically [[bullet]] (repaid at maturity) with a [[cash sweep]] on excess FCF; mezzanine is often partly [[PIK]]. Interest is heavy but rising [[EBITDA]] eases it each year."}},{"prompt":{"fr":"Étape 4 — [[Paydown]] sur la période de détention. Le tableau de cash-flow montre un FCF after debt service cumulé de 50 M€ sur 5 ans, intégralement affecté au remboursement de la dette via le [[cash sweep]]. Quelle est la dette nette à la sortie (Y5) ?","en":"Stage 4 — [[Paydown]] over the holding period. The cash-flow table shows cumulative FCF after debt service of 50 M€ over 5 years, fully applied to debt repayment via the [[cash sweep]]. What is net debt at exit (Y5)?"},"guidedQuestions":[{"fr":"Dette nette sortie = dette entrée − paydown cumulé ?","en":"Exit net debt = entry debt − cumulative paydown?"},{"fr":"Le levier net a-t-il baissé ?","en":"Has net leverage fallen?"}],"reveal":{"fr":"Dette nette à la sortie = 150 (dette d'entrée) − 50 (paydown cumulé) = 100 M€. Le [[paydown]] de 50 M€ provient du FCF généré et balayé par le [[cash sweep]]. Le levier net passe de 5,0x (150/30) à l'entrée à 100/43,5 ≈ 2,3x à la sortie : le désendettement combiné à la croissance d'EBITDA crée de la valeur pour l'[[equity]].","en":"Exit net debt = 150 (entry debt) − 50 (cumulative paydown) = 100 M€. The 50 M€ [[paydown]] comes from generated FCF swept by the [[cash sweep]]. Net leverage falls from 5.0x (150/30) at entry to 100/43.5 ≈ 2.3x at exit: deleveraging plus EBITDA growth creates equity value."}},{"prompt":{"fr":"Étape 5 — Valorisation de sortie. On vend en Y5 à 43,5 M€ d'[[EBITDA]]. Hypothèse de base : multiple de sortie stable à 8,0x (pas d'expansion de multiple). Calculez l'[[Enterprise Value]] de sortie, puis l'equity de sortie (rappel : equity de sortie = EV sortie − dette nette de sortie).","en":"Stage 5 — Exit valuation. We sell in Y5 at 43.5 M€ of [[EBITDA]]. Base case: stable exit multiple of 8.0x (no multiple expansion). Compute the exit [[Enterprise Value]], then exit equity (recall: exit equity = exit EV − exit net debt)."},"guidedQuestions":[{"fr":"EV sortie = 8,0x × 43,5 ?","en":"Exit EV = 8.0x × 43.5?"},{"fr":"Equity sortie = EV sortie − 100 ?","en":"Exit equity = exit EV − 100?"}],"reveal":{"fr":"EV de sortie = 8,0x × 43,5 = 348 M€. Equity de sortie = 348 − 100 (dette nette de sortie) = 248 M€. À multiple constant, toute la création de valeur vient de la croissance d'[[EBITDA]] (+45 % sur 5 ans) et du [[paydown]] de la dette — c'est le moteur d'un bon LBO sans pari sur l'expansion de multiple.","en":"Exit EV = 8.0x × 43.5 = 348 M€. Exit equity = 348 − 100 (exit net debt) = 248 M€. At a constant multiple, all value creation comes from [[EBITDA]] growth (+45% over 5 years) and debt [[paydown]] — the engine of a sound LBO without betting on multiple expansion."}},{"prompt":{"fr":"Étape 6 — [[MoM]] et [[IRR]]. Avec 95 M€ d'equity investie à l'entrée et 248 M€ récupérés à la sortie sur 5 ans, calculez le [[MoM]] et l'[[IRR]] (cash unique en entrée, cash unique en sortie).","en":"Stage 6 — [[MoM]] and [[IRR]]. With 95 M€ of equity invested at entry and 248 M€ returned at exit over 5 years, compute the [[MoM]] and [[IRR]] (single cash in, single cash out)."},"guidedQuestions":[{"fr":"MoM = equity sortie / equity entrée ?","en":"MoM = exit equity / entry equity?"},{"fr":"IRR = MoM^(1/5) − 1 ?","en":"IRR = MoM^(1/5) − 1?"}],"reveal":{"fr":"[[MoM]] = 248 / 95 ≈ 2,6x. [[IRR]] = 2,6^(1/5) − 1 ≈ 0,212, soit ~21 %. Un MoM de 2,5–2,7x et un IRR ~20 % sur 5 ans constituent un résultat solide pour un LBO mid-cap européen. Décomposition de la valeur : croissance d'EBITDA (~71 M€ d'effet sur l'EV), paydown (50 M€), expansion de multiple (0 dans la base case).","en":"[[MoM]] = 248 / 95 ≈ 2.6x. [[IRR]] = 2.6^(1/5) − 1 ≈ 0.212, i.e. ~21%. A MoM of 2.5–2.7x and ~20% IRR over 5 years is a solid outcome for a European mid-cap LBO. Value bridge: EBITDA growth (~71 M€ of EV effect), paydown (50 M€), multiple expansion (0 in the base case)."}},{"prompt":{"fr":"Étape 7 — Sensibilité au multiple de sortie. Que devient le [[MoM]] si le marché se dégrade et qu'on sort à 7,0x au lieu de 8,0x ? Et s'il s'améliore à 9,0x ?","en":"Stage 7 — Exit-multiple sensitivity. What happens to [[MoM]] if the market deteriorates and we exit at 7.0x instead of 8.0x? And if it improves to 9.0x?"},"guidedQuestions":[{"fr":"EV sortie à 7,0x et 9,0x ?","en":"Exit EV at 7.0x and 9.0x?"},{"fr":"Equity et MoM correspondants ?","en":"Corresponding equity and MoM?"}],"reveal":{"fr":"À 7,0x : EV = 304,5 → equity = 204,5 → [[MoM]] ≈ 2,15x ([[IRR]] ~17 %). À 9,0x : EV = 391,5 → equity = 291,5 → MoM ≈ 3,07x (IRR ~25 %). Chaque tour de multiple (±1,0x) déplace le MoM d'environ ±0,45x : la sensibilité au multiple de sortie est forte, d'où l'intérêt de ne pas dépendre d'une expansion de multiple dans le cas de base.","en":"At 7.0x: EV = 304.5 → equity = 204.5 → [[MoM]] ≈ 2.15x ([[IRR]] ~17%). At 9.0x: EV = 391.5 → equity = 291.5 → MoM ≈ 3.07x (IRR ~25%). Each multiple turn (±1.0x) shifts MoM by about ±0.45x: exit-multiple sensitivity is high, which is why the base case should not rely on multiple expansion."}}]},{"id":"case.lbo.buildup","type":"caseStudy","level":5,"topic":"LBO","tags":["LBO","M&A","build-up","MoM","Valuation"],"difficulty":5,"source":{"flag":"EXEMPLE_PEDAGOGIQUE","ref":"Cas pédagogique buy-and-build mid-cap européen (style Ardian/Eurazeo)"},"title":{"fr":"Buy-and-build : arbitrage de multiple et création de valeur par la consolidation","en":"Buy-and-build: multiple arbitrage and value creation through consolidation"},"dealType":"build-up","realDeal":false,"scenario":{"fr":"« Eurazeo-style » lance une stratégie de [[buy-and-build]] dans la maintenance multitechnique en Europe. La plateforme, Méridien Services, est acquise à 10,0x [[EV/EBITDA]] avec 40 M€ d'[[EBITDA]]. La thèse : un marché fragmenté de PME (« bolt-ons ») se rachète à 6,0x seulement. En consolidant plusieurs bolt-ons sous la plateforme, le fonds capture un [[multiple arbitrage]] : ce qui est acheté à 6,0x est revalorisé au multiple de plateforme à la sortie. Horizon 5 ans. Vous modélisez l'[[EBITDA]] consolidé, le levier et le [[MoM]] final. Chiffres illustratifs.","en":"An \"Eurazeo-style\" fund launches a [[buy-and-build]] strategy in European multi-technical maintenance. The platform, Méridien Services, is acquired at 10.0x [[EV/EBITDA]] with 40 M€ of [[EBITDA]]. The thesis: a fragmented market of SMEs (\"bolt-ons\") trades at only 6.0x. By consolidating several bolt-ons under the platform, the fund captures a [[multiple arbitrage]]: what is bought at 6.0x is revalued at the platform multiple on exit. 5-year horizon. You model consolidated [[EBITDA]], leverage and final [[MoM]]. Illustrative figures."},"data":[{"caption":{"fr":"Plateforme et bolt-ons (M€ d'EBITDA et multiples)","en":"Platform and bolt-ons (€m EBITDA and multiples)"},"columns":["","EBITDA","Multiple d'achat","EV payée","Financement"],"rows":[["Plateforme Méridien (Y0)",40,10,400,"Dette 200 + Equity 220 (frais 20)"],["Bolt-on A (Y1)",8,6,48,"Dette + cash"],["Bolt-on B (Y2)",6,6,36,"Dette + cash"],["Bolt-on C (Y3)",6,6,36,"Dette + cash"]]},{"caption":{"fr":"Pont d'EBITDA consolidé (M€)","en":"Consolidated EBITDA bridge (€m)"},"columns":["","Y0","Y1","Y2","Y3","Y4","Y5"],"rows":[["EBITDA plateforme (organique +5%)",40,42,44.1,46.3,48.6,51.1],["EBITDA bolt-ons acquis",0,8,14,20,21,22],["Synergies",0,0,1,2,3,4],["EBITDA consolidé",40,50,59.1,68.3,72.6,77.1]]}],"stages":[{"prompt":{"fr":"Étape 1 — Acquisition de la plateforme. Méridien (40 M€ d'[[EBITDA]]) est acquise à 10,0x. On finance avec 5,0x de dette (mid-cap haut de gamme) et le solde en [[equity]], plus 20 M€ de frais. Calculez l'[[Enterprise Value]], la dette, et le chèque d'equity initial.","en":"Stage 1 — Platform acquisition. Méridien (40 M€ [[EBITDA]]) is acquired at 10.0x. We finance with 5.0x of debt (upper mid-cap) and the rest in [[equity]], plus 20 M€ of fees. Compute the [[Enterprise Value]], the debt, and the initial equity check."},"guidedQuestions":[{"fr":"EV plateforme = 10,0x × 40 ?","en":"Platform EV = 10.0x × 40?"},{"fr":"Dette = 5,0x × 40 ; equity = EV + frais − dette ?","en":"Debt = 5.0x × 40; equity = EV + fees − debt?"}],"reveal":{"fr":"EV plateforme = 10,0x × 40 = 400 M€. Dette = 5,0x × 40 = 200 M€. Uses = 400 + 20 (frais) = 420 ; equity = 420 − 200 = 220 M€. Le multiple de plateforme à 10,0x reflète la prime de taille/qualité d'un actif consolidateur ; c'est ce multiple qui rend l'[[multiple arbitrage]] attractif vs des bolt-ons à 6,0x.","en":"Platform EV = 10.0x × 40 = 400 M€. Debt = 5.0x × 40 = 200 M€. Uses = 400 + 20 (fees) = 420; equity = 420 − 200 = 220 M€. The 10.0x platform multiple reflects the size/quality premium of a consolidator asset; this multiple is what makes the [[multiple arbitrage]] attractive vs bolt-ons at 6.0x."}},{"prompt":{"fr":"Étape 2 — Premier bolt-on et arbitrage de multiple. En Y1, on acquiert Bolt-on A (8 M€ d'[[EBITDA]]) à 6,0x. Quelle EV payée ? Quel est le gain de valeur immédiat « jour 1 » dès que cet EBITDA est valorisé au multiple de plateforme (10,0x) ?","en":"Stage 2 — First bolt-on and multiple arbitrage. In Y1, we acquire Bolt-on A (8 M€ [[EBITDA]]) at 6.0x. What EV is paid? What is the immediate \"day-1\" value gain once that EBITDA is valued at the platform multiple (10.0x)?"},"guidedQuestions":[{"fr":"EV payée = 6,0x × 8 ?","en":"EV paid = 6.0x × 8?"},{"fr":"Valeur au multiple plateforme = 10,0x × 8 ; gain = différence ?","en":"Value at platform multiple = 10.0x × 8; gain = difference?"}],"reveal":{"fr":"EV payée = 6,0x × 8 = 48 M€. Valorisé à 10,0x à la sortie : 80 M€. Gain d'arbitrage = (10,0 − 6,0) × 8 = 32 M€ de valeur créée sur ce seul EBITDA, indépendamment de toute croissance. C'est le cœur de la thèse [[buy-and-build]] : acheter petit et cher en multiple bas, vendre gros au multiple élevé de la plateforme consolidée.","en":"EV paid = 6.0x × 8 = 48 M€. Valued at 10.0x on exit: 80 M€. Arbitrage gain = (10.0 − 6.0) × 8 = 32 M€ of value created on that EBITDA alone, before any growth. This is the heart of the [[buy-and-build]] thesis: buy small and cheap on a low multiple, sell big at the consolidated platform's high multiple."}},{"prompt":{"fr":"Étape 3 — Programme de bolt-ons et EBITDA consolidé. Trois bolt-ons (A: 8 ; B: 6 ; C: 6 M€ d'EBITDA) sont ajoutés sur 3 ans, plus la croissance organique de la plateforme (+5 %/an) et des synergies. En vous appuyant sur le pont d'EBITDA, donnez l'[[EBITDA]] consolidé en Y5.","en":"Stage 3 — Bolt-on program and consolidated EBITDA. Three bolt-ons (A: 8; B: 6; C: 6 M€ EBITDA) are added over 3 years, plus the platform's organic growth (+5%/yr) and synergies. Using the EBITDA bridge, give the consolidated [[EBITDA]] in Y5."},"guidedQuestions":[{"fr":"EBITDA plateforme Y5 organique ?","en":"Y5 organic platform EBITDA?"},{"fr":"+ bolt-ons + synergies = consolidé ?","en":"+ bolt-ons + synergies = consolidated?"}],"reveal":{"fr":"Plateforme organique Y5 ≈ 40 × 1,05^5 ≈ 51,1 M€. Bolt-ons matures ≈ 22 M€ (avec leur propre croissance). Synergies ≈ 4 M€. [[EBITDA]] consolidé Y5 ≈ 51,1 + 22 + 4 ≈ 77 M€, soit près du double des 40 M€ de départ. La consolidation combine croissance organique, EBITDA acquis et synergies de coûts (achats, back-office, cross-selling).","en":"Y5 organic platform ≈ 40 × 1.05^5 ≈ 51.1 M€. Mature bolt-ons ≈ 22 M€ (with their own growth). Synergies ≈ 4 M€. Y5 consolidated [[EBITDA]] ≈ 51.1 + 22 + 4 ≈ 77 M€, nearly double the starting 40 M€. Consolidation combines organic growth, acquired EBITDA and cost synergies (procurement, back-office, cross-selling)."}},{"prompt":{"fr":"Étape 4 — Financement des bolt-ons et dette nette. Les 3 bolt-ons coûtent 48 + 36 + 36 = 120 M€ d'EV, financés à ~60 % en dette incrémentale et 40 % par le FCF de la plateforme. Sur 5 ans, le FCF cumulé rembourse aussi 60 M€ de principal. Estimez la dette nette à la sortie.","en":"Stage 4 — Bolt-on financing and net debt. The 3 bolt-ons cost 48 + 36 + 36 = 120 M€ of EV, funded ~60% with incremental debt and 40% from platform FCF. Over 5 years, cumulative FCF also repays 60 M€ of principal. Estimate net debt at exit."},"guidedQuestions":[{"fr":"Dette incrémentale bolt-ons = 60% × 120 ?","en":"Incremental bolt-on debt = 60% × 120?"},{"fr":"Dette nette sortie = 200 + dette incrémentale − paydown ?","en":"Exit net debt = 200 + incremental debt − paydown?"}],"reveal":{"fr":"Dette incrémentale = 0,60 × 120 = 72 M€. Dette nette sortie = 200 (plateforme) + 72 (bolt-ons) − 60 ([[paydown]] cumulé) = 212 M€. Levier net de sortie = 212 / 77 ≈ 2,75x, en forte baisse vs 5,0x à l'entrée malgré les acquisitions : l'EBITDA consolidé croît plus vite que la dette nette. Acheter les bolt-ons à 6,0x consomme peu de dette par euro d'EBITDA ajouté.","en":"Incremental debt = 0.60 × 120 = 72 M€. Exit net debt = 200 (platform) + 72 (bolt-ons) − 60 (cumulative [[paydown]]) = 212 M€. Exit net leverage = 212 / 77 ≈ 2.75x, sharply down vs 5.0x at entry despite the acquisitions: consolidated EBITDA grows faster than net debt. Buying bolt-ons at 6.0x consumes little debt per euro of added EBITDA."}},{"prompt":{"fr":"Étape 5 — Valorisation de sortie. On sort en Y5 à 77 M€ d'[[EBITDA]], au multiple de plateforme de 10,0x (la taille et la diversification justifient le maintien du multiple). Calculez l'[[Enterprise Value]] et l'equity de sortie (equity = EV sortie − dette nette de sortie).","en":"Stage 5 — Exit valuation. We exit in Y5 at 77 M€ of [[EBITDA]], at the platform multiple of 10.0x (size and diversification justify holding the multiple). Compute the [[Enterprise Value]] and exit equity (equity = exit EV − exit net debt)."},"guidedQuestions":[{"fr":"EV sortie = 10,0x × 77 ?","en":"Exit EV = 10.0x × 77?"},{"fr":"Equity sortie = EV − 212 ?","en":"Exit equity = EV − 212?"}],"reveal":{"fr":"EV de sortie = 10,0x × 77 = 770 M€. Equity de sortie = 770 − 212 = 558 M€. Maintenir le multiple à 10,0x est cohérent avec une plateforme plus grande, diversifiée et plus liquide à la revente (potentiellement éligible à un acquéreur stratégique ou à un fonds large-cap), parfois même au prix d'une légère expansion de multiple — non supposée ici.","en":"Exit EV = 10.0x × 77 = 770 M€. Exit equity = 770 − 212 = 558 M€. Holding the 10.0x multiple is consistent with a larger, diversified, more liquid platform at resale (potentially eligible for a strategic buyer or a large-cap fund), sometimes even at a slight multiple expansion — not assumed here."}},{"prompt":{"fr":"Étape 6 — [[MoM]] final et rôle de l'arbitrage. L'equity investie cumulée est de 220 (plateforme) + 48 (la part equity des bolt-ons, ~40 % × 120) = 268 M€. Avec 558 M€ d'equity à la sortie sur 5 ans, calculez le [[MoM]] et l'[[IRR]], et chiffrez la part venant de l'arbitrage de multiple.","en":"Stage 6 — Final [[MoM]] and the role of arbitrage. Cumulative equity invested is 220 (platform) + 48 (the equity portion of bolt-ons, ~40% × 120) = 268 M€. With 558 M€ of exit equity over 5 years, compute the [[MoM]] and [[IRR]], and quantify the share coming from multiple arbitrage."},"guidedQuestions":[{"fr":"MoM = equity sortie / equity investie ?","en":"MoM = exit equity / invested equity?"},{"fr":"Gain d'arbitrage = (10 − 6) × EBITDA bolt-ons acquis ?","en":"Arbitrage gain = (10 − 6) × acquired bolt-on EBITDA?"}],"reveal":{"fr":"[[MoM]] = 558 / 268 ≈ 2,08x. [[IRR]] = 2,08^(1/5) − 1 ≈ 0,158, soit ~16 %. Arbitrage de multiple : (10,0 − 6,0) × ~20 M€ d'EBITDA bolt-ons ≈ 80 M€ de valeur créée par le seul re-rating — soit environ un quart de la plus-value d'equity (558 − 268 = 290 M€). Le reste vient de la croissance organique, des synergies et du [[paydown]].","en":"[[MoM]] = 558 / 268 ≈ 2.08x. [[IRR]] = 2.08^(1/5) − 1 ≈ 0.158, i.e. ~16%. Multiple arbitrage: (10.0 − 6.0) × ~20 M€ of bolt-on EBITDA ≈ 80 M€ of value created by re-rating alone — roughly a quarter of the equity gain (558 − 268 = 290 M€). The rest comes from organic growth, synergies and [[paydown]]."}},{"prompt":{"fr":"Étape 7 — Risques et limites du modèle. Quels sont les pièges classiques d'une stratégie [[buy-and-build]] qui peuvent détruire le [[MoM]] modélisé ci-dessus ?","en":"Stage 7 — Risks and model limits. What are the classic pitfalls of a [[buy-and-build]] strategy that can destroy the modeled [[MoM]] above?"},"guidedQuestions":[{"fr":"L'arbitrage de multiple tient-il toujours ?","en":"Does the multiple arbitrage always hold?"},{"fr":"Quel risque sur l'intégration et la dette ?","en":"What risk on integration and debt?"}],"reveal":{"fr":"Pièges : (1) l'[[multiple arbitrage]] s'érode quand la concurrence sur les bolt-ons fait monter les prix d'achat de 6,0x vers 8,0x+ ; (2) les synergies sont surestimées et l'intégration dilue les marges ; (3) la dette d'acquisition empile les covenants et un FCF surpromis peut casser le [[cash sweep]] ; (4) à la sortie, l'acheteur peut refuser le multiple de plateforme si la croissance est surtout « achetée » et non organique. Une discipline sur le prix d'entrée des bolt-ons et une vraie intégration opérationnelle sont décisives.","en":"Pitfalls: (1) the [[multiple arbitrage]] erodes when competition for bolt-ons pushes purchase prices from 6.0x toward 8.0x+; (2) synergies are overestimated and integration dilutes margins; (3) acquisition debt stacks covenants and over-promised FCF can break the [[cash sweep]]; (4) at exit, a buyer may reject the platform multiple if growth is mostly \"bought\" rather than organic. Discipline on bolt-on entry prices and genuine operational integration are decisive."}}]},{"id":"case.ma.merger","type":"caseStudy","level":4,"topic":"M&A","tags":["M&A","merger","accretion/dilution","synergies"],"difficulty":4,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"title":{"fr":"Acquisition transfrontalière européenne : valoriser et financer","en":"European cross-border acquisition: valuing and financing"},"dealType":"merger","realDeal":false,"scenario":{"fr":"NordIndus, un groupe industriel français coté (sponsor implicite : un acquéreur stratégique), envisage l'acquisition de SüdTech, une cible allemande de composants spécialisés. Vous êtes analyste buy-side. La cible réalise un EBITDA de 80 M€. Vous devez la valoriser par les comparables et les transactions précédentes, intégrer une prime de contrôle d'environ 30 %, choisir un financement cash/actions, analyser l'accretion/dilution du BPA et chiffrer les synergies. Tous les chiffres sont pédagogiques.","en":"NordIndus, a listed French industrial group (implicit sponsor: a strategic acquirer), is considering acquiring SüdTech, a German specialty-components target. You are a buy-side analyst. The target generates €80m of EBITDA. You must value it via comparables and precedent transactions, apply a control premium of about 30%, choose a cash/stock financing mix, analyse EPS accretion/dilution, and size the synergies. All figures are pedagogical."},"data":[{"caption":{"fr":"Données cible SüdTech","en":"SüdTech target data"},"columns":["Métrique","Valeur"],"rows":[["EBITDA","80"],["Dette nette","120"],["Résultat net","40"],["Cours non affecté (équity, M€)","640"]]},{"caption":{"fr":"Multiples de marché","en":"Market multiples"},"columns":["Référence","EV/EBITDA"],"rows":[["Comparables boursiers","9,0x"],["Transactions précédentes","11,0x"]]},{"caption":{"fr":"Données acquéreur NordIndus","en":"NordIndus acquirer data"},"columns":["Métrique","Valeur"],"rows":[["Résultat net","200"],["Nombre d'actions (M)","100"],["Cours de l'action (€)","40"],["Coût de la dette avant impôt","5%"]]}],"stages":[{"prompt":{"fr":"Étape 1 — Valorisation par les comparables boursiers. À 9,0x EV/EBITDA, quelle est l'Enterprise Value, puis la valeur des fonds propres (equity value) de SüdTech ?","en":"Stage 1 — Valuation by trading comparables. At 9.0x EV/EBITDA, what is the Enterprise Value, then the equity value of SüdTech?"},"guidedQuestions":[{"fr":"Comment passe-t-on de l'EV à l'equity value ?","en":"How do you bridge from EV to equity value?"},{"fr":"Quel multiple appliquer à l'EBITDA de 80 ?","en":"Which multiple do you apply to the €80m EBITDA?"}],"reveal":{"fr":"EV = 9,0x × 80 = 720 M€. Equity value = EV − dette nette = 720 − 120 = 600 M€. À ce stade, sans prime, la cible vaut donc 600 M€ en fonds propres, légèrement sous le cours non affecté de 640.","en":"EV = 9.0x × 80 = €720m. Equity value = EV − net debt = 720 − 120 = €600m. At this stage, with no premium, the target's equity is worth €600m, slightly below the €640m unaffected price."}},{"prompt":{"fr":"Étape 2 — Valorisation par les transactions précédentes. À 11,0x EV/EBITDA, recalculez EV et equity value.","en":"Stage 2 — Valuation by precedent transactions. At 11.0x EV/EBITDA, recompute EV and equity value."},"guidedQuestions":[{"fr":"Pourquoi les transactions précédentes affichent-elles un multiple plus élevé que les comparables boursiers ?","en":"Why do precedent transactions show a higher multiple than trading comparables?"}],"reveal":{"fr":"EV = 11,0x × 80 = 880 M€. Equity value = 880 − 120 = 760 M€. Les transactions précédentes intègrent déjà une prime de contrôle payée lors de deals passés, d'où un multiple supérieur aux comparables boursiers (qui reflètent des participations minoritaires).","en":"EV = 11.0x × 80 = €880m. Equity value = 880 − 120 = €760m. Precedent transactions already embed a control premium paid in past deals, hence a higher multiple than trading comparables (which reflect minority stakes)."}},{"prompt":{"fr":"Étape 3 — Prime de contrôle. En appliquant une prime de ~30 % au cours non affecté (640 M€ d'equity), quel prix d'offre proposez-vous ?","en":"Stage 3 — Control premium. Applying a ~30% premium to the unaffected price (€640m equity), what offer price do you propose?"},"guidedQuestions":[{"fr":"Sur quelle base applique-t-on la prime de contrôle ?","en":"On what basis is the control premium applied?"},{"fr":"Le prix retenu est-il cohérent avec la fourchette comps / précédents ?","en":"Is the chosen price consistent with the comps / precedents range?"}],"reveal":{"fr":"Prix d'offre = 640 × (1 + 30 %) = 832 M€ d'equity value. Ce montant se situe dans la fourchette de valorisation (600 par comps, 760 par précédents) et au-dessus, cohérent avec une prime de contrôle payée pour 100 % du capital. On retient une offre autour de 832 M€.","en":"Offer price = 640 × (1 + 30%) = €832m equity value. This sits within and above the valuation range (600 by comps, 760 by precedents), consistent with a control premium paid for 100% of the equity. We anchor the offer around €832m."}},{"prompt":{"fr":"Étape 4 — Financement et accretion/dilution (deal 100 % actions). NordIndus paie 832 M€ en émettant des actions à 40 € (soit 20,8 M actions). Sans synergies, le deal est-il relutif ou dilutif ?","en":"Stage 4 — Financing and accretion/dilution (all-stock deal). NordIndus pays €832m by issuing shares at €40 (i.e. 20.8m shares). Without synergies, is the deal accretive or dilutive?"},"guidedQuestions":[{"fr":"Quel est le BPA de NordIndus avant le deal ?","en":"What is NordIndus's EPS before the deal?"},{"fr":"Quel est le BPA pro forma après émission d'actions ?","en":"What is the pro forma EPS after the share issue?"}],"reveal":{"fr":"BPA avant = 200 / 100 = 2,00 €. Actions émises = 832 / 40 = 20,8 M. RN pro forma = 200 + 40 = 240 ; actions pro forma = 100 + 20,8 = 120,8 ; BPA pro forma = 240 / 120,8 = 1,99 € → légèrement DILUTIF (−0,7 %). Malgré une cible rentable, le grand nombre d'actions émises à un cours de 40 € pèse : le ratio d'échange domine.","en":"EPS before = 200 / 100 = €2.00. Shares issued = 832 / 40 = 20.8m. Pro forma NI = 200 + 40 = 240; pro forma shares = 100 + 20.8 = 120.8; pro forma EPS = 240 / 120.8 = €1.99 → slightly DILUTIVE (−0.7%). Despite a profitable target, the large number of shares issued at €40 weighs in: the exchange ratio dominates."}},{"prompt":{"fr":"Étape 5 — Synergies. NordIndus identifie 12 M€ de synergies de coûts annuelles (avant impôt). Après IS France à 25 %, le deal redevient-il relutif ?","en":"Stage 5 — Synergies. NordIndus identifies €12m of annual pre-tax cost synergies. After French corporate tax at 25%, does the deal turn accretive?"},"guidedQuestions":[{"fr":"Quel est l'impact net d'impôt des synergies sur le résultat net pro forma ?","en":"What is the after-tax impact of synergies on pro forma net income?"},{"fr":"Pourquoi privilégie-t-on des synergies de coûts plutôt que de revenus ici ?","en":"Why favour cost synergies over revenue synergies here?"}],"reveal":{"fr":"Synergies nettes = 12 × (1 − 25 %) = 9 M€. RN pro forma = 240 + 9 = 249 ; BPA pro forma = 249 / 120,8 = 2,06 € > 2,00 → le deal devient RELUTIF (+3,1 %). Les synergies de coûts (12 M€) suffisent à inverser la dilution initiale. On les privilégie car plus crédibles et plus rapides à réaliser que des synergies de revenus.","en":"After-tax synergies = 12 × (1 − 25%) = €9m. Pro forma NI = 240 + 9 = 249; pro forma EPS = 249 / 120.8 = €2.06 > 2.00 → the deal turns ACCRETIVE (+3.1%). The €12m of cost synergies is enough to reverse the initial dilution. They are favoured because they are more credible and faster to achieve than revenue synergies."}},{"prompt":{"fr":"Étape 6 — Conclusion et arbitrage de financement. Que recommandez-vous au comité d'investissement, et comment un financement cash/dette changerait-il le tableau ?","en":"Stage 6 — Conclusion and financing trade-off. What do you recommend to the investment committee, and how would a cash/debt financing change the picture?"},"guidedQuestions":[{"fr":"Le rendement de la cible dépasse-t-il le coût après impôt de la dette ?","en":"Does the target's yield exceed the after-tax cost of debt?"},{"fr":"Quels risques d'exécution faut-il signaler ?","en":"Which execution risks should be flagged?"}],"reveal":{"fr":"Recommandation : l'acquisition à 832 M€ est créatrice de valeur dès lors que les 12 M€ de synergies de coûts se matérialisent (BPA 2,00 → 2,06). En financement cash/dette à 5 % avant impôt (soit 3,75 % après IS 25 %), le rendement de la cible (RN 40 / prix 832 ≈ 4,8 %) dépasse le coût après impôt de la dette (3,75 %), ce qui rendrait le deal relutif même sans synergies. Risques à signaler : non-réalisation des synergies, intégration transfrontalière, autorisations antitrust (signing vs closing), et hausse du levier en cas de financement dette.","en":"Recommendation: the €832m acquisition creates value as long as the €12m of cost synergies materialise (EPS 2.00 → 2.06). With cash/debt financing at 5% pre-tax (i.e. 3.75% after 25% tax), the target's yield (NI 40 / price 832 ≈ 4.8%) exceeds the after-tax cost of debt (3.75%), which would make the deal accretive even without synergies. Risks to flag: synergies not materialising, cross-border integration, antitrust approvals (signing vs closing), and higher leverage under debt financing."}}]}],"glossary":[{"id":"gl.leverage","type":"glossaryTerm","level":1,"topic":"LBO","tags":["LevFin"],"difficulty":1,"source":{"flag":"VERIFIED"},"term":"leverage","aliases":["effet de levier","levier","leverage financier","financial leverage"],"definition":{"fr":"Recours à la dette pour financer une acquisition ou amplifier le rendement des capitaux propres. En LBO, le levier se mesure souvent en multiple de dette nette / EBITDA (mid-cap FR ~4,5–5,5x). Plus le levier est élevé, plus l'IRR pour le sponsor est amplifié, à la hausse comme à la baisse.","en":"Use of debt to finance an acquisition or magnify equity returns. In an LBO, leverage is typically measured as net debt / EBITDA (French mid-cap ~4.5–5.5x). Higher leverage amplifies the sponsor's IRR, both upside and downside."},"related":["gl.equity","gl.ebitda","gl.gearing","gl.lbo"]},{"id":"gl.equity","type":"glossaryTerm","level":1,"topic":"Valuation","tags":["Valuation"],"difficulty":1,"source":{"flag":"VERIFIED"},"term":"equity","aliases":["capitaux propres","fonds propres","equity value","valeur des capitaux propres"],"definition":{"fr":"Les capitaux propres : la part de la valeur de l'entreprise qui revient aux actionnaires une fois la dette remboursée. En LBO, l'equity est le ticket investi par le sponsor et les co-investisseurs.","en":"The shareholders' stake in the firm's value, i.e. what is left for owners after debt is repaid. In an LBO, equity is the cheque written by the sponsor and co-investors."},"related":["gl.equity-value","gl.enterprise-value","gl.leverage"]},{"id":"gl.enterprise-value","type":"glossaryTerm","level":2,"topic":"Valuation","tags":["Valuation"],"difficulty":2,"source":{"flag":"VERIFIED"},"term":"enterprise value","aliases":["Enterprise Value","EV","valeur d'entreprise","VE","valeur de l'entreprise"],"definition":{"fr":"La valeur de l'entreprise indépendamment de sa structure de financement : EV = equity value + dette nette (+ intérêts minoritaires + préférentielles − participations mises en équivalence). C'est ce que reflètent les multiples EV/EBITDA et EV/EBIT.","en":"The value of the business independent of its financing: EV = equity value + net debt (+ minority interest + preferred − associates). It is the basis for EV/EBITDA and EV/EBIT multiples."},"related":["gl.equity-value","gl.multiple","gl.minority-interest"]},{"id":"gl.equity-value","type":"glossaryTerm","level":2,"topic":"Valuation","tags":["Valuation"],"difficulty":2,"source":{"flag":"VERIFIED"},"term":"equity value","aliases":["valeur des capitaux propres","valeur des fonds propres","market cap","capitalisation boursière","equity-value"],"definition":{"fr":"La valeur revenant aux actionnaires : equity value = enterprise value − dette nette. Pour une société cotée, c'est la capitalisation boursière (cours × nombre d'actions diluées).","en":"Value attributable to shareholders: equity value = enterprise value − net debt. For a listed company it equals market cap (share price × fully diluted shares)."},"related":["gl.enterprise-value","gl.treasury-stock-method","gl.eps"]},{"id":"gl.mom","type":"glossaryTerm","level":2,"topic":"LBO","tags":["LBO","Returns"],"difficulty":2,"source":{"flag":"VERIFIED"},"term":"MoM","aliases":["multiple of money","money multiple","MOIC","multiple sur investissement","multiple de cash","cash-on-cash"],"definition":{"fr":"Multiple of Money : equity de sortie / equity d'entrée, où l'equity de sortie = EV de sortie − dette nette de sortie. Un MoM de 2,5x signifie que le sponsor a multiplié sa mise par 2,5. Mesure le gain absolu mais ignore le temps.","en":"Multiple of Money: exit equity / entry equity, where exit equity = exit EV − exit net debt. A 2.5x MoM means the sponsor multiplied its money by 2.5. Captures absolute gain but ignores time."},"related":["gl.irr","gl.equity","gl.lbo"]},{"id":"gl.irr","type":"glossaryTerm","level":2,"topic":"LBO","tags":["LBO","Returns"],"difficulty":2,"source":{"flag":"VERIFIED"},"term":"IRR","aliases":["TRI","taux de rendement interne","internal rate of return","taux de rentabilité interne"],"definition":{"fr":"Taux de rentabilité interne : le taux d'actualisation qui annule la VAN des flux. Pour un seul flux entrée/sortie : IRR = MoM^(1/n) − 1, où n est la durée de détention. C'est la métrique de rendement reine en private equity.","en":"Internal Rate of Return: the discount rate that sets the NPV of cash flows to zero. For a single in/out: IRR = MoM^(1/n) − 1, where n is the holding period. It is the headline return metric in private equity."},"related":["gl.mom","gl.npv","gl.lbo"]},{"id":"gl.npv","type":"glossaryTerm","level":2,"topic":"DCF","tags":["Valuation","DCF"],"difficulty":2,"source":{"flag":"VERIFIED"},"term":"NPV","aliases":["VAN","valeur actuelle nette","net present value"],"definition":{"fr":"Valeur Actuelle Nette : somme des flux de trésorerie futurs actualisés au coût du capital, moins l'investissement initial. Un projet crée de la valeur si sa VAN est positive.","en":"Net Present Value: the sum of future cash flows discounted at the cost of capital, less the initial outlay. A project creates value when its NPV is positive."},"related":["gl.dcf","gl.wacc","gl.irr"]},{"id":"gl.wacc","type":"glossaryTerm","level":3,"topic":"WACC","tags":["WACC","DCF"],"difficulty":3,"source":{"flag":"VERIFIED"},"term":"WACC","aliases":["CMPC","coût moyen pondéré du capital","weighted average cost of capital","coût du capital"],"definition":{"fr":"Coût Moyen Pondéré du Capital : WACC = E/V·Re + D/V·Rd·(1−T), où E/V et D/V sont les poids des capitaux propres et de la dette, Re le coût des fonds propres (via le CAPM), Rd le coût de la dette et T le taux d'IS (France ~25%). C'est le taux d'actualisation d'un DCF unlevered (FCFF).","en":"Weighted Average Cost of Capital: WACC = E/V·Re + D/V·Rd·(1−T), where E/V and D/V are equity and debt weights, Re the cost of equity (via CAPM), Rd the cost of debt and T the tax rate (France ~25%). It discounts unlevered (FCFF) DCFs."},"related":["gl.capm","gl.dcf","gl.fcff","gl.beta"]},{"id":"gl.capm","type":"glossaryTerm","level":3,"topic":"WACC","tags":["WACC"],"difficulty":3,"source":{"flag":"VERIFIED"},"term":"CAPM","aliases":["MEDAF","modèle d'évaluation des actifs financiers","capital asset pricing model"],"definition":{"fr":"Modèle d'évaluation des actifs financiers : Re = Rf + β·(Rm − Rf), où Rf est le taux sans risque, β le bêta de l'action et (Rm − Rf) la prime de risque marché. Sert à estimer le coût des fonds propres dans le WACC.","en":"Capital Asset Pricing Model: Re = Rf + β·(Rm − Rf), where Rf is the risk-free rate, β the equity beta and (Rm − Rf) the market risk premium. Used to estimate the cost of equity in WACC."},"related":["gl.wacc","gl.beta"]},{"id":"gl.beta","type":"glossaryTerm","level":3,"topic":"WACC","tags":["WACC"],"difficulty":3,"source":{"flag":"VERIFIED"},"term":"beta","aliases":["bêta","beta","βL","βu","bêta levier","bêta désendetté","unlevered beta","levered beta"],"definition":{"fr":"Mesure de la sensibilité d'une action aux mouvements du marché. Le bêta levered (βL) intègre la dette ; on le désendette pour comparer des comparables : βu = βL / (1 + (1−T)·D/E), puis on le ré-endette à la structure cible.","en":"Measure of a stock's sensitivity to market moves. Levered beta (βL) reflects debt; you unlever it to compare peers: βu = βL / (1 + (1−T)·D/E), then relever to the target's capital structure."},"related":["gl.capm","gl.wacc"]},{"id":"gl.ebitda","type":"glossaryTerm","level":1,"topic":"Accounting","tags":["Accounting","Valuation"],"difficulty":1,"source":{"flag":"VERIFIED"},"term":"EBITDA","aliases":["EBE","excédent brut d'exploitation","earnings before interest taxes depreciation and amortization"],"definition":{"fr":"Résultat avant intérêts, impôts, dotations aux amortissements et provisions ; proche de l'EBE français. Proxy de la génération de cash opérationnelle, base des multiples EV/EBITDA et du calcul du levier.","en":"Earnings Before Interest, Taxes, Depreciation and Amortization; close to the French EBE. A proxy for operating cash generation and the basis for EV/EBITDA multiples and leverage."},"related":["gl.ebit","gl.multiple","gl.leverage"]},{"id":"gl.ebit","type":"glossaryTerm","level":1,"topic":"Accounting","tags":["Accounting"],"difficulty":1,"source":{"flag":"VERIFIED"},"term":"EBIT","aliases":["résultat d'exploitation","REX","operating income","earnings before interest and taxes"],"definition":{"fr":"Résultat d'exploitation : bénéfice après amortissements mais avant intérêts et impôts. Contrairement à l'EBITDA, il tient compte de l'intensité capitalistique via les D&A.","en":"Operating income: profit after depreciation/amortization but before interest and taxes. Unlike EBITDA it reflects capital intensity through D&A."},"related":["gl.ebitda","gl.fcff"]},{"id":"gl.fcff","type":"glossaryTerm","level":3,"topic":"DCF","tags":["DCF"],"difficulty":3,"source":{"flag":"VERIFIED"},"term":"FCFF","aliases":["free cash flow to firm","flux de trésorerie disponible pour l'entreprise","free cash flow","FCF","unlevered free cash flow","flux libre"],"definition":{"fr":"Flux de trésorerie disponible pour l'entreprise (unlevered) : EBIT·(1−T) + D&A − variation de BFR − capex. Indépendant de la structure financière, il s'actualise au WACC pour donner l'enterprise value.","en":"Unlevered free cash flow to the firm: EBIT·(1−T) + D&A − change in working capital − capex. Independent of financing, it is discounted at the WACC to yield enterprise value."},"related":["gl.fcfe","gl.wacc","gl.dcf","gl.working-capital"]},{"id":"gl.fcfe","type":"glossaryTerm","level":3,"topic":"DCF","tags":["DCF"],"difficulty":3,"source":{"flag":"VERIFIED"},"term":"FCFE","aliases":["free cash flow to equity","flux de trésorerie disponible pour l'actionnaire","levered free cash flow","flux pour l'actionnaire"],"definition":{"fr":"Flux de trésorerie disponible pour l'actionnaire (levered) : FCFF − intérêts·(1−T) + variation nette de dette. S'actualise au coût des fonds propres (Re) pour donner directement l'equity value.","en":"Levered free cash flow to equity: FCFF − after-tax interest + net change in debt. Discounted at the cost of equity (Re) to yield equity value directly."},"related":["gl.fcff","gl.capm","gl.equity-value"]},{"id":"gl.dcf","type":"glossaryTerm","level":3,"topic":"DCF","tags":["DCF","Valuation"],"difficulty":3,"source":{"flag":"VERIFIED"},"term":"DCF","aliases":["discounted cash flow","actualisation des flux de trésorerie","méthode des flux actualisés","DCF model"],"definition":{"fr":"Méthode d'actualisation des flux de trésorerie : on projette les FCFF, on les actualise au WACC, on ajoute une valeur terminale (Gordon ou multiple de sortie), puis on déduit la dette nette pour obtenir l'equity value. C'est une valorisation intrinsèque.","en":"Discounted Cash Flow: project FCFF, discount at WACC, add a terminal value (Gordon growth or exit multiple), then subtract net debt to reach equity value. It is an intrinsic valuation method."},"related":["gl.fcff","gl.wacc","gl.terminal-value","gl.npv"]},{"id":"gl.comps","type":"glossaryTerm","level":2,"topic":"Valuation","tags":["Valuation"],"difficulty":2,"source":{"flag":"VERIFIED"},"term":"comps","aliases":["comparables","trading comps","comparables boursiers","transaction comps","comparables transactionnels","multiples de marché","comparable companies analysis"],"definition":{"fr":"Analyse par les comparables : on valorise une cible en appliquant les multiples (EV/EBITDA, EV/EBIT, P/E) de sociétés cotées similaires (trading comps) ou de transactions précédentes (transaction comps). Valorisation relative, par opposition au DCF.","en":"Comparable analysis: value a target by applying the multiples (EV/EBITDA, EV/EBIT, P/E) of similar listed peers (trading comps) or precedent transactions (transaction comps). A relative valuation, as opposed to a DCF."},"related":["gl.multiple","gl.dcf","gl.enterprise-value"]},{"id":"gl.multiple","type":"glossaryTerm","level":2,"topic":"Valuation","tags":["Valuation"],"difficulty":2,"source":{"flag":"VERIFIED"},"term":"multiple","aliases":["multiple de valorisation","valuation multiple","EV/EBITDA","P/E","PER","multiple d'entrée","multiple de sortie","entry multiple","exit multiple"],"definition":{"fr":"Ratio de valorisation reliant la valeur à un agrégat financier (EV/EBITDA, EV/EBIT, P/E). En LBO on distingue le multiple d'entrée (à l'achat) et le multiple de sortie ; les acheter bas et revendre haut crée du multiple expansion.","en":"A valuation ratio linking value to a financial metric (EV/EBITDA, EV/EBIT, P/E). In an LBO we distinguish entry and exit multiples; buying low and selling high creates multiple expansion."},"related":["gl.comps","gl.multiple-expansion","gl.enterprise-value"]},{"id":"gl.eps","type":"glossaryTerm","level":2,"topic":"Accounting","tags":["Accounting","M&A"],"difficulty":2,"source":{"flag":"VERIFIED"},"term":"EPS","aliases":["BPA","bénéfice par action","earnings per share","résultat par action"],"definition":{"fr":"Bénéfice par action : résultat net (part du groupe) / nombre d'actions diluées. Métrique clé en M&A coté : une opération est relutive si elle augmente le BPA de l'acquéreur, dilutive si elle le réduit.","en":"Earnings Per Share: net income (group share) / fully diluted shares. A key metric in public M&A: a deal is accretive if it raises the acquirer's EPS, dilutive if it lowers it."},"related":["gl.accretion-dilution","gl.treasury-stock-method","gl.equity-value"]},{"id":"gl.accretion-dilution","type":"glossaryTerm","level":3,"topic":"M&A","tags":["M&A"],"difficulty":3,"source":{"flag":"VERIFIED"},"term":"accretion/dilution","aliases":["accretion dilution","relution/dilution","relution","dilution","analyse de relution","accretion-dilution"],"definition":{"fr":"Analyse de relution/dilution : on teste si une acquisition augmente (relutif) ou réduit (dilutif) le BPA pro forma de l'acquéreur. Règle rapide : payer en cash/dette est souvent relutif si le rendement de la cible dépasse le coût du financement ; payer en actions est dilutif si le P/E de la cible dépasse celui de l'acquéreur.","en":"Accretion/dilution analysis: tests whether an acquisition raises (accretive) or lowers (dilutive) the acquirer's pro forma EPS. Rule of thumb: cash/debt-funded deals are often accretive when the target's yield beats the financing cost; stock deals are dilutive when the target's P/E exceeds the acquirer's."},"related":["gl.eps","gl.synergies"]},{"id":"gl.sponsor","type":"glossaryTerm","level":1,"topic":"LBO","tags":["LBO"],"difficulty":1,"source":{"flag":"VERIFIED"},"term":"sponsor","aliases":["financial sponsor","sponsor financier","fonds de private equity","fonds LBO","PE firm"],"definition":{"fr":"Le fonds de private equity qui mène un LBO et apporte l'equity (ex. Hivest, Ardian, PAI Partners, Eurazeo). Le sponsor structure la dette, pilote la création de valeur et organise la sortie.","en":"The private equity fund that leads an LBO and provides the equity (e.g. Hivest, Ardian, PAI Partners, Eurazeo). The sponsor structures the debt, drives value creation and orchestrates the exit."},"related":["gl.lbo","gl.gp","gl.secondary-buyout"]},{"id":"gl.paydown","type":"glossaryTerm","level":2,"topic":"LevFin","tags":["LevFin","LBO"],"difficulty":2,"source":{"flag":"VERIFIED"},"term":"paydown","aliases":["debt paydown","remboursement de dette","amortissement de dette","désendettement","deleveraging"],"definition":{"fr":"Remboursement de la dette pendant la période de détention LBO, grâce au cash généré. Le désendettement transfère mécaniquement de la valeur des créanciers vers l'actionnaire et constitue un levier de création de valeur.","en":"Repayment of debt during the LBO holding period using cash generated. Paying down debt mechanically transfers value from lenders to equity and is a core value-creation lever."},"related":["gl.cash-sweep","gl.leverage","gl.mom"]},{"id":"gl.covenant","type":"glossaryTerm","level":3,"topic":"LevFin","tags":["LevFin"],"difficulty":3,"source":{"flag":"VERIFIED"},"term":"covenant","aliases":["covenants","clause de sauvegarde","ratio financier","covenant-lite","cov-lite","maintenance covenant","incurrence covenant"],"definition":{"fr":"Engagement contractuel imposé par les prêteurs (ex. levier max, DSCR min). Les maintenance covenants sont testés périodiquement ; les structures cov-lite n'imposent que des incurrence covenants, testés seulement lors d'un événement (nouvelle dette, dividende).","en":"A contractual lender protection (e.g. max leverage, min DSCR). Maintenance covenants are tested periodically; cov-lite structures impose only incurrence covenants, tested only on a trigger event (new debt, dividend)."},"related":["gl.dscr","gl.term-loan-b","gl.unitranche"]},{"id":"gl.unitranche","type":"glossaryTerm","level":3,"topic":"LevFin","tags":["LevFin"],"difficulty":3,"source":{"flag":"VERIFIED"},"term":"unitranche","aliases":["dette unitranche","unitranche debt"],"definition":{"fr":"Financement par un prêteur unique (souvent un fonds de dette privée) fusionnant dette senior et junior en une seule tranche, à un taux mixte. Rapide à exécuter, très utilisé sur le mid-cap LBO européen.","en":"A single-tranche financing from one lender (often a private debt fund) blending senior and junior debt at a single blended rate. Fast to execute and widely used in European mid-cap LBOs."},"related":["gl.senior-debt","gl.mezzanine","gl.covenant"]},{"id":"gl.mezzanine","type":"glossaryTerm","level":3,"topic":"LevFin","tags":["LevFin"],"difficulty":3,"source":{"flag":"VERIFIED"},"term":"mezzanine","aliases":["dette mezzanine","mezz","dette junior","junior debt","subordinated debt","dette subordonnée"],"definition":{"fr":"Dette junior subordonnée à la dette senior, plus risquée et plus chère, souvent assortie d'un PIK et d'un equity kicker (warrants). Elle comble l'écart entre la dette senior et l'equity dans la structure LBO.","en":"Junior debt subordinated to senior debt, riskier and pricier, often carrying a PIK coupon and an equity kicker (warrants). It bridges the gap between senior debt and equity in an LBO structure."},"related":["gl.senior-debt","gl.pik","gl.unitranche"]},{"id":"gl.pik","type":"glossaryTerm","level":3,"topic":"LevFin","tags":["LevFin"],"difficulty":3,"source":{"flag":"VERIFIED"},"term":"PIK","aliases":["payment in kind","paiement en nature","intérêts capitalisés","PIK interest","PIK note"],"definition":{"fr":"Payment-In-Kind : les intérêts ne sont pas payés en cash mais capitalisés sur le principal, qui grossit dans le temps. Préserve la trésorerie d'exploitation mais accroît la dette à rembourser à la sortie.","en":"Payment-In-Kind: interest is not paid in cash but capitalized onto the principal, which grows over time. Preserves operating cash but increases the debt owed at exit."},"related":["gl.mezzanine","gl.cash-sweep"]},{"id":"gl.senior-debt","type":"glossaryTerm","level":2,"topic":"LevFin","tags":["LevFin"],"difficulty":2,"source":{"flag":"VERIFIED"},"term":"senior debt","aliases":["dette senior","senior secured","senior-debt","dette de premier rang","TLA","term loan A"],"definition":{"fr":"Dette de premier rang, garantie par des sûretés et remboursée en priorité en cas de défaut. La moins chère de la structure ; en LBO elle inclut souvent un Term Loan A amortissable, un Term Loan B in fine et un revolver.","en":"First-ranking debt, secured by collateral and repaid first in a default. The cheapest layer of the structure; in an LBO it typically includes an amortizing Term Loan A, a bullet Term Loan B and a revolver."},"related":["gl.term-loan-b","gl.revolver","gl.mezzanine"]},{"id":"gl.term-loan-b","type":"glossaryTerm","level":3,"topic":"LevFin","tags":["LevFin"],"difficulty":3,"source":{"flag":"VERIFIED"},"term":"Term Loan B","aliases":["TLB","term-loan-b","term loan b","prêt à terme B"],"definition":{"fr":"Tranche de dette senior à amortissement quasi nul (bullet / in fine), de maturité longue (6–7 ans), placée auprès d'investisseurs institutionnels et de CLO. Souvent cov-lite, c'est le pilier du financement LBO large-cap.","en":"A senior debt tranche with little to no amortization (bullet), long maturity (6–7 years), syndicated to institutional investors and CLOs. Often cov-lite, it is the backbone of large-cap LBO financing."},"related":["gl.senior-debt","gl.covenant","gl.bookrunner"]},{"id":"gl.revolver","type":"glossaryTerm","level":2,"topic":"LevFin","tags":["LevFin"],"difficulty":2,"source":{"flag":"VERIFIED"},"term":"revolver","aliases":["RCF","revolving credit facility","ligne de crédit renouvelable","crédit revolving"],"definition":{"fr":"Ligne de crédit renouvelable que l'entreprise tire et rembourse selon ses besoins de trésorerie. Sert surtout à financer le BFR et les pics saisonniers ; souvent peu ou pas tirée à la clôture du LBO.","en":"A revolving credit facility the company draws and repays as cash needs fluctuate. Mainly funds working capital and seasonal swings; often undrawn or lightly drawn at LBO close."},"related":["gl.senior-debt","gl.working-capital","gl.bridge"]},{"id":"gl.bridge","type":"glossaryTerm","level":2,"topic":"LevFin","tags":["LevFin","M&A"],"difficulty":2,"source":{"flag":"VERIFIED"},"term":"bridge","aliases":["bridge loan","prêt relais","crédit relais","bridge financing","bridge-to-bond"],"definition":{"fr":"Prêt relais à court terme finançant une acquisition en attendant un financement permanent (émission obligataire, augmentation de capital). Le bridge-to-bond est ensuite refinancé sur le marché high yield.","en":"A short-term bridge loan that funds an acquisition pending permanent financing (a bond issue, equity raise). A bridge-to-bond is later refinanced in the high yield market."},"related":["gl.revolver","gl.bookrunner"]},{"id":"gl.goodwill","type":"glossaryTerm","level":2,"topic":"Accounting","tags":["Accounting","M&A"],"difficulty":2,"source":{"flag":"VERIFIED"},"term":"goodwill","aliases":["écart d'acquisition","survaleur","goodwill comptable"],"definition":{"fr":"Écart d'acquisition : différence entre le prix payé et la juste valeur de l'actif net acquis. Inscrit à l'actif, il n'est plus amorti (IFRS/US GAAP) mais soumis à des tests de dépréciation (impairment).","en":"The excess of purchase price over the fair value of net assets acquired. Recorded as an asset, it is no longer amortized (IFRS/US GAAP) but tested for impairment."},"related":["gl.synergies","gl.minority-interest"]},{"id":"gl.working-capital","type":"glossaryTerm","level":2,"topic":"Accounting","tags":["Accounting"],"difficulty":2,"source":{"flag":"VERIFIED"},"term":"working capital","aliases":["BFR","besoin en fonds de roulement","net working capital","NWC","working-capital","fonds de roulement"],"definition":{"fr":"Besoin en Fonds de Roulement : actifs d'exploitation courants (stocks + créances clients) − passifs d'exploitation courants (dettes fournisseurs). Une hausse du BFR consomme du cash ; sa maîtrise est un levier opérationnel clé en LBO.","en":"Net Working Capital: current operating assets (inventory + receivables) − current operating liabilities (payables). An increase in NWC consumes cash; managing it is a key operating lever in an LBO."},"related":["gl.fcff","gl.revolver","gl.cash-sweep"]},{"id":"gl.dscr","type":"glossaryTerm","level":3,"topic":"ProjectFinance","tags":["ProjectFinance","LevFin"],"difficulty":3,"source":{"flag":"VERIFIED"},"term":"DSCR","aliases":["debt service coverage ratio","ratio de couverture du service de la dette","ratio de couverture"],"definition":{"fr":"Ratio de couverture du service de la dette : cash flow disponible pour le service de la dette / (intérêts + remboursement de principal) sur une période. Un DSCR > 1 signifie que le projet couvre ses échéances ; pilier des covenants en project finance.","en":"Debt Service Coverage Ratio: cash flow available for debt service / (interest + principal due) over a period. A DSCR > 1 means the project covers its obligations; a cornerstone covenant in project finance."},"related":["gl.llcr","gl.plcr","gl.covenant"]},{"id":"gl.llcr","type":"glossaryTerm","level":4,"topic":"ProjectFinance","tags":["ProjectFinance"],"difficulty":4,"source":{"flag":"VERIFIED"},"term":"LLCR","aliases":["loan life coverage ratio","ratio de couverture sur la durée du prêt"],"definition":{"fr":"Loan Life Coverage Ratio : valeur actuelle des cash flows disponibles sur la durée résiduelle du prêt / dette en cours. Mesure forward-looking de la capacité à rembourser, complémentaire du DSCR.","en":"Loan Life
