blié de soustraire la dette de sortie.","en":"You forgot to subtract the exit debt."}}],"explanation":{"fr":"EV sortie = 60×9 = 540 ; equity sortie = 540 − 200 = 340 ; MoM = 340/150 ≈ 2,27x.","en":"Exit EV = 60×9 = 540; exit equity = 540 − 200 = 340; MoM = 340/150 ≈ 2.27x."},"workings":{"fr":"60×9=540 ; 540−200=340 ; 340/150=2,27.","en":"60×9=540; 540−200=340; 340/150=2.27."}},{"id":"qcm.l1.culture.001","type":"qcm","level":1,"topic":"Fit","tags":["PE","IB"],"difficulty":1,"source":{"flag":"VERIFIED"},"moduleId":"mod.l1.culture","stem":{"fr":"Quelle affirmation décrit le mieux le private equity ?","en":"Which statement best describes private equity?"},"multi":false,"options":[{"id":"a","text":{"fr":"Il conseille des clients sur des fusions contre honoraires.","en":"It advises clients on mergers for fees."},"correct":false,"why":{"fr":"C'est la banque d'affaires (sell-side), pas le PE.","en":"That is investment banking (sell-side), not PE."}},{"id":"b","text":{"fr":"Il investit le capital d'un fonds dans des sociétés non cotées et vit de la plus-value.","en":"It invests a fund's capital into private companies and lives off the capital gain."},"correct":true,"why":{"fr":"C'est bien la définition du PE, métier de propriétaire-investisseur.","en":"This is the PE definition, an owner-investor business."}},{"id":"c","text":{"fr":"Il cote des actions en bourse pour le compte d'émetteurs.","en":"It lists shares on the stock market for issuers."},"correct":false,"why":{"fr":"C'est une activité de marché de capitaux (ECM), pas le PE.","en":"That is equity capital markets (ECM), not PE."}},{"id":"d","text":{"fr":"Il prête de l'argent contre des intérêts fixes.","en":"It lends money for fixed interest."},"correct":false,"why":{"fr":"C'est le rôle d'un créancier/banquier, pas d'un fonds de PE en equity.","en":"That is a creditor/lender's role, not an equity PE fund."}}],"explanation":{"fr":"Le PE est un métier buy-side : il met son capital en risque dans des sociétés non cotées et se rémunère sur la plus-value, contrairement à l'IB qui facture des honoraires.","en":"PE is a buy-side business: it puts its capital at risk in private companies and is rewarded by capital gains, unlike IB which charges fees."},"workings":null},{"id":"qcm.l1.culture.002","type":"qcm","level":1,"topic":"Fit","tags":["GP","LP"],"difficulty":1,"source":{"flag":"VERIFIED"},"moduleId":"mod.l1.culture","stem":{"fr":"Dans un fonds, qui apporte l'essentiel des capitaux et qui gère ?","en":"In a fund, who provides most of the capital and who manages?"},"multi":false,"options":[{"id":"a","text":{"fr":"Les LP apportent le capital, le GP gère.","en":"The LPs provide the capital, the GP manages."},"correct":true,"why":{"fr":"Exact : LP = investisseurs apporteurs, GP = société de gestion.","en":"Correct: LPs = capital-providing investors, GP = management company."}},{"id":"b","text":{"fr":"Le GP apporte le capital, les LP gèrent.","en":"The GP provides the capital, the LPs manage."},"correct":false,"why":{"fr":"Inversé : c'est le GP qui gère et les LP qui apportent.","en":"Reversed: the GP manages and the LPs provide."}},{"id":"c","text":{"fr":"Les deux apportent et gèrent à parts égales.","en":"Both provide and manage equally."},"correct":false,"why":{"fr":"Les rôles sont distincts : gestion vs apport de capital.","en":"The roles are distinct: management vs capital provision."}},{"id":"d","text":{"fr":"Ni l'un ni l'autre, c'est la banque dépositaire.","en":"Neither, it is the depositary bank."},"correct":false,"why":{"fr":"La banque dépositaire ne gère ni n'apporte le capital du fonds.","en":"The depositary bank neither manages nor provides the fund's capital."}}],"explanation":{"fr":"Le GP (General Partner) est la société de gestion rémunérée par frais (~2%) et carried (~20%) ; les LP (Limited Partners) apportent l'essentiel du capital avec responsabilité limitée.","en":"The GP (General Partner) is the management company paid by fees (~2%) and carried (~20%); the LPs (Limited Partners) provide most of the capital with limited liability."},"workings":null},{"id":"qcm.l1.culture.003","type":"qcm","level":1,"topic":"Fit","tags":["dry powder"],"difficulty":1,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l1.culture","stem":{"fr":"Un fonds a levé 1 000 M€ et investi 600 M€. Quel est le dry powder ?","en":"A fund raised 1,000 M€ and invested 600 M€. What is the dry powder?"},"multi":false,"options":[{"id":"a","text":{"fr":"600 M€","en":"600 M€"},"correct":false,"why":{"fr":"C'est le capital déjà investi, pas le dry powder.","en":"That is the capital already invested, not the dry powder."}},{"id":"b","text":{"fr":"400 M€","en":"400 M€"},"correct":true,"why":{"fr":"Dry powder = engagements − investi = 1 000 − 600 = 400.","en":"Dry powder = commitments − invested = 1,000 − 600 = 400."}},{"id":"c","text":{"fr":"1 000 M€","en":"1,000 M€"},"correct":false,"why":{"fr":"C'est le total levé, pas la part non investie.","en":"That is the total raised, not the uninvested part."}},{"id":"d","text":{"fr":"1 600 M€","en":"1,600 M€"},"correct":false,"why":{"fr":"On n'additionne pas levé et investi.","en":"You do not add raised and invested."}}],"explanation":{"fr":"Le dry powder est le capital levé mais non encore investi : 1 000 − 600 = 400 M€.","en":"Dry powder is capital raised but not yet invested: 1,000 − 600 = 400 M€."},"workings":{"fr":"1 000 − 600 = 400 M€.","en":"1,000 − 600 = 400 M€."}},{"id":"qcm.l1.culture.004","type":"qcm","level":1,"topic":"Fit","tags":["maisons européennes"],"difficulty":1,"source":{"flag":"VERIFIED"},"moduleId":"mod.l1.culture","stem":{"fr":"Parmi ces maisons, lesquelles sont des acteurs européens du private equity ? (plusieurs réponses)","en":"Among these houses, which are European private equity players? (multiple answers)"},"multi":true,"options":[{"id":"a","text":{"fr":"Ardian","en":"Ardian"},"correct":true,"why":{"fr":"Maison française majeure.","en":"Major French house."}},{"id":"b","text":{"fr":"Hivest Capital Partners","en":"Hivest Capital Partners"},"correct":true,"why":{"fr":"Maison française small/mid-cap.","en":"French small/mid-cap house."}},{"id":"c","text":{"fr":"EQT","en":"EQT"},"correct":true,"why":{"fr":"Maison suédoise, acteur européen majeur.","en":"Swedish house, major European player."}},{"id":"d","text":{"fr":"Une banque centrale","en":"A central bank"},"correct":false,"why":{"fr":"Une banque centrale n'est pas un fonds de PE.","en":"A central bank is not a PE fund."}}],"explanation":{"fr":"Ardian, Hivest et EQT sont des maisons de PE européennes. Citer ces acteurs (avec PAI, Eurazeo, Tikehau, Bridgepoint, Cinven) montre une bonne connaissance du marché.","en":"Ardian, Hivest and EQT are European PE houses. Naming them (along with PAI, Eurazeo, Tikehau, Bridgepoint, Cinven) shows good market knowledge."},"workings":null},{"id":"qcm.l1.three-statements.001","type":"qcm","level":1,"topic":"Accounting","tags":["bilan"],"difficulty":1,"source":{"flag":"VERIFIED"},"moduleId":"mod.l1.three-statements","stem":{"fr":"Lequel des trois états est un instantané à une date donnée ?","en":"Which of the three statements is a snapshot at a given date?"},"multi":false,"options":[{"id":"a","text":{"fr":"Le compte de résultat","en":"The income statement"},"correct":false,"why":{"fr":"Il couvre une période, pas un instant.","en":"It covers a period, not a point in time."}},{"id":"b","text":{"fr":"Le bilan","en":"The balance sheet"},"correct":true,"why":{"fr":"Le bilan est une photo daté précisément (ex. 31/12).","en":"The balance sheet is a snapshot at a precise date (e.g. 31 Dec)."}},{"id":"c","text":{"fr":"Le tableau de flux","en":"The cash flow statement"},"correct":false,"why":{"fr":"Il retrace des mouvements sur une période.","en":"It tracks movements over a period."}},{"id":"d","text":{"fr":"Aucun des trois","en":"None of the three"},"correct":false,"why":{"fr":"Le bilan est bien un instantané.","en":"The balance sheet is indeed a snapshot."}}],"explanation":{"fr":"Le bilan photographie l'entreprise à une date ; le P&L et le tableau de flux couvrent une période.","en":"The balance sheet snapshots the company at a date; the P&L and cash flow statement cover a period."},"workings":null},{"id":"qcm.l1.three-statements.002","type":"qcm","level":1,"topic":"Accounting","tags":["P&L"],"difficulty":1,"source":{"flag":"VERIFIED"},"moduleId":"mod.l1.three-statements","stem":{"fr":"À quelle question répond le compte de résultat ?","en":"What question does the income statement answer?"},"multi":false,"options":[{"id":"a","text":{"fr":"Que possède et que doit l'entreprise aujourd'hui ?","en":"What does the company own and owe today?"},"correct":false,"why":{"fr":"C'est le bilan.","en":"That is the balance sheet."}},{"id":"b","text":{"fr":"L'entreprise a-t-elle gagné de l'argent sur la période ?","en":"Did the company make money over the period?"},"correct":true,"why":{"fr":"Le P&L mesure la performance (profit) sur une période.","en":"The P&L measures performance (profit) over a period."}},{"id":"c","text":{"fr":"D'où vient et où va le cash ?","en":"Where does cash come from and go?"},"correct":false,"why":{"fr":"C'est le tableau de flux.","en":"That is the cash flow statement."}},{"id":"d","text":{"fr":"Combien d'actions sont en circulation ?","en":"How many shares are outstanding?"},"correct":false,"why":{"fr":"Cette information ne relève pas du rôle premier du P&L.","en":"This is not the primary role of the P&L."}}],"explanation":{"fr":"Le compte de résultat mesure si l'entreprise a été bénéficiaire sur la période (CA − charges = profit).","en":"The income statement measures whether the company was profitable over the period (revenue − costs = profit)."},"workings":null},{"id":"qcm.l1.three-statements.003","type":"qcm","level":1,"topic":"Accounting","tags":["période","instantané"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l1.three-statements","stem":{"fr":"Quels états couvrent une période (et non un instant) ? (plusieurs réponses)","en":"Which statements cover a period (not a point in time)? (multiple answers)"},"multi":true,"options":[{"id":"a","text":{"fr":"Le compte de résultat","en":"The income statement"},"correct":true,"why":{"fr":"Il mesure la performance sur une période.","en":"It measures performance over a period."}},{"id":"b","text":{"fr":"Le tableau de flux","en":"The cash flow statement"},"correct":true,"why":{"fr":"Il retrace les mouvements de cash sur une période.","en":"It tracks cash movements over a period."}},{"id":"c","text":{"fr":"Le bilan","en":"The balance sheet"},"correct":false,"why":{"fr":"Le bilan est un instantané à une date.","en":"The balance sheet is a snapshot at a date."}},{"id":"d","text":{"fr":"Aucun","en":"None"},"correct":false,"why":{"fr":"Deux états couvrent bien une période.","en":"Two statements do cover a period."}}],"explanation":{"fr":"Le P&L et le tableau de flux couvrent une période ; seul le bilan est un instantané daté.","en":"The P&L and cash flow statement cover a period; only the balance sheet is a dated snapshot."},"workings":null},{"id":"qcm.l1.three-statements.004","type":"qcm","level":1,"topic":"Accounting","tags":["liaison"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l1.three-statements","stem":{"fr":"Comment le résultat net relie-t-il le P&L au bilan ?","en":"How does net income link the P&L to the balance sheet?"},"multi":false,"options":[{"id":"a","text":{"fr":"Le résultat net non distribué augmente les capitaux propres.","en":"Undistributed net income increases equity."},"correct":true,"why":{"fr":"Exact : les bénéfices conservés alimentent les réserves.","en":"Correct: retained earnings feed reserves."}},{"id":"b","text":{"fr":"Le résultat net augmente directement la dette financière.","en":"Net income directly increases financial debt."},"correct":false,"why":{"fr":"Le résultat net n'augmente pas la dette.","en":"Net income does not increase debt."}},{"id":"c","text":{"fr":"Le résultat net réduit toujours le goodwill.","en":"Net income always reduces goodwill."},"correct":false,"why":{"fr":"Le goodwill évolue avec les acquisitions/dépréciations, pas le résultat courant.","en":"Goodwill moves with acquisitions/impairments, not ordinary profit."}},{"id":"d","text":{"fr":"Il n'y a aucun lien entre les deux états.","en":"There is no link between the two statements."},"correct":false,"why":{"fr":"Le lien existe via les capitaux propres.","en":"The link exists via equity."}}],"explanation":{"fr":"Le profit conservé (non versé en dividendes) s'ajoute aux capitaux propres du bilan de fin de période : c'est le pont entre P&L et bilan.","en":"Retained profit (not paid as dividends) is added to equity on the end-of-period balance sheet: this is the bridge between P&L and balance sheet."},"workings":null},{"id":"qcm.l1.income-statement.001","type":"qcm","level":1,"topic":"Accounting","tags":["EBITDA"],"difficulty":2,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l1.income-statement","stem":{"fr":"Résultat net 100, impôt 20, intérêts 130, D&A 50. Quel est l'EBITDA ?","en":"Net income 100, tax 20, interest 130, D&A 50. What is EBITDA?"},"multi":false,"options":[{"id":"a","text":{"fr":"250","en":"250"},"correct":false,"why":{"fr":"Il manque le D&A (50).","en":"D&A (50) is missing."}},{"id":"b","text":{"fr":"300","en":"300"},"correct":true,"why":{"fr":"100 + 20 + 130 + 50 = 300.","en":"100 + 20 + 130 + 50 = 300."}},{"id":"c","text":{"fr":"150","en":"150"},"correct":false,"why":{"fr":"Il manque les intérêts et le D&A.","en":"Interest and D&A are missing."}},{"id":"d","text":{"fr":"200","en":"200"},"correct":false,"why":{"fr":"Décompte incomplet des réintégrations.","en":"Incomplete add-backs."}}],"explanation":{"fr":"On reconstitue l'EBITDA de bas en haut en rajoutant impôt, intérêts et D&A au résultat net.","en":"EBITDA is rebuilt bottom-up by adding back tax, interest and D&A to net income."},"workings":{"fr":"EBITDA = 100 + 20 + 130 + 50 = 300.","en":"EBITDA = 100 + 20 + 130 + 50 = 300."}},{"id":"qcm.l1.income-statement.002","type":"qcm","level":1,"topic":"Accounting","tags":["EBITDA","EBE"],"difficulty":1,"source":{"flag":"VERIFIED"},"moduleId":"mod.l1.income-statement","stem":{"fr":"À quel agrégat français correspond l'EBITDA ?","en":"Which French aggregate does EBITDA correspond to?"},"multi":false,"options":[{"id":"a","text":{"fr":"Le résultat net","en":"Net income"},"correct":false,"why":{"fr":"Le résultat net est après intérêts, impôts et D&A.","en":"Net income is after interest, tax and D&A."}},{"id":"b","text":{"fr":"L'EBE (Excédent Brut d'Exploitation)","en":"The EBE (gross operating surplus)"},"correct":true,"why":{"fr":"EBITDA = EBE.","en":"EBITDA = EBE."}},{"id":"c","text":{"fr":"La marge brute","en":"Gross margin"},"correct":false,"why":{"fr":"La marge brute est avant les frais généraux.","en":"Gross margin is before overheads."}},{"id":"d","text":{"fr":"Le chiffre d'affaires","en":"Revenue"},"correct":false,"why":{"fr":"Le CA est le sommet du compte de résultat.","en":"Revenue is the top line."}}],"explanation":{"fr":"L'EBITDA est l'équivalent anglo-saxon de l'EBE français : le résultat d'exploitation avant amortissements, intérêts et impôts.","en":"EBITDA is the Anglo-Saxon equivalent of the French EBE: operating profit before depreciation, interest and tax."},"workings":null},{"id":"qcm.l1.income-statement.003","type":"qcm","level":1,"topic":"Accounting","tags":["IS"],"difficulty":1,"source":{"flag":"VERIFIED"},"moduleId":"mod.l1.income-statement","stem":{"fr":"Quel est le taux normal d'impôt sur les sociétés en France aujourd'hui ?","en":"What is the standard corporate income tax rate in France today?"},"multi":false,"options":[{"id":"a","text":{"fr":"~25%","en":"~25%"},"correct":true,"why":{"fr":"Le taux normal est désormais d'environ 25%.","en":"The standard rate is now about 25%."}},{"id":"b","text":{"fr":"~33%","en":"~33%"},"correct":false,"why":{"fr":"C'est l'ancien taux, plus en vigueur.","en":"That is the old rate, no longer applicable."}},{"id":"c","text":{"fr":"~40%","en":"~40%"},"correct":false,"why":{"fr":"Aucun rapport avec le taux français actuel.","en":"Unrelated to the current French rate."}},{"id":"d","text":{"fr":"~15%","en":"~15%"},"correct":false,"why":{"fr":"15% est un taux réduit sur une tranche limitée, pas le taux normal.","en":"15% is a reduced rate on a limited bracket, not the standard rate."}}],"explanation":{"fr":"Le taux normal d'IS en France est d'environ 25% (et non 33% comme par le passé).","en":"The standard French corporate tax rate is about 25% (not 33% as in the past)."},"workings":null},{"id":"qcm.l1.income-statement.004","type":"qcm","level":1,"topic":"Accounting","tags":["HT","TTC","EBIT"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l1.income-statement","stem":{"fr":"Quelles affirmations sont correctes ? (plusieurs réponses)","en":"Which statements are correct? (multiple answers)"},"multi":true,"options":[{"id":"a","text":{"fr":"Le chiffre d'affaires se mesure HT.","en":"Revenue is measured excl. VAT."},"correct":true,"why":{"fr":"La TVA n'est pas un revenu de l'entreprise.","en":"VAT is not company revenue."}},{"id":"b","text":{"fr":"EBIT = EBITDA − D&A.","en":"EBIT = EBITDA − D&A."},"correct":true,"why":{"fr":"L'EBIT est l'EBITDA après amortissements.","en":"EBIT is EBITDA after depreciation."}},{"id":"c","text":{"fr":"L'EBITDA est égal au résultat net.","en":"EBITDA equals net income."},"correct":false,"why":{"fr":"Le résultat net est après intérêts, impôts et D&A.","en":"Net income is after interest, tax and D&A."}},{"id":"d","text":{"fr":"La TVA fait partie du chiffre d'affaires.","en":"VAT is part of revenue."},"correct":false,"why":{"fr":"La TVA est collectée pour l'État, hors CA.","en":"VAT is collected for the State, outside revenue."}}],"explanation":{"fr":"Le CA est en HT et EBIT = EBITDA − D&A. L'EBITDA n'est pas le résultat net, et la TVA n'est pas du chiffre d'affaires.","en":"Revenue is excl. VAT and EBIT = EBITDA − D&A. EBITDA is not net income, and VAT is not revenue."},"workings":null},{"id":"qcm.l1.balance-sheet.001","type":"qcm","level":1,"topic":"Accounting","tags":["bilan"],"difficulty":1,"source":{"flag":"VERIFIED"},"moduleId":"mod.l1.balance-sheet","stem":{"fr":"Quelle est l'égalité fondamentale du bilan ?","en":"What is the fundamental balance-sheet identity?"},"multi":false,"options":[{"id":"a","text":{"fr":"Actif = Passif","en":"Assets = Liabilities + Equity"},"correct":true,"why":{"fr":"Chaque euro d'actif a une source de financement.","en":"Every euro of assets has a financing source."}},{"id":"b","text":{"fr":"Actif = Capitaux propres uniquement","en":"Assets = Equity only"},"correct":false,"why":{"fr":"Il manque les dettes au passif.","en":"Debt is missing from the financing side."}},{"id":"c","text":{"fr":"Actif = Chiffre d'affaires","en":"Assets = Revenue"},"correct":false,"why":{"fr":"Le CA est une donnée de période, pas un poste de bilan.","en":"Revenue is a period figure, not a balance-sheet line."}},{"id":"d","text":{"fr":"Actif = Résultat net","en":"Assets = Net income"},"correct":false,"why":{"fr":"Le résultat net n'égale pas l'actif total.","en":"Net income does not equal total assets."}}],"explanation":{"fr":"Actif = Passif (dettes + capitaux propres) tient toujours par construction : tout actif est financé soit par de la dette, soit par les actionnaires.","en":"Assets = Liabilities + Equity always holds by construction: every asset is financed either by debt or by shareholders."},"workings":null},{"id":"qcm.l1.balance-sheet.002","type":"qcm","level":1,"topic":"Accounting","tags":["BFR","working capital"],"difficulty":2,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l1.balance-sheet","stem":{"fr":"Stocks 40, créances clients 30, dettes fournisseurs 50. Quel est le BFR ?","en":"Inventory 40, receivables 30, payables 50. What is working capital?"},"multi":false,"options":[{"id":"a","text":{"fr":"20","en":"20"},"correct":true,"why":{"fr":"40 + 30 − 50 = 20.","en":"40 + 30 − 50 = 20."}},{"id":"b","text":{"fr":"120","en":"120"},"correct":false,"why":{"fr":"On ne somme pas tous les postes positivement.","en":"You do not sum all items positively."}},{"id":"c","text":{"fr":"−20","en":"−20"},"correct":false,"why":{"fr":"Erreur de signe : on soustrait les fournisseurs, pas les actifs courants.","en":"Sign error: subtract payables, not current assets."}},{"id":"d","text":{"fr":"70","en":"70"},"correct":false,"why":{"fr":"On a oublié de soustraire les dettes fournisseurs.","en":"Payables were not subtracted."}}],"explanation":{"fr":"BFR ≈ stocks + créances clients − dettes fournisseurs = 40 + 30 − 50 = 20.","en":"Working capital ≈ inventory + receivables − payables = 40 + 30 − 50 = 20."},"workings":{"fr":"40 + 30 − 50 = 20.","en":"40 + 30 − 50 = 20."}},{"id":"qcm.l1.balance-sheet.003","type":"qcm","level":1,"topic":"Accounting","tags":["BFR négatif"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l1.balance-sheet","stem":{"fr":"Un BFR négatif est-il forcément le signe d'un problème ?","en":"Is negative working capital necessarily a sign of trouble?"},"multi":false,"options":[{"id":"a","text":{"fr":"Oui, c'est toujours mauvais.","en":"Yes, it is always bad."},"correct":false,"why":{"fr":"Faux : il peut être très sain dans certains modèles.","en":"False: it can be very healthy in some models."}},{"id":"b","text":{"fr":"Non, dans le retail ou l'abonnement il peut être sain.","en":"No, in retail or subscription it can be healthy."},"correct":true,"why":{"fr":"Le client paie avant le fournisseur : le BFR négatif finance la croissance.","en":"Customers pay before suppliers: negative working capital funds growth."}},{"id":"c","text":{"fr":"Non, car il signifie que l'entreprise n'a aucune dette.","en":"No, because it means the company has no debt."},"correct":false,"why":{"fr":"Le BFR ne dit rien de la dette financière.","en":"Working capital says nothing about financial debt."}},{"id":"d","text":{"fr":"Oui, car l'actif devient négatif.","en":"Yes, because assets turn negative."},"correct":false,"why":{"fr":"Un BFR négatif ne rend pas l'actif total négatif.","en":"Negative working capital does not make total assets negative."}}],"explanation":{"fr":"Un BFR négatif signifie que l'entreprise encaisse ses clients avant de payer ses fournisseurs (retail, abonnement) : c'est une source de financement gratuite, souvent un signe sain.","en":"Negative working capital means the company collects from customers before paying suppliers (retail, subscription): it is a free source of financing, often a healthy sign."},"workings":null},{"id":"qcm.l1.balance-sheet.004","type":"qcm","level":1,"topic":"Accounting","tags":["goodwill"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l1.balance-sheet","stem":{"fr":"Qu'est-ce que le goodwill ?","en":"What is goodwill?"},"multi":false,"options":[{"id":"a","text":{"fr":"Le surprix payé au-dessus de la valeur comptable des actifs nets d'une cible.","en":"The premium paid above the book value of a target's net assets."},"correct":true,"why":{"fr":"C'est bien la définition de l'écart d'acquisition.","en":"This is the definition of acquisition goodwill."}},{"id":"b","text":{"fr":"La trésorerie disponible de l'entreprise.","en":"The company's available cash."},"correct":false,"why":{"fr":"Le goodwill n'est pas du cash.","en":"Goodwill is not cash."}},{"id":"c","text":{"fr":"Le total des dettes fournisseurs.","en":"Total payables."},"correct":false,"why":{"fr":"Les fournisseurs relèvent du BFR.","en":"Payables belong to working capital."}},{"id":"d","text":{"fr":"Le résultat net de l'année.","en":"The year's net income."},"correct":false,"why":{"fr":"Le goodwill est un poste d'actif, pas un résultat.","en":"Goodwill is an asset line, not a profit."}}],"explanation":{"fr":"Le goodwill est l'écart d'acquisition : le surprix versé pour des incorporels (marque, synergies) au-dessus de la valeur comptable des actifs nets. Il est testé pour dépréciation en IFRS.","en":"Goodwill is acquisition goodwill: the premium paid for intangibles (brand, synergies) above the book value of net assets. It is impairment-tested under IFRS."},"workings":null},{"id":"qcm.l1.cash-flow.001","type":"qcm","level":1,"topic":"Accounting","tags":["D&A"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l1.cash-flow","stem":{"fr":"Pourquoi rajoute-t-on le D&A au résultat net dans le flux d'exploitation ?","en":"Why is D&A added back to net income in operating cash flow?"},"multi":false,"options":[{"id":"a","text":{"fr":"Parce que c'est une charge non-cash sans sortie de trésorerie sur la période.","en":"Because it is a non-cash charge with no cash outflow in the period."},"correct":true,"why":{"fr":"Exact : le cash est sorti à l'achat de l'actif, pas à l'amortissement.","en":"Correct: cash left when the asset was bought, not at depreciation."}},{"id":"b","text":{"fr":"Parce que le D&A est une sortie de cash récurrente.","en":"Because D&A is a recurring cash outflow."},"correct":false,"why":{"fr":"Justement non : le D&A ne consomme pas de cash sur la période.","en":"Precisely not: D&A consumes no cash in the period."}},{"id":"c","text":{"fr":"Parce que le D&A augmente le chiffre d'affaires.","en":"Because D&A increases revenue."},"correct":false,"why":{"fr":"Le D&A est une charge, sans lien avec le CA.","en":"D&A is a charge, unrelated to revenue."}},{"id":"d","text":{"fr":"Parce que le D&A est un dividende.","en":"Because D&A is a dividend."},"correct":false,"why":{"fr":"Aucun rapport : le D&A est un amortissement comptable.","en":"Unrelated: D&A is an accounting depreciation."}}],"explanation":{"fr":"Le D&A réduit le résultat net au P&L mais ne correspond à aucune sortie de cash : on le rajoute donc pour retrouver le cash réellement généré.","en":"D&A reduces net income in the P&L but involves no cash outflow: it is added back to recover the cash actually generated."},"workings":null},{"id":"qcm.l1.cash-flow.002","type":"qcm","level":1,"topic":"Accounting","tags":["BFR"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l1.cash-flow","stem":{"fr":"Quel est l'effet d'une hausse du BFR sur la trésorerie ?","en":"What is the effect of a rise in working capital on cash?"},"multi":false,"options":[{"id":"a","text":{"fr":"Elle consomme du cash.","en":"It consumes cash."},"correct":true,"why":{"fr":"Argent immobilisé dans les stocks et créances.","en":"Money tied up in inventory and receivables."}},{"id":"b","text":{"fr":"Elle libère du cash.","en":"It frees cash."},"correct":false,"why":{"fr":"C'est une baisse du BFR qui libère du cash.","en":"It is a fall in working capital that frees cash."}},{"id":"c","text":{"fr":"Elle n'a aucun effet sur la trésorerie.","en":"It has no effect on cash."},"correct":false,"why":{"fr":"La variation de BFR impacte directement le flux d'exploitation.","en":"The change in working capital directly affects operating cash flow."}},{"id":"d","text":{"fr":"Elle augmente le résultat net.","en":"It increases net income."},"correct":false,"why":{"fr":"Le BFR est un poste de bilan, pas une charge du P&L.","en":"Working capital is a balance-sheet item, not a P&L charge."}}],"explanation":{"fr":"Une hausse du BFR (stocks/créances en hausse) immobilise du cash : on la soustrait dans le flux d'exploitation. Une baisse en libère.","en":"A rise in working capital (higher inventory/receivables) ties up cash: it is subtracted in operating cash flow. A fall frees cash."},"workings":null},{"id":"qcm.l1.cash-flow.003","type":"qcm","level":1,"topic":"Accounting","tags":["flux exploitation"],"difficulty":2,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l1.cash-flow","stem":{"fr":"Résultat net 100, D&A 50, hausse du BFR 30. Quel est le flux d'exploitation ?","en":"Net income 100, D&A 50, working capital rise 30. What is operating cash flow?"},"multi":false,"options":[{"id":"a","text":{"fr":"120","en":"120"},"correct":true,"why":{"fr":"100 + 50 − 30 = 120.","en":"100 + 50 − 30 = 120."}},{"id":"b","text":{"fr":"180","en":"180"},"correct":false,"why":{"fr":"On a ajouté la hausse de BFR au lieu de la soustraire.","en":"The working-capital rise was added instead of subtracted."}},{"id":"c","text":{"fr":"100","en":"100"},"correct":false,"why":{"fr":"On a ignoré le D&A et le BFR.","en":"D&A and working capital were ignored."}},{"id":"d","text":{"fr":"20","en":"20"},"correct":false,"why":{"fr":"On a soustrait le D&A au lieu de l'ajouter.","en":"D&A was subtracted instead of added."}}],"explanation":{"fr":"Flux d'exploitation = résultat net + D&A (non-cash) − hausse du BFR = 100 + 50 − 30 = 120.","en":"Operating cash flow = net income + D&A (non-cash) − working-capital rise = 100 + 50 − 30 = 120."},"workings":{"fr":"100 + 50 − 30 = 120.","en":"100 + 50 − 30 = 120."}},{"id":"qcm.l1.cash-flow.004","type":"qcm","level":1,"topic":"Accounting","tags":["sections"],"difficulty":1,"source":{"flag":"VERIFIED"},"moduleId":"mod.l1.cash-flow","stem":{"fr":"Quelles sont les sections du tableau de flux ? (plusieurs réponses)","en":"What are the cash flow statement sections? (multiple answers)"},"multi":true,"options":[{"id":"a","text":{"fr":"Flux d'exploitation","en":"Operating cash flow"},"correct":true,"why":{"fr":"Cash de l'activité courante.","en":"Cash from day-to-day activity."}},{"id":"b","text":{"fr":"Flux d'investissement","en":"Investing cash flow"},"correct":true,"why":{"fr":"Achats/cessions d'actifs (capex).","en":"Asset purchases/sales (capex)."}},{"id":"c","text":{"fr":"Flux de financement","en":"Financing cash flow"},"correct":true,"why":{"fr":"Dette, capital, dividendes.","en":"Debt, equity, dividends."}},{"id":"d","text":{"fr":"Flux de goodwill","en":"Goodwill cash flow"},"correct":false,"why":{"fr":"Il n'existe pas de section « goodwill ».","en":"There is no \"goodwill\" section."}}],"explanation":{"fr":"Le tableau de flux comprend trois sections : exploitation, investissement et financement ; leur somme donne la variation de trésorerie.","en":"The cash flow statement has three sections: operating, investing and financing; their sum gives the change in cash."},"workings":null},{"id":"qcm.l1.vocab.001","type":"qcm","level":1,"topic":"Fit","tags":["actionnaire","créancier"],"difficulty":1,"source":{"flag":"VERIFIED"},"moduleId":"mod.l1.vocab","stem":{"fr":"En cas de faillite, qui est servi en premier ?","en":"In bankruptcy, who is served first?"},"multi":false,"options":[{"id":"a","text":{"fr":"Le créancier","en":"The creditor"},"correct":true,"why":{"fr":"Les créanciers sont remboursés en priorité.","en":"Creditors are repaid in priority."}},{"id":"b","text":{"fr":"L'actionnaire","en":"The shareholder"},"correct":false,"why":{"fr":"L'actionnaire passe en dernier.","en":"The shareholder comes last."}},{"id":"c","text":{"fr":"Les deux à parts égales","en":"Both equally"},"correct":false,"why":{"fr":"L'ordre de priorité est strict, pas égalitaire.","en":"The priority order is strict, not equal."}},{"id":"d","text":{"fr":"Aucun n'est jamais remboursé","en":"Neither is ever repaid"},"correct":false,"why":{"fr":"Les créanciers récupèrent au moins une partie en priorité.","en":"Creditors recover at least part in priority."}}],"explanation":{"fr":"L'ordre de priorité place les créanciers avant les actionnaires : ces derniers, propriétaires, supportent le risque résiduel et passent en dernier.","en":"The priority order places creditors before shareholders: the latter, as owners, bear the residual risk and come last."},"workings":null},{"id":"qcm.l1.vocab.002","type":"qcm","level":1,"topic":"Fit","tags":["dette","equity"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l1.vocab","stem":{"fr":"Quelles affirmations sur dette et equity sont correctes ? (plusieurs réponses)","en":"Which statements about debt and equity are correct? (multiple answers)"},"multi":true,"options":[{"id":"a","text":{"fr":"Les intérêts de la dette sont déductibles fiscalement.","en":"Debt interest is tax-deductible."},"correct":true,"why":{"fr":"C'est un avantage fiscal de la dette.","en":"This is a tax advantage of debt."}},{"id":"b","text":{"fr":"L'equity n'a pas d'échéance de remboursement.","en":"Equity has no repayment deadline."},"correct":true,"why":{"fr":"Les capitaux propres ne se remboursent pas à une date fixe.","en":"Equity is not repaid at a fixed date."}},{"id":"c","text":{"fr":"La dette est généralement plus chère que l'equity.","en":"Debt is generally more expensive than equity."},"correct":false,"why":{"fr":"C'est l'inverse : la dette est moins chère car moins risquée.","en":"It is the reverse: debt is cheaper because less risky."}},{"id":"d","text":{"fr":"Les dividendes sont déductibles comme les intérêts.","en":"Dividends are deductible like interest."},"correct":false,"why":{"fr":"Les dividendes ne sont pas déductibles.","en":"Dividends are not deductible."}}],"explanation":{"fr":"La dette est moins chère et ses intérêts sont déductibles, mais elle est rigide ; l'equity est plus chère, sans échéance et plus flexible. Les dividendes ne sont pas déductibles.","en":"Debt is cheaper and its interest deductible, but rigid; equity is more expensive, with no deadline and more flexible. Dividends are not deductible."},"workings":null},{"id":"qcm.l1.vocab.003","type":"qcm","level":1,"topic":"Fit","tags":["NDA"],"difficulty":1,"source":{"flag":"VERIFIED"},"moduleId":"mod.l1.vocab","stem":{"fr":"Qu'est-ce qu'un NDA dans un processus de transaction ?","en":"What is an NDA in a transaction process?"},"multi":false,"options":[{"id":"a","text":{"fr":"Un accord de confidentialité signé avant l'accès aux informations.","en":"A confidentiality agreement signed before access to information."},"correct":true,"why":{"fr":"C'est souvent le premier document, avant la dataroom.","en":"It is often the first document, before the dataroom."}},{"id":"b","text":{"fr":"Le contrat définitif de vente.","en":"The final sale contract."},"correct":false,"why":{"fr":"Le NDA précède l'opération, ce n'est pas le contrat de cession.","en":"The NDA precedes the deal; it is not the sale contract."}},{"id":"c","text":{"fr":"Un prêt accordé par la banque.","en":"A loan granted by the bank."},"correct":false,"why":{"fr":"Le NDA n'a rien d'un financement.","en":"An NDA is not financing."}},{"id":"d","text":{"fr":"Un dividende exceptionnel.","en":"An exceptional dividend."},"correct":false,"why":{"fr":"Aucun rapport avec une distribution.","en":"Unrelated to a distribution."}}],"explanation":{"fr":"Le NDA (Non-Disclosure Agreement) engage celui qui reçoit des informations sensibles à ne pas les divulguer ; c'est le préalable à l'accès à la dataroom.","en":"The NDA (Non-Disclosure Agreement) binds the party receiving sensitive information not to disclose it; it precedes dataroom access."},"workings":null},{"id":"qcm.l1.vocab.004","type":"qcm","level":1,"topic":"Fit","tags":["prix","valeur"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l1.vocab","stem":{"fr":"Quelle affirmation distingue correctement prix et valeur ?","en":"Which statement correctly distinguishes price and value?"},"multi":false,"options":[{"id":"a","text":{"fr":"La valeur est une estimation ; le prix est ce qui est réellement payé.","en":"Value is an estimate; price is what is actually paid."},"correct":true,"why":{"fr":"« Le prix est ce que vous payez, la valeur ce que vous obtenez. »","en":"\"Price is what you pay, value is what you get.\""}},{"id":"b","text":{"fr":"Le prix et la valeur sont toujours identiques.","en":"Price and value are always identical."},"correct":false,"why":{"fr":"Ils diffèrent souvent ; tout l'enjeu de l'investissement est cet écart.","en":"They often differ; the whole point of investing is this gap."}},{"id":"c","text":{"fr":"La valeur est ce qui est payé ; le prix est une estimation.","en":"Value is what is paid; price is an estimate."},"correct":false,"why":{"fr":"C'est inversé.","en":"This is reversed."}},{"id":"d","text":{"fr":"Le prix dépend uniquement de l'analyse DCF.","en":"Price depends only on the DCF analysis."},"correct":false,"why":{"fr":"Le prix résulte de la négociation acheteur-vendeur, pas que d'un modèle.","en":"Price results from buyer-seller negotiation, not just a model."}}],"explanation":{"fr":"La valeur est estimée par l'analyse (DCF, multiples) et dépend des hypothèses ; le prix est fixé par la transaction. Acheter en dessous de la valeur perçue est l'objectif de l'investisseur.","en":"Value is estimated by analysis (DCF, multiples) and depends on assumptions; price is set by the transaction. Buying below perceived value is the investor's goal."},"workings":null},{"id":"qcm.l2.linkage.001","type":"qcm","level":2,"topic":"Accounting","tags":["linkage","net income"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l2.linkage","stem":{"fr":"Le résultat net alimente quels états ?","en":"Net income feeds which statements?"},"multi":true,"options":[{"id":"a","text":{"fr":"Les capitaux propres (réserves) au bilan","en":"Balance-sheet equity (retained earnings)"},"correct":true,"why":{"fr":"Résultat net − dividendes = variation des réserves.","en":"Net income − dividends = change in retained earnings."}},{"id":"b","text":{"fr":"La première ligne du tableau de flux (méthode indirecte)","en":"The top line of the cash flow statement (indirect method)"},"correct":true,"why":{"fr":"Le tableau de flux indirect démarre du résultat net.","en":"The indirect cash flow statement starts from net income."}},{"id":"c","text":{"fr":"Le chiffre d'affaires de l'exercice suivant","en":"Next year's revenue"},"correct":false,"why":{"fr":"Aucun lien comptable de ce type.","en":"No such accounting link exists."}},{"id":"d","text":{"fr":"Les immobilisations brutes","en":"Gross fixed assets"},"correct":false,"why":{"fr":"Les immobilisations dépendent des capex et du D&A, pas du résultat net.","en":"Fixed assets depend on capex and D&A, not net income."}}],"explanation":{"fr":"Le résultat net est le point de jonction : il alimente à la fois les capitaux propres (via réserves) et le tableau de flux (1re ligne en méthode indirecte).","en":"Net income is the junction point: it feeds both equity (via retained earnings) and the cash flow statement (top line in the indirect method)."},"workings":null},{"id":"qcm.l2.linkage.002","type":"qcm","level":2,"topic":"Accounting","tags":["D&A","tax"],"difficulty":3,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l2.linkage","stem":{"fr":"Le [[D&A]] augmente de 10, IS à 25%. De combien varie la trésorerie ?","en":"[[D&A]] rises by 10, 25% tax. By how much does cash change?"},"multi":false,"options":[{"id":"a","text":{"fr":"+10","en":"+10"},"correct":false,"why":{"fr":"On oublie l'effet d'impôt sur le résultat net.","en":"This ignores the tax effect on net income."}},{"id":"b","text":{"fr":"+2,5","en":"+2.5"},"correct":true,"why":{"fr":"Résultat net −7,5, on réintègre +10 de D&A : flux net +2,5 (l'économie d'impôt).","en":"Net income −7.5, add back +10 of D&A: net flow +2.5 (the tax shield)."}},{"id":"c","text":{"fr":"−7,5","en":"−7.5"},"correct":false,"why":{"fr":"C'est l'impact sur le résultat net, pas sur le cash.","en":"That is the impact on net income, not on cash."}},{"id":"d","text":{"fr":"0","en":"0"},"correct":false,"why":{"fr":"Le D&A génère une économie d'impôt bien réelle.","en":"D&A generates a real tax saving."}}],"explanation":{"fr":"Le D&A est non-cash mais déductible : il crée une économie d'impôt. Net : +2,5.","en":"D&A is non-cash but deductible: it creates a tax saving. Net: +2.5."},"workings":{"fr":"ΔRN = −10 × (1 − 0,25) = −7,5 ; cash = −7,5 + 10 = +2,5.","en":"ΔNI = −10 × (1 − 0.25) = −7.5; cash = −7.5 + 10 = +2.5."}},{"id":"qcm.l2.linkage.004","type":"qcm","level":2,"topic":"Accounting","tags":["tie-out"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l2.linkage","stem":{"fr":"Quel est le test de cohérence final d'un modèle à 3 états ?","en":"What is the final consistency check of a 3-statement model?"},"multi":false,"options":[{"id":"a","text":{"fr":"Trésorerie d'ouverture + Σ des 3 flux = trésorerie de clôture du bilan","en":"Opening cash + Σ of the 3 flows = balance-sheet closing cash"},"correct":true,"why":{"fr":"C'est le bouclage qui prouve la cohérence des trois états.","en":"This is the tie-out proving the three statements are consistent."}},{"id":"b","text":{"fr":"Résultat net = variation de trésorerie","en":"Net income = change in cash"},"correct":false,"why":{"fr":"Faux : capex, BFR et non-cash creusent l'écart.","en":"Wrong: capex, working capital and non-cash items create a gap."}},{"id":"c","text":{"fr":"EBITDA = flux d'exploitation","en":"EBITDA = operating cash flow"},"correct":false,"why":{"fr":"L'EBITDA ignore impôts et variation de BFR.","en":"EBITDA ignores taxes and the change in working capital."}},{"id":"d","text":{"fr":"Capitaux propres = trésorerie","en":"Equity = cash"},"correct":false,"why":{"fr":"Aucune égalité comptable de ce type.","en":"No such accounting identity exists."}}],"explanation":{"fr":"Si la trésorerie de clôture du tableau de flux ne colle pas au bilan, le modèle est faux.","en":"If the cash-flow closing cash does not match the balance sheet, the model is wrong."},"workings":null},{"id":"qcm.l2.linkage.003","type":"qcm","level":2,"topic":"Accounting","tags":["working capital"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l2.linkage","stem":{"fr":"Une hausse des stocks a quel effet sur le flux de trésorerie d'exploitation ?","en":"An increase in inventory has what effect on operating cash flow?"},"multi":false,"options":[{"id":"a","text":{"fr":"Effet négatif : du cash est immobilisé","en":"Negative: cash is tied up"},"correct":true,"why":{"fr":"Une hausse d'actif d'exploitation consomme du cash (le BFR augmente).","en":"An increase in operating assets consumes cash (working capital rises)."}},{"id":"b","text":{"fr":"Effet positif : libère du cash","en":"Positive: frees cash"},"correct":false,"why":{"fr":"C'est l'inverse ; seule une baisse de stocks libère du cash.","en":"It is the opposite; only a decrease in inventory frees cash."}},{"id":"c","text":{"fr":"Aucun effet sur le cash","en":"No effect on cash"},"correct":false,"why":{"fr":"Toute variation de BFR a un effet de trésorerie.","en":"Any change in working capital has a cash effect."}},{"id":"d","text":{"fr":"Effet uniquement en flux de financement","en":"Effect only in financing flows"},"correct":false,"why":{"fr":"Le BFR relève de l'exploitation.","en":"Working capital belongs to operating flows."}}],"explanation":{"fr":"Hausse d'actif d'exploitation = augmentation du BFR = consommation de cash, en flux d'exploitation.","en":"An increase in operating assets = higher working capital = cash consumption, in operating flows."},"workings":null},{"id":"qcm.l2.fcf.001","type":"qcm","level":2,"topic":"DCF","tags":["FCFF"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l2.fcf","stem":{"fr":"Quelle est la formule correcte du [[FCFF]] à partir de l'EBITDA ?","en":"What is the correct formula for [[FCFF]] from EBITDA?"},"multi":false,"options":[{"id":"a","text":{"fr":"EBITDA − impôts − Δ[[BFR]] − capex","en":"EBITDA − taxes − Δworking capital − capex"},"correct":true,"why":{"fr":"C'est le pont standard EBITDA → FCFF (impôt calculé sur l'EBIT).","en":"This is the standard EBITDA → FCFF bridge (tax on EBIT)."}},{"id":"b","text":{"fr":"EBITDA − intérêts − impôts","en":"EBITDA − interest − taxes"},"correct":false,"why":{"fr":"Le FCFF est avant dette : pas d'intérêts, et il manque capex et BFR.","en":"FCFF is pre-debt: no interest, and capex and working capital are missing."}},{"id":"c","text":{"fr":"EBITDA + capex − impôts","en":"EBITDA + capex − taxes"},"correct":false,"why":{"fr":"Le capex se retranche, il ne s'ajoute pas.","en":"Capex is subtracted, not added."}},{"id":"d","text":{"fr":"Résultat net + D&A","en":"Net income + D&A"},"correct":false,"why":{"fr":"Cela part du résultat net (après dette) et oublie capex et BFR.","en":"This starts from net income (post-debt) and omits capex and working capital."}}],"explanation":{"fr":"[[FCFF]] = EBITDA − impôts (sur EBIT) − Δ[[BFR]] − capex, actualisé au [[WACC]].","en":"[[FCFF]] = EBITDA − taxes (on EBIT) − Δworking capital − capex, discounted at [[WACC]]."},"workings":null},{"id":"qcm.l2.fcf.002","type":"qcm","level":2,"topic":"DCF","tags":["NOPAT","FCFF"],"difficulty":3,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l2.fcf","stem":{"fr":"EBIT 300, IS 25%, D&A 50, capex 30, Δ[[BFR]] 20. Quel est le [[FCFF]] ?","en":"EBIT 300, 25% tax, D&A 50, capex 30, Δworking capital 20. What is [[FCFF]]?"},"multi":false,"options":[{"id":"a","text":{"fr":"225","en":"225"},"correct":true,"why":{"fr":"NOPAT 225 + 50 − 30 − 20 = 225.","en":"NOPAT 225 + 50 − 30 − 20 = 225."}},{"id":"b","text":{"fr":"300","en":"300"},"correct":false,"why":{"fr":"On oublie l'impôt et les ajustements de cash.","en":"This ignores tax and the cash adjustments."}},{"id":"c","text":{"fr":"275","en":"275"},"correct":false,"why":{"fr":"On a oublié de retrancher capex et Δ[[BFR]].","en":"Capex and Δworking capital were not subtracted."}},{"id":"d","text":{"fr":"175","en":"175"},"correct":false,"why":{"fr":"On a oublié de réintégrer le D&A.","en":"D&A was not added back."}}],"explanation":{"fr":"On calcule le NOPAT puis on ajuste les éléments cash.","en":"Compute NOPAT then adjust for cash items."},"workings":{"fr":"NOPAT = 300 × (1 − 0,25) = 225 ; FCFF = 225 + 50 − 30 − 20 = 225.","en":"NOPAT = 300 × (1 − 0.25) = 225; FCFF = 225 + 50 − 30 − 20 = 225."}},{"id":"qcm.l2.fcf.003","type":"qcm","level":2,"topic":"DCF","tags":["discount rate"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l2.fcf","stem":{"fr":"Quelles associations flux/taux d'actualisation sont correctes ?","en":"Which flow / discount-rate pairings are correct?"},"multi":true,"options":[{"id":"a","text":{"fr":"[[FCFF]] actualisé au [[WACC]]","en":"[[FCFF]] discounted at [[WACC]]"},"correct":true,"why":{"fr":"Le FCFF rémunère tous les bailleurs : WACC.","en":"FCFF pays all capital providers: WACC."}},{"id":"b","text":{"fr":"[[FCFE]] actualisé au coût des fonds propres Re","en":"[[FCFE]] discounted at the cost of equity Re"},"correct":true,"why":{"fr":"Le FCFE ne revient qu'aux actionnaires : Re.","en":"FCFE goes only to shareholders: Re."}},{"id":"c","text":{"fr":"[[FCFF]] actualisé à Re","en":"[[FCFF]] discounted at Re"},"correct":false,"why":{"fr":"Incohérent : le FCFF est avant dette, on utilise le WACC.","en":"Inconsistent: FCFF is pre-debt, use WACC."}},{"id":"d","text":{"fr":"[[FCFE]] actualisé au [[WACC]]","en":"[[FCFE]] discounted at [[WACC]]"},"correct":false,"why":{"fr":"Incohérent : le FCFE est après dette, on utilise Re.","en":"Inconsistent: FCFE is post-debt, use Re."}}],"explanation":{"fr":"Règle de cohérence : flux avant dette ↔ WACC, flux après dette ↔ Re.","en":"Consistency rule: pre-debt flow ↔ WACC, post-debt flow ↔ Re."},"workings":null},{"id":"qcm.l2.fcf.004","type":"qcm","level":2,"topic":"DCF","tags":["EBITDA"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l2.fcf","stem":{"fr":"Pourquoi l'[[EBITDA]] surestime-t-il le cash généré ?","en":"Why does [[EBITDA]] overstate the cash generated?"},"multi":false,"options":[{"id":"a","text":{"fr":"Il ignore impôts, capex et variation de [[BFR]]","en":"It ignores taxes, capex and the change in working capital"},"correct":true,"why":{"fr":"Ce sont trois sorties réelles non capturées par l'EBITDA.","en":"These are three real outflows not captured by EBITDA."}},{"id":"b","text":{"fr":"Il inclut le D&A","en":"It includes D&A"},"correct":false,"why":{"fr":"L'EBITDA est justement avant D&A.","en":"EBITDA is precisely before D&A."}},{"id":"c","text":{"fr":"Il déduit déjà les intérêts","en":"It already deducts interest"},"correct":false,"why":{"fr":"L'EBITDA est avant intérêts.","en":"EBITDA is before interest."}},{"id":"d","text":{"fr":"Il est exprimé après impôt","en":"It is stated after tax"},"correct":false,"why":{"fr":"L'EBITDA est avant impôt.","en":"EBITDA is pre-tax."}}],"explanation":{"fr":"Pour une société à fort capex, l'écart EBITDA vs free cash flow peut être énorme.","en":"For a capex-heavy company, the gap between EBITDA and free cash flow can be huge."},"workings":null},{"id":"qcm.l2.ratios.001","type":"qcm","level":2,"topic":"Accounting","tags":["gearing"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l2.ratios","stem":{"fr":"Quelle est la définition du [[gearing]] ?","en":"What is the definition of [[gearing]]?"},"multi":false,"options":[{"id":"a","text":{"fr":"Dette nette / capitaux propres","en":"Net debt / equity"},"correct":true,"why":{"fr":"C'est le ratio d'endettement standard.","en":"This is the standard leverage ratio."}},{"id":"b","text":{"fr":"Dette brute / total bilan","en":"Gross debt / total assets"},"correct":false,"why":{"fr":"C'est un autre ratio ; le gearing utilise la dette nette et les capitaux propres.","en":"That is a different ratio; gearing uses net debt and equity."}},{"id":"c","text":{"fr":"EBIT / intérêts","en":"EBIT / interest"},"correct":false,"why":{"fr":"C'est la couverture des intérêts.","en":"That is interest coverage."}},{"id":"d","text":{"fr":"Résultat net / capitaux propres","en":"Net income / equity"},"correct":false,"why":{"fr":"C'est le ROE.","en":"That is ROE."}}],"explanation":{"fr":"[[gearing]] = dette nette / capitaux propres ; dette nette = dette brute − trésorerie.","en":"[[gearing]] = net debt / equity; net debt = gross debt − cash."},"workings":null},{"id":"qcm.l2.ratios.002","type":"qcm","level":2,"topic":"Accounting","tags":["ROE","ROCE"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l2.ratios","stem":{"fr":"Quelle affirmation distingue correctement [[ROE]] et [[ROCE]] ?","en":"Which statement correctly distinguishes [[ROE]] and [[ROCE]]?"},"multi":false,"options":[{"id":"a","text":{"fr":"Le ROE inclut l'effet de la dette, le ROCE en est indépendant","en":"ROE includes the effect of debt, ROCE is independent of it"},"correct":true,"why":{"fr":"Le ROCE mesure la rentabilité économique avant financement.","en":"ROCE measures economic return before financing."}},{"id":"b","text":{"fr":"Le ROCE inclut la dette, le ROE non","en":"ROCE includes debt, ROE does not"},"correct":false,"why":{"fr":"C'est l'inverse.","en":"It is the opposite."}},{"id":"c","text":{"fr":"Les deux sont strictement identiques","en":"The two are strictly identical"},"correct":false,"why":{"fr":"Ils diffèrent par l'effet de levier.","en":"They differ by the leverage effect."}},{"id":"d","text":{"fr":"Le ROE se calcule avant impôt, le ROCE après","en":"ROE is pre-tax, ROCE is post-tax"},"correct":false,"why":{"fr":"Ce n'est pas le critère de distinction ; la différence porte sur le financement.","en":"That is not the distinguishing criterion; the difference is about financing."}}],"explanation":{"fr":"ROE = RN / CP (sensible au levier) ; ROCE = EBIT(1−t) / capitaux employés (avant financement).","en":"ROE = NI / equity (leverage-sensitive); ROCE = EBIT(1−t) / capital employed (pre-financing)."},"workings":null},{"id":"qcm.l2.ratios.003","type":"qcm","level":2,"topic":"Accounting","tags":["leverage"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l2.ratios","stem":{"fr":"Quelle est la formule correcte de l'uplift de l'effet de levier sur les fonds propres ?","en":"What is the correct formula for the leverage uplift on equity?"},"multi":false,"options":[{"id":"a","text":{"fr":"(Ra − Rd) × D/E","en":"(Ra − Rd) × D/E"},"correct":true,"why":{"fr":"Le spread (Ra − Rd) est amplifié par le ratio d'endettement D/E.","en":"The spread (Ra − Rd) is amplified by the debt-to-equity ratio D/E."}},{"id":"b","text":{"fr":"Ra − Rd","en":"Ra − Rd"},"correct":false,"why":{"fr":"Incomplet : il manque le facteur D/E qui amplifie le spread.","en":"Incomplete: the D/E factor that amplifies the spread is missing."}},{"id":"c","text":{"fr":"(Ra + Rd) × D/E","en":"(Ra + Rd) × D/E"},"correct":false,"why":{"fr":"C'est un spread, donc une différence, pas une somme.","en":"It is a spread, i.e. a difference, not a sum."}},{"id":"d","text":{"fr":"Ra × D/E","en":"Ra × D/E"},"correct":false,"why":{"fr":"On oublie de retrancher le coût de la dette.","en":"This omits subtracting the cost of debt."}}],"explanation":{"fr":"L'uplift correct est (Ra − Rd) × D/E. La version sans D/E, parfois vue, est incomplète.","en":"The correct uplift is (Ra − Rd) × D/E. The version without D/E, sometimes seen, is incomplete."},"workings":{"fr":"Ex. : (10% − 4%) × 1,5 = 9% ; ROE ≈ 10% + 9% = 19%.","en":"E.g.: (10% − 4%) × 1.5 = 9%; ROE ≈ 10% + 9% = 19%."}},{"id":"qcm.l2.ratios.004","type":"qcm","level":2,"topic":"Accounting","tags":["coverage"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l2.ratios","stem":{"fr":"La couverture des intérêts se calcule comme :","en":"Interest coverage is computed as:"},"multi":false,"options":[{"id":"a","text":{"fr":"EBIT / charges d'intérêts","en":"EBIT / interest expense"},"correct":true,"why":{"fr":"On compare la capacité opérationnelle à payer les intérêts.","en":"It compares operating capacity to service interest."}},{"id":"b","text":{"fr":"Résultat net / charges d'intérêts","en":"Net income / interest expense"},"correct":false,"why":{"fr":"On utilise l'EBIT, indépendant du financement et de l'impôt.","en":"EBIT is used, independent of financing and tax."}},{"id":"c","text":{"fr":"Charges d'intérêts / EBIT","en":"Interest expense / EBIT"},"correct":false,"why":{"fr":"Le ratio est inversé.","en":"The ratio is inverted."}},{"id":"d","text":{"fr":"Dette nette / EBITDA","en":"Net debt / EBITDA"},"correct":false,"why":{"fr":"C'est un ratio de levier, pas de couverture.","en":"That is a leverage ratio, not a coverage ratio."}}],"explanation":{"fr":"Couverture des intérêts = EBIT / intérêts : combien de fois le résultat opérationnel couvre les intérêts.","en":"Interest coverage = EBIT / interest: how many times operating profit covers interest."},"workings":null},{"id":"qcm.l2.ev-bridge.001","type":"qcm","level":2,"topic":"Valuation","tags":["bridge"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l2.ev-bridge","stem":{"fr":"Lequel de ces éléments n'entre PAS dans le bridge equity value → enterprise value ?","en":"Which of these does NOT belong in the equity value → enterprise value bridge?"},"multi":false,"options":[{"id":"a","text":{"fr":"La dette nette","en":"Net debt"},"correct":false,"why":{"fr":"On l'ajoute : les créanciers ont un claim sur l'actif.","en":"It is added: lenders have a claim on the asset."}},{"id":"b","text":{"fr":"Le BFR (working capital)","en":"Working capital"},"correct":true,"why":{"fr":"Le BFR fait partie de l'actif opérationnel déjà capté par l'EBITDA ; jamais une ligne du bridge.","en":"Working capital is part of the operating asset already captured by EBITDA; never a bridge line."}},{"id":"c","text":{"fr":"Les intérêts minoritaires","en":"Minority interest"},"correct":false,"why":{"fr":"On les ajoute car l'EBITDA consolide 100 % de la filiale.","en":"Added because EBITDA consolidates 100% of the subsidiary."}},{"id":"d","text":{"fr":"Les actions de préférence","en":"Preferred stock"},"correct":false,"why":{"fr":"On les ajoute : autre source de financement de l'actif.","en":"Added: another source of financing of the asset."}}],"explanation":{"fr":"Le bridge n'inclut que des claims sur l'actif et des actifs non opérationnels. Le BFR est déjà dans l'actif opérationnel.","en":"The bridge only includes claims on the asset and non-operating assets. Working capital is already in the operating asset."},"workings":null},{"id":"qcm.l2.ev-bridge.002","type":"qcm","level":2,"topic":"Valuation","tags":["calcul"],"difficulty":2,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l2.ev-bridge","stem":{"fr":"Equity value 1 000, dette nette 300, minoritaires 50, associés 40, provisions 60, leases 80, préférentielles 20. Quelle EV ?","en":"Equity value 1,000, net debt 300, minorities 50, associates 40, provisions 60, leases 80, preferred 20. What is EV?"},"multi":false,"options":[{"id":"a","text":{"fr":"1 470","en":"1,470"},"correct":true,"why":{"fr":"1000 + 300 + 50 − 40 + 60 + 80 + 20 = 1 470.","en":"1000 + 300 + 50 − 40 + 60 + 80 + 20 = 1,470."}},{"id":"b","text":{"fr":"1 550","en":"1,550"},"correct":false,"why":{"fr":"On a ajouté les associés au lieu de les soustraire.","en":"Associates were added instead of subtracted."}},{"id":"c","text":{"fr":"1 390","en":"1,390"},"correct":false,"why":{"fr":"Oubli d'une ou plusieurs lignes positives.","en":"One or more positive lines omitted."}},{"id":"d","text":{"fr":"1 300","en":"1,300"},"correct":false,"why":{"fr":"Seule la dette nette a été ajoutée.","en":"Only net debt was added."}}],"explanation":{"fr":"On ajoute toutes les sources de financement et provisions, on soustrait les participations mises en équivalence.","en":"Add all financing sources and provisions, subtract equity-method investments."},"workings":{"fr":"1000 + 300 + 50 − 40 + 60 + 80 + 20 = 1 470.","en":"1000 + 300 + 50 − 40 + 60 + 80 + 20 = 1,470."}},{"id":"qcm.l2.ev-bridge.003","type":"qcm","level":2,"topic":"Valuation","tags":["multiples"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l2.ev-bridge","stem":{"fr":"Quels appariements multiple/agrégat sont cohérents ? (plusieurs réponses)","en":"Which multiple/metric pairings are consistent? (multiple answers)"},"multi":true,"options":[{"id":"a","text":{"fr":"EV / EBITDA","en":"EV / EBITDA"},"correct":true,"why":{"fr":"EBITDA est avant frais financiers, cohérent avec l'EV.","en":"EBITDA is pre-financing, consistent with EV."}},{"id":"b","text":{"fr":"P/E (cours / résultat net)","en":"P/E (price / net income)"},"correct":true,"why":{"fr":"Le résultat net est après frais financiers, cohérent avec l'equity.","en":"Net income is post-financing, consistent with equity."}},{"id":"c","text":{"fr":"EV / résultat net","en":"EV / net income"},"correct":false,"why":{"fr":"Incohérent : EV (avant frais) avec résultat net (après frais).","en":"Inconsistent: EV (pre-financing) with net income (post-financing)."}},{"id":"d","text":{"fr":"EV / chiffre d'affaires","en":"EV / Sales"},"correct":true,"why":{"fr":"Le CA est avant frais financiers, cohérent avec l'EV.","en":"Sales is pre-financing, consistent with EV."}}],"explanation":{"fr":"Multiple d'EV ↔ agrégat avant frais financiers ; multiple d'equity ↔ agrégat après. EV/résultat net mélange les deux.","en":"EV multiple ↔ pre-financing metric; equity multiple ↔ post-financing. EV/net income mixes both."},"workings":null},{"id":"qcm.l2.ev-bridge.004","type":"qcm","level":2,"topic":"Valuation","tags":["debt repayment"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l2.ev-bridge","stem":{"fr":"Une société rembourse 100 de dette avec 100 de trésorerie. Quel effet sur l'EV ?","en":"A company repays 100 of debt using 100 of cash. What happens to EV?"},"multi":false,"options":[{"id":"a","text":{"fr":"L'EV baisse de 100","en":"EV falls by 100"},"correct":false,"why":{"fr":"Non : la dette nette ne change pas.","en":"No: net debt is unchanged."}},{"id":"b","text":{"fr":"L'EV est inchangée","en":"EV is unchanged"},"correct":true,"why":{"fr":"Dette brute −100 et trésorerie −100 : dette nette inchangée, donc EV inchangée.","en":"Gross debt −100 and cash −100: net debt unchanged, so EV unchanged."}},{"id":"c","text":{"fr":"L'EV monte de 100","en":"EV rises by 100"},"correct":false,"why":{"fr":"Aucun mécanisme n'augmente l'EV ici.","en":"Nothing increases EV here."}},{"id":"d","text":{"fr":"L'equity value baisse de 100","en":"Equity value falls by 100"},"correct":false,"why":{"fr":"L'opération est neutre sur l'equity value aussi.","en":"The operation is neutral on equity value too."}}],"explanation":{"fr":"Rembourser de la dette avec de la trésorerie laisse la dette nette et donc l'EV inchangées.","en":"Repaying debt with cash leaves net debt, and hence EV, unchanged."},"workings":null},{"id":"qcm.l2.diluted-shares.001","type":"qcm","level":2,"topic":"Valuation","tags":["TSM"],"difficulty":2,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l2.diluted-shares","stem":{"fr":"20 options au strike 5, cours 10 €. Combien d'actions nettes la TSM crée-t-elle ?","en":"20 options at strike 5, price 10. How many net shares does TSM create?"},"multi":false,"options":[{"id":"a","text":{"fr":"20","en":"20"},"correct":false,"why":{"fr":"C'est le brut ; la TSM neutralise par un rachat.","en":"That is gross; TSM offsets via a buyback."}},{"id":"b","text":{"fr":"10","en":"10"},"correct":true,"why":{"fr":"20 × (10 − 5)/10 = 10 actions nettes.","en":"20 × (10 − 5)/10 = 10 net shares."}},{"id":"c","text":{"fr":"15","en":"15"},"correct":false,"why":{"fr":"Mauvais calcul du rachat.","en":"Buyback miscomputed."}},{"id":"d","text":{"fr":"5","en":"5"},"correct":false,"why":{"fr":"Confusion avec le strike.","en":"Confused with the strike."}}],"explanation":{"fr":"Produit d'exercice = 20 × 5 = 100, rachat = 100/10 = 10, donc 20 − 10 = 10 nettes.","en":"Proceeds = 20 × 5 = 100, buyback = 100/10 = 10, so 20 − 10 = 10 net."},"workings":{"fr":"20 × (10 − 5)/10 = 10.","en":"20 × (10 − 5)/10 = 10."}},{"id":"qcm.l2.diluted-shares.002","type":"qcm","level":2,"topic":"Valuation","tags":["equity value"],"difficulty":2,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l2.diluted-shares","stem":{"fr":"100 actions émises − 5 auto-détenues ; +10 options nettes ; +10 convertibles ; cours 10 €. Quelle equity value ?","en":"100 issued − 5 treasury; +10 net options; +10 convertibles; price 10. What is equity value?"},"multi":false,"options":[{"id":"a","text":{"fr":"1 150 €","en":"EUR 1,150"},"correct":true,"why":{"fr":"95 + 10 + 10 = 115 actions × 10 = 1 150 €.","en":"95 + 10 + 10 = 115 shares × 10 = 1,150."}},{"id":"b","text":{"fr":"1 000 €","en":"EUR 1,000"},"correct":false,"why":{"fr":"Dilution ignorée.","en":"Dilution ignored."}},{"id":"c","text":{"fr":"1 200 €","en":"EUR 1,200"},"correct":false,"why":{"fr":"Auto-détention non retirée.","en":"Treasury not removed."}},{"id":"d","text":{"fr":"1 250 €","en":"EUR 1,250"},"correct":false,"why":{"fr":"Options comptées en brut (20) au lieu de net (10).","en":"Options counted gross (20) instead of net (10)."}}],"explanation":{"fr":"Actions diluées = 95 base + 10 + 10 = 115 ; equity value = 115 × 10 = 1 150 €.","en":"Diluted shares = 95 basic + 10 + 10 = 115; equity value = 115 × 10 = 1,150."},"workings":{"fr":"(100 − 5) + 10 + 10 = 115 ; 115 × 10 = 1 150.","en":"(100 − 5) + 10 + 10 = 115; 115 × 10 = 1,150."}},{"id":"qcm.l2.diluted-shares.003","type":"qcm","level":2,"topic":"Valuation","tags":["options","convertibles"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l2.diluted-shares","stem":{"fr":"Quels instruments sont dilutifs et doivent être comptés ? (plusieurs réponses)","en":"Which instruments are dilutive and must be counted? (multiple answers)"},"multi":true,"options":[{"id":"a","text":{"fr":"Options au strike 5, cours 10","en":"Options at strike 5, price 10"},"correct":true,"why":{"fr":"Dans la monnaie : strike < cours.","en":"In the money: strike < price."}},{"id":"b","text":{"fr":"Options au strike 15, cours 10","en":"Options at strike 15, price 10"},"correct":false,"why":{"fr":"Hors de la monnaie : on les ignore.","en":"Out of the money: ignored."}},{"id":"c","text":{"fr":"Convertible, prix de conversion 8, cours 10","en":"Convertible, conversion price 8, price 10"},"correct":true,"why":{"fr":"Dans la monnaie : if-converted, on ajoute les actions.","en":"In the money: if-converted, add the shares."}},{"id":"d","text":{"fr":"Convertible, prix de conversion 12, cours 10","en":"Convertible, conversion price 12, price 10"},"correct":false,"why":{"fr":"Hors de la monnaie : reste de la dette.","en":"Out of the money: stays debt."}}],"explanation":{"fr":"Seuls les instruments dans la monnaie (strike/prix de conversion < cours) sont dilutifs.","en":"Only in-the-money instruments (strike/conversion price < price) are dilutive."},"workings":null},{"id":"qcm.l2.diluted-shares.004","type":"qcm","level":2,"topic":"Valuation","tags":["treasury stock"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l2.diluted-shares","stem":{"fr":"Que sont les actions auto-détenues (treasury stock) ?","en":"What is treasury stock?"},"multi":false,"options":[{"id":"a","text":{"fr":"Des actions rachetées par la société, sans droit de vote ni dividende","en":"Shares repurchased by the company, with no voting or dividend rights"},"correct":true,"why":{"fr":"Définition exacte ; elles sont retirées des actions de base.","en":"Exact definition; they are removed from basic shares."}},{"id":"b","text":{"fr":"Des options non exercées","en":"Unexercised options"},"correct":false,"why":{"fr":"Non, ce sont des instruments dilutifs distincts.","en":"No, those are separate dilutive instruments."}},{"id":"c","text":{"fr":"Des actions détenues par l'État","en":"Shares held by the State"},"correct":false,"why":{"fr":"Sans rapport avec l'auto-détention.","en":"Unrelated to treasury stock."}},{"id":"d","text":{"fr":"Des actions de préférence","en":"Preferred shares"},"correct":false,"why":{"fr":"Catégorie différente.","en":"Different category."}}],"explanation":{"fr":"Le [[treasury stock]] correspond aux actions rachetées par l'émetteur ; on les soustrait des actions émises pour obtenir les actions de base.","en":"Treasury stock is shares repurchased by the issuer; subtract them from issued shares to get basic shares."},"workings":null},{"id":"qcm.l2.tvm.001","type":"qcm","level":2,"topic":"DCF","tags":["perpetuity"],"difficulty":2,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l2.tvm","stem":{"fr":"CF = 100 €/an, r = 10 %, sans croissance. Quelle valeur de la perpétuité ?","en":"CF = 100/yr, r = 10%, no growth. What is the perpetuity value?"},"multi":false,"options":[{"id":"a","text":{"fr":"1 000 €","en":"EUR 1,000"},"correct":true,"why":{"fr":"100 / 10 % = 1 000.","en":"100 / 10% = 1,000."}},{"id":"b","text":{"fr":"100 €","en":"EUR 100"},"correct":false,"why":{"fr":"On a oublié d'actualiser en perpétuité.","en":"Forgot to capitalise as a perpetuity."}},{"id":"c","text":{"fr":"1 100 €","en":"EUR 1,100"},"correct":false,"why":{"fr":"Mauvaise formule.","en":"Wrong formula."}},{"id":"d","text":{"fr":"909 €","en":"EUR 909"},"correct":false,"why":{"fr":"C'est 100/1,1, un seul flux actualisé.","en":"That is 100/1.1, a single discounted cash flow."}}],"explanation":{"fr":"Une perpétuité sans croissance vaut CF/r = 100/0,10 = 1 000 €.","en":"A no-growth perpetuity is worth CF/r = 100/0.10 = 1,000."},"workings":{"fr":"100 / 0,10 = 1 000.","en":"100 / 0.10 = 1,000."}},{"id":"qcm.l2.tvm.002","type":"qcm","level":2,"topic":"DCF","tags":["perpetuity"],"difficulty":2,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l2.tvm","stem":{"fr":"CF = 200 €/an, r = 10 %, g = 4 %. Quelle valeur ?","en":"CF = 200/yr, r = 10%, g = 4%. What value?"},"multi":false,"options":[{"id":"a","text":{"fr":"3 333 €","en":"EUR 3,333"},"correct":true,"why":{"fr":"200 / (10 % − 4 %) = 200 / 6 % = 3 333.","en":"200 / (10% − 4%) = 200 / 6% = 3,333."}},{"id":"b","text":{"fr":"2 000 €","en":"EUR 2,000"},"correct":false,"why":{"fr":"Croissance g ignorée (200/10 %).","en":"Growth g ignored (200/10%)."}},{"id":"c","text":{"fr":"5 000 €","en":"EUR 5,000"},"correct":false,"why":{"fr":"Dénominateur 4 % par erreur.","en":"Denominator 4% by mistake."}},{"id":"d","text":{"fr":"1 429 €","en":"EUR 1,429"},"correct":false,"why":{"fr":"Valeur d'un autre cas (CF 100, g 3 %).","en":"Value of another case (CF 100, g 3%)."}}],"explanation":{"fr":"Perpétuité croissante : Valeur = CF/(r−g) = 200/0,06 = 3 333 €.","en":"Growing perpetuity: Value = CF/(r−g) = 200/0.06 = 3,333."},"workings":{"fr":"200 / (0,10 − 0,04) = 200 / 0,06 = 3 333.","en":"200 / (0.10 − 0.04) = 200 / 0.06 = 3,333."}},{"id":"qcm.l2.tvm.003","type":"qcm","level":2,"topic":"DCF","tags":["NPV","IRR"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l2.tvm","stem":{"fr":"Quelles affirmations sur NPV et IRR sont correctes ? (plusieurs réponses)","en":"Which statements about NPV and IRR are correct? (multiple answers)"},"multi":true,"options":[{"id":"a","text":{"fr":"L'IRR est le taux qui annule la NPV","en":"IRR is the rate that sets NPV to zero"},"correct":true,"why":{"fr":"Définition même de l'[[IRR]].","en":"The very definition of IRR."}},{"id":"b","text":{"fr":"On investit si NPV > 0","en":"Invest if NPV > 0"},"correct":true,"why":{"fr":"Une NPV positive signifie création de valeur.","en":"A positive NPV means value creation."}},{"id":"c","text":{"fr":"L'IRR suppose un réinvestissement au taux IRR","en":"IRR assumes reinvestment at the IRR rate"},"correct":true,"why":{"fr":"Hypothèse implicite, souvent irréaliste.","en":"Implicit assumption, often unrealistic."}},{"id":"d","text":{"fr":"La NPV s'exprime en pourcentage","en":"NPV is expressed as a percentage"},"correct":false,"why":{"fr":"Non, la NPV est en euros ; c'est l'IRR qui est en %.","en":"No, NPV is in euros; it is IRR that is in %."}}],"explanation":{"fr":"La NPV est une création de valeur en euros, l'IRR un taux annualisé annulant la NPV avec une hypothèse de réinvestissement.","en":"NPV is value creation in euros, IRR an annualised rate setting NPV to zero with a reinvestment assumption."},"workings":null},{"id":"qcm.l2.tvm.004","type":"qcm","level":2,"topic":"DCF","tags":["perpetuity"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l2.tvm","stem":{"fr":"Sous quelle condition la formule Valeur = CF/(r−g) est-elle valable ?","en":"Under what condition is Value = CF/(r−g) valid?"},"multi":false,"options":[{"id":"a","text":{"fr":"g < r","en":"g < r"},"correct":true,"why":{"fr":"Sinon le dénominateur est nul ou négatif et la formule diverge.","en":"Otherwise the denominator is zero or negative and the formula diverges."}},{"id":"b","text":{"fr":"g > r","en":"g > r"},"correct":false,"why":{"fr":"Donne une valeur négative absurde.","en":"Gives an absurd negative value."}},{"id":"c","text":{"fr":"g = r","en":"g = r"},"correct":false,"why":{"fr":"Division par zéro : valeur infinie.","en":"Division by zero: infinite value."}},{"id":"d","text":{"fr":"Toujours valable","en":"Always valid"},"correct":false,"why":{"fr":"Faux : exige g < r.","en":"False: requires g < r."}}],"explanation":{"fr":"La perpétuité croissante n'a de sens que si la croissance reste inférieure au taux d'actualisation (g < r).","en":"The growing perpetuity only makes sense if growth stays below the discount rate (g < r)."},"workings":null},{"id":"qcm.l3.dcf.001","type":"qcm","level":3,"topic":"DCF","tags":["FCFF","WACC"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.dcf","stem":{"fr":"À quel taux actualise-t-on le FCFF dans un DCF ?","en":"At what rate is FCFF discounted in a DCF?"},"multi":false,"options":[{"id":"a","text":{"fr":"Au coût des fonds propres","en":"At the cost of equity"},"correct":false,"why":{"fr":"C'est le taux du FCFE (flux levered), pas du FCFF.","en":"That is the rate for FCFE (a levered flow), not FCFF."}},{"id":"b","text":{"fr":"Au WACC","en":"At the WACC"},"correct":true,"why":{"fr":"Le FCFF est disponible pour tous les apporteurs de capitaux, donc actualisé au coût combiné, le WACC.","en":"FCFF is available to all capital providers, so discounted at the combined cost, the WACC."}},{"id":"c","text":{"fr":"Au taux sans risque","en":"At the risk-free rate"},"correct":false,"why":{"fr":"Le taux sans risque ignore la prime de risque de l'actif.","en":"The risk-free rate ignores the asset's risk premium."}},{"id":"d","text":{"fr":"Au coût de la dette","en":"At the cost of debt"},"correct":false,"why":{"fr":"Le coût de la dette ne rémunère que les créanciers, pas les actionnaires.","en":"The cost of debt only compensates creditors, not shareholders."}}],"explanation":{"fr":"Le FCFF est un flux unlevered destiné à tous les bailleurs de fonds ; on l'actualise donc au WACC.","en":"FCFF is an unlevered flow for all capital providers; it is therefore discounted at the WACC."},"workings":null},{"id":"qcm.l3.dcf.002","type":"qcm","level":3,"topic":"DCF","tags":["DCF"],"difficulty":2,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l3.dcf","stem":{"fr":"Trois flux de FCFF (100, 120, 140) actualisés à 10% : quelle est la somme des valeurs actuelles ?","en":"Three FCFF flows (100, 120, 140) discounted at 10%: what is the sum of present values?"},"multi":false,"options":[{"id":"a","text":{"fr":"≈ 360","en":"≈ 360"},"correct":false,"why":{"fr":"C'est la somme non actualisée (100+120+140), donc fausse.","en":"That is the undiscounted sum (100+120+140), so wrong."}},{"id":"b","text":{"fr":"≈ 295","en":"≈ 295"},"correct":true,"why":{"fr":"91 + 99 + 105 ≈ 295.","en":"91 + 99 + 105 ≈ 295."}},{"id":"c","text":{"fr":"≈ 320","en":"≈ 320"},"correct":false,"why":{"fr":"Sur-estime : l'actualisation réduit davantage les flux lointains.","en":"Overstated: discounting reduces distant flows more."}},{"id":"d","text":{"fr":"≈ 270","en":"≈ 270"},"correct":false,"why":{"fr":"Sous-estime la somme correcte de 295.","en":"Understates the correct sum of 295."}}],"explanation":{"fr":"100/1,1≈91, 120/1,1²≈99, 140/1,1³≈105 ; total ≈ 295.","en":"100/1.1≈91, 120/1.1²≈99, 140/1.1³≈105; total ≈ 295."},"workings":{"fr":"91 + 99 + 105 = 295.","en":"91 + 99 + 105 = 295."}},{"id":"qcm.l3.dcf.003","type":"qcm","level":3,"topic":"DCF","tags":["EV","equity-value"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.dcf","stem":{"fr":"Un DCF du FCFF donne directement :","en":"An FCFF DCF directly yields:"},"multi":false,"options":[{"id":"a","text":{"fr":"L'equity value","en":"Equity value"},"correct":false,"why":{"fr":"Il faut encore retrancher la dette nette pour obtenir l'equity value.","en":"You still need to subtract net debt to get equity value."}},{"id":"b","text":{"fr":"L'Enterprise Value","en":"Enterprise Value"},"correct":true,"why":{"fr":"Le FCFF est un flux pour tous les capitaux, donc sa somme actualisée = EV.","en":"FCFF is a flow to all capital, so its discounted sum = EV."}},{"id":"c","text":{"fr":"La capitalisation boursière","en":"Market capitalization"},"correct":false,"why":{"fr":"La capitalisation est une observation de marché, pas le résultat d'un DCF du FCFF.","en":"Market cap is a market observation, not the output of an FCFF DCF."}},{"id":"d","text":{"fr":"La dette nette","en":"Net debt"},"correct":false,"why":{"fr":"La dette nette est un input du bridge, pas le résultat du DCF.","en":"Net debt is a bridge input, not the DCF output."}}],"explanation":{"fr":"Le DCF du FCFF donne l'EV ; le bridge dette nette permet ensuite d'obtenir l'equity value.","en":"An FCFF DCF yields EV; the net-debt bridge then gives equity value."},"workings":null},{"id":"qcm.l3.dcf.004","type":"qcm","level":3,"topic":"DCF","tags":["DCF","Accounting"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.dcf","stem":{"fr":"Quel taux d'impôt normatif retenir pour le FCFF d'une société française ?","en":"Which normative tax rate to use for the FCFF of a French company?"},"multi":false,"options":[{"id":"a","text":{"fr":"~25%","en":"~25%"},"correct":true,"why":{"fr":"C'est le taux d'IS français actuel.","en":"That is the current French corporate tax rate."}},{"id":"b","text":{"fr":"33%","en":"33%"},"correct":false,"why":{"fr":"Ancien taux français, désormais obsolète.","en":"Old French rate, now outdated."}},{"id":"c","text":{"fr":"40%","en":"40%"},"correct":false,"why":{"fr":"Taux US obsolète d'anciens manuels ; aux US c'est 21% depuis 2017.","en":"Outdated US rate from old textbooks; US is 21% since 2017."}},{"id":"d","text":{"fr":"0%","en":"0%"},"correct":false,"why":{"fr":"Ignorer l'impôt surévalue le FCFF.","en":"Ignoring tax overstates FCFF."}}],"explanation":{"fr":"L'IS français est d'environ 25%. Le 33% est obsolète et le 40% est un vieux taux US (désormais 21%).","en":"French corporate tax is about 25%. 33% is outdated and 40% is an old US rate (now 21%)."},"workings":null},{"id":"qcm.l3.dcf.005","type":"qcm","level":3,"topic":"DCF","tags":["DCF","terminal-value"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.dcf","stem":{"fr":"Quelles erreurs sont fréquentes dans un DCF ? (plusieurs réponses)","en":"Which errors are common in a DCF? (multiple answers)"},"multi":true,"options":[{"id":"a","text":{"fr":"Oublier d'actualiser la valeur terminale","en":"Forgetting to discount the terminal value"},"correct":true,"why":{"fr":"La TV tombe en fin d'horizon et doit être ramenée à aujourd'hui.","en":"The TV falls at the end of the horizon and must be brought back to today."}},{"id":"b","text":{"fr":"Actualiser le FCFF au coût des fonds propres","en":"Discounting FCFF at the cost of equity"},"correct":true,"why":{"fr":"Un flux unlevered doit être actualisé au WACC.","en":"An unlevered flow must be discounted at the WACC."}},{"id":"c","text":{"fr":"Confondre EV et equity value","en":"Confusing EV and equity value"},"correct":true,"why":{"fr":"Le DCF du FCFF donne l'EV ; il faut le bridge pour l'equity value.","en":"An FCFF DCF gives EV; you need the bridge for equity value."}},{"id":"d","text":{"fr":"Projeter le FCFF sur plusieurs années","en":"Projecting FCFF over several years"},"correct":false,"why":{"fr":"C'est précisément l'étape 1 correcte du DCF, pas une erreur.","en":"That is exactly the correct step 1 of a DCF, not an error."}}],"explanation":{"fr":"Les pièges classiques sont l'oubli d'actualiser la TV, l'usage du mauvais taux, et la confusion EV/equity value.","en":"Classic pitfalls are forgetting to discount the TV, using the wrong rate, and confusing EV/equity value."},"workings":null},{"id":"qcm.l3.wacc.001","type":"qcm","level":3,"topic":"WACC","tags":["WACC"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.wacc","stem":{"fr":"Dans la formule du WACC, le facteur (1 − T) s'applique à :","en":"In the WACC formula, the (1 − T) factor applies to:"},"multi":false,"options":[{"id":"a","text":{"fr":"Le coût de la dette uniquement","en":"The cost of debt only"},"correct":true,"why":{"fr":"Les intérêts sont déductibles fiscalement : c'est le tax shield sur la dette.","en":"Interest is tax-deductible: it is the debt tax shield."}},{"id":"b","text":{"fr":"Le coût des fonds propres","en":"The cost of equity"},"correct":false,"why":{"fr":"Les dividendes ne sont pas déductibles ; aucun tax shield sur l'equity.","en":"Dividends are not deductible; no tax shield on equity."}},{"id":"c","text":{"fr":"Les deux composants","en":"Both components"},"correct":false,"why":{"fr":"Seuls les intérêts de dette sont déductibles.","en":"Only debt interest is deductible."}},{"id":"d","text":{"fr":"Aucun des deux","en":"Neither"},"correct":false,"why":{"fr":"Le tax shield existe bien, sur la dette.","en":"The tax shield does exist, on debt."}}],"explanation":{"fr":"WACC = E/V·Re + D/V·Rd·(1−T) : le (1−T) ne porte que sur le coût de la dette.","en":"WACC = E/V·Re + D/V·Rd·(1−T): the (1−T) applies only to the cost of debt."},"workings":null},{"id":"qcm.l3.wacc.002","type":"qcm","level":3,"topic":"WACC","tags":["CAPM"],"difficulty":2,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l3.wacc","stem":{"fr":"Rf = 1%, beta = 1,5, Rm − Rf = 2%. Quel est Re selon le CAPM ?","en":"Rf = 1%, beta = 1.5, Rm − Rf = 2%. What is Re per CAPM?"},"multi":false,"options":[{"id":"a","text":{"fr":"3%","en":"3%"},"correct":false,"why":{"fr":"Oublie d'ajouter Rf.","en":"Forgets to add Rf."}},{"id":"b","text":{"fr":"4%","en":"4%"},"correct":true,"why":{"fr":"1% + 1,5 × 2% = 1% + 3% = 4%.","en":"1% + 1.5 × 2% = 1% + 3% = 4%."}},{"id":"c","text":{"fr":"5,5%","en":"5.5%"},"correct":false,"why":{"fr":"Applique mal le bêta à la prime.","en":"Misapplies the beta to the premium."}},{"id":"d","text":{"fr":"2,5%","en":"2.5%"},"correct":false,"why":{"fr":"N'a pas multiplié la prime par le bêta
