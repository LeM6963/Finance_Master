c.l5.distressed-ma.006","type":"flashcard","level":5,"topic":"Restructuring","tags":["special-situations"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.distressed-ma","front":{"fr":"Citez des fonds actifs en special situations / distressed.","en":"Name funds active in special situations / distressed."},"back":{"fr":"Côté européen : Tikehau Capital. Côté global : Oaktree, Apollo, Cerberus. Ils déploient des stratégies hybrides dette/equity, dont le loan-to-own.","en":"European: Tikehau Capital. Global: Oaktree, Apollo, Cerberus. They deploy hybrid debt/equity strategies, including loan-to-own."},"hint":null},{"id":"fc.l5.buildup.001","type":"flashcard","level":5,"topic":"LBO","tags":["build-up"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.buildup","front":{"fr":"Qu'est-ce qu'une stratégie de build-up ?","en":"What is a build-up strategy?"},"back":{"fr":"Acquérir une [[platform]] puis enchaîner des acquisitions complémentaires ([[bolt-on]]) pour faire croître l'[[EBITDA]] par croissance externe et synergies, et viser une re-rating du multiple.","en":"Acquire a [[platform]] then chain complementary acquisitions ([[bolt-on]]) to grow [[EBITDA]] via external growth and synergies, targeting a multiple re-rating."},"hint":null},{"id":"fc.l5.buildup.002","type":"flashcard","level":5,"topic":"LBO","tags":["multiple-arbitrage"],"difficulty":5,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.buildup","front":{"fr":"Expliquez l'arbitrage de multiple en build-up.","en":"Explain multiple arbitrage in a build-up."},"back":{"fr":"On achète des bolt-ons à un multiple [[EV/EBITDA]] bas (≈6x) ; consolidés, ils sont valorisés au multiple plus élevé du groupe (≈11x). L'écart crée de la valeur instantanée, indépendamment des synergies.","en":"Bolt-ons are bought at a low [[EV/EBITDA]] multiple (~6x); once consolidated they are valued at the group's higher multiple (~11x). The gap creates instant value, independent of synergies."},"hint":null},{"id":"fc.l5.buildup.003","type":"flashcard","level":5,"topic":"LBO","tags":["MoM"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.buildup","front":{"fr":"Comment le build-up améliore-t-il le [[MoM]] ?","en":"How does build-up improve the [[MoM]]?"},"back":{"fr":"Il augmente l'[[EBITDA]] consolidé et le multiple de sortie, donc l'[[Enterprise Value]] de sortie. Comme MoM = equity sortie / equity entrée et equity sortie = EV − dette nette, le MoM grimpe.","en":"It raises consolidated [[EBITDA]] and the exit multiple, hence exit [[Enterprise Value]]. Since MoM = exit equity / entry equity and exit equity = EV − net debt, the MoM rises."},"hint":null},{"id":"fc.l5.buildup.004","type":"flashcard","level":5,"topic":"LBO","tags":["integration","risk"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.buildup","front":{"fr":"Quel est le principal risque opérationnel d'un build-up ?","en":"What is the main operational risk of a build-up?"},"back":{"fr":"L'intégration (PMI) : harmonisation des ERP, rétention du management, capture effective des synergies et coûts one-off. Une intégration ratée laisse une holding hétéroclite difficile à revendre à un multiple premium.","en":"Integration (PMI): ERP harmonisation, management retention, effective synergy capture and one-off costs. Failed integration leaves a ragbag holding hard to sell at a premium multiple."},"hint":null},{"id":"fc.l5.buildup.005","type":"flashcard","level":5,"topic":"LBO","tags":["financing"],"difficulty":4,"source":{"flag":"APPROXIMATE"},"moduleId":"mod.l5.buildup","front":{"fr":"Comment finance-t-on les bolt-ons d'un build-up ?","en":"How are build-up bolt-ons financed?"},"back":{"fr":"Par tirage sur une [[acquisition facility]] / accordéon, par le cash-flow disponible, ou par equity additionnel du fonds (parfois roll-over du vendeur). Attention : la dette additionnelle gonfle la dette nette de sortie.","en":"By drawing on an [[acquisition facility]] / accordion, by available cash flow, or by additional fund equity (sometimes seller roll-over). Beware: added debt inflates exit net debt."},"hint":null},{"id":"fc.l5.buildup.006","type":"flashcard","level":5,"topic":"LBO","tags":["platform"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.buildup","front":{"fr":"Pourquoi la plateforme se paie-t-elle plus cher que les bolt-ons ?","en":"Why is the platform paid more than the bolt-ons?"},"back":{"fr":"Elle apporte le management, les systèmes et la taille critique pour absorber les acquisitions ; sa qualité justifie un multiple plein. Les bolt-ons, plus petits et moins matures, doivent se payer moins cher pour créer l'arbitrage.","en":"It brings management, systems and the critical mass to absorb acquisitions; its quality justifies a full multiple. Bolt-ons, smaller and less mature, must be cheaper to create the arbitrage."},"hint":null},{"id":"fc.l5.p2p.001","type":"flashcard","level":5,"topic":"M&A","tags":["take-private"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.take-private","front":{"fr":"Qu'est-ce qu'un [[take-private]] (P2P) ?","en":"What is a [[take-private]] (P2P)?"},"back":{"fr":"Le rachat par un fonds de l'intégralité d'une société cotée pour la retirer de la bourse et la gérer en [[LBO]], via [[OPA]] ou scheme of arrangement.","en":"A fund buying an entire listed company to delist it and run it as an [[LBO]], via tender offer ([[OPA]]) or scheme of arrangement."},"hint":null},{"id":"fc.l5.p2p.002","type":"flashcard","level":5,"topic":"M&A","tags":["premium"],"difficulty":4,"source":{"flag":"APPROXIMATE"},"moduleId":"mod.l5.take-private","front":{"fr":"Sur quel cours calcule-t-on la prime d'offre, et combien ?","en":"On which price is the offer premium computed, and how much?"},"back":{"fr":"Sur le cours non affecté (avant fuite/rumeur), souvent une moyenne pondérée des derniers mois. La prime est typiquement de l'ordre de ~30% (20–40%).","en":"On the unaffected price (before leak/rumour), often a volume-weighted average of recent months. The premium is typically around ~30% (20–40%)."},"hint":null},{"id":"fc.l5.p2p.003","type":"flashcard","level":5,"topic":"M&A","tags":["OPA","scheme"],"difficulty":5,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.take-private","front":{"fr":"OPA vs scheme of arrangement : quelle différence ?","en":"Tender offer vs scheme of arrangement: what is the difference?"},"back":{"fr":"L'[[OPA]] : offre publique où chacun apporte ses titres ; on vise 90–95% pour squeezer. Le [[scheme of arrangement]] : vote des actionnaires à ≈75% en valeur homologué par un juge, qui s'impose à 100% des titres.","en":"The [[OPA]] (tender offer): public offer where each shareholder tenders; aim for 90–95% to squeeze out. The [[scheme of arrangement]]: shareholder vote at ~75% by value sanctioned by a court, binding 100% of shares."},"hint":null},{"id":"fc.l5.p2p.004","type":"flashcard","level":5,"topic":"M&A","tags":["irrevocable"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.take-private","front":{"fr":"À quoi servent les engagements irrévocables ?","en":"What are irrevocable undertakings for?"},"back":{"fr":"Les principaux actionnaires s'engagent à apporter leurs titres à l'offre avant l'annonce. Cela dé-risque l'opération et réduit la probabilité d'une contre-offre.","en":"The main shareholders commit to tender their shares before announcement. This de-risks the deal and lowers the probability of a counter-bid."},"hint":null},{"id":"fc.l5.p2p.005","type":"flashcard","level":5,"topic":"M&A","tags":["squeeze-out","AMF"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.take-private","front":{"fr":"Qu'est-ce qu'un [[squeeze-out]] et à quel seuil en France ?","en":"What is a [[squeeze-out]] and at what threshold in France?"},"back":{"fr":"Le retrait obligatoire des minoritaires résiduels au prix de l'offre une fois le contrôle quasi total atteint. En France ([[AMF]]), le seuil est ≥90% du capital et des droits de vote.","en":"The mandatory buyout of residual minorities at the offer price once near-total control is reached. In France ([[AMF]]), the threshold is ≥90% of capital and voting rights."},"hint":null},{"id":"fc.l5.p2p.006","type":"flashcard","level":5,"topic":"M&A","tags":["financing","certain-funds"],"difficulty":5,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.take-private","front":{"fr":"Que signifie la condition de \"certain funds\" dans un P2P ?","en":"What does the \"certain funds\" condition mean in a P2P?"},"back":{"fr":"Le financement (equity + dette d'acquisition via [[bidco]]) doit être committé et certain avant le lancement de l'offre : le régulateur exige la certitude de financement pour protéger les actionnaires.","en":"Financing (equity + acquisition debt via [[bidco]]) must be committed and certain before launching the offer: the regulator requires financing certainty to protect shareholders."},"hint":null},{"id":"fc.l5.ecm.001","type":"flashcard","level":5,"topic":"ECM","tags":["IPO","bookbuilding"],"difficulty":5,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.ecm","front":{"fr":"Qu'est-ce que le bookbuilding dans une IPO ?","en":"What is bookbuilding in an IPO?"},"back":{"fr":"C'est le processus où les [[bookrunner]]s collectent les ordres des investisseurs dans un livre d'ordres sur une fourchette de prix indicative ; la profondeur et la qualité du livre déterminent le prix d'offre final et l'allocation.","en":"It is the process where the [[bookrunner]]s collect investor orders into an order book over an indicative price range; the depth and quality of the book determine the final offer price and allocation."},"hint":null},{"id":"fc.l5.ecm.002","type":"flashcard","level":5,"topic":"ECM","tags":["greenshoe"],"difficulty":5,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.ecm","front":{"fr":"À quoi sert le greenshoe et quelle est sa taille usuelle ?","en":"What is the greenshoe for and what is its usual size?"},"back":{"fr":"Le [[greenshoe]] (option de surallocation, ~15 % de l'offre) permet au syndicat de survendre puis de stabiliser le titre : rachat si le cours baisse, exercice de l'option si le cours monte.","en":"The [[greenshoe]] (over-allotment option, ~15% of the offer) lets the syndicate over-sell then stabilise the stock: buy back if the price falls, exercise the option if the price rises."},"hint":null},{"id":"fc.l5.ecm.003","type":"flashcard","level":5,"topic":"ECM","tags":["primary","secondary"],"difficulty":5,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.ecm","front":{"fr":"Différence entre tranche primaire et tranche secondaire d'une IPO ?","en":"Difference between the primary and secondary tranche of an IPO?"},"back":{"fr":"Le primaire émet des actions nouvelles et le produit va à la société (financer croissance/désendettement) ; le secondaire cède des actions existantes et le produit va aux actionnaires vendeurs.","en":"Primary issues new shares and the proceeds go to the company (fund growth/deleveraging); secondary sells existing shares and the proceeds go to selling shareholders."},"hint":null},{"id":"fc.l5.ecm.004","type":"flashcard","level":5,"topic":"ECM","tags":["lock-up"],"difficulty":5,"source":{"flag":"APPROXIMATE"},"moduleId":"mod.l5.ecm","front":{"fr":"Qu'est-ce qu'un lock-up et quelle durée typique ?","en":"What is a lock-up and what is the typical duration?"},"back":{"fr":"Le [[lock-up]] interdit aux initiés (fondateurs, sponsors, management) de vendre leurs actions pendant une période après l'IPO, typiquement ~180 jours, pour éviter une offre soudaine qui pèserait sur le cours.","en":"The [[lock-up]] bars insiders (founders, sponsors, management) from selling shares for a period after the IPO, typically ~180 days, to avoid sudden supply weighing on the price."},"hint":null},{"id":"fc.l5.ecm.005","type":"flashcard","level":5,"topic":"ECM","tags":["free-float"],"difficulty":5,"source":{"flag":"APPROXIMATE"},"moduleId":"mod.l5.ecm","front":{"fr":"Qu'est-ce que le free float et pourquoi un minimum est-il exigé ?","en":"What is free float and why is a minimum required?"},"back":{"fr":"Le [[free float]] est la part du capital effectivement négociable sur le marché. Les places (Euronext ~25 % APPROXIMATE) imposent un minimum pour assurer la liquidité et une formation de prix fiable.","en":"The [[free float]] is the share of capital actually tradable on the market. Exchanges (Euronext ~25% APPROXIMATE) require a minimum to ensure liquidity and reliable price formation."},"hint":null},{"id":"fc.l5.ecm.006","type":"flashcard","level":5,"topic":"ECM","tags":["ipo-discount"],"difficulty":5,"source":{"flag":"APPROXIMATE"},"moduleId":"mod.l5.ecm","front":{"fr":"Pourquoi parle-t-on de décote d'IPO ?","en":"Why is there an IPO discount?"},"back":{"fr":"La [[décote d'IPO]] est la sous-évaluation volontaire du prix d'offre par rapport à la valeur de marché attendue, qui crée un pop au premier jour (~+5 à +15 % APPROXIMATE), récompense les investisseurs et limite le risque d'échec — au prix de valeur laissée sur la table.","en":"The [[IPO discount]] is the deliberate underpricing of the offer relative to expected market value, creating a first-day pop (~+5 to +15% APPROXIMATE), rewarding investors and limiting deal failure risk — at the cost of value left on the table."},"hint":null},{"id":"fc.l5.dcm.001","type":"flashcard","level":5,"topic":"DCM","tags":["rating"],"difficulty":5,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.dcm","front":{"fr":"Où se situe la frontière entre investment grade et high yield ?","en":"Where is the boundary between investment grade and high yield?"},"back":{"fr":"[[Investment grade]] = BBB-/Baa3 et au-dessus ; [[high yield]] = BB+/Ba1 et en dessous. Le franchissement à la baisse (« fallen angel ») déclenche souvent des ventes forcées.","en":"[[Investment grade]] = BBB-/Baa3 and above; [[high yield]] = BB+/Ba1 and below. A downward crossing ('fallen angel') often triggers forced selling."},"hint":null},{"id":"fc.l5.dcm.002","type":"flashcard","level":5,"topic":"DCM","tags":["spread"],"difficulty":5,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.dcm","front":{"fr":"Comment se décompose le rendement d'une obligation corporate ?","en":"How does a corporate bond yield break down?"},"back":{"fr":"Rendement = taux sans risque (OAT/Bund de même maturité) + [[spread de crédit]], ce dernier rémunérant le risque de défaut et de liquidité ; plus la note est basse, plus le spread est large.","en":"Yield = risk-free rate (matching-maturity OAT/Bund) + [[credit spread]], the latter compensating default and liquidity risk; the lower the rating, the wider the spread."},"hint":null},{"id":"fc.l5.dcm.003","type":"flashcard","level":5,"topic":"DCM","tags":["covenants"],"difficulty":5,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.dcm","front":{"fr":"Différence entre incurrence et maintenance covenants ?","en":"Difference between incurrence and maintenance covenants?"},"back":{"fr":"Les incurrence [[covenants]] (typiques du HY) ne se testent que lors d'une action (nouvelle dette, dividende) ; les maintenance covenants (typiques des prêts bancaires) se testent à chaque période (par ex. levier max).","en":"Incurrence [[covenants]] (typical of HY) are only tested on an action (new debt, dividend); maintenance covenants (typical of bank loans) are tested each period (e.g. max leverage)."},"hint":null},{"id":"fc.l5.dcm.004","type":"flashcard","level":5,"topic":"DCM","tags":["structure"],"difficulty":5,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.dcm","front":{"fr":"Qu'est-ce qu'une obligation bullet ?","en":"What is a bullet bond?"},"back":{"fr":"Une obligation [[bullet]] rembourse l'intégralité du principal in fine à l'échéance, sans amortissement intermédiaire — contrairement à la dette bancaire souvent amortissable.","en":"A [[bullet]] bond repays the full principal at maturity with no interim amortisation — unlike often-amortising bank debt."},"hint":null},{"id":"fc.l5.dcm.005","type":"flashcard","level":5,"topic":"DCM","tags":["use-of-proceeds"],"difficulty":5,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.dcm","front":{"fr":"Que désigne le « use of proceeds » d'une émission obligataire ?","en":"What does 'use of proceeds' mean for a bond issue?"},"back":{"fr":"Le [[use of proceeds]] est l'usage déclaré des fonds levés (refinancement, acquisition, capex, finalité ESG pour un green bond), précisé dans le prospectus pour informer les investisseurs.","en":"The [[use of proceeds]] is the stated use of the funds raised (refinancing, acquisition, capex, ESG purpose for a green bond), disclosed in the prospectus to inform investors."},"hint":null},{"id":"fc.l5.dcm.006","type":"flashcard","level":5,"topic":"DCM","tags":["bank-debt"],"difficulty":5,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.dcm","front":{"fr":"Un avantage et un inconvénient de l'obligataire vs la dette bancaire ?","en":"One advantage and one drawback of bonds vs bank debt?"},"back":{"fr":"Avantage : maturité plus longue, structure bullet et base d'investisseurs large/liquide. Inconvénient : moins de flexibilité (porteurs diffus) et coûts fixes (rating, prospectus) le réservant aux montants significatifs.","en":"Advantage: longer maturity, bullet structure and a broad/liquid investor base. Drawback: less flexibility (dispersed holders) and fixed costs (rating, prospectus) reserving it for sizeable amounts."},"hint":null},{"id":"fc.l5.vc.001","type":"flashcard","level":5,"topic":"VC","tags":["valuation"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.vc","front":{"fr":"Comment calcule-t-on la post-money valuation ?","en":"How is post-money valuation computed?"},"back":{"fr":"Post-money = pre-money + montant levé. Le % de l'investisseur = montant investi / post-money.","en":"Post-money = pre-money + amount raised. The investor's % = amount invested / post-money."},"hint":null},{"id":"fc.l5.vc.002","type":"flashcard","level":5,"topic":"VC","tags":["dilution"],"difficulty":4,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l5.vc","front":{"fr":"Pre-money de 8, on lève 2. Quelle dilution des actionnaires existants ?","en":"Pre-money of 8, raising 2. What is the dilution of existing shareholders?"},"back":{"fr":"Post-money = 10, le nouvel investisseur prend 2/10 = 20 %, donc les existants sont dilués de 20 % (passent de 100 % à 80 %).","en":"Post-money = 10, the new investor takes 2/10 = 20%, so existing holders are diluted by 20% (from 100% to 80%)."},"hint":null},{"id":"fc.l5.vc.003","type":"flashcard","level":5,"topic":"VC","tags":["liquidation preference"],"difficulty":5,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.vc","front":{"fr":"Quelle est la liquidation preference standard de marché ?","en":"What is the market-standard liquidation preference?"},"back":{"fr":"1x non-participating : l'investisseur récupère 1x son investissement OU convertit en ordinaire et prend son %, en choisissant le plus avantageux — pas les deux.","en":"1x non-participating: the investor gets back 1x their investment OR converts to common and takes their %, choosing whichever is larger — not both."},"hint":null},{"id":"fc.l5.vc.004","type":"flashcard","level":5,"topic":"VC","tags":["SAFE"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.vc","front":{"fr":"Quelle différence entre un SAFE et une convertible note ?","en":"What is the difference between a SAFE and a convertible note?"},"back":{"fr":"Le SAFE n'est pas de la dette : ni intérêts ni maturité. La convertible note est un prêt avec intérêts et échéance. Les deux convertissent en equity au prochain tour, souvent avec cap et/ou discount.","en":"A SAFE is not debt: no interest, no maturity. A convertible note is a loan with interest and a maturity. Both convert to equity at the next round, often with a cap and/or discount."},"hint":null},{"id":"fc.l5.vc.005","type":"flashcard","level":5,"topic":"VC","tags":["multiples"],"difficulty":5,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.vc","front":{"fr":"Pourquoi un DCF est-il inadapté pour une startup en hyper-croissance ?","en":"Why is a DCF unsuitable for a hyper-growth startup?"},"back":{"fr":"Ses cash-flows sont négatifs et imprévisibles, et la valeur dépend surtout d'une terminal value très sensible. On préfère des multiples de traction : ARR, GMV ou valeur par utilisateur.","en":"Its cash flows are negative and unpredictable, and value rests mostly on a highly sensitive terminal value. Traction multiples are preferred: ARR, GMV or value per user."},"hint":null},{"id":"fc.l5.vc.006","type":"flashcard","level":5,"topic":"VC","tags":["ESOP"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.vc","front":{"fr":"Qui supporte la dilution quand l'ESOP est créé/élargi avant un tour ?","en":"Who bears the dilution when the ESOP is created/expanded before a round?"},"back":{"fr":"Les actionnaires existants (surtout les fondateurs), car le pool est pris sur la pre-money — le nouvel investisseur exige souvent que le pool soit en place avant son entrée.","en":"Existing shareholders (mainly founders), because the pool comes out of the pre-money — the new investor often requires the pool in place before they come in."},"hint":null},{"id":"fc.l5.fit.001","type":"flashcard","level":5,"topic":"Fit","tags":["LBO"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.deal-judgment","front":{"fr":"Quelles caractéristiques font un bon candidat LBO ?","en":"What characteristics make a good LBO candidate?"},"back":{"fr":"Free cash flows récurrents et prévisibles, capex faible, position de marché défendable, management solide, et un levier de création de valeur clair (croissance, marge, build-up).","en":"Recurring and predictable free cash flows, low capex, defensible market position, strong management, and a clear value-creation lever (growth, margin, buy-and-build)."},"hint":null},{"id":"fc.l5.fit.002","type":"flashcard","level":5,"topic":"Fit","tags":["interview"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.deal-judgment","front":{"fr":"Comment structurer sa réponse à « parlez-moi d'un deal » ?","en":"How to structure your answer to 'tell me about a deal'?"},"back":{"fr":"Contexte (secteur, taille, type) → thèse (pourquoi c'est intéressant) → chiffres clés (valo, multiple, leverage) → risques. Et toujours avoir une opinion argumentée.","en":"Context (sector, size, type) -> thesis (why interesting) -> key figures (valuation, multiple, leverage) -> risks. And always have a reasoned opinion."},"hint":null},{"id":"fc.l5.fit.003","type":"flashcard","level":5,"topic":"Fit","tags":["red flag"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.deal-judgment","front":{"fr":"Cite trois red flags classiques en due diligence.","en":"Name three classic red flags in due diligence."},"back":{"fr":"Concentration client (un client > 20-30 % du CA), qualité d'EBITDA douteuse (add-backs agressifs), et dépendance à un homme clé ou à un fournisseur unique.","en":"Customer concentration (one client > 20-30% of revenue), dubious EBITDA quality (aggressive add-backs), and key-man or single-supplier dependency."},"hint":null},{"id":"fc.l5.fit.004","type":"flashcard","level":5,"topic":"Fit","tags":["thesis"],"difficulty":5,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.deal-judgment","front":{"fr":"Quels sont les trois blocs d'une recommandation d'investissement ?","en":"What are the three blocks of an investment recommendation?"},"back":{"fr":"(1) La thèse (pourquoi investir, levier de valeur, rendement attendu), (2) les risques classés, (3) les mitigants. On conclut par une position nette : go / no-go / conditionnel.","en":"(1) The thesis (why invest, value lever, expected return), (2) ranked risks, (3) mitigants. Conclude with a clear stance: go / no-go / conditional."},"hint":null},{"id":"fc.l5.fit.005","type":"flashcard","level":5,"topic":"Fit","tags":["judgment"],"difficulty":5,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.deal-judgment","front":{"fr":"Pourquoi un bon business n'est-il pas toujours un bon deal ?","en":"Why is a good business not always a good deal?"},"back":{"fr":"Parce que le rendement dépend du prix payé : une excellente société achetée trop cher (multiple d'entrée élevé) peut donner un IRR médiocre.","en":"Because returns depend on the price paid: an excellent company bought too expensively (high entry multiple) can yield a mediocre IRR."},"hint":null},{"id":"fc.l5.fit.006","type":"flashcard","level":5,"topic":"Fit","tags":["quant-qual"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.deal-judgment","front":{"fr":"Comment relier quantitatif et qualitatif sur un deal ?","en":"How to connect quantitative and qualitative on a deal?"},"back":{"fr":"Chaque hypothèse chiffrée doit avoir une justification de marché : une croissance de 10 % se relie à un TAM, des parts de marché et un pipeline, pas à une cellule Excel.","en":"Each numeric assumption must have a market justification: 10% growth ties to a TAM, market share and pipeline, not to an Excel cell."},"hint":null},{"id":"fc.l4.lbo1.001","type":"flashcard","level":4,"topic":"LBO","tags":["LBO"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.lbo1-paper","front":{"fr":"Quels sont les trois leviers de rendement d'un [[LBO]] ?","en":"What are the three return levers of an [[LBO]]?"},"back":{"fr":"Le désendettement (les FCF remboursent la dette et transfèrent de la valeur à l'actionnaire), la croissance de l'EBITDA, et l'expansion du multiple de sortie.","en":"Deleveraging (FCF repays debt and transfers value to the shareholder), EBITDA growth, and multiple expansion at exit."},"hint":null},{"id":"fc.l4.lbo1.002","type":"flashcard","level":4,"topic":"LBO","tags":["LBO"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.lbo1-paper","front":{"fr":"Quel est le candidat idéal à un LBO : forte croissance ou cash-flows stables ?","en":"What is the ideal LBO candidate: high growth or stable cash flows?"},"back":{"fr":"Des cash-flows stables et prévisibles priment sur une forte croissance, car ils sécurisent le service de la dette. Une société hyper-croissance consommatrice de cash est un mauvais candidat.","en":"Stable, predictable cash flows beat high growth, because they secure debt service. A cash-burning hyper-growth company is a poor candidate."},"hint":null},{"id":"fc.l4.lbo1.003","type":"flashcard","level":4,"topic":"LBO","tags":["LBO","structuration"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.lbo1-paper","front":{"fr":"Quelle est la différence entre HoldCo et BidCo ?","en":"What is the difference between HoldCo and BidCo?"},"back":{"fr":"La HoldCo reçoit l'equity des fonds et managers ; la BidCo porte la dette d'acquisition et rachète l'OpCo. La dette se loge ainsi au plus près des cash-flows opérationnels.","en":"HoldCo receives equity from the funds and managers; BidCo carries the acquisition debt and buys OpCo. Debt thus sits close to operating cash flows."},"hint":null},{"id":"fc.l4.lbo1.004","type":"flashcard","level":4,"topic":"LBO","tags":["EV","equity value"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.lbo1-paper","front":{"fr":"Comment passe-t-on de l'[[EV]] à l'[[equity value]] ?","en":"How do you go from [[EV]] to [[equity value]]?"},"back":{"fr":"Equity Value = EV − dette nette = EV − dette + cash. Un cash net positif augmente l'equity value, une dette nette la réduit.","en":"Equity Value = EV − net debt = EV − debt + cash. Net cash increases equity value, net debt reduces it."},"hint":null},{"id":"fc.l4.lbo1.005","type":"flashcard","level":4,"topic":"LBO","tags":["EV"],"difficulty":3,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l4.lbo1-paper","front":{"fr":"EBITDA 20, multiple d'entrée 12x, cash net +10 : quelle equity value ?","en":"EBITDA 20, entry multiple 12x, net cash +10: what equity value?"},"back":{"fr":"EV = 12 × 20 = 240 ; Equity Value = 240 + 10 = 250.","en":"EV = 12 × 20 = 240; Equity Value = 240 + 10 = 250."},"hint":null},{"id":"fc.l4.lbo1.006","type":"flashcard","level":4,"topic":"LBO","tags":["LBO","leverage"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.lbo1-paper","front":{"fr":"L'effet de levier crée-t-il de la valeur intrinsèque ?","en":"Does leverage create intrinsic value?"},"back":{"fr":"Non. Il amplifie le rendement sur fonds propres et le risque, mais ne crée pas de cash-flow opérationnel.","en":"No. It amplifies the return on equity and the risk, but does not create operating cash flow."},"hint":null},{"id":"fc.l4.lbo2.001","type":"flashcard","level":4,"topic":"LBO","tags":["Sources & Uses"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.lbo2-sources-uses","front":{"fr":"Quelle égalité fondamentale régit un tableau Sources & Uses ?","en":"What fundamental equality governs a Sources & Uses table?"},"back":{"fr":"Total Emplois = Total Ressources. Les emplois (equity value + refinancement + frais) sont financés par les ressources (dette + equity sponsor).","en":"Total Uses = Total Sources. Uses (equity value + refinancing + fees) are funded by sources (debt + sponsor equity)."},"hint":null},{"id":"fc.l4.lbo2.002","type":"flashcard","level":4,"topic":"LBO","tags":["Sources & Uses","equity value"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.lbo2-sources-uses","front":{"fr":"Comment calcule-t-on l'equity du sponsor dans un S&U ?","en":"How is sponsor equity computed in an S&U?"},"back":{"fr":"C'est le plug : Equity sponsor = Total Emplois − Dette levée. On fixe d'abord la dette via le levier cible, l'equity est le solde.","en":"It is the plug: Sponsor equity = Total Uses − Debt raised. Debt is set first via target leverage, equity is the balance."},"hint":null},{"id":"fc.l4.lbo2.003","type":"flashcard","level":4,"topic":"LBO","tags":["Sources & Uses","unitranche"],"difficulty":3,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l4.lbo2-sources-uses","front":{"fr":"Equity value 250, frais 10, unitranche 60 : quel chèque equity sponsor ?","en":"Equity value 250, fees 10, unitranche 60: what sponsor equity cheque?"},"back":{"fr":"Emplois = 250 + 10 = 260 ; Equity sponsor = 260 − 60 = 200.","en":"Uses = 250 + 10 = 260; Sponsor equity = 260 − 60 = 200."},"hint":null},{"id":"fc.l4.lbo2.004","type":"flashcard","level":4,"topic":"LBO","tags":["leverage"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.lbo2-sources-uses","front":{"fr":"Sur quelle base dimensionne-t-on la dette d'un LBO ?","en":"On what base is LBO debt sized?"},"back":{"fr":"En multiple d'EBITDA (Dette nette / EBITDA), pas en % du prix. Un levier 3,0x sur EBITDA 20 = 60 de dette.","en":"As an EBITDA multiple (Net debt / EBITDA), not a % of price. 3.0x leverage on EBITDA 20 = 60 of debt."},"hint":null},{"id":"fc.l4.lbo2.005","type":"flashcard","level":4,"topic":"LBO","tags":["Sources & Uses","TEV"],"difficulty":4,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l4.lbo2-sources-uses","front":{"fr":"Variante WSO : EBITDA 75 à 7,5x, dette 5,0x. Quels TEV, dette et equity sponsor (avec frais) ?","en":"WSO variant: EBITDA 75 at 7.5x, debt 5.0x. What TEV, debt and sponsor equity (with fees)?"},"back":{"fr":"TEV = 7,5 × 75 = 562,5 ; dette = 5,0 × 75 = 375 ; equity sponsor (avec frais) ≈ 202,5.","en":"TEV = 7.5 × 75 = 562.5; debt = 5.0 × 75 = 375; sponsor equity (with fees) ≈ 202.5."},"hint":null},{"id":"fc.l4.lbo2.006","type":"flashcard","level":4,"topic":"LBO","tags":["Sources & Uses"],"difficulty":3,"source":{"flag":"APPROXIMATE"},"moduleId":"mod.l4.lbo2-sources-uses","front":{"fr":"Ordre de grandeur des honoraires M&A sur un deal mid-cap français ?","en":"Order of magnitude of M&A fees on a French mid-cap deal?"},"back":{"fr":"Environ 1–2% de la valeur d'opération, plus des frais de financement (arrangement fee) qui s'ajoutent.","en":"Roughly 1–2% of deal value, plus financing arrangement fees on top."},"hint":null},{"id":"fc.l4.lbo3.001","type":"flashcard","level":4,"topic":"LevFin","tags":["term loan B","revolver"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.lbo3-levfin","front":{"fr":"Différence entre [[revolver]] et [[term loan B]] ?","en":"Difference between [[revolver]] and [[term loan B]]?"},"back":{"fr":"Le revolver (RCF) est une ligne renouvelable pour le BFR, souvent non tirée ; le TLB est un prêt à terme remboursé in fine, à taux variable. Tous deux sont senior secured.","en":"The revolver (RCF) is a revolving line for working capital, often undrawn; the TLB is a bullet term loan at a floating rate. Both are senior secured."},"hint":null},{"id":"fc.l4.lbo3.002","type":"flashcard","level":4,"topic":"LevFin","tags":["PIK"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.lbo3-levfin","front":{"fr":"Cash interest vs intérêts [[PIK]] : quelle différence ?","en":"Cash interest vs [[PIK]] interest: what is the difference?"},"back":{"fr":"Le cash interest est décaissé et pèse sur le FCF ; le PIK n'est pas payé en cash mais capitalise dans le principal, préservant la trésorerie mais gonflant la dette finale.","en":"Cash interest is disbursed and weighs on FCF; PIK is not paid in cash but capitalises into principal, preserving liquidity but inflating the final debt."},"hint":null},{"id":"fc.l4.lbo3.003","type":"flashcard","level":4,"topic":"LevFin","tags":["covenants"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.lbo3-levfin","front":{"fr":"Covenants maintenance vs incurrence ?","en":"Maintenance vs incurrence covenants?"},"back":{"fr":"Maintenance = ratios testés à chaque période (stricts, un dérapage = défaut technique). Incurrence = testés seulement lors d'une action (nouvelle dette, dividende) ; les deals cov-lite n'ont quasi que de l'incurrence.","en":"Maintenance = ratios tested each period (strict, a breach = technical default). Incurrence = tested only on an action (new debt, dividend); cov-lite deals carry essentially only incurrence."},"hint":null},{"id":"fc.l4.lbo3.004","type":"flashcard","level":4,"topic":"LevFin","tags":["senior debt","PIK","unitranche"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.lbo3-levfin","front":{"fr":"Classez par coût croissant : senior debt, mezzanine, PIK, unitranche.","en":"Rank by increasing cost: senior debt, mezzanine, PIK, unitranche."},"back":{"fr":"Senior debt (le moins cher) < unitranche (intermédiaire) < mezzanine < PIK (le plus cher). Le coût suit la séniorité inversée.","en":"Senior debt (cheapest) < unitranche (intermediate) < mezzanine < PIK (most expensive). Cost follows inverted seniority."},"hint":null},{"id":"fc.l4.lbo3.005","type":"flashcard","level":4,"topic":"LevFin","tags":["mezzanine"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.lbo3-levfin","front":{"fr":"À quoi sert la [[mezzanine]] dans une structure LBO ?","en":"What is [[mezzanine]] used for in an LBO structure?"},"back":{"fr":"Elle comble l'écart entre dette senior et equity quand le levier visé dépasse l'appétit de la dette senior. Elle mêle souvent coupon cash, part PIK et warrants (equity kicker).","en":"It bridges the gap between senior debt and equity when target leverage exceeds senior debt's appetite. It often blends a cash coupon, a PIK portion and warrants (equity kicker)."},"hint":null},{"id":"fc.l4.lbo3.006","type":"flashcard","level":4,"topic":"LevFin","tags":["leverage","unitranche"],"difficulty":3,"source":{"flag":"APPROXIMATE"},"moduleId":"mod.l4.lbo3-levfin","front":{"fr":"Ordre de grandeur du levier total mid-cap français, et instrument dominant ?","en":"Order of magnitude of French mid-cap total leverage, and dominant instrument?"},"back":{"fr":"Environ 4,5–5,5x EBITDA selon le cycle de crédit ; l'unitranche est l'instrument dominant des deals sponsorisés par les fonds de dette privée.","en":"Roughly 4.5–5.5x EBITDA depending on the credit cycle; unitranche is the dominant instrument in private-debt-sponsored deals."},"hint":null},{"id":"fc.l4.lbo4-paydown.001","type":"flashcard","level":4,"topic":"LBO","tags":["cash sweep"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.lbo4-paydown","front":{"fr":"Qu'est-ce qu'un cash sweep dans un LBO ?","en":"What is a cash sweep in an LBO?"},"back":{"fr":"Une clause obligeant l'emprunteur à utiliser l'excès de cash (au-delà de l'amortissement contractuel) pour rembourser la dette par anticipation.","en":"A clause obliging the borrower to use excess cash (beyond contractual amortization) to prepay debt early."},"hint":null},{"id":"fc.l4.lbo4-paydown.002","type":"flashcard","level":4,"topic":"LBO","tags":["FCF"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.lbo4-paydown","front":{"fr":"Le free cash flow d'un LBO rembourse-t-il le principal ou les intérêts ?","en":"Does an LBO's free cash flow repay principal or interest?"},"back":{"fr":"Les intérêts sont déjà déduits avant le FCF disponible ; ce dernier sert à rembourser le principal de la dette, ce qui réduit le bilan.","en":"Interest is already deducted before available FCF; the latter repays debt principal, which reduces the balance sheet."},"hint":null},{"id":"fc.l4.lbo4-paydown.003","type":"flashcard","level":4,"topic":"LBO","tags":["net debt"],"difficulty":3,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l4.lbo4-paydown","front":{"fr":"Chez Bridgepoint, quel est le cash de clôture en fin d'année 3 ?","en":"For Bridgepoint, what is the closing cash at the end of year 3?"},"back":{"fr":"Environ 27,7 M€, issu de l'accumulation du FCF (2,0 ; 3,2 ; 4,6 sur Y1–Y3) et des soldes capitalisés.","en":"About €27.7m, from accumulated FCF (2.0; 3.2; 4.6 over Y1–Y3) plus carried balances."},"hint":null},{"id":"fc.l4.lbo4-paydown.004","type":"flashcard","level":4,"topic":"LBO","tags":["deleveraging"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.lbo4-paydown","front":{"fr":"Pourquoi le désendettement crée-t-il de la valeur pour l'equity ?","en":"Why does deleveraging create equity value?"},"back":{"fr":"À EV constante, rembourser la dette réduit la dette nette et transfère mécaniquement de la valeur des créanciers vers les actionnaires.","en":"At constant EV, repaying debt reduces net debt and mechanically transfers value from creditors to shareholders."},"hint":null},{"id":"fc.l4.lbo4-paydown.005","type":"flashcard","level":4,"topic":"LBO","tags":["amortization"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.lbo4-paydown","front":{"fr":"Différence entre amortissement obligatoire et cash sweep ?","en":"Difference between mandatory amortization and cash sweep?"},"back":{"fr":"L'amortissement est un remboursement contractuel fixe ; le cash sweep est un remboursement conditionnel de l'excès de cash, variable.","en":"Amortization is a fixed contractual repayment; the cash sweep is a conditional, variable repayment of excess cash."},"hint":null},{"id":"fc.l4.lbo4-paydown.006","type":"flashcard","level":4,"topic":"LBO","tags":["debt"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.lbo4-paydown","front":{"fr":"Comment calcule-t-on le capital restant dû en fin d'année ?","en":"How is year-end outstanding principal computed?"},"back":{"fr":"Capital d'ouverture − amortissement obligatoire − cash sweep, suivi tranche par tranche selon la séniorité.","en":"Opening principal − mandatory amortization − cash sweep, tracked tranche by tranche by seniority."},"hint":null},{"id":"fc.l4.lbo5-returns.001","type":"flashcard","level":4,"topic":"LBO","tags":["MoM"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.lbo5-returns","front":{"fr":"Comment calcule-t-on le MoM d'un LBO ?","en":"How is an LBO's MoM computed?"},"back":{"fr":"MoM = equity de sortie / equity d'entrée, avec equity de sortie = EV de sortie − dette nette de sortie.","en":"MoM = exit equity / entry equity, with exit equity = exit EV − exit net debt."},"hint":null},{"id":"fc.l4.lbo5-returns.002","type":"flashcard","level":4,"topic":"LBO","tags":["IRR"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.lbo5-returns","front":{"fr":"Formule de l'IRR pour un flux unique entrée/sortie ?","en":"IRR formula for a single in/out cash flow?"},"back":{"fr":"IRR = MoM^(1/n) − 1, où n est le nombre d'années de détention. C'est un taux composé.","en":"IRR = MoM^(1/n) − 1, where n is the number of holding years. It is a compound rate."},"hint":null},{"id":"fc.l4.lbo5-returns.003","type":"flashcard","level":4,"topic":"LBO","tags":["value creation"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.lbo5-returns","front":{"fr":"Quels sont les trois leviers de création de valeur en LBO ?","en":"What are the three value-creation levers in an LBO?"},"back":{"fr":"Croissance de l'EBITDA, multiple expansion, et désendettement. La croissance du CA seule n'est pas un levier.","en":"EBITDA growth, multiple expansion, and deleveraging. Revenue growth alone is not a lever."},"hint":null},{"id":"fc.l4.lbo5-returns.004","type":"flashcard","level":4,"topic":"LBO","tags":["exit"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.lbo5-returns","front":{"fr":"Pourquoi l'acheteur stratégique est-il souvent la meilleure sortie ?","en":"Why is the strategic buyer often the best exit?"},"back":{"fr":"Parce qu'il peut payer les synergies (économies de coûts, revenus croisés) qu'un fonds financier ne valorise pas.","en":"Because it can pay for synergies (cost savings, cross-revenues) that a financial buyer does not value."},"hint":null},{"id":"fc.l4.lbo5-returns.005","type":"flashcard","level":4,"topic":"LBO","tags":["dividend recap"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.lbo5-returns","front":{"fr":"Qu'est-ce qu'un dividend recap et quel est son effet sur l'IRR ?","en":"What is a dividend recap and its effect on IRR?"},"back":{"fr":"Un réendettement pour verser un dividende aux actionnaires sans vendre ; il avance un flux de cash et améliore donc l'IRR.","en":"Re-leveraging to pay shareholders a dividend without selling; it pulls forward a cash flow and thus improves IRR."},"hint":null},{"id":"fc.l4.lbo5-returns.006","type":"flashcard","level":4,"topic":"LBO","tags":["rules of thumb"],"difficulty":3,"source":{"flag":"APPROXIMATE"},"moduleId":"mod.l4.lbo5-returns","front":{"fr":"Règle de pouce : IRR d'un 3x sur 3 ans et d'un 2x sur 3 ans ?","en":"Rule of thumb: IRR of a 3x over 3 years and a 2x over 3 years?"},"back":{"fr":"3x sur 3 ans ≈ 45% d'IRR ; 2x sur 3 ans ≈ 25% d'IRR.","en":"3x over 3 years ≈ 45% IRR; 2x over 3 years ≈ 25% IRR."},"hint":null},{"id":"fc.l4.ma1.001","type":"flashcard","level":4,"topic":"M&A","tags":["process"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.ma1-process","front":{"fr":"Quel document est diffusé en premier dans une cession, et est-il nominatif ?","en":"Which document is circulated first in a sale, and is it named?"},"back":{"fr":"Le [[teaser]] : un document court et anonyme destiné à susciter l'intérêt avant la signature du NDA.","en":"The [[teaser]]: a short, anonymous document meant to spark interest before the NDA is signed."},"hint":null},{"id":"fc.l4.ma1.002","type":"flashcard","level":4,"topic":"M&A","tags":["process"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.ma1-process","front":{"fr":"Dans quel ordre interviennent NDA, IM et NBO ?","en":"In what order do the NDA, IM and NBO come?"},"back":{"fr":"On signe d'abord le [[NDA]], puis on reçoit l'[[information memorandum]], et l'on dépose ensuite le [[NBO]] (offre non engageante).","en":"First the [[NDA]] is signed, then the [[information memorandum]] is received, then the [[NBO]] (non-binding offer) is submitted."},"hint":null},{"id":"fc.l4.ma1.003","type":"flashcard","level":4,"topic":"M&A","tags":["process"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.ma1-process","front":{"fr":"Le NBO engage-t-il l'acquéreur ?","en":"Does the NBO commit the buyer?"},"back":{"fr":"Non. Le [[NBO]] est non engageant ; seule la binding offer remise après la due diligence engage l'acquéreur.","en":"No. The [[NBO]] is non-binding; only the binding offer submitted after due diligence commits the buyer."},"hint":null},{"id":"fc.l4.ma1.004","type":"flashcard","level":4,"topic":"M&A","tags":["sell-side"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.ma1-process","front":{"fr":"Sell-side vs buy-side : qui représente qui ?","en":"Sell-side vs buy-side: who represents whom?"},"back":{"fr":"Le sell-side conseille le vendeur (prépare l'IM, maximise le prix) ; le buy-side conseille l'acquéreur (sourcing, valorisation, négociation à la baisse).","en":"Sell-side advises the seller (prepares the IM, maximises price); buy-side advises the buyer (sourcing, valuation, negotiating down)."},"hint":null},{"id":"fc.l4.ma1.005","type":"flashcard","level":4,"topic":"M&A","tags":["auction"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.ma1-process","front":{"fr":"Enchères vs gré à gré : principal arbitrage du vendeur ?","en":"Auction vs bilateral: the seller's main trade-off?"},"back":{"fr":"Les enchères maximisent le prix par la concurrence mais sont plus longues et plus exposées aux fuites ; le gré à gré privilégie discrétion et rapidité.","en":"An auction maximises price through competition but is slower and more leak-prone; a bilateral deal favours discretion and speed."},"hint":null},{"id":"fc.l4.ma1.006","type":"flashcard","level":4,"topic":"M&A","tags":["earn-out"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.ma1-process","front":{"fr":"À quoi sert un earn-out ?","en":"What is an earn-out for?"},"back":{"fr":"Un [[earn-out]] indexe une partie du prix sur la performance post-deal (EBITDA, CA), comblant l'écart de valorisation mais générant souvent des litiges.","en":"An [[earn-out]] indexes part of the price on post-deal performance (EBITDA, revenue), bridging the valuation gap but often generating disputes."},"hint":null},{"id":"fc.l4.ma1.007","type":"flashcard","level":4,"topic":"M&A","tags":["fees"],"difficulty":3,"source":{"flag":"APPROXIMATE"},"moduleId":"mod.l4.ma1-process","front":{"fr":"Ordre de grandeur des frais conseil M&A ?","en":"Order of magnitude of M&A advisory fees?"},"back":{"fr":"Environ 1 à 2 % de la valeur de transaction (success fee), souvent complété d'un retainer mensuel ; le pourcentage baisse sur les très gros deals.","en":"About 1 to 2% of transaction value (success fee), often plus a monthly retainer; the percentage falls on very large deals."},"hint":null},{"id":"fc.l4.ma2.001","type":"flashcard","level":4,"topic":"M&A","tags":["accretion/dilution"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.ma2-accretion","front":{"fr":"Quand un deal est-il relutif (accretive) ?","en":"When is a deal accretive?"},"back":{"fr":"Quand le BPA ([[EPS]]) pro forma de l'acquéreur augmente après le deal ; il est dilutif s'il baisse.","en":"When the acquirer's pro forma EPS ([[EPS]]) rises after the deal; it is dilutive if it falls."},"hint":null},{"id":"fc.l4.ma2.002","type":"flashcard","level":4,"topic":"M&A","tags":["accretion/dilution"],"difficulty":5,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.ma2-accretion","front":{"fr":"Règle de pouce : cible à P/E plus bas, financée en cash/dette ?","en":"Rule of thumb: lower-P/E target funded with cash/debt?"},"back":{"fr":"Relutif si le rendement de la cible (1/P/E) dépasse le coût APRÈS impôt du financement. La comparaison se fait sur le coût net d'impôt.","en":"Accretive if the target's yield (1/P/E) exceeds the AFTER-tax cost of financing. The comparison uses the after-tax cost."},"hint":null},{"id":"fc.l4.ma2.003","type":"flashcard","level":4,"topic":"M&A","tags":["EPS"],"difficulty":5,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l4.ma2-accretion","front":{"fr":"Acquéreur BPA 10 ; deal en actions donne BPA (100+60)/(10+10). Relutif ?","en":"Acquirer EPS 10; stock deal gives EPS (100+60)/(10+10). Accretive?"},"back":{"fr":"BPA pro forma = 160/20 = 8 < 10 : DILUTIF (−20 %), malgré une cible « moins chère », car le ratio d'échange domine.","en":"Pro forma EPS = 160/20 = 8 < 10: DILUTIVE (−20%), despite a 'cheaper' target, because the exchange ratio dominates."},"hint":null},{"id":"fc.l4.ma2.004","type":"flashcard","level":4,"topic":"M&A","tags":["synergies"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.ma2-accretion","front":{"fr":"Synergies de coûts vs de revenus : lesquelles sont les plus crédibles ?","en":"Cost vs revenue synergies: which are more credible?"},"back":{"fr":"Les synergies de coûts (doublons, achats) sont plus crédibles et rapides ; les synergies de revenus (cross-selling) sont réelles mais bien plus incertaines.","en":"Cost synergies (duplications, procurement) are more credible and faster; revenue synergies (cross-selling) are real but far more uncertain."},"hint":null},{"id":"fc.l4.ma2.005","type":"flashcard","level":4,"topic":"M&A","tags":["OPA"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.ma2-accretion","front":{"fr":"Quel seuil déclenche une OPA obligatoire en France ?","en":"Which threshold triggers a mandatory tender offer in France?"},"back":{"fr":"Le franchissement de 30 % du capital ou des droits de vote oblige à lancer une [[OPA]] sur le solde des titres.","en":"Crossing 30% of capital or voting rights triggers a mandatory [[OPA]] (tender offer) for the remaining shares."},"hint":null},{"id":"fc.l4.ma2.006","type":"flashcard","level":4,"topic":"M&A","tags":["defences"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.ma2-accretion","front":{"fr":"Citez deux défenses anti-OPA classiques.","en":"Name two classic anti-takeover defences."},"back":{"fr":"La poison pill (dilution déclenchée pour renchérir la prise de contrôle) et le white knight (acquéreur ami sollicité contre l'assaillant).","en":"The poison pill (a triggered dilution making the takeover costlier) and the white knight (a friendly acquirer brought in against the raider)."},"hint":null},{"id":"fc.l4.pf.001","type":"flashcard","level":4,"topic":"ProjectFinance","tags":["DSCR"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.project-finance","front":{"fr":"Quelle est la formule du DSCR ?","en":"What is the DSCR formula?"},"back":{"fr":"[[DSCR]] = CFADS / service de la dette (intérêts + principal exigible). Ex. 100/50 = 2,0x ; minimum bancaire ~1,0x.","en":"[[DSCR]] = CFADS / debt service (interest + principal due). E.g. 100/50 = 2.0x; bank minimum ~1.0x."},"hint":null},{"id":"fc.l4.pf.002","type":"flashcard","level":4,"topic":"ProjectFinance","tags":["ICR"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.project-finance","front":{"fr":"DSCR vs ICR : quelle différence ?","en":"DSCR vs ICR: what is the difference?"},"back":{"fr":"Le DSCR couvre intérêts + principal (CFADS / service de la dette) ; l'ICR ne couvre que les intérêts (EBIT / intérêts, ex. 150/50 = 3,0x). Ce sont des ratios distincts.","en":"DSCR covers interest + principal (CFADS / debt service); ICR covers interest only (EBIT / interest, e.g. 150/50 = 3.0x). They are distinct ratios."},"hint":null},{"id":"fc.l4.pf.003","type":"flashcard","level":4,"topic":"ProjectFinance","tags":["LLCR","PLCR"],"difficulty":5,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.project-finance","front":{"fr":"LLCR vs PLCR : que mesurent-ils et lequel est plus grand ?","en":"LLCR vs PLCR: what do they measure and which is larger?"},"back":{"fr":"Le [[LLCR]] = VAN du CFADS sur la durée du prêt / dette ; le [[PLCR]] = VAN du CFADS sur la durée du projet / dette. PLCR ≥ LLCR car il inclut le tail.","en":"[[LLCR]] = NPV of CFADS over the loan life / debt; [[PLCR]] = NPV of CFADS over the project life / debt. PLCR ≥ LLCR because it includes the tail."},"hint":null},{"id":"fc.l4.pf.004","type":"flashcard","level":4,"topic":"ProjectFinance","tags":["non-recourse"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.project-finance","front":{"fr":"Que signifie une dette non-recourse ?","en":"What does non-recourse debt mean?"},"back":{"fr":"Les prêteurs ne se remboursent que sur les cash-flows et actifs du projet, sans recours sur le bilan des sponsors. D'où l'exigence de ratios stricts et d'un DSRA.","en":"Lenders are repaid only from the project's cash flows and assets, with no recourse to the sponsors' balance sheets. Hence strict ratios and a DSRA."},"hint":null},{"id":"fc.l4.pf.005","type":"flashcard","level":4,"topic":"ProjectFinance","tags":["DSRA"],"difficulty":3,"source":{"flag":"APPROXIMATE"},"moduleId":"mod.l4.project-finance","front":{"fr":"À quoi sert un DSRA et quelle taille typique ?","en":"What is a DSRA for and what is its typical size?"},"back":{"fr":"Le DSRA (Debt Service Reserve Account) immobilise une réserve de 6 à 12 mois de service de la dette en sécurité pour les prêteurs.","en":"The DSRA (Debt Service Reserve Account) sets aside 6 to 12 months of debt service as a buffer for lenders."},"hint":null},{"id":"fc.l4.pf.006","type":"flashcard","level":4,"topic":"ProjectFinance","tags":["PPP"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.project-finance","front":{"fr":"Qu'est-ce qu'un PPP en project finance ?","en":"What is a PPP in project finance?"},"back":{"fr":"Un partenariat public-privé : un consortium privé finance et exploite une infrastructure publique, remboursé par des paiements de disponibilité ou des péages.","en":"A public-private partnership: a private consortium finances and operates a public asset, repaid via availability payments or tolls."},"hint":null},{"id":"fc.l4.ts.001","type":"flashcard","level":4,"topic":"Accounting","tags":["three-statement"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.three-statement-model","front":{"fr":"Comment le résultat net relie-t-il les trois états ?","en":"How does net income link the three statements?"},"back":{"fr":"Le résultat net du compte de résultat alimente les capitaux propres au bilan et constitue le point de départ du tableau de flux de trésorerie.","en":"Net income from the P&L feeds equity on the balance sheet and is the starting point of the cash flow statement."},"hint":null},{"id":"fc.l4.ts.002","type":"flashcard","level":4,"topic":"Accounting","tags":["AirNeo"],"difficulty":4,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l4.three-statement-model","front":{"fr":"Cas AirNeo : amortissement économique annuel de l'avion ?","en":"AirNeo case: annual economic depreciation of the aircraft?"},"back":{"fr":"Avion 50 M€ amorti en linéaire sur 25 ans = 2 M€ par an (à distinguer du remboursement de principal de 4,5 M€/an sur 10 ans).","en":"€50m aircraft depreciated straight-line over 25 years = €2m per year (distinct from the €4.5m/yr principal repayment over 10 years)."},"hint":null},{"id":"fc.l4.ts.003","type":"flashcard","level":4,"topic":"Accounting","tags":["correction"],"difficulty":5,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l4.three-statement-model","front":{"fr":"Quelle erreur cassait le fichier corrigé de la dataroom AirNeo ?","en":"What error broke the AirNeo dataroom 'corrected' file?"},"back":{"fr":"Le chiffre d'affaires était figé à 0, ce qui produisait des marges absurdes, un DSCR = ICR à tort, des fournisseurs à 5 (au lieu de 1,25) et une trésorerie de −70.","en":"Revenue was frozen at 0, producing absurd margins, a wrongly equal DSCR = ICR, payables of 5 (instead of 1.25) and cash of −70."},"hint":null},{"id":"fc.l4.ts.004","type":"flashcard","level":4,"topic":"Accounting","tags":["AirNeo"],"difficulty":4,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l4.three-statement-model","front":{"fr":"Cas AirNeo : résultat net de l'année 1 (mini-version correcte) ?","en":"AirNeo case: year-1 net income (correct mini-version)?"},"back":{"fr":"EBIT = 15 − 7 − 2 = 6 ; RAI = 6 − 1,80 (intérêts) = 4,20 ; IS 25 % = 1,05 ; résultat net = 3,15 M€.","en":"EBIT = 15 − 7 − 2 = 6; pre-tax = 6 − 1.80 (interest) = 4.20; tax 25% = 1.05; net income = €3.15m."},"hint":null},{"id":"fc.l4.ts.005","type":"flashcard","level":4,"topic":"Accounting","tags":["cash-flow"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.three-statement-model","front":{"fr":"Pourquoi réintègre-t-on l'amortissement dans le flux d'exploitation ?","en":"Why is depreciation added back in operating cash flow?"},"back":{"fr":"Parce que c'est une charge comptable non décaissée : elle réduit le résultat mais ne sort pas de trésorerie, on la rajoute donc au départ du résultat net.","en":"Because it is a non-cash accounting charge: it lowers profit but no cash leaves, so it is added back starting from net income."},"hint":null}],"qcm":[{"id":"qcm.l3.excel-best.001","type":"qcm","level":3,"topic":"Excel","tags":["colors"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.excel-best","stem":{"fr":"Dans la convention de couleurs standard, qu'indique le bleu ?","en":"In the standard colour convention, what does blue indicate?"},"multi":false,"options":[{"id":"a","text":{"fr":"Une formule de calcul","en":"A calculation formula"},"correct":false,"why":{"fr":"Les formules sont en noir.","en":"Formulas are black."}},{"id":"b","text":{"fr":"Un input saisi en dur","en":"A hardcoded input"},"correct":true,"why":{"fr":"Le bleu marque les hypothèses brutes que l'on peut modifier.","en":"Blue marks raw assumptions you may change."}},{"id":"c","text":{"fr":"Un lien vers une autre feuille","en":"A link to another sheet"},"correct":false,"why":{"fr":"Les liens inter-feuilles sont en vert.","en":"Cross-sheet links are green."}},{"id":"d","text":{"fr":"Un check ou une alerte","en":"A check or alert"},"correct":false,"why":{"fr":"Les checks sont en rouge.","en":"Checks are red."}}],"explanation":{"fr":"Bleu = input en dur, noir = formule, vert = lien inter-feuilles, rouge = check. La couleur porte une sémantique, pas une décoration.","en":"Blue = hardcoded input, black = formula, green = cross-sheet link, red = check. Colour carries semantics, not decoration."},"workings":null},{"id":"qcm.l3.excel-best.002","type":"qcm","level":3,"topic":"Excel","tags":["circularity"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.excel-best","stem":{"fr":"Quelle est la meilleure façon de gérer la circularité intérêts ↔ dette en LBO ?","en":"What is the best way to handle interest ↔ debt circularity in an LBO?"},"multi":false,"options":[{"id":"a","text":{"fr":"Activer le calcul itératif et ne plus y penser","en":"Enable iterative calculation and forget about it"},"correct":false,"why":{"fr":"Cela rend le modèle instable (valeurs figées, #REF) sans filet de sécurité.","en":"This makes the model unstable (frozen values, #REF) with no safety net."}},{"id":"b","text":{"fr":"Un interrupteur 0/1 qui peut casser la boucle","en":"A 0/1 switch that can break the loop"},"correct":true,"why":{"fr":"À 0, on calcule les intérêts sur la dette d'ouverture ; on rebascule à 1 une fois stable. C'est le filet de sécurité.","en":"At 0, interest is computed on opening debt; flip to 1 once stable. This is the safety net."}},{"id":"c","text":{"fr":"Supprimer la ligne d'intérêts du modèle","en":"Delete the interest line from the model"},"correct":false,"why":{"fr":"On perd un poste essentiel du compte de résultat.","en":"You lose an essential income-statement item."}},{"id":"d","text":{"fr":"Coller les intérêts en valeur chaque année","en":"Paste interest as a value each year"},"correct":false,"why":{"fr":"Le modèle ne se met plus à jour avec les hypothèses.","en":"The model no longer updates with assumptions."}}],"explanation":{"fr":"L'interrupteur de circularité permet d'activer le calcul itératif tout en gardant un moyen de casser la boucle si le modèle diverge.","en":"The circularity switch lets you enable iterative calculation while keeping a way to break the loop if the model diverges."},"workings":null},{"id":"qcm.l3.excel-best.003","type":"qcm","level":3,"topic":"Excel","tags":["best-practices"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.excel-best","stem":{"fr":"Quelles pratiques font partie des standards de modélisation ? (plusieurs réponses)","en":"Which practices are part of modeling standards? (multiple answers)"},"multi":true,"options":[{"id":"a","text":{"fr":"Séparer inputs, calculs et outputs","en":"Separate inputs, calculations and outputs"},"correct":true,"why":{"fr":"C'est la structure de base d'un modèle auditable.","en":"This is the basic structure of an auditable model."}},{"id":"b","text":{"fr":"Mettre des checks de bilan et de financement","en":"Add balance-sheet and funding checks"},"correct":true,"why":{"fr":"Un modèle robuste s'auto-contrôle.","en":"A robust model self-checks."}},{"id":"c","text":{"fr":"Fusionner les cellules pour centrer les titres","en":"Merge cells to centre titles"},"correct":false,"why":{"fr":"Les cellules fusionnées cassent la navigation et le copier-coller ; on utilise « Centrer sur plusieurs colonnes ».","en":"Merged cells break navigation and copy-paste; use 'Center Across Selection'."}},{"id":"d","text":{"fr":"Référencer les constantes plutôt que les saisir dans les formules","en":"Reference constants rather than typing them in formulas"},"correct":true,"why":{"fr":"Toute constante économique doit être un input traçable.","en":"Every economic constant must be a traceable input."}}],"explanation":{"fr":"Séparation des zones, checks et constantes référencées sont des standards ; fusionner les cellules est précisément à proscrire.","en":"Zone separation, checks and referenced constants are standards; merging cells is precisely what to avoid."},"workings":null},{"id":"qcm.l3.excel-best.004","type":"qcm","level":3,"topic":"Excel","tags":["checks"],"difficulty":3,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l3.excel-best","stem":{"fr":"Emplois = EV 500 + frais 15 = 515. Sources = dette 300 + equity 190 + cash 15. Que montre le check ?","en":"Uses = EV 500 + fees 15 = 515. Sources = debt 300 + equity 190 + cash 15. What does the check show?"},"multi":false,"options":[{"id":"a","text":{"fr":"0 : le financement est bouclé","en":"0: funding is closed"},"correct":false,"why":{"fr":"Les sources ne font que 505, pas 515.","en":"Sources total only 505, not 515."}},{"id":"b","text":{"fr":"Un trou de 10 à financer (check rouge)","en":"A 10 gap to fund (red check)"},"correct":true,"why":{"fr":"515 emplois − 505 sources = 10 : il manque 10 de financement.","en":"515 uses − 505 sources = 10: 10 of funding is missing."}},{"id":"c","text":{"fr":"Un excédent de 10","en":"A 10 surplus"},"correct":false,"why":{"fr":"Les sources sont inférieures aux emplois, donc déficit.","en":"Sources are below uses, so a deficit."}},{"id":"d","text":{"fr":"Impossible à dire","en":"Cannot be determined"},"correct":false,"why":{"fr":"Le calcul est direct : 515 − 505 = 10.","en":"The calculation is direct: 515 − 505 = 10."}}],"explanation":{"fr":"Le check sources = emplois doit valoir 0 ; ici il vaut 10, signalant un déficit de financement.","en":"The sources = uses check should equal 0; here it is 10, flagging a funding gap."},"workings":{"fr":"Emplois 515 − sources (300+190+15=505) = 10.","en":"Uses 515 − sources (300+190+15=505) = 10."}},{"id":"qcm.l3.excel-shortcuts.001","type":"qcm","level":3,"topic":"Excel","tags":["shortcuts"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.excel-shortcuts","stem":{"fr":"Quel raccourci sélectionne jusqu'au bord du bloc de données ?","en":"Which shortcut selects up to the edge of the data block?"},"multi":false,"options":[{"id":"a","text":{"fr":"Ctrl+flèche","en":"Ctrl+arrow"},"correct":false,"why":{"fr":"Il navigue jusqu'au bord mais ne sélectionne pas.","en":"It navigates to the edge but does not select."}},{"id":"b","text":{"fr":"Ctrl+Maj+flèche","en":"Ctrl+Shift+arrow"},"correct":true,"why":{"fr":"Il saute au bord en sélectionnant la plage au passage.","en":"It jumps to the edge while selecting the range."}},{"id":"c","text":{"fr":"Maj+Espace","en":"Shift+Space"},"correct":false,"why":{"fr":"Il sélectionne la ligne entière.","en":"It selects the whole row."}},{"id":"d","text":{"fr":"F2","en":"F2"},"correct":false,"why":{"fr":"F2 entre en mode édition de la cellule.","en":"F2 enters cell edit mode."}}],"explanation":{"fr":"Ctrl+Maj+flèche combine navigation au bord et sélection ; sur Mac on remplace Ctrl par Cmd.","en":"Ctrl+Shift+arrow combines edge navigation and selection; on Mac replace Ctrl with Cmd."},"workings":null},{"id":"qcm.l3.excel-shortcuts.002","type":"qcm","level":3,"topic":"Excel","tags":["shortcuts","mac"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.excel-shortcuts","stem":{"fr":"Sur Mac, F4 ne fige pas la référence. Quelle alternative utiliser ?","en":"On Mac, F4 does not lock the reference. What alternative do you use?"},"multi":false,"options":[{"id":"a","text":{"fr":"Cmd+T ou fn+F4","en":"Cmd+T or fn+F4"},"correct":true,"why":{"fr":"Ce sont les équivalents Mac pour basculer relatif/absolu.","en":"These are the Mac equivalents to cycle relative/absolute."}},{"id":"b","text":{"fr":"Cmd+S","en":"Cmd+S"},"correct":false,"why":{"fr":"Cmd+S enregistre le fichier.","en":"Cmd+S saves the file."}},{"id":"c","text":{"fr":"Cmd+Z","en":"Cmd+Z"},"correct":false,"why":{"fr":"Cmd+Z annule la dernière action.","en":"Cmd+Z undoes the last action."}},{"id":"d","text":{"fr":"Option+flèche","en":"Option+arrow"},"correct":false,"why":{"fr":"Cela ne touche pas aux références.","en":"That does not affect references."}}],"explanation":{"fr":"Sur Mac la touche F4 pilote souvent le système ; Cmd+T (ou fn+F4) bascule la référence relative/absolue/mixte.","en":"On Mac the F4 key often drives the system; Cmd+T (or fn+F4) cycles the reference relative/absolute/mixed."},"workings":null},{"id":"qcm.l3.excel-shortcuts.003","type":"qcm","level":3,"topic":"Excel","tags":["shortcuts","audit"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.excel-shortcuts","stem":{"fr":"Quels raccourcis servent à auditer un modèle ? (plusieurs réponses)","en":"Which shortcuts help audit a model? (multiple answers)"},"multi":true,"options":[{"id":"a","text":{"fr":"Ctrl+` (afficher les formules)","en":"Ctrl+` (show formulas)"},"correct":true,"why":{"fr":"Affiche toutes les formules d'un coup pour relire un fichier.","en":"Shows all formulas at once to review a file."}},{"id":"b","text":{"fr":"Ctrl+[ (antécédents)","en":"Ctrl+[ (precedents)"},"correct":true,"why":{"fr":"Saute aux cellules sources d'une formule.","en":"Jumps to a formula's source cells."}},{"id":"c","text":{"fr":"F9 sur une portion de formule","en":"F9 on part of a formula"},"correct":true,"why":{"fr":"Évalue le morceau sélectionné de la formule.","en":"Evaluates the selected portion of the formula."}},{"id":"d","text":{"fr":"Ctrl+B (gras)","en":"Ctrl+B (bold)"},"correct":false,"why":{"fr":"C'est une mise en forme, pas un outil d'audit.","en":"That is formatting, not an audit tool."}}],"explanation":{"fr":"Ctrl+`, Ctrl+[ et F9 sont les trois outils d'audit clavier ; Ctrl+B n'est que de la mise en forme.","en":"Ctrl+`, Ctrl+[ and F9 are the three keyboard audit tools; Ctrl+B is just formatting."},"workings":null},{"id":"qcm.l3.excel-shortcuts.004","type":"qcm","level":3,"topic":"Excel","tags":["shortcuts","paste"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.excel-shortcuts","stem":{"fr":"Vous voulez figer une sortie en remplaçant ses formules par des valeurs. Quel raccourci ?","en":"You want to freeze an output by replacing its formulas with values. Which shortcut?"},"multi":false,"options":[{"id":"a","text":{"fr":"Ctrl+C puis Ctrl+V","en":"Ctrl+C then Ctrl+V"},"correct":false,"why":{"fr":"Cela recopie les formules, qui continueront de bouger.","en":"This copies the formulas, which will keep moving."}},{"id":"b","text":{"fr":"Ctrl+Alt+V puis Valeurs","en":"Ctrl+Alt+V then Values"},"correct":true,"why":{"fr":"Le collage spécial > Valeurs fige les chiffres.","en":"Paste Special > Values freezes the numbers."}},{"id":"c","text":{"fr":"Ctrl+D","en":"Ctrl+D"},"correct":false,"why":{"fr":"Ctrl+D recopie vers le bas, sans coller en valeurs.","en":"Ctrl+D fills down, without pasting as values."}},{"id":"d","text":{"fr":"F4","en":"F4"},"correct":false,"why":{"fr":"F4 ne concerne que les références.","en":"F4 only concerns references."}}],"explanation":{"fr":"Le collage spécial en valeurs (Ctrl+Alt+V) est la façon propre de figer une sortie ou de casser un lien.","en":"Paste Special as values (Ctrl+Alt+V) is the clean way to freeze an output or break a link."},"workings":null},{"id":"qcm.l3.excel-formulas.001","type":"qcm","level":3,"topic":"Excel","tags":["npv"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.excel-formulas","stem":{"fr":"Un projet a un capex de −20 en t0 puis +3 par an. Comment écrire la VAN avec NPV ?","en":"A project has a −20 capex at t0 then +3 per year. How do you write the NPV with NPV?"},"multi":false,"options":[{"id":"a","text":{"fr":"=NPV(r;−20;3;3;...)","en":"=NPV(r;−20;3;3;...)"},"correct":false,"why":{"fr":"Cela actualise le capex t0 d'une période de trop : NPV part de la fin de la période 1.","en":"This discounts the t0 capex one period too many: NPV starts at the end of period 1."}},{"id":"b","text":{"fr":"=NPV(r;3;3;...)−20","en":"=NPV(r;3;3;...)−20"},"correct":true,"why":{"fr":"On actualise les flux à partir de t1 et on ajoute le capex t0 hors fonction.","en":"Discount flows from t1 and add the t0 capex outside the function."}},{"id":"c","text":{"fr":"=IRR(−20;3;3;...)","en":"=IRR(−20;3;3;...)"},"correct":false,"why":{"fr":"IRR donne le taux de rendement, pas la VAN.","en":"IRR gives the rate of return, not the NPV."}},{"id":"d","text":{"fr":"=SUM(−20;3;3;...)","en":"=SUM(−20;3;3;...)"},"correct":false,"why":{"fr":"Une simple somme n'actualise pas les flux.","en":"A plain sum does not discount the flows."}}],"explanation":{"fr":"NPV suppose le premier argument à la fin de la période 1 ; le flux t0 (capex) s'ajoute donc en dehors de la fonction.","en":"NPV assumes the first argument at the end of period 1; the t0 flow (capex) is therefore added outside the function."},"workings":null},{"id":"qcm.l3.excel-formulas.002","type":"qcm","level":3,"topic":"Excel","tags":["lookup"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.excel-formulas","stem":{"fr":"La clé de recherche est à droite de la valeur à renvoyer. Quelle fonction ?","en":"The lookup key is to the right of the value to return. Which function?"},"multi":false,"options":[{"id":"a","text":{"fr":"VLOOKUP","en":"VLOOKUP"},"correct":false,"why":{"fr":"VLOOKUP ne cherche que vers la droite : impossible ici.","en":"VLOOKUP only looks to the right: impossible here."}},{"id":"b","text":{"fr":"XLOOKUP (ou INDEX/MATCH)","en":"XLOOKUP (or INDEX/MATCH)"},"correct":true,"why":{"fr":"Les deux cherchent dans n'importe quelle direction.","en":"Both search in any direction."}},{"id":"c","text":{"fr":"HLOOKUP","en":"HLOOKUP"},"correct":false,"why":{"fr":"HLOOKUP cherche horizontalement vers le bas, même limite directionnelle.","en":"HLOOKUP searches horizontally downward, same directional limit."}},{"id":"d","text":{"fr":"SUMIF","en":"SUMIF"},"correct":false,"why":{"fr":"SUMIF somme, il ne fait pas de recherche d'une valeur unique.","en":"SUMIF sums, it does not look up a single value."}}],"explanation":{"fr":"Quand la clé est à droite du résultat, VLOOKUP est inutilisable ; XLOOKUP ou INDEX/MATCH cherchent dans toute direction.","en":"When the key is right of the result, VLOOKUP cannot be used; XLOOKUP or INDEX/MATCH search in any direction."},"workings":null},{"id":"qcm.l3.excel-formulas.003","type":"qcm","level":3,"topic":"Excel","tags":["volatile"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.excel-formulas","stem":{"fr":"Quelles fonctions sont volatiles et à éviter pour la performance ? (plusieurs réponses)","en":"Which functions are volatile and best avoided for performance? (multiple answers)"},"multi":true,"options":[{"id":"a","text":{"fr":"OFFSET","en":"OFFSET"},"correct":true,"why":{"fr":"Volatile : recalcule à chaque modif du classeur.","en":"Volatile: recalculates on every workbook change."}},{"id":"b","text":{"fr":"INDIRECT","en":"INDIRECT"},"correct":true,"why":{"fr":"Volatile et casse le suivi des références.","en":"Volatile and breaks reference tracing."}},{"id":"c","text":{"fr":"INDEX","en":"INDEX"},"correct":false,"why":{"fr":"INDEX n'est PAS volatile : c'est l'alternative recommandée.","en":"INDEX is NOT volatile: it is the recommended alternative."}},{"id":"d","text":{"fr":"SUMIFS","en":"SUMIFS"},"correct":false,"why":{"fr":"SUMIFS n'est pas volatile.","en":"SUMIFS is not volatile."}}],"explanation":{"fr":"OFFSET et INDIRECT sont volatiles et ralentissent un gros modèle ; on les remplace par INDEX (non volatile).","en":"OFFSET and INDIRECT are volatile and slow a large model; replace them with INDEX (non-volatile)."},"workings":null},{"id":"qcm.l3.excel-formulas.004","type":"qcm","level":3,"topic":"Excel","tags":["irr","dates"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.excel-formulas","stem":{"fr":"Des appels et distributions de fonds tombent à des dates irrégulières. Quel taux de rendement utiliser ?","en":"Fund calls and distributions occur on irregular dates. Which return rate function do you use?"},"multi":false,"options":[{"id":"a","text":{"fr":"IRR","en":"IRR"},"correct":false,"why":{"fr":"IRR suppose des périodes régulières et fausserait le taux.","en":"IRR assumes regular periods and would distort the rate."}},{"id":"b","text":{"fr":"XIRR","en":"XIRR"},"correct":true,"why":{"fr":"XIRR prend les dates réelles des flux.","en":"XIRR takes the actual dates of the flows."}},{"id":"c","text":{"fr":"RATE","en":"RATE"},"correct":false,"why":{"fr":"RATE sert aux annuités à périodes fixes.","en":"RATE is for fixed-period annuities."}},{"id":"d","text":{"fr":"PMT","en":"PMT"},"correct":false,"why":{"fr":"PMT calcule une mensualité, pas un taux de rendement.","en":"PMT computes an instalment, not a return rate."}}],"explanation":{"fr":"XIRR (et XNPV pour la valeur actuelle) gèrent des flux à dates réelles, indispensables en [[private equity]].","en":"XIRR (and XNPV for present value) handle flows at actual dates, essential in [[private equity]]."},"workings":null},{"id":"qcm.l3.excel-sensitivity.001","type":"qcm","level":3,"topic":"Excel","tags":["sensitivity"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.excel-sensitivity","stem":{"fr":"Dans une table de données à 2 variables, où placer la référence au résultat ?","en":"In a 2-variable data table, where do you place the reference to the result?"},"multi":false,"options":[{"id":"a","text":{"fr":"Dans le coin haut-gauche de la table","en":"In the top-left corner of the table"},"correct":true,"why":{"fr":"C'est l'emplacement attendu par Excel pour croiser les deux entrées.","en":"That is the location Excel expects to cross the two inputs."}},{"id":"b","text":{"fr":"N'importe où dans la table","en":"Anywhere in the table"},"correct":false,"why":{"fr":"Hors du coin, Excel renvoie #VALEUR ou des chiffres faux.","en":"Outside the corner, Excel returns #VALUE or wrong numbers."}},{"id":"c","text":{"fr":"Sur une autre feuille","en":"On another sheet"},"correct":false,"why":{"fr":"La table de données doit être sur la feuille de la formule pivot.","en":"The data table must sit on the sheet of the pivot formula."}},{"id":"d","text":{"fr":"Dans le coin bas-droit","en":"In the bottom-right corner"},"correct":false,"why":{"fr":"Excel attend la formule en haut-gauche, pas en bas-droite.","en":"Excel expects the formula top-left, not bottom-right."}}],"explanation":{"fr":"La formule de résultat va dans le coin haut-gauche, une variable en lignes et l'autre en colonnes.","en":"The result formula goes in the top-left corner, one variable in rows and the other in columns."},"workings":null},{"id":"qcm.l3.excel-sensitivity.002","type":"qcm","level":3,"topic":"Excel","tags":["goal-seek"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.excel-sensitivity","stem":{"fr":"Vous voulez le prix d'entrée maximum donnant un IRR de 20%. Quel outil ?","en":"You want the maximum entry price giving a 20% IRR. Which tool?"},"multi":false,"options":[{"id":"a","text":{"fr":"Une table de données","en":"A data table"},"correct":false,"why":{"fr":"Une table montre une grille de résultats, elle ne résout pas pour une cible.","en":"A table shows a grid of results, it does not solve for a target."}},{"id":"b","text":{"fr":"Goal Seek (valeur cible)","en":"Goal Seek"},"correct":true,"why":{"fr":"Goal Seek résout à l'envers pour une cible en variant une cellule.","en":"Goal Seek solves backwards for a target by varying one cell."}},{"id":"c","text":{"fr":"SUMPRODUCT","en":"SUMPRODUCT"},"correct":false,"why":{"fr":"C'est une fonction d'agrégation, pas de résolution.","en":"It is an aggregation function, not a solver."}},{"id":"d","text":{"fr":"Le collage spécial","en":"Paste Special"},"correct":false,"why":{"fr":"Le collage spécial ne résout rien.","en":"Paste Special solves nothing."}}],"explanation":{"fr":"Goal Seek trouve la valeur d'une entrée pour atteindre un résultat cible — une variable, une cible.","en":"Goal Seek finds the input value that hits a target result — one variable, one target."},"workings":null},{"id":"qcm.l3.excel-sensitivity.003","type":"qcm","level":3,"topic":"Excel","tags":["scenarios"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.excel-sensitivity","stem":{"fr":"Quelle est la façon la plus robuste de basculer entre cas base/haut/bas ?","en":"What is the most robust way to toggle between base/up/down cases?"},"multi":false,"options":[{"id":"a","text":{"fr":"Une cellule interrupteur + CHOOSE/IF","en":"A switch cell + CHOOSE/IF"},"correct":true,"why":{"fr":"Tout reste lié aux inputs et traçable d'un seul chiffre.","en":"Everything stays linked to inputs and traceable from one number."}},{"id":"b","text":{"fr":"Le Gestionnaire de scénarios natif","en":"The native Scenario Manager"},"correct":false,"why":{"fr":"Il fige des valeurs en dur et se désynchronise des inputs.","en":"It freezes hardcoded values and desyncs from inputs."}},{"id":"c","text":{"fr":"Recopier le fichier pour chaque scénario","en":"Duplicate the file for each scenario"},"correct":false,"why":{"fr":"Multiplie les fichiers et les risques d'erreur.","en":"Multiplies files and the risk of errors."}},{"id":"d","text":{"fr":"Changer les formules à la main","en":"Edit the formulas by hand"},"correct":false,"why":{"fr":"On ne touche jamais les calculs pour piloter un scénario.","en":"You never touch calculations to drive a scenario."}}],"explanation":{"fr":"Un interrupteur lié par CHOOSE/IF garde le modèle synchronisé avec les inputs, contrairement au Gestionnaire natif.","en":"A switch wired through CHOOSE/IF keeps the model synced with inputs, unlike the native Manager."},"workings":null},{"id":"qcm.l3.excel-sensitivity.004","type":"qcm","level":3,"topic":"Excel","tags":["lbo","sensitivity"],"difficulty":3,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l3.excel-sensitivity","stem":{"fr":"EBITDA de sortie 60, dette de sortie 200, equity d'entrée 150. À 9x de multiple, quel MoM ?","en":"Exit EBITDA 60, exit debt 200, entry equity 150. At a 9x multiple, what MoM?"},"multi":false,"options":[{"id":"a","text":{"fr":"≈ 1,9x","en":"≈ 1.9x"},"correct":false,"why":{"fr":"C'est le MoM à 8x (equity 280), pas à 9x.","en":"That is the MoM at 8x (equity 280), not 9x."}},{"id":"b","text":{"fr":"≈ 2,3x","en":"≈ 2.3x"},"correct":true,"why":{"fr":"EV 540 − dette 200 = equity 340 ; 340/150 ≈ 2,27x.","en":"EV 540 − debt 200 = equity 340; 340/150 ≈ 2.27x."}},{"id":"c","text":{"fr":"≈ 2,7x","en":"≈ 2.7x"},"correct":false,"why":{"fr":"C'est le MoM à 10x (equity 400).","en":"That is the MoM at 10x (equity 400)."}},{"id":"d","text":{"fr":"≈ 3,6x","en":"≈ 3.6x"},"correct":false,"why":{"fr":"On a ou
