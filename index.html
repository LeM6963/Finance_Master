"},{"fr":"Mal calibrer les dettes fournisseurs : 60 jours d'opex + taxes donne ~1,25, pas 5.","en":"Miscalibrating accounts payable: 60 days of opex + taxes gives ~1.25, not 5."},{"fr":"Oublier de réintégrer l'amortissement (charge non décaissée) dans le flux d'exploitation.","en":"Forgetting to add back depreciation (a non-cash charge) in operating cash flow."},{"fr":"Confondre amortissement économique (2 M€/an sur 25 ans) et remboursement de principal (4,5 M€/an sur 10 ans).","en":"Confusing economic depreciation (€2m/yr over 25 years) and principal repayment (€4.5m/yr over 10 years)."}],"synthese":{"fr":"• AirNeo : avion 50 M€, 10 % apport (5) + 90 % dette (45) à 4 % sur 10 ans, amortissement 2 M€/an sur 25 ans, IS 25 %.\n• Les 3 états se lient : résultat net → capitaux propres ; amortissement réintégré au flux d'exploitation ; principal en financement.\n• Erreur dataroom corrigée : CA figé à 0 cassait marges, DSCR/ICR, fournisseurs (5 au lieu de 1,25) et trésorerie (−70).\n• Mini-version correcte : RN 3,15 / 3,71 / 4,07 sur 3 ans.","en":"• AirNeo: aircraft €50m, 10% equity (5) + 90% debt (45) at 4% over 10 years, depreciation €2m/yr over 25 years, tax 25%.\n• The 3 statements link: net income → equity; depreciation added back in operating cash flow; principal in financing.\n• Corrected dataroom error: revenue frozen at 0 broke margins, DSCR/ICR, payables (5 instead of 1.25) and cash (−70).\n• Correct mini-version: net income 3.15 / 3.71 / 4.07 over 3 years."}},"glossaryRefs":["dscr","depreciation","three-statement"]}],"flashcards":[{"id":"fc.l3.excel-best.001","type":"flashcard","level":3,"topic":"Excel","tags":["best-practices","colors"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.excel-best","front":{"fr":"Que signifient bleu / noir / vert / rouge dans un modèle ?","en":"What do blue / black / green / red mean in a model?"},"back":{"fr":"Bleu = inputs en dur, noir = formules de calcul, vert = liens vers une autre feuille du classeur, rouge = checks et alertes.","en":"Blue = hardcoded inputs, black = calculation formulas, green = links to another sheet in the workbook, red = checks and alerts."},"hint":null},{"id":"fc.l3.excel-best.002","type":"flashcard","level":3,"topic":"Excel","tags":["best-practices"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.excel-best","front":{"fr":"Pourquoi ne jamais écrire un nombre en dur dans une formule ?","en":"Why never hardcode a number inside a formula?"},"back":{"fr":"Un nombre noyé dans une formule est invisible, non traçable et impossible à piloter en scénario. Toute constante doit vivre dans une cellule d'input bleue référencée.","en":"A number buried in a formula is invisible, untraceable and impossible to drive in a scenario. Every constant must live in a referenced blue input cell."},"hint":null},{"id":"fc.l3.excel-best.003","type":"flashcard","level":3,"topic":"Excel","tags":["checks"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.excel-best","front":{"fr":"Cite deux checks classiques d'un modèle financier.","en":"Name two classic financial-model checks."},"back":{"fr":"Bilan équilibré (actif = passif) et sources = emplois dans la table de financement d'un [[LBO]]. On les code en `=ABS(...)` et on les affiche en rouge.","en":"Balance sheet balances (assets = liabilities) and sources = uses in an [[LBO]] funding table. Coded as `=ABS(...)` and shown in red."},"hint":null},{"id":"fc.l3.excel-best.004","type":"flashcard","level":3,"topic":"Excel","tags":["circularity"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.excel-best","front":{"fr":"Comment gérer proprement la circularité intérêts ↔ dette ?","en":"How do you cleanly handle interest ↔ debt circularity?"},"back":{"fr":"Un interrupteur (cellule 0/1) qui casse la boucle en calculant les intérêts sur la dette d'ouverture quand il est à 0, plutôt que d'activer aveuglément le calcul itératif.","en":"A switch (0/1 cell) that breaks the loop by computing interest on opening debt when set to 0, rather than blindly enabling iterative calculation."},"hint":null},{"id":"fc.l3.excel-best.005","type":"flashcard","level":3,"topic":"Excel","tags":["best-practices"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.excel-best","front":{"fr":"Pourquoi bannir les cellules fusionnées ?","en":"Why ban merged cells?"},"back":{"fr":"Elles cassent la navigation Ctrl+flèche, empêchent le copier-coller propre et perturbent tris et références. On utilise « Centrer sur plusieurs colonnes » à la place.","en":"They break Ctrl+arrow navigation, prevent clean copy-paste and disrupt sorting and references. Use 'Center Across Selection' instead."},"hint":null},{"id":"fc.l3.excel-best.006","type":"flashcard","level":3,"topic":"Excel","tags":["structure"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.excel-best","front":{"fr":"Quelles sont les trois zones d'un modèle bien structuré ?","en":"What are the three zones of a well-structured model?"},"back":{"fr":"Inputs (hypothèses), calculs (formules), outputs (synthèse présentable). On ne pilote un scénario qu'en touchant les inputs, jamais les calculs.","en":"Inputs (assumptions), calculations (formulas), outputs (presentable summary). You drive a scenario only by touching inputs, never calculations."},"hint":null},{"id":"fc.l3.excel-shortcuts.001","type":"flashcard","level":3,"topic":"Excel","tags":["shortcuts"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.excel-shortcuts","front":{"fr":"Que font Ctrl+flèche et Ctrl+Maj+flèche ?","en":"What do Ctrl+arrow and Ctrl+Shift+arrow do?"},"back":{"fr":"Ctrl+flèche saute au bord du bloc de données ; Ctrl+Maj+flèche fait de même en sélectionnant la plage. Sur Mac : Cmd au lieu de Ctrl.","en":"Ctrl+arrow jumps to the edge of the data block; Ctrl+Shift+arrow does the same while selecting the range. On Mac: Cmd instead of Ctrl."},"hint":null},{"id":"fc.l3.excel-shortcuts.002","type":"flashcard","level":3,"topic":"Excel","tags":["shortcuts","references"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.excel-shortcuts","front":{"fr":"Que fait F4 en édition de formule, et l'équivalent Mac ?","en":"What does F4 do while editing a formula, and the Mac equivalent?"},"back":{"fr":"F4 bascule la référence relative → absolue → mixte ($A$1 → A$1 → $A1). Sur Mac : Cmd+T, ou fn+F4 si la touche pilote le système.","en":"F4 cycles the reference relative → absolute → mixed ($A$1 → A$1 → $A1). On Mac: Cmd+T, or fn+F4 if the key drives the system."},"hint":null},{"id":"fc.l3.excel-shortcuts.003","type":"flashcard","level":3,"topic":"Excel","tags":["shortcuts"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.excel-shortcuts","front":{"fr":"Quel raccourci insère une somme automatique ?","en":"Which shortcut inserts an AutoSum?"},"back":{"fr":"Alt+= sur Windows (Cmd+Maj+T sur Mac) propose `=SUM(...)` sur la plage adjacente.","en":"Alt+= on Windows (Cmd+Shift+T on Mac) proposes `=SUM(...)` over the adjacent range."},"hint":null},{"id":"fc.l3.excel-shortcuts.004","type":"flashcard","level":3,"topic":"Excel","tags":["shortcuts","audit"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.excel-shortcuts","front":{"fr":"Comment afficher toutes les formules d'une feuille ?","en":"How do you display all formulas on a sheet?"},"back":{"fr":"Ctrl+` (accent grave) bascule l'affichage des formules. Indispensable pour relire un fichier inconnu.","en":"Ctrl+` (backtick) toggles formula display. Essential to review an unfamiliar file."},"hint":null},{"id":"fc.l3.excel-shortcuts.005","type":"flashcard","level":3,"topic":"Excel","tags":["shortcuts","audit"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.excel-shortcuts","front":{"fr":"À quoi servent Ctrl+[ et F9 (sur une sélection) ?","en":"What are Ctrl+[ and F9 (on a selection) for?"},"back":{"fr":"Ctrl+[ saute aux antécédents directs d'une formule. Sélectionner un bout de formule puis F9 évalue cette portion (Échap annule).","en":"Ctrl+[ jumps to a formula's direct precedents. Selecting part of a formula then F9 evaluates that portion (Esc cancels)."},"hint":null},{"id":"fc.l3.excel-shortcuts.006","type":"flashcard","level":3,"topic":"Excel","tags":["shortcuts","paste"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.excel-shortcuts","front":{"fr":"Quel raccourci ouvre le collage spécial, et pourquoi l'utiliser ?","en":"Which shortcut opens Paste Special, and why use it?"},"back":{"fr":"Ctrl+Alt+V (Mac : Cmd+Ctrl+V). Permet de coller des valeurs uniquement, des formats ou de transposer — crucial pour figer une sortie ou casser un lien.","en":"Ctrl+Alt+V (Mac: Cmd+Ctrl+V). Lets you paste values only, formats, or transpose — crucial to freeze an output or break a link."},"hint":null},{"id":"fc.l3.excel-formulas.001","type":"flashcard","level":3,"topic":"Excel","tags":["lookup"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.excel-formulas","front":{"fr":"Pourquoi préférer XLOOKUP ou INDEX/MATCH à VLOOKUP ?","en":"Why prefer XLOOKUP or INDEX/MATCH over VLOOKUP?"},"back":{"fr":"VLOOKUP ne cherche qu'à droite et casse quand on insère une colonne (index décalé). XLOOKUP/INDEX-MATCH cherchent dans toute direction et survivent aux insertions.","en":"VLOOKUP only looks right and breaks when a column is inserted (index shifts). XLOOKUP/INDEX-MATCH search in any direction and survive insertions."},"hint":null},{"id":"fc.l3.excel-formulas.002","type":"flashcard","level":3,"topic":"Excel","tags":["npv"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.excel-formulas","front":{"fr":"La fonction NPV d'Excel actualise-t-elle le flux en t0 ?","en":"Does Excel's NPV function discount the t0 flow?"},"back":{"fr":"Non : NPV suppose le premier flux à la fin de la période 1. Le flux/capex de t0 s'ajoute hors fonction : `=NPV(r;flux1:fluxN)+flux0`.","en":"No: NPV assumes the first flow at the end of period 1. The t0 flow/capex is added outside: `=NPV(r;flow1:flowN)+flow0`."},"hint":null},{"id":"fc.l3.excel-formulas.003","type":"flashcard","level":3,"topic":"Excel","tags":["irr"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.excel-formulas","front":{"fr":"IRR ou XIRR pour des flux à dates irrégulières ?","en":"IRR or XIRR for irregularly dated flows?"},"back":{"fr":"XIRR (et XNPV pour la VAN) : elles prennent les dates réelles. IRR suppose des périodes régulières et donnerait un taux faux. Incontournable en [[private equity]].","en":"XIRR (and XNPV for present value): they take actual dates. IRR assumes regular periods and would give a wrong rate. Essential in [[private equity]]."},"hint":null},{"id":"fc.l3.excel-formulas.004","type":"flashcard","level":3,"topic":"Excel","tags":["logic"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.excel-formulas","front":{"fr":"À quoi sert IFERROR et quel est son danger ?","en":"What is IFERROR for and what is its danger?"},"back":{"fr":"IFERROR(formule;valeur) capture #DIV/0!, #N/A, #REF! proprement (ex. `=IFERROR(B2/B3;0)`). Danger : il masque aussi les vrais bugs, donc à ne pas mettre partout.","en":"IFERROR(formula;value) cleanly catches #DIV/0!, #N/A, #REF! (e.g. `=IFERROR(B2/B3;0)`). Danger: it also masks genuine bugs, so don't slap it everywhere."},"hint":null},{"id":"fc.l3.excel-formulas.005","type":"flashcard","level":3,"topic":"Excel","tags":["volatile"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.excel-formulas","front":{"fr":"Pourquoi éviter OFFSET et INDIRECT ?","en":"Why avoid OFFSET and INDIRECT?"},"back":{"fr":"Elles sont volatiles (recalcul à chaque modif, ralentissement) et INDIRECT casse le suivi des références. On utilise INDEX (non volatile) pour les plages dynamiques.","en":"They are volatile (recalc on every change, slowdown) and INDIRECT breaks reference tracing. Use INDEX (non-volatile) for dynamic ranges."},"hint":null},{"id":"fc.l3.excel-formulas.006","type":"flashcard","level":3,"topic":"Excel","tags":["aggregate"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.excel-formulas","front":{"fr":"Que calcule SUMPRODUCT ?","en":"What does SUMPRODUCT compute?"},"back":{"fr":"Le produit terme à terme de deux plages, puis la somme : `=SUMPRODUCT(prix;quantités)` donne un chiffre d'affaires. Sert aussi de somme conditionnelle vectorielle.","en":"The element-wise product of two ranges, then the sum: `=SUMPRODUCT(price;quantity)` gives revenue. Also serves as a vectorised conditional sum."},"hint":null},{"id":"fc.l3.excel-sensitivity.001","type":"flashcard","level":3,"topic":"Excel","tags":["sensitivity"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.excel-sensitivity","front":{"fr":"Où placer la formule de résultat dans une table de données à 2 variables ?","en":"Where do you place the result formula in a 2-variable data table?"},"back":{"fr":"Dans le coin haut-gauche de la table (`=résultat`), avec une variable en lignes et l'autre en colonnes. Sinon Excel renvoie #VALEUR.","en":"In the top-left corner of the table (`=result`), with one variable down rows and the other across columns. Otherwise Excel returns #VALUE."},"hint":null},{"id":"fc.l3.excel-sensitivity.002","type":"flashcard","level":3,"topic":"Excel","tags":["goal-seek"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.excel-sensitivity","front":{"fr":"Que fait Goal Seek (valeur cible) ?","en":"What does Goal Seek do?"},"back":{"fr":"Il résout à l'envers : trouve la valeur d'une cellule d'entrée pour atteindre un résultat cible (ex. prix d'entrée donnant un IRR de 20%). Une variable, une cible.","en":"It solves backwards: finds the input cell value that hits a target result (e.g. entry price giving a 20% IRR). One variable, one target."},"hint":null},{"id":"fc.l3.excel-sensitivity.003","type":"flashcard","level":3,"topic":"Excel","tags":["scenarios"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.excel-sensitivity","front":{"fr":"Comment piloter des scénarios proprement ?","en":"How do you drive scenarios cleanly?"},"back":{"fr":"Une cellule interrupteur (1/2/3) et chaque hypothèse en `=CHOOSE($scénario;base;haut;bas)`. Plus robuste que le Gestionnaire de scénarios natif qui fige des valeurs.","en":"A switch cell (1/2/3) and each assumption as `=CHOOSE($scenario;base;up;down)`. More robust than the native Scenario Manager which freezes values."},"hint":null},{"id":"fc.l3.excel-sensitivity.004","type":"flashcard","level":3,"topic":"Excel","tags":["sensitivity","performance"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.excel-sensitivity","front":{"fr":"Quel effet de bord ont les tables de données sur un gros modèle ?","en":"What side effect do data tables have on a large model?"},"back":{"fr":"Elles sont volatiles et recalculent tout le classeur à chaque changement. Sur un gros modèle, on bascule le calcul en manuel (F9 pour recalculer).","en":"They are volatile and recalculate the whole workbook on every change. On a large model, switch calculation to manual (F9 to recalc)."},"hint":null},{"id":"fc.l3.excel-sensitivity.005","type":"flashcard","level":3,"topic":"Excel","tags":["goal-seek"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.excel-sensitivity","front":{"fr":"Quel piège avec Goal Seek sur la cellule d'entrée ?","en":"What is the Goal Seek pitfall on the input cell?"},"back":{"fr":"Goal Seek écrase l'input par une valeur en dur. Il faut noter (ou copier) la valeur d'origine avant de lancer pour pouvoir la restaurer.","en":"Goal Seek overwrites the input with a hardcoded value. Note (or copy) the original value before running so you can restore it."},"hint":null},{"id":"fc.l3.excel-sensitivity.006","type":"flashcard","level":3,"topic":"Excel","tags":["sensitivity"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.excel-sensitivity","front":{"fr":"Pourquoi sensibiliser le MoM/IRR au multiple de sortie ?","en":"Why sensitise MoM/IRR to the exit multiple?"},"back":{"fr":"Parce que le multiple de sortie est l'hypothèse la plus incertaine et la plus influente sur le rendement d'un [[LBO]]. Un comité veut voir toute la fourchette.","en":"Because the exit multiple is the most uncertain and most influential assumption on an [[LBO]] return. A committee wants to see the whole range."},"hint":null},{"id":"fc.l1.culture.001","type":"flashcard","level":1,"topic":"Fit","tags":["PE","IB"],"difficulty":1,"source":{"flag":"VERIFIED"},"moduleId":"mod.l1.culture","front":{"fr":"Quelle est la différence entre banque d'affaires (IB) et private equity (PE) ?","en":"What is the difference between investment banking (IB) and private equity (PE)?"},"back":{"fr":"L'IB conseille des clients sur des transactions contre honoraires ; le PE investit le capital d'un fonds dans des sociétés non cotées et vit de la plus-value.","en":"IB advises clients on transactions for fees; PE invests a fund's capital into private companies and lives off the capital gain."},"hint":null},{"id":"fc.l1.culture.002","type":"flashcard","level":1,"topic":"Fit","tags":["buy-side","sell-side"],"difficulty":1,"source":{"flag":"VERIFIED"},"moduleId":"mod.l1.culture","front":{"fr":"Un fonds de PE est-il [[buy-side]] ou [[sell-side]] ?","en":"Is a PE fund [[buy-side]] or [[sell-side]]?"},"back":{"fr":"Buy-side : il achète et gère des actifs avec son capital. La banque qui le conseille est sell-side.","en":"Buy-side: it buys and manages assets with its capital. The bank advising it is sell-side."},"hint":null},{"id":"fc.l1.culture.003","type":"flashcard","level":1,"topic":"Fit","tags":["GP","LP"],"difficulty":1,"source":{"flag":"VERIFIED"},"moduleId":"mod.l1.culture","front":{"fr":"Qui sont le [[GP]] et les [[LP]] d'un fonds ?","en":"Who are the [[GP]] and the [[LP]] of a fund?"},"back":{"fr":"Le GP est la société de gestion (gère, perçoit frais ~2% + carried ~20%) ; les LP sont les investisseurs qui apportent l'essentiel du capital avec responsabilité limitée.","en":"The GP is the management company (manages, earns ~2% fees + ~20% carried); the LPs are the investors who provide most of the capital with limited liability."},"hint":null},{"id":"fc.l1.culture.004","type":"flashcard","level":1,"topic":"Fit","tags":["dry powder"],"difficulty":1,"source":{"flag":"VERIFIED"},"moduleId":"mod.l1.culture","front":{"fr":"Qu'est-ce que le [[dry powder]] ?","en":"What is [[dry powder]]?"},"back":{"fr":"Les capitaux déjà levés mais pas encore investis, prêts à être déployés.","en":"Capital already raised but not yet invested, ready to be deployed."},"hint":null},{"id":"fc.l1.culture.005","type":"flashcard","level":1,"topic":"Fit","tags":["holding period"],"difficulty":1,"source":{"flag":"APPROXIMATE"},"moduleId":"mod.l1.culture","front":{"fr":"Quel est l'horizon de détention typique en PE ?","en":"What is the typical holding period in PE?"},"back":{"fr":"Environ 3 à 7 ans : on achète, on transforme, puis on revend.","en":"About 3 to 7 years: buy, transform, then sell."},"hint":null},{"id":"fc.l1.culture.006","type":"flashcard","level":1,"topic":"Fit","tags":["maisons européennes"],"difficulty":1,"source":{"flag":"VERIFIED"},"moduleId":"mod.l1.culture","front":{"fr":"Citez des maisons de private equity européennes.","en":"Name some European private equity houses."},"back":{"fr":"Hivest, Ardian, Eurazeo, PAI Partners, Tikehau, Bridgepoint, EQT, Cinven.","en":"Hivest, Ardian, Eurazeo, PAI Partners, Tikehau, Bridgepoint, EQT, Cinven."},"hint":null},{"id":"fc.l1.three-statements.001","type":"flashcard","level":1,"topic":"Accounting","tags":["3 états"],"difficulty":1,"source":{"flag":"VERIFIED"},"moduleId":"mod.l1.three-statements","front":{"fr":"Quels sont les trois états financiers ?","en":"What are the three financial statements?"},"back":{"fr":"Le compte de résultat (P&L), le bilan (balance sheet) et le tableau de flux de trésorerie.","en":"The income statement (P&L), the balance sheet and the cash flow statement."},"hint":null},{"id":"fc.l1.three-statements.002","type":"flashcard","level":1,"topic":"Accounting","tags":["P&L"],"difficulty":1,"source":{"flag":"VERIFIED"},"moduleId":"mod.l1.three-statements","front":{"fr":"À quoi sert le compte de résultat ([[P&L]]) ?","en":"What is the [[P&L]] for?"},"back":{"fr":"À mesurer la performance sur une période : a-t-on gagné de l'argent cette année (CA, charges, profit) ?","en":"To measure performance over a period: did we make money this year (revenue, costs, profit)?"},"hint":null},{"id":"fc.l1.three-statements.003","type":"flashcard","level":1,"topic":"Accounting","tags":["bilan"],"difficulty":1,"source":{"flag":"VERIFIED"},"moduleId":"mod.l1.three-statements","front":{"fr":"À quoi sert le bilan ([[balance sheet]]) ?","en":"What is the [[balance sheet]] for?"},"back":{"fr":"À photographier, à une date donnée, ce que l'entreprise possède (actif) et comment c'est financé (passif).","en":"To snapshot, at a given date, what the company owns (assets) and how it is financed (liabilities + equity)."},"hint":null},{"id":"fc.l1.three-statements.004","type":"flashcard","level":1,"topic":"Accounting","tags":["flux"],"difficulty":1,"source":{"flag":"VERIFIED"},"moduleId":"mod.l1.three-statements","front":{"fr":"À quoi sert le tableau de flux ([[cash flow statement]]) ?","en":"What is the [[cash flow statement]] for?"},"back":{"fr":"À retracer les mouvements de cash réels sur la période : d'où vient et où va la trésorerie.","en":"To track actual cash movements over the period: where cash comes from and goes."},"hint":null},{"id":"fc.l1.three-statements.005","type":"flashcard","level":1,"topic":"Accounting","tags":["période","instantané"],"difficulty":1,"source":{"flag":"VERIFIED"},"moduleId":"mod.l1.three-statements","front":{"fr":"Quel état est un instantané et lesquels couvrent une période ?","en":"Which statement is a snapshot and which cover a period?"},"back":{"fr":"Le bilan est un instantané à une date ; le P&L et le tableau de flux couvrent une période.","en":"The balance sheet is a snapshot at a date; the P&L and cash flow statement cover a period."},"hint":null},{"id":"fc.l1.three-statements.006","type":"flashcard","level":1,"topic":"Accounting","tags":["liaison"],"difficulty":1,"source":{"flag":"VERIFIED"},"moduleId":"mod.l1.three-statements","front":{"fr":"Comment le résultat net relie-t-il le P&L au bilan ?","en":"How does net income link the P&L to the balance sheet?"},"back":{"fr":"Le résultat net non distribué augmente les capitaux propres au bilan de fin de période.","en":"Undistributed net income increases equity on the end-of-period balance sheet."},"hint":null},{"id":"fc.l1.income-statement.001","type":"flashcard","level":1,"topic":"Accounting","tags":["EBITDA"],"difficulty":1,"source":{"flag":"VERIFIED"},"moduleId":"mod.l1.income-statement","front":{"fr":"Que vaut l'[[EBITDA]] en équivalent français ?","en":"What is [[EBITDA]] in French terms?"},"back":{"fr":"EBITDA = EBE (Excédent Brut d'Exploitation) : résultat avant intérêts, impôts et D&A.","en":"EBITDA = EBE: earnings before interest, taxes, depreciation and amortization."},"hint":null},{"id":"fc.l1.income-statement.002","type":"flashcard","level":1,"topic":"Accounting","tags":["EBITDA","bottom-up"],"difficulty":2,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l1.income-statement","front":{"fr":"Calculez l'EBITDA depuis : résultat net 100, impôt 20, intérêts 130, D&A 50.","en":"Compute EBITDA from: net income 100, tax 20, interest 130, D&A 50."},"back":{"fr":"EBITDA = 100 + 20 + 130 + 50 = 300.","en":"EBITDA = 100 + 20 + 130 + 50 = 300."},"hint":{"fr":"On rajoute impôt, intérêts et D&A au résultat net.","en":"Add back tax, interest and D&A to net income."}},{"id":"fc.l1.income-statement.003","type":"flashcard","level":1,"topic":"Accounting","tags":["EBIT"],"difficulty":1,"source":{"flag":"VERIFIED"},"moduleId":"mod.l1.income-statement","front":{"fr":"Quel est le lien entre [[EBITDA]] et [[EBIT]] ?","en":"What is the link between [[EBITDA]] and [[EBIT]]?"},"back":{"fr":"EBIT = EBITDA − D&A. L'EBIT est le résultat d'exploitation après amortissements.","en":"EBIT = EBITDA − D&A. EBIT is operating profit after depreciation."},"hint":null},{"id":"fc.l1.income-statement.004","type":"flashcard","level":1,"topic":"Accounting","tags":["IS","impôt"],"difficulty":1,"source":{"flag":"VERIFIED"},"moduleId":"mod.l1.income-statement","front":{"fr":"Quel est le taux normal d'impôt sur les sociétés en France ?","en":"What is the standard corporate income tax rate in France?"},"back":{"fr":"Environ 25% (et non 33% comme par le passé).","en":"About 25% (not 33% as in the past)."},"hint":null},{"id":"fc.l1.income-statement.005","type":"flashcard","level":1,"topic":"Accounting","tags":["HT","TTC"],"difficulty":1,"source":{"flag":"VERIFIED"},"moduleId":"mod.l1.income-statement","front":{"fr":"Le chiffre d'affaires se mesure-t-il HT ou TTC ?","en":"Is revenue measured excl. VAT or incl. VAT?"},"back":{"fr":"HT (hors taxes) : la TVA n'est pas un revenu, elle est collectée pour l'État.","en":"Excl. VAT: VAT is not revenue, it is collected on behalf of the State."},"hint":null},{"id":"fc.l1.income-statement.006","type":"flashcard","level":1,"topic":"Accounting","tags":["charges fixes","variables"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l1.income-statement","front":{"fr":"Différence entre charges fixes et variables ?","en":"Difference between fixed and variable costs?"},"back":{"fr":"Les variables évoluent avec le volume (matières) ; les fixes restent stables (loyers, salaires). Plus de fixes = plus de levier opérationnel.","en":"Variable costs move with volume (materials); fixed costs stay stable (rent, salaries). More fixed costs = more operating leverage."},"hint":null},{"id":"fc.l1.balance-sheet.001","type":"flashcard","level":1,"topic":"Accounting","tags":["bilan"],"difficulty":1,"source":{"flag":"VERIFIED"},"moduleId":"mod.l1.balance-sheet","front":{"fr":"Quelle est l'égalité fondamentale du bilan ?","en":"What is the fundamental balance-sheet identity?"},"back":{"fr":"Actif = Passif (dettes + capitaux propres). Elle tient toujours par construction.","en":"Assets = Liabilities + Equity. It always holds by construction."},"hint":null},{"id":"fc.l1.balance-sheet.002","type":"flashcard","level":1,"topic":"Accounting","tags":["BFR","working capital"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l1.balance-sheet","front":{"fr":"Comment se calcule le [[working capital]] (BFR) ?","en":"How is [[working capital]] (BFR) computed?"},"back":{"fr":"BFR ≈ stocks + créances clients − dettes fournisseurs.","en":"Working capital ≈ inventory + receivables − payables."},"hint":null},{"id":"fc.l1.balance-sheet.003","type":"flashcard","level":1,"topic":"Accounting","tags":["BFR négatif"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l1.balance-sheet","front":{"fr":"Un BFR négatif est-il forcément mauvais ?","en":"Is negative working capital necessarily bad?"},"back":{"fr":"Non : dans le retail ou l'abonnement, le client paie avant le fournisseur ; le BFR négatif finance la croissance et c'est sain.","en":"No: in retail or subscription, customers pay before suppliers; negative working capital funds growth and is healthy."},"hint":null},{"id":"fc.l1.balance-sheet.004","type":"flashcard","level":1,"topic":"Accounting","tags":["equity"],"difficulty":1,"source":{"flag":"VERIFIED"},"moduleId":"mod.l1.balance-sheet","front":{"fr":"Que représentent les capitaux propres ([[equity]]) ?","en":"What do shareholders' [[equity]] represent?"},"back":{"fr":"Le capital apporté + les réserves (résultats accumulés) ; ce qui revient aux actionnaires après remboursement des dettes.","en":"Paid-in capital + reserves (accumulated earnings); what is left for shareholders after debts are repaid."},"hint":null},{"id":"fc.l1.balance-sheet.005","type":"flashcard","level":1,"topic":"Accounting","tags":["goodwill"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l1.balance-sheet","front":{"fr":"Qu'est-ce que le [[goodwill]] ?","en":"What is [[goodwill]]?"},"back":{"fr":"L'écart d'acquisition : le surprix payé au-dessus de la valeur comptable des actifs nets de la cible. Testé pour dépréciation en IFRS.","en":"The acquisition premium paid above the book value of the target's net assets. Impairment-tested under IFRS."},"hint":null},{"id":"fc.l1.balance-sheet.006","type":"flashcard","level":1,"topic":"Accounting","tags":["equity","cash"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l1.balance-sheet","front":{"fr":"Les capitaux propres sont-ils du cash disponible ?","en":"Are shareholders' equity available cash?"},"back":{"fr":"Non : c'est une source de financement au passif, pas de la trésorerie utilisable à l'actif.","en":"No: it is a financing source on the liabilities side, not usable cash on the asset side."},"hint":null},{"id":"fc.l1.cash-flow.001","type":"flashcard","level":1,"topic":"Accounting","tags":["flux"],"difficulty":1,"source":{"flag":"VERIFIED"},"moduleId":"mod.l1.cash-flow","front":{"fr":"Quelles sont les trois sections du tableau de flux ?","en":"What are the three sections of the cash flow statement?"},"back":{"fr":"Flux d'exploitation, flux d'investissement (capex) et flux de financement. Leur somme = variation de trésorerie.","en":"Operating, investing (capex) and financing cash flows. Their sum = change in cash."},"hint":null},{"id":"fc.l1.cash-flow.002","type":"flashcard","level":1,"topic":"Accounting","tags":["D&A"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l1.cash-flow","front":{"fr":"Pourquoi rajoute-t-on le [[D&A]] au résultat net dans les flux ?","en":"Why is [[D&A]] added back to net income in the cash flows?"},"back":{"fr":"Parce que le D&A est une charge non-cash : il réduit le profit au P&L mais ne sort pas de trésorerie sur la période.","en":"Because D&A is a non-cash charge: it reduces P&L profit but does not consume cash in the period."},"hint":null},{"id":"fc.l1.cash-flow.003","type":"flashcard","level":1,"topic":"Accounting","tags":["BFR"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l1.cash-flow","front":{"fr":"Quel est l'impact d'une hausse du BFR sur la trésorerie ?","en":"What is the impact of a rise in working capital on cash?"},"back":{"fr":"Une hausse du BFR consomme du cash (argent immobilisé) ; une baisse en libère.","en":"A rise in working capital consumes cash (money tied up); a fall frees cash."},"hint":null},{"id":"fc.l1.cash-flow.004","type":"flashcard","level":1,"topic":"Accounting","tags":["flux exploitation"],"difficulty":2,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l1.cash-flow","front":{"fr":"Flux d'exploitation si NI 100, D&A 50, hausse du BFR 30 ?","en":"Operating cash flow if NI 100, D&A 50, working capital rise 30?"},"back":{"fr":"100 + 50 − 30 = 120.","en":"100 + 50 − 30 = 120."},"hint":{"fr":"NI + D&A − hausse de BFR.","en":"NI + D&A − working-capital increase."}},{"id":"fc.l1.cash-flow.005","type":"flashcard","level":1,"topic":"Accounting","tags":["profit","cash"],"difficulty":1,"source":{"flag":"VERIFIED"},"moduleId":"mod.l1.cash-flow","front":{"fr":"Une société rentable a-t-elle forcément du cash ?","en":"Does a profitable company necessarily have cash?"},"back":{"fr":"Non : une forte croissance peut faire exploser le BFR et assécher la trésorerie malgré un profit positif.","en":"No: fast growth can balloon working capital and drain cash despite a positive profit."},"hint":null},{"id":"fc.l1.cash-flow.006","type":"flashcard","level":1,"topic":"Accounting","tags":["méthode indirecte"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l1.cash-flow","front":{"fr":"Comment construit-on le flux d'exploitation (méthode indirecte) ?","en":"How is operating cash flow built (indirect method)?"},"back":{"fr":"Résultat net + D&A ± variation de BFR ± autres éléments non-cash.","en":"Net income + D&A ± change in working capital ± other non-cash items."},"hint":null},{"id":"fc.l1.vocab.001","type":"flashcard","level":1,"topic":"Fit","tags":["actionnaire","créancier"],"difficulty":1,"source":{"flag":"VERIFIED"},"moduleId":"mod.l1.vocab","front":{"fr":"Différence entre actionnaire et créancier ?","en":"Difference between shareholder and creditor?"},"back":{"fr":"L'actionnaire possède, prend le risque et sert en dernier ; le créancier prête, touche des intérêts et est remboursé en priorité.","en":"The shareholder owns, bears risk and is served last; the creditor lends, earns interest and is repaid first."},"hint":null},{"id":"fc.l1.vocab.002","type":"flashcard","level":1,"topic":"Fit","tags":["dette","equity"],"difficulty":1,"source":{"flag":"VERIFIED"},"moduleId":"mod.l1.vocab","front":{"fr":"Différence entre [[debt]] et [[equity]] ?","en":"Difference between [[debt]] and [[equity]]?"},"back":{"fr":"La dette se rembourse avec intérêts (déductibles), moins chère mais rigide ; l'equity n'a pas d'échéance, plus chère mais flexible.","en":"Debt is repaid with interest (deductible), cheaper but rigid; equity has no deadline, more expensive but flexible."},"hint":null},{"id":"fc.l1.vocab.003","type":"flashcard","level":1,"topic":"Fit","tags":["faillite","priorité"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l1.vocab","front":{"fr":"En cas de faillite, qui est remboursé en premier ?","en":"In bankruptcy, who is repaid first?"},"back":{"fr":"Les créanciers d'abord ; les actionnaires passent en dernier — d'où leur risque plus élevé.","en":"Creditors first; shareholders come last — hence their higher risk."},"hint":null},{"id":"fc.l1.vocab.004","type":"flashcard","level":1,"topic":"Fit","tags":["NDA"],"difficulty":1,"source":{"flag":"VERIFIED"},"moduleId":"mod.l1.vocab","front":{"fr":"Qu'est-ce qu'un [[NDA]] ?","en":"What is an [[NDA]]?"},"back":{"fr":"Un accord de confidentialité signé en amont d'une transaction, avant l'accès à la dataroom.","en":"A non-disclosure agreement signed early in a transaction, before dataroom access."},"hint":null},{"id":"fc.l1.vocab.005","type":"flashcard","level":1,"topic":"Fit","tags":["prix","valeur"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l1.vocab","front":{"fr":"Différence entre prix et valeur ?","en":"Difference between price and value?"},"back":{"fr":"La valeur est une estimation issue d'une analyse ; le prix est ce qui est réellement payé. « Le prix est ce que vous payez, la valeur ce que vous obtenez. »","en":"Value is an estimate from analysis; price is what is actually paid. \"Price is what you pay, value is what you get.\""},"hint":null},{"id":"fc.l1.vocab.006","type":"flashcard","level":1,"topic":"Fit","tags":["intérêts","dividendes"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l1.vocab","front":{"fr":"Comment sont rémunérés respectivement le créancier et l'actionnaire ?","en":"How are the creditor and the shareholder respectively rewarded?"},"back":{"fr":"Le créancier par des intérêts contractuels (déductibles) ; l'actionnaire par les dividendes et la plus-value.","en":"The creditor by contractual interest (deductible); the shareholder by dividends and capital gain."},"hint":null},{"id":"fc.l2.linkage.001","type":"flashcard","level":2,"topic":"Accounting","tags":["linkage","net income"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l2.linkage","front":{"fr":"Où le résultat net apparaît-il en dehors du compte de résultat ?","en":"Where does net income appear beyond the income statement?"},"back":{"fr":"Comme première ligne du tableau de flux (méthode indirecte) et dans les capitaux propres via les réserves (résultat net − dividendes).","en":"As the top line of the cash flow statement (indirect method) and in equity via retained earnings (net income − dividends)."},"hint":null},{"id":"fc.l2.linkage.002","type":"flashcard","level":2,"topic":"Accounting","tags":["D&A","non-cash"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l2.linkage","front":{"fr":"Pourquoi réintègre-t-on le [[D&A]] dans le flux d'exploitation ?","en":"Why is [[D&A]] added back in operating cash flow?"},"back":{"fr":"Parce que c'est une charge non décaissée : elle réduit le résultat net mais ne correspond à aucune sortie de cash.","en":"Because it is a non-cash charge: it reduces net income but involves no cash outflow."},"hint":null},{"id":"fc.l2.linkage.003","type":"flashcard","level":2,"topic":"Accounting","tags":["D&A","tax"],"difficulty":3,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l2.linkage","front":{"fr":"Un +10 de [[D&A]] (IS 25%) augmente la trésorerie de combien ?","en":"A +10 of [[D&A]] (25% tax) increases cash by how much?"},"back":{"fr":"De +2,5 : le résultat net baisse de 7,5 mais on réintègre +10 de D&A, soit l'économie d'impôt nette de +2,5.","en":"By +2.5: net income falls by 7.5 but +10 of D&A is added back, leaving the net tax saving of +2.5."},"hint":null},{"id":"fc.l2.linkage.004","type":"flashcard","level":2,"topic":"Accounting","tags":["working capital"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l2.linkage","front":{"fr":"Une hausse des créances clients : flux de cash positif ou négatif ?","en":"An increase in receivables: positive or negative cash flow?"},"back":{"fr":"Négatif : une hausse d'actif d'exploitation immobilise du cash (le [[BFR]] augmente).","en":"Negative: an increase in operating assets ties up cash (working capital rises)."},"hint":null},{"id":"fc.l2.linkage.005","type":"flashcard","level":2,"topic":"Accounting","tags":["tie-out"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l2.linkage","front":{"fr":"Quel est le test de bouclage du modèle 3 états ?","en":"What is the tie-out test of a 3-statement model?"},"back":{"fr":"Trésorerie d'ouverture + variation nette de trésorerie (Σ des 3 flux) = trésorerie de clôture du bilan.","en":"Opening cash + net change in cash (Σ of the 3 flows) = balance-sheet closing cash."},"hint":null},{"id":"fc.l2.linkage.006","type":"flashcard","level":2,"topic":"Accounting","tags":["balance sheet"],"difficulty":3,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l2.linkage","front":{"fr":"Après +10 de [[D&A]] (IS 25%), pourquoi le bilan reste-t-il équilibré ?","en":"After +10 of [[D&A]] (25% tax), why does the balance sheet stay balanced?"},"back":{"fr":"Actif : immobilisations −10, trésorerie +2,5, soit −7,5 ; capitaux propres −7,5 (réserves). Les deux côtés varient de −7,5.","en":"Assets: PP&E −10, cash +2.5, i.e. −7.5; equity −7.5 (retained earnings). Both sides move by −7.5."},"hint":null},{"id":"fc.l2.fcf.001","type":"flashcard","level":2,"topic":"DCF","tags":["FCFF"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l2.fcf","front":{"fr":"Donnez la formule du [[FCFF]] à partir de l'EBITDA.","en":"Give the formula for [[FCFF]] from EBITDA."},"back":{"fr":"[[FCFF]] = EBITDA − impôts (sur l'EBIT) − Δ[[BFR]] − capex.","en":"[[FCFF]] = EBITDA − taxes (on EBIT) − Δworking capital − capex."},"hint":null},{"id":"fc.l2.fcf.002","type":"flashcard","level":2,"topic":"DCF","tags":["FCFE"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l2.fcf","front":{"fr":"Comment passe-t-on du [[FCFF]] au [[FCFE]] ?","en":"How do you go from [[FCFF]] to [[FCFE]]?"},"back":{"fr":"[[FCFE]] = [[FCFF]] − service de la dette (intérêts nets d'impôt + remboursements − nouveaux tirages).","en":"[[FCFE]] = [[FCFF]] − debt service (after-tax interest + repayments − new drawdowns)."},"hint":null},{"id":"fc.l2.fcf.003","type":"flashcard","level":2,"topic":"DCF","tags":["discount rate"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l2.fcf","front":{"fr":"À quel taux actualise-t-on le [[FCFF]] et le [[FCFE]] ?","en":"At what rate do you discount [[FCFF]] and [[FCFE]]?"},"back":{"fr":"[[FCFF]] au [[WACC]] (flux pour tous les bailleurs) ; [[FCFE]] au coût des fonds propres Re (flux pour les actionnaires).","en":"[[FCFF]] at the [[WACC]] (cash for all capital providers); [[FCFE]] at the cost of equity Re (cash for shareholders)."},"hint":null},{"id":"fc.l2.fcf.004","type":"flashcard","level":2,"topic":"DCF","tags":["NOPAT"],"difficulty":3,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l2.fcf","front":{"fr":"EBIT 300, IS 25%, D&A 50, capex 30, Δ[[BFR]] 20 : quel est le [[FCFF]] ?","en":"EBIT 300, 25% tax, D&A 50, capex 30, Δworking capital 20: what is [[FCFF]]?"},"back":{"fr":"NOPAT = 300 × 0,75 = 225 ; FCFF = 225 + 50 − 30 − 20 = 225.","en":"NOPAT = 300 × 0.75 = 225; FCFF = 225 + 50 − 30 − 20 = 225."},"hint":null},{"id":"fc.l2.fcf.005","type":"flashcard","level":2,"topic":"DCF","tags":["EBITDA"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l2.fcf","front":{"fr":"Pourquoi l'[[EBITDA]] n'est-il pas du cash ?","en":"Why is [[EBITDA]] not cash?"},"back":{"fr":"Il ignore l'impôt, les capex et la variation de [[BFR]], trois sorties bien réelles qui creusent l'écart avec le free cash flow.","en":"It ignores tax, capex and the change in working capital, three very real outflows that create the gap with free cash flow."},"hint":null},{"id":"fc.l2.fcf.006","type":"flashcard","level":2,"topic":"DCF","tags":["NOPAT","tax shield"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l2.fcf","front":{"fr":"Pourquoi l'impôt du [[FCFF]] se calcule-t-il sur l'EBIT et non l'EBT ?","en":"Why is the [[FCFF]] tax computed on EBIT, not EBT?"},"back":{"fr":"Pour rester avant dette : on évite de double-compter l'économie d'impôt liée aux intérêts, déjà capturée dans le [[WACC]].","en":"To stay pre-debt: it avoids double-counting the interest tax shield, already captured in the [[WACC]]."},"hint":null},{"id":"fc.l2.ratios.001","type":"flashcard","level":2,"topic":"Accounting","tags":["gearing"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l2.ratios","front":{"fr":"Comment se calcule le [[gearing]] ?","en":"How is [[gearing]] computed?"},"back":{"fr":"[[gearing]] = dette nette / capitaux propres. La dette nette = dette brute − trésorerie.","en":"[[gearing]] = net debt / equity. Net debt = gross debt − cash."},"hint":null},{"id":"fc.l2.ratios.002","type":"flashcard","level":2,"topic":"Accounting","tags":["ROE"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l2.ratios","front":{"fr":"Que mesure le [[ROE]] et comment le calcule-t-on ?","en":"What does [[ROE]] measure and how is it computed?"},"back":{"fr":"[[ROE]] = résultat net / capitaux propres : la rentabilité des fonds investis par les actionnaires. Il est sensible au levier.","en":"[[ROE]] = net income / equity: the return on shareholders' invested funds. It is leverage-sensitive."},"hint":null},{"id":"fc.l2.ratios.003","type":"flashcard","level":2,"topic":"Accounting","tags":["ROCE"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l2.ratios","front":{"fr":"Quelle est la formule du [[ROCE]] ?","en":"What is the [[ROCE]] formula?"},"back":{"fr":"[[ROCE]] = EBIT × (1 − t) / capitaux employés, où capitaux employés = capitaux propres + dette nette. Indépendant du financement.","en":"[[ROCE]] = EBIT × (1 − t) / capital employed, where capital employed = equity + net debt. Independent of financing."},"hint":null},{"id":"fc.l2.ratios.004","type":"flashcard","level":2,"topic":"Accounting","tags":["coverage"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l2.ratios","front":{"fr":"Comment mesure-t-on la couverture des intérêts ?","en":"How is interest coverage measured?"},"back":{"fr":"Couverture des intérêts = EBIT / charges d'intérêts : combien de fois le résultat opérationnel paie les intérêts.","en":"Interest coverage = EBIT / interest expense: how many times operating profit covers interest."},"hint":null},{"id":"fc.l2.ratios.005","type":"flashcard","level":2,"topic":"Accounting","tags":["leverage"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l2.ratios","front":{"fr":"Quelle est la formule de l'uplift de l'effet de levier sur les fonds propres ?","en":"What is the formula for the leverage uplift on equity?"},"back":{"fr":"(Ra − Rd) × D/E, où Ra est le rendement des actifs, Rd le coût de la dette et D/E le ratio d'endettement. Le facteur D/E est essentiel.","en":"(Ra − Rd) × D/E, where Ra is return on assets, Rd the cost of debt and D/E the debt-to-equity ratio. The D/E factor is essential."},"hint":null},{"id":"fc.l2.ratios.006","type":"flashcard","level":2,"topic":"Accounting","tags":["leverage"],"difficulty":3,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l2.ratios","front":{"fr":"Ra = 10%, Rd = 4%, D/E = 1,5 : quel est l'uplift de levier ?","en":"Ra = 10%, Rd = 4%, D/E = 1.5: what is the leverage uplift?"},"back":{"fr":"(10% − 4%) × 1,5 = 9%. Le [[ROE]] approché est donc Ra + uplift = 19% (avant impôt).","en":"(10% − 4%) × 1.5 = 9%. Approximate [[ROE]] is therefore Ra + uplift = 19% (pre-tax)."},"hint":null},{"id":"fc.l2.ev-bridge.001","type":"flashcard","level":2,"topic":"Valuation","tags":["EV","bridge"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l2.ev-bridge","front":{"fr":"Quelle est la formule du bridge equity value → enterprise value ?","en":"What is the equity value → enterprise value bridge formula?"},"back":{"fr":"[[Enterprise Value]] = [[equity value]] + dette nette + [[minority interest]] − participations (associés) + provisions/retraites + leases + actions de préférence.","en":"Enterprise Value = equity value + net debt + minority interest − associates + provisions/pensions + leases + preferred stock."},"hint":null},{"id":"fc.l2.ev-bridge.002","type":"flashcard","level":2,"topic":"Valuation","tags":["working capital"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l2.ev-bridge","front":{"fr":"Le BFR (working capital) entre-t-il dans le bridge EV ?","en":"Does working capital enter the EV bridge?"},"back":{"fr":"Non. Le BFR fait partie de l'actif opérationnel déjà capté par l'EBITDA ; il n'est jamais une ligne du bridge.","en":"No. Working capital is part of the operating asset already captured by EBITDA; it is never a bridge line."},"hint":null},{"id":"fc.l2.ev-bridge.003","type":"flashcard","level":2,"topic":"Valuation","tags":["net debt"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l2.ev-bridge","front":{"fr":"Pourquoi soustrait-on la trésorerie pour obtenir la dette nette ?","en":"Why subtract cash to get net debt?"},"back":{"fr":"Parce que la trésorerie est un actif non opérationnel qui pourrait rembourser la dette : dette nette = dette brute − trésorerie.","en":"Because cash is a non-operating asset that could repay debt: net debt = gross debt − cash."},"hint":null},{"id":"fc.l2.ev-bridge.004","type":"flashcard","level":2,"topic":"Valuation","tags":["multiples"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l2.ev-bridge","front":{"fr":"Quel agrégat va avec un multiple d'EV vs un multiple d'equity ?","en":"Which metric pairs with an EV multiple vs an equity multiple?"},"back":{"fr":"Multiple d'EV (EV/EBITDA) ↔ agrégat avant frais financiers ; multiple d'equity (P/E) ↔ agrégat après (résultat net).","en":"EV multiple (EV/EBITDA) ↔ pre-financing metric; equity multiple (P/E) ↔ post-financing (net income)."},"hint":null},{"id":"fc.l2.ev-bridge.005","type":"flashcard","level":2,"topic":"Valuation","tags":["minority interest"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l2.ev-bridge","front":{"fr":"Pourquoi ajoute-t-on les intérêts minoritaires à l'EV ?","en":"Why add minority interest to EV?"},"back":{"fr":"Parce que l'EBITDA consolide 100 % d'une filiale détenue partiellement ; les [[minority interest]] représentent le claim des autres actionnaires sur cet actif.","en":"Because EBITDA consolidates 100% of a partly-owned subsidiary; minority interest represents other shareholders' claim on that asset."},"hint":null},{"id":"fc.l2.ev-bridge.006","type":"flashcard","level":2,"topic":"Valuation","tags":["EV","debt repayment"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l2.ev-bridge","front":{"fr":"L'EV change-t-elle quand la société rembourse de la dette avec sa trésorerie ?","en":"Does EV change when a company repays debt with its cash?"},"back":{"fr":"Non : la dette brute et la trésorerie baissent du même montant, donc la dette nette et l'EV sont inchangées.","en":"No: gross debt and cash fall by the same amount, so net debt and EV are unchanged."},"hint":null},{"id":"fc.l2.diluted-shares.001","type":"flashcard","level":2,"topic":"Valuation","tags":["treasury stock method"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l2.diluted-shares","front":{"fr":"Quelle est la formule des actions nettes en treasury stock method ?","en":"What is the net-shares formula in the treasury stock method?"},"back":{"fr":"Actions nettes = options × (cours − strike) / cours, pour les options dans la monnaie uniquement.","en":"Net shares = options × (price − strike) / price, for in-the-money options only."},"hint":null},{"id":"fc.l2.diluted-shares.002","type":"flashcard","level":2,"topic":"Valuation","tags":["treasury stock"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l2.diluted-shares","front":{"fr":"Comment passe-t-on des actions émises aux actions de base ?","en":"How do you go from issued shares to basic shares?"},"back":{"fr":"Actions de base = actions émises − [[treasury stock]] (auto-détention, sans droit de vote ni dividende).","en":"Basic shares = issued shares − treasury stock (held by the company, no voting or dividend rights)."},"hint":null},{"id":"fc.l2.diluted-shares.003","type":"flashcard","level":2,"topic":"Valuation","tags":["options"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l2.diluted-shares","front":{"fr":"20 options au strike 5, cours 10 : combien d'actions nettes créées ?","en":"20 options at strike 5, price 10: how many net new shares?"},"back":{"fr":"20 × (10 − 5)/10 = +10 actions nettes (produit d'exercice 100 € rachète 10 actions à 10 €).","en":"20 × (10 − 5)/10 = +10 net shares (proceeds of 100 buy back 10 shares at 10)."},"hint":null},{"id":"fc.l2.diluted-shares.004","type":"flashcard","level":2,"topic":"Valuation","tags":["convertibles"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l2.diluted-shares","front":{"fr":"Comment traite-t-on une obligation convertible hors de la monnaie ?","en":"How is an out-of-the-money convertible treated?"},"back":{"fr":"Comme de la dette : elle n'est pas convertie en actions et figure dans la dette nette du bridge EV.","en":"As debt: it is not converted to shares and sits in net debt within the EV bridge."},"hint":null},{"id":"fc.l2.diluted-shares.005","type":"flashcard","level":2,"topic":"Valuation","tags":["equity value"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l2.diluted-shares","front":{"fr":"Actions diluées = 115, cours = 10 € : quelle equity value ?","en":"Diluted shares = 115, price = 10: what is equity value?"},"back":{"fr":"[[Equity value]] = 115 × 10 = 1 150 €.","en":"Equity value = 115 × 10 = EUR 1,150."},"hint":null},{"id":"fc.l2.diluted-shares.006","type":"flashcard","level":2,"topic":"Valuation","tags":["in the money"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l2.diluted-shares","front":{"fr":"Quelles options compte-t-on dans la dilution ?","en":"Which options count in dilution?"},"back":{"fr":"Seulement celles dans la monnaie ([[in the money]]) : strike < cours. Les options hors de la monnaie n'ajoutent rien.","en":"Only in-the-money ones: strike < price. Out-of-the-money options add nothing."},"hint":null},{"id":"fc.l2.tvm.001","type":"flashcard","level":2,"topic":"DCF","tags":["PV"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l2.tvm","front":{"fr":"Quelle est la formule de la valeur présente d'un flux futur ?","en":"What is the present value formula of a future cash flow?"},"back":{"fr":"PV = FV / (1+r)^n. Plus r ou n augmente, plus la PV diminue.","en":"PV = FV / (1+r)^n. The higher r or n, the lower the PV."},"hint":null},{"id":"fc.l2.tvm.002","type":"flashcard","level":2,"topic":"DCF","tags":["perpetuity"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l2.tvm","front":{"fr":"Quelle est la formule maîtresse de la perpétuité croissante ?","en":"What is the master growing-perpetuity formula?"},"back":{"fr":"Valeur = CF / (r − g), valable seulement si g < r. C'est l'ossature de la [[terminal value]] de Gordon.","en":"Value = CF / (r − g), valid only if g < r. It is the backbone of the Gordon terminal value."},"hint":null},{"id":"fc.l2.tvm.003","type":"flashcard","level":2,"topic":"DCF","tags":["perpetuity"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l2.tvm","front":{"fr":"CF = 100, r = 10 %, g = 3 % : quelle valeur ?","en":"CF = 100, r = 10%, g = 3%: what value?"},"back":{"fr":"100 / (10 % − 3 %) = 100 / 7 % = 1 429 €.","en":"100 / (10% − 3%) = 100 / 7% = EUR 1,429."},"hint":null},{"id":"fc.l2.tvm.004","type":"flashcard","level":2,"topic":"DCF","tags":["NPV"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l2.tvm","front":{"fr":"Que mesure la NPV et quelle est la règle de décision ?","en":"What does NPV measure and what is the decision rule?"},"back":{"fr":"Le [[NPV]] = Σ CFt/(1+r)^t − I0, soit la création de valeur en euros. On investit si NPV > 0.","en":"NPV = Σ CFt/(1+r)^t − I0, the value created in euros. Invest if NPV > 0."},"hint":null},{"id":"fc.l2.tvm.005","type":"flashcard","level":2,"topic":"DCF","tags":["IRR"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l2.tvm","front":{"fr":"Que représente l'IRR et comment se calcule-t-il en LBO simple ?","en":"What does IRR represent and how is it computed in a simple LBO?"},"back":{"fr":"L'[[IRR]] est le taux qui annule la NPV. Pour une entrée/sortie unique : IRR = MoM^(1/n) − 1.","en":"IRR is the rate that sets NPV to zero. For a single in/out: IRR = MoM^(1/n) − 1."},"hint":null},{"id":"fc.l2.tvm.006","type":"flashcard","level":2,"topic":"DCF","tags":["perpetuity"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l2.tvm","front":{"fr":"Que se passe-t-il dans Valeur = CF/(r−g) quand g tend vers r ?","en":"What happens in Value = CF/(r−g) as g approaches r?"},"back":{"fr":"La valeur tend vers l'infini : le dénominateur tend vers zéro, ce qui montre la forte sensibilité du modèle.","en":"Value tends to infinity: the denominator tends to zero, showing the model's high sensitivity."},"hint":null},{"id":"fc.l3.dcf.001","type":"flashcard","level":3,"topic":"DCF","tags":["DCF"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.dcf","front":{"fr":"Quelles sont les 6 étapes d'un DCF ?","en":"What are the 6 steps of a DCF?"},"back":{"fr":"1) Projeter le [[FCFF]], 2) estimer le [[WACC]], 3) actualiser les flux, 4) calculer la valeur terminale, 5) sommer pour obtenir l'[[Enterprise Value]], 6) bridge vers l'[[equity value]].","en":"1) Project [[FCFF]], 2) estimate the [[WACC]], 3) discount the flows, 4) compute terminal value, 5) sum to get [[Enterprise Value]], 6) bridge to [[equity value]]."},"hint":null},{"id":"fc.l3.dcf.002","type":"flashcard","level":3,"topic":"DCF","tags":["FCFF"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.dcf","front":{"fr":"Comment calcule-t-on le FCFF ?","en":"How is FCFF computed?"},"back":{"fr":"[[FCFF]] = EBIT × (1 − impôt) + D&A − capex − Δ BFR. C'est un flux unlevered, actualisé au WACC. En France l'IS est ~25%.","en":"[[FCFF]] = EBIT × (1 − tax) + D&A − capex − ΔNWC. It is an unlevered flow, discounted at the WACC. French corporate tax is ~25%."},"hint":null},{"id":"fc.l3.dcf.003","type":"flashcard","level":3,"topic":"DCF","tags":["DCF","WACC"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.dcf","front":{"fr":"Pourquoi actualise-t-on le FCFF au WACC et non au coût des fonds propres ?","en":"Why is FCFF discounted at the WACC and not at the cost of equity?"},"back":{"fr":"Parce que le [[FCFF]] est un flux disponible pour TOUS les apporteurs de capitaux (dette + equity), avant rémunération de la dette. Le [[WACC]] reflète le coût combiné de ces capitaux.","en":"Because [[FCFF]] is available to ALL capital providers (debt + equity), before paying debt. The [[WACC]] reflects the combined cost of that capital."},"hint":null},{"id":"fc.l3.dcf.004","type":"flashcard","level":3,"topic":"DCF","tags":["DCF"],"difficulty":2,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l3.dcf","front":{"fr":"Quelle est la valeur actuelle de 120 reçu dans 2 ans à un WACC de 10% ?","en":"What is the present value of 120 received in 2 years at a 10% WACC?"},"back":{"fr":"120 / 1,1² = 120 / 1,21 ≈ 99.","en":"120 / 1.1² = 120 / 1.21 ≈ 99."},"hint":{"fr":"Diviser par (1 + WACC) puissance n.","en":"Divide by (1 + WACC) to the power n."}},{"id":"fc.l3.dcf.005","type":"flashcard","level":3,"topic":"DCF","tags":["EV","equity-value"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.dcf","front":{"fr":"Comment passe-t-on de l'Enterprise Value à l'equity value ?","en":"How do you bridge from Enterprise Value to equity value?"},"back":{"fr":"[[equity value]] = [[Enterprise Value]] − dette nette − minoritaires − provisions assimilées dette + participations non consolidées.","en":"[[equity value]] = [[Enterprise Value]] − net debt − minorities − debt-like provisions + non-consolidated stakes."},"hint":null},{"id":"fc.l3.dcf.006","type":"flashcard","level":3,"topic":"DCF","tags":["DCF","terminal-value"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.dcf","front":{"fr":"Quelle part de l'EV la valeur terminale représente-t-elle typiquement ?","en":"What share of EV does the terminal value typically represent?"},"back":{"fr":"Souvent 60–80% de l'[[Enterprise Value]], ce qui en fait le poste le plus sensible du DCF. Elle doit impérativement être actualisée.","en":"Often 60–80% of [[Enterprise Value]], making it the most sensitive line of the DCF. It must always be discounted."},"hint":null},{"id":"fc.l3.wacc.001","type":"flashcard","level":3,"topic":"WACC","tags":["WACC"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.wacc","front":{"fr":"Écrivez la formule du WACC.","en":"Write the WACC formula."},"back":{"fr":"[[WACC]] = E/V · Re + D/V · Rd · (1 − T), avec V = E + D. Le (1 − T) est le tax shield sur la dette.","en":"[[WACC]] = E/V · Re + D/V · Rd · (1 − T), with V = E + D. The (1 − T) is the debt tax shield."},"hint":null},{"id":"fc.l3.wacc.002","type":"flashcard","level":3,"topic":"WACC","tags":["CAPM","beta"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.wacc","front":{"fr":"Quelle est la formule du CAPM ?","en":"What is the CAPM formula?"},"back":{"fr":"[[CAPM]] : Re = Rf + [[beta]] · (Rm − Rf), où (Rm − Rf) est la prime de risque actions (ERP réaliste 4–6%).","en":"[[CAPM]]: Re = Rf + [[beta]] · (Rm − Rf), where (Rm − Rf) is the equity risk premium (realistic ERP 4–6%)."},"hint":null},{"id":"fc.l3.wacc.003","type":"flashcard","level":3,"topic":"WACC","tags":["beta"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.wacc","front":{"fr":"Comment délève-t-on un bêta ?","en":"How do you unlever a beta?"},"back":{"fr":"βu = βL / (1 + (1 − T) · D/E). On délève les comparables, puis on relève au levier cible de la société analysée.","en":"βu = βL / (1 + (1 − T) · D/E). You unlever comparables, then relever to the target's leverage."},"hint":null},{"id":"fc.l3.wacc.004","type":"flashcard","level":3,"topic":"WACC","tags":["CAPM"],"difficulty":2,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l3.wacc","front":{"fr":"Re si Rf = 1%, beta = 1,5 et Rm − Rf = 2% ?","en":"Re if Rf = 1%, beta = 1.5 and Rm − Rf = 2%?"},"back":{"fr":"Re = 1% + 1,5 × (3% − 1%) = 1% + 3% = 4%.","en":"Re = 1% + 1.5 × (3% − 1%) = 1% + 3% = 4%."},"hint":{"fr":"Re = Rf + beta × prime.","en":"Re = Rf + beta × premium."}},{"id":"fc.l3.wacc.005","type":"flashcard","level":3,"topic":"WACC","tags":["WACC"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.wacc","front":{"fr":"Le WACC baisse-t-il indéfiniment quand on s'endette davantage ?","en":"Does the WACC fall indefinitely as you add more debt?"},"back":{"fr":"Non. La courbe du WACC est en U : la dette le fait baisser au début, mais au-delà d'un point le risque de défaut renchérit dette et fonds propres et le WACC remonte.","en":"No. The WACC curve is U-shaped: debt lowers it at first, but beyond a point default risk raises both debt and equity cost and the WACC rises again."},"hint":null},{"id":"fc.l3.wacc.006","type":"flashcard","level":3,"topic":"WACC","tags":["WACC"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.wacc","front":{"fr":"Utilise-t-on valeurs comptables ou de marché pour pondérer E et D ?","en":"Do you use book or market values to weight E and D?"},"back":{"fr":"Valeurs de MARCHÉ. Pour les fonds propres on prend la capitalisation boursière ; les valeurs comptables faussent les pondérations.","en":"MARKET values. For equity use market capitalization; book values distort the weights."},"hint":null},{"id":"fc.l3.tv.001","type":"flashcard","level":3,"topic":"DCF","tags":["terminal-value","Gordon"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.terminal-value","front":{"fr":"Quelle est la formule de Gordon pour la valeur terminale ?","en":"What is the Gordon growth terminal value formula?"},"back":{"fr":"TV = FCF · (1 + g) / (WACC − g). Elle tombe en fin d'horizon et doit ensuite être actualisée à aujourd'hui.","en":"TV = FCF · (1 + g) / (WACC − g). It falls at the end of the horizon and must then be discounted back to today."},"hint":null},{"id":"fc.l3.tv.002","type":"flashcard","level":3,"topic":"DCF","tags":["terminal-value"],"difficulty":3,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l3.terminal-value","front":{"fr":"TV par multiple : 10x EBITDA sur un EBITDA de 500 ?","en":"Exit-multiple TV: 10x EBITDA on a 500 EBITDA?"},"back":{"fr":"TV = 10 × 500 = 5 000.","en":"TV = 10 × 500 = 5,000."},"hint":null},{"id":"fc.l3.tv.003","type":"flashcard","level":3,"topic":"DCF","tags":["terminal-value"],"difficulty":4,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l3.terminal-value","front":{"fr":"Si TV = 10 000 avec FCF 1 000 et WACC 10%, quel est le g implicite ?","en":"If TV = 10,000 with FCF 1,000 and WACC 10%, what is the implied g?"},"back":{"fr":"10 000 = 1 000 / (0,10 − g) ⇒ g = 0%. La TV suppose une croissance perpétuelle nulle et est donc sous-évaluée vs une hypothèse réaliste de ~2%.","en":"10,000 = 1,000 / (0.10 − g) ⇒ g = 0%. The TV assumes zero perpetual growth and is thus undervalued vs a realistic ~2% assumption."},"hint":null},{"id":"fc.l3.tv.004","type":"flashcard","level":3,"topic":"DCF","tags":["terminal-value"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.terminal-value","front":{"fr":"Quelle est la borne supérieure raisonnable du taux de croissance perpétuel g ?","en":"What is the reasonable upper bound for the perpetual growth rate g?"},"back":{"fr":"g doit rester inférieur à la croissance du PIB long terme (~2%). Au-delà, l'entreprise dépasserait l'économie pour l'éternité, ce qui est impossible.","en":"g must stay below long-term GDP growth (~2%). Beyond that, the firm would outgrow the entire economy forever, which is impossible."},"hint":null},{"id":"fc.l3.tv.005","type":"flashcard","level":3,"topic":"DCF","tags":["terminal-value"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.terminal-value","front":{"fr":"Quelles sont les deux méthodes de calcul de la valeur terminale ?","en":"What are the two terminal value methods?"},"back":{"fr":"1) Gordon (croissance perpétuelle) : FCF·(1+g)/(WACC−g). 2) Multiple de sortie : multiple terminal × métrique de dernière année (souvent EBITDA).","en":"1) Gordon (perpetual growth): FCF·(1+g)/(WACC−g). 2) Exit multiple: terminal multiple × last-year metric (often EBITDA)."},"hint":null},{"id":"fc.l3.tv.006","type":"flashcard","level":3,"topic":"DCF","tags":["terminal-value"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.terminal-value","front":{"fr":"Pourquoi la formule de Gordon est-elle si sensible ?","en":"Why is the Gordon formula so sensitive?"},"back":{"fr":"À cause du dénominateur (WACC − g) : quand g se rapproche du WACC, le dénominateur tend vers zéro et la TV explose. De petits écarts d'hypothèses changent fortement la valeur.","en":"Because of the (WACC − g) denominator: as g approaches the WACC, the denominator tends to zero and the TV explodes. Small assumption changes shift the value sharply."},"hint":null},{"id":"fc.l3.comps.001","type":"flashcard","level":3,"topic":"Valuation","tags":["multiples"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.trading-comps","front":{"fr":"Pourquoi retient-on la médiane et non la moyenne des comparables ?","en":"Why use the median rather than the mean of comparables?"},"back":{"fr":"Parce que la médiane est robuste aux outliers (sociétés survalorisées ou en restructuration), qui tirent artificiellement la moyenne.","en":"Because the median is robust to outliers (overvalued or restructuring firms) that artificially drag the mean."},"hint":null},{"id":"fc.l3.comps.002","type":"flashcard","level":3,"topic":"Valuation","tags":["P/E"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.trading-comps","front":{"fr":"Pourquoi le P/E est-il le multiple le moins fiable ?","en":"Why is P/E the least reliable multiple?"},"back":{"fr":"Le [[P/E]] dépend du levier (charges d'intérêts), du taux d'impôt et des éléments exceptionnels qui polluent le résultat net. Deux sociétés identiques mais aux dettes différentes ont des P/E très différents.","en":"[[P/E]] depends on leverage (interest expense), tax rate, and exceptional items polluting net income. Two identical firms with different debt show very different P/Es."},"hint":null},{"id":"fc.l3.comps.003","type":"flashcard","level":3,"topic":"Valuation","tags":["EV/EBITDA"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.trading-comps","front":{"fr":"Pourquoi les multiples d'EV sont-ils indépendants de la structure de capital ?","en":"Why are EV multiples independent of capital structure?"},"back":{"fr":"L'[[EV]] valorise toute l'entreprise (dette + equity), et l'EBITDA/EBIT/Sales sont avant charges financières. Ils sont donc comparables entre sociétés diversement endettées, contrairement au P/E.","en":"[[EV]] values the whole firm (debt + equity), and EBITDA/EBIT/Sales are pre-interest. They are therefore comparable across differently leveraged firms, unlike P/E."},"hint":null},{"id":"fc.l3.comps.004","type":"flashcard","level":3,"topic":"Valuation","tags":["multiples"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.trading-comps","front":{"fr":"Quels multiples sectoriels pour le retail/aérien et les REITs ?","en":"Which sector multiples for retail/airlines and REITs?"},"back":{"fr":"EV/EBITDAR (loyers ajoutés) pour le retail et l'aérien ; P/FFO pour les REITs (foncières cotées).","en":"EV/EBITDAR (rents added back) for retail and airlines; P/FFO for REITs (listed property)."},"hint":null},{"id":"fc.l3.comps.005","type":"flashcard","level":3,"topic":"Valuation","tags":["EV","equity-value"],"difficulty":2,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l3.trading-comps","front":{"fr":"EBITDA 200, multiple médian 17,6x, dette nette 520 : equity value ?","en":"EBITDA 200, median multiple 17.6x, net debt 520: equity value?"},"back":{"fr":"EV = 200 × 17,6 = 3 520 ; equity value = 3 520 − 520 = 3 000.","en":"EV = 200 × 17.6 = 3,520; equity value = 3,520 − 520 = 3,000."},"hint":{"fr":"EV = EBITDA × multiple, puis retrancher la dette nette.","en":"EV = EBITDA × multiple, then subtract net debt."}},{"id":"fc.l3.comps.006","type":"flashcard","level":3,"topic":"Valuation","tags":["multiples"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.trading-comps","front":{"fr":"Quel multiple pour une société non rentable (tech early stage) ?","en":"Which multiple for an unprofitable company (early-stage tech)?"},"back":{"fr":"EV/Sales, car l'EBITDA et le résultat net sont négatifs ou non significatifs. On capte la valorisation sur le chiffre d'affaires.","en":"EV/Sales, because EBITDA and net income are negative or meaningless. Valuation is captured on revenue."},"hint":null},{"id":"fc.l3.prec.001","type":"flashcard","level":3,"topic":"Valuation","tags":["precedent-transactions","control-premium"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.precedent","front":{"fr":"Les multiples de transactions précédentes sont-ils supérieurs ou inférieurs aux comparables boursiers ?","en":"Are precedent transaction multiples higher or lower than trading comparables?"},"back":{"fr":"Supérieurs, à cause de la prime de contrôle (typiquement 20–40%) que paie l'acquéreur pour prendre le contrôle et capter des synergies.","en":"Higher, because of the control premium (typically 20–40%) the acquirer pays to take control and capture synergies."},"hint":null},{"id":"fc.l3.prec.002","type":"flashcard","level":3,"topic":"Valuation","tags":["precedent-transactions"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.precedent","front":{"fr":"Quelle est la principale limite des transactions précédentes ?","en":"What is the main limitation of precedent transactions?"},"back":{"fr":"Elles reflètent les conditions de marché de leur époque : un deal au pic de 2021 n'est pas représentatif d'un marché plus tendu en 2024. Les multiples sont datés.","en":"They reflect the market conditions of their time: a 2021-peak deal is not representative of a tighter 2024 market. The multiples are dated."},"hint":null},{"id":"fc.l3.prec.003","type":"flashcard","level":3,"topic":"Valuation","tags":["DCF"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.precedent","front":{"fr":"Pourquoi le DCF du FCFF est-il inadapté aux banques et REITs ?","en":"Why is an FCFF DCF inappropriate for banks and REITs?"},"back":{"fr":"Leur dette fait partie de l'activité (matière première, pas financement) et le concept de FCFF n'a pas de sens. On utilise le DDM, le résultat distribuable ou des multiples de book value (P/B, P/FFO).","en":"Their debt is part of operations (raw material, not financing) and the FCFF concept makes no sense. Use the DDM, distributable earnings, or book-value multiples (P/B, P/FFO)."},"hint":null},{"id":"fc.l3.prec.004","type":"flashcard","level":3,"topic":"Valuation","tags":["precedent-transactions"],"difficulty":2,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.precedent","front":{"fr":"Citez trois sources pour reconstituer des multiples de transactions.","en":"Name three sources to rebuild transaction multiples."},"back":{"fr":"Communiqués de deal, Mergermarket, Capital IQ, prospectus, rapports d'experts indépendants, documents d'offre AMF.","en":"Deal press releases, Mergermarket, Capital IQ, prospectuses, independent expert reports, AMF offer documents."},"hint":null},{"id":"fc.l3.prec.005","type":"flashcard","level":3,"topic":"Valuation","tags":["control-premium"],"difficulty":3,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l3.precedent","front":{"fr":"Comparables à 17,6x, précédents à 22,0x : prime de contrôle implicite ?","en":"Comparables at 17.6x, precedents at 22.0x: implied control premium?"},"back":{"fr":"22,0 / 17,6 − 1 ≈ 25%, cohérent avec la fourchette 20–40%.","en":"22.0 / 17.6 − 1 ≈ 25%, consistent with the 20–40% range."},"hint":null},{"id":"fc.l3.prec.006","type":"flashcard","level":3,"topic":"Valuation","tags":["M&A","control-premium"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.precedent","front":{"fr":"Acquéreur industriel ou financier : lequel paie en général la prime la plus élevée ?","en":"Strategic or financial acquirer: which usually pays the higher premium?"},"back":{"fr":"L'acquéreur industriel (stratégique), car il peut capter des synergies opérationnelles qu'un sponsor LBO financier n'a pas.","en":"The strategic acquirer, because it can capture operating synergies that a financial LBO sponsor cannot."},"hint":null},{"id":"fc.l5.restructuring.001","type":"flashcard","level":5,"topic":"Restructuring","tags":["procedures","FR"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.restructuring","front":{"fr":"Quelle est la différence clé entre sauvegarde et redressement judiciaire ?","en":"What is the key difference between safeguard and judicial reorganisation in France?"},"back":{"fr":"La [[sauvegarde]] s'ouvre AVANT la cessation des paiements (préventive, dirigeant en place) ; le [[redressement judiciaire]] APRÈS la cessation des paiements, quand le redressement reste possible.","en":"[[sauvegarde]] opens BEFORE payment default (preventive, management stays); [[redressement judiciaire]] opens AFTER payment default, while recovery is still feasible."},"hint":null},{"id":"fc.l5.restructuring.002","type":"flashcard","level":5,"topic":"Restructuring","tags":["US","Chapter11"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.restructuring","front":{"fr":"Chapter 11 vs Chapter 7 : quelle distinction ?","en":"Chapter 11 vs Chapter 7: what is the distinction?"},"back":{"fr":"Le [[Chapter 11]] est une réorganisation (la société continue en debtor-in-possession et propose un plan) ; le [[Chapter 7]] est une liquidation pure (un trustee vend les actifs).","en":"[[Chapter 11]] is a reorganisation (the company continues as debtor-in-possession and proposes a plan); [[Chapter 7]] is a pure liquidation (a trustee sells the assets)."},"hint":null},{"id":"fc.l5.restructuring.003","type":"flashcard","level":5,"topic":"Restructuring","tags":["advisory"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.restructuring","front":{"fr":"Qui conseille typiquement le débiteur, et qui les créanciers ?","en":"Who typically advises the debtor, and who the creditors?"},"back":{"fr":"Débiteur : Lazard, Rothschild & Co, PJT Partners. Créanciers : Houlihan Lokey, leader mondial du conseil créancier.","en":"Debtor: Lazard, Rothschild & Co, PJT Partners. Creditors: Houlihan Lokey, the global leader in creditor-side advisory."},"hint":null},{"id":"fc.l5.restructuring.004","type":"flashcard","level":5,"topic":"Restructuring","tags":["DIP"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.restructuring","front":{"fr":"Qu'est-ce que le DIP financing et quel est son rang ?","en":"What is DIP financing and what is its rank?"},"back":{"fr":"Le [[DIP financing]] (debtor-in-possession) est un financement accordé à la société pendant le Chapter 11. Il bénéficie d'une super-priorité, passant devant la dette pré-existante dans la waterfall.","en":"[[DIP financing]] (debtor-in-possession) is financing granted to the company during Chapter 11. It enjoys super-priority, ranking ahead of pre-petition debt in the waterfall."},"hint":null},{"id":"fc.l5.restructuring.005","type":"flashcard","level":5,"topic":"Restructuring","tags":["waterfall","APR"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.restructuring","front":{"fr":"Énoncez l'absolute priority rule.","en":"State the absolute priority rule."},"back":{"fr":"L'[[absolute priority rule]] : aucune classe junior ne reçoit de valeur tant que la classe senior n'a pas été intégralement remboursée. Ordre : frais/DIP → senior secured → unsecured → subordonné → equity.","en":"The [[absolute priority rule]]: no junior class receives value until the senior class is repaid in full. Order: costs/DIP → senior secured → unsecured → subordinated → equity."},"hint":null},{"id":"fc.l5.restructuring.006","type":"flashcard","level":5,"topic":"Restructuring","tags":["valuation","floor"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.restructuring","front":{"fr":"Pourquoi la valeur de liquidation est-elle un plancher ?","en":"Why is liquidation value a floor?"},"back":{"fr":"La [[liquidation value]] est ce qu'un créancier toucherait en vente morcelée des actifs. Aucun créancier rationnel n'accepte un plan lui rapportant moins (test best-interest-of-creditors). Elle se compare à la going-concern value.","en":"[[liquidation value]] is what a creditor would receive from a piecemeal asset sale. No rational creditor accepts a plan paying less (best-interest-of-creditors test). It is compared to going-concern value."},"hint":null},{"id":"fc.l5.distressed-ma.001","type":"flashcard","level":5,"topic":"Restructuring","tags":["plan-de-cession"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.distressed-ma","front":{"fr":"Qu'est-ce qu'un plan de cession et que devient le passif ?","en":"What is a sale plan (plan de cession) and what happens to the liabilities?"},"back":{"fr":"Le [[plan de cession]] permet de reprendre tout ou partie de l'activité sous contrôle du tribunal, libre du passif laissé derrière. Équivalent fonctionnel du [[363 sale]] américain (free and clear).","en":"The [[plan de cession]] lets a buyer take all or part of the business under court control, free of the liabilities left behind. Functional equivalent of the US [[363 sale]] (free and clear)."},"hint":null},{"id":"fc.l5.distressed-ma.002","type":"flashcard","level":5,"topic":"Restructuring","tags":["loan-to-own"],"difficulty":5,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.distressed-ma","front":{"fr":"En quoi consiste une stratégie loan-to-own ?","en":"What does a loan-to-own strategy consist of?"},"back":{"fr":"Acheter la dette décotée (idéalement la fulcrum security) d'une société en difficulté pour la convertir en equity lors de la restructuration et prendre le contrôle. L'objectif est de posséder, pas d'être remboursé.","en":"Buy a troubled company's discounted debt (ideally the fulcrum security) to convert it into equity during the restructuring and gain control. The goal is to own, not to be repaid."},"hint":null},{"id":"fc.l5.distressed-ma.003","type":"flashcard","level":5,"topic":"Restructuring","tags":["fulcrum"],"difficulty":5,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.distressed-ma","front":{"fr":"Qu'est-ce que la fulcrum security ?","en":"What is the fulcrum security?"},"back":{"fr":"C'est la tranche de dette partiellement remboursée par la valeur disponible : la première à ne pas être servie au pair. Elle reçoit l'equity dans une conversion et prend donc le contrôle post-restructuration.","en":"It is the tranche of debt only partially repaid by available value: the first not paid at par. It receives the equity in a conversion and thus takes control post-restructuring."},"hint":null},{"id":"fc.l5.distressed-ma.004","type":"flashcard","level":5,"topic":"Restructuring","tags":["debt-equity"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.distressed-ma","front":{"fr":"Que fait un debt-to-equity swap aux actionnaires historiques ?","en":"What does a debt-to-equity swap do to legacy shareholders?"},"back":{"fr":"Le [[debt-to-equity swap]] convertit la dette en actions ; les actionnaires historiques sont massivement dilués, souvent effacés (wiped out), tandis que les ex-créanciers deviennent propriétaires.","en":"The [[debt-to-equity swap]] converts debt into shares; legacy shareholders are heavily diluted, often wiped out, while former creditors become owners."},"hint":null},{"id":"fc.l5.distressed-ma.005","type":"flashcard","level":5,"topic":"Restructuring","tags":["decote"],"difficulty":3,"source":{"flag":"APPROXIMATE"},"moduleId":"mod.l5.distressed-ma","front":{"fr":"Pourquoi une décote en distressed M&A, et comment varie-t-elle dans la structure ?","en":"Why a discount in distressed M&A, and how does it vary across the structure?"},"back":{"fr":"La [[décote]] rémunère le risque, le manque d'information et la prime de liquidité (forced seller, due diligence limitée). Plus on est senior dans la waterfall, plus la décote se resserre.","en":"The [[décote]] (discount) compensates for risk, information gaps and a liquidity premium (forced seller, limited due diligence). The more senior in the waterfall, the tighter the discount."},"hint":null},{"id":"f
