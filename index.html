},"correct":true,"why":{"fr":"La prévisibilité des FCF sécurise le service de la dette : c'est le critère premier.","en":"FCF predictability secures debt service: the primary criterion."}},{"id":"c","text":{"fr":"Une société très cyclique à fort capex","en":"A highly cyclical, capex-heavy company"},"correct":false,"why":{"fr":"Cyclicité et capex élevés fragilisent le remboursement de la dette.","en":"Cyclicality and high capex weaken debt repayment."}},{"id":"d","text":{"fr":"Une société sans pouvoir de marché","en":"A company with no market power"},"correct":false,"why":{"fr":"Une position défendable est requise pour protéger les marges.","en":"A defensible position is required to protect margins."}}],"explanation":{"fr":"Le LBO privilégie la prévisibilité des cash-flows, qui sécurise un endettement élevé, plutôt que la croissance brute.","en":"LBO favours cash-flow predictability, which secures high leverage, over raw growth."},"workings":null},{"id":"qcm.l4.lbo1.002","type":"qcm","level":4,"topic":"LBO","tags":["EV","equity value"],"difficulty":4,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l4.lbo1-paper","stem":{"fr":"EBITDA 20, multiple d'entrée 12x, et 10 de cash net positif. Quelle est l'equity value à l'entrée ?","en":"EBITDA 20, entry multiple 12x, and 10 of net cash. What is the entry equity value?"},"multi":false,"options":[{"id":"a","text":{"fr":"230","en":"230"},"correct":false,"why":{"fr":"Cela soustrait le cash alors qu'un cash net positif s'ajoute.","en":"This subtracts cash, but net cash adds to equity value."}},{"id":"b","text":{"fr":"240","en":"240"},"correct":false,"why":{"fr":"240 est l'EV ; il faut encore ajouter le cash net.","en":"240 is the EV; net cash still needs to be added."}},{"id":"c","text":{"fr":"250","en":"250"},"correct":true,"why":{"fr":"EV = 12 × 20 = 240 ; Equity Value = 240 + 10 = 250.","en":"EV = 12 × 20 = 240; Equity Value = 240 + 10 = 250."}},{"id":"d","text":{"fr":"260","en":"260"},"correct":false,"why":{"fr":"260 ajouterait aussi les frais, hors périmètre de la question equity value.","en":"260 would also add fees, outside the equity value question."}}],"explanation":{"fr":"Equity Value = EV − dette nette ; ici la dette nette est négative (cash net +10), donc on ajoute.","en":"Equity Value = EV − net debt; here net debt is negative (net cash +10), so we add."},"workings":{"fr":"EV = 12 × 20 = 240 ; +10 cash → 250.","en":"EV = 12 × 20 = 240; +10 cash → 250."}},{"id":"qcm.l4.lbo1.003","type":"qcm","level":4,"topic":"LBO","tags":["LBO","structuration"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.lbo1-paper","stem":{"fr":"Dans une structure LBO, où se logent respectivement l'equity et la dette d'acquisition ?","en":"In an LBO structure, where do equity and acquisition debt respectively sit?"},"multi":false,"options":[{"id":"a","text":{"fr":"Equity en BidCo, dette en HoldCo","en":"Equity in BidCo, debt in HoldCo"},"correct":false,"why":{"fr":"C'est l'inverse : la dette se loge en BidCo, près des cash-flows.","en":"It is the reverse: debt sits in BidCo, close to cash flows."}},{"id":"b","text":{"fr":"Equity en HoldCo, dette d'acquisition en BidCo","en":"Equity in HoldCo, acquisition debt in BidCo"},"correct":true,"why":{"fr":"La HoldCo reçoit l'equity, la BidCo porte la dette qui rachète l'OpCo.","en":"HoldCo receives equity, BidCo carries the debt that buys OpCo."}},{"id":"c","text":{"fr":"Tout en OpCo directement","en":"Everything directly in OpCo"},"correct":false,"why":{"fr":"La cascade HoldCo/BidCo organise subordination et déductibilité.","en":"The HoldCo/BidCo cascade organises subordination and deductibility."}},{"id":"d","text":{"fr":"Equity et dette tous deux en BidCo uniquement","en":"Equity and debt both in BidCo only"},"correct":false,"why":{"fr":"L'equity des fonds et managers entre par la HoldCo.","en":"Funds' and managers' equity enters via HoldCo."}}],"explanation":{"fr":"Sponsor → HoldCo (equity) → BidCo (dette) → OpCo (cible) : la dette est logée au plus près des cash-flows opérationnels.","en":"Sponsor → HoldCo (equity) → BidCo (debt) → OpCo (target): debt sits close to operating cash flows."},"workings":null},{"id":"qcm.l4.lbo1.004","type":"qcm","level":4,"topic":"LBO","tags":["LBO"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.lbo1-paper","stem":{"fr":"Quels énoncés décrivent correctement les leviers de création de valeur d'un LBO ?","en":"Which statements correctly describe an LBO's value-creation levers?"},"multi":true,"options":[{"id":"a","text":{"fr":"Le désendettement transfère de la valeur à l'actionnaire","en":"Deleveraging transfers value to the shareholder"},"correct":true,"why":{"fr":"Les FCF qui remboursent la dette augmentent mécaniquement l'equity.","en":"FCF repaying debt mechanically increases equity."}},{"id":"b","text":{"fr":"La croissance de l'EBITDA augmente la valeur de sortie","en":"EBITDA growth raises exit value"},"correct":true,"why":{"fr":"À multiple constant, plus d'EBITDA = plus d'EV de sortie.","en":"At a constant multiple, more EBITDA = more exit EV."}},{"id":"c","text":{"fr":"L'effet de levier crée du cash-flow opérationnel","en":"Leverage creates operating cash flow"},"correct":false,"why":{"fr":"Le levier amplifie le rendement et le risque, il ne crée pas de cash-flow.","en":"Leverage amplifies return and risk, it does not create cash flow."}},{"id":"d","text":{"fr":"L'expansion du multiple de sortie augmente le rendement","en":"Exit multiple expansion increases returns"},"correct":true,"why":{"fr":"Sortir à un multiple supérieur à l'entrée crée de la valeur.","en":"Exiting at a higher multiple than entry creates value."}}],"explanation":{"fr":"Les trois vrais leviers sont désendettement, croissance EBITDA et expansion de multiple ; le levier amplifie mais ne crée pas de cash-flow.","en":"The three real levers are deleveraging, EBITDA growth and multiple expansion; leverage amplifies but does not create cash flow."},"workings":null},{"id":"qcm.l4.lbo2.001","type":"qcm","level":4,"topic":"LBO","tags":["Sources & Uses"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.lbo2-sources-uses","stem":{"fr":"Dans un tableau Sources & Uses, comment est déterminée l'equity du sponsor ?","en":"In a Sources & Uses table, how is sponsor equity determined?"},"multi":false,"options":[{"id":"a","text":{"fr":"Comme un % fixe de l'EV","en":"As a fixed % of EV"},"correct":false,"why":{"fr":"L'equity est le solde, pas un % imposé de l'EV.","en":"Equity is the balance, not a fixed % of EV."}},{"id":"b","text":{"fr":"Comme le plug : Total Emplois − Dette levée","en":"As the plug: Total Uses − Debt raised"},"correct":true,"why":{"fr":"On fixe la dette via le levier, l'equity équilibre le tableau.","en":"Debt is set via leverage, equity balances the table."}},{"id":"c","text":{"fr":"Comme égale à l'EBITDA d'entrée","en":"As equal to entry EBITDA"},"correct":false,"why":{"fr":"Aucun lien direct entre equity sponsor et EBITDA.","en":"No direct link between sponsor equity and EBITDA."}},{"id":"d","text":{"fr":"Comme la dette levée multipliée par le levier","en":"As debt raised times leverage"},"correct":false,"why":{"fr":"Cela n'a pas de sens dimensionnel ; l'equity est un solde.","en":"This is dimensionally meaningless; equity is a balancing figure."}}],"explanation":{"fr":"L'equity sponsor est la variable d'ajustement qui fait Total Emplois = Total Ressources une fois la dette dimensionnée.","en":"Sponsor equity is the plug making Total Uses = Total Sources once debt is sized."},"workings":null},{"id":"qcm.l4.lbo2.002","type":"qcm","level":4,"topic":"LBO","tags":["Sources & Uses","unitranche"],"difficulty":4,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l4.lbo2-sources-uses","stem":{"fr":"Equity value 250, frais 10, unitranche de 60 (levier 3,0x sur EBITDA 20). Quel chèque equity le sponsor décaisse-t-il ?","en":"Equity value 250, fees 10, unitranche of 60 (3.0x leverage on EBITDA 20). What equity cheque does the sponsor write?"},"multi":false,"options":[{"id":"a","text":{"fr":"190","en":"190"},"correct":false,"why":{"fr":"Cela oublie les frais dans les emplois.","en":"This omits fees from the uses."}},{"id":"b","text":{"fr":"200","en":"200"},"correct":true,"why":{"fr":"Emplois = 250 + 10 = 260 ; Equity = 260 − 60 = 200.","en":"Uses = 250 + 10 = 260; Equity = 260 − 60 = 200."}},{"id":"c","text":{"fr":"260","en":"260"},"correct":false,"why":{"fr":"260 est le total des emplois, pas l'equity (oublie la dette).","en":"260 is total uses, not equity (ignores the debt)."}},{"id":"d","text":{"fr":"310","en":"310"},"correct":false,"why":{"fr":"Cela ajouterait la dette au lieu de la déduire.","en":"This adds debt instead of deducting it."}}],"explanation":{"fr":"Total Emplois = equity value + frais = 260 ; on déduit l'unitranche de 60, l'equity sponsor est 200.","en":"Total Uses = equity value + fees = 260; subtract the 60 unitranche, sponsor equity is 200."},"workings":{"fr":"250 + 10 = 260 ; 260 − 60 = 200.","en":"250 + 10 = 260; 260 − 60 = 200."}},{"id":"qcm.l4.lbo2.003","type":"qcm","level":4,"topic":"LBO","tags":["Sources & Uses","TEV"],"difficulty":4,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l4.lbo2-sources-uses","stem":{"fr":"Variante WSO : EBITDA 75, multiple 7,5x, dette à 5,0x EBITDA. Quels sont le TEV et la dette levée ?","en":"WSO variant: EBITDA 75, multiple 7.5x, debt at 5.0x EBITDA. What are the TEV and debt raised?"},"multi":false,"options":[{"id":"a","text":{"fr":"TEV 562,5 et dette 375","en":"TEV 562.5 and debt 375"},"correct":true,"why":{"fr":"TEV = 7,5 × 75 = 562,5 ; dette = 5,0 × 75 = 375.","en":"TEV = 7.5 × 75 = 562.5; debt = 5.0 × 75 = 375."}},{"id":"b","text":{"fr":"TEV 525 et dette 375","en":"TEV 525 and debt 375"},"correct":false,"why":{"fr":"525 = 7,0 × 75, mauvais multiple d'entrée.","en":"525 = 7.0 × 75, wrong entry multiple."}},{"id":"c","text":{"fr":"TEV 562,5 et dette 187,5","en":"TEV 562.5 and debt 187.5"},"correct":false,"why":{"fr":"187,5 est l'equity avant frais, pas la dette.","en":"187.5 is equity before fees, not the debt."}},{"id":"d","text":{"fr":"TEV 375 et dette 562,5","en":"TEV 375 and debt 562.5"},"correct":false,"why":{"fr":"Les deux valeurs sont inversées.","en":"The two values are swapped."}}],"explanation":{"fr":"TEV = multiple × EBITDA = 562,5 ; dette = levier × EBITDA = 375 ; l'equity sponsor (avec frais) ressort à 202,5.","en":"TEV = multiple × EBITDA = 562.5; debt = leverage × EBITDA = 375; sponsor equity (with fees) comes to 202.5."},"workings":{"fr":"7,5 × 75 = 562,5 ; 5,0 × 75 = 375.","en":"7.5 × 75 = 562.5; 5.0 × 75 = 375."}},{"id":"qcm.l4.lbo2.004","type":"qcm","level":4,"topic":"LBO","tags":["Sources & Uses"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.lbo2-sources-uses","stem":{"fr":"Quels postes figurent du côté Emplois (Uses) d'un Sources & Uses ?","en":"Which items appear on the Uses side of a Sources & Uses?"},"multi":true,"options":[{"id":"a","text":{"fr":"L'equity value versée au vendeur","en":"The equity value paid to the seller"},"correct":true,"why":{"fr":"C'est le principal emploi de l'opération.","en":"It is the main use of the transaction."}},{"id":"b","text":{"fr":"Les frais de conseil et de financement","en":"Advisory and financing fees"},"correct":true,"why":{"fr":"Ils doivent être financés, donc figurent en emplois.","en":"They must be funded, so they sit in uses."}},{"id":"c","text":{"fr":"L'equity du sponsor","en":"The sponsor's equity"},"correct":false,"why":{"fr":"L'equity sponsor est une ressource (source), pas un emploi.","en":"Sponsor equity is a source, not a use."}},{"id":"d","text":{"fr":"Le refinancement de la dette existante","en":"Refinancing of existing debt"},"correct":true,"why":{"fr":"Rembourser la dette existante est un emploi de fonds.","en":"Repaying existing debt is a use of funds."}}],"explanation":{"fr":"Les emplois recensent ce qu'il faut payer (equity value, refinancement, frais) ; la dette et l'equity sponsor sont des ressources.","en":"Uses list what must be paid (equity value, refinancing, fees); debt and sponsor equity are sources."},"workings":null},{"id":"qcm.l4.lbo3.001","type":"qcm","level":4,"topic":"LevFin","tags":["senior debt","PIK","unitranche"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.lbo3-levfin","stem":{"fr":"Quel classement par coût croissant est correct ?","en":"Which ranking by increasing cost is correct?"},"multi":false,"options":[{"id":"a","text":{"fr":"PIK < mezzanine < unitranche < senior debt","en":"PIK < mezzanine < unitranche < senior debt"},"correct":false,"why":{"fr":"Classement complètement inversé.","en":"Completely reversed ranking."}},{"id":"b","text":{"fr":"Senior debt < unitranche < mezzanine < PIK","en":"Senior debt < unitranche < mezzanine < PIK"},"correct":true,"why":{"fr":"Le coût suit la séniorité inversée : senior le moins cher, PIK le plus cher.","en":"Cost follows inverted seniority: senior cheapest, PIK most expensive."}},{"id":"c","text":{"fr":"Unitranche < senior debt < PIK < mezzanine","en":"Unitranche < senior debt < PIK < mezzanine"},"correct":false,"why":{"fr":"L'unitranche est plus chère que la senior, et le PIK plus cher que la mezzanine.","en":"Unitranche is pricier than senior, and PIK pricier than mezzanine."}},{"id":"d","text":{"fr":"Senior debt < mezzanine < unitranche < PIK","en":"Senior debt < mezzanine < unitranche < PIK"},"correct":false,"why":{"fr":"L'unitranche se situe entre senior et mezzanine, pas au-dessus de la mezzanine.","en":"Unitranche sits between senior and mezzanine, not above mezzanine."}}],"explanation":{"fr":"La hiérarchie de coût reflète le risque : senior secured le moins cher, unitranche intermédiaire, puis mezzanine, et PIK le plus cher.","en":"The cost hierarchy reflects risk: senior secured cheapest, unitranche intermediate, then mezzanine, and PIK most expensive."},"workings":null},{"id":"qcm.l4.lbo3.002","type":"qcm","level":4,"topic":"LevFin","tags":["covenants"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.lbo3-levfin","stem":{"fr":"Qu'est-ce qui caractérise un covenant de maintenance ?","en":"What characterises a maintenance covenant?"},"multi":false,"options":[{"id":"a","text":{"fr":"Il n'est testé que lors d'une nouvelle action (dette, dividende)","en":"It is tested only on a new action (debt, dividend)"},"correct":false,"why":{"fr":"Cela décrit un covenant d'incurrence.","en":"That describes an incurrence covenant."}},{"id":"b","text":{"fr":"Il impose de respecter des ratios à chaque période de test","en":"It requires meeting ratios at each test date"},"correct":true,"why":{"fr":"Un dérapage périodique déclenche un défaut technique.","en":"A periodic breach triggers a technical default."}},{"id":"c","text":{"fr":"Il est absent par définition d'un financement classique","en":"It is by definition absent from a classic financing"},"correct":false,"why":{"fr":"Au contraire, c'est le cov-lite qui le supprime largement.","en":"On the contrary, cov-lite is what largely removes it."}},{"id":"d","text":{"fr":"Il ne concerne que la mezzanine","en":"It only concerns mezzanine"},"correct":false,"why":{"fr":"Les covenants maintenance portent typiquement sur la dette senior.","en":"Maintenance covenants typically apply to senior debt."}}],"explanation":{"fr":"Maintenance = test périodique strict ; incurrence = test sur action (plus souple). Les deals cov-lite n'ont quasi que de l'incurrence.","en":"Maintenance = strict periodic test; incurrence = test on action (looser). Cov-lite deals carry essentially only incurrence."},"workings":null},{"id":"qcm.l4.lbo3.003","type":"qcm","level":4,"topic":"LevFin","tags":["PIK"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.lbo3-levfin","stem":{"fr":"Quel est l'effet d'un intérêt [[PIK]] par rapport à un intérêt cash ?","en":"What is the effect of [[PIK]] interest versus cash interest?"},"multi":false,"options":[{"id":"a","text":{"fr":"Il est décaissé chaque période et réduit le FCF disponible","en":"It is disbursed each period and reduces available FCF"},"correct":false,"why":{"fr":"Cela décrit l'intérêt cash, pas le PIK.","en":"That describes cash interest, not PIK."}},{"id":"b","text":{"fr":"Il capitalise dans le principal, préservant le cash mais gonflant la dette","en":"It capitalises into principal, preserving cash but inflating the debt"},"correct":true,"why":{"fr":"Le PIK n'est pas payé en cash et s'ajoute au principal à rembourser.","en":"PIK is not paid in cash and adds to the principal to repay."}},{"id":"c","text":{"fr":"Il réduit le principal au fil du temps","en":"It reduces the principal over time"},"correct":false,"why":{"fr":"Au contraire, le PIK accroît le principal.","en":"On the contrary, PIK increases the principal."}},{"id":"d","text":{"fr":"Il est l'instrument le moins cher de la structure","en":"It is the cheapest instrument in the structure"},"correct":false,"why":{"fr":"Le PIK est l'instrument le plus cher car le plus subordonné.","en":"PIK is the most expensive instrument because the most subordinated."}}],"explanation":{"fr":"Le PIK préserve la trésorerie court terme mais accroît la dette finale, réduisant l'equity de sortie ; il est aussi le plus cher.","en":"PIK preserves short-term liquidity but increases the final debt, reducing exit equity; it is also the most expensive."},"workings":null},{"id":"qcm.l4.lbo3.004","type":"qcm","level":4,"topic":"LevFin","tags":["term loan B","revolver","mezzanine"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.lbo3-levfin","stem":{"fr":"Quels énoncés sur les tranches de dette LBO sont exacts ?","en":"Which statements about LBO debt tranches are correct?"},"multi":true,"options":[{"id":"a","text":{"fr":"Le revolver est une ligne renouvelable pour le BFR, souvent non tirée","en":"The revolver is a revolving line for working capital, often undrawn"},"correct":true,"why":{"fr":"Définition exacte du RCF.","en":"Exact definition of the RCF."}},{"id":"b","text":{"fr":"Le term loan B est une dette senior secured à taux variable","en":"The term loan B is senior secured debt at a floating rate"},"correct":true,"why":{"fr":"Le TLB est senior secured, remboursé in fine, à taux variable.","en":"The TLB is senior secured, bullet, floating rate."}},{"id":"c","text":{"fr":"La mezzanine est remboursée avant la dette senior en cas de défaut","en":"Mezzanine is repaid before senior debt in a default"},"correct":false,"why":{"fr":"La mezzanine est subordonnée : remboursée après la senior.","en":"Mezzanine is subordinated: repaid after senior."}},{"id":"d","text":{"fr":"L'unitranche fusionne senior et junior en une seule ligne","en":"Unitranche merges senior and junior into a single line"},"correct":true,"why":{"fr":"C'est la définition de l'unitranche, à coût intermédiaire.","en":"That is the definition of unitranche, at intermediate cost."}}],"explanation":{"fr":"Revolver et TLB sont senior secured ; la mezzanine est subordonnée (remboursée après la senior) ; l'unitranche fusionne les rangs.","en":"Revolver and TLB are senior secured; mezzanine is subordinated (repaid after senior); unitranche merges the ranks."},"workings":null},{"id":"qcm.l4.lbo3.005","type":"qcm","level":4,"topic":"LevFin","tags":["leverage"],"difficulty":3,"source":{"flag":"APPROXIMATE"},"moduleId":"mod.l4.lbo3-levfin","stem":{"fr":"Quel ordre de grandeur de levier total est représentatif du mid-cap français ?","en":"What total leverage order of magnitude is representative of French mid-cap?"},"multi":false,"options":[{"id":"a","text":{"fr":"Environ 1,0–2,0x EBITDA","en":"About 1.0–2.0x EBITDA"},"correct":false,"why":{"fr":"Trop faible pour un LBO sponsorisé mid-cap.","en":"Too low for a sponsored mid-cap LBO."}},{"id":"b","text":{"fr":"Environ 4,5–5,5x EBITDA","en":"About 4.5–5.5x EBITDA"},"correct":true,"why":{"fr":"Ordre de grandeur représentatif, variable selon le cycle de crédit.","en":"Representative order of magnitude, varying with the credit cycle."}},{"id":"c","text":{"fr":"Environ 9,0–10,0x EBITDA systématiquement","en":"About 9.0–10.0x EBITDA systematically"},"correct":false,"why":{"fr":"Niveau extrême réservé à des deals large-cap atypiques.","en":"Extreme level reserved for atypical large-cap deals."}},{"id":"d","text":{"fr":"Le levier ne s'exprime pas en multiple d'EBITDA","en":"Leverage is not expressed as an EBITDA multiple"},"correct":false,"why":{"fr":"Le levier est précisément Dette nette / EBITDA.","en":"Leverage is precisely Net debt / EBITDA."}}],"explanation":{"fr":"Le levier mid-cap FR tourne en ordre de grandeur autour de 4,5–5,5x EBITDA selon le cycle ; c'est une approximation, pas un chiffre fixe.","en":"French mid-cap leverage runs roughly around 4.5–5.5x EBITDA depending on the cycle; this is an approximation, not a fixed number."},"workings":null},{"id":"qcm.l4.lbo4-paydown.001","type":"qcm","level":4,"topic":"LBO","tags":["cash sweep"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.lbo4-paydown","stem":{"fr":"Qu'est-ce que le cash sweep oblige à faire ?","en":"What does the cash sweep require?"},"multi":false,"options":[{"id":"a","text":{"fr":"Verser l'excès de cash en dividende aux actionnaires","en":"Pay excess cash as a dividend to shareholders"},"correct":false,"why":{"fr":"C'est un dividend recap, pas un cash sweep.","en":"That is a dividend recap, not a cash sweep."}},{"id":"b","text":{"fr":"Affecter l'excès de cash au remboursement anticipé de la dette","en":"Apply excess cash to prepay debt early"},"correct":true,"why":{"fr":"Définition exacte : le cash sweep balaie l'excès de cash vers la dette.","en":"Exact definition: the cash sweep sweeps excess cash toward debt."}},{"id":"c","text":{"fr":"Augmenter le capex pour réinvestir le cash","en":"Increase capex to reinvest cash"},"correct":false,"why":{"fr":"Le cash sweep réduit la dette, il ne finance pas le capex.","en":"The cash sweep reduces debt, it does not fund capex."}},{"id":"d","text":{"fr":"Payer les intérêts de la dette senior","en":"Pay senior debt interest"},"correct":false,"why":{"fr":"Les intérêts sont une charge récurrente ; le sweep porte sur le principal.","en":"Interest is a recurring expense; the sweep targets principal."}}],"explanation":{"fr":"Le cash sweep est une clause de remboursement anticipé conditionnel : l'excès de cash au-delà de l'amortissement contractuel sert à rembourser le principal de la dette.","en":"The cash sweep is a conditional prepayment clause: excess cash beyond contractual amortization repays debt principal."},"workings":null},{"id":"qcm.l4.lbo4-paydown.002","type":"qcm","level":4,"topic":"LBO","tags":["net debt"],"difficulty":3,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l4.lbo4-paydown","stem":{"fr":"Bridgepoint a une dette brute de 60 M€ et un cash de 27,7 M€ à la sortie. Quelle est la dette nette ?","en":"Bridgepoint has gross debt of €60m and cash of €27.7m at exit. What is net debt?"},"multi":false,"options":[{"id":"a","text":{"fr":"87,7 M€","en":"€87.7m"},"correct":false,"why":{"fr":"On soustrait le cash, on ne l'ajoute pas.","en":"Cash is subtracted, not added."}},{"id":"b","text":{"fr":"32,3 M€","en":"€32.3m"},"correct":true,"why":{"fr":"60 − 27,7 = 32,3 M€.","en":"60 − 27.7 = €32.3m."}},{"id":"c","text":{"fr":"27,7 M€","en":"€27.7m"},"correct":false,"why":{"fr":"C'est le cash, pas la dette nette.","en":"That is the cash, not net debt."}},{"id":"d","text":{"fr":"60 M€","en":"€60m"},"correct":false,"why":{"fr":"C'est la dette brute, avant déduction du cash.","en":"That is gross debt, before cash deduction."}}],"explanation":{"fr":"Dette nette = dette brute − cash = 60 − 27,7 = 32,3 M€.","en":"Net debt = gross debt − cash = 60 − 27.7 = €32.3m."},"workings":{"fr":"60 − 27,7 = 32,3","en":"60 − 27.7 = 32.3"}},{"id":"qcm.l4.lbo5-returns.001","type":"qcm","level":4,"topic":"LBO","tags":["value creation"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.lbo5-returns","stem":{"fr":"Lequel n'est PAS un levier de création de valeur en LBO ?","en":"Which is NOT a value-creation lever in an LBO?"},"multi":false,"options":[{"id":"a","text":{"fr":"La croissance du chiffre d'affaires seule","en":"Revenue growth alone"},"correct":true,"why":{"fr":"Le CA seul ne crée pas de valeur ; c'est la croissance de l'EBITDA (CA × marge) qui compte.","en":"Revenue alone creates no value; it is EBITDA growth (revenue × margin) that matters."}},{"id":"b","text":{"fr":"La croissance de l'EBITDA","en":"EBITDA growth"},"correct":false,"why":{"fr":"C'est bien un levier.","en":"This is a genuine lever."}},{"id":"c","text":{"fr":"Le multiple expansion","en":"Multiple expansion"},"correct":false,"why":{"fr":"C'est un levier : revendre à un multiple supérieur.","en":"It is a lever: selling at a higher multiple."}},{"id":"d","text":{"fr":"Le désendettement","en":"Deleveraging"},"correct":false,"why":{"fr":"C'est un levier : rembourser la dette par le FCF.","en":"It is a lever: repaying debt with FCF."}}],"explanation":{"fr":"Les trois leviers sont EBITDA, multiple expansion et désendettement. La croissance du CA n'est un levier que si elle se traduit en EBITDA additionnel.","en":"The three levers are EBITDA, multiple expansion and deleveraging. Revenue growth is a lever only if it converts into additional EBITDA."},"workings":null},{"id":"qcm.l4.lbo5-returns.002","type":"qcm","level":4,"topic":"LBO","tags":["IRR"],"difficulty":4,"source":{"flag":"APPROXIMATE"},"moduleId":"mod.l4.lbo5-returns","stem":{"fr":"Quelle règle de pouce relie MoM et IRR ?","en":"Which rule of thumb links MoM and IRR?"},"multi":false,"options":[{"id":"a","text":{"fr":"3x sur 3 ans ≈ 45% d'IRR","en":"3x over 3 years ≈ 45% IRR"},"correct":true,"why":{"fr":"3^(1/3) − 1 ≈ 44%, arrondi à 45%.","en":"3^(1/3) − 1 ≈ 44%, rounded to 45%."}},{"id":"b","text":{"fr":"3x sur 3 ans ≈ 100% d'IRR","en":"3x over 3 years ≈ 100% IRR"},"correct":false,"why":{"fr":"100% impliquerait 8x sur 3 ans.","en":"100% would imply 8x over 3 years."}},{"id":"c","text":{"fr":"2x sur 3 ans ≈ 67% d'IRR","en":"2x over 3 years ≈ 67% IRR"},"correct":false,"why":{"fr":"2x sur 3 ans ≈ 25%, pas 67%.","en":"2x over 3 years ≈ 25%, not 67%."}},{"id":"d","text":{"fr":"2x sur 3 ans ≈ 10% d'IRR","en":"2x over 3 years ≈ 10% IRR"},"correct":false,"why":{"fr":"2^(1/3) − 1 ≈ 26%, pas 10%.","en":"2^(1/3) − 1 ≈ 26%, not 10%."}}],"explanation":{"fr":"IRR = MoM^(1/n) − 1 : 3x sur 3 ans donne ≈ 45%, 2x sur 3 ans donne ≈ 25%.","en":"IRR = MoM^(1/n) − 1: 3x over 3 years gives ≈ 45%, 2x over 3 years gives ≈ 25%."},"workings":{"fr":"3^(1/3) − 1 ≈ 0,442","en":"3^(1/3) − 1 ≈ 0.442"}},{"id":"qcm.l4.lbo5-returns.003","type":"qcm","level":4,"topic":"LBO","tags":["MoM","correction"],"difficulty":4,"source":{"flag":"VERIFIED","ref":"dataroom LBO Paper Bridgepoint — corrigé"},"moduleId":"mod.l4.lbo5-returns","stem":{"fr":"La dataroom Bridgepoint annonce un MoM de sortie de 2,1x. EV sortie 415, dette brute 60, cash 27,7, equity injectée 200. Quel est le MoM correct ?","en":"The Bridgepoint dataroom reports an exit MoM of 2.1x. Exit EV 415, gross debt 60, cash 27.7, equity injected 200. What is the correct MoM?"},"multi":false,"options":[{"id":"a","text":{"fr":"2,1x","en":"2.1x"},"correct":false,"why":{"fr":"C'est le chiffre erroné de la source : il prend l'EV sans déduire la dette nette de sortie.","en":"That is the source's wrong figure: it takes EV without deducting exit net debt."}},{"id":"b","text":{"fr":"≈ 1,9x","en":"≈ 1.9x"},"correct":true,"why":{"fr":"Equity sortie = 415 − (60 − 27,7) = 382,7 ; 382,7 / 200 ≈ 1,9x.","en":"Exit equity = 415 − (60 − 27.7) = 382.7; 382.7 / 200 ≈ 1.9x."}},{"id":"c","text":{"fr":"2,08x","en":"2.08x"},"correct":false,"why":{"fr":"415 / 200 oublie de déduire la dette nette — c'est l'erreur de méthode.","en":"415 / 200 forgets to deduct net debt — that is the method error."}},{"id":"d","text":{"fr":"1,6x","en":"1.6x"},"correct":false,"why":{"fr":"Cela déduirait la dette brute entière sans rajouter le cash.","en":"That would deduct full gross debt without adding back cash."}}],"explanation":{"fr":"L'erreur de la dataroom est d'oublier de déduire la dette nette à la sortie. Equity sortie = EV sortie − dette nette = 415 − 32,3 = 382,7 ; MoM = 382,7 / 200 ≈ 1,9x.","en":"The dataroom's error is forgetting to deduct exit net debt. Exit equity = exit EV − net debt = 415 − 32.3 = 382.7; MoM = 382.7 / 200 ≈ 1.9x."},"workings":{"fr":"382,7 / 200 = 1,9135","en":"382.7 / 200 = 1.9135"},"correction":{"kind":"error","needsReview":false,"note":{"fr":"corrigé : la source indiquait 2,1x en oubliant la dette nette à la sortie ; la valeur exacte est ≈ 1,9x.","en":"corrected: the source reported 2.1x by omitting exit net debt; the exact value is ≈ 1.9x."}}},{"id":"qcm.l4.lbo5-returns.004","type":"qcm","level":4,"topic":"LBO","tags":["MOIC","IRR"],"difficulty":5,"source":{"flag":"VERIFIED","ref":"WSO LBO returns"},"moduleId":"mod.l4.lbo5-returns","stem":{"fr":"Sortie à 7,0x sur un EBITDA de 111,9 → TEV 783,6, dette nette 194,5. Quels sont le MOIC et l'IRR (chiffres vérifiés) ?","en":"Exit at 7.0x on EBITDA of 111.9 → TEV 783.6, net debt 194.5. What are the MOIC and IRR (verified figures)?"},"multi":true,"options":[{"id":"a","text":{"fr":"TEV de sortie = 783,6","en":"Exit TEV = 783.6"},"correct":true,"why":{"fr":"7,0 × 111,9 = 783,6.","en":"7.0 × 111.9 = 783.6."}},{"id":"b","text":{"fr":"MOIC ≈ 2,569x","en":"MOIC ≈ 2.569x"},"correct":true,"why":{"fr":"Equity sortie = 783,6 − 194,5 = 589,1, rapportée à l'equity d'entrée donne ≈ 2,569x.","en":"Exit equity = 783.6 − 194.5 = 589.1, against entry equity gives ≈ 2.569x."}},{"id":"c","text":{"fr":"IRR ≈ 20,8%","en":"IRR ≈ 20.8%"},"correct":true,"why":{"fr":"C'est l'IRR vérifié correspondant à ce MOIC sur l'horizon de détention.","en":"This is the verified IRR matching this MOIC over the holding horizon."}},{"id":"d","text":{"fr":"MOIC ≈ 7,0x","en":"MOIC ≈ 7.0x"},"correct":false,"why":{"fr":"7,0x est le multiple de sortie sur l'EBITDA, pas le multiple sur la mise.","en":"7.0x is the exit EBITDA multiple, not the multiple on invested capital."}}],"explanation":{"fr":"TEV = 7,0 × 111,9 = 783,6 ; equity de sortie = 783,6 − 194,5 = 589,1. Avec ces chiffres vérifiés (WSO), le MOIC ressort à ≈ 2,569x et l'IRR à ≈ 20,8%. Le multiple de sortie (7,0x) ne doit pas être confondu avec le MOIC.","en":"TEV = 7.0 × 111.9 = 783.6; exit equity = 783.6 − 194.5 = 589.1. With these verified figures (WSO), MOIC is ≈ 2.569x and IRR ≈ 20.8%. The exit multiple (7.0x) must not be confused with the MOIC."},"workings":{"fr":"7,0 × 111,9 = 783,6 ; 783,6 − 194,5 = 589,1 ; MOIC ≈ 2,569x ; IRR ≈ 20,8%","en":"7.0 × 111.9 = 783.6; 783.6 − 194.5 = 589.1; MOIC ≈ 2.569x; IRR ≈ 20.8%"}},{"id":"qcm.l4.lbo5-returns.005","type":"qcm","level":4,"topic":"LBO","tags":["exit"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.lbo5-returns","stem":{"fr":"Quel acheteur est généralement prêt à payer le prix le plus élevé à la sortie d'un LBO ?","en":"Which buyer is generally willing to pay the highest price at an LBO exit?"},"multi":false,"options":[{"id":"a","text":{"fr":"Un acheteur stratégique du secteur","en":"A strategic buyer in the sector"},"correct":true,"why":{"fr":"Il peut payer les synergies que les acheteurs financiers ne valorisent pas.","en":"It can pay for synergies that financial buyers do not value."}},{"id":"b","text":{"fr":"Un autre fonds de private equity (secondary buyout)","en":"Another PE fund (secondary buyout)"},"correct":false,"why":{"fr":"Un fonds vise un rendement et ne paie pas les synergies industrielles.","en":"A fund targets a return and does not pay for industrial synergies."}},{"id":"c","text":{"fr":"Le marché via une IPO","en":"The public market via an IPO"},"correct":false,"why":{"fr":"L'IPO valorise sur des comparables de marché, souvent avec une décote.","en":"An IPO values on market comparables, often at a discount."}},{"id":"d","text":{"fr":"Le management seul","en":"Management alone"},"correct":false,"why":{"fr":"Le management a rarement les fonds pour payer le prix plein.","en":"Management rarely has the funds to pay full price."}}],"explanation":{"fr":"L'acheteur stratégique paie le plus car il intègre les synergies (coûts, revenus croisés) dans son prix, contrairement à un acheteur financier.","en":"The strategic buyer pays most because it factors synergies (costs, cross-revenues) into its price, unlike a financial buyer."},"workings":null},{"id":"qcm.l4.ma1.001","type":"qcm","level":4,"topic":"M&A","tags":["process"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.ma1-process","stem":{"fr":"Dans un process de cession structuré, quel est l'ordre correct des documents ?","en":"In a structured sale process, what is the correct order of documents?"},"multi":false,"options":[{"id":"a","text":{"fr":"IM → teaser → NDA → NBO","en":"IM → teaser → NDA → NBO"},"correct":false,"why":{"fr":"Le teaser précède toujours l'IM, et le NDA s'intercale entre les deux.","en":"The teaser always precedes the IM, and the NDA comes in between."}},{"id":"b","text":{"fr":"Teaser → NDA → IM → NBO → due diligence → binding offer → SPA","en":"Teaser → NDA → IM → NBO → due diligence → binding offer → SPA"},"correct":true,"why":{"fr":"C'est le séquencement standard d'une cession.","en":"This is the standard sequencing of a sale."}},{"id":"c","text":{"fr":"NDA → teaser → NBO → IM → SPA","en":"NDA → teaser → NBO → IM → SPA"},"correct":false,"why":{"fr":"Le teaser est diffusé avant tout NDA et l'IM précède le NBO.","en":"The teaser is sent before any NDA and the IM precedes the NBO."}},{"id":"d","text":{"fr":"Teaser → IM → NDA → SPA → due diligence","en":"Teaser → IM → NDA → SPA → due diligence"},"correct":false,"why":{"fr":"L'IM n'est remis qu'après le NDA, et la due diligence précède le SPA.","en":"The IM is given only after the NDA, and due diligence precedes the SPA."}}],"explanation":{"fr":"Le banquier suscite l'intérêt avec un teaser anonyme, fait signer le NDA, remet l'IM, recueille les NBO, ouvre la dataroom (due diligence), reçoit les binding offers, puis on signe le SPA.","en":"The banker sparks interest with an anonymous teaser, has the NDA signed, hands over the IM, collects NBOs, opens the dataroom (due diligence), receives binding offers, then the SPA is signed."},"workings":null},{"id":"qcm.l4.ma1.002","type":"qcm","level":4,"topic":"M&A","tags":["NBO"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.ma1-process","stem":{"fr":"Le NBO est-il engageant pour l'acquéreur ?","en":"Is the NBO binding on the buyer?"},"multi":false,"options":[{"id":"a","text":{"fr":"Non, seule la binding offer après due diligence engage l'acquéreur","en":"No, only the binding offer after due diligence commits the buyer"},"correct":true,"why":{"fr":"Le NBO (non-binding offer) est indicatif ; l'engagement vient avec la binding offer.","en":"The NBO (non-binding offer) is indicative; commitment comes with the binding offer."}},{"id":"b","text":{"fr":"Oui, dès le dépôt du NBO l'acquéreur est lié","en":"Yes, the buyer is bound as soon as the NBO is submitted"},"correct":false,"why":{"fr":"Par définition, le NBO est non engageant.","en":"By definition, the NBO is non-binding."}},{"id":"c","text":{"fr":"Oui, mais seulement après le NDA","en":"Yes, but only after the NDA"},"correct":false,"why":{"fr":"Le NDA porte sur la confidentialité, pas sur l'engagement de prix.","en":"The NDA concerns confidentiality, not a price commitment."}},{"id":"d","text":{"fr":"Non, et la binding offer ne l'est pas non plus","en":"No, and the binding offer is not binding either"},"correct":false,"why":{"fr":"La binding offer, elle, engage bien l'acquéreur.","en":"The binding offer does commit the buyer."}}],"explanation":{"fr":"Le NBO sert à présélectionner les acquéreurs sans les lier ; l'engagement ferme intervient après la due diligence.","en":"The NBO is used to shortlist buyers without binding them; firm commitment comes after due diligence."},"workings":null},{"id":"qcm.l4.ma1.003","type":"qcm","level":4,"topic":"M&A","tags":["auction"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.ma1-process","stem":{"fr":"Quels sont les avantages d'une vente aux enchères par rapport au gré à gré ? (plusieurs réponses)","en":"What are the advantages of an auction over a bilateral deal? (multiple answers)"},"multi":true,"options":[{"id":"a","text":{"fr":"Tension concurrentielle qui soutient le prix","en":"Competitive tension that supports the price"},"correct":true,"why":{"fr":"Mettre plusieurs acheteurs en concurrence fait monter le prix.","en":"Putting several buyers in competition pushes the price up."}},{"id":"b","text":{"fr":"Découverte d'un prix de marché plus élevé","en":"Discovery of a higher market price"},"correct":true,"why":{"fr":"La mise en concurrence révèle la valeur maximale que le marché est prêt à payer.","en":"Competition reveals the maximum value the market will pay."}},{"id":"c","text":{"fr":"Plus grande confidentialité","en":"Greater confidentiality"},"correct":false,"why":{"fr":"Au contraire : plus d'acheteurs impliqués augmente le risque de fuites.","en":"On the contrary: more buyers involved increases leak risk."}},{"id":"d","text":{"fr":"Process plus rapide","en":"A faster process"},"correct":false,"why":{"fr":"Les enchères sont généralement plus longues et plus formelles.","en":"Auctions are generally longer and more formal."}}],"explanation":{"fr":"Les enchères maximisent le prix par la concurrence ; le gré à gré offre en échange discrétion et rapidité.","en":"Auctions maximise price through competition; bilateral deals offer discretion and speed in return."},"workings":null},{"id":"qcm.l4.ma1.004","type":"qcm","level":4,"topic":"M&A","tags":["fees"],"difficulty":3,"source":{"flag":"APPROXIMATE"},"moduleId":"mod.l4.ma1-process","stem":{"fr":"Sur une cession de 200 M€, quels frais conseil M&A à 1–2 % ?","en":"On a €200m sale, what M&A advisory fees at 1–2%?"},"multi":false,"options":[{"id":"a","text":{"fr":"0,2 à 0,4 M€","en":"€0.2m to €0.4m"},"correct":false,"why":{"fr":"Cela correspondrait à 0,1–0,2 %, pas 1–2 %.","en":"That would be 0.1–0.2%, not 1–2%."}},{"id":"b","text":{"fr":"2 à 4 M€","en":"€2m to €4m"},"correct":true,"why":{"fr":"1 % de 200 = 2 ; 2 % de 200 = 4.","en":"1% of 200 = 2; 2% of 200 = 4."}},{"id":"c","text":{"fr":"20 à 40 M€","en":"€20m to €40m"},"correct":false,"why":{"fr":"Cela correspondrait à 10–20 %, bien trop élevé.","en":"That would be 10–20%, far too high."}},{"id":"d","text":{"fr":"0,02 à 0,04 M€","en":"€0.02m to €0.04m"},"correct":false,"why":{"fr":"Erreur d'un facteur 100.","en":"Off by a factor of 100."}}],"explanation":{"fr":"Les frais M&A se situent typiquement entre 1 et 2 % de la valeur de transaction, soit 2 à 4 M€ ici.","en":"M&A fees typically run 1 to 2% of transaction value, i.e. €2m to €4m here."},"workings":{"fr":"200 × 1 % = 2 ; 200 × 2 % = 4.","en":"200 × 1% = 2; 200 × 2% = 4."}},{"id":"qcm.l4.ma2.001","type":"qcm","level":4,"topic":"M&A","tags":["accretion/dilution","EPS"],"difficulty":5,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l4.ma2-accretion","stem":{"fr":"Acquéreur : RN 100, 10 actions (BPA 10). Deal en actions : RN cible 60, 10 actions émises. Le deal est-il relutif ?","en":"Acquirer: NI 100, 10 shares (EPS 10). Stock deal: target NI 60, 10 shares issued. Is the deal accretive?"},"multi":false,"options":[{"id":"a","text":{"fr":"Relutif, car la cible a un P/E plus bas","en":"Accretive, because the target has a lower P/E"},"correct":false,"why":{"fr":"En paiement actions, le ratio d'échange domine l'écart de P/E.","en":"In a stock deal, the exchange ratio dominates the P/E gap."}},{"id":"b","text":{"fr":"Dilutif : BPA pro forma = 160/20 = 8 < 10","en":"Dilutive: pro forma EPS = 160/20 = 8 < 10"},"correct":true,"why":{"fr":"Le RN pro forma 160 divisé par 20 actions donne 8, en baisse de 10 à 8.","en":"Pro forma NI 160 divided by 20 shares gives 8, down from 10 to 8."}},{"id":"c","text":{"fr":"Neutre, le BPA reste à 10","en":"Neutral, EPS stays at 10"},"correct":false,"why":{"fr":"Le BPA tombe à 8 ; il n'est pas neutre.","en":"EPS falls to 8; it is not neutral."}},{"id":"d","text":{"fr":"Relutif : BPA pro forma = 12","en":"Accretive: pro forma EPS = 12"},"correct":false,"why":{"fr":"12 n'est pas obtenu par 160/20 ; le calcul donne 8.","en":"12 is not 160/20; the calculation gives 8."}}],"explanation":{"fr":"Malgré une cible apparemment « moins chère », l'émission de 10 actions pour 60 de bénéfice fait chuter le BPA de 10 à 8 : le deal est dilutif. Le ratio d'échange domine.","en":"Despite an apparently 'cheaper' target, issuing 10 shares for 60 of earnings drops EPS from 10 to 8: the deal is dilutive. The exchange ratio dominates."},"workings":{"fr":"BPA pro forma = (100+60)/(10+10) = 160/20 = 8 ; 8 < 10 → dilutif de 20 %.","en":"Pro forma EPS = (100+60)/(10+10) = 160/20 = 8; 8 < 10 → 20% dilutive."}},{"id":"qcm.l4.ma2.002","type":"qcm","level":4,"topic":"M&A","tags":["accretion/dilution"],"difficulty":5,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.ma2-accretion","stem":{"fr":"Pour un deal financé en cash/dette, la cible est relutive si…","en":"For a cash/debt-funded deal, the target is accretive if…"},"multi":false,"options":[{"id":"a","text":{"fr":"le rendement de la cible (1/P/E) dépasse le coût après impôt du financement","en":"the target's yield (1/P/E) exceeds the after-tax cost of financing"},"correct":true,"why":{"fr":"C'est exactement la condition de relution en financement cash/dette.","en":"This is precisely the accretion condition for cash/debt financing."}},{"id":"b","text":{"fr":"le rendement de la cible dépasse le coût AVANT impôt de la dette","en":"the target's yield exceeds the before-tax cost of debt"},"correct":false,"why":{"fr":"La comparaison se fait sur le coût APRÈS impôt, la dette étant déductible.","en":"The comparison uses the AFTER-tax cost, as debt is tax-deductible."}},{"id":"c","text":{"fr":"le P/E de la cible dépasse celui de l'acquéreur","en":"the target's P/E exceeds the acquirer's"},"correct":false,"why":{"fr":"Un P/E cible plus élevé (rendement plus faible) tend à être dilutif.","en":"A higher target P/E (lower yield) tends to be dilutive."}},{"id":"d","text":{"fr":"la cible verse un dividende supérieur","en":"the target pays a higher dividend"},"correct":false,"why":{"fr":"Le dividende n'est pas le critère ; c'est le rendement bénéficiaire vs le coût du financement.","en":"The dividend is not the criterion; it is earnings yield vs financing cost."}}],"explanation":{"fr":"En cash/dette, on compare le rendement bénéficiaire de la cible au coût net d'impôt du financement. La déductibilité de la dette abaisse ce coût.","en":"In cash/debt, you compare the target's earnings yield to the after-tax cost of financing. Debt deductibility lowers that cost."},"workings":null},{"id":"qcm.l4.ma2.003","type":"qcm","level":4,"topic":"M&A","tags":["OPA"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.ma2-accretion","stem":{"fr":"Quel seuil de détention déclenche une OPA obligatoire en France ?","en":"Which ownership threshold triggers a mandatory tender offer in France?"},"multi":false,"options":[{"id":"a","text":{"fr":"30 % du capital ou des droits de vote","en":"30% of capital or voting rights"},"correct":true,"why":{"fr":"C'est le seuil réglementaire français de déclenchement de l'OPA obligatoire.","en":"This is the French regulatory threshold triggering the mandatory tender offer."}},{"id":"b","text":{"fr":"50 % du capital","en":"50% of capital"},"correct":false,"why":{"fr":"La majorité simple est un seuil de contrôle mais pas celui de l'OPA obligatoire.","en":"Simple majority is a control threshold but not the mandatory-offer one."}},{"id":"c","text":{"fr":"10 % du capital","en":"10% of capital"},"correct":false,"why":{"fr":"10 % est un seuil de déclaration, pas de déclenchement d'OPA.","en":"10% is a disclosure threshold, not an offer trigger."}},{"id":"d","text":{"fr":"66,7 % des droits de vote","en":"66.7% of voting rights"},"correct":false,"why":{"fr":"Les deux tiers relèvent de la majorité qualifiée en assemblée, pas de l'OPA.","en":"Two-thirds relates to qualified majority in a general meeting, not the offer."}}],"explanation":{"fr":"En France, franchir 30 % du capital ou des droits de vote oblige à déposer une OPA sur le reste des titres pour protéger les minoritaires.","en":"In France, crossing 30% of capital or voting rights forces a tender offer for the remaining shares to protect minority holders."},"workings":null},{"id":"qcm.l4.ma2.004","type":"qcm","level":4,"topic":"M&A","tags":["synergies"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.ma2-accretion","stem":{"fr":"Quelles affirmations sur les synergies sont correctes ? (plusieurs réponses)","en":"Which statements about synergies are correct? (multiple answers)"},"multi":true,"options":[{"id":"a","text":{"fr":"Les synergies de coûts sont généralement plus crédibles que celles de revenus","en":"Cost synergies are generally more credible than revenue synergies"},"correct":true,"why":{"fr":"Les économies de coûts sont plus contrôlables et rapides à réaliser.","en":"Cost savings are more controllable and faster to achieve."}},{"id":"b","text":{"fr":"On modélise les synergies nettes des coûts de réalisation","en":"Synergies are modelled net of the costs to achieve them"},"correct":true,"why":{"fr":"Les coûts d'intégration et de restructuration doivent être déduits.","en":"Integration and restructuring costs must be deducted."}},{"id":"c","text":{"fr":"Les synergies de revenus sont les plus certaines","en":"Revenue synergies are the most certain"},"correct":false,"why":{"fr":"Elles sont au contraire les plus incertaines et les plus escomptées.","en":"On the contrary, they are the most uncertain and most discounted."}},{"id":"d","text":{"fr":"Les synergies n'ont aucun impact sur l'analyse accretion/dilution","en":"Synergies have no impact on accretion/dilution analysis"},"correct":false,"why":{"fr":"Les synergies améliorent le résultat pro forma et donc le BPA.","en":"Synergies improve pro forma earnings and hence EPS."}}],"explanation":{"fr":"Les synergies de coûts sont privilégiées en crédibilité, doivent être nettes des coûts d'intégration, et influent sur le BPA pro forma.","en":"Cost synergies are favoured in credibility, must be net of integration costs, and affect pro forma EPS."},"workings":null},{"id":"qcm.l4.pf.001","type":"qcm","level":4,"topic":"ProjectFinance","tags":["DSCR"],"difficulty":4,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l4.project-finance","stem":{"fr":"CFADS = 100, service de la dette = 50. Quel est le DSCR ?","en":"CFADS = 100, debt service = 50. What is the DSCR?"},"multi":false,"options":[{"id":"a","text":{"fr":"2,0x","en":"2.0x"},"correct":true,"why":{"fr":"DSCR = CFADS / service de la dette = 100/50 = 2,0x.","en":"DSCR = CFADS / debt service = 100/50 = 2.0x."}},{"id":"b","text":{"fr":"0,5x","en":"0.5x"},"correct":false,"why":{"fr":"C'est l'inverse ; le ratio se calcule CFADS au numérateur.","en":"That is the inverse; the ratio puts CFADS in the numerator."}},{"id":"c","text":{"fr":"50x","en":"50x"},"correct":false,"why":{"fr":"C'est la différence absolue, pas le ratio.","en":"That is the absolute difference, not the ratio."}},{"id":"d","text":{"fr":"1,0x","en":"1.0x"},"correct":false,"why":{"fr":"1,0x supposerait CFADS = service de la dette, ce qui n'est pas le cas.","en":"1.0x would assume CFADS = debt service, which is not the case."}}],"explanation":{"fr":"Le DSCR de 2,0x indique que le cash disponible couvre deux fois le service de la dette, bien au-dessus du minimum bancaire d'environ 1,0x.","en":"A DSCR of 2.0x means available cash covers debt service twice over, well above the ~1.0x bank minimum."},"workings":{"fr":"100 / 50 = 2,0x.","en":"100 / 50 = 2.0x."}},{"id":"qcm.l4.pf.002","type":"qcm","level":4,"topic":"ProjectFinance","tags":["ICR"],"difficulty":4,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l4.project-finance","stem":{"fr":"EBIT = 150, intérêts = 50. Quel est l'ICR, et diffère-t-il du DSCR ?","en":"EBIT = 150, interest = 50. What is the ICR, and does it differ from the DSCR?"},"multi":false,"options":[{"id":"a","text":{"fr":"ICR = 3,0x, et il est distinct du DSCR (qui inclut le principal)","en":"ICR = 3.0x, and it is distinct from the DSCR (which includes principal)"},"correct":true,"why":{"fr":"ICR = EBIT/intérêts = 150/50 = 3,0x ; le DSCR couvre en plus le principal.","en":"ICR = EBIT/interest = 150/50 = 3.0x; DSCR additionally covers principal."}},{"id":"b","text":{"fr":"ICR = 3,0x, identique au DSCR","en":"ICR = 3.0x, identical to the DSCR"},"correct":false,"why":{"fr":"Le DSCR inclut le remboursement du principal, donc diffère de l'ICR.","en":"The DSCR includes principal repayment, so it differs from the ICR."}},{"id":"c","text":{"fr":"ICR = 0,33x","en":"ICR = 0.33x"},"correct":false,"why":{"fr":"C'est l'inverse du bon calcul.","en":"That is the inverse of the correct calculation."}},{"id":"d","text":{"fr":"ICR = 2,0x","en":"ICR = 2.0x"},"correct":false,"why":{"fr":"150/50 = 3,0x, pas 2,0x.","en":"150/50 = 3.0x, not 2.0x."}}],"explanation":{"fr":"L'ICR ne couvre que les intérêts (EBIT/intérêts) tandis que le DSCR couvre intérêts + principal (CFADS/service de la dette). Ce sont des ratios distincts qu'il ne faut pas confondre.","en":"ICR covers interest only (EBIT/interest) while DSCR covers interest + principal (CFADS/debt service). They are distinct ratios that must not be confused."},"workings":{"fr":"150 / 50 = 3,0x.","en":"150 / 50 = 3.0x."}},{"id":"qcm.l4.pf.003","type":"qcm","level":4,"topic":"ProjectFinance","tags":["LLCR","PLCR"],"difficulty":5,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.project-finance","stem":{"fr":"Quelle est la différence entre LLCR et PLCR ?","en":"What is the difference between LLCR and PLCR?"},"multi":false,"options":[{"id":"a","text":{"fr":"LLCR = VAN du CFADS sur la durée du prêt ; PLCR = sur la durée du projet, donc PLCR ≥ LLCR","en":"LLCR = NPV of CFADS over loan life; PLCR = over project life, so PLCR ≥ LLCR"},"correct":true,"why":{"fr":"Le PLCR inclut le tail (cash-flows après remboursement), d'où PLCR ≥ LLCR.","en":"The PLCR includes the tail (post-repayment cash flows), hence PLCR ≥ LLCR."}},{"id":"b","text":{"fr":"Ce sont deux noms pour le même ratio","en":"They are two names for the same ratio"},"correct":false,"why":{"fr":"Ils diffèrent par la période de cash-flows retenue.","en":"They differ in the cash-flow horizon used."}},{"id":"c","text":{"fr":"LLCR mesure les intérêts, PLCR le principal","en":"LLCR measures interest, PLCR principal"},"correct":false,"why":{"fr":"Les deux portent sur la VAN du CFADS, pas sur intérêts vs principal.","en":"Both relate to the NPV of CFADS, not interest vs principal."}},{"id":"d","text":{"fr":"LLCR est toujours supérieur au PLCR","en":"LLCR is always greater than PLCR"},"correct":false,"why":{"fr":"C'est l'inverse : le PLCR, incluant le tail, est ≥ LLCR.","en":"It is the reverse: the PLCR, including the tail, is ≥ LLCR."}}],"explanation":{"fr":"Le LLCR actualise le CFADS sur la durée du prêt, le PLCR sur la durée plus longue du projet. Le tail rend le PLCR ≥ LLCR, une marge de sécurité pour les prêteurs.","en":"LLCR discounts CFADS over the loan life, PLCR over the longer project life. The tail makes PLCR ≥ LLCR, a safety margin for lenders."},"workings":null},{"id":"qcm.l4.pf.004","type":"qcm","level":4,"topic":"ProjectFinance","tags":["non-recourse"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.project-finance","stem":{"fr":"Que signifie le caractère non-recourse de la dette de projet ? (plusieurs réponses)","en":"What does the non-recourse nature of project debt mean? (multiple answers)"},"multi":true,"options":[{"id":"a","text":{"fr":"Les prêteurs se remboursent sur les cash-flows et actifs du projet","en":"Lenders are repaid from the project's cash flows and assets"},"correct":true,"why":{"fr":"C'est le principe même de la dette non-recourse.","en":"This is the very principle of non-recourse debt."}},{"id":"b","text":{"fr":"Aucun recours sur le bilan des sponsors","en":"No recourse to the sponsors' balance sheets"},"correct":true,"why":{"fr":"Les sponsors ne garantissent pas la dette sur leur propre bilan.","en":"Sponsors do not guarantee the debt on their own balance sheets."}},{"id":"c","text":{"fr":"Les prêteurs n'exigent aucun ratio de couverture","en":"Lenders require no coverage ratios"},"correct":false,"why":{"fr":"Au contraire, l'absence de recours impose des ratios stricts (DSCR, LLCR) et un DSRA.","en":"On the contrary, the lack of recourse imposes strict ratios (DSCR, LLCR) and a DSRA."}},{"id":"d","text":{"fr":"La dette est garantie par l'État dans tous les cas","en":"The debt is always state-guaranteed"},"correct":false,"why":{"fr":"Une garantie d'État n'a rien d'automatique ; ce n'est pas la définition du non-recourse.","en":"A state guarantee is not automatic; that is not the definition of non-recourse."}}],"explanation":{"fr":"La dette non-recourse n'a de gage que le projet lui-même, ce qui justifie des ratios de couverture exigeants et la constitution d'un DSRA.","en":"Non-recourse debt is secured only on the project itself, which justifies demanding coverage ratios and a DSRA."},"workings":null},{"id":"qcm.l4.ts.001","type":"qcm","level":4,"topic":"Accounting","tags":["AirNeo"],"difficulty":4,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l4.three-statement-model","stem":{"fr":"Cas AirNeo : avion 50 M€ amorti en linéaire sur 25 ans. Dotation annuelle ?","en":"AirNeo case: €50m aircraft, straight-line over 25 years. Annual depreciation?"},"multi":false,"options":[{"id":"a","text":{"fr":"2 M€/an","en":"€2m/yr"},"correct":true,"why":{"fr":"50 / 25 = 2 M€ par an.","en":"50 / 25 = €2m per year."}},{"id":"b","text":{"fr":"5 M€/an","en":"€5m/yr"},"correct":false,"why":{"fr":"5 correspondrait à 10 ans, pas 25.","en":"5 would be over 10 years, not 25."}},{"id":"c","text":{"fr":"4,5 M€/an","en":"€4.5m/yr"},"correct":false,"why":{"fr":"C'est le remboursement annuel du principal de la dette, pas l'amortissement.","en":"That is the annual debt principal repayment, not depreciation."}},{"id":"d","text":{"fr":"1,25 M€/an","en":"€1.25m/yr"},"correct":false,"why":{"fr":"1,25 correspond aux dettes fournisseurs corrigées, pas à l'amortissement.","en":"1.25 is the corrected accounts payable, not depreciation."}}],"explanation":{"fr":"L'amortissement économique de 2 M€/an (50/25) ne doit pas être confondu avec le remboursement de principal de 4,5 M€/an sur 10 ans.","en":"The €2m/yr economic depreciation (50/25) must not be confused with the €4.5m/yr principal repayment over 10 years."},"workings":{"fr":"50 / 25 = 2.","en":"50 / 25 = 2."}},{"id":"qcm.l4.ts.002","type":"qcm","level":4,"topic":"Accounting","tags":["correction"],"difficulty":5,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l4.three-statement-model","stem":{"fr":"Quels symptômes trahissaient le fichier AirNeo cassé (CA figé à 0) ? (plusieurs réponses)","en":"Which symptoms revealed the broken AirNeo file (revenue frozen at 0)? (multiple answers)"},"multi":true,"options":[{"id":"a","text":{"fr":"DSCR et ICR rendus identiques à tort","en":"DSCR and ICR wrongly made identical"},"correct":true,"why":{"fr":"Avec un CA nul, les numérateurs s'effondraient de la même manière.","en":"With zero revenue, the numerators collapsed in the same way."}},{"id":"b","text":{"fr":"Trésorerie de −70","en":"Cash of −70"},"correct":true,"why":{"fr":"L'absence de revenus creusait la trésorerie jusqu'à −70.","en":"Missing revenue drove cash down to −70."}},{"id":"c","text":{"fr":"Marges absurdes","en":"Absurd margins"},"correct":true,"why":{"fr":"Des charges sans revenus produisent des marges négatives absurdes.","en":"Costs with no revenue produce absurd negative margins."}},{"id":"d","text":{"fr":"Un résultat net stable et positif","en":"A stable, positive net income"},"correct":false,"why":{"fr":"Au contraire, le résultat net était dégradé par l'absence de revenus.","en":"On the contrary, net income was wrecked by the missing revenue."}}],"explanation":{"fr":"Un CA figé à 0 propage des absurdités : marges négatives, DSCR = ICR, dettes fournisseurs gonflées (5 au lieu de 1,25) et trésorerie de −70. Le sanity-check des marges et ratios révèle l'erreur.","en":"Revenue frozen at 0 propagates absurdities: negative margins, DSCR = ICR, inflated payables (5 instead of 1.25) and cash of −70. A sanity check of margins and ratios reveals the error."},"workings":null},{"id":"qcm.l4.ts.003","type":"qcm","level":4,"topic":"Accounting","tags":["AirNeo"],"difficulty":5,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l4.three-statement-model","stem":{"fr":"Cas AirNeo, année 1 (mini-version correcte) : revenus 15, opex 7, amortissement 2, intérêts 1,80, IS 25 %. Résultat net ?","en":"AirNeo case, year 1 (correct mini-version): revenue 15, opex 7, depreciation 2, interest 1.80, tax 25%. Net income?"},"multi":false,"options":[{"id":"a","text":{"fr":"3,15 M€","en":"€3.15m"},"correct":true,"why":{"fr":"EBIT 6 − intérêts 1,80 = 4,20 ; IS 1,05 ; RN = 3,15.","en":"EBIT 6 − interest 1.80 = 4.20; tax 1.05; NI = 3.15."}},{"id":"b","text":{"fr":"4,20 M€","en":"€4.20m"},"correct":false,"why":{"fr":"C'est le résultat avant impôt, pas le résultat net.","en":"That is pre-tax income, not net income."}},{"id":"c","text":{"fr":"6,00 M€","en":"€6.00m"},"correct":false,"why":{"fr":"C'est l'EBIT, avant intérêts et impôt.","en":"That is EBIT, before interest and tax."}},{"id":"d","text":{"fr":"1,05 M€","en":"€1.05m"},"correct":false,"why":{"fr":"C'est le montant de l'IS, pas le résultat net.","en":"That is the tax amount, not net income."}}],"explanation":{"fr":"EBIT = 15 − 7 − 2 = 6 ; RAI = 6 − 1,80 = 4,20 ; IS = 25 % × 4,20 = 1,05 ; résultat net = 4,20 − 1,05 = 3,15 M€.","en":"EBIT = 15 − 7 − 2 = 6; pre-tax = 6 − 1.80 = 4.20; tax = 25% × 4.20 = 1.05; net income = 4.20 − 1.05 = €3.15m."},"workings":{"fr":"6 − 1,80 = 4,20 ; 4,20 × (1 − 0,25) = 3,15.","en":"6 − 1.80 = 4.20; 4.20 × (1 − 0.25) = 3.15."}},{"id":"qcm.l4.ts.004","type":"qcm","level":4,"topic":"Accounting","tags":["cash-flow"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.three-statement-model","stem":{"fr":"Dans un modèle 3 états, pourquoi réintègre-t-on l'amortissement au flux d'exploitation ?","en":"In a three-statement model, why is depreciation added back to operating cash flow?"},"multi":false,"options":[{"id":"a","text":{"fr":"Parce que c'est une charge non décaissée qui a réduit le résultat net sans sortie de cash","en":"Because it is a non-cash charge that reduced net income without a cash outflow"},"correct":true,"why":{"fr":"On part du résultat net et on rajoute les charges non décaissées.","en":"You start from net income and add back non-cash charges."}},{"id":"b","text":{"fr":"Parce que l'amortissement est un encaissement","en":"Because depreciation is a cash inflow"},"correct":false,"why":{"fr":"L'amortissement n'est pas un encaissement, c'est une charge comptable.","en":"Depreciation is not a cash inflow; it is an accounting charge."}},{"id":"c","text":{"fr":"Parce qu'il faut le déduire deux fois","en":"Because it must be deducted twice"},"correct":false,"why":{"fr":"On ne le déduit pas deux fois ; on annule son effet non-cash.","en":"It is not deducted twice; its non-cash effect is reversed."}},{"id":"d","text":{"fr":"Parce qu'il augmente la dette","en":"Because it increases debt"},"correct":false,"why":{"fr":"L'amortissement n'a pas d'effet direct sur la dette.","en":"Depreciation has no direct effect on debt."}}],"explanation":{"fr":"Le tableau de flux part du résultat net ; comme l'amortissement a réduit ce résultat sans décaissement, on le rajoute pour retrouver le cash d'exploitation réel.","en":"The cash flow statement starts from net income; since depreciation reduced it without a cash outflow, it is added back to recover real operating cash."},"workings":null},{"id":"qcm.l4.ts.005","type":"qcm","level":4,"topic":"Accounting","tags":["AirNeo","debt"],"difficulty":4,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l4.three-statement-model","stem":{"fr":"Cas AirNeo : dette 45 M€ à 4 %. Intérêts de l'année 1 ?","en":"AirNeo case: debt €45m at 4%. Year-1 interest?"},"multi":false,"options":[{"id":"a","text":{"fr":"1,80 M€","en":"€1.80m"},"correct":true,"why":{"fr":"45 × 4 % = 1,80 sur l'encours initial.","en":"45 × 4% = 1.80 on the opening balance."}},{"id":"b","text":{"fr":"4,50 M€","en":"€4.50m"},"correct":false,"why":{"fr":"4,5 est le remboursement annuel du principal, pas les intérêts.","en":"4.5 is the annual principal repayment, not interest."}},{"id":"c","text":{"fr":"2,00 M€","en":"€2.00m"},"correct":false,"why":{"fr":"2 est la dotation aux amortissements de l'avion.","en":"2 is the aircraft's depreciation charge."}},{"id":"d","text":{"fr":"1,62 M€","en":"€1.62m"},"correct":false,"why":{"fr":"1,62 correspond aux intérêts de l'année 2 (encours 40,5).","en":"1.62 is year-2 interest (balance 40.5)."}}],"explanation":{"fr":"Les intérêts de l'année 1 portent sur l'encours initial de 45 M€ : 45 × 4 % = 1,80 M€. L'année 2, l'encours tombe à 40,5 et les intérêts à 1,62.","en":"Year-1 interest is on the €45m opening balance: 45 × 4% = €1.80m. In year 2, the balance falls to 40.5 and interest to 1.62."},"workings":{"fr":"45 × 0,04 = 1,80.","en":"45 × 0.04 = 1.80."}}],"exercises":[{"id":"xl.pnl-retraite","type":"exercise","level":1,"topic":"Excel","tags":["income-statement","EBITDA"],"difficulty":2,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l1.income-statement","kind":"spreadsheet","prompt":{"fr":"Reconstituez le compte de résultat. Remplissez l'EBITDA, l'EBIT, le résultat avant impôt, l'impôt et le résultat net à partir du CA, des COGS, des OpEx, des D&A, des intérêts et du taux d'impôt.","en":"Rebuild the income statement. Fill in EBITDA, EBIT, pre-tax income, tax and net income from revenue, COGS, OpEx, D&A, interest and the tax rate."},"grid":{"rows":11,"cols":2,"cells":{"A1":{"role":"label","label":"Chiffre d'affaires"},"B1":{"role":"input","value":500,"numFmt":"#,##0"},"A2":{"role":"label","label":"COGS"},"B2":{"role":"input","value":300,"numFmt":"#,##0"},"A3":{"role":"label","label":"OpEx"},"B3":{"role":"input","value":100,"numFmt":"#,##0"},"A4":{"role":"label","label":"D&A"},"B4":{"role":"input","value":40,"numFmt":"#,##0"},"A5":{"role":"label","label":"Intérêts"},"B5":{"role":"input","value":20,"numFmt":"#,##0"},"A6":{"role":"label","label":"Taux d'impôt"},"B6":{"role":"input","value":0.25,"numFmt":"0%"},"A7":{"role":"label","label":"EBITDA"},"B7":{"role":"formula","formula":"=B1-B2-B3","numFmt":"#,##0"},"A8":{"role":"label","label":"EBIT"},"B8":{"role":"formula","formula":"=B7-B4","numFmt":"#,##0"},"A9":{"role":"label","label":"Résultat avant impôt"},"B9":{"role":"formula","formula":"=B8-B5","numFmt":"#,##0"},"A10":{"role":"label","label":"Impôt"},"B10":{"role":"formula","formula":"=B9*B6","numFmt":"#,##0"},"A11":{"role":"label","label":"Résultat net"},"B11":{"role":"formula","formula":"=B9-B10","numFmt":"#,##0"}}},"checks":[{"cell":"B7","expected":100,"tolerance":0,"hint":{"fr":"EBITDA = CA − COGS − OpEx","en":"EBITDA = revenue − COGS − OpEx"}},{"cell":"B8","expected":60,"tolerance":0,"hint":{"fr":"EBIT = EBITDA − D&A","en":"EBIT = EBITDA − D&A"}},{"cell":"B9","expected":40,"tolerance":0,"hint":{"fr":"RAI = EBIT − intérêts","en":"Pre-tax = EBIT − interest"}},{"cell":"B10","expected":10,"tolerance":0,"hint":{"fr":"Impôt = RAI × taux","en":"Tax = pre-tax × rate"}},{"cell":"B11","expected":30,"tolerance":0,"hint":{"fr":"Résultat net = RAI − impôt","en":"Net income = pre-tax − tax"}}],"solution":{"fr":"EBITDA = 500 − 300 − 100 = 100. EBIT = 100 − 40 = 60. Résultat avant impôt = 60 − 20 = 40. Impôt = 40 × 25% = 10. Résultat net = 40 − 10 = 30. On part du CA, on retire les charges d'exploitation cash pour l'EBITDA, puis le non-cash (D&A) pour l'EBIT, puis le financier (intérêts), enfin l'impôt.","en":"EBITDA = 500 − 300 − 100 = 100. EBIT = 100 − 40 = 60. Pre-tax income = 60 − 20 = 40. Tax = 40 × 25% = 10. Net income = 40 − 10 = 30. Start from revenue, strip cash operating costs for EBITDA, then non-cash (D&A) for EBIT, then financing (interest), finally tax."}},{"id":"xl.wacc","type":"exercise","level":3,"topic":"Excel","tags":["WACC","CAPM"],"difficulty":3,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l3.wacc","kind":"spreadsheet","prompt":{"fr":"Calculez le coût des fonds propres via le CAPM (Re = Rf + β·ERP), puis le WACC = E/V·Re + D/V·Rd·(1−T). Remplissez les cellules de formule.","en":"Compute the cost of equity via CAPM (Re = Rf + β·ERP), then WACC = E/V·Re + D/V·Rd·(1−T). Fill in the formula cells."},"grid":{"rows":10,"cols":2,"cells":{"A1":{"role":"label","label":"Rf (taux sans risque)"},"B1":{"role":"input","value":0.03,"numFmt":"0.0%"},"A2":{"role":"label","label":"ERP (prime de risque)"},"B2":{"role":"input","value":0.055,"numFmt":"0.0%"},"A3":{"role":"label","label":"Beta (β)"},"B3":{"role":"input","value":1.2,"numFmt":"0.00"},"A4":{"role":"label","label":"Rd (coût de la dette)"},"B4":{"role":"input","value":0.05,"numFmt":"0.0%"},"A5":{"role":"label","label":"E (fonds propres)"},"B5":{"role":"input","value":600,"numFmt":"#,##0"},"A6":{"role":"label","label":"D (dette)"},"B6":{"role":"input","value":400,"numFmt":"#,##0"},"A7":{"role":"label","label":"T (taux d'impôt)"},"B7":{"role":"input","value":0.25,"numFmt":"0%"},"A8":{"role":"label","label":"Re (CAPM)"},"B8":{"role":"formula","formula":"=B1+B3*B2","numFmt":"0.00%"},"A9":{"role":"label","label":"V (E + D)"},"B9":{"role":"formula","formula":"=B5+B6","numFmt":"#,##0"},"A10":{"role":"label","label":"WACC"},"B10":{"role":"formula","formula":"=B5/B9*B8+B6/B9*B4*(1-B7)","numFmt":"0.00%"}}},"checks":[{"cell":"B8","expected":0.096,"tolerance":0.0005,"hint":{"fr":"Re = Rf + β·ERP = 3% + 1,2·5,5%","en":"Re = Rf + β·ERP = 3% + 1.2·5.5%"}},{"cell":"B9","expected":1000,"tolerance":0,"hint":{"fr":"V = E + D","en":"V = E + D"}},{"cell":"B10","expected":0.0726,"tolerance":0.0005,"hint":{"fr":"WACC = E/V·Re + D/V·Rd·(1−T)","en":"WACC = E/V·Re + D/V·Rd·(1−T)"}}],"solution":{"fr":"Re = 3% + 1,2 × 5,5% = 9,6%. V = 600 + 400 = 1000, donc E/V = 60% et D/V = 40%. WACC = 0,60 × 9,6% + 0,40 × 5% × (1 − 0,25) = 5,76% + 1,50% = 7,26%. L'avantage fiscal de la dette (1−T) abaisse son coût effectif à 3,75%.","en":"Re = 3% + 1.2 × 5.5% = 9.6%. V = 600 + 400 = 1000, so E/V = 60% and D/V = 40%. WACC = 0.60 × 9.6% + 0.40 × 5% × (1 − 0.25) = 5.76% + 1.50% = 7.26%. The debt tax shield (1−T) lowers its effective cost to 3.75%."}},{"id":"xl.lbo-sensitivity","type":"exercise","level":4,"topic":"Excel","tags":["LBO","sensitivity","MoM"],"difficulty":4,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l4.lbo5-returns","kind":"spreadsheet","prompt":{"fr":"Faites varier le multiple de sortie et l'EBITDA de sortie. Pour chaque combinaison, calculez l'EV de sortie, l'equity de sortie (EV − dette de sortie) et le MoM (equity sortie / equity entrée).","en":"Vary the exit multiple and exit EBITDA. For each combination compute exit EV, exit equity (EV − exit debt) and MoM (exit equity / entry equity)."},"grid":{"rows":9,"cols":3,"cells":{"A1":{"role":"label","label":"Equity entrée"},"B1":{"role":"input","value":150,"numFmt":"#,##0"},"A2":{"role":"label","label":"Dette de sortie"},"B2":{"role":"input","value":200,"numFmt":"#,##0"},"A3":{"role":"label","label":"Cas A : EBITDA sortie"},"B3":{"role":"input","value":60,"numFmt":"#,##0"},"C3":{"role":"label","label":"Multiple A"},"A4":{"role":"label","label":"Multiple sortie A"},"B4":{"role":"input","value":9,"numFmt":"0.0x"},"A5":{"role":"label","label":"Cas B : EBITDA sortie"},"B5":{"role":"input","value":70,"numFmt":"#,##0"},"A6":{"role":"label","label":"Multiple sortie B"},"B6":{"role":"input","value":10,"numFmt":"0.0x"},"A7":{"role":"label","label":"EV sortie A / equity A / MoM A"},"B7":{"role":"formula","formula":"=B3*B4","numFmt":"#,##0"},"C7":{"role":"formula","formula":"=B7-B2","numFmt":"#,##0"},"A8":{"role":"label","label":"MoM A"},"B8":{"role":"formula","formula":"=C7/B1","numFmt":"0.00x"},"A9":{"role":"label","label":"MoM B (EV B − dette)/entrée"},"B9":{"role":"formula","formula":"=(B5*B6-B2)/B1","numFmt":"0.00x"}}},"checks":[{"cell":"B7","expected":540,"tolerance":0,"hint":{"fr":"EV sortie A = EBITDA × multiple = 60 × 9","en":"Exit EV A = EBITDA × multiple = 60 × 9"}},{"cell":"C7","expected":340,"tolerance":0,"hint":{"fr":"Equity sortie A = EV − dette de sortie = 540 − 200","en":"Exit equity A = EV − exit debt = 540 − 200"}},{"cell":"B8","expected":2.2667,"tolerance":0.01,"hint":{"fr":"MoM A = equity sortie / equity entrée = 340 / 150","en":"MoM A = exit equity / entry equity = 340 / 150"}},{"cell":"B9","expected":3.3333,"tolerance":0.01,"hint":{"fr":"MoM B = (70×10 − 200)/150 = 500/150","en":"MoM B = (70×10 − 200)/150 = 500/150"}}],"solution":{"fr":"Cas A : EV = 60 × 9 = 540 ; equity = 540 − 200 = 340 ; MoM = 340/150 = 2,27x. Cas B : EV = 70 × 10 = 700 ; equity = 700 − 200 = 500 ; MoM = 500/150 = 3,33x. Le MoM est très sensible au multiple ET à l'EBITDA de sortie : ici +1 tour de multiple et +10 d'EBITDA font passer le MoM de 2,3x à 3,3x. C'est pourquoi on présente toujours une table de sensibilité au comité.","en":"Case A: EV = 60 × 9 = 540; equity = 540 − 200 = 340; MoM = 340/150 = 2.27x. Case B: EV = 70 × 10 = 700; equity = 700 − 200 = 500; MoM = 500/150 = 3.33x. MoM is highly sensitive to BOTH the exit multiple and exit EBITDA: here +1 turn of multiple and +10 of EBITDA move MoM from 2.3x to 3.3x. That is why you always show a sensitivity table to the committee."}},{"id":"xl.paydown","type":"exercise","level":4,"topic":"Excel","tags":["LBO","debt-paydown","cash-sweep"],"difficulty":3,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l4.lbo4-paydown","kind":"spreadsheet","prompt":{"fr":"Construisez la table d'amortissement de la dette sur 4 ans : dette de clôture = dette d'ouverture − FCF (cash sweep). La clôture d'une année devient l'ouverture de la suivante.","en":"Build the 4-year debt amortisation table: closing debt = opening debt − FCF (cash sweep). One year's closing becomes the next year's opening."},"grid":{"rows":6,"cols":5,"cells":{"A1":{"role":"label","label":"Ligne / Année"},"B1":{"role":"label","label":"An 1"},"C1":{"role":"label","label":"An 2"},"D1":{"role":"label","label":"An 3"},"E1":{"role":"label","label":"An 4"},"A2":{"role":"label","label":"Dette ouverture"},"B2":{"role":"input","value":300,"numFmt":"#,##0"},"C2":{"role":"formula","formula":"=B4","numFmt":"#,##0"},"D2":{"role":"formula","formula":"=C4","numFmt":"#,##0"},"E2":{"role":"formula","formula":"=D4","numFmt":"#,##0"},"A3":{"role":"label","label":"FCF (cash sweep)"},"B3":{"role":"input","value":50,"numFmt":"#,##0"},"C3":{"role":"input","value":50,"numFmt":"#,##0"},"D3":{"role":"input","value":50,"numFmt":"#,##0"},"E3":{"role":"input","value":50,"numFmt":"#,##0"},"A4":{"role":"label","label":"Dette clôture"},"B4":{"role":"formula","formula":"=B2-B3","numFmt":"#,##0"},"C4":{"role":"formula","formula":"=C2-C3","numFmt":"#,##0"},"D4":{"role":"formula","formula":"=D2-D3","numFmt":"#,##0"},"E4":{"role":"formula","formula":"=E2-E3","numFmt":"#,##0"},"A5":{"role":"label","label":"Dette remboursée cumulée"},"B5":{"role":"formula","formula":"=B2-E4","numFmt":"#,##0"}}},"checks":[{"cell":"B4","expected":250,"tolerance":0,"hint":{"fr":"Clôture An 1 = 300 − 50","en":"Closing Y1 = 300 − 50"}},{"cell":"C4","expected":200,"tolerance":0,"hint":{"fr":"Ouverture An 2 = clôture An 1 = 250, puis − 50","en":"Opening Y2 = closing Y1 = 250, then − 50"}},{"cell":"D4","expected":150,"tolerance":0,"hint":{"fr":"250 − 50 − 50 = 150","en":"250 − 50 − 50 = 150"}},{"cell":"E4","expected":100,"tolerance":0,"hint":{"fr":"Dette de clôture finale","en":"Final closing debt"}},{"cell":"B5","expected":200,"tolerance":0,"hint":{"fr":"Remboursé cumulé = ouverture initiale − clôture finale = 300 − 100","en":"Cumulative repaid = initial opening − final closing = 300 − 100"}}],"solution":{"fr":"Chaque année, la dette de clôture = ouverture − FCF, et la clôture devient l'ouverture suivante. An 1 : 300 − 50 = 250. An 2 : 250 − 50 = 200. An 3 : 200 − 50 = 150. An 4 : 150 − 50 = 100. La dette passe de 300 à 100, soit 200 remboursés en 4 ans grâce au cash sweep. Ce désendettement est le moteur de création de valeur d'un LBO à côté de la croissance de l'EBITDA et de l'expansion de multiple.","en":"Each year, closing debt = opening − FCF, and closing becomes next year's opening. Y1: 300 − 50 = 250. Y2: 250 − 50 = 200. Y3: 200 − 50 = 150. Y4: 150 − 50 = 100. Debt falls from 300 to 100, i.e. 200 repaid over 4 years via the cash sweep. This deleveraging is the value-creation engine of an LBO alongside EBITDA growth and multiple expansion."}},{"id":"xl.mom-irr","type":"exercise","level":4,"topic":"Excel","tags":["LBO","MoM","IRR"],"difficulty":4,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l4.lbo5-returns","kind":"spreadsheet","prompt":{"fr":"Calculez le MoM (equity de sortie / equity d'entrée) et l'IRR sur 5 ans. Pour l'IRR, utilisez la série de flux equity en colonne A : −100 en entrée, puis 0, et +250 à la sortie.","en":"Compute MoM (exit equity / entry equity) and the 5-year IRR. For IRR, use the equity cashflow series in column A: −100 at entry, then 0s, and +250 at exit."},"grid":{"rows":9,"cols":3,"cells":{"A1":{"role":"label","label":"Flux equity An 0"},"B1":{"role":"label","label":"Equity entrée"},"C1":{"role":"input","value":100,"numFmt":"#,##0"},"A2":{"role":"input","value":-100,"numFmt":"#,##0"},"A3":{"role":"input","value":0,"numFmt":"#,##0"},"A4":{"role":"input","value":0,"numFmt":"#,##0"},"A5":{"role":"input","value":0,"numFmt":"#,##0"},"A6":{"role":"input","value":0,"numFmt":"#,##0"},"A7":{"role":"input","value":250,"numFmt":"#,##0"},"B8":{"role":"label","label":"MoM"},"C8":{"role":"formula","formula":"=A7/C1","numFmt":"0.00x"},"B9":{"role":"label","label":"IRR"},"C9":{"role":"formula","formula":"=IRR(A2:A7)","numFmt":"0.0%"}}},"checks":[{"cell":"C8","expected":2.5,"tolerance":0.01,"hint":{"fr":"MoM = equity sortie / entrée = 250 / 100","en":"MoM = exit equity / entry = 250 / 100"}},{"cell":"C9","expected":0.2011,"tolerance":0.005,"hint":{"fr":"IRR de −100 puis +250 à 5 ans = 2,5^(1/5) − 1 ≈ 20,1%","en":"IRR of −100 then +250 at 5 years = 2.5^(1/5) − 1 ≈ 20.1%"}}],"solution":{"fr":"MoM = 250 / 100 = 2,5x. L'IRR sur la série −100 ; 0 ; 0 ; 0 ; 0 ; +250 (entrée An 0, sortie An 5) vaut 2,5^(1/5) − 1 = 20,1%. Vérification : pour un aller-retour unique, IRR = MoM^(1/n) − 1. Un MoM de 2,5x sur 5 ans donne donc bien ≈ 20% d'IRR — un repère utile en entretien.","en":"MoM = 250 / 100 = 2.5x. The IRR over the series −100; 0; 0; 0; 0; +250 (entry Y0, exit Y5) is 2.5^(1/5) − 1 = 20.1%. Check: for a single in/out, IRR = MoM^(1/n) − 1. A 2.5x MoM over 5 years therefore gives ≈ 20% IRR — a handy interview benchmark."}},{"id":"xl.npv-projet","type":"exercise","level":4,"topic":"Excel","tags":["ProjectFinance","NPV","IRR","solar"],"difficulty":4,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l4.project-finance","kind":"spreadsheet","prompt":{"fr":"Projet solaire « Empire of the sun » : 20 MW × 1750 MWh = 35 000 MWh = 35 m kWh × 0,10 €/kWh = 3,5 m€ de revenus ; − 0,5 m€ de maintenance → EBITDA 3 m€. Capex 20 m€ en An 0, puis +3 m€ de FCF par an pendant 20 ans. Calculez la VAN à 8% et l'IRR du projet à partir de la série de flux en colonne A.","en":"Solar project 'Empire of the sun': 20 MW × 1750 MWh = 35,000 MWh = 35m kWh × €0.10/kWh = €3.5m revenue; − €0.5m maintenance → EBITDA €3m. Capex €20m at Y0, then +€3m FCF per year for 20 years. Compute the NPV at 8% and the project IRR from the cashflow series in column A."},"grid":{"rows":12,"cols":3,"cells":{"A1":{"role":"label","label":"Flux (m€)"},"B1":{"role":"label","label":"Revenus"},"C1":{"role":"input","value":3.5,"numFmt":"0.0"},"A2":{"role":"input","value":-20,"numFmt":"#,##0"},"B2":{"role":"label","label":"Maintenance"},"C2":{"role":"input","value":-0.5,"numFmt":"0.0"},"A3":{"role":"input","value":3,"numFmt":"0.0"},"B3":{"role":"label","label":"EBITDA / FCF annuel"},"C3":{"role":"formula","formula":"=C1+C2","numFmt":"0.0"},"A4":{"role":"input","value":3,"numFmt":"0.0"},"B4":{"role":"label","label":"Taux d'actualisation"},"C4":{"role":"input","value":0.08,"numFmt":"0%"},"A5":{"role":"input","value":3,"numFmt":"0.0"},"B5":{"role":"label","label":"VAN à 8%"},"C5":{"role":"formula","formula":"=NPV(C4,A3:A22)+A2","numFmt":"0.0"},"A6":{"role":"input","value":3,"numFmt":"0.0"},"B6":{"role":"label","label":"IRR projet"},"C6":{"role":"formula","formula":"=IRR(A2:A22)","numFmt":"0.0%"},"A7":{"role":"input","value":3,"numFmt":"0.0"},"A8":{"role":"input","value":3,"numFmt":"0.0"},"A9":{"role":"input","value":3,"numFmt":"0.0"},"A10":{"role":"input","value":3,"numFmt":"0.0"},"A11":{"role":"input","value":3,"numFmt":"0.0"},"A12":{"role":"input","value":3,"numFmt":"0.0"},"A13":{"role":"input","value":3,"numFmt":"0.0"},"A14":{"role":"input","value":3,"numFmt":"0.0"},"A15":{"role":"input","value":3,"numFmt":"0.0"},"A16":{"role":"input","value":3,"numFmt":"0.0"},"A17":{"role":"input","value":3,"numFmt":"0.0"},"A18":{"role":"input","value":3,"numFmt":"0.0"},"A19":{"role":"input","value":3,"numFmt":"0.0"},"A20":{"role":"input","value":3,"numFmt":"0.0"},"A21":{"role":"input","value":3,"numFmt":"0.0"},"A22":{"role":"input","value":3,"numFmt":"0.0"}}},"checks":[{"cell":"C3","expected":3,"tolerance":0,"hint":{"fr":"EBITDA = revenus 3,5 − maintenance 0,5","en":"EBITDA = revenue 3.5 − maintenance 0.5"}},{"cell":"C5","expected":9.454,"tolerance":0.1,"hint":{"fr":"VAN = NPV(8% ; flux An 1–20) + flux An 0 (capex)","en":"NPV = NPV(8%; flows Y1–20) + Y0 flow (capex)"}},{"cell":"C6","expected":0.1389,"tolerance":0.005,"hint":{"fr":"IRR sur la série −20 puis +3 ×20 ≈ 14%","en":"IRR over the series −20 then +3 ×20 ≈ 14%"}}],"solution":{"fr":"Revenus = 35 m kWh × 0,10 € = 3,5 m€. EBITDA = 3,5 − 0,5 = 3 m€ de FCF annuel. Série de flux : −20 en An 0, puis +3 de An 1 à An 20. La VAN à 8% : NPV(8% ; An 1–20) actualise les vingt flux de +3 (≈ 29,45 m€) auquel on ajoute le capex de −20 en An 0 → VAN ≈ +9,5 m€. L'IRR du projet (taux qui annule la VAN) ≈ 13,9%, soit environ 14%. Le projet crée de la valeur car son IRR (14%) dépasse le coût du capital (8%).","en":"Revenue = 35m kWh × €0.10 = €3.5m. EBITDA = 3.5 − 0.5 = €3m annual FCF. Cashflow series: −20 at Y0, then +3 from Y1 to Y20. NPV at 8%: NPV(8%; Y1–20) discounts the twenty +3 flows (≈ €29.45m) plus the −20 capex at Y0 → NPV ≈ +€9.5m. The project IRR (the rate that zeroes NPV) ≈ 13.9%, about 14%. The project creates value because its IRR (14%) exceeds the cost of capital (8%)."}}],"cases":[{"id":"case.distressed","type":"caseStudy","level":5,"topic":"Restructuring","tags":["Restructuring","distressed","waterfall","covenants"],"difficulty":5,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"title":{"fr":"Société surendettée : diagnostic, options et waterfall","en":"Over-leveraged company: diagnosis, options and waterfall"},"dealType":"distressed","realDeal":false,"scenario":{"fr":"Meridia Industries, ETI industrielle française (CA 240 M€, EBITDA 30 M€), a fait un LBO au pic du marché. Le ralentissement a comprimé l'EBITDA et la société porte une dette nette de 165 M€ (levier 5,5x) avec un covenant de levier à 4,5x désormais brisé et un mur de dette (bullet senior) dans 12 mois. Le sponsor mandate un conseil débiteur ; un fonds special situations a accumulé de la dette unsecured sur le secondaire. Tous les chiffres sont pédagogiques.","en":"Meridia Industries, a French mid-market industrial (revenue €240m, EBITDA €30m), did an LBO at the market peak. The slowdown compressed EBITDA and the company carries net debt of €165m (5.5x leverage) with a leverage covenant at 4.5x now breach
