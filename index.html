","en":"Forgetting that assets = liabilities always holds: if it does not, there is a modelling error."},{"fr":"Confondre capitaux propres et trésorerie : les capitaux propres ne sont pas du cash disponible, c'est une source de financement.","en":"Confusing equity with cash: equity is not available cash, it is a financing source."},{"fr":"Croire que le goodwill s'amortit en IFRS : il est testé pour dépréciation, pas amorti linéairement.","en":"Believing goodwill is amortized under IFRS: it is impairment-tested, not amortized on a straight line."},{"fr":"Compter les dettes fournisseurs dans la dette financière : elles font partie du BFR, pas de la dette nette.","en":"Counting payables as financial debt: they are part of working capital, not of net debt."}],"synthese":{"fr":"• Actif = Passif (dettes + capitaux propres), toujours.\n• BFR ≈ stocks + créances − fournisseurs ; il consomme du cash quand le CA croît.\n• Un BFR négatif peut être très sain (retail, abonnement) : le client paie avant le fournisseur.\n• Capitaux propres = capital + réserves ; ce qui reste aux actionnaires.\n• Goodwill = surprix d'acquisition ; testé pour dépréciation en IFRS.","en":"• Assets = Liabilities (debt + equity), always.\n• Working capital ≈ inventory + receivables − payables; it consumes cash as revenue grows.\n• Negative working capital can be very healthy (retail, subscription): customers pay before suppliers.\n• Equity = capital + reserves; what is left for shareholders.\n• Goodwill = acquisition premium; impairment-tested under IFRS."}},"glossaryRefs":[]},{"id":"mod.l1.cash-flow","type":"module","level":1,"topic":"Accounting","tags":["flux","cash flow","D&A","BFR"],"difficulty":1,"source":{"flag":"VERIFIED","ref":"BIWS Accounting + Vernimmen"},"title":{"fr":"Le tableau de flux","en":"The cash flow statement"},"objective":{"fr":"Comprendre les trois sections du tableau de flux et l'impact du D&A et de la variation de BFR sur la trésorerie.","en":"Understand the three sections of the cash flow statement and the impact of D&A and working-capital changes on cash."},"estMinutes":13,"prerequisites":["mod.l1.income-statement","mod.l1.balance-sheet"],"content":{"contexte":{"fr":"Le tableau de flux réconcilie le résultat comptable avec le cash réellement encaissé. C'est l'état préféré des prêteurs et des investisseurs PE, car « le cash ne ment pas ». La question piège classique : « pourquoi rajoute-t-on le D&A au résultat net ? ».","en":"The cash flow statement reconciles accounting profit with cash actually collected. It is the favourite statement of lenders and PE investors, because \"cash does not lie\". The classic trick question: \"why do we add D&A back to net income?\"."},"concepts":[{"heading":{"fr":"Les trois sections","en":"The three sections"},"body":{"fr":"Le tableau de flux ([[cash flow statement]]) se découpe en trois : les flux d'exploitation ([[operating cash flow]], cash généré par l'activité courante), les flux d'investissement (achats/cessions d'actifs, le [[capex]]), et les flux de financement (émission/remboursement de dette, augmentations de capital, dividendes). La somme des trois donne la variation de trésorerie sur la période.","en":"The [[cash flow statement]] splits into three: operating cash flow (cash from day-to-day activity), investing cash flow (asset purchases/sales, [[capex]]), and financing cash flow (debt issuance/repayment, equity raises, dividends). The sum of the three gives the change in cash over the period."}},{"heading":{"fr":"Le D&A est non-cash","en":"D&A is non-cash"},"body":{"fr":"Les amortissements et dépréciations ([[D&A]]) réduisent le résultat net au P&L, mais ne correspondent à aucune sortie de cash sur la période (le cash est sorti à l'achat de l'actif). Dans le flux d'exploitation, on part du résultat net et on rajoute le D&A pour annuler cette charge purement comptable : c'est pourquoi le D&A « ajoute » du cash dans le tableau de flux.","en":"Depreciation and amortization ([[D&A]]) reduce net income in the P&L but involve no cash outflow in the period (cash left when the asset was bought). In operating cash flow, you start from net income and add back D&A to undo this purely accounting charge: that is why D&A \"adds\" cash in the cash flow statement."}},{"heading":{"fr":"L'impact de la variation de BFR","en":"The impact of working-capital changes"},"body":{"fr":"Une hausse du [[working capital]] (BFR) consomme du cash : si les stocks ou les créances clients augmentent, de l'argent est immobilisé. Une baisse du BFR libère du cash. Dans le flux d'exploitation, on soustrait l'augmentation de BFR (ou on ajoute sa diminution). Une entreprise en forte croissance peut donc être rentable mais à court de cash, car son BFR explose.","en":"An increase in [[working capital]] consumes cash: if inventory or receivables rise, money is tied up. A decrease in working capital frees cash. In operating cash flow, you subtract the increase in working capital (or add its decrease). A fast-growing company can therefore be profitable yet cash-short, because its working capital balloons."}},{"heading":{"fr":"Du résultat net au flux d'exploitation","en":"From net income to operating cash flow"},"body":{"fr":"La méthode indirecte construit le flux d'exploitation ainsi : résultat net + D&A ± variation de BFR ± autres éléments non-cash. On part du profit comptable, on annule les charges non-cash (D&A) et on corrige des décalages d'encaissement (BFR) pour retrouver le cash réellement généré par l'activité.","en":"The indirect method builds operating cash flow as: net income + D&A ± change in working capital ± other non-cash items. You start from accounting profit, undo non-cash charges (D&A) and adjust for timing mismatches (working capital) to recover the cash actually generated by the activity."}}],"exempleChiffre":{"title":{"fr":"Exemple chiffré — flux d'exploitation","en":"Worked example — operating cash flow"},"body":{"fr":"Résultat net = 100. On rajoute le D&A non-cash = 50, soit 150. Le BFR a augmenté de 30 sur l'année (stocks et créances en hausse), ce qui consomme 30 de cash : 150 − 30 = 120 de flux d'exploitation. On voit que le D&A ajoute du cash (+50) et que la hausse de BFR en retire (−30).","en":"Net income = 100. Add back non-cash D&A = 50, giving 150. Working capital rose by 30 over the year (inventory and receivables up), consuming 30 of cash: 150 − 30 = 120 of operating cash flow. Note that D&A adds cash (+50) while the rise in working capital removes it (−30)."},"figures":[{"caption":{"fr":"Flux d'exploitation (méthode indirecte)","en":"Operating cash flow (indirect method)"},"columns":["Poste","Montant","Cumul"],"rows":[["Résultat net","100","100"],["+ D&A (non-cash)","50","150"],["− Hausse du BFR","30","120"],["= Flux d'exploitation","","120"]]}]},"piegesEntretien":[{"fr":"Dire que le D&A est une sortie de cash : non, c'est une charge non-cash ; on le rajoute justement au résultat net dans les flux.","en":"Saying D&A is a cash outflow: no, it is a non-cash charge; that is exactly why you add it back to net income in the cash flows."},{"fr":"Se tromper de signe sur le BFR : une hausse du BFR consomme du cash (on soustrait), une baisse en libère (on ajoute).","en":"Getting the working-capital sign wrong: an increase consumes cash (subtract), a decrease frees cash (add)."},{"fr":"Confondre flux d'exploitation et résultat net : ils diffèrent du D&A, de la variation de BFR et des autres éléments non-cash.","en":"Confusing operating cash flow with net income: they differ by D&A, working-capital change and other non-cash items."},{"fr":"Oublier le capex dans les flux d'investissement : un EBITDA élevé ne dit rien du cash si les investissements sont lourds.","en":"Forgetting capex in investing cash flow: a high EBITDA says nothing about cash if capex is heavy."},{"fr":"Croire qu'une société rentable a forcément du cash : une croissance rapide peut faire exploser le BFR et assécher la trésorerie.","en":"Believing a profitable company necessarily has cash: fast growth can balloon working capital and drain cash."}],"synthese":{"fr":"• Trois sections : exploitation, investissement (capex), financement.\n• La somme des trois = variation de trésorerie de la période.\n• Le D&A est non-cash : on le rajoute au résultat net dans les flux.\n• Hausse du BFR → consomme du cash ; baisse du BFR → libère du cash.\n• Flux d'exploitation ≈ résultat net + D&A ± variation de BFR.\n• Le cash ne ment pas : un profit n'est pas du cash.","en":"• Three sections: operating, investing (capex), financing.\n• Sum of the three = change in cash over the period.\n• D&A is non-cash: add it back to net income in the cash flows.\n• Rise in working capital → consumes cash; fall → frees cash.\n• Operating cash flow ≈ net income + D&A ± change in working capital.\n• Cash does not lie: profit is not cash."}},"glossaryRefs":[]},{"id":"mod.l1.vocab","type":"module","level":1,"topic":"Fit","tags":["vocabulaire","dette","equity","NDA"],"difficulty":1,"source":{"flag":"VERIFIED","ref":"Vernimmen + culture de marché"},"title":{"fr":"Vocabulaire & types d'investisseurs","en":"Vocabulary & types of investors"},"objective":{"fr":"Distinguer actionnaire et créancier, dette et equity, prix et valeur, et connaître les termes de base comme le NDA.","en":"Tell apart shareholder and creditor, debt and equity, price and value, and know basic terms like the NDA."},"estMinutes":11,"prerequisites":["mod.l1.culture"],"content":{"contexte":{"fr":"Le bon vocabulaire est la première chose qu'un recruteur entend. Mélanger actionnaire et créancier, ou prix et valeur, trahit un manque de bases. Ce module fixe le langage commun de la finance d'entreprise.","en":"The right vocabulary is the first thing a recruiter hears. Mixing up shareholder and creditor, or price and value, signals weak foundations. This module sets the common language of corporate finance."},"concepts":[{"heading":{"fr":"Actionnaire vs créancier","en":"Shareholder vs creditor"},"body":{"fr":"L'actionnaire ([[shareholder]]) détient une part du capital : il est propriétaire, prend le risque, et perçoit ce qui reste après paiement de tous les autres (dividendes, plus-value). Le créancier ([[creditor]]) a prêté de l'argent : il est remboursé en priorité, touche des intérêts fixés, mais ne profite pas de la hausse de valeur. L'actionnaire vise le rendement élevé en supportant le risque ; le créancier vise la sécurité en acceptant un rendement plafonné.","en":"The [[shareholder]] owns part of the capital: an owner, takes the risk, and receives whatever is left after everyone else is paid (dividends, capital gain). The [[creditor]] lent money: repaid in priority, earns fixed interest, but does not benefit from value upside. The shareholder targets high returns while bearing risk; the creditor targets safety while accepting a capped return."}},{"heading":{"fr":"Dette vs equity","en":"Debt vs equity"},"body":{"fr":"La dette ([[debt]]) est de l'argent emprunté qu'il faut rembourser avec intérêts, qu'on gagne ou non de l'argent ; ses intérêts sont déductibles fiscalement. L'[[equity]] (capitaux propres) est l'argent des actionnaires, sans échéance de remboursement et rémunéré seulement en cas de succès. La dette est moins chère mais rigide et risquée ; l'equity est plus chère mais flexible. Le dosage des deux est la structure de capital.","en":"[[debt]] is borrowed money to be repaid with interest, whether or not the company makes money; its interest is tax-deductible. [[equity]] is shareholders' money, with no repayment deadline and rewarded only in case of success. Debt is cheaper but rigid and risky; equity is more expensive but flexible. The mix of both is the capital structure."}},{"heading":{"fr":"Rémunération de chacun","en":"How each is rewarded"},"body":{"fr":"Le créancier est rémunéré par des intérêts ([[interest]]) contractuels et le remboursement du principal. L'actionnaire est rémunéré par les dividendes et surtout par la plus-value à la revente (sa part de la valeur créée). En cas de faillite, l'ordre de priorité est strict : on rembourse d'abord les créanciers, et l'actionnaire passe en dernier — d'où son risque plus élevé.","en":"The creditor is rewarded by contractual [[interest]] and repayment of principal. The shareholder is rewarded by dividends and, above all, the capital gain on resale (their share of value created). In bankruptcy the priority order is strict: creditors are repaid first, the shareholder comes last — hence the higher risk."}},{"heading":{"fr":"Le NDA","en":"The NDA"},"body":{"fr":"Un [[NDA]] (Non-Disclosure Agreement, ou accord de confidentialité) est signé en amont d'une transaction : il engage celui qui reçoit des informations sensibles (comptes, contrats clients) à ne pas les divulguer ni les utiliser hors du cadre de l'opération. C'est souvent le premier document d'un processus de cession ou d'acquisition, avant tout accès à la dataroom.","en":"An [[NDA]] (Non-Disclosure Agreement) is signed early in a transaction: it binds the party receiving sensitive information (accounts, customer contracts) not to disclose or use it outside the deal. It is often the first document in a sale or acquisition process, before any dataroom access."}},{"heading":{"fr":"Prix vs valeur","en":"Price vs value"},"body":{"fr":"La valeur ([[value]]) est une estimation de ce que vaut un actif d'après une analyse (DCF, multiples) : elle dépend de l'observateur et de ses hypothèses. Le prix ([[price]]) est ce qui est effectivement payé dans une transaction, fixé par la rencontre d'un acheteur et d'un vendeur. « Le prix est ce que vous payez, la valeur ce que vous obtenez » : un bon investissement consiste à acheter en dessous de la valeur perçue.","en":"[[value]] is an estimate of what an asset is worth based on analysis (DCF, multiples): it depends on the observer and their assumptions. [[price]] is what is actually paid in a transaction, set by a buyer and a seller meeting. \"Price is what you pay, value is what you get\": a good investment means buying below perceived value."}}],"exempleChiffre":{"title":{"fr":"Exemple chiffré — créancier vs actionnaire","en":"Worked example — creditor vs shareholder"},"body":{"fr":"Une société est financée par 60 de dette à 5% d'intérêt et 40 d'equity. Le créancier touche 60 × 5% = 3 d'intérêts par an, quoi qu'il arrive, et récupère son principal en priorité. Si la société est revendue 150 et que la dette (60) est remboursée, l'actionnaire touche 150 − 60 = 90, soit une plus-value de 90 − 40 = 50 sur sa mise. Le créancier a gagné un rendement fixe ; l'actionnaire a capté toute la création de valeur.","en":"A company is financed with 60 of debt at 5% interest and 40 of equity. The creditor earns 60 × 5% = 3 of interest per year, no matter what, and recovers principal in priority. If the company is sold for 150 and the debt (60) is repaid, the shareholder receives 150 − 60 = 90, a gain of 90 − 40 = 50 on their stake. The creditor earned a fixed return; the shareholder captured all the value creation."},"figures":[{"caption":{"fr":"Rémunération à la sortie (vente à 150)","en":"Payout at exit (sale at 150)"},"columns":["Partie","Mise","Reçu à la sortie","Gain"],"rows":[["Créancier (dette)","60","60 + intérêts","intérêts fixes"],["Actionnaire (equity)","40","90","50"]]}]},"piegesEntretien":[{"fr":"Confondre actionnaire et créancier : le créancier prête et est remboursé en priorité ; l'actionnaire possède et passe en dernier.","en":"Confusing shareholder and creditor: the creditor lends and is repaid first; the shareholder owns and comes last."},{"fr":"Dire que prix = valeur : la valeur est une estimation, le prix est ce qui est réellement payé dans la transaction.","en":"Saying price = value: value is an estimate, price is what is actually paid in the transaction."},{"fr":"Oublier que les intérêts de la dette sont déductibles fiscalement, contrairement aux dividendes.","en":"Forgetting that debt interest is tax-deductible, unlike dividends."},{"fr":"Croire que l'actionnaire est remboursé avant le créancier en cas de faillite : c'est l'inverse, l'actionnaire est le dernier servi.","en":"Believing the shareholder is repaid before the creditor in bankruptcy: it is the reverse, the shareholder is served last."},{"fr":"Présenter le NDA comme un contrat de vente : ce n'est qu'un accord de confidentialité préalable à l'accès aux informations.","en":"Presenting the NDA as a sale contract: it is only a confidentiality agreement preceding access to information."}],"synthese":{"fr":"• Actionnaire = propriétaire, risque élevé, sert en dernier ; créancier = prêteur, sécurité, sert en premier.\n• Dette : à rembourser, intérêts déductibles, moins chère mais rigide. Equity : pas d'échéance, plus chère mais flexible.\n• Créancier rémunéré par intérêts ; actionnaire par dividendes et plus-value.\n• NDA = accord de confidentialité, premier document d'un process.\n• Prix = ce qu'on paie ; valeur = ce qu'on estime obtenir.","en":"• Shareholder = owner, high risk, served last; creditor = lender, safety, served first.\n• Debt: must be repaid, interest tax-deductible, cheaper but rigid. Equity: no deadline, more expensive but flexible.\n• Creditor rewarded by interest; shareholder by dividends and capital gain.\n• NDA = confidentiality agreement, first document of a process.\n• Price = what you pay; value = what you estimate you get."}},"glossaryRefs":[]},{"id":"mod.l2.linkage","type":"module","level":2,"topic":"Accounting","tags":["Accounting","3-statements","linkage","cash flow"],"difficulty":2,"source":{"flag":"VERIFIED","ref":"BIWS Accounting guide + Vernimmen"},"title":{"fr":"Comment les 3 états financiers se lient","en":"How the 3 financial statements link together"},"objective":{"fr":"Savoir relier compte de résultat, bilan et tableau de flux de trésorerie via les 3 règles de liaison universelles.","en":"Be able to connect the income statement, balance sheet and cash flow statement using the 3 universal linkage rules."},"estMinutes":14,"prerequisites":[],"content":{"contexte":{"fr":"En entretien, on demande presque systématiquement « si l'amortissement augmente de 10, que se passe-t-il sur les 3 états ? ». Comprendre les liaisons est la base de toute modélisation et de tout [[LBO]] : le tableau de flux de trésorerie est le pont entre la performance comptable et la trésorerie réelle.","en":"Interviews almost always ask « if depreciation rises by 10, what happens across the 3 statements? ». Understanding the links is the foundation of all modelling and every [[LBO]]: the cash flow statement is the bridge between accounting performance and real cash."},"concepts":[{"heading":{"fr":"Le résultat net est le point de jonction","en":"Net income is the junction point"},"body":{"fr":"Le résultat net (« [[net income]] ») est la dernière ligne du compte de résultat. Il alimente deux états : il devient la première ligne du tableau de flux de trésorerie (méthode indirecte) et il s'ajoute aux capitaux propres au bilan via les réserves (résultat net − dividendes = variation des réserves).","en":"Net income is the last line of the income statement. It feeds two statements: it becomes the first line of the cash flow statement (indirect method) and it adds to balance-sheet equity through retained earnings (net income − dividends = change in retained earnings)."}},{"heading":{"fr":"Le rôle des charges non décaissées : le [[D&A]]","en":"The role of non-cash charges: [[D&A]]"},"body":{"fr":"Le [[D&A]] (dotations aux amortissements et provisions) réduit le résultat net mais ne correspond à aucune sortie de cash. On le réintègre donc dans le flux d'exploitation. C'est l'archétype de l'ajustement « non-cash » : on neutralise au tableau de flux toute charge ou produit comptable sans contrepartie en trésorerie.","en":"[[D&A]] (depreciation and amortisation) reduces net income but involves no cash outflow. It is therefore added back in operating cash flow. It is the archetypal non-cash adjustment: in the cash flow statement we neutralise any accounting expense or income without a cash counterpart."}},{"heading":{"fr":"Les variations du bilan deviennent des flux","en":"Balance-sheet changes become cash flows"},"body":{"fr":"Toute variation d'un poste de bilan génère un flux de trésorerie. Une hausse d'un actif (stocks, créances clients) consomme du cash (flux négatif) ; une hausse d'un passif (dettes fournisseurs) en libère. La variation du [[BFR]] (besoin en fonds de roulement) résume cet effet sur le cycle d'exploitation, et les capex apparaissent dans les flux d'investissement.","en":"Every change in a balance-sheet item generates a cash flow. An increase in an asset (inventory, receivables) consumes cash (negative flow); an increase in a liability (payables) releases it. The change in [[working capital]] summarises this effect on the operating cycle, while capex appears in investing flows."}},{"heading":{"fr":"Le bouclage : trésorerie finale = trésorerie au bilan","en":"The tie-out: ending cash = balance-sheet cash"},"body":{"fr":"La somme des trois flux (exploitation, investissement, financement) donne la variation nette de trésorerie sur la période. Ajoutée à la trésorerie d'ouverture, elle doit égaler exactement la trésorerie de clôture au bilan. Si ce bouclage échoue, le modèle est faux : c'est le test de cohérence ultime.","en":"The sum of the three flows (operating, investing, financing) gives the net change in cash for the period. Added to opening cash, it must exactly equal the closing cash on the balance sheet. If this tie-out fails, the model is wrong: it is the ultimate consistency check."}}],"exempleChiffre":{"title":{"fr":"Exemple chiffré : +10 de [[D&A]]","en":"Worked example: +10 of [[D&A]]"},"body":{"fr":"On augmente le [[D&A]] de 10, avec un taux d'IS de 25%. Compte de résultat : résultat avant impôt −10, impôt −2,5 (économie d'impôt), résultat net −7,5. Tableau de flux : résultat net −7,5 mais on réintègre +10 de [[D&A]], soit un flux d'exploitation de +2,5 (l'économie d'impôt). Bilan : capitaux propres −7,5 (via réserves) et trésorerie +2,5 ; les immobilisations nettes baissent de 10 par l'amortissement. Le bilan reste équilibré : actif −10 (immo) +2,5 (cash) = −7,5 = variation des capitaux propres.","en":"We raise [[D&A]] by 10 at a 25% tax rate. Income statement: pre-tax income −10, tax −2.5 (tax shield), net income −7.5. Cash flow: net income −7.5 but we add back +10 of [[D&A]], giving operating cash flow of +2.5 (the tax saving). Balance sheet: equity −7.5 (via retained earnings) and cash +2.5; net PP&E falls by 10. The balance sheet stays balanced: assets −10 (PP&E) +2.5 (cash) = −7.5 = change in equity."},"figures":[{"caption":{"fr":"Impact d'un +10 de [[D&A]] sur les 3 états (IS 25%)","en":"Impact of +10 [[D&A]] on the 3 statements (25% tax)"},"columns":["Poste","Variation"],"rows":[["Résultat avant impôt","−10"],["Impôt (économie)","−2,5"],["Résultat net","−7,5"],["Flux d'exploitation","+2,5"],["Trésorerie (bilan)","+2,5"],["Immobilisations nettes","−10"],["Capitaux propres","−7,5"]]}]},"piegesEntretien":[{"fr":"Oublier l'effet de l'impôt : un +10 de [[D&A]] n'augmente pas le cash de 10 mais de 2,5 (l'économie d'impôt), car le résultat net baisse de 7,5.","en":"Forgetting the tax effect: a +10 of [[D&A]] does not raise cash by 10 but by 2.5 (the tax shield), because net income falls by 7.5."},{"fr":"Confondre amortissement et dépréciation cash : seul le [[D&A]] comptable se réintègre ; un capex réel est une vraie sortie de cash en flux d'investissement.","en":"Confusing depreciation with a cash outflow: only accounting [[D&A]] is added back; actual capex is a real cash outflow in investing flows."},{"fr":"Inverser le signe du [[BFR]] : une hausse des créances clients consomme du cash (flux négatif), pas l'inverse.","en":"Getting the working-capital sign wrong: an increase in receivables consumes cash (negative flow), not the reverse."},{"fr":"Ne pas vérifier le bouclage : si la trésorerie de clôture du tableau de flux ne colle pas au bilan, tout le modèle est suspect.","en":"Not checking the tie-out: if cash-flow closing cash does not match the balance sheet, the whole model is suspect."},{"fr":"Compter le résultat net deux fois : il alimente les capitaux propres ET le flux d'exploitation, mais ce ne sont pas deux flux de cash distincts.","en":"Double-counting net income: it feeds both equity AND operating cash flow, but these are not two separate cash flows."}],"synthese":{"fr":"• Résultat net → tableau de flux (1re ligne) ET capitaux propres (réserves).\n• [[D&A]] et autres charges non-cash réintégrés dans le flux d'exploitation.\n• Variations de bilan → flux (actif ↑ consomme, passif ↑ libère).\n• Σ des 3 flux + trésorerie d'ouverture = trésorerie de clôture du bilan.\n• Toujours raisonner net d'impôt.","en":"• Net income → cash flow statement (top line) AND equity (retained earnings).\n• [[D&A]] and other non-cash charges added back in operating cash flow.\n• Balance-sheet changes → flows (asset ↑ uses cash, liability ↑ frees cash).\n• Σ of the 3 flows + opening cash = balance-sheet closing cash.\n• Always reason net of tax."}},"glossaryRefs":["net-income","da","working-capital"]},{"id":"mod.l2.fcf","type":"module","level":2,"topic":"DCF","tags":["DCF","FCFF","FCFE","cash flow"],"difficulty":2,"source":{"flag":"VERIFIED","ref":"Vernimmen + BIWS DCF guide"},"title":{"fr":"De l'EBITDA au Free Cash Flow","en":"From EBITDA to Free Cash Flow"},"objective":{"fr":"Savoir construire le [[FCFF]] et le [[FCFE]] à partir de l'EBITDA et comprendre ce que chacun rémunère.","en":"Be able to build [[FCFF]] and [[FCFE]] from EBITDA and understand who each one pays."},"estMinutes":13,"prerequisites":["mod.l2.linkage"],"content":{"contexte":{"fr":"Le DCF valorise une entreprise en actualisant ses flux de trésorerie disponibles. Savoir passer de l'[[EBITDA]] au [[free cash flow]] est indispensable : on confond souvent EBITDA et cash, alors que capex, impôts et variation de [[BFR]] creusent un écart majeur. Distinguer [[FCFF]] (avant dette) et [[FCFE]] (après dette) conditionne le bon taux d'actualisation.","en":"A DCF values a company by discounting its free cash flows. Moving from [[EBITDA]] to [[free cash flow]] is essential: EBITDA and cash are often confused, yet capex, taxes and working-capital changes drive a major gap. Distinguishing [[FCFF]] (pre-debt) from [[FCFE]] (post-debt) determines the correct discount rate."},"concepts":[{"heading":{"fr":"Le [[FCFF]] : flux disponible pour tous les bailleurs","en":"[[FCFF]]: free cash flow to all providers of capital"},"body":{"fr":"Le [[FCFF]] (free cash flow to firm) est le cash disponible avant rémunération de la dette. Formule : [[FCFF]] = EBITDA − impôts (sur l'EBIT) − Δ[[BFR]] − capex. De façon équivalente, on part du [[NOPAT]] = EBIT × (1 − t), on rajoute le [[D&A]] (non-cash), puis on retranche capex et Δ[[BFR]]. On l'actualise au [[WACC]].","en":"[[FCFF]] (free cash flow to firm) is the cash available before paying debt. Formula: [[FCFF]] = EBITDA − taxes (on EBIT) − Δ[[working capital]] − capex. Equivalently, start from [[NOPAT]] = EBIT × (1 − t), add back [[D&A]] (non-cash), then subtract capex and Δ[[working capital]]. It is discounted at the [[WACC]]."}},{"heading":{"fr":"Le [[FCFE]] : flux disponible pour les actionnaires","en":"[[FCFE]]: free cash flow to equity"},"body":{"fr":"Le [[FCFE]] (free cash flow to equity) est ce qui reste aux actionnaires après le service de la dette. Formule : [[FCFE]] = [[FCFF]] − service de la dette (intérêts nets d'impôt + remboursements − nouveaux tirages). On l'actualise au coût des fonds propres (Re), pas au [[WACC]].","en":"[[FCFE]] (free cash flow to equity) is what remains for shareholders after debt service. Formula: [[FCFE]] = [[FCFF]] − debt service (after-tax interest + repayments − new drawdowns). It is discounted at the cost of equity (Re), not the [[WACC]]."}},{"heading":{"fr":"Pourquoi l'EBITDA n'est pas du cash","en":"Why EBITDA is not cash"},"body":{"fr":"L'[[EBITDA]] ignore trois sorties bien réelles : l'impôt, l'investissement (capex) et l'immobilisation de cash dans le [[BFR]]. Une entreprise à fort capex ou à BFR croissant peut afficher un EBITDA élevé et un free cash flow faible, voire négatif. C'est l'erreur classique qui survalorise les sociétés capitalistiques.","en":"[[EBITDA]] ignores three very real outflows: tax, capex and cash tied up in [[working capital]]. A company with heavy capex or growing working capital can show a high EBITDA and a low, even negative, free cash flow. This is the classic mistake that overvalues capital-intensive businesses."}}],"exempleChiffre":{"title":{"fr":"Exemple chiffré : EBIT 300 vers [[FCFF]]","en":"Worked example: EBIT 300 to [[FCFF]]"},"body":{"fr":"Soit un EBIT de 300 et un taux d'IS de 25%. [[NOPAT]] = 300 × (1 − 0,25) = 225. On rajoute le [[D&A]] de 50 (non-cash), on retranche les capex de 30 et la hausse du [[BFR]] de 20. [[FCFF]] = 225 + 50 − 30 − 20 = 225. Le [[FCFF]] égale ici le [[NOPAT]] par coïncidence : le [[D&A]] (+50) compense exactement capex + Δ[[BFR]] (30 + 20 = 50), situation typique d'une entreprise mature en régime de croisière.","en":"Take an EBIT of 300 and a 25% tax rate. [[NOPAT]] = 300 × (1 − 0.25) = 225. Add back [[D&A]] of 50 (non-cash), subtract capex of 30 and the increase in [[working capital]] of 20. [[FCFF]] = 225 + 50 − 30 − 20 = 225. Here [[FCFF]] equals [[NOPAT]] by coincidence: [[D&A]] (+50) exactly offsets capex + Δworking capital (30 + 20 = 50), typical of a mature company in steady state."},"figures":[{"caption":{"fr":"Pont du [[NOPAT]] au [[FCFF]] (IS 25%)","en":"Bridge from [[NOPAT]] to [[FCFF]] (25% tax)"},"columns":["Étape","Montant"],"rows":[["EBIT","300"],["× (1 − 25%) = NOPAT","225"],["+ D&A","+50"],["− Capex","−30"],["− ΔBFR","−20"],["= FCFF","225"]]}]},"piegesEntretien":[{"fr":"Actualiser le [[FCFF]] au coût des fonds propres : non, le [[FCFF]] s'actualise au [[WACC]] ; seul le [[FCFE]] s'actualise à Re.","en":"Discounting [[FCFF]] at the cost of equity: no, [[FCFF]] is discounted at the [[WACC]]; only [[FCFE]] is discounted at Re."},{"fr":"Soustraire les intérêts du [[FCFF]] : non, le [[FCFF]] est avant dette ; les intérêts n'apparaissent que dans le [[FCFE]].","en":"Subtracting interest from [[FCFF]]: no, [[FCFF]] is pre-debt; interest only appears in [[FCFE]]."},{"fr":"Utiliser l'impôt sur l'EBT plutôt que sur l'EBIT pour le [[FCFF]] : le [[FCFF]] utilise un impôt « non levé » calculé sur l'EBIT (NOPAT), pour ne pas double-compter l'économie d'impôt déjà dans le [[WACC]].","en":"Using tax on EBT rather than on EBIT for [[FCFF]]: [[FCFF]] uses an unlevered tax computed on EBIT (NOPAT), to avoid double-counting the tax shield already in the [[WACC]]."},{"fr":"Oublier la variation de [[BFR]] : une croissance forte gonfle le BFR et peut transformer un bon EBITDA en cash flow médiocre.","en":"Forgetting the change in [[working capital]]: strong growth inflates working capital and can turn a good EBITDA into mediocre cash flow."},{"fr":"Assimiler EBITDA et free cash flow : un raccourci dangereux pour toute société à fort capex.","en":"Treating EBITDA as free cash flow: a dangerous shortcut for any capex-heavy company."}],"synthese":{"fr":"• [[FCFF]] = EBITDA − impôts (sur EBIT) − Δ[[BFR]] − capex, actualisé au [[WACC]].\n• Équivalent : NOPAT + D&A − capex − ΔBFR.\n• [[FCFE]] = [[FCFF]] − service de la dette, actualisé à Re.\n• EBITDA ≠ cash : capex, impôts et BFR creusent l'écart.\n• Cohérence flux/taux : flux avant dette ↔ WACC, flux après dette ↔ Re.","en":"• [[FCFF]] = EBITDA − taxes (on EBIT) − Δ[[working capital]] − capex, discounted at [[WACC]].\n• Equivalent: NOPAT + D&A − capex − Δworking capital.\n• [[FCFE]] = [[FCFF]] − debt service, discounted at Re.\n• EBITDA ≠ cash: capex, taxes and working capital create the gap.\n• Flow/rate consistency: pre-debt flow ↔ WACC, post-debt flow ↔ Re."}},"glossaryRefs":["fcff","fcfe","ebitda","nopat","wacc"]},{"id":"mod.l2.ratios","type":"module","level":2,"topic":"Accounting","tags":["Accounting","ratios","leverage","ROE","ROCE"],"difficulty":2,"source":{"flag":"VERIFIED","ref":"Vernimmen + BIWS"},"title":{"fr":"Ratios clés : gearing, ROE, ROCE, couverture","en":"Key ratios: gearing, ROE, ROCE, coverage"},"objective":{"fr":"Savoir calculer et interpréter le gearing, le ROE, le ROCE et la couverture des intérêts, et comprendre l'effet de levier financier.","en":"Be able to compute and interpret gearing, ROE, ROCE and interest coverage, and understand financial leverage."},"estMinutes":14,"prerequisites":["mod.l2.linkage"],"content":{"contexte":{"fr":"Les ratios sont le langage commun des analystes et des comités de crédit. En entretien comme en deal, on jauge la solvabilité ([[gearing]], couverture) et la rentabilité ([[ROE]], [[ROCE]]) en quelques secondes. Comprendre l'effet de levier explique pourquoi un [[LBO]] peut doper le rendement des actionnaires — ou le détruire.","en":"Ratios are the common language of analysts and credit committees. In interviews and deals alike, you gauge solvency ([[gearing]], coverage) and profitability ([[ROE]], [[ROCE]]) in seconds. Understanding leverage explains why an [[LBO]] can boost shareholder returns — or destroy them."},"concepts":[{"heading":{"fr":"[[gearing]] et couverture des intérêts : la solvabilité","en":"[[gearing]] and interest coverage: solvency"},"body":{"fr":"Le [[gearing]] = dette nette / capitaux propres mesure le poids de l'endettement par rapport aux fonds propres. La couverture des intérêts = EBIT / charges d'intérêts indique combien de fois le résultat opérationnel paie les intérêts. Les prêteurs surveillent aussi dette nette / EBITDA (en France mid-cap, un [[levier]] de 4,5–5,5x est courant en [[LBO]]).","en":"[[gearing]] = net debt / equity measures the weight of debt relative to equity. Interest coverage = EBIT / interest expense shows how many times operating profit covers interest. Lenders also watch net debt / EBITDA (for French mid-caps, [[leverage]] of 4.5–5.5x is common in an [[LBO]])."}},{"heading":{"fr":"[[ROE]] : rentabilité pour l'actionnaire","en":"[[ROE]]: return for the shareholder"},"body":{"fr":"Le [[ROE]] (return on equity) = résultat net / capitaux propres mesure la rentabilité des fonds investis par les actionnaires. Il est sensible au levier : à actif égal, plus de dette réduit les capitaux propres et gonfle mécaniquement le [[ROE]], mais augmente le risque.","en":"[[ROE]] (return on equity) = net income / equity measures the return on shareholders' invested funds. It is leverage-sensitive: for a given asset base, more debt reduces equity and mechanically inflates [[ROE]], but raises risk."}},{"heading":{"fr":"[[ROCE]] : rentabilité économique avant financement","en":"[[ROCE]]: economic return before financing"},"body":{"fr":"Le [[ROCE]] (return on capital employed) = EBIT × (1 − t) / capitaux employés mesure la rentabilité de l'outil économique, indépendamment de la structure financière. Les capitaux employés = capitaux propres + dette nette (ou actif immobilisé + [[BFR]]). C'est le bon indicateur pour comparer deux entreprises au financement différent.","en":"[[ROCE]] (return on capital employed) = EBIT × (1 − t) / capital employed measures the return on the economic asset base, independent of financing structure. Capital employed = equity + net debt (or fixed assets + [[working capital]]). It is the right metric to compare two companies with different financing."}},{"heading":{"fr":"L'effet de levier financier","en":"Financial leverage effect"},"body":{"fr":"L'effet de levier explique l'écart entre [[ROE]] et rentabilité économique. La formule correcte de l'uplift sur les fonds propres est : (Ra − Rd) × D/E, où Ra est le rendement des actifs (proche du [[ROCE]]), Rd le coût de la dette et D/E le ratio d'endettement. Si Ra > Rd, l'endettement amplifie le [[ROE]] ; si Ra < Rd, il le détruit (effet de massue).","en":"Leverage explains the gap between [[ROE]] and economic return. The correct formula for the uplift on equity is: (Ra − Rd) × D/E, where Ra is the return on assets (close to [[ROCE]]), Rd the cost of debt and D/E the debt-to-equity ratio. If Ra > Rd, debt amplifies [[ROE]]; if Ra < Rd, it destroys it (the clobbering effect)."}}],"exempleChiffre":{"title":{"fr":"Exemple chiffré : levier sur le [[ROE]]","en":"Worked example: leverage on [[ROE]]"},"body":{"fr":"Une entreprise a un rendement des actifs Ra = 10%, un coût de la dette Rd = 4%, et un ratio D/E = 1,5. L'uplift de l'effet de levier = (Ra − Rd) × D/E = (10% − 4%) × 1,5 = 9%. Le [[ROE]] approché = Ra + uplift = 10% + 9% = 19% (avant impôt). Si la rentabilité des actifs tombait sous 4%, le levier deviendrait destructeur.","en":"A company has return on assets Ra = 10%, cost of debt Rd = 4%, and D/E ratio = 1.5. The leverage uplift = (Ra − Rd) × D/E = (10% − 4%) × 1.5 = 9%. Approximate [[ROE]] = Ra + uplift = 10% + 9% = 19% (pre-tax). If asset returns fell below 4%, leverage would turn destructive."},"figures":[{"caption":{"fr":"Décomposition de l'effet de levier","en":"Leverage effect breakdown"},"columns":["Élément","Valeur"],"rows":[["Rendement des actifs (Ra)","10%"],["Coût de la dette (Rd)","4%"],["Spread (Ra − Rd)","6%"],["D/E","1,5"],["Uplift = spread × D/E","9%"],["ROE ≈ Ra + uplift","19%"]]}]},"piegesEntretien":[{"fr":"Donner l'effet de levier comme « rendement des actifs − coût de la dette » : c'est incomplet, il manque le facteur D/E qui amplifie le spread.","en":"Giving the leverage effect as « return on assets − cost of debt »: this is incomplete, the D/E factor that amplifies the spread is missing."},{"fr":"Confondre [[ROE]] et [[ROCE]] : le ROE inclut l'effet de la dette, le ROCE en est indépendant.","en":"Confusing [[ROE]] and [[ROCE]]: ROE includes the effect of debt, ROCE is independent of it."},{"fr":"Utiliser la dette brute au lieu de la dette nette dans le [[gearing]] : on retranche la trésorerie pour obtenir la dette nette.","en":"Using gross debt instead of net debt in [[gearing]]: cash is subtracted to get net debt."},{"fr":"Oublier que la couverture des intérêts utilise l'EBIT (et non le résultat net) : on compare la capacité opérationnelle à payer la dette.","en":"Forgetting that interest coverage uses EBIT (not net income): it compares operating capacity to service debt."},{"fr":"Croire qu'un [[ROE]] élevé est toujours bon : il peut simplement refléter un levier excessif et donc un risque élevé.","en":"Believing a high [[ROE]] is always good: it may simply reflect excessive leverage and therefore high risk."}],"synthese":{"fr":"• [[gearing]] = dette nette / capitaux propres ; couverture = EBIT / intérêts.\n• [[ROE]] = résultat net / capitaux propres (sensible au levier).\n• [[ROCE]] = EBIT(1−t) / capitaux employés (avant financement).\n• Effet de levier sur les fonds propres = (Ra − Rd) × D/E.\n• Si Ra > Rd le levier dope le ROE ; sinon il le détruit.","en":"• [[gearing]] = net debt / equity; coverage = EBIT / interest.\n• [[ROE]] = net income / equity (leverage-sensitive).\n• [[ROCE]] = EBIT(1−t) / capital employed (pre-financing).\n• Leverage effect on equity = (Ra − Rd) × D/E.\n• If Ra > Rd leverage boosts ROE; otherwise it destroys it."}},"glossaryRefs":["gearing","roe","roce","leverage","working-capital"],"correction":{"kind":"error","needsReview":false,"note":{"fr":"corrigé : la dataroom indiquait « effet de levier = rendement des actifs − coût de la dette », formule incomplète. L'uplift correct sur les fonds propres est (Ra − Rd) × D/E ; le facteur D/E manquait.","en":"corrected: the dataroom stated « leverage effect = return on assets − cost of debt », an incomplete formula. The correct uplift on equity is (Ra − Rd) × D/E; the D/E factor was missing."}}},{"id":"mod.l2.ev-bridge","type":"module","level":2,"topic":"Valuation","tags":["Valuation","EV","equity value","bridge"],"difficulty":2,"source":{"flag":"VERIFIED","ref":"Vernimmen + BIWS valuation guide"},"title":{"fr":"Equity Value vs Enterprise Value : le bridge","en":"Equity Value vs Enterprise Value: the bridge"},"objective":{"fr":"Savoir passer de la valeur des capitaux propres à la valeur d'entreprise et inversement, en maîtrisant chaque ligne du bridge.","en":"Move between equity value and enterprise value in both directions, mastering every line of the bridge."},"estMinutes":14,"prerequisites":[],"content":{"contexte":{"fr":"En entretien comme en deal, la première question de valorisation est presque toujours : « quelle est la différence entre [[equity value]] et [[Enterprise Value]] ? ». Tout multiple (EV/EBITDA vs P/E), tout pont de transaction et toute négociation de prix repose sur ce bridge. Le confondre est la faute éliminatoire numéro un.","en":"In interviews and in live deals, the first valuation question is almost always: 'what is the difference between equity value and enterprise value?'. Every multiple (EV/EBITDA vs P/E), every transaction bridge and every price negotiation rests on this bridge. Confusing them is the number-one knockout mistake."},"concepts":[{"heading":{"fr":"Définition des deux valeurs","en":"Defining the two values"},"body":{"fr":"L'[[equity value]] (valeur des capitaux propres, ou capitalisation boursière pour une cotée) est ce qui revient aux seuls actionnaires. L'[[Enterprise Value]] (valeur d'entreprise) est la valeur de l'actif économique, indépendamment de sa structure de financement : c'est ce que paieraient l'ensemble des pourvoyeurs de capitaux (actionnaires + créanciers). L'EV est donc la bonne base pour comparer des sociétés à structures de dette différentes.","en":"Equity value (market capitalisation for a listed company) is what belongs to shareholders alone. Enterprise value is the value of the operating asset regardless of how it is financed: what all capital providers (shareholders + lenders) would pay. EV is therefore the right basis to compare companies with different debt structures."}},{"heading":{"fr":"La formule du bridge","en":"The bridge formula"},"body":{"fr":"[[Enterprise Value]] = [[equity value]] + dette nette + [[minority interest]] (intérêts minoritaires) − participations mises en équivalence (associés) + provisions / engagements de retraite + dettes de location ([[leases]]) + actions de préférence ([[preferred stock]]). Chaque ligne ajoute une autre source de financement de l'actif (on ajoute) ou retire un actif non opérationnel déjà compté ailleurs (on soustrait).","en":"Enterprise Value = equity value + net debt + minority interest − equity-method investments (associates) + provisions / pension liabilities + lease liabilities + preferred stock. Each line adds another source of financing of the asset (we add) or removes a non-operating asset already counted elsewhere (we subtract)."}},{"heading":{"fr":"Pourquoi on ajoute la dette nette","en":"Why we add net debt"},"body":{"fr":"La dette nette = dette financière brute − trésorerie et équivalents. On l'ajoute car la dette est financée par les créanciers, qui ont aussi un droit sur l'actif économique ; la trésorerie est soustraite car c'est un actif non opérationnel qui pourrait servir à rembourser la dette. Les intérêts minoritaires s'ajoutent car le compte de résultat consolide 100 % de filiales détenues partiellement.","en":"Net debt = gross financial debt − cash and equivalents. We add it because debt is provided by lenders who also have a claim on the operating asset; cash is subtracted because it is a non-operating asset that could repay debt. Minority interest is added because the income statement consolidates 100% of partly-owned subsidiaries."}},{"heading":{"fr":"Cohérence multiple / numérateur","en":"Multiple / numerator consistency"},"body":{"fr":"Un multiple d'EV (EV/EBITDA, EV/Sales, EV/EBIT) se compare à un agrégat avant charges financières. Un multiple d'equity (P/E, P/B) se compare à un agrégat après charges financières (résultat net). Mélanger les deux — par exemple EV/résultat net — n'a aucun sens financier.","en":"An EV multiple (EV/EBITDA, EV/Sales, EV/EBIT) maps to a metric before financing charges. An equity multiple (P/E, P/B) maps to a metric after financing charges (net income). Mixing them — e.g. EV/net income — is financially meaningless."}}],"exempleChiffre":{"title":{"fr":"Exemple chiffré","en":"Worked example"},"body":{"fr":"Une mid-cap française a une [[equity value]] de 1 000 M€. Dette financière brute 450, trésorerie 150 → dette nette 300. Intérêts minoritaires 50. Participations mises en équivalence 40. Provisions retraites 60. Dettes de [[leases]] (IFRS 16) 80. Actions de préférence 20. EV = 1000 + 300 + 50 − 40 + 60 + 80 + 20 = 1 470 M€. Noter que le BFR (besoin en fonds de roulement) n'apparaît nulle part.","en":"A French mid-cap has equity value of EUR 1,000m. Gross financial debt 450, cash 150 → net debt 300. Minority interest 50. Equity-method investments 40. Pension provisions 60. Lease liabilities (IFRS 16) 80. Preferred stock 20. EV = 1000 + 300 + 50 − 40 + 60 + 80 + 20 = EUR 1,470m. Note that working capital appears nowhere."},"figures":[{"caption":{"fr":"Bridge equity value → enterprise value (M€)","en":"Equity value → enterprise value bridge (EURm)"},"columns":["Ligne / Line","Signe / Sign","Montant / Amount"],"rows":[["Equity value","=","1 000"],["Dette nette / Net debt","+","300"],["Intérêts minoritaires / Minority interest","+","50"],["Mises en équivalence / Associates","−","40"],["Provisions retraites / Pensions","+","60"],["Leases (IFRS 16)","+","80"],["Actions de préférence / Preferred","+","20"],["Enterprise Value","=","1 470"]]}]},"piegesEntretien":[{"fr":"Le BFR (working capital) n'est PAS un élément du bridge : il fait partie de l'actif opérationnel déjà capté par l'EBITDA, on ne l'ajoute jamais.","en":"Working capital is NOT a bridge item: it is part of the operating asset already captured by EBITDA — never add it."},{"fr":"Confondre dette brute et dette nette : on soustrait la trésorerie. Oublier la trésorerie surévalue l'EV.","en":"Confusing gross and net debt: cash must be subtracted. Forgetting cash overstates EV."},{"fr":"Oublier d'ajouter les intérêts minoritaires alors que l'EBITDA consolide 100 % de la filiale : l'EV serait sous-estimée.","en":"Forgetting to add minority interest while EBITDA consolidates 100% of the subsidiary: EV would be understated."},{"fr":"Depuis IFRS 16, les dettes de [[leases]] sont souvent intégrées à la dette nette : vérifier la définition retenue par la cible pour ne pas double-compter.","en":"Since IFRS 16, lease liabilities are often folded into net debt: check the target's definition to avoid double-counting."},{"fr":"Croire que l'EV change quand la société rembourse de la dette avec sa trésorerie : non, la dette nette est inchangée donc l'EV aussi.","en":"Thinking EV changes when a company repays debt with its cash: it does not — net debt is unchanged, so is EV."}],"synthese":{"fr":"• EV = equity value + dette nette + minoritaires − associés + provisions + leases + préférentielles.\n• On ajoute les autres claims sur l'actif, on soustrait les actifs non opérationnels.\n• Le BFR n'entre JAMAIS dans le bridge.\n• Multiple d'EV ↔ agrégat avant frais financiers ; multiple d'equity ↔ agrégat après.\n• Dette NETTE, pas brute.","en":"• EV = equity value + net debt + minorities − associates + provisions + leases + preferred.\n• Add other claims on the asset, subtract non-operating assets.\n• Working capital NEVER enters the bridge.\n• EV multiple ↔ pre-financing metric; equity multiple ↔ post-financing.\n• NET debt, not gross."}},"glossaryRefs":["enterprise-value","equity-value","net-debt","minority-interest"]},{"id":"mod.l2.diluted-shares","type":"module","level":2,"topic":"Valuation","tags":["Valuation","diluted shares","treasury stock method"],"difficulty":2,"source":{"flag":"VERIFIED","ref":"BIWS equity value guide + Vernimmen"},"title":{"fr":"Actions diluées & treasury stock method","en":"Diluted shares & treasury stock method"},"objective":{"fr":"Calculer un nombre d'actions pleinement diluées avec la treasury stock method et en déduire l'equity value.","en":"Compute a fully diluted share count with the treasury stock method and derive equity value."},"estMinutes":13,"prerequisites":["mod.l2.ev-bridge"],"content":{"contexte":{"fr":"L'[[equity value]] d'une cotée n'est pas seulement « cours × actions de base ». Les options, BSA et obligations convertibles dans la monnaie créent des actions supplémentaires : il faut un nombre d'actions pleinement diluées ([[fully diluted shares]]). C'est un classique d'entretien et une erreur fréquente qui fausse tout multiple par action.","en":"A listed company's equity value is not just 'price × basic shares'. In-the-money options, warrants and convertibles create extra shares: you need a fully diluted share count. It is an interview classic and a frequent error that distorts every per-share multiple."},"concepts":[{"heading":{"fr":"Actions de base vs diluées","en":"Basic vs diluted shares"},"body":{"fr":"Les actions de base sont les actions émises moins l'auto-détention ([[treasury stock]] — actions rachetées par la société, qui ne portent ni droit de vote ni dividende). Les [[fully diluted shares]] ajoutent l'effet net des instruments dilutifs dans la monnaie.","en":"Basic shares are issued shares less treasury stock (shares repurchased by the company, carrying no voting or dividend rights). Fully diluted shares add the net effect of in-the-money dilutive instruments."}},{"heading":{"fr":"La treasury stock method (TSM)","en":"The treasury stock method (TSM)"},"body":{"fr":"Pour les options/BSA dans la monnaie : on suppose que les détenteurs exercent (la société reçoit le prix d'exercice = strike × nombre), puis que la société rachète des actions au cours de marché avec ce produit. Actions nettes créées = options × (cours − strike) / cours. Seules comptent les options dont le strike < cours ([[in the money]]).","en":"For in-the-money options/warrants: holders are assumed to exercise (the company receives the strike proceeds = strike × count), then the company buys back shares at market price with those proceeds. Net new shares = options × (price − strike) / price. Only options with strike < price (in the money) count."}},{"heading":{"fr":"Obligations convertibles","en":"Convertible bonds"},"body":{"fr":"Une convertible dans la monnaie (cours > prix de conversion) est traitée en « if-converted » : on ajoute toutes les actions issues de la conversion. Hors de la monnaie, elle reste de la dette (et figure dans la dette nette du bridge EV).","en":"An in-the-money convertible (price > conversion price) is treated 'if-converted': add all the shares from conversion. Out of the money, it stays as debt (and sits in net debt within the EV bridge)."}},{"heading":{"fr":"Du nombre d'actions à l'equity value","en":"From share count to equity value"},"body":{"fr":"Une fois le nombre d'actions pleinement diluées obtenu, [[equity value]] = actions diluées × cours. C'est ce nombre qu'on utilise pour les multiples par action et pour remonter à l'EV via le bridge.","en":"Once the fully diluted count is obtained, equity value = diluted shares × price. This is the count used for per-share multiples and to build up to EV via the bridge."}}],"exempleChiffre":{"title":{"fr":"Exemple chiffré","en":"Worked example"},"body":{"fr":"Société avec 100 actions émises et 5 actions auto-détenues → 95 actions de base. Cours = 10 €. Options : 20 au strike 5 (dans la monnaie). Produit d'exercice = 20 × 5 = 100 €. Rachat = 100 / 10 = 10 actions. Actions nettes TSM = 20 − 10 = +10 (ou 20 × (10−5)/10 = 10). Convertibles : 10 actions au prix de conversion 8 < 10, dans la monnaie → +10. Actions pleinement diluées = 95 + 10 + 10 = 115. [[Equity value]] = 115 × 10 = 1 150 €.","en":"A company with 100 issued and 5 treasury shares → 95 basic shares. Price = EUR 10. Options: 20 at strike 5 (in the money). Exercise proceeds = 20 × 5 = 100. Buyback = 100 / 10 = 10 shares. Net TSM shares = 20 − 10 = +10 (or 20 × (10−5)/10 = 10). Convertibles: 10 shares at conversion price 8 < 10, in the money → +10. Fully diluted shares = 95 + 10 + 10 = 115. Equity value = 115 × 10 = EUR 1,150."},"figures":[{"caption":{"fr":"Calcul des actions pleinement diluées","en":"Fully diluted share count"},"columns":["Élément / Item","Détail / Detail","Actions / Shares"],"rows":[["Actions émises / Issued","—","100"],["Auto-détention / Treasury","− 5","−5"],["Actions de base / Basic","—","95"],["Options (TSM)","20 − (20×5)/10","+10"],["Convertibles (if-converted)","10 @ 8 < 10","+10"],["Diluées / Diluted","—","115"],["Equity value","115 × 10 €","1 150 €"]]}]},"piegesEntretien":[{"fr":"Compter les options hors de la monnaie (strike > cours) : elles n'ajoutent rien, on les ignore.","en":"Counting out-of-the-money options (strike > price): they add nothing, ignore them."},{"fr":"Ajouter les 20 options brutes au lieu des 10 nettes : la TSM neutralise le produit d'exercice par un rachat.","en":"Adding the 20 gross options instead of 10 net: TSM offsets exercise proceeds with a buyback."},{"fr":"Oublier de retirer l'auto-détention ([[treasury stock]]) des actions de base.","en":"Forgetting to remove treasury stock from basic shares."},{"fr":"Traiter une convertible hors de la monnaie comme des actions : non, elle reste de la dette.","en":"Treating an out-of-the-money convertible as shares: no, it stays debt."},{"fr":"Utiliser un cours moyen pour les options et le cours spot pour l'equity value : rester cohérent sur le prix.","en":"Using an average price for options and spot for equity value: stay consistent on price."}],"synthese":{"fr":"• Actions de base = émises − auto-détention.\n• TSM (options dans la monnaie) : nettes = options × (cours − strike)/cours.\n• Convertibles dans la monnaie : if-converted, +toutes les actions ; sinon dette.\n• Diluées = base + options nettes + convertibles.\n• Equity value = diluées × cours.","en":"• Basic shares = issued − treasury.\n• TSM (in-the-money options): net = options × (price − strike)/price.\n• In-the-money convertibles: if-converted, +all shares; otherwise debt.\n• Diluted = basic + net options + convertibles.\n• Equity value = diluted × price."}},"glossaryRefs":["treasury-stock","treasury-stock-method","fully-diluted-shares","in-the-money"]},{"id":"mod.l2.tvm","type":"module","level":2,"topic":"DCF","tags":["DCF","TVM","NPV","IRR"],"difficulty":2,"source":{"flag":"VERIFIED","ref":"Vernimmen + BIWS time value of money"},"title":{"fr":"Valeur temps de l'argent","en":"Time value of money"},"objective":{"fr":"Maîtriser PV/FV, NPV, IRR et la formule de perpétuité Valeur = CF/(r−g) pour actualiser des flux.","en":"Master PV/FV, NPV, IRR and the perpetuity formula Value = CF/(r−g) to discount cash flows."},"estMinutes":13,"prerequisites":[],"content":{"contexte":{"fr":"Toute la finance d'entreprise repose sur une idée : un euro aujourd'hui vaut plus qu'un euro demain. C'est le socle du DCF, du calcul de TRI d'un LBO et de toute valorisation par les flux. Sans la valeur temps de l'argent, impossible de comparer une [[terminal value]] à un flux de l'année 1.","en":"All of corporate finance rests on one idea: a euro today is worth more than a euro tomorrow. It is the foundation of the DCF, of LBO IRR and of any cash-flow valuation. Without the time value of money you cannot compare a terminal value to a year-1 cash flow."},"concepts":[{"heading":{"fr":"PV et FV","en":"PV and FV"},"body":{"fr":"La valeur future (FV) d'un montant aujourd'hui : FV = PV × (1+r)^n. La valeur présente (PV) actualise un flux futur : PV = FV / (1+r)^n. Le taux r est le coût d'opportunité du capital ; n le nombre de périodes. Plus r ou n est grand, plus la PV est faible.","en":"The future value (FV) of an amount today: FV = PV × (1+r)^n. The present value (PV) discounts a future cash flow: PV = FV / (1+r)^n. The rate r is the opportunity cost of capital; n the number of periods. The higher r or n, the lower the PV."}},{"heading":{"fr":"NPV (valeur actuelle nette)","en":"NPV (net present value)"},"body":{"fr":"Le [[NPV]] est la somme des flux futurs actualisés moins l'investissement initial : NPV = Σ CFt/(1+r)^t − I0. Règle de décision : si NPV > 0, le projet crée de la valeur. C'est le critère théoriquement supérieur car il s'exprime en euros et suppose un réinvestissement au taux r.","en":"NPV is the sum of discounted future cash flows minus the initial investment: NPV = Σ CFt/(1+r)^t − I0. Decision rule: if NPV > 0, the project creates value. It is the theoretically superior criterion because it is expressed in euros and assumes reinvestment at rate r."}},{"heading":{"fr":"IRR (taux de rentabilité interne)","en":"IRR (internal rate of return)"},"body":{"fr":"L'[[IRR]] est le taux qui annule la NPV. C'est le rendement annualisé d'un projet. En LBO, pour un investissement simple en entrée/sortie : IRR = MoM^(1/n) − 1. L'IRR souffre de limites (taux multiples, hypothèse de réinvestissement à l'IRR) que la NPV n'a pas.","en":"IRR is the rate that sets NPV to zero. It is the project's annualised return. In an LBO, for a single in/out investment: IRR = MoM^(1/n) − 1. IRR has limits (multiple roots, reinvestment-at-IRR assumption) that NPV does not."}},{"heading":{"fr":"Perpétuité : Valeur = CF/(r−g)","en":"Perpetuity: Value = CF/(r−g)"},"body":{"fr":"La formule maîtresse : la valeur d'un flux perpétuel croissant au taux g, actualisé à r, vaut Valeur = CF/(r−g), valable uniquement si g < r. C'est l'ossature de la [[terminal value]] de Gordon en DCF. Quand g → r, la valeur explose vers l'infini, ce qui révèle la sensibilité extrême du modèle.","en":"The master formula: the value of a perpetual cash flow growing at g, discounted at r, equals Value = CF/(r−g), valid only if g < r. It is the backbone of the Gordon terminal value in a DCF. As g → r the value explodes to infinity, revealing the model's extreme sensitivity."}}],"exempleChiffre":{"title":{"fr":"Exemple chiffré","en":"Worked example"},"body":{"fr":"Soit r = 10 %. Une perpétuité sans croissance de 100 €/an : Valeur = 100 / 10 % = 1 000 €. La même avec g = 3 % : Valeur = 100 / (10 % − 3 %) = 100 / 7 % = 1 429 €. Un flux de 200 €/an avec g = 4 % : Valeur = 200 / (10 % − 4 %) = 200 / 6 % = 3 333 €. On voit que la croissance g augmente fortement la valeur en réduisant le dénominateur.","en":"Let r = 10%. A no-growth perpetuity of EUR 100/yr: Value = 100 / 10% = EUR 1,000. The same with g = 3%: Value = 100 / (10% − 3%) = 100 / 7% = EUR 1,429. A EUR 200/yr cash flow with g = 4%: Value = 200 / (10% − 4%) = 200 / 6% = EUR 3,333. Growth g sharply raises value by shrinking the denominator."},"figures":[{"caption":{"fr":"Valeur = CF/(r−g), r = 10 %","en":"Value = CF/(r−g), r = 10%"},"columns":["CF (€)","g","r − g","Valeur / Value (€)"],"rows":[["100","0 %","10 %","1 000"],["100","3 %","7 %","1 429"],["200","4 %","6 %","3 333"]]}]},"piegesEntretien":[{"fr":"Appliquer Valeur = CF/(r−g) avec g ≥ r : la formule diverge et n'a plus de sens financier.","en":"Applying Value = CF/(r−g) with g ≥ r: the formula diverges and is financially meaningless."},{"fr":"Oublier d'actualiser la [[terminal value]] elle-même jusqu'à aujourd'hui : elle est en valeur de l'année n.","en":"Forgetting to discount the terminal value itself back to today: it is expressed at year n."},{"fr":"Préférer l'[[IRR]] à la [[NPV]] sans nuance : l'IRR suppose un réinvestissement au taux IRR, souvent irréaliste.","en":"Preferring IRR over NPV without nuance: IRR assumes reinvestment at the IRR rate, often unrealistic."},{"fr":"Confondre le CF de l'année en cours et le CF de l'année +1 dans Gordon (le numérateur est CF×(1+g)).","en":"Confusing the current-year CF and the year+1 CF in Gordon (the numerator is CF×(1+g))."},{"fr":"Utiliser un taux d'actualisation incohérent avec le flux (nominal vs réel, après impôt vs avant).","en":"Using a discount rate inconsistent with the cash flow (nominal vs real, after-tax vs pre-tax)."}],"synthese":{"fr":"• PV = FV/(1+r)^n ; FV = PV×(1+r)^n.\n• NPV = Σ CFt/(1+r)^t − I0 ; investir si NPV > 0.\n• IRR annule la NPV ; en LBO simple IRR = MoM^(1/n) − 1.\n• Perpétuité : Valeur = CF/(r−g), seulement si g < r.\n• 100/10 % = 1 000 ; 100/7 % = 1 429 ; 200/6 % = 3 333.","en":"• PV = FV/(1+r)^n; FV = PV×(1+r)^n.\n• NPV = Σ CFt/(1+r)^t − I0; invest if NPV > 0.\n• IRR sets NPV to zero; simple LBO IRR = MoM^(1/n) − 1.\n• Perpetuity: Value = CF/(r−g), only if g < r.\n• 100/10% = 1,000; 100/7% = 1,429; 200/6% = 3,333."}},"glossaryRefs":["npv","irr","terminal-value","discount-rate"]},{"id":"mod.l3.dcf","type":"module","level":3,"topic":"DCF","tags":["DCF","WACC","valuation","FCFF"],"difficulty":3,"source":{"flag":"VERIFIED","ref":"BIWS DCF guide + Vernimmen"},"title":{"fr":"DCF en 6 étapes","en":"DCF in 6 steps"},"objective":{"fr":"Construire une valorisation DCF de bout en bout : projeter les flux, les actualiser, ajouter la valeur terminale et passer de l'Enterprise Value à l'equity value.","en":"Build a DCF valuation end to end: project cash flows, discount them, add terminal value, and bridge from Enterprise Value to equity value."},"estMinutes":16,"prerequisites":["mod.l2.tvm"],"content":{"contexte":{"fr":"Le DCF est la valorisation intrinsèque de référence en banque d'affaires et en private equity : il sert d'ancrage face aux multiples et de pilier dans tout comité d'investissement. En entretien, on attend que vous récitiez les 6 étapes sans hésiter et que vous sachiez où se cachent les leviers de valeur.","en":"The DCF is the reference intrinsic valuation in investment banking and private equity: it anchors the analysis against multiples and is a pillar in every investment committee. In interviews, you are expected to recite the 6 steps without hesitation and to know where the value levers hide."},"concepts":[{"heading":{"fr":"Les 6 étapes","en":"The 6 steps"},"body":{"fr":"1) Projeter le [[FCFF]] (free cash flow to firm) sur l'horizon explicite (5–10 ans). 2) Estimer le [[WACC]]. 3) Actualiser chaque flux au WACC. 4) Calculer la valeur terminale. 5) Sommer flux actualisés + valeur terminale actualisée = [[Enterprise Value]]. 6) Passer de l'EV à l'[[equity value]] via le bridge dette nette. Ne jamais inverser l'ordre ni oublier d'actualiser la valeur terminale.","en":"1) Project [[FCFF]] (free cash flow to firm) over the explicit horizon (5–10 years). 2) Estimate the [[WACC]]. 3) Discount each cash flow at the WACC. 4) Compute the terminal value. 5) Sum discounted flows + discounted terminal value = [[Enterprise Value]]. 6) Bridge from EV to [[equity value]] via net debt. Never reverse the order and never forget to discount the terminal value."}},{"heading":{"fr":"Le FCFF","en":"FCFF"},"body":{"fr":"[[FCFF]] = EBIT × (1 − impôt) + D&A − capex − Δ BFR. C'est un flux pré-financement (avant intérêts), donc on l'actualise au [[WACC]] et non au coût des fonds propres. L'impôt utilisé est l'impôt normatif : en France l'IS est ~25%. Un flux unlevered actualisé au coût des fonds propres est l'erreur la plus fréquente.","en":"[[FCFF]] = EBIT × (1 − tax) + D&A − capex − ΔNWC. It is a pre-financing cash flow (before interest), so it is discounted at the [[WACC]], not at the cost of equity. The tax used is the normative rate: French corporate tax is ~25%. Discounting an unlevered flow at the cost of equity is the most common mistake."}},{"heading":{"fr":"Actualisation","en":"Discounting"},"body":{"fr":"Chaque flux de l'année n est divisé par (1 + WACC)^n. Les flux lointains pèsent moins ; c'est pourquoi la valeur terminale représente souvent 60–80% de l'EV. On utilise par convention la fin de période (ou la mid-year convention pour lisser, ce qui augmente légèrement la valeur).","en":"Each year-n cash flow is divided by (1 + WACC)^n. Distant flows weigh less, which is why the terminal value often represents 60–80% of EV. End-of-period discounting is the convention (or mid-year convention to smooth, which slightly raises value)."}},{"heading":{"fr":"Du EV à l'equity value","en":"From EV to equity value"},"body":{"fr":"[[equity value]] = [[Enterprise Value]] − dette nette − intérêts minoritaires − provisions assimilées à de la dette + participations non consolidées. La dette nette = dette financière − trésorerie. Confondre EV et equity value est rédhibitoire en entretien.","en":"[[equity value]] = [[Enterprise Value]] − net debt − minority interests − debt-like provisions + non-consolidated stakes. Net debt = financial debt − cash. Confusing EV and equity value is a deal-breaker in interviews."}}],"exempleChiffre":{"title":{"fr":"Exemple chiffré","en":"Worked example"},"body":{"fr":"Trois flux de FCFF (100, 120, 140) actualisés à un WACC de 10%. Année 1 : 100 / 1,1 ≈ 91. Année 2 : 120 / 1,1² ≈ 99. Année 3 : 140 / 1,1³ ≈ 105. Somme des flux explicites actualisés ≈ 295 (hors valeur terminale, qui s'ajouterait pour obtenir l'EV complète).","en":"Three FCFF flows (100, 120, 140) discounted at a 10% WACC. Year 1: 100 / 1.1 ≈ 91. Year 2: 120 / 1.1² ≈ 99. Year 3: 140 / 1.1³ ≈ 105. Sum of discounted explicit flows ≈ 295 (excluding terminal value, which would be added to reach the full EV)."},"figures":[{"caption":{"fr":"Actualisation des flux explicites (WACC 10%)","en":"Discounting explicit flows (WACC 10%)"},"columns":["Année / Year","FCFF","Facteur / Factor","Valeur actuelle / PV"],"rows":[["1","100","1,10","91"],["2","120","1,21","99"],["3","140","1,331","105"],["Somme / Sum","","","295"]]}]},"piegesEntretien":[{"fr":"Actualiser le FCFF (flux unlevered) au coût des fonds propres au lieu du WACC : grossière erreur.","en":"Discounting FCFF (an unlevered flow) at the cost of equity instead of the WACC: a gross error."},{"fr":"Oublier d'actualiser la valeur terminale, qui tombe à la fin de l'horizon explicite et doit donc être ramenée à aujourd'hui.","en":"Forgetting to discount the terminal value, which falls at the end of the explicit horizon and must be brought back to today."},{"fr":"Confondre Enterprise Value et equity value : le DCF du FCFF donne d'abord l'EV, pas la valeur des fonds propres.","en":"Confusing Enterprise Value and equity value: an FCFF DCF first yields EV, not equity value."},{"fr":"Utiliser un taux d'impôt obsolète (33% ou 40%) au lieu de l'IS français ~25%.","en":"Using an outdated tax rate (33% or 40%) instead of the French ~25% corporate rate."},{"fr":"Doublement compter les éléments du bridge (déduire la dette puis re-déduire les intérêts déjà absents du FCFF).","en":"Double-counting bridge items (deducting debt then re-deducting interest already absent from FCFF)."}],"synthese":{"fr":"• 6 étapes : projeter FCFF → WACC → actualiser → TV → somme = EV → bridge = equity value. • FCFF est unlevered → WACC. • La TV pèse souvent 60–80% de l'EV. • IS France ~25%. • EV ≠ equity value.","en":"• 6 steps: project FCFF → WACC → discount → TV → sum = EV → bridge = equity value. • FCFF is unlevered → WACC. • TV often weighs 60–80% of EV. • French tax ~25%. • EV ≠ equity value."}},"glossaryRefs":["fcff","wacc","enterprise-value","equity-value","terminal-value"]},{"id":"mod.l3.wacc","type":"module","level":3,"topic":"WACC","tags":["WACC","CAPM","beta","DCF"],"difficulty":3,"source":{"flag":"VERIFIED","ref":"Vernimmen + BIWS WACC guide"},"title":{"fr":"WACC & CAPM","en":"WACC & CAPM"},"objective":{"fr":"Calculer un coût moyen pondéré du capital, estimer le coût des fonds propres par le CAPM et savoir délever/relever un bêta.","en":"Compute a weighted average cost of capital, estimate the cost of equity via CAPM, and unlever/relever a beta."},"estMinutes":15,"prerequisites":["mod.l3.dcf"],"content":{"contexte":{"fr":"Le WACC est le taux d'actualisation du DCF : une erreur de 1 point peut faire bouger la valorisation de 10–20%. Le jury teste votre maîtrise du CAPM et du delevering/relevering du bêta, qui séparent ceux qui récitent une formule de ceux qui la comprennent.","en":"The WACC is the DCF discount rate: a 1-point error can move valuation by 10–20%. Interviewers test your command of CAPM and of beta unlevering/relevering, which separates those who recite a formula from those who understand it."},"concepts":[{"heading":{"fr":"Formule du WACC","en":"WACC formula"},"body":{"fr":"[[WACC]] = E/V · Re + D/V · Rd · (1 − T), où E = valeur de marché des fonds propres, D = dette, V = E + D, Re = coût des fonds propres, Rd = coût de la dette, T = taux d'impôt. Le (1 − T) capte la déductibilité fiscale des intérêts (tax shield). En France T ≈ 25%.","en":"[[WACC]] = E/V · Re + D/V · Rd · (1 − T), where E = market value of equity, D = debt, V = E + D, Re = cost of equity, Rd = cost of debt, T = tax rate. The (1 − T) captures the tax deductibility of interest (tax shield). In France T ≈ 25%."}},{"heading":{"fr":"Le CAPM","en":"CAPM"},"body":{"fr":"[[CAPM]] : Re = Rf + [[beta]] · (Rm − Rf). Rf = taux sans risque (OAT/Bund 10 ans), (Rm − Rf) = prime de risque actions ou ERP (réaliste 4–6%), beta = sensibilité au marché. Un beta > 1 amplifie le marché, < 1 l'amortit.","en":"[[CAPM]]: Re = Rf + [[beta]] · (Rm − Rf). Rf = risk-free rate (10-year OAT/Bund), (Rm − Rf) = equity risk premium or ERP (realistic 4–6%), beta = sensitivity to the market. A beta > 1 amplifies the market, < 1 dampens it."}},{"heading":{"fr":"Delevering / relevering du bêta","en":"Unlevering / relevering beta"},"body":{"fr":"Le bêta observé (levered) reflète le levier financier de l'entreprise. Pour comparer des sociétés, on délève : βu = βL / (1 + (1 − T) · D/E). On relève ensuite au levier cible de la société analysée. Oublier de délever les comparables fausse complètement le coût des fonds propres.","en":"The observed (levered) beta reflects the firm's financial leverage. To compare companies, you unlever: βu = βL / (1 + (1 − T) · D/E). You then relever to the target's capital structure. Forgetting to unlever comparables completely distorts the cost of equity."}},{"heading":{"fr":"WACC en U","en":"U-shaped WACC"},"body":{"fr":"Le WACC n'est PAS une fonction monotone décroissante du levier. Au début, ajouter de la dette (moins chère, déductible) baisse le WACC ; mais au-delà d'un point, le risque de défaut renchérit dette ET fonds propres, et le WACC remonte. La courbe a une forme en U avec un minimum à la structure optimale.","en":"The WACC is NOT a monotonically decreasing function of leverage. Initially, adding debt (cheaper, deductible) lowers the WACC; but beyond a point, default risk raises the cost of both debt AND equity, and the WACC rises again. The curve is U-shaped with a minimum at the optimal capital structure."}}],"exempleChiffre":{"title":{"fr":"Exemple chiffré","en":"Worked example"},"body":{"fr":"CAPM : avec Rf = 1%, beta = 1,5 et ERP = (3% − 1%) = 2%, Re = 1% + 1,5 × (3% − 1%) = 1% + 3% = 4%. WACC : avec un coût des fonds propres de 5% et un coût de la dette après impôt de 2%, pour une société financée 50/50, WACC = 0,5 × 5% + 0,5 × ... ; dans l'exemple simplifié coût equity 5% + coût dette après impôt 2% donnent un WACC illustratif de 7%.","en":"CAPM: with Rf = 1%, beta = 1.5 and ERP = (3% − 1%) = 2%, Re = 1% + 1.5 × (3% − 1%) = 1% + 3% = 4%. WACC: with a cost of equity of 5% and an after-tax cost of debt of 2%, the illustrative example combines a 5% cost of equity and a 2% after-tax cost of debt for an illustrative WACC of 7%."},"figures":[{"caption":{"fr":"Décomposition CAPM et WACC","en":"CAPM and WACC breakdown"},"columns":["Composant / Component","Valeur / Value"],"rows":[["Rf","1%"],["beta","1,5"],["ERP (Rm − Rf)","2%"],["Re = Rf + β·ERP","4%"],["Coût equity / Cost of equity","5%"],["Coût dette après impôt / After-tax cost of debt","2%"],["WACC illustratif / illustrative","7%"]]}]},"piegesEntretien":[{"fr":"Oublier de délever le bêta des comparables avant de le relever au levier cible.","en":"Forgetting to unlever comparables' beta before relevering to the target's leverage."},{"fr":"Croire que plus on s'endette, plus le WACC baisse : la courbe est en U, pas monotone décroissante.","en":"Believing more debt always lowers the WACC: the curve is U-shaped, not monotonically decreasing."},{"fr":"Utiliser une prime de risque irréaliste (10%+) : l'ERP réaliste est de l'ordre de 4–6%.","en":"Using an unrealistic risk premium (10%+): a realistic ERP is around 4–6%."},{"fr":"Appliquer le tax shield au coût des fonds propres : le (1 − T) ne s'applique qu'au coût de la dette.","en":"Applying the tax shield to the cost of equity: the (1 − T) only applies to the cost of debt."},{"fr":"Utiliser les valeurs comptables au lieu des valeurs de marché pour pondérer E et D.","en":"Using book values instead of market values to weight E and D."}],"synthese":{"fr":"• WACC = E/V·Re + D/V·Rd·(1−T). • CAPM : Re = Rf + β·(Rm−Rf). • βu = βL/(1+(1−T)·D/E). • ERP réaliste 4–6%, IS France ~25%. • Le WACC est en U : il a un minimum, il ne baisse pas indéfiniment.","en":"• WACC = E/V·Re + D/V·Rd·(1−T). • CAPM: Re = Rf + β·(Rm−Rf). • βu = βL/(1+(1−T)·D/E). • Realistic ERP 4–6%, French tax ~25%. • WACC is U-shaped: it has a minimum, it does not fall indefinitely."}},"glossaryRefs":["wacc","capm","beta","erp"]},{"id":"mod.l3.terminal-value","type":"module","level":3,"topic":"DCF","tags":["DCF","terminal-value","Gordon","valuation"],"difficulty":3,"source":{"flag":"VERIFIED","ref":"BIWS DCF guide + Vernimmen"},"title":{"fr":"Valeur terminale","en":"Terminal value"},"objective":{"fr":"Calculer une valeur terminale par la méthode de Gordon et par le multiple de sortie, et vérifier la cohérence du taux de croissance implicite.","en":"Compute a terminal value via the Gordon growth and the exit-multiple methods, and sanity-check the implied growth rate."},"estMinutes":14,"prerequisites":["mod.l3.dcf","mod.l3.wacc"],"content":{"contexte":{"fr":"La valeur terminale représente souvent 60–80% de l'EV d'un DCF : c'est le poste le plus sensible et le plus discuté en comité. Le jury vérifie que vous savez la calculer des deux façons et surtout que vous contrôlez le taux de croissance perpétuel implicite.","en":"Terminal value often represents 60–80% of a DCF's EV: it is the most sensitive and most debated line in committee. Interviewers check that you can compute it both ways and, above all, that you control the implied perpetual growth rate."},"concepts":[{"heading":{"fr":"Méthode de Gordon","en":"Gordon growth method"},"body":{"fr":"TV = FCF · (1 + g) / (WACC − g), où g est le taux de croissance perpétuel. Cette TV tombe à la fin de l'horizon explicite et doit ensuite être actualisée à aujourd'hui. Le dénominateur (WACC − g) rend la formule très sensible : un petit g rapproché du WACC fait exploser la valeur.","en":"TV = FCF · (1 + g) / (WACC − g), where g is the perpetual growth rate. This TV falls at the end of the explicit horizon and must then be discounted back to today. The denominator (WACC − g) makes the formula very sensitive: a g pushed close to the WACC blows up the value."}},{"heading":{"fr":"Multiple de sortie","en":"Exit multiple method"},"body":{"fr":"TV = multiple terminal × métrique de la dernière année (souvent EBITDA). Exemple : 10x EBITDA sur un EBITDA de 500 donne TV = 5 000. On choisit un multiple cohérent avec les comparables actuels, sans surenchérir. C'est la méthode préférée des banquiers car ancrée sur le marché.","en":"TV = terminal multiple × last-year metric (often EBITDA). Example: 10x EBITDA on a 500 EBITDA gives TV = 5,000. The multiple is chosen consistently with current comparables, without overreaching. Bankers prefer this method because it is anchored on the market."}},{"heading":{"fr":"Le g implicite","en":"Implied growth"},"body":{"fr":"Quelle que soit la méthode, vérifiez le g implicite : g = WACC − FCF·(1+g)/TV (approximé g ≈ WACC − FCF/TV). Un g raisonnable est inférieur à la croissance du PIB long terme (~2%). Un g supérieur impliquerait que l'entreprise dépasse l'économie pour l'éternité — impossible.","en":"Whatever the method, check the implied g: g = WACC − FCF·(1+g)/TV (approximated g ≈ WACC − FCF/TV). A reasonable g is below long-term GDP growth (~2%). A higher g would imply the firm outgrows the entire economy forever — impossible."}}],"exempleChiffre":{"title":{"fr":"Exemple chiffré — correction d'un g implicite","en":"Worked example — correcting an implied growth"},"body":{"fr":"On vous donne TV = 10 000 avec un FCF de 1 000 et un WACC de 10%. Vérifions le g implicite via la formule de Gordon : TV = FCF·(1+g)/(WACC−g). Si l'on néglige le (1+g) au numérateur, 10 000 = 1 000 / (0,10 − g) ⇒ 0,10 − g = 0,10 ⇒ g = 0%. La TV correspond donc à une croissance perpétuelle nulle. Or pour une entreprise pérenne on attend g ≈ 2% (croissance PIB) : avec g = 2%, TV = 1 000·1,02/(0,10 − 0,02) = 1 020 / 0,08 = 12 750. La TV de 10 000 était donc sous-évaluée d'environ 2 750 (~22%) par rapport à une hypothèse de croissance réaliste.","en":"You are given TV = 10,000 with FCF of 1,000 and a WACC of 10%. Let's check the implied g via Gordon: TV = FCF·(1+g)/(WACC−g). Neglecting the (1+g) numerator, 10,000 = 1,000 / (0.10 − g) ⇒ 0.10 − g = 0.10 ⇒ g = 0%. The TV thus corresponds to zero perpetual growth. But for a going concern we expect g ≈ 2% (GDP growth): with g = 2%, TV = 1,000·1.02/(0.10 − 0.02) = 1,020 / 0.08 = 12,750. The 10,000 TV was therefore undervalued by about 2,750 (~22%) versus a realistic growth assumption."},"figures":[{"caption":{"fr":"g implicite et correction (FCF 1 000, WACC 10%)","en":"Implied g and correction (FCF 1,000, WACC 10%)"},"columns":["Hypothèse / Assumption","g","TV"],"rows":[["TV donnée / given","0% (implicite)","10 000"],["Croissance PIB / GDP growth","2%","12 750"],["Multiple 10x EBITDA (EBITDA 500)","—","5 000"]]}]},"piegesEntretien":[{"fr":"Choisir un g supérieur à la croissance du PIB long terme (~2%) : économiquement impossible à perpétuité.","en":"Choosing a g above long-term GDP growth (~2%): economically impossible in perpetuity."},{"fr":"Oublier que la TV de Gordon tombe en fin d'horizon et doit encore être actualisée à aujourd'hui.","en":"Forgetting that the Gordon TV falls at the end of the horizon and must still be discounted back to today."},{"fr":"Ne pas vérifier le g implicite d'une TV par multiple : un multiple trop bas cache une croissance nulle voire négative.","en":"Not checking the implied g of a multiple-based TV: too low a multiple hides zero or even negative growth."},{"fr":"Mélanger un EBITDA de dernière année non normalisé avec le multiple de sortie.","en":"Mixing a non-normalized last-year EBITDA with the exit multiple."},{"fr":"Mettre g très proche du WACC, ce qui fait exploser artificiellement la valeur.","en":"Setting g very close to the WACC, which artificially blows up the value."}],"synthese":{"fr":"• Gordon : TV = FCF·(1+g)/(WACC−g). • Multiple : ex 10x EBITDA de 500 = 5 000. • Toujours vérifier le g implicite < croissance PIB (~2%). • La TV pèse 60–80% de l'EV. • La TV de Gordon doit être actualisée.","en":"• Gordon: TV = FCF·(1+g)/(WACC−g). • Multiple: e.g. 10x of a 500 EBITDA = 5,000. • Always check implied g < GDP growth (~2%). • TV weighs 60–80% of EV. • The Gordon TV must be discounted."}},"glossaryRefs":["terminal-value","wacc","fcff"]},{"id":"mod.l3.trading-comps","type":"module","level":3,"topic":"Valuation","tags":["Valuation","multiples","comparables","EV/EBITDA"],"difficulty":3,"source":{"flag":"VERIFIED","ref":"BIWS comps guide + Vernimmen"},"title":{"fr":"Multiples & comparables boursiers","en":"Trading multiples & comparables"},"objective":{"fr":"Construire une valorisation par les comparables boursiers, choisir les bons multiples et passer de l'EV à l'equity value.","en":"Build a valuation from trading comparables, pick the right multiples, and bridge from EV to equity value."},"estMinutes":15,"prerequisites":["mod.l3.dcf"],"content":{"contexte":{"fr":"Les comparables boursiers donnent une valeur de marché instantanée, complémentaire du DCF. Tout analyste M&A passe des heures à les construire ; le jury veut vérifier que vous choisissez les bons multiples, que vous nettoyez les outliers et que vous reliez co
