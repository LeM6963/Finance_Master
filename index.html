<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>PE/IB Mastery — Préparation entretiens Private Equity & Banque d'investissement</title>
<style>
:root{
  --accent:#E8743B; --accent-soft:#FCEDE4; --accent-ink:#B5481E;
  --gold:#C9A227; --green:#1E9E6A; --blue:#2F6FED; --violet:#7C5CE0; --red:#C0392B;
  --bg:#FAF8F4; --surface:#FFFFFF; --surface-2:#F4F1EA;
  --ink:#1B1A18; --ink-2:#54514B; --muted:#8A867E; --line:#ECE7DD;
  --shadow:0 1px 2px rgba(20,16,8,.04), 0 8px 24px rgba(20,16,8,.05);
  --radius:18px; --radius-sm:12px; --maxw:1180px;
}
[data-theme=dark]{
  --accent:#F2865A; --accent-soft:#3A2519; --accent-ink:#F6A782;
  --bg:#15140F; --surface:#1E1C17; --surface-2:#26241D;
  --ink:#F3F0E9; --ink-2:#C4BFB4; --muted:#8E8A7F; --line:#312E26;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
html,body{margin:0;min-height:100%;}
body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none;cursor:pointer;}
button{font:inherit;cursor:pointer;}
::selection{background:var(--accent-soft);}
h1,h2,h3,h4{letter-spacing:-.01em;}
.hidden{display:none !important;}

/* shell */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh;}
.sidebar{background:var(--surface);border-right:1px solid var(--line);padding:16px 14px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto;}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 14px;}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--gold));display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;flex:none;}
.brand b{font-size:14.5px;} .brand span{display:block;font-size:11px;color:var(--muted);}
.nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:14px 10px 6px;}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;color:var(--ink-2);font-weight:500;font-size:14px;}
.nav a:hover{background:var(--surface-2);color:var(--ink);}
.nav a.active{background:var(--accent-soft);color:var(--accent-ink);font-weight:600;}
.nav a .ic{width:18px;text-align:center;flex:none;}
.nav a .badge{margin-left:auto;font-size:11px;font-weight:700;background:var(--accent);color:#fff;border-radius:999px;padding:1px 7px;}
.side-foot{margin-top:auto;padding-top:10px;border-top:1px solid var(--line);}
.rankmini{display:flex;align-items:center;gap:10px;padding:8px 6px;}
.rankmini .av{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:16px;flex:none;}
.rankmini b{font-size:13px;display:block;} .rankmini span{font-size:11px;color:var(--muted);}

.main{display:flex;flex-direction:column;min-width:0;}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 24px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:saturate(140%) blur(10px);border-bottom:1px solid var(--line);}
.burger{display:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 11px;}
.search{flex:1;max-width:520px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 13px;color:var(--muted);font-size:14px;}
.search .kbd{margin-left:auto;font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:var(--surface-2);}
.tb-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:7px;}
.tb-btn:hover{color:var(--ink);}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.seg button{border:0;background:transparent;font-size:13px;font-weight:600;color:var(--muted);padding:8px 12px;}
.seg button.on{background:var(--accent-soft);color:var(--accent-ink);}

.content{padding:26px 24px 70px;max-width:var(--maxw);width:100%;margin:0 auto;}
.hello h1{font-size:25px;margin:0 0 2px;}
.hello p{color:var(--ink-2);margin:0 0 20px;}
.grid{display:grid;gap:18px;}
.cols-3{grid-template-columns:repeat(3,1fr);} .cols-2{grid-template-columns:1.4fr 1fr;} .cols-2e{grid-template-columns:1fr 1fr;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);}
.card h3{margin:0 0 2px;font-size:15px;} .card .cap{font-size:12px;color:var(--muted);margin:0 0 14px;}
.stat .v{font-size:30px;font-weight:750;} .stat .l{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;}
.flame{color:var(--accent);} .up{color:var(--green);font-size:12px;font-weight:700;}
.ladder{display:flex;align-items:center;gap:6px;margin-top:8px;}
.ladder .step{flex:1;height:6px;border-radius:999px;background:var(--surface-2);}
.ladder .step.done{background:linear-gradient(90deg,var(--accent),var(--gold));}
.ladder .step.cur{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.ranknames{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:8px;}
.ranknames b{color:var(--accent-ink);}
.ring{width:96px;height:96px;border-radius:50%;flex:none;display:grid;place-items:center;}
.ring .inner{width:74px;height:74px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center;}
.ring .inner b{font-size:20px;} .ring .inner span{font-size:10px;color:var(--muted);display:block;}
.goal-list{margin:0;padding:0;list-style:none;font-size:14px;}
.goal-list li{display:flex;align-items:center;gap:10px;padding:6px 0;color:var(--ink-2);}
.goal-list .chk{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:11px;flex:none;}
.goal-list .chk.done{background:var(--green);border-color:var(--green);color:#fff;}
.goal-list .done-txt{text-decoration:line-through;color:var(--muted);}
.mrow{display:flex;align-items:center;gap:12px;margin:11px 0;}
.mrow .name{width:130px;font-size:13.5px;font-weight:600;}
.mrow .track{flex:1;height:9px;background:var(--surface-2);border-radius:999px;overflow:hidden;}
.mrow .fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--gold));}
.mrow .pct{width:42px;text-align:right;font-size:12.5px;color:var(--muted);font-weight:700;}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;font-weight:700;border:0;border-radius:11px;padding:11px 16px;font-size:14px;}
.btn:hover{filter:brightness(1.05);} .btn.ghost{background:var(--surface-2);color:var(--ink);} .btn.sm{padding:7px 12px;font-size:13px;border-radius:9px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.due{display:flex;align-items:center;gap:14px;padding:11px 12px;border:1px solid var(--line);border-radius:13px;}
.due+.due{margin-top:9px;}
.tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;}
.due b{font-size:14px;} .due small{color:var(--muted);} .due .go{margin-left:auto;font-weight:700;color:var(--accent);}
.section-h{display:flex;align-items:center;justify-content:space-between;margin:28px 0 14px;gap:12px;flex-wrap:wrap;}
.section-h h2{font-size:19px;margin:0;}
.muted{color:var(--muted);font-size:13px;}
.badges{display:flex;gap:12px;flex-wrap:wrap;}
.badge2{width:74px;text-align:center;font-size:10.5px;color:var(--ink-2);}
.badge2 .b{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-size:22px;margin:0 auto 5px;background:var(--surface-2);}
.badge2.lit .b{background:linear-gradient(135deg,var(--accent),var(--gold));color:#fff;box-shadow:var(--shadow);}
.badge2.locked{opacity:.42;}
.flag{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.04em;padding:2px 6px;border-radius:6px;vertical-align:middle;}
.flag.v{background:rgba(30,158,106,.15);color:var(--green);} .flag.a{background:rgba(201,162,39,.2);color:#9A7B12;}
.flag.e{background:rgba(124,92,224,.16);color:var(--violet);} .flag.corr{background:rgba(232,116,59,.16);color:var(--accent-ink);}
.note{font-size:12.5px;color:var(--accent-ink);background:var(--accent-soft);border-radius:10px;padding:9px 12px;margin-top:10px;}
.term{border-bottom:1.5px dotted var(--accent);cursor:help;position:relative;}
.term .tip{position:absolute;left:0;bottom:135%;width:260px;max-width:72vw;background:var(--ink);color:#fff;padding:10px 12px;border-radius:10px;font-size:12.5px;line-height:1.45;font-weight:400;opacity:0;pointer-events:none;transform:translateY(4px);transition:.15s;z-index:40;box-shadow:var(--shadow);}
.term .tip b{color:var(--accent);}
.term:hover .tip,.term:focus .tip{opacity:1;transform:translateY(0);}
.prose{font-size:15px;color:var(--ink-2);} .prose h4{color:var(--ink);font-size:16px;margin:18px 0 6px;} .prose p{margin:8px 0;} .prose b{color:var(--ink);}
.prose ul{margin:8px 0;padding-left:20px;} .prose li{margin:4px 0;}
.figtable{border-collapse:collapse;width:100%;margin:12px 0;font-size:13px;}
.figtable th,.figtable td{border:1px solid var(--line);padding:7px 10px;text-align:right;}
.figtable th:first-child,.figtable td:first-child{text-align:left;}
.figtable th{background:var(--surface-2);font-weight:700;color:var(--ink);}
.figcap{font-size:12px;color:var(--muted);margin-top:4px;}
.crumb{font-size:13px;color:var(--muted);margin-bottom:6px;} .crumb a{color:var(--accent);}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);margin-right:6px;}

/* flashcard */
.fc{perspective:1200px;}
.fc .inner{border-radius:16px;border:1px solid var(--line);background:var(--surface);padding:30px;min-height:190px;display:grid;place-items:center;text-align:center;box-shadow:var(--shadow);cursor:pointer;}
.fc .q{font-size:18px;font-weight:600;} .fc .a{font-size:15px;color:var(--ink-2);margin-top:14px;}
.srs{display:flex;gap:8px;margin-top:14px;}
.srs button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 6px;font-size:12.5px;font-weight:700;}
.srs .again{color:var(--red);} .srs .hard{color:var(--gold);} .srs .good{color:var(--blue);} .srs .easy{color:var(--green);}
.progressbar{height:7px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-bottom:18px;}
.progressbar > div{height:100%;background:var(--accent);transition:width .3s;}

/* qcm */
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:9px 0;font-size:14.5px;}
.opt:hover{border-color:var(--accent);}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);}
.opt.right{border-color:var(--green);background:rgba(30,158,106,.08);}
.opt.wrong{border-color:var(--red);background:rgba(192,57,43,.07);}
.opt .mk{width:21px;height:21px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;font-size:12px;}
.opt .why{display:block;font-size:12.5px;color:var(--muted);margin-top:4px;}
.expl{font-size:13.5px;color:var(--ink-2);background:var(--surface-2);border-radius:12px;padding:13px 15px;margin-top:10px;}

/* excel grid */
.sheet{overflow:auto;border:1px solid var(--line);border-radius:12px;}
table.xl{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;min-width:100%;}
table.xl th,table.xl td{border:1px solid var(--line);padding:0;min-width:92px;height:34px;text-align:right;}
table.xl thead th,table.xl tbody th{background:var(--surface-2);color:var(--muted);font-weight:600;text-align:center;min-width:34px;width:34px;}
table.xl td .lbl{padding:6px 9px;color:var(--ink-2);text-align:left;}
table.xl td .inp{padding:6px 9px;color:var(--blue);font-weight:600;}
table.xl td.link .inp{color:var(--green);}
table.xl td input{width:100%;height:34px;border:0;background:rgba(232,116,59,.06);padding:6px 9px;text-align:right;font:inherit;color:var(--ink);outline:2px solid transparent;}
table.xl td input:focus{outline:2px solid var(--accent);}
table.xl td.ok{background:rgba(30,158,106,.12);} table.xl td.ko{background:rgba(192,57,43,.1);}
.kbdkey{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 7px;font-size:12px;background:var(--surface-2);font-weight:600;margin:0 2px;}

/* command palette */
.modal-bg{position:fixed;inset:0;background:rgba(20,16,8,.4);backdrop-filter:blur(2px);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding-top:12vh;}
.cmdk{width:560px;max-width:92vw;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.25);overflow:hidden;}
.cmdk input{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font-size:16px;background:transparent;color:var(--ink);outline:none;}
.cmdk .res{max-height:50vh;overflow:auto;padding:6px;}
.cmdk .r{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;font-size:14px;}
.cmdk .r:hover,.cmdk .r.hl{background:var(--surface-2);}
.cmdk .r .k{font-size:11px;color:var(--muted);margin-left:auto;text-transform:uppercase;letter-spacing:.05em;}
.empty{text-align:center;color:var(--muted);padding:40px 20px;}
.empty .big{font-size:34px;margin-bottom:8px;}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;z-index:80;box-shadow:var(--shadow);opacity:0;transition:.25s;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}
.toast.xp{background:linear-gradient(135deg,var(--accent),var(--gold));}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;margin:4px 6px 0 0;}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);}
.field{margin:12px 0;} .field label{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:5px;}
.field input[type=range]{width:100%;} .field select,.field input[type=number],.field input[type=text]{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--surface);color:var(--ink);font:inherit;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.modcard{display:flex;flex-direction:column;gap:8px;}
.modcard .top{display:flex;align-items:center;gap:8px;}
.modcard .lvl{font-size:11px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border-radius:6px;padding:2px 7px;}
.modcard .ttl{font-size:15.5px;font-weight:650;}
.modcard .obj{font-size:13px;color:var(--ink-2);}
.modcard .meta{font-size:12px;color:var(--muted);margin-top:auto;display:flex;gap:10px;align-items:center;}
.donebadge{color:var(--green);font-weight:700;}
.list-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}

@media(max-width:920px){
  .app{grid-template-columns:1fr;}
  .sidebar{position:fixed;z-index:50;width:248px;transform:translateX(-110%);transition:.2s;box-shadow:var(--shadow);}
  .sidebar.open{transform:none;}
  .burger{display:block;}
  .cols-3,.cols-2,.cols-2e{grid-template-columns:1fr;}
  .content{padding:18px 16px 70px;}
}
</style>
</head>

</div>

/* ---------- 2. CONTENT (injected at build) ---------- */
const CONTENT = /*<<CONTENT>>*/{"modules":[{"id":"mod.l3.excel-best","type":"module","level":3,"topic":"Excel","tags":["Excel","modeling","best-practices"],"difficulty":3,"source":{"flag":"VERIFIED","ref":"Wall Street Prep / BIWS modeling standards + Vernimmen"},"title":{"fr":"Excel — bonnes pratiques de modélisation","en":"Excel — modeling best practices"},"objective":{"fr":"Construire un modèle financier lisible, auditable et robuste en séparant les inputs, les calculs et les outputs.","en":"Build a readable, auditable and robust financial model by separating inputs, calculations and outputs."},"estMinutes":14,"prerequisites":[],"content":{"contexte":{"fr":"En entretien et en deal, un modèle est jugé autant sur sa rigueur que sur ses résultats. Un analyste senior doit pouvoir auditer votre fichier en deux minutes. Les standards de modélisation (séparation inputs/calculs/outputs, code couleur, checks) sont la première chose qu'un VP ou un MD vérifie : un modèle propre signale un esprit clair.","en":"In interviews and on a deal, a model is judged as much on its rigour as on its outputs. A senior must be able to audit your file in two minutes. Modeling standards (separating inputs/calculations/outputs, a colour code, checks) are the first thing a VP or MD looks at: a clean model signals a clear mind."},"concepts":[{"heading":{"fr":"Séparer inputs, calculs et outputs","en":"Separate inputs, calculations and outputs"},"body":{"fr":"Un modèle se structure en trois zones nettes : les [[inputs]] (hypothèses brutes saisies en dur), les calculs (formules qui transforment les hypothèses) et les outputs (synthèse présentable : graphiques, multiples, retours). Idéalement chaque zone vit sur sa propre feuille ou son propre bloc. On ne change JAMAIS un calcul pour piloter un scénario : on ne touche qu'aux inputs. Cette discipline rend le modèle traçable et évite que quelqu'un écrase une formule par une valeur.","en":"A model is structured in three clean zones: the [[inputs]] (raw hardcoded assumptions), the calculations (formulas transforming assumptions) and the outputs (presentable summary: charts, multiples, returns). Ideally each zone lives on its own sheet or block. You NEVER change a calculation to drive a scenario: you only touch inputs. This discipline keeps the model traceable and prevents anyone from overwriting a formula with a value."}},{"heading":{"fr":"Convention de couleurs","en":"Colour convention"},"body":{"fr":"Le code couleur universel : bleu = inputs en dur (hypothèses saisies au clavier), noir = formules de calcul, vert = liens vers une autre feuille du même classeur, rouge = checks et alertes. Certaines maisons ajoutent le violet/vert pour les liens vers d'autres classeurs. Cette convention permet à n'importe qui d'identifier d'un coup d'œil ce qu'il peut modifier (bleu) et ce qu'il ne doit pas toucher (noir).","en":"The universal colour code: blue = hardcoded inputs (assumptions typed in), black = calculation formulas, green = links to another sheet in the same workbook, red = checks and alerts. Some shops add purple for links to other workbooks. This convention lets anyone instantly identify what they may change (blue) and what they must not touch (black)."}},{"heading":{"fr":"Aucun nombre en dur dans une formule","en":"No hardcoded number inside a formula"},"body":{"fr":"Écrire `=B5*1,25` pour appliquer une TVA ou un taux d'impôt est une faute. Le 1,25 doit vivre dans une cellule d'input bleue, et la formule devient `=B5*(1+$C$3)`. Pourquoi ? Parce qu'un nombre noyé dans une formule est invisible, non traçable et impossible à piloter en scénario. La règle : toute constante économique est un input référencé, jamais une saisie dans la formule.","en":"Writing `=B5*1.25` to apply VAT or a tax rate is a mistake. The 1.25 must live in a blue input cell, and the formula becomes `=B5*(1+$C$3)`. Why? Because a number buried in a formula is invisible, untraceable and impossible to drive in a scenario. The rule: every economic constant is a referenced input, never typed into the formula."}},{"heading":{"fr":"Les checks : bilan équilibré, sources = emplois","en":"Checks: balance sheet balances, sources = uses"},"body":{"fr":"Un modèle robuste s'auto-contrôle. Les [[checks]] classiques : l'actif égale le passif (bilan équilibré), les sources de financement égalent les emplois dans une table de [[LBO]], la somme des flux annuels recoupe le cumul. On code chaque check en `=ABS(actif-passif)` et on l'affiche en rouge ; un panneau de contrôle agrège tous les checks et passe au rouge si l'un dévie. C'est la première chose qu'un MD regarde.","en":"A robust model self-checks. Classic [[checks]]: assets equal liabilities (balance sheet balances), sources of funds equal uses in an [[LBO]] table, the sum of annual flows reconciles with the cumulative total. You code each check as `=ABS(assets-liabilities)` and show it in red; a control panel aggregates all checks and turns red if any deviates. It is the first thing an MD looks at."}},{"heading":{"fr":"Gérer la circularité (intérêts ↔ dette)","en":"Handling circularity (interest ↔ debt)"},"body":{"fr":"En LBO, les intérêts dépendent de la dette, le [[cash sweep]] rembourse la dette, donc la dette dépend des intérêts : c'est une référence circulaire. Excel peut la résoudre en activant le calcul itératif, mais cela rend le modèle instable (#REF, valeurs figées). La pratique propre : un interrupteur (`circularity switch`, une cellule 0/1) qui, à 0, casse la boucle en calculant les intérêts sur la dette d'ouverture seulement. On bascule à 1 quand le modèle est stable. Toujours prévoir le bouton de coupure.","en":"In an LBO, interest depends on debt, the [[cash sweep]] repays debt, so debt depends on interest: a circular reference. Excel can resolve it with iterative calculation, but that makes the model unstable (#REF, frozen values). The clean practice: a switch (a 0/1 cell) that, at 0, breaks the loop by computing interest on opening debt only. You flip it to 1 once the model is stable. Always keep the kill switch."}},{"heading":{"fr":"Pas de cellules fusionnées","en":"No merged cells"},"body":{"fr":"Les cellules fusionnées cassent la navigation au clavier (Ctrl+flèches), empêchent le copier-coller propre, perturbent les tris et les références. Pour centrer un titre sur plusieurs colonnes, on utilise « Centrer sur plusieurs colonnes » (Format > Alignement) plutôt que la fusion. Règle simple : zéro cellule fusionnée dans un modèle financier.","en":"Merged cells break keyboard navigation (Ctrl+arrows), prevent clean copy-paste, and disrupt sorting and references. To centre a title across columns, use 'Center Across Selection' (Format > Alignment) rather than merging. Simple rule: zero merged cells in a financial model."}}],"exempleChiffre":{"title":{"fr":"Exemple chiffré : check sources = emplois","en":"Worked example: sources = uses check"},"body":{"fr":"Sur une acquisition à 500 d'[[Enterprise Value]] : emplois = EV 500 + frais 15 = 515. Sources = dette 300 + equity 200 + cash existant 15 = 515. Le check `=ABS(515-515)=0` doit afficher 0 (vert). Si l'on saisit l'equity à 190, le check passe à 10 et vire au rouge : on a un trou de financement de 10 à combler.","en":"On an acquisition at 500 of [[Enterprise Value]]: uses = EV 500 + fees 15 = 515. Sources = debt 300 + equity 200 + existing cash 15 = 515. The check `=ABS(515-515)=0` should display 0 (green). If equity is entered as 190, the check becomes 10 and turns red: there is a 10 funding gap to fill."},"figures":[{"caption":{"fr":"Table Sources & Emplois","en":"Sources & Uses table"},"columns":["Poste","Emplois","Sources"],"rows":[["Enterprise Value","500","—"],["Frais de transaction","15","—"],["Dette","—","300"],["Equity","—","200"],["Cash existant","—","15"],["Total","515","515"]]}]},"piegesEntretien":[{"fr":"« Pourquoi le bleu ? » — un input en dur ; si vous coloriez une formule en bleu, vous trompez le relecteur. Couleur = sémantique, pas décoration.","en":"'Why blue?' — a hardcoded input; if you colour a formula blue, you mislead the reviewer. Colour = semantics, not decoration."},{"fr":"Activer le calcul itératif « pour faire taire l'avertissement de circularité » sans interrupteur : faute grave, le modèle deviendra instable.","en":"Turning on iterative calculation 'to silence the circularity warning' without a switch: a serious mistake, the model will become unstable."},{"fr":"Mettre un taux d'impôt en dur dans dix formules : si la loi change, vous corrigez dix endroits et en oubliez un.","en":"Hardcoding a tax rate into ten formulas: if the law changes you fix ten places and miss one."},{"fr":"Fusionner les cellules pour « faire joli » : Ctrl+flèche s'arrête au mauvais endroit et le copier-coller plante.","en":"Merging cells 'to make it pretty': Ctrl+arrow stops in the wrong place and copy-paste breaks."},{"fr":"Pas de check de bilan : un modèle qui ne s'auto-contrôle pas est invendable à un MD.","en":"No balance check: a model that does not self-check is unsellable to an MD."}],"synthese":{"fr":"• Trois zones : inputs / calculs / outputs.\n• Couleurs : bleu = input, noir = formule, vert = lien inter-feuilles, rouge = check.\n• Jamais de nombre en dur dans une formule.\n• Des checks partout (bilan, sources=emplois).\n• Circularité : interrupteur, pas calcul itératif aveugle.\n• Zéro cellule fusionnée.","en":"• Three zones: inputs / calculations / outputs.\n• Colours: blue = input, black = formula, green = cross-sheet link, red = check.\n• Never a hardcoded number inside a formula.\n• Checks everywhere (balance sheet, sources=uses).\n• Circularity: a switch, not blind iterative calc.\n• Zero merged cells."}},"glossaryRefs":["inputs","checks","cash-sweep","enterprise-value"]},{"id":"mod.l3.excel-shortcuts","type":"module","level":3,"topic":"Excel","tags":["Excel","shortcuts","productivity"],"difficulty":2,"source":{"flag":"VERIFIED","ref":"Microsoft Excel keyboard reference (Windows & Mac)"},"title":{"fr":"Excel — raccourcis clavier (Windows & Mac)","en":"Excel — keyboard shortcuts (Windows & Mac)"},"objective":{"fr":"Modéliser sans la souris : naviguer, sélectionner, saisir et auditer un modèle au clavier sur PC comme sur Mac.","en":"Model without the mouse: navigate, select, enter and audit a model from the keyboard on both PC and Mac."},"estMinutes":12,"prerequisites":["mod.l3.excel-best"],"content":{"contexte":{"fr":"La vitesse au clavier est un signal d'expérience immédiat en entretien sur modèle (modeling test). Un analyste qui prend la souris pour faire une somme perd du temps et de la crédibilité. Les raccourcis ne sont pas un gadget : ils sont la grammaire de base du métier, et les équivalents Mac diffèrent suffisamment pour mériter un apprentissage dédié.","en":"Keyboard speed is an immediate signal of experience in a modeling test. An analyst who reaches for the mouse to sum a column loses time and credibility. Shortcuts are not a gimmick: they are the basic grammar of the job, and Mac equivalents differ enough to deserve dedicated learning."},"concepts":[{"heading":{"fr":"Navigation par les bords","en":"Navigating by edges"},"body":{"fr":"Ctrl+flèche (Mac : Cmd+flèche) saute jusqu'au bord du bloc de données dans la direction choisie : indispensable pour parcourir un modèle long. Ctrl+Maj+flèche (Mac : Cmd+Maj+flèche) fait la même chose en sélectionnant au passage. Ctrl+A sélectionne le bloc courant, puis toute la feuille. C'est la base : on ne fait pas défiler à la souris dans un modèle de 200 lignes.","en":"Ctrl+arrow (Mac: Cmd+arrow) jumps to the edge of the data block in the chosen direction: essential for moving through a long model. Ctrl+Shift+arrow (Mac: Cmd+Shift+arrow) does the same while selecting along the way. Ctrl+A selects the current block, then the whole sheet. This is the baseline: you do not scroll with the mouse in a 200-row model."}},{"heading":{"fr":"Sélectionner lignes et colonnes","en":"Selecting rows and columns"},"body":{"fr":"Ctrl+Espace sélectionne la colonne entière, Maj+Espace la ligne entière (identique sur Mac). Combinés à Ctrl+Maj+flèche, ils permettent de sélectionner précisément une plage sans souris. Pratique pour insérer/supprimer lignes et colonnes au clavier (Ctrl++ / Ctrl+- sur PC ; Cmd++ / Cmd+- sur Mac).","en":"Ctrl+Space selects the whole column, Shift+Space the whole row (same on Mac). Combined with Ctrl+Shift+arrow they let you select a precise range without the mouse. Handy for inserting/deleting rows and columns from the keyboard (Ctrl++ / Ctrl+- on PC; Cmd++ / Cmd+- on Mac)."}},{"heading":{"fr":"Édition et références","en":"Editing and references"},"body":{"fr":"F2 entre en mode édition d'une cellule (Mac : Ctrl+U ou F2). F4 bascule la référence entre relative, absolue et mixte ($A$1 → A$1 → $A1) : sur Mac c'est souvent Cmd+T, ou fn+F4 si la touche F4 pilote le rétroéclairage. Alt+= insère une somme automatique (Mac : Cmd+Maj+T). Ctrl+1 ouvre le format de cellule (Mac : Cmd+1).","en":"F2 enters cell edit mode (Mac: Ctrl+U or F2). F4 cycles a reference between relative, absolute and mixed ($A$1 → A$1 → $A1): on Mac it is often Cmd+T, or fn+F4 if the F4 key controls the backlight. Alt+= inserts an AutoSum (Mac: Cmd+Shift+T). Ctrl+1 opens cell formatting (Mac: Cmd+1)."}},{"heading":{"fr":"Recopie et collage spécial","en":"Fill and paste special"},"body":{"fr":"Ctrl+D recopie la cellule du dessus vers le bas sur la sélection, Ctrl+R recopie depuis la gauche vers la droite (identiques sur Mac avec Cmd). Ctrl+Alt+V (Mac : Cmd+Ctrl+V ou Cmd+Maj+V) ouvre le collage spécial : valeurs uniquement, formats, transposer. Coller des valeurs (et non des formules) est crucial quand on fige une sortie ou qu'on casse un lien.","en":"Ctrl+D fills down from the cell above over the selection, Ctrl+R fills right from the left (same on Mac with Cmd). Ctrl+Alt+V (Mac: Cmd+Ctrl+V or Cmd+Shift+V) opens Paste Special: values only, formats, transpose. Pasting values (not formulas) is crucial when freezing an output or breaking a link."}},{"heading":{"fr":"Auditer un modèle au clavier","en":"Auditing a model from the keyboard"},"body":{"fr":"Ctrl+[ (Mac : Ctrl+[) saute aux antécédents directs d'une formule — d'où vient ce chiffre. Ctrl+` (l'accent grave, Mac : Ctrl+`) affiche/masque toutes les formules de la feuille d'un coup : indispensable pour relire un fichier inconnu. F9 recalcule le classeur ; sélectionner un morceau de formule puis F9 évalue cette portion (Mac : Cmd+= pour recalculer, sélection+= en édition). Échap annule l'évaluation sans valider.","en":"Ctrl+[ (Mac: Ctrl+[) jumps to the direct precedents of a formula — where the number comes from. Ctrl+` (the backtick, Mac: Ctrl+`) toggles showing all formulas on the sheet at once: essential to review an unfamiliar file. F9 recalculates the workbook; selecting part of a formula then F9 evaluates that portion (Mac: Cmd+= to recalculate). Esc cancels the evaluation without committing."}}],"exempleChiffre":{"title":{"fr":"Exemple : sommer une colonne sans souris","en":"Example: sum a column without the mouse"},"body":{"fr":"Curseur en B2, première valeur. Ctrl+Maj+Bas sélectionne B2:B13. On va en B14, on tape Alt+= : Excel propose `=SUM(B2:B13)`, Entrée valide. Trois gestes, zéro souris. Sur Mac : Cmd+Maj+Bas puis Cmd+Maj+T.","en":"Cursor at B2, the first value. Ctrl+Shift+Down selects B2:B13. Move to B14, press Alt+=: Excel proposes `=SUM(B2:B13)`, Enter confirms. Three keystrokes, zero mouse. On Mac: Cmd+Shift+Down then Cmd+Shift+T."},"figures":[{"caption":{"fr":"Raccourcis essentiels PC vs Mac","en":"Essential shortcuts PC vs Mac"},"columns":["Action","Windows","Mac"],"rows":[["Bord du bloc","Ctrl+flèche","Cmd+flèche"],["Sélection au bord","Ctrl+Maj+flèche","Cmd+Maj+flèche"],["Édition cellule","F2","F2 / Ctrl+U"],["Réf absolue","F4","Cmd+T / fn+F4"],["Somme auto","Alt+=","Cmd+Maj+T"],["Collage spécial","Ctrl+Alt+V","Cmd+Ctrl+V"],["Afficher formules","Ctrl+`","Ctrl+`"],["Antécédents","Ctrl+[","Ctrl+["]]}]},"piegesEntretien":[{"fr":"Sur Mac, F4 ne fige pas la référence si les touches de fonction pilotent le système : il faut fn+F4 ou Cmd+T. Le savoir évite le blocage en live test.","en":"On Mac, F4 does not lock the reference if function keys drive the system: you need fn+F4 or Cmd+T. Knowing this avoids freezing in a live test."},{"fr":"Confondre Ctrl+flèche (navigation) et Ctrl+Maj+flèche (sélection) : on perd sa sélection et on recommence.","en":"Confusing Ctrl+arrow (navigation) with Ctrl+Shift+arrow (selection): you lose your selection and start over."},{"fr":"Oublier Ctrl+` pour relire un fichier reçu : on passe dix minutes à cliquer chaque cellule au lieu d'afficher toutes les formules d'un coup.","en":"Forgetting Ctrl+` to review a received file: you spend ten minutes clicking each cell instead of showing all formulas at once."},{"fr":"Coller des formules au lieu de valeurs (Ctrl+Alt+V) quand on fige une sortie : les chiffres bougent après coup.","en":"Pasting formulas instead of values (Ctrl+Alt+V) when freezing an output: the numbers move afterwards."}],"synthese":{"fr":"• Naviguer : Ctrl+flèche, sélectionner : Ctrl+Maj+flèche.\n• Ctrl/Maj+Espace = colonne/ligne entière.\n• F2 éditer, F4 (Mac fn+F4/Cmd+T) figer la réf, Alt+= sommer.\n• Ctrl+D/Ctrl+R recopier, Ctrl+Alt+V collage spécial, Ctrl+1 format.\n• Auditer : Ctrl+[ antécédents, Ctrl+` formules, F9 évaluer.","en":"• Navigate: Ctrl+arrow, select: Ctrl+Shift+arrow.\n• Ctrl/Shift+Space = whole column/row.\n• F2 edit, F4 (Mac fn+F4/Cmd+T) lock ref, Alt+= sum.\n• Ctrl+D/Ctrl+R fill, Ctrl+Alt+V paste special, Ctrl+1 format.\n• Audit: Ctrl+[ precedents, Ctrl+` formulas, F9 evaluate."}},"glossaryRefs":[]},{"id":"mod.l3.excel-formulas","type":"module","level":3,"topic":"Excel","tags":["Excel","formulas","lookup"],"difficulty":3,"source":{"flag":"VERIFIED","ref":"Microsoft function reference + Wall Street Prep"},"title":{"fr":"Excel — formules clés de la modélisation","en":"Excel — key modeling formulas"},"objective":{"fr":"Choisir la bonne fonction de recherche, de logique et de finance, et éviter les fonctions volatiles dangereuses.","en":"Pick the right lookup, logic and finance function, and avoid dangerous volatile functions."},"estMinutes":16,"prerequisites":["mod.l3.excel-shortcuts"],"content":{"contexte":{"fr":"Les formules sont le cœur d'un modèle. Choisir XLOOKUP plutôt que VLOOKUP, IFERROR pour neutraliser une division par zéro, ou XIRR plutôt qu'IRR pour des flux datés, distingue un modèle professionnel d'un brouillon. Connaître les fonctions financières (NPV, IRR, PMT) est attendu dès le premier entretien analyste.","en":"Formulas are the heart of a model. Choosing XLOOKUP over VLOOKUP, IFERROR to neutralise a division by zero, or XIRR over IRR for dated flows, separates a professional model from a draft. Knowing the finance functions (NPV, IRR, PMT) is expected from the first analyst interview."},"concepts":[{"heading":{"fr":"INDEX/MATCH et XLOOKUP plutôt que VLOOKUP","en":"INDEX/MATCH and XLOOKUP over VLOOKUP"},"body":{"fr":"VLOOKUP cherche toujours vers la droite, casse si on insère une colonne (l'index numérique se décale), et est lent sur de gros tableaux. INDEX/MATCH (`=INDEX(retour;MATCH(clé;recherche;0))`) cherche dans n'importe quelle direction et survit aux insertions de colonnes. XLOOKUP (Excel 365) combine les deux avantages, gère le « si absent » nativement et cherche à gauche comme à droite. En modélisation pro : XLOOKUP si disponible, sinon INDEX/MATCH, jamais VLOOKUP.","en":"VLOOKUP always looks to the right, breaks when you insert a column (the numeric index shifts), and is slow on large tables. INDEX/MATCH (`=INDEX(return;MATCH(key;lookup;0))`) searches in any direction and survives column insertions. XLOOKUP (Excel 365) combines both advantages, handles the 'if not found' case natively and looks left as well as right. In pro modeling: XLOOKUP if available, otherwise INDEX/MATCH, never VLOOKUP."}},{"heading":{"fr":"Logique : IF, IFERROR, AND, OR","en":"Logic: IF, IFERROR, AND, OR"},"body":{"fr":"IF(condition;vrai;faux) est la brique des scénarios et des interrupteurs. IFERROR(formule;valeur_si_erreur) capture proprement #DIV/0!, #N/A et #REF! — par exemple `=IFERROR(B2/B3;0)` évite qu'une division par zéro contamine tout le modèle. AND et OR combinent plusieurs conditions : `=IF(AND(marge>0,2;dette<3);1;0)`. Attention : IFERROR masque aussi les vraies erreurs ; ne pas l'utiliser pour cacher un bug.","en":"IF(condition;true;false) is the building block of scenarios and switches. IFERROR(formula;value_if_error) cleanly catches #DIV/0!, #N/A and #REF! — e.g. `=IFERROR(B2/B3;0)` prevents a division by zero from contaminating the whole model. AND and OR combine conditions: `=IF(AND(margin>0.2;debt<3);1;0)`. Caution: IFERROR also masks genuine errors; do not use it to hide a bug."}},{"heading":{"fr":"Fonctions financières : NPV, IRR, XIRR, XNPV, PMT, EOMONTH","en":"Finance functions: NPV, IRR, XIRR, XNPV, PMT, EOMONTH"},"body":{"fr":"NPV actualise une série de flux à périodes régulières (attention : NPV suppose le premier flux à la fin de la période 1 — le capex en t0 s'ajoute hors fonction). IRR calcule le taux qui annule la VAN d'une série régulière. XIRR/XNPV gèrent des flux à dates réelles (irrégulières) — incontournables en [[private equity]] où les appels et distributions sont datés. PMT calcule une annuité constante (mensualité d'emprunt). EOMONTH renvoie la fin de mois à n mois d'écart, base des calendriers de modèle.","en":"NPV discounts a series of flows over regular periods (caution: NPV assumes the first flow at the end of period 1 — a t0 capex is added outside the function). IRR computes the rate that zeroes the NPV of a regular series. XIRR/XNPV handle flows at actual (irregular) dates — essential in [[private equity]] where calls and distributions are dated. PMT computes a constant annuity (loan instalment). EOMONTH returns the end of month n months away, the basis of model calendars."}},{"heading":{"fr":"Agrégats conditionnels : SUMIF(S), COUNTIF(S), SUMPRODUCT","en":"Conditional aggregates: SUMIF(S), COUNTIF(S), SUMPRODUCT"},"body":{"fr":"SUMIF(S) et COUNTIF(S) somment/comptent selon un ou plusieurs critères : `=SUMIFS(montants;région;\"EU\";année;2025)`. SUMPRODUCT multiplie deux plages terme à terme puis somme : `=SUMPRODUCT(prix;quantités)` calcule un chiffre d'affaires, et sert aussi de somme conditionnelle vectorielle. Ces fonctions remplacent des colonnes intermédiaires et gardent le modèle compact.","en":"SUMIF(S) and COUNTIF(S) sum/count by one or more criteria: `=SUMIFS(amounts;region;\"EU\";year;2025)`. SUMPRODUCT multiplies two ranges element-wise then sums: `=SUMPRODUCT(price;quantity)` computes revenue, and also serves as a vectorised conditional sum. These functions replace helper columns and keep the model compact."}},{"heading":{"fr":"Pièges des fonctions volatiles : OFFSET, INDIRECT","en":"Volatile-function traps: OFFSET, INDIRECT"},"body":{"fr":"OFFSET et INDIRECT sont volatiles : elles se recalculent à chaque modification du classeur, même sans rapport, ce qui ralentit fortement un gros modèle. Pire, INDIRECT casse silencieusement les références (un audit ne suit pas le lien). On les remplace par INDEX (non volatile) pour les plages dynamiques, et on évite INDIRECT sauf cas de consolidation multi-feuilles documenté. Un modèle truffé d'OFFSET est un drapeau rouge en entretien.","en":"OFFSET and INDIRECT are volatile: they recalculate on every workbook change, even unrelated ones, which heavily slows a large model. Worse, INDIRECT silently breaks reference tracing (an audit cannot follow the link). Replace them with INDEX (non-volatile) for dynamic ranges, and avoid INDIRECT except in a documented multi-sheet consolidation. A model riddled with OFFSET is a red flag in interviews."}}],"exempleChiffre":{"title":{"fr":"Exemple : XLOOKUP vs VLOOKUP","en":"Example: XLOOKUP vs VLOOKUP"},"body":{"fr":"On cherche l'EBITDA d'une société dans un tableau où le code société est en colonne C et l'EBITDA en colonne A (à gauche). VLOOKUP est impossible (la clé est à droite du résultat). XLOOKUP fonctionne : `=XLOOKUP(\"ACME\";C2:C50;A2:A50;\"introuvable\")`. Si la clé n'existe pas, on renvoie « introuvable » plutôt que #N/A.","en":"We look up a company's EBITDA in a table where the company code is in column C and EBITDA in column A (to the left). VLOOKUP is impossible (the key is to the right of the result). XLOOKUP works: `=XLOOKUP(\"ACME\";C2:C50;A2:A50;\"not found\")`. If the key is missing, it returns 'not found' instead of #N/A."},"figures":[{"caption":{"fr":"Quand utiliser quoi","en":"When to use what"},"columns":["Besoin","Fonction recommandée"],"rows":[["Recherche bidirectionnelle, Excel 365","XLOOKUP"],["Recherche, version ancienne","INDEX/MATCH"],["Neutraliser une erreur","IFERROR"],["Flux à dates irrégulières","XIRR / XNPV"],["Somme multi-critères","SUMIFS"],["Plage dynamique","INDEX (pas OFFSET)"]]}]},"piegesEntretien":[{"fr":"« NPV gère-t-il le flux en t0 ? » Non : NPV actualise dès la période 1. Le capex initial se met hors fonction : `=NPV(r;flux1:fluxN)+flux0`. Erreur classique.","en":"'Does NPV handle the t0 flow?' No: NPV discounts from period 1. The initial capex goes outside the function: `=NPV(r;flow1:flowN)+flow0`. A classic mistake."},{"fr":"Utiliser IRR sur des flux à dates irrégulières : il faut XIRR, sinon le taux est faux.","en":"Using IRR on irregularly dated flows: you need XIRR, otherwise the rate is wrong."},{"fr":"VLOOKUP avec un index en dur (`;5;`) qui se décale dès qu'on insère une colonne : préférer XLOOKUP/INDEX-MATCH.","en":"VLOOKUP with a hardcoded index (`;5;`) that shifts the moment a column is inserted: prefer XLOOKUP/INDEX-MATCH."},{"fr":"IFERROR posé partout « pour faire propre » : il masque les vrais bugs et fausse les checks.","en":"IFERROR slapped everywhere 'to look clean': it masks real bugs and corrupts checks."},{"fr":"Truffer le modèle d'OFFSET/INDIRECT : volatiles, lents et impossibles à auditer.","en":"Filling the model with OFFSET/INDIRECT: volatile, slow and impossible to audit."}],"synthese":{"fr":"• Recherche : XLOOKUP > INDEX/MATCH > VLOOKUP.\n• IFERROR pour les erreurs maîtrisées, pas pour cacher des bugs.\n• NPV actualise dès t1 ; ajouter le flux t0 hors fonction.\n• XIRR/XNPV pour flux datés ; PMT pour annuités.\n• SUMIFS/SUMPRODUCT pour les agrégats.\n• Fuir OFFSET/INDIRECT (volatiles) ; INDEX à la place.","en":"• Lookup: XLOOKUP > INDEX/MATCH > VLOOKUP.\n• IFERROR for controlled errors, not to hide bugs.\n• NPV discounts from t1; add the t0 flow outside.\n• XIRR/XNPV for dated flows; PMT for annuities.\n• SUMIFS/SUMPRODUCT for aggregates.\n• Avoid OFFSET/INDIRECT (volatile); use INDEX instead."}},"glossaryRefs":["private-equity"]},{"id":"mod.l3.excel-sensitivity","type":"module","level":3,"topic":"Excel","tags":["Excel","sensitivity","scenarios"],"difficulty":3,"source":{"flag":"VERIFIED","ref":"Microsoft Data Table / Goal Seek docs + Wall Street Prep"},"title":{"fr":"Excel — sensibilités et scénarios","en":"Excel — sensitivity and scenarios"},"objective":{"fr":"Construire des tables de sensibilité à 1 et 2 variables, utiliser Goal Seek et piloter des scénarios par interrupteur.","en":"Build 1- and 2-variable sensitivity tables, use Goal Seek, and drive scenarios with a switch."},"estMinutes":13,"prerequisites":["mod.l3.excel-formulas"],"content":{"contexte":{"fr":"Un résultat unique ne convainc personne en comité d'investissement : on veut savoir comment le rendement bouge si le multiple de sortie ou la croissance change. Les tables de données, Goal Seek et les scénarios sont les outils qui transforment un modèle ponctuel en outil de décision. Maîtriser la sensibilité du MoM/IRR au multiple de sortie est un classique de l'entretien LBO.","en":"A single result convinces no one in an investment committee: you want to know how returns move if the exit multiple or growth changes. Data tables, Goal Seek and scenarios turn a point estimate into a decision tool. Mastering the sensitivity of MoM/IRR to the exit multiple is an LBO interview classic."},"concepts":[{"heading":{"fr":"Table de données à 1 variable","en":"1-variable data table"},"body":{"fr":"On place la liste des valeurs testées (ex. multiples de sortie 7x, 8x, 9x, 10x) dans une colonne, et en haut de la colonne adjacente une référence vers la cellule de résultat (`=IRR_cell`). On sélectionne le bloc, Données > Analyse de scénarios > Table de données, et on indique la cellule d'entrée (le multiple). Excel recalcule le résultat pour chaque valeur. C'est non destructif : le modèle ne bouge pas.","en":"Put the tested values (e.g. exit multiples 7x, 8x, 9x, 10x) in a column, and at the top of the adjacent column a reference to the result cell (`=IRR_cell`). Select the block, Data > What-If Analysis > Data Table, and specify the input cell (the multiple). Excel recomputes the result for each value. It is non-destructive: the model does not move."}},{"heading":{"fr":"Table de données à 2 variables","en":"2-variable data table"},"body":{"fr":"On croise deux hypothèses : les valeurs d'une variable en colonne (ex. multiple de sortie), celles d'une autre en ligne (ex. levier d'entrée), et la formule de résultat (`=MoM_cell`) dans le coin haut-gauche. Données > Table de données : cellule d'entrée en ligne ET en colonne. On obtient une grille croisée du MoM ou de l'IRR — le tableau qui finit dans le mémo d'investissement.","en":"Cross two assumptions: one variable's values down a column (e.g. exit multiple), another's across a row (e.g. entry leverage), and the result formula (`=MoM_cell`) in the top-left corner. Data > Data Table: row input cell AND column input cell. You get a cross-grid of MoM or IRR — the table that ends up in the investment memo."}},{"heading":{"fr":"Goal Seek (valeur cible)","en":"Goal Seek"},"body":{"fr":"Goal Seek résout « à l'envers » : quelle valeur d'entrée donne un résultat cible ? Données > Analyse de scénarios > Valeur cible : « atteindre l'IRR = 20% en changeant le prix d'entrée ». Excel itère et renvoie le prix maximum payable pour tenir le rendement. Limite : une seule variable, une seule cible ; pour optimiser plusieurs variables on passe au Solveur.","en":"Goal Seek solves 'backwards': what input value yields a target result? Data > What-If Analysis > Goal Seek: 'set IRR = 20% by changing the entry price'. Excel iterates and returns the maximum payable price to hit the return. Limit: one variable, one target; for multiple variables use Solver."}},{"heading":{"fr":"Interrupteurs de scénarios","en":"Scenario switches"},"body":{"fr":"Pour basculer entre cas base / haut / bas, on crée une cellule interrupteur (1, 2 ou 3) et chaque hypothèse devient `=CHOOSE($scénario;base;haut;bas)` ou un IF imbriqué. Changer un seul chiffre rebascule tout le modèle de façon traçable. C'est plus robuste que le Gestionnaire de scénarios natif d'Excel (qui mémorise des valeurs en dur et se désynchronise). Toujours afficher le scénario actif en clair.","en":"To toggle between base / upside / downside cases, create a switch cell (1, 2 or 3) and each assumption becomes `=CHOOSE($scenario;base;up;down)` or a nested IF. Changing one number flips the whole model traceably. This is more robust than Excel's native Scenario Manager (which stores hardcoded values and desyncs). Always display the active scenario in plain sight."}}],"exempleChiffre":{"title":{"fr":"Exemple : table 2 variables MoM","en":"Worked example: 2-variable MoM table"},"body":{"fr":"Equity d'entrée 150, dette de sortie 200. À multiple de sortie 8x et EBITDA de sortie 60 : EV sortie 480, equity 280, MoM 1,87x. À 9x : EV 540, equity 340, MoM 2,27x. À 10x : EV 600, equity 400, MoM 2,67x. La table croise multiple (colonnes) et EBITDA (lignes) pour montrer toute la fourchette de retours d'un coup d'œil.","en":"Entry equity 150, exit debt 200. At exit multiple 8x and exit EBITDA 60: exit EV 480, equity 280, MoM 1.87x. At 9x: EV 540, equity 340, MoM 2.27x. At 10x: EV 600, equity 400, MoM 2.67x. The table crosses multiple (columns) and EBITDA (rows) to show the whole range of returns at a glance."},"figures":[{"caption":{"fr":"MoM selon le multiple de sortie (EBITDA 60, equity entrée 150, dette sortie 200)","en":"MoM by exit multiple (EBITDA 60, entry equity 150, exit debt 200)"},"columns":["Multiple","EV sortie","Equity sortie","MoM"],"rows":[["8.0x","480","280","1.87x"],["9.0x","540","340","2.27x"],["10.0x","600","400","2.67x"]]}]},"piegesEntretien":[{"fr":"Mettre le résultat à sensibiliser ailleurs que dans le coin haut-gauche de la table de données : Excel renvoie des #VALEUR ou des chiffres faux.","en":"Placing the result to sensitise anywhere but the top-left corner of the data table: Excel returns #VALUE or wrong numbers."},{"fr":"Goal Seek écrase la cellule d'entrée par une valeur en dur : penser à noter la valeur d'origine avant de lancer.","en":"Goal Seek overwrites the input cell with a hardcoded value: note the original value before running."},{"fr":"Le Gestionnaire de scénarios natif fige des valeurs : préférer un interrupteur + CHOOSE qui reste lié aux inputs.","en":"The native Scenario Manager freezes values: prefer a switch + CHOOSE that stays linked to inputs."},{"fr":"Oublier que les tables de données recalculent tout le classeur (volatiles) : sur un gros modèle, basculer le calcul en manuel.","en":"Forgetting that data tables recalculate the whole workbook (volatile): on a large model, switch calculation to manual."}],"synthese":{"fr":"• Table 1 variable : valeurs en colonne, résultat en haut, 1 cellule d'entrée.\n• Table 2 variables : résultat en coin haut-gauche, 2 cellules d'entrée.\n• Goal Seek : trouve l'input pour une cible (1 variable).\n• Scénarios : interrupteur + CHOOSE, pas le Gestionnaire natif.\n• Afficher le scénario actif ; attention aux recalculs (volatil).","en":"• 1-var table: values in a column, result on top, 1 input cell.\n• 2-var table: result in top-left corner, 2 input cells.\n• Goal Seek: finds the input for a target (1 variable).\n• Scenarios: switch + CHOOSE, not the native Manager.\n• Show the active scenario; mind the recalcs (volatile)."}},"glossaryRefs":[]},{"id":"mod.l1.culture","type":"module","level":1,"topic":"Fit","tags":["PE","IB","buy-side","sell-side","GP","LP"],"difficulty":1,"source":{"flag":"VERIFIED","ref":"Vernimmen + culture de marché PE/IB"},"title":{"fr":"Culture financière & acteurs","en":"Financial culture & players"},"objective":{"fr":"Distinguer banque d'affaires et private equity, buy-side et sell-side, et comprendre qui sont les GP et LP d'un fonds.","en":"Tell apart investment banking and private equity, buy-side and sell-side, and understand who the GPs and LPs of a fund are."},"estMinutes":12,"prerequisites":[],"content":{"contexte":{"fr":"Avant de parler technique, un recruteur veut savoir si vous comprenez le métier et l'écosystème. Confondre [[private equity]] et banque d'affaires, ou ne pas savoir qui paie les frais d'un fonds, est éliminatoire en entretien de motivation (« fit »).","en":"Before any technical talk, a recruiter wants to know whether you understand the job and its ecosystem. Confusing [[private equity]] with investment banking, or not knowing who pays a fund's fees, is a knockout in a motivation (\"fit\") interview."},"concepts":[{"heading":{"fr":"Banque d'affaires (IB) vs private equity (PE)","en":"Investment banking (IB) vs private equity (PE)"},"body":{"fr":"La banque d'affaires ([[investment banking]]) conseille des clients sur des opérations (fusions-acquisitions, levées de fonds) et se rémunère en honoraires : c'est un métier de conseil et d'exécution. Le [[private equity]] investit directement les capitaux d'un fonds dans des sociétés non cotées, les détient plusieurs années, crée de la valeur, puis les revend : c'est un métier de propriétaire-investisseur. En clair, l'IB touche une commission sur la transaction ; le PE met son propre capital en risque et vit de la plus-value.","en":"[[investment banking]] advises clients on transactions (M&A, fundraising) for a fee: it is an advisory and execution business. [[private equity]] directly invests a fund's capital into private companies, holds them for several years, creates value, then sells them: it is an owner-investor business. In short, IB earns a fee on the deal; PE puts its own capital at risk and lives off the capital gain."}},{"heading":{"fr":"Buy-side vs sell-side","en":"Buy-side vs sell-side"},"body":{"fr":"Le [[sell-side]] regroupe ceux qui vendent un service ou une transaction : banques d'affaires, brokers, analystes vendeurs. Le [[buy-side]] regroupe ceux qui achètent et gèrent des actifs avec leur propre argent ou celui de leurs clients : fonds de PE, hedge funds, gérants d'actifs. Un fonds de private equity est donc typiquement buy-side ; une banque qui le conseille sur une acquisition est sell-side.","en":"The [[sell-side]] is everyone selling a service or a transaction: investment banks, brokers, sell-side analysts. The [[buy-side]] is everyone buying and managing assets with their own or clients' money: PE funds, hedge funds, asset managers. A private equity fund is therefore typically buy-side; a bank advising it on an acquisition is sell-side."}},{"heading":{"fr":"Fonds, GP et LP","en":"Fund, GP and LP"},"body":{"fr":"Un fonds de private equity est structuré entre deux rôles. Le [[GP]] (General Partner) est la société de gestion : elle lève le fonds, sélectionne et gère les participations, et engage sa responsabilité. Les [[LP]] (Limited Partners) sont les investisseurs qui apportent l'essentiel des capitaux (fonds de pension, assureurs, family offices) avec une responsabilité limitée à leur mise. Le GP est rémunéré par des frais de gestion (souvent ~2% des engagements) et un intéressement à la performance, le [[carried interest]] (souvent 20% au-delà d'un seuil de rendement).","en":"A private equity fund is structured around two roles. The [[GP]] (General Partner) is the management company: it raises the fund, selects and manages the holdings, and bears liability. The [[LP]] (Limited Partners) are the investors who provide most of the capital (pension funds, insurers, family offices) with liability limited to their commitment. The GP is paid through management fees (often ~2% of commitments) and a performance share, the [[carried interest]] (often 20% above a return hurdle)."}},{"heading":{"fr":"Dry powder et thèse d'investissement","en":"Dry powder and investment thesis"},"body":{"fr":"Le [[dry powder]] désigne les capitaux déjà levés mais non encore investis : c'est la « poudre sèche » prête à être déployée. Une [[investment thesis]] (thèse d'investissement) est l'argumentaire qui justifie un achat : pourquoi cette société, comment créer de la valeur (croissance, marges, build-up, désendettement), et comment sortir. Sans thèse claire, pas d'investissement.","en":"[[dry powder]] is capital already raised but not yet invested: the \"dry powder\" ready to be deployed. An [[investment thesis]] is the rationale justifying a purchase: why this company, how to create value (growth, margins, build-up, deleveraging), and how to exit. No clear thesis, no investment."}},{"heading":{"fr":"Horizon de détention","en":"Holding period"},"body":{"fr":"Le PE n'est pas un investissement boursier de court terme : l'[[holding period]] (horizon de détention) typique est de 3 à 7 ans. Le fonds achète, transforme la société, puis la cède (à un autre fonds, à un industriel, ou en bourse). Cette durée explique pourquoi le PE peut prendre des décisions de long terme qu'une société cotée trimestre par trimestre aurait du mal à assumer.","en":"PE is not a short-term stock-market bet: the typical [[holding period]] is 3 to 7 years. The fund buys, transforms the company, then sells it (to another fund, to a strategic buyer, or via an IPO). This duration explains why PE can make long-term decisions that a quarter-by-quarter listed company would struggle to commit to."}},{"heading":{"fr":"Les maisons européennes","en":"European houses"},"body":{"fr":"Savoir nommer les acteurs européens est un signal de motivation fort. Côté français et européen on retient notamment Hivest Capital Partners (small/mid-cap), Ardian, Eurazeo, PAI Partners, Tikehau Capital, Bridgepoint, EQT (suédois) et Cinven. Citer KKR ou Blackstone est correct mais montrer une connaissance des maisons européennes différencie un candidat sérieux.","en":"Being able to name European players is a strong motivation signal. On the French and European side, note in particular Hivest Capital Partners (small/mid-cap), Ardian, Eurazeo, PAI Partners, Tikehau Capital, Bridgepoint, EQT (Swedish) and Cinven. Citing KKR or Blackstone is fine, but showing knowledge of European houses sets a serious candidate apart."}}],"exempleChiffre":{"title":{"fr":"Exemple chiffré","en":"Worked example"},"body":{"fr":"Un fonds lève 1 000 M€ d'engagements auprès de ses LP. Au bout de deux ans, il a investi 600 M€ dans cinq sociétés. Le dry powder restant est donc de 1 000 − 600 = 400 M€. Sur les engagements, le GP prélève des frais de gestion d'environ 2% par an, soit ~20 M€/an. Lors d'une cession future, le carried interest du GP représentera ~20% de la plus-value au-delà du hurdle.","en":"A fund raises 1,000 M€ of commitments from its LPs. After two years, it has invested 600 M€ across five companies. Remaining dry powder is therefore 1,000 − 600 = 400 M€. On the commitments, the GP charges management fees of about 2% per year, i.e. ~20 M€/year. On a future exit, the GP's carried interest will be ~20% of the gain above the hurdle."},"figures":[{"caption":{"fr":"Décomposition des engagements du fonds (M€)","en":"Breakdown of fund commitments (M€)"},"columns":["Poste","Montant"],"rows":[["Engagements LP","1 000"],["Capital investi","600"],["Dry powder","400"],["Frais de gestion ~2%/an","~20/an"]]}]},"piegesEntretien":[{"fr":"Dire que la banque d'affaires « investit » : non, elle conseille et facture des honoraires ; c'est le fonds (buy-side) qui investit son capital.","en":"Saying that investment banking \"invests\": no, it advises and charges fees; it is the fund (buy-side) that invests its capital."},{"fr":"Confondre GP et LP : le GP gère, les LP apportent l'argent. Le GP gagne frais + carried, les LP touchent l'essentiel de la plus-value.","en":"Confusing GP and LP: the GP manages, the LPs provide the money. The GP earns fees + carried, the LPs receive most of the gain."},{"fr":"Croire que le PE est un investissement court terme : l'horizon est typiquement 3–7 ans, pas quelques mois.","en":"Thinking PE is a short-term investment: the horizon is typically 3–7 years, not a few months."},{"fr":"Présenter le dry powder comme un actif investi : c'est au contraire le capital pas encore déployé.","en":"Presenting dry powder as invested assets: on the contrary, it is capital not yet deployed."},{"fr":"Ne citer que des maisons américaines (KKR, Blackstone) en entretien dans une maison européenne : montrez que vous connaissez Hivest, Ardian, PAI, Eurazeo.","en":"Naming only US houses (KKR, Blackstone) when interviewing at a European house: show you know Hivest, Ardian, PAI, Eurazeo."}],"synthese":{"fr":"• IB = conseil + honoraires ; PE = investissement en capital propre + plus-value.\n• Sell-side vend une transaction ; buy-side achète et gère des actifs.\n• GP = société de gestion (frais ~2% + carried ~20%) ; LP = investisseurs apporteurs de capital.\n• Dry powder = capital levé non investi ; thèse = pourquoi et comment créer de la valeur.\n• Horizon de détention typique : 3–7 ans.\n• Maisons européennes : Hivest, Ardian, Eurazeo, PAI, Tikehau, Bridgepoint, EQT, Cinven.","en":"• IB = advisory + fees; PE = equity investing + capital gain.\n• Sell-side sells a transaction; buy-side buys and manages assets.\n• GP = management company (fees ~2% + carried ~20%); LP = capital-providing investors.\n• Dry powder = raised but uninvested capital; thesis = why and how to create value.\n• Typical holding period: 3–7 years.\n• European houses: Hivest, Ardian, Eurazeo, PAI, Tikehau, Bridgepoint, EQT, Cinven."}},"glossaryRefs":[]},{"id":"mod.l1.three-statements","type":"module","level":1,"topic":"Accounting","tags":["3 états","P&L","bilan","flux"],"difficulty":1,"source":{"flag":"VERIFIED","ref":"BIWS Accounting + Vernimmen"},"title":{"fr":"Vue d'ensemble des 3 états","en":"Overview of the 3 statements"},"objective":{"fr":"Savoir à quoi sert chacun des trois états financiers et distinguer ce qui mesure une période de ce qui photographie un instant.","en":"Know what each of the three financial statements is for and tell apart what measures a period from what photographs a point in time."},"estMinutes":10,"prerequisites":[],"content":{"contexte":{"fr":"Toute analyse financière repose sur trois états : le compte de résultat, le bilan et le tableau de flux. La question d'entretien « comment les trois états sont-ils reliés ? » est un grand classique : la savoir vous place immédiatement comme sérieux.","en":"All financial analysis rests on three statements: the income statement, the balance sheet and the cash flow statement. The interview question \"how are the three statements connected?\" is a true classic: knowing it instantly marks you as serious."},"concepts":[{"heading":{"fr":"Le compte de résultat (P&L)","en":"The income statement (P&L)"},"body":{"fr":"Le compte de résultat ([[income statement]], ou [[P&L]]) mesure la performance sur une période (un trimestre, une année) : combien de chiffre d'affaires, quelles charges, quel profit. Il répond à la question « l'entreprise a-t-elle gagné de l'argent cette année ? ». C'est un film de la période, pas une photo.","en":"The [[income statement]] (or [[P&L]]) measures performance over a period (a quarter, a year): how much revenue, what costs, what profit. It answers \"did the company make money this year?\". It is a film of the period, not a snapshot."}},{"heading":{"fr":"Le bilan (balance sheet)","en":"The balance sheet"},"body":{"fr":"Le bilan ([[balance sheet]]) est une photographie à un instant donné : ce que l'entreprise possède (actif) et comment c'est financé (passif : dettes + capitaux propres). Il répond à « que vaut l'entreprise et que doit-elle, aujourd'hui ? ». C'est un instantané, daté précisément (par exemple au 31 décembre).","en":"The [[balance sheet]] is a snapshot at a given moment: what the company owns (assets) and how it is financed (liabilities: debt + equity). It answers \"what does the company own and owe, today?\". It is a snapshot, dated precisely (e.g. 31 December)."}},{"heading":{"fr":"Le tableau de flux de trésorerie","en":"The cash flow statement"},"body":{"fr":"Le tableau de flux ([[cash flow statement]]) retrace les mouvements d'argent réels sur la période : combien de cash est entré et sorti, et pourquoi (exploitation, investissement, financement). Il répond à « d'où vient et où va le cash ? ». C'est crucial car une entreprise peut être bénéficiaire au P&L mais manquer de trésorerie.","en":"The [[cash flow statement]] tracks actual cash movements over the period: how much cash came in and out, and why (operations, investing, financing). It answers \"where does cash come from and go?\". This matters because a company can be profitable on the P&L yet short of cash."}},{"heading":{"fr":"Période vs instantané","en":"Period vs point in time"},"body":{"fr":"Distinction clé : le compte de résultat et le tableau de flux couvrent une période (du 1er janvier au 31 décembre) ; le bilan est un instantané à une date. C'est pourquoi on dit que le bilan « relie » deux périodes : le bilan de fin d'année résulte du bilan de début d'année plus tout ce qui s'est passé dans le P&L et les flux entre les deux.","en":"Key distinction: the income statement and cash flow statement cover a period (1 January to 31 December); the balance sheet is a snapshot at a date. That is why the balance sheet \"links\" two periods: year-end balance sheet equals the start-of-year balance sheet plus everything that happened in the P&L and cash flows in between."}}],"exempleChiffre":{"title":{"fr":"Exemple chiffré","en":"Worked example"},"body":{"fr":"Une société clôture au 31/12. Sur l'année, le P&L affiche un résultat net de 40. Ce résultat net, conservé (non distribué), augmente les capitaux propres au bilan de fin d'année. Pendant ce temps, le tableau de flux montre que la trésorerie est passée de 30 (début) à 55 (fin), soit +25 de cash sur la période. Le P&L et les flux décrivent l'année ; les deux bilans sont les photos de début et de fin.","en":"A company closes on 31 December. Over the year, the P&L shows net income of 40. This retained (undistributed) net income increases equity on the year-end balance sheet. Meanwhile, the cash flow statement shows cash going from 30 (start) to 55 (end), i.e. +25 of cash over the period. The P&L and cash flows describe the year; the two balance sheets are the start and end snapshots."},"figures":[{"caption":{"fr":"Période vs instantané","en":"Period vs point in time"},"columns":["État","Couvre","Question"],"rows":[["Compte de résultat","Une période","A-t-on gagné de l'argent ?"],["Bilan","Un instant (date)","Que possède/doit-on ?"],["Tableau de flux","Une période","D'où vient le cash ?"]]}]},"piegesEntretien":[{"fr":"Dire que le bilan couvre une période : non, c'est une photo à une date précise.","en":"Saying the balance sheet covers a period: no, it is a snapshot at a precise date."},{"fr":"Confondre résultat net (P&L) et trésorerie (flux) : une société peut être bénéficiaire sans avoir de cash, ou inversement.","en":"Confusing net income (P&L) with cash (cash flow): a company can be profitable yet cash-poor, or the reverse."},{"fr":"Oublier que le résultat net non distribué relie le P&L au bilan via les capitaux propres.","en":"Forgetting that undistributed net income links the P&L to the balance sheet via equity."},{"fr":"Penser que le tableau de flux est secondaire : c'est souvent celui que regardent en premier prêteurs et investisseurs.","en":"Thinking the cash flow statement is secondary: it is often the one lenders and investors look at first."}],"synthese":{"fr":"• Compte de résultat (P&L) : performance sur une période → profit.\n• Bilan : photo à une date → actif = passif.\n• Tableau de flux : mouvements de cash sur une période → trésorerie.\n• Période (P&L, flux) vs instantané (bilan).\n• Le résultat net relie P&L et bilan ; le cash relie flux et bilan.","en":"• Income statement (P&L): performance over a period → profit.\n• Balance sheet: snapshot at a date → assets = liabilities.\n• Cash flow statement: cash movements over a period → cash position.\n• Period (P&L, cash flow) vs point in time (balance sheet).\n• Net income links P&L and balance sheet; cash links cash flow and balance sheet."}},"glossaryRefs":[]},{"id":"mod.l1.income-statement","type":"module","level":1,"topic":"Accounting","tags":["P&L","EBITDA","EBIT","marge"],"difficulty":1,"source":{"flag":"VERIFIED","ref":"BIWS Accounting + Vernimmen ; IS France ~25%"},"title":{"fr":"Le compte de résultat","en":"The income statement"},"objective":{"fr":"Lire un compte de résultat ligne par ligne du chiffre d'affaires au résultat net, et reconstituer l'EBITDA.","en":"Read an income statement line by line from revenue to net income, and rebuild EBITDA."},"estMinutes":13,"prerequisites":["mod.l1.three-statements"],"content":{"contexte":{"fr":"Le compte de résultat est le premier état qu'on vous demandera de commenter. Savoir descendre du chiffre d'affaires jusqu'au résultat net, et surtout reconstituer un [[EBITDA]] de bas en haut, est un réflexe attendu dès le premier entretien.","en":"The income statement is the first statement you will be asked to comment on. Walking from revenue down to net income, and especially rebuilding [[EBITDA]] bottom-up, is a reflex expected from the very first interview."},"concepts":[{"heading":{"fr":"Du chiffre d'affaires à la marge brute","en":"From revenue to gross margin"},"body":{"fr":"Le chiffre d'affaires (CA, [[revenue]]) est le montant des ventes hors taxes sur la période. On en retire le coût des biens vendus ([[COGS]]) pour obtenir la marge brute ([[gross margin]] ou [[gross profit]]). La marge brute mesure la rentabilité du cœur de l'activité avant les frais généraux.","en":"Revenue is the amount of sales excluding tax over the period. Subtracting the cost of goods sold ([[COGS]]) gives gross margin ([[gross profit]]). Gross margin measures the profitability of the core activity before overheads."}},{"heading":{"fr":"EBITDA (= EBE)","en":"EBITDA (= EBE)"},"body":{"fr":"L'[[EBITDA]] (Earnings Before Interest, Taxes, Depreciation and Amortization) correspond à l'EBE français (Excédent Brut d'Exploitation) : EBITDA = EBE. C'est le résultat d'exploitation avant amortissements et provisions, et avant intérêts et impôts. On l'utilise comme proxy de la génération de cash opérationnelle et comme base des multiples de valorisation (par exemple [[EV]]/EBITDA).","en":"[[EBITDA]] (Earnings Before Interest, Taxes, Depreciation and Amortization) equals the French EBE (Excédent Brut d'Exploitation): EBITDA = EBE. It is operating profit before depreciation and provisions, and before interest and tax. It is used as a proxy for operating cash generation and as the base for valuation multiples (e.g. [[EV]]/EBITDA)."}},{"heading":{"fr":"EBIT et résultat net","en":"EBIT and net income"},"body":{"fr":"En retirant de l'EBITDA les amortissements et dépréciations ([[D&A]]), on obtient l'[[EBIT]] (résultat d'exploitation). On déduit ensuite les charges d'intérêts ([[interest]]) sur la dette, puis l'impôt sur les sociétés (IS, ~25% en France), pour arriver au résultat net ([[net income]]) : le profit final qui revient aux actionnaires.","en":"Removing depreciation and amortization ([[D&A]]) from EBITDA gives [[EBIT]] (operating profit). You then deduct interest expense ([[interest]]) on debt, then corporate income tax (~25% in France), to reach [[net income]]: the final profit attributable to shareholders."}},{"heading":{"fr":"Charges fixes vs variables","en":"Fixed vs variable costs"},"body":{"fr":"Les charges variables évoluent avec le volume d'activité (matières premières, commissions) ; les charges fixes restent stables à court terme (loyers, salaires permanents, assurances). Plus la part de charges fixes est élevée, plus le levier opérationnel est fort : une hausse de CA fait fortement progresser le profit, mais une baisse le fait fortement chuter.","en":"Variable costs move with activity volume (raw materials, commissions); fixed costs stay stable in the short term (rent, permanent salaries, insurance). The higher the share of fixed costs, the higher the operating leverage: a rise in revenue strongly boosts profit, but a fall sharply cuts it."}},{"heading":{"fr":"HT vs TTC","en":"Excl. VAT vs incl. VAT"},"body":{"fr":"En France, le chiffre d'affaires se mesure hors taxes (HT), c'est-à-dire sans la TVA. Le montant toutes taxes comprises (TTC) inclut la TVA, qui n'est pas un revenu de l'entreprise : elle est collectée pour l'État. Confondre HT et TTC fausse toutes les marges. Le compte de résultat raisonne toujours en HT.","en":"In France, revenue is measured excluding tax (HT, excl. VAT). The all-tax-included amount (TTC, incl. VAT) includes VAT, which is not company revenue: it is collected on behalf of the State. Confusing HT and TTC distorts every margin. The income statement always works excl. VAT."}}],"exempleChiffre":{"title":{"fr":"Exemple chiffré — EBITDA de bas en haut","en":"Worked example — EBITDA bottom-up"},"body":{"fr":"On part du résultat net et on remonte. Résultat net = 100. On rajoute l'impôt = 20, les intérêts = 130, puis les amortissements et dépréciations ([[D&A]]) = 50. EBITDA = 100 + 20 + 130 + 50 = 300. On reconstitue ainsi l'EBITDA en « annulant » tout ce qui le sépare du résultat net : impôts, intérêts et D&A.","en":"Start from net income and walk up. Net income = 100. Add back tax = 20, interest = 130, then depreciation and amortization ([[D&A]]) = 50. EBITDA = 100 + 20 + 130 + 50 = 300. This rebuilds EBITDA by \"undoing\" everything that separates it from net income: tax, interest and D&A."},"figures":[{"caption":{"fr":"Reconstitution de l'EBITDA depuis le résultat net","en":"Rebuilding EBITDA from net income"},"columns":["Poste","Montant","Cumul"],"rows":[["Résultat net (NI)","100","100"],["+ Impôt","20","120"],["+ Intérêts","130","250"],["+ D&A","50","300"],["= EBITDA","","300"]]}]},"piegesEntretien":[{"fr":"Oublier de réintégrer les intérêts ou l'impôt en remontant vers l'EBITDA : il faut annuler les deux, plus le D&A.","en":"Forgetting to add back interest or tax when walking up to EBITDA: you must undo both, plus D&A."},{"fr":"Confondre EBITDA et EBIT : l'EBIT est après D&A, l'EBITDA avant. EBITDA − D&A = EBIT.","en":"Confusing EBITDA and EBIT: EBIT is after D&A, EBITDA before. EBITDA − D&A = EBIT."},{"fr":"Croire que l'EBITDA est du cash : c'est un proxy, il ignore la variation de BFR et les investissements (capex).","en":"Believing EBITDA is cash: it is a proxy; it ignores working capital changes and capex."},{"fr":"Raisonner en TTC sur le CA : le compte de résultat est toujours en HT, la TVA n'est pas un revenu.","en":"Working on revenue incl. VAT: the income statement is always excl. VAT; VAT is not revenue."},{"fr":"Appliquer un taux d'IS de 33% pour la France : le taux normal est désormais ~25%.","en":"Applying a 33% corporate tax rate for France: the standard rate is now ~25%."}],"synthese":{"fr":"• CA (HT) − COGS = marge brute.\n• EBITDA = EBE ; c'est avant intérêts, impôts et D&A.\n• EBITDA − D&A = EBIT ; EBIT − intérêts − impôt = résultat net.\n• EBITDA bottom-up = NI + impôt + intérêts + D&A.\n• Charges fixes → levier opérationnel ; CA toujours en HT.\n• IS France ~25%.","en":"• Revenue (excl. VAT) − COGS = gross margin.\n• EBITDA = EBE; it is before interest, tax and D&A.\n• EBITDA − D&A = EBIT; EBIT − interest − tax = net income.\n• EBITDA bottom-up = NI + tax + interest + D&A.\n• Fixed costs → operating leverage; revenue always excl. VAT.\n• France corporate tax ~25%."}},"glossaryRefs":[]},{"id":"mod.l1.balance-sheet","type":"module","level":1,"topic":"Accounting","tags":["bilan","working capital","BFR","goodwill","equity"],"difficulty":1,"source":{"flag":"VERIFIED","ref":"BIWS Accounting + Vernimmen"},"title":{"fr":"Le bilan","en":"The balance sheet"},"objective":{"fr":"Comprendre l'égalité actif = passif, le besoin en fonds de roulement, les capitaux propres et le goodwill.","en":"Understand the assets = liabilities identity, working capital, equity and goodwill."},"estMinutes":13,"prerequisites":["mod.l1.three-statements"],"content":{"contexte":{"fr":"Le bilan est la photographie financière de l'entreprise. En entretien, on testera votre maîtrise de l'égalité comptable et du [[working capital]] (BFR), souvent via la question piège : « un BFR négatif, c'est bon ou mauvais ? ».","en":"The balance sheet is the company's financial snapshot. In interviews, your grasp of the accounting identity and of [[working capital]] (BFR) will be tested, often via the trick question: \"is negative working capital good or bad?\"."},"concepts":[{"heading":{"fr":"Actif = Passif","en":"Assets = Liabilities"},"body":{"fr":"Le principe fondamental du bilan : Actif = Passif. L'actif liste ce que l'entreprise possède (immobilisations, stocks, créances clients, trésorerie). Le passif explique comment c'est financé : par les dettes ([[liabilities]]) et par les capitaux propres ([[equity]]). Cette égalité tient toujours par construction : chaque euro d'actif a une source de financement.","en":"The fundamental balance-sheet principle: Assets = Liabilities (+ Equity). Assets list what the company owns (fixed assets, inventory, receivables, cash). The other side explains how it is financed: by debt ([[liabilities]]) and by [[equity]]. This identity always holds by construction: every euro of assets has a financing source."}},{"heading":{"fr":"Le besoin en fonds de roulement (BFR)","en":"Working capital (BFR)"},"body":{"fr":"Le [[working capital]] (besoin en fonds de roulement, BFR) mesure l'argent immobilisé par le cycle d'exploitation : BFR ≈ stocks + créances clients − dettes fournisseurs. Un BFR positif signifie que l'entreprise finance ses clients et ses stocks avant d'être payée ; il consomme du cash quand le CA croît.","en":"[[working capital]] (BFR) measures the cash tied up by the operating cycle: working capital ≈ inventory + receivables − payables. Positive working capital means the company funds its customers and inventory before being paid; it consumes cash as revenue grows."}},{"heading":{"fr":"Capitaux propres","en":"Equity"},"body":{"fr":"Les capitaux propres ([[equity]]) représentent ce qui revient aux actionnaires : capital apporté + résultats accumulés non distribués (réserves). Ils augmentent du résultat net conservé et diminuent des dividendes versés ou des pertes. C'est le « coussin » qui appartient aux propriétaires une fois toutes les dettes remboursées.","en":"[[equity]] represents what belongs to shareholders: paid-in capital + accumulated undistributed earnings (reserves). It increases by retained net income and decreases by dividends paid or losses. It is the \"cushion\" owned by shareholders once all debts are repaid."}},{"heading":{"fr":"Le goodwill","en":"Goodwill"},"body":{"fr":"Le [[goodwill]] (écart d'acquisition) apparaît à l'actif lors d'un rachat payé au-dessus de la valeur comptable des actifs nets de la cible. Il correspond au « surprix » payé pour des éléments incorporels (marque, clientèle, synergies). Il n'est pas amorti en normes IFRS mais testé pour dépréciation ; une dépréciation passe en charge et réduit le résultat et les capitaux propres.","en":"[[goodwill]] appears on the asset side when an acquisition is paid above the book value of the target's net assets. It is the \"premium\" paid for intangibles (brand, customer base, synergies). Under IFRS it is not amortized but tested for impairment; an impairment hits the P&L and reduces net income and equity."}}],"exempleChiffre":{"title":{"fr":"Exemple chiffré — un bilan simple","en":"Worked example — a simple balance sheet"},"body":{"fr":"Une société possède 150 d'immobilisations, 40 de stocks, 30 de créances clients et 20 de trésorerie, soit 240 d'actif total. Elle a 50 de dettes fournisseurs, 90 de dette financière et 100 de capitaux propres, soit 240 de passif total : Actif = Passif = 240. Son BFR = stocks 40 + créances 30 − fournisseurs 50 = 20 : 20 de cash immobilisé dans le cycle d'exploitation.","en":"A company owns 150 of fixed assets, 40 of inventory, 30 of receivables and 20 of cash, i.e. 240 of total assets. It has 50 of payables, 90 of financial debt and 100 of equity, i.e. 240 of total liabilities + equity: Assets = Liabilities = 240. Its working capital = inventory 40 + receivables 30 − payables 50 = 20: 20 of cash tied up in the operating cycle."},"figures":[{"caption":{"fr":"Bilan simplifié (actif = passif)","en":"Simplified balance sheet (assets = liabilities)"},"columns":["Actif","Montant","Passif","Montant"],"rows":[["Immobilisations","150","Dettes fournisseurs","50"],["Stocks","40","Dette financière","90"],["Créances clients","30","Capitaux propres","100"],["Trésorerie","20","",""],["Total actif","240","Total passif","240"]]}]},"piegesEntretien":[{"fr":"Affirmer qu'un BFR négatif est forcément mauvais : c'est faux. Dans le retail ou l'abonnement, on encaisse le client avant de payer le fournisseur, le BFR négatif finance la croissance et c'est sain.","en":"Claiming negative working capital is necessarily bad: false. In retail or subscription, you collect from customers before paying suppliers; negative working capital funds growth and is healthy."},{"fr":"Oublier que l'égalité actif = passif tient toujours : si elle ne tient pas, il y a une erreur de modélisation.
