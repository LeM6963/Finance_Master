function openPathModal(){
  const goals=S.profile.goals.length?S.profile.goals:TOPICS.filter(t=>IDX.modules.some(m=>m.topic===t));
  let lvl=S.profile.diagnosticLevel||S.profile.selfLevel||2, intensity='standard', selGoals=new Set(S.profile.goals);
  modal(`<h3>${LANG==='fr'?'Nouveau parcours personnalisé':'New personalized path'}</h3>
  <div class="field"><label>${LANG==='fr'?'Nom':'Name'}</label><input type="text" id="pname" value="${LANG==='fr'?'Mon parcours':'My path'}"></div>
  <div class="field"><label>${LANG==='fr'?'Niveau cible':'Target level'}</label><select id="plvl">${[1,2,3,4,5].map(n=>`<option value="${n}" ${n==lvl?'selected':''}>N${n}</option>`).join('')}</select></div>
  <div class="field"><label>${LANG==='fr'?'Intensité':'Intensity'}</label><select id="pint"><option value="light">light</option><option value="standard" selected>standard</option><option value="intense">intense</option></select></div>
  <div class="field"><label>${LANG==='fr'?'Domaines ciblés':'Target domains'}</label><div id="pgoals">${TOPICS.filter(t=>IDX.modules.some(m=>m.topic===t)).map(t=>`<span class="chip ${selGoals.has(t)?'on':''}" data-t="${t}">${t}</span>`).join('')}</div></div>
  <div class="row" style="margin-top:14px"><button class="btn" id="pcreate">${LANG==='fr'?'Générer':'Generate'}</button><button class="btn ghost" id="pcancel">${LANG==='fr'?'Annuler':'Cancel'}</button></div>`);
  document.querySelectorAll('#pgoals .chip').forEach(ch=>ch.onclick=()=>{const t=ch.dataset.t;if(selGoals.has(t))selGoals.delete(t);else selGoals.add(t);ch.classList.toggle('on');});
  document.getElementById('pcancel').onclick=closeModal;
  document.getElementById('pcreate').onclick=()=>{
    const name=document.getElementById('pname').value||'Parcours'; const L2=+document.getElementById('plvl').value; const intn=document.getElementById('pint').value;
    const goalsArr=[...selGoals]; const seq=IDX.modules.filter(m=>m.level<=L2&&(!goalsArr.length||goalsArr.includes(m.topic))).sort((a,b)=>a.level-b.level||a.topic.localeCompare(b.topic)).map(m=>m.id);
    S.paths.push({id:'path.'+Date.now(),name,levelTarget:L2,intensity:intn,moduleSequence:seq,createdAt:new Date().toISOString()});
    if(intn==='intense')S.settings.dailyCardGoal=25;else if(intn==='light')S.settings.dailyCardGoal=10;else S.settings.dailyCardGoal=15;
    save();closeModal();render();
  };
}

/* ----- Generator (custom training sessions) ----- */
function viewGenerator(v){
  v.innerHTML=`<div class="hello"><h1>${tt('generate')}</h1><p>${LANG==='fr'?'Compose ta session : format, thèmes, difficulté, longueur. Filtre, génère, relance comme tu veux.':'Compose your session: format, topics, difficulty, length. Filter, generate, relaunch at will.'}</p></div>
  <div class="card">
   <div class="field"><label>${LANG==='fr'?'Format':'Format'}</label><div id="gmode">${[['flashcard','Flashcards'],['qcm','QCM'],['mixed',LANG==='fr'?'Mixte':'Mixed']].map((m,i)=>`<span class="chip ${i===0?'on':''}" data-m="${m[0]}">${m[1]}</span>`).join('')}</div></div>
   <div class="field"><label>${LANG==='fr'?'Thèmes (vide = tous)':'Topics (empty = all)'}</label><div id="gtopics">${TOPICS.filter(t=>cardsOfTopic(t).length||IDX.qcm.some(q=>q.topic===t)).map(t=>`<span class="chip" data-t="${t}">${t}</span>`).join('')}</div></div>
   <div class="row">
     <div class="field" style="flex:1"><label>${LANG==='fr'?'Niveau max':'Max level'}</label><select id="glvl">${[1,2,3,4,5].map(n=>`<option value="${n}" ${n===5?'selected':''}>N${n}</option>`).join('')}</select></div>
     <div class="field" style="flex:1"><label>${LANG==='fr'?'Difficulté max':'Max difficulty'}</label><select id="gdiff">${[1,2,3,4,5].map(n=>`<option value="${n}" ${n===5?'selected':''}>${n}</option>`).join('')}</select></div>
     <div class="field" style="flex:1"><label>${LANG==='fr'?'Longueur':'Length'}</label><select id="glen"><option>10</option><option>15</option><option>20</option><option>30</option></select></div>
   </div>
   <div class="row" style="margin-top:8px"><button class="btn" id="ggen">${LANG==='fr'?'Générer la session':'Generate session'} ▶</button></div>
   <div class="muted" id="gcount" style="margin-top:10px"></div>
  </div>`;
  const sel={mode:'flashcard',topics:new Set()};
  document.querySelectorAll('#gmode .chip').forEach(c=>c.onclick=()=>{document.querySelectorAll('#gmode .chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');sel.mode=c.dataset.m;upd();});
  document.querySelectorAll('#gtopics .chip').forEach(c=>c.onclick=()=>{const t=c.dataset.t;sel.topics.has(t)?sel.topics.delete(t):sel.topics.add(t);c.classList.toggle('on');upd();});
  function pool(){const lvl=+document.getElementById('glvl').value,diff=+document.getElementById('gdiff').value,tp=[...sel.topics];
    const fcs=IDX.flashcards.filter(c=>c.level<=lvl&&c.difficulty<=diff&&(!tp.length||tp.includes(c.topic)));
    const qs=IDX.qcm.filter(c=>c.level<=lvl&&c.difficulty<=diff&&(!tp.length||tp.includes(c.topic)));
    return {fcs,qs};}
  function upd(){const{fcs,qs}=pool();document.getElementById('gcount').textContent=(LANG==='fr'?'Disponible : ':'Available: ')+`${fcs.length} flashcards · ${qs.length} QCM`;}
  document.getElementById('glvl').onchange=upd;document.getElementById('gdiff').onchange=upd;upd();
  document.getElementById('ggen').onclick=()=>{const len=+document.getElementById('glen').value;const{fcs,qs}=pool();
    if(sel.mode==='qcm'){SESSION={type:'quiz',key:'gen'+Date.now(),queue:qs.sort(()=>Math.random()-.5).slice(0,len),i:0,sel:[],answered:false,correct:0};go('#/quiz?gen=1');}
    else if(sel.mode==='flashcard'){SESSION={type:'review',key:'gen'+Date.now(),queue:fcs.sort(()=>Math.random()-.5).slice(0,len),i:0,flipped:false,done:0};go('#/review?gen=1');}
    else{const mix=fcs.sort(()=>Math.random()-.5).slice(0,Math.ceil(len/2));SESSION={type:'review',key:'gen'+Date.now(),queue:mix,i:0,flipped:false,done:0};go('#/review?gen=1');}
  };
}

/* ----- Badges ----- */
function viewBadges(v){
  v.innerHTML=`<div class="hello"><h1>${tt('badges')}</h1><p>${S.game.badges.length} / ${Object.keys(BADGES).length} ${LANG==='fr'?'débloqués':'unlocked'}</p></div>
  <div class="card"><div class="badges">${Object.keys(BADGES).map(id=>{const b=BADGES[id];const lit=S.game.badges.includes(id);return `<div class="badge2 ${lit?'lit':'locked'}"><div class="b">${b[0]}</div><span>${L(b[1])}</span></div>`;}).join('')}</div></div>`;

/* ----- Diagnostic ----- */
function diagnosticSet(){ // ~8 QCM across levels/topics
  const picks=[]; [1,2,3,4,5].forEach(lv=>{const c=IDX.qcm.filter(q=>q.level===lv);for(let k=0;k<2&&c.length;k++)picks.push(c[Math.floor(Math.random()*c.length)]);});
  return picks.filter((q,i,a)=>q&&a.indexOf(q)===i).slice(0,8);
}
function viewDiagnostic(v){
  if(!SESSION||SESSION.type!=='diag'){SESSION={type:'diag',queue:diagnosticSet(),i:0,sel:[],answered:false,score:0,levelHits:{}};}
  const s=SESSION; if(!s.queue.length){v.innerHTML=`<div class="card">${LANG==='fr'?'Pas assez de QCM pour le diagnostic.':'Not enough quizzes for diagnostic.'}</div>`;return;}
  if(s.i>=s.queue.length){
    const ratio=s.score/s.queue.length; let lvl=ratio>=0.85?5:ratio>=0.65?4:ratio>=0.45?3:ratio>=0.25?2:1;
    S.profile.diagnosticLevel=lvl; if(!S.profile.selfLevel)S.profile.selfLevel=lvl; save();
    v.innerHTML=`<div class="card" style="text-align:center;padding:46px 20px"><div style="font-size:42px">🧭</div><h2>${LANG==='fr'?'Diagnostic terminé':'Diagnostic complete'}</h2><p>${LANG==='fr'?'Score':'Score'} : <b>${s.score}/${s.queue.length}</b></p><p>${LANG==='fr'?'Niveau estimé':'Estimated level'} : <b>N${lvl} — ${['','Débutant','Fondamentaux','Intermédiaire','Avancé','Expert'][lvl]}</b></p><div style="margin-top:14px"><a class="btn" href="#/paths">${LANG==='fr'?'Créer mon parcours':'Build my path'}</a> <a class="btn ghost" href="#/dashboard">${tt('backDash')}</a></div></div>`;
    SESSION=null;return;
  }
  const q=s.queue[s.i];
  v.innerHTML=`<div class="hello"><h1>${tt('diagnostic')}</h1><p>${LANG==='fr'?'8 questions pour estimer ton niveau':'8 questions to estimate your level'}</p></div>
  <div class="progressbar"><div style="width:${Math.round(s.i/s.queue.length*100)}%"></div></div>
  <div class="card"><div style="font-size:16px;font-weight:600;margin-bottom:8px">${renderText(q.stem)}</div>
  <div id="opts">${q.options.map(o=>{let cls='opt';if(s.answered){if(o.correct)cls+=' right';else if(s.sel.includes(o.id))cls+=' wrong';}else if(s.sel.includes(o.id))cls+=' sel';return `<div class="${cls}" data-id="${o.id}"><span class="mk">${s.answered?(o.correct?'✓':(s.sel.includes(o.id)?'✕':'')):''}</span><span>${renderText(o.text)}</span></div>`;}).join('')}</div>
  ${s.answered?`<div style="margin-top:12px"><button class="btn" id="nx">${tt('next')} →</button></div>`:`<div style="margin-top:12px"><button class="btn" id="vd" disabled>${tt('check')}</button></div>`}</div>`;
  if(!s.answered){v.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{s.sel=[el.dataset.id];render();});const vd=document.getElementById('vd');if(s.sel.length)vd.disabled=false;vd.onclick=()=>{s.answered=true;const ok=q.options.find(o=>o.id===s.sel[0])&&q.options.find(o=>o.id===s.sel[0]).correct;if(ok)s.score++;render();};}
  else document.getElementById('nx').onclick=()=>{s.i++;s.sel=[];s.answered=false;render();};
}

/* ----- Onboarding ----- */
function viewOnboarding(v){
  v.innerHTML=`<div class="hello"><h1>${LANG==='fr'?'Bienvenue 👋':'Welcome 👋'}</h1><p>${LANG==='fr'?'Personnalisons ta préparation. La personnalisation est au cœur du produit.':'Let’s personalize your prep. Personalization is at the heart of the product.'}</p></div>
  <div class="card"><h3>${LANG==='fr'?'1. Quel est ton niveau ?':'1. What is your level?'}</h3><p class="cap">${LANG==='fr'?'Auto-évalue-toi, ou passe le diagnostic.':'Self-assess, or take the diagnostic.'}</p>
   <div id="lvlchips">${[[1,'Débutant','Beginner'],[2,'Fondamentaux','Fundamentals'],[3,'Intermédiaire','Intermediate'],[4,'Avancé','Advanced'],[5,'Expert / MP','Expert / MP']].map(x=>`<span class="chip" data-l="${x[0]}">N${x[0]} · ${LANG==='fr'?x[1]:x[2]}</span>`).join('')}</div>
   <div style="margin-top:10px"><a class="btn ghost sm" href="#/diagnostic">🧭 ${LANG==='fr'?'Passer le diagnostic':'Take the diagnostic'}</a></div>
  </div>
  <div class="card"><h3>${LANG==='fr'?'2. Tes objectifs (domaines)':'2. Your goals (domains)'}</h3><div id="goalchips">${TOPICS.filter(t=>IDX.modules.some(m=>m.topic===t)).map(t=>`<span class="chip" data-t="${t}">${t}</span>`).join('')}</div></div>
  <div style="margin-top:16px"><button class="btn" id="finish">${LANG==='fr'?'Commencer →':'Start →'}</button></div>`;
  let lvl=null; const goals=new Set();
  v.querySelectorAll('#lvlchips .chip').forEach(c=>c.onclick=()=>{v.querySelectorAll('#lvlchips .chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');lvl=+c.dataset.l;});
  v.querySelectorAll('#goalchips .chip').forEach(c=>c.onclick=()=>{const t=c.dataset.t;goals.has(t)?goals.delete(t):goals.add(t);c.classList.toggle('on');});
  document.getElementById('finish').onclick=()=>{S.profile.selfLevel=lvl||S.profile.diagnosticLevel||2;S.profile.goals=[...goals];S.profile.onboarded=true;
    // auto-create a starter path
    if(!S.paths.length){const L2=S.profile.selfLevel;const seq=IDX.modules.filter(m=>m.level<=Math.max(L2+1,2)&&(!goals.size||goals.has(m.topic))).sort((a,b)=>a.level-b.level).map(m=>m.id);S.paths.push({id:'path.start',name:LANG==='fr'?'Parcours de démarrage':'Starter path',levelTarget:L2,intensity:'standard',moduleSequence:seq,createdAt:new Date().toISOString()});}
    save();go('#/dashboard');};
}

/* ----- Settings ----- */
function viewSettings(v){
  v.innerHTML=`<div class="hello"><h1>${tt('settings')}</h1><p>${LANG==='fr'?'Langue, thème, objectifs, données.':'Language, theme, goals, data.'}</p></div>
  <div class="card"><h3>${LANG==='fr'?'Préférences':'Preferences'}</h3>
   <div class="field"><label>${LANG==='fr'?'Objectif quotidien (cartes)':'Daily goal (cards)'}</label><input type="number" id="setgoal" min="5" max="100" value="${S.settings.dailyCardGoal}"></div>
   <div class="row"><span class="muted">${LANG==='fr'?'Persistance':'Persistence'} : <b>${Store.durable?(LANG==='fr'?'durable (window.storage)':'durable (window.storage)'):(LANG==='fr'?'mémoire (utilise l’export)':'memory (use export)')}</b></span></div>
  </div>
  <div class="card"><h3>${LANG==='fr'?'Données & portabilité':'Data & portability'}</h3><p class="cap">${LANG==='fr'?'Exporte ta progression en JSON, ou importe-la sur une autre machine.':'Export your progress as JSON, or import it on another machine.'}</p>
   <div class="row"><button class="btn ghost" id="exp">⬇ ${LANG==='fr'?'Exporter':'Export'}</button><button class="btn ghost" id="imp">⬆ ${LANG==='fr'?'Importer':'Import'}</button><button class="btn ghost" id="rst" style="color:var(--red)">${LANG==='fr'?'Réinitialiser':'Reset'}</button></div>
   <div class="field" style="margin-top:12px"><textarea id="io" style="width:100%;min-height:120px;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:ui-monospace,monospace;font-size:12px;background:var(--surface)"></textarea></div>
  </div>`;
  document.getElementById('setgoal').onchange=e=>{S.settings.dailyCardGoal=Math.max(5,+e.target.value||15);save();};
  document.getElementById('exp').onclick=async()=>{document.getElementById('io').value=await Store.exportJSON();toast(LANG==='fr'?'Exporté ci-dessous':'Exported below');};
  document.getElementById('imp').onclick=async()=>{try{await Store.importJSON(document.getElementById('io').value);await loadState();toast(LANG==='fr'?'Import réussi':'Imported');render();}catch(e){toast('⚠ '+e.message);}};
  document.getElementById('rst').onclick=async()=>{if(confirm(LANG==='fr'?'Tout réinitialiser ?':'Reset everything?')){S=defaultState();await Store.setState(S);LANG=S.settings.lang;applyTheme();render();}};
}

/* ---------- 12. Cmd+K ---------- */
function openCmdK(){
  modal(`<div class="cmdk" onclick="event.stopPropagation()"><input id="cmdkin" placeholder="${tt('search')}" autocomplete="off"><div class="res" id="cmdkres"></div></div>`,true);
  const inp=document.getElementById('cmdkin'); inp.focus(); let hl=0,results=[];
  function search(q){
    q=q.toLowerCase().trim(); results=[];
    if(!q){results=[{t:tt('dashboard'),h:'#/dashboard',k:'nav'},{t:tt('review'),h:'#/review',k:'nav'},{t:tt('generate'),h:'#/generate',k:'nav'},{t:tt('glossary'),h:'#/glossary',k:'nav'}];}
    else{
      IDX.modules.forEach(m=>{if(norm(L(m.title)).includes(q))results.push({t:L(m.title),h:'#/module/'+m.id,k:'module'});});
      IDX.glossary.forEach(g=>{if(norm(g.term).includes(q)||(g.aliases||[]).some(a=>norm(a).includes(q)))results.push({t:g.term+' — '+L(g.definition).slice(0,50)+'…',h:'#/glossary?q='+encodeURIComponent(g.term),k:'terme'});});
      IDX.flashcards.forEach(c=>{if(norm(L(c.front)).includes(q))results.push({t:L(c.front),h:'#/review?module='+c.moduleId,k:'carte'});});
      IDX.qcm.forEach(c=>{if(norm(L(c.stem)).includes(q))results.push({t:L(c.stem),h:'#/quiz?module='+c.moduleId,k:'QCM'});});
      results=results.slice(0,20);
    }
    hl=0;draw();
  }
  function draw(){document.getElementById('cmdkres').innerHTML=results.length?results.map((r,i)=>`<div class="r ${i===hl?'hl':''}" data-i="${i}"><span>${esc(r.t).slice(0,70)}</span><span class="k">${r.k}</span></div>`).join(''):`<div class="empty">${tt('empty')}</div>`;
    document.querySelectorAll('#cmdkres .r').forEach(el=>el.onclick=()=>{go(results[+el.dataset.i].h);closeModal();});}
  inp.oninput=()=>search(inp.value);
  inp.onkeydown=e=>{if(e.key==='ArrowDown'){hl=Math.min(results.length-1,hl+1);draw();e.preventDefault();}else if(e.key==='ArrowUp'){hl=Math.max(0,hl-1);draw();e.preventDefault();}else if(e.key==='Enter'){if(results[hl]){go(results[hl].h);closeModal();}}else if(e.key==='Escape')closeModal();};
  search('');
}

/* ---------- 13. MODAL / TOAST / THEME / LANG ---------- */
function modal(html,bareForCmdk){const root=document.getElementById('modal-root');root.innerHTML=`<div class="modal-bg" id="mbg">${bareForCmdk?html:`<div class="card" style="max-width:480px;width:92vw" onclick="event.stopPropagation()">${html}</div>`}</div>`;document.getElementById('mbg').onclick=closeModal;}
function closeModal(){document.getElementById('modal-root').innerHTML='';}
let toastTimer=null;
function toast(msg,cls){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show'+(cls?' '+cls:'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.className='toast',1900);}
function applyTheme(){document.body.dataset.theme=S.settings.theme;document.getElementById('themebtn').textContent=S.settings.theme==='dark'?'☀️':'🌙';document.documentElement.lang=LANG;document.querySelectorAll('#langseg button').forEach(b=>b.classList.toggle('on',b.dataset.lang===LANG));document.querySelectorAll('[data-t]').forEach(el=>el.textContent=tt(el.dataset.t));}

/* ---------- 14. BOOT ---------- */
(async function boot(){
  await loadState(); recomputeMastery(); applyTheme();
  document.getElementById('themebtn').onclick=()=>{S.settings.theme=S.settings.theme==='dark'?'light':'dark';applyTheme();save();};
  document.getElementById('langseg').onclick=e=>{const b=e.target.closest('button');if(!b)return;LANG=b.dataset.lang;S.settings.lang=LANG;applyTheme();save();render();};
  document.getElementById('burger').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('searchbar').onclick=openCmdK;
  window.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCmdK();}});
  window.addEventListener('hashchange',render);
  render();
})();
</script>
