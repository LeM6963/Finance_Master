.","en":"Did not multiply the premium by beta."}}],"explanation":{"fr":"Re = Rf + beta × (Rm − Rf) = 1% + 1,5 × 2% = 4%.","en":"Re = Rf + beta × (Rm − Rf) = 1% + 1.5 × 2% = 4%."},"workings":{"fr":"1% + 1,5 × (3% − 1%) = 1% + 3% = 4%.","en":"1% + 1.5 × (3% − 1%) = 1% + 3% = 4%."}},{"id":"qcm.l3.wacc.003","type":"qcm","level":3,"topic":"WACC","tags":["beta"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.wacc","stem":{"fr":"Quelle est la formule de delevering du bêta ?","en":"What is the beta unlevering formula?"},"multi":false,"options":[{"id":"a","text":{"fr":"βu = βL × (1 + (1 − T) · D/E)","en":"βu = βL × (1 + (1 − T) · D/E)"},"correct":false,"why":{"fr":"C'est la formule de relevering (multiplication), pas de delevering.","en":"That is the relevering formula (multiplication), not unlevering."}},{"id":"b","text":{"fr":"βu = βL / (1 + (1 − T) · D/E)","en":"βu = βL / (1 + (1 − T) · D/E)"},"correct":true,"why":{"fr":"On divise le bêta levered pour retirer l'effet du levier financier.","en":"You divide the levered beta to strip out financial leverage."}},{"id":"c","text":{"fr":"βu = βL / (1 + D/E)","en":"βu = βL / (1 + D/E)"},"correct":false,"why":{"fr":"Oublie le tax shield (1 − T).","en":"Forgets the tax shield (1 − T)."}},{"id":"d","text":{"fr":"βu = βL + (1 − T) · D/E","en":"βu = βL + (1 − T) · D/E"},"correct":false,"why":{"fr":"Le delevering est multiplicatif, pas additif.","en":"Unlevering is multiplicative, not additive."}}],"explanation":{"fr":"βu = βL / (1 + (1 − T) · D/E) retire l'effet du levier ; on relève ensuite au levier cible.","en":"βu = βL / (1 + (1 − T) · D/E) removes leverage; you then relever to the target's structure."},"workings":null},{"id":"qcm.l3.wacc.004","type":"qcm","level":3,"topic":"WACC","tags":["WACC"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.wacc","stem":{"fr":"Quelle affirmation sur le WACC en fonction du levier est correcte ?","en":"Which statement about the WACC as a function of leverage is correct?"},"multi":false,"options":[{"id":"a","text":{"fr":"Le WACC décroît indéfiniment avec le levier","en":"The WACC decreases indefinitely with leverage"},"correct":false,"why":{"fr":"Faux : au-delà d'un seuil le risque de défaut renchérit le capital.","en":"False: beyond a threshold default risk raises the cost of capital."}},{"id":"b","text":{"fr":"Le WACC a une forme en U avec un minimum","en":"The WACC is U-shaped with a minimum"},"correct":true,"why":{"fr":"La dette le fait baisser d'abord, puis le risque de défaut le fait remonter.","en":"Debt lowers it first, then default risk pushes it back up."}},{"id":"c","text":{"fr":"Le WACC augmente toujours avec le levier","en":"The WACC always rises with leverage"},"correct":false,"why":{"fr":"Au début la dette, moins chère et déductible, le fait baisser.","en":"Initially debt, cheaper and deductible, lowers it."}},{"id":"d","text":{"fr":"Le WACC est indépendant du levier","en":"The WACC is independent of leverage"},"correct":false,"why":{"fr":"Vrai uniquement dans le monde sans impôt de Modigliani-Miller, pas en pratique.","en":"True only in the tax-free Modigliani-Miller world, not in practice."}}],"explanation":{"fr":"La courbe du WACC est en U : minimum à la structure optimale, puis remontée avec le risque de défaut.","en":"The WACC curve is U-shaped: a minimum at the optimal structure, then rising with default risk."},"workings":null},{"id":"qcm.l3.wacc.005","type":"qcm","level":3,"topic":"WACC","tags":["CAPM"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.wacc","stem":{"fr":"Quel ordre de grandeur pour une prime de risque actions (ERP) réaliste ?","en":"What is a realistic order of magnitude for the equity risk premium (ERP)?"},"multi":false,"options":[{"id":"a","text":{"fr":"4–6%","en":"4–6%"},"correct":true,"why":{"fr":"Fourchette communément retenue sur les marchés développés.","en":"Range commonly used in developed markets."}},{"id":"b","text":{"fr":"10–12%","en":"10–12%"},"correct":false,"why":{"fr":"Beaucoup trop élevé, gonflerait artificiellement le coût des fonds propres.","en":"Far too high, would artificially inflate the cost of equity."}},{"id":"c","text":{"fr":"0–1%","en":"0–1%"},"correct":false,"why":{"fr":"Trop faible : les actions exigent une prime substantielle sur le sans-risque.","en":"Too low: equities require a substantial premium over risk-free."}},{"id":"d","text":{"fr":"20%","en":"20%"},"correct":false,"why":{"fr":"Irréaliste sur un marché développé.","en":"Unrealistic in a developed market."}}],"explanation":{"fr":"Une ERP réaliste se situe autour de 4–6% sur les marchés développés.","en":"A realistic ERP is around 4–6% in developed markets."},"workings":null},{"id":"qcm.l3.tv.001","type":"qcm","level":3,"topic":"DCF","tags":["terminal-value","Gordon"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.terminal-value","stem":{"fr":"Quelle est la formule de Gordon de la valeur terminale ?","en":"What is the Gordon terminal value formula?"},"multi":false,"options":[{"id":"a","text":{"fr":"TV = FCF · (1 + g) / (WACC − g)","en":"TV = FCF · (1 + g) / (WACC − g)"},"correct":true,"why":{"fr":"Formule de la rente perpétuelle croissante.","en":"Growing perpetuity formula."}},{"id":"b","text":{"fr":"TV = FCF / (WACC + g)","en":"TV = FCF / (WACC + g)"},"correct":false,"why":{"fr":"Mauvais signe : on soustrait g, pas l'inverse.","en":"Wrong sign: you subtract g, not add it."}},{"id":"c","text":{"fr":"TV = FCF × (WACC − g)","en":"TV = FCF × (WACC − g)"},"correct":false,"why":{"fr":"On divise par (WACC − g), on ne multiplie pas.","en":"You divide by (WACC − g), not multiply."}},{"id":"d","text":{"fr":"TV = FCF · (1 + WACC) / (g − WACC)","en":"TV = FCF · (1 + WACC) / (g − WACC)"},"correct":false,"why":{"fr":"Numérateur et dénominateur inversés.","en":"Numerator and denominator inverted."}}],"explanation":{"fr":"TV = FCF·(1+g)/(WACC−g), formule de la rente perpétuelle croissante.","en":"TV = FCF·(1+g)/(WACC−g), the growing perpetuity formula."},"workings":null},{"id":"qcm.l3.tv.002","type":"qcm","level":3,"topic":"DCF","tags":["terminal-value"],"difficulty":4,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l3.terminal-value","stem":{"fr":"TV = 10 000, FCF = 1 000, WACC = 10%. Quel est le g implicite (approximé) ?","en":"TV = 10,000, FCF = 1,000, WACC = 10%. What is the (approximate) implied g?"},"multi":false,"options":[{"id":"a","text":{"fr":"0%","en":"0%"},"correct":true,"why":{"fr":"10 000 = 1 000 / (0,10 − g) ⇒ 0,10 − g = 0,10 ⇒ g = 0%.","en":"10,000 = 1,000 / (0.10 − g) ⇒ 0.10 − g = 0.10 ⇒ g = 0%."}},{"id":"b","text":{"fr":"2%","en":"2%"},"correct":false,"why":{"fr":"Avec g = 2% la TV serait 12 750, pas 10 000.","en":"With g = 2% the TV would be 12,750, not 10,000."}},{"id":"c","text":{"fr":"5%","en":"5%"},"correct":false,"why":{"fr":"Donnerait une TV de 20 000, bien trop élevée.","en":"Would give a TV of 20,000, far too high."}},{"id":"d","text":{"fr":"10%","en":"10%"},"correct":false,"why":{"fr":"Impossible : g = WACC ferait exploser la TV vers l'infini.","en":"Impossible: g = WACC would blow the TV to infinity."}}],"explanation":{"fr":"Le g implicite est nul, donc cette TV suppose une croissance perpétuelle nulle et sous-évalue l'entreprise face à une hypothèse réaliste de ~2%.","en":"The implied g is zero, so this TV assumes zero perpetual growth and undervalues the firm versus a realistic ~2% assumption."},"workings":{"fr":"10 000 = 1 000 / (0,10 − g) ⇒ g = 0%. Avec g = 2% : 1 020 / 0,08 = 12 750.","en":"10,000 = 1,000 / (0.10 − g) ⇒ g = 0%. With g = 2%: 1,020 / 0.08 = 12,750."}},{"id":"qcm.l3.tv.003","type":"qcm","level":3,"topic":"DCF","tags":["terminal-value"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.terminal-value","stem":{"fr":"Quelle borne pour le taux de croissance perpétuel g est cohérente ?","en":"Which bound for the perpetual growth rate g is consistent?"},"multi":false,"options":[{"id":"a","text":{"fr":"g inférieur à la croissance du PIB long terme (~2%)","en":"g below long-term GDP growth (~2%)"},"correct":true,"why":{"fr":"Une entreprise ne peut pas croître plus vite que l'économie pour l'éternité.","en":"A firm cannot grow faster than the economy forever."}},{"id":"b","text":{"fr":"g supérieur au WACC","en":"g above the WACC"},"correct":false,"why":{"fr":"Donne un dénominateur négatif et une TV absurde.","en":"Gives a negative denominator and an absurd TV."}},{"id":"c","text":{"fr":"g égal au WACC","en":"g equal to the WACC"},"correct":false,"why":{"fr":"Le dénominateur tend vers zéro, la TV explose.","en":"The denominator tends to zero, the TV explodes."}},{"id":"d","text":{"fr":"g égal à 10%","en":"g equal to 10%"},"correct":false,"why":{"fr":"Largement au-dessus de la croissance économique soutenable.","en":"Far above sustainable economic growth."}}],"explanation":{"fr":"g doit rester sous la croissance du PIB long terme (~2%), sinon l'entreprise dépasserait l'économie indéfiniment.","en":"g must stay below long-term GDP growth (~2%), else the firm would outgrow the economy indefinitely."},"workings":null},{"id":"qcm.l3.tv.004","type":"qcm","level":3,"topic":"DCF","tags":["terminal-value"],"difficulty":2,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l3.terminal-value","stem":{"fr":"TV par multiple de sortie : 10x EBITDA sur un EBITDA de 500. Quelle TV ?","en":"Exit-multiple TV: 10x EBITDA on a 500 EBITDA. What TV?"},"multi":false,"options":[{"id":"a","text":{"fr":"5 000","en":"5,000"},"correct":true,"why":{"fr":"10 × 500 = 5 000.","en":"10 × 500 = 5,000."}},{"id":"b","text":{"fr":"500","en":"500"},"correct":false,"why":{"fr":"Oublie d'appliquer le multiple.","en":"Forgets to apply the multiple."}},{"id":"c","text":{"fr":"50","en":"50"},"correct":false,"why":{"fr":"Divise au lieu de multiplier.","en":"Divides instead of multiplying."}},{"id":"d","text":{"fr":"10 000","en":"10,000"},"correct":false,"why":{"fr":"Double la valeur correcte.","en":"Doubles the correct value."}}],"explanation":{"fr":"TV = multiple × métrique = 10 × 500 = 5 000.","en":"TV = multiple × metric = 10 × 500 = 5,000."},"workings":{"fr":"10 × 500 = 5 000.","en":"10 × 500 = 5,000."}},{"id":"qcm.l3.tv.005","type":"qcm","level":3,"topic":"DCF","tags":["terminal-value"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.terminal-value","stem":{"fr":"Quelles affirmations sur la valeur terminale sont vraies ? (plusieurs réponses)","en":"Which statements about terminal value are true? (multiple answers)"},"multi":true,"options":[{"id":"a","text":{"fr":"Elle pèse souvent 60–80% de l'EV","en":"It often weighs 60–80% of EV"},"correct":true,"why":{"fr":"C'est le poste le plus important et le plus sensible du DCF.","en":"It is the largest and most sensitive line in the DCF."}},{"id":"b","text":{"fr":"La TV de Gordon doit être actualisée à aujourd'hui","en":"The Gordon TV must be discounted back to today"},"correct":true,"why":{"fr":"Elle tombe en fin d'horizon explicite.","en":"It falls at the end of the explicit horizon."}},{"id":"c","text":{"fr":"On peut calculer la TV par multiple de sortie","en":"TV can be computed via an exit multiple"},"correct":true,"why":{"fr":"C'est l'une des deux méthodes standard.","en":"It is one of the two standard methods."}},{"id":"d","text":{"fr":"g peut dépasser le WACC sans problème","en":"g can exceed the WACC without issue"},"correct":false,"why":{"fr":"Cela rendrait le dénominateur négatif et la TV absurde.","en":"That would make the denominator negative and the TV absurd."}}],"explanation":{"fr":"La TV pèse 60–80% de l'EV, doit être actualisée, peut se calculer par multiple ; mais g ne peut jamais dépasser le WACC.","en":"The TV weighs 60–80% of EV, must be discounted, can be computed via a multiple; but g can never exceed the WACC."},"workings":null},{"id":"qcm.l3.comps.001","type":"qcm","level":3,"topic":"Valuation","tags":["multiples"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.trading-comps","stem":{"fr":"Pour synthétiser un échantillon de comparables, on utilise plutôt :","en":"To summarize a sample of comparables, you rather use:"},"multi":false,"options":[{"id":"a","text":{"fr":"La médiane","en":"The median"},"correct":true,"why":{"fr":"Robuste aux outliers qui faussent la moyenne.","en":"Robust to outliers that distort the mean."}},{"id":"b","text":{"fr":"La moyenne arithmétique","en":"The arithmetic mean"},"correct":false,"why":{"fr":"Tirée par les valeurs extrêmes.","en":"Dragged by extreme values."}},{"id":"c","text":{"fr":"Le maximum","en":"The maximum"},"correct":false,"why":{"fr":"Retiendrait précisément l'outlier le plus élevé.","en":"Would pick exactly the highest outlier."}},{"id":"d","text":{"fr":"Le minimum","en":"The minimum"},"correct":false,"why":{"fr":"Sous-valoriserait systématiquement.","en":"Would systematically undervalue."}}],"explanation":{"fr":"La médiane est préférée car robuste aux outliers, contrairement à la moyenne.","en":"The median is preferred because it is robust to outliers, unlike the mean."},"workings":null},{"id":"qcm.l3.comps.002","type":"qcm","level":3,"topic":"Valuation","tags":["P/E"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.trading-comps","stem":{"fr":"Quel est le multiple généralement considéré comme le moins fiable ?","en":"Which multiple is generally considered the least reliable?"},"multi":false,"options":[{"id":"a","text":{"fr":"Le P/E","en":"P/E"},"correct":true,"why":{"fr":"Pollué par le levier, la fiscalité et les éléments exceptionnels.","en":"Polluted by leverage, tax, and exceptional items."}},{"id":"b","text":{"fr":"EV/EBITDA","en":"EV/EBITDA"},"correct":false,"why":{"fr":"Au contraire, c'est le plus universel et indépendant du levier.","en":"On the contrary, it is the most universal and leverage-independent."}},{"id":"c","text":{"fr":"EV/EBIT","en":"EV/EBIT"},"correct":false,"why":{"fr":"Multiple d'EV, indépendant de la structure de capital.","en":"An EV multiple, independent of capital structure."}},{"id":"d","text":{"fr":"EV/Sales","en":"EV/Sales"},"correct":false,"why":{"fr":"Utile pour les sociétés non rentables, sans dépendre du levier.","en":"Useful for unprofitable firms, without depending on leverage."}}],"explanation":{"fr":"Le P/E dépend du levier, de l'impôt et des exceptionnels ; les multiples d'EV sont plus fiables.","en":"P/E depends on leverage, tax, and exceptionals; EV multiples are more reliable."},"workings":null},{"id":"qcm.l3.comps.003","type":"qcm","level":3,"topic":"Valuation","tags":["EV","equity-value"],"difficulty":2,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l3.trading-comps","stem":{"fr":"EBITDA 200, multiple médian 17,6x, dette nette 520. Quelle est l'equity value ?","en":"EBITDA 200, median multiple 17.6x, net debt 520. What is equity value?"},"multi":false,"options":[{"id":"a","text":{"fr":"3 000","en":"3,000"},"correct":true,"why":{"fr":"EV = 200 × 17,6 = 3 520 ; 3 520 − 520 = 3 000.","en":"EV = 200 × 17.6 = 3,520; 3,520 − 520 = 3,000."}},{"id":"b","text":{"fr":"3 520","en":"3,520"},"correct":false,"why":{"fr":"C'est l'EV, pas l'equity value : il faut retrancher la dette nette.","en":"That is EV, not equity value: subtract net debt."}},{"id":"c","text":{"fr":"4 040","en":"4,040"},"correct":false,"why":{"fr":"Ajoute la dette nette au lieu de la soustraire.","en":"Adds net debt instead of subtracting it."}},{"id":"d","text":{"fr":"200","en":"200"},"correct":false,"why":{"fr":"C'est l'EBITDA, pas une valeur.","en":"That is EBITDA, not a value."}}],"explanation":{"fr":"EV = EBITDA × multiple = 3 520 ; equity value = EV − dette nette = 3 000.","en":"EV = EBITDA × multiple = 3,520; equity value = EV − net debt = 3,000."},"workings":{"fr":"200 × 17,6 = 3 520 ; 3 520 − 520 = 3 000.","en":"200 × 17.6 = 3,520; 3,520 − 520 = 3,000."}},{"id":"qcm.l3.comps.004","type":"qcm","level":3,"topic":"Valuation","tags":["multiples"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.trading-comps","stem":{"fr":"Quels multiples sectoriels sont correctement associés ? (plusieurs réponses)","en":"Which sector multiples are correctly matched? (multiple answers)"},"multi":true,"options":[{"id":"a","text":{"fr":"EV/EBITDAR pour le retail et l'aérien","en":"EV/EBITDAR for retail and airlines"},"correct":true,"why":{"fr":"On rajoute les loyers (Rent) car les baux sont une quasi-dette opérationnelle.","en":"Rents are added back (R) because leases are a quasi-operational debt."}},{"id":"b","text":{"fr":"P/FFO pour les REITs","en":"P/FFO for REITs"},"correct":true,"why":{"fr":"Le FFO (funds from operations) est la métrique standard des foncières.","en":"FFO (funds from operations) is the standard metric for listed property."}},{"id":"c","text":{"fr":"EV/Sales pour une tech non rentable","en":"EV/Sales for unprofitable tech"},"correct":true,"why":{"fr":"Quand l'EBITDA est négatif, on valorise sur le chiffre d'affaires.","en":"When EBITDA is negative, valuation is on revenue."}},{"id":"d","text":{"fr":"P/E pour un REIT","en":"P/E for a REIT"},"correct":false,"why":{"fr":"Inadapté : on utilise P/FFO ou P/B pour les foncières.","en":"Unsuitable: use P/FFO or P/B for property companies."}}],"explanation":{"fr":"EV/EBITDAR (retail/aérien), P/FFO (REITs) et EV/Sales (tech non rentable) sont corrects ; le P/E n'est pas adapté aux REITs.","en":"EV/EBITDAR (retail/airlines), P/FFO (REITs) and EV/Sales (unprofitable tech) are correct; P/E is unsuitable for REITs."},"workings":null},{"id":"qcm.l3.comps.005","type":"qcm","level":3,"topic":"Valuation","tags":["EV/EBITDA"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.trading-comps","stem":{"fr":"Pourquoi EV/EBITDA est-il comparable entre sociétés diversement endettées ?","en":"Why is EV/EBITDA comparable across differently leveraged firms?"},"multi":false,"options":[{"id":"a","text":{"fr":"Parce que l'EV et l'EBITDA sont tous deux avant structure de financement","en":"Because both EV and EBITDA are pre-financing-structure"},"correct":true,"why":{"fr":"L'EV couvre dette + equity et l'EBITDA est avant charges d'intérêts : cohérence dimensionnelle.","en":"EV covers debt + equity and EBITDA is pre-interest: dimensional consistency."}},{"id":"b","text":{"fr":"Parce que l'EBITDA inclut les intérêts","en":"Because EBITDA includes interest"},"correct":false,"why":{"fr":"Faux : l'EBITDA est avant intérêts (Before Interest).","en":"False: EBITDA is before interest."}},{"id":"c","text":{"fr":"Parce que l'EV ignore la dette","en":"Because EV ignores debt"},"correct":false,"why":{"fr":"Au contraire, l'EV inclut la dette nette.","en":"On the contrary, EV includes net debt."}},{"id":"d","text":{"fr":"Parce qu'il dépend du taux d'impôt","en":"Because it depends on the tax rate"},"correct":false,"why":{"fr":"L'EBITDA est avant impôt ; c'est justement un avantage de neutralité.","en":"EBITDA is pre-tax; that neutrality is precisely an advantage."}}],"explanation":{"fr":"EV (dette + equity) et EBITDA (avant intérêts et impôt) sont cohérents, donc comparables quel que soit le levier.","en":"EV (debt + equity) and EBITDA (pre-interest, pre-tax) are consistent, hence comparable regardless of leverage."},"workings":null},{"id":"qcm.l3.prec.001","type":"qcm","level":3,"topic":"Valuation","tags":["precedent-transactions","control-premium"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.precedent","stem":{"fr":"Comment les multiples de transactions précédentes se comparent-ils aux comparables boursiers ?","en":"How do precedent transaction multiples compare to trading comparables?"},"multi":false,"options":[{"id":"a","text":{"fr":"Généralement plus élevés, à cause de la prime de contrôle","en":"Generally higher, because of the control premium"},"correct":true,"why":{"fr":"L'acquéreur paie une prime (20–40%) pour le contrôle et les synergies.","en":"The acquirer pays a premium (20–40%) for control and synergies."}},{"id":"b","text":{"fr":"Généralement plus bas","en":"Generally lower"},"correct":false,"why":{"fr":"L'inverse : la prime de contrôle les rend plus élevés.","en":"The opposite: the control premium makes them higher."}},{"id":"c","text":{"fr":"Toujours identiques","en":"Always identical"},"correct":false,"why":{"fr":"La prime de contrôle crée un écart systématique.","en":"The control premium creates a systematic gap."}},{"id":"d","text":{"fr":"Sans relation","en":"Unrelated"},"correct":false,"why":{"fr":"Ils partagent la base mais diffèrent par la prime de contrôle.","en":"They share the base but differ by the control premium."}}],"explanation":{"fr":"Précédents > comparables boursiers : l'acquéreur paie une prime de contrôle de 20–40%.","en":"Precedents > trading comparables: the acquirer pays a 20–40% control premium."},"workings":null},{"id":"qcm.l3.prec.002","type":"qcm","level":3,"topic":"Valuation","tags":["DCF"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.precedent","stem":{"fr":"Pour quels types de sociétés le DCF du FCFF est-il inadapté ? (plusieurs réponses)","en":"For which company types is an FCFF DCF inappropriate? (multiple answers)"},"multi":true,"options":[{"id":"a","text":{"fr":"Les banques","en":"Banks"},"correct":true,"why":{"fr":"La dette fait partie de leur activité ; on utilise un DDM ou des multiples de book value.","en":"Debt is part of their operations; use a DDM or book-value multiples."}},{"id":"b","text":{"fr":"Les assurances","en":"Insurers"},"correct":true,"why":{"fr":"Même logique : le FCFF n'a pas de sens, on privilégie le résultat distribuable.","en":"Same logic: FCFF makes no sense, prefer distributable earnings."}},{"id":"c","text":{"fr":"Les REITs","en":"REITs"},"correct":true,"why":{"fr":"On utilise P/FFO ou la NAV plutôt que le FCFF.","en":"Use P/FFO or NAV rather than FCFF."}},{"id":"d","text":{"fr":"Un industriel manufacturier classique","en":"A classic manufacturing industrial"},"correct":false,"why":{"fr":"Pour ces sociétés le DCF du FCFF est parfaitement adapté.","en":"For these companies an FCFF DCF is perfectly appropriate."}}],"explanation":{"fr":"Banques, assurances et REITs ont une dette opérationnelle : on leur applique DDM, P/B ou P/FFO, pas un DCF du FCFF.","en":"Banks, insurers, and REITs have operational debt: use DDM, P/B, or P/FFO, not an FCFF DCF."},"workings":null},{"id":"qcm.l3.prec.003","type":"qcm","level":3,"topic":"Valuation","tags":["precedent-transactions"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.precedent","stem":{"fr":"Quelle est la principale limite des transactions précédentes comme méthode de valorisation ?","en":"What is the main limitation of precedent transactions as a valuation method?"},"multi":false,"options":[{"id":"a","text":{"fr":"Les multiples reflètent des conditions de marché datées","en":"The multiples reflect dated market conditions"},"correct":true,"why":{"fr":"Un deal du pic de 2021 n'est pas représentatif d'un marché 2024 plus tendu.","en":"A 2021-peak deal is not representative of a tighter 2024 market."}},{"id":"b","text":{"fr":"Elles ignorent totalement la prime de contrôle","en":"They totally ignore the control premium"},"correct":false,"why":{"fr":"Au contraire, elles l'incluent par construction.","en":"On the contrary, they include it by construction."}},{"id":"c","text":{"fr":"Elles ne s'appliquent qu'aux start-ups","en":"They only apply to startups"},"correct":false,"why":{"fr":"Elles s'appliquent à tout secteur où existent des deals comparables.","en":"They apply to any sector with comparable deals."}},{"id":"d","text":{"fr":"Elles nécessitent un WACC","en":"They require a WACC"},"correct":false,"why":{"fr":"C'est une méthode par multiples, sans actualisation.","en":"It is a multiples method, without discounting."}}],"explanation":{"fr":"Les transactions sont datées : leurs multiples portent les conditions de marché de leur époque, parfois dépassées.","en":"Transactions are dated: their multiples carry the market conditions of their time, sometimes obsolete."},"workings":null},{"id":"qcm.l3.prec.004","type":"qcm","level":3,"topic":"Valuation","tags":["control-premium"],"difficulty":3,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l3.precedent","stem":{"fr":"Comparables boursiers à 17,6x, transactions précédentes à 22,0x : quelle est la prime de contrôle implicite ?","en":"Trading comparables at 17.6x, precedents at 22.0x: what is the implied control premium?"},"multi":false,"options":[{"id":"a","text":{"fr":"≈ 25%","en":"≈ 25%"},"correct":true,"why":{"fr":"22,0 / 17,6 − 1 ≈ 0,25, cohérent avec la fourchette 20–40%.","en":"22.0 / 17.6 − 1 ≈ 0.25, consistent with the 20–40% range."}},{"id":"b","text":{"fr":"≈ 4,4%","en":"≈ 4.4%"},"correct":false,"why":{"fr":"Confond l'écart absolu de multiples (4,4x) avec un pourcentage.","en":"Confuses the absolute multiple gap (4.4x) with a percentage."}},{"id":"c","text":{"fr":"≈ 80%","en":"≈ 80%"},"correct":false,"why":{"fr":"Largement au-dessus d'une prime de contrôle réaliste.","en":"Far above a realistic control premium."}},{"id":"d","text":{"fr":"0%","en":"0%"},"correct":false,"why":{"fr":"Les précédents sont nettement au-dessus des comparables, donc prime non nulle.","en":"Precedents are clearly above comparables, so the premium is non-zero."}}],"explanation":{"fr":"Prime de contrôle implicite = multiple précédents / multiple comparables − 1 = 22,0/17,6 − 1 ≈ 25%.","en":"Implied control premium = precedents multiple / comparables multiple − 1 = 22.0/17.6 − 1 ≈ 25%."},"workings":{"fr":"22,0 / 17,6 = 1,25 ⇒ prime ≈ 25%.","en":"22.0 / 17.6 = 1.25 ⇒ premium ≈ 25%."}},{"id":"qcm.l3.prec.005","type":"qcm","level":3,"topic":"Valuation","tags":["M&A","control-premium"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l3.precedent","stem":{"fr":"Quel acquéreur paie en général la prime la plus élevée ?","en":"Which acquirer generally pays the highest premium?"},"multi":false,"options":[{"id":"a","text":{"fr":"Un acquéreur industriel (stratégique)","en":"A strategic (industrial) acquirer"},"correct":true,"why":{"fr":"Il peut capter des synergies opérationnelles qui justifient une prime plus élevée.","en":"It can capture operating synergies that justify a higher premium."}},{"id":"b","text":{"fr":"Un sponsor LBO financier","en":"A financial LBO sponsor"},"correct":false,"why":{"fr":"Sans synergies opérationnelles, il est plus discipliné sur le prix.","en":"Without operating synergies, it is more price-disciplined."}},{"id":"c","text":{"fr":"Un actionnaire minoritaire passif","en":"A passive minority shareholder"},"correct":false,"why":{"fr":"Il n'acquiert pas le contrôle, donc ne paie pas de prime de contrôle.","en":"It does not acquire control, so pays no control premium."}},{"id":"d","text":{"fr":"Aucun, les primes sont identiques","en":"None, premiums are identical"},"correct":false,"why":{"fr":"Le potentiel de synergies différencie clairement industriel et financier.","en":"Synergy potential clearly differentiates strategic from financial buyers."}}],"explanation":{"fr":"L'acquéreur industriel paie généralement plus car les synergies opérationnelles augmentent sa capacité à payer.","en":"The strategic acquirer generally pays more because operating synergies raise its ability to pay."},"workings":null},{"id":"qcm.l5.restructuring.001","type":"qcm","level":5,"topic":"Restructuring","tags":["procedures"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.restructuring","stem":{"fr":"Une société française n'est PAS encore en cessation des paiements mais anticipe des difficultés. Quelle procédure est appropriée ?","en":"A French company is NOT yet in payment default but anticipates difficulties. Which procedure is appropriate?"},"multi":false,"options":[{"id":"a","text":{"fr":"Liquidation judiciaire","en":"Judicial liquidation"},"correct":false,"why":{"fr":"La liquidation suppose que le redressement est impossible.","en":"Liquidation assumes recovery is impossible."}},{"id":"b","text":{"fr":"Sauvegarde","en":"Safeguard (sauvegarde)"},"correct":true,"why":{"fr":"La sauvegarde s'ouvre avant la cessation des paiements, à titre préventif.","en":"Safeguard opens before payment default, as a preventive measure."}},{"id":"c","text":{"fr":"Redressement judiciaire","en":"Judicial reorganisation"},"correct":false,"why":{"fr":"Le redressement suppose une cessation des paiements déjà constatée.","en":"Reorganisation requires an already-declared payment default."}},{"id":"d","text":{"fr":"Chapter 11","en":"Chapter 11"},"correct":false,"why":{"fr":"Chapter 11 est une procédure américaine.","en":"Chapter 11 is a US procedure."}}],"explanation":{"fr":"La [[sauvegarde]] est la seule procédure FR ouverte avant la cessation des paiements : préventive, le dirigeant reste en place.","en":"[[sauvegarde]] is the only French procedure opened before payment default: preventive, with management staying in place."},"workings":null},{"id":"qcm.l5.restructuring.002","type":"qcm","level":5,"topic":"Restructuring","tags":["advisory"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.restructuring","stem":{"fr":"Quelle banque est historiquement LE leader du conseil aux créanciers ?","en":"Which bank is historically THE leader in creditor-side advisory?"},"multi":false,"options":[{"id":"a","text":{"fr":"Houlihan Lokey","en":"Houlihan Lokey"},"correct":true,"why":{"fr":"Houlihan Lokey domine le conseil créancier en restructuring.","en":"Houlihan Lokey dominates creditor-side restructuring advisory."}},{"id":"b","text":{"fr":"Lazard","en":"Lazard"},"correct":false,"why":{"fr":"Lazard est plutôt côté débiteur.","en":"Lazard sits rather on the debtor side."}},{"id":"c","text":{"fr":"PJT Partners","en":"PJT Partners"},"correct":false,"why":{"fr":"PJT conseille fréquemment le débiteur.","en":"PJT frequently advises the debtor."}},{"id":"d","text":{"fr":"Rothschild & Co","en":"Rothschild & Co"},"correct":false,"why":{"fr":"Rothschild se positionne souvent côté débiteur.","en":"Rothschild often sits debtor-side."}}],"explanation":{"fr":"Houlihan Lokey est reconnu comme le premier conseil des créanciers ; Lazard, Rothschild et PJT sont plus souvent côté débiteur.","en":"Houlihan Lokey is recognised as the top creditor advisor; Lazard, Rothschild and PJT are more often debtor-side."},"workings":null},{"id":"qcm.l5.restructuring.003","type":"qcm","level":5,"topic":"Restructuring","tags":["waterfall"],"difficulty":5,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l5.restructuring","stem":{"fr":"Valeur disponible 100 ; DIP 10, senior secured 70, unsecured 60. Que reçoit l'unsecured et quelle est sa nature ?","en":"Available value 100; DIP 10, senior secured 70, unsecured 60. What does the unsecured tranche receive and what is its nature?"},"multi":false,"options":[{"id":"a","text":{"fr":"60 ; remboursé au pair","en":"60; repaid at par"},"correct":false,"why":{"fr":"Il ne reste que 20 après DIP et senior.","en":"Only 20 remains after DIP and senior."}},{"id":"b","text":{"fr":"20, soit 33% ; c'est la fulcrum security","en":"20, i.e. 33%; it is the fulcrum security"},"correct":true,"why":{"fr":"100 − 10 − 70 = 20 sur 60 = 33%, première tranche non servie au pair.","en":"100 − 10 − 70 = 20 of 60 = 33%, the first tranche not paid at par."}},{"id":"c","text":{"fr":"0 ; effacé","en":"0; wiped out"},"correct":false,"why":{"fr":"Il reste 20 disponibles pour l'unsecured.","en":"20 remains available for the unsecured."}},{"id":"d","text":{"fr":"30, soit 50%","en":"30, i.e. 50%"},"correct":false,"why":{"fr":"Calcul erroné : il ne reste que 20.","en":"Wrong calculation: only 20 remains."}}],"explanation":{"fr":"Selon l'[[absolute priority rule]], DIP (10) puis senior (70) sont servis au pair, laissant 20 à l'unsecured (33%). Étant partiellement remboursée, l'unsecured est la fulcrum security.","en":"Per the [[absolute priority rule]], DIP (10) then senior (70) are paid at par, leaving 20 for the unsecured (33%). Being partially repaid, the unsecured is the fulcrum security."},"workings":{"fr":"100 − 10 (DIP) − 70 (senior) = 20 ; 20 / 60 = 33%.","en":"100 − 10 (DIP) − 70 (senior) = 20; 20 / 60 = 33%."}},{"id":"qcm.l5.restructuring.004","type":"qcm","level":5,"topic":"Restructuring","tags":["DIP","stay"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.restructuring","stem":{"fr":"Lesquelles de ces affirmations sur le Chapter 11 sont exactes ?","en":"Which of these statements about Chapter 11 are correct?"},"multi":true,"options":[{"id":"a","text":{"fr":"L'automatic stay gèle les poursuites des créanciers.","en":"The automatic stay freezes creditor actions."},"correct":true,"why":{"fr":"C'est l'effet central du dépôt en Chapter 11.","en":"This is the central effect of filing for Chapter 11."}},{"id":"b","text":{"fr":"La société opère en debtor-in-possession.","en":"The company operates as debtor-in-possession."},"correct":true,"why":{"fr":"Le management conserve la gestion sous supervision.","en":"Management retains control under supervision."}},{"id":"c","text":{"fr":"Le DIP financing est junior à toute la dette existante.","en":"DIP financing is junior to all existing debt."},"correct":false,"why":{"fr":"Au contraire, le DIP bénéficie d'une super-priorité.","en":"On the contrary, DIP enjoys super-priority."}},{"id":"d","text":{"fr":"Chapter 11 vise la liquidation immédiate des actifs.","en":"Chapter 11 aims at immediate asset liquidation."},"correct":false,"why":{"fr":"C'est le rôle du Chapter 7 ; le 11 est une réorganisation.","en":"That is the role of Chapter 7; 11 is a reorganisation."}}],"explanation":{"fr":"Le [[Chapter 11]] combine [[automatic stay]], gestion en [[debtor-in-possession]] et financement DIP super-prioritaire ; il vise la réorganisation, pas la liquidation.","en":"[[Chapter 11]] combines an [[automatic stay]], [[debtor-in-possession]] management and super-priority DIP financing; it targets reorganisation, not liquidation."},"workings":null},{"id":"qcm.l5.distressed-ma.001","type":"qcm","level":5,"topic":"Restructuring","tags":["plan-de-cession"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.distressed-ma","stem":{"fr":"Dans un plan de cession français, que devient le passif non repris ?","en":"In a French sale plan, what happens to the liabilities not assumed?"},"multi":false,"options":[{"id":"a","text":{"fr":"Il est transféré au repreneur.","en":"It is transferred to the buyer."},"correct":false,"why":{"fr":"Le repreneur ne reprend que les actifs/contrats désignés.","en":"The buyer only takes designated assets/contracts."}},{"id":"b","text":{"fr":"Il reste dans la procédure et le repreneur acquiert les actifs libres de passif.","en":"It stays in the procedure and the buyer acquires assets free of liabilities."},"correct":true,"why":{"fr":"Le plan de cession purge le passif laissé derrière, comme un 363 sale.","en":"The sale plan purges the liabilities left behind, like a 363 sale."}},{"id":"c","text":{"fr":"Il est automatiquement converti en equity.","en":"It is automatically converted into equity."},"correct":false,"why":{"fr":"La conversion relève du debt-to-equity swap, pas du plan de cession.","en":"Conversion is a debt-to-equity swap, not a sale plan."}},{"id":"d","text":{"fr":"Il est intégralement remboursé par le prix de cession.","en":"It is fully repaid by the sale price."},"correct":false,"why":{"fr":"Le prix est souvent décoté et insuffisant pour rembourser tout le passif.","en":"The price is often discounted and insufficient to repay all liabilities."}}],"explanation":{"fr":"Le [[plan de cession]] est un asset deal judiciaire : le repreneur acquiert les actifs free and clear, le passif reste géré dans la procédure (équivalent du [[363 sale]]).","en":"The [[plan de cession]] is a court asset deal: the buyer acquires assets free and clear, liabilities remain handled in the procedure (equivalent of the [[363 sale]])."},"workings":null},{"id":"qcm.l5.distressed-ma.002","type":"qcm","level":5,"topic":"Restructuring","tags":["loan-to-own"],"difficulty":5,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.distressed-ma","stem":{"fr":"Quel est l'objectif principal d'une stratégie loan-to-own ?","en":"What is the primary objective of a loan-to-own strategy?"},"multi":false,"options":[{"id":"a","text":{"fr":"Être remboursé au pair rapidement.","en":"Be repaid at par quickly."},"correct":false,"why":{"fr":"L'objectif n'est pas le remboursement mais le contrôle.","en":"The goal is not repayment but control."}},{"id":"b","text":{"fr":"Prendre le contrôle de la société via conversion de la dette en equity.","en":"Take control of the company via debt-to-equity conversion."},"correct":true,"why":{"fr":"On achète la fulcrum décotée pour la convertir et posséder la newco.","en":"One buys the discounted fulcrum to convert it and own the newco."}},{"id":"c","text":{"fr":"Toucher un coupon élevé sur la dette senior.","en":"Earn a high coupon on senior debt."},"correct":false,"why":{"fr":"C'est une stratégie de portage de dette, pas du loan-to-own.","en":"That is a debt-carry strategy, not loan-to-own."}},{"id":"d","text":{"fr":"Fournir du DIP financing super-prioritaire.","en":"Provide super-priority DIP financing."},"correct":false,"why":{"fr":"Le DIP est un financement, distinct de l'achat de dette existante.","en":"DIP is fresh financing, distinct from buying existing debt."}}],"explanation":{"fr":"Le [[loan-to-own]] cible la fulcrum security décotée pour la convertir en equity et prendre le contrôle de la société désendettée.","en":"[[loan-to-own]] targets the discounted fulcrum security to convert it into equity and take control of the deleveraged company."},"workings":null},{"id":"qcm.l5.distressed-ma.003","type":"qcm","level":5,"topic":"Restructuring","tags":["loan-to-own","calc"],"difficulty":5,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l5.distressed-ma","stem":{"fr":"Un fonds achète 60 M€ de dette à 35 cents et reçoit ensuite 50 M€ d'equity. Quel est le MoM brut approximatif ?","en":"A fund buys €60m of debt at 35 cents and then receives €50m of equity. What is the approximate gross MoM?"},"multi":false,"options":[{"id":"a","text":{"fr":"~0,8x","en":"~0.8x"},"correct":false,"why":{"fr":"Cela impliquerait une perte, faux ici.","en":"That would imply a loss, wrong here."}},{"id":"b","text":{"fr":"~2,4x","en":"~2.4x"},"correct":true,"why":{"fr":"Coût 60 × 0,35 = 21 M€ ; 50 / 21 ≈ 2,4x.","en":"Cost 60 × 0.35 = €21m; 50 / 21 ≈ 2.4x."}},{"id":"c","text":{"fr":"~1,0x","en":"~1.0x"},"correct":false,"why":{"fr":"Ignore la décote d'achat de 35 cents.","en":"Ignores the 35-cent purchase discount."}},{"id":"d","text":{"fr":"~5,0x","en":"~5.0x"},"correct":false,"why":{"fr":"Surestime : le coût est 21 M€, pas ~10 M€.","en":"Overstates: cost is €21m, not ~€10m."}}],"explanation":{"fr":"Le coût d'entrée est 60 × 0,35 = 21 M€ ; recevoir 50 M€ d'equity donne un MoM brut de 50/21 ≈ 2,4x.","en":"Entry cost is 60 × 0.35 = €21m; receiving €50m of equity gives a gross MoM of 50/21 ≈ 2.4x."},"workings":{"fr":"60 × 0,35 = 21 ; 50 / 21 ≈ 2,4x.","en":"60 × 0.35 = 21; 50 / 21 ≈ 2.4x."}},{"id":"qcm.l5.distressed-ma.004","type":"qcm","level":5,"topic":"Restructuring","tags":["valuation","floor"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.restructuring","stem":{"fr":"Pourquoi la valeur de liquidation sert-elle de plancher dans une négociation de restructuration ?","en":"Why does liquidation value serve as a floor in a restructuring negotiation?"},"multi":false,"options":[{"id":"a","text":{"fr":"Parce qu'elle est toujours supérieure à la going-concern value.","en":"Because it is always higher than going-concern value."},"correct":false,"why":{"fr":"Au contraire, la going-concern est en général supérieure.","en":"On the contrary, going-concern is usually higher."}},{"id":"b","text":{"fr":"Parce qu'un créancier rationnel n'accepte pas un plan lui rapportant moins que la liquidation.","en":"Because a rational creditor won't accept a plan paying less than liquidation."},"correct":true,"why":{"fr":"C'est le test best-interest-of-creditors.","en":"This is the best-interest-of-creditors test."}},{"id":"c","text":{"fr":"Parce qu'elle inclut la valeur de la marque et du goodwill.","en":"Because it includes brand and goodwill value."},"correct":false,"why":{"fr":"La liquidation morcelée détruit justement le goodwill.","en":"Piecemeal liquidation destroys goodwill."}},{"id":"d","text":{"fr":"Parce qu'elle est fixée par le DIP lender.","en":"Because it is set by the DIP lender."},"correct":false,"why":{"fr":"Elle dépend des actifs réalisables, pas du DIP lender.","en":"It depends on realisable assets, not the DIP lender."}}],"explanation":{"fr":"La [[liquidation value]] est le minimum qu'un créancier toucherait sans plan ; il refusera tout accord en dessous (best-interest-of-creditors test), d'où son rôle de plancher.","en":"[[liquidation value]] is the minimum a creditor would get without a plan; they will reject any deal below it (best-interest-of-creditors test), hence its role as a floor."},"workings":null},{"id":"qcm.l5.buildup.001","type":"qcm","level":5,"topic":"LBO","tags":["multiple-arbitrage"],"difficulty":5,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l5.buildup","stem":{"fr":"Plateforme achetée à 10x, bolt-on de 5 M€ d'EBITDA payé 6x, groupe revalorisé à 11x à la sortie. Quelle valeur instantanée crée l'arbitrage sur ce bolt-on (hors synergies) ?","en":"Platform bought at 10x, a EUR 5m EBITDA bolt-on paid 6x, group re-rated at 11x at exit. What instant value does the arbitrage create on this bolt-on (excluding synergies)?"},"multi":false,"options":[{"id":"a","text":{"fr":"5 M€","en":"EUR 5m"},"correct":false,"why":{"fr":"C'est l'EBITDA, pas le gain de valeur.","en":"That is the EBITDA, not the value gain."}},{"id":"b","text":{"fr":"25 M€","en":"EUR 25m"},"correct":true,"why":{"fr":"(11x − 6x) × 5 M€ = 5x × 5 = 25 M€ de valeur créée par l'écart de multiple.","en":"(11x − 6x) × EUR 5m = 5x × 5 = EUR 25m of value created by the multiple gap."}},{"id":"c","text":{"fr":"30 M€","en":"EUR 30m"},"correct":false,"why":{"fr":"30 M€ = 6x × 5, soit le prix payé, pas le gain.","en":"EUR 30m = 6x × 5, i.e. the price paid, not the gain."}},{"id":"d","text":{"fr":"55 M€","en":"EUR 55m"},"correct":false,"why":{"fr":"55 = 11x × 5 est la valeur de sortie brute, pas l'arbitrage net.","en":"55 = 11x × 5 is the gross exit value, not the net arbitrage."}}],"explanation":{"fr":"L'arbitrage de multiple = (multiple de groupe − multiple d'achat) × EBITDA acheté.","en":"Multiple arbitrage = (group multiple − purchase multiple) × EBITDA acquired."},"workings":{"fr":"(11 − 6) × 5 = 25 M€.","en":"(11 − 6) × 5 = EUR 25m."}},{"id":"qcm.l5.buildup.002","type":"qcm","level":5,"topic":"LBO","tags":["build-up","concept"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.buildup","stem":{"fr":"Parmi ces leviers, lesquels contribuent à la création de valeur d'un build-up ?","en":"Among these levers, which contribute to a build-up's value creation?"},"multi":true,"options":[{"id":"a","text":{"fr":"Arbitrage de multiple","en":"Multiple arbitrage"},"correct":true,"why":{"fr":"Acheter bas et valoriser au multiple de groupe crée de la valeur.","en":"Buying low and valuing at the group multiple creates value."}},{"id":"b","text":{"fr":"Synergies de coûts et de revenus","en":"Cost and revenue synergies"},"correct":true,"why":{"fr":"Elles augmentent l'EBITDA consolidé.","en":"They increase consolidated EBITDA."}},{"id":"c","text":{"fr":"Re-rating du multiple de sortie via la taille/diversification","en":"Exit multiple re-rating via size/diversification"},"correct":true,"why":{"fr":"Un groupe plus grand et diversifié peut se valoriser à un multiple supérieur.","en":"A larger, diversified group can command a higher multiple."}},{"id":"d","text":{"fr":"Émettre de nouvelles actions cotées au public","en":"Issuing new publicly listed shares"},"correct":false,"why":{"fr":"Le build-up se fait sur une société non cotée détenue par le fonds ; l'IPO est une option de sortie, pas un levier de build-up.","en":"Build-up happens on a privately-held company; an IPO is an exit option, not a build-up lever."}}],"explanation":{"fr":"Les trois premiers leviers sont les piliers du build-up ; le quatrième confond build-up et marché coté.","en":"The first three are the build-up pillars; the fourth confuses build-up with the public market."},"workings":null},{"id":"qcm.l5.buildup.003","type":"qcm","level":5,"topic":"LBO","tags":["financing"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.buildup","stem":{"fr":"Pourquoi financer les bolt-ons par dette peut-il réduire le MoM si l'arbitrage est faible ?","en":"Why can debt-financing bolt-ons reduce the MoM if the arbitrage is weak?"},"multi":false,"options":[{"id":"a","text":{"fr":"Parce que la dette additionnelle gonfle la dette nette de sortie, qui se déduit de l'EV pour obtenir l'equity de sortie","en":"Because the added debt inflates exit net debt, which is deducted from EV to get exit equity"},"correct":true,"why":{"fr":"Equity sortie = EV − dette nette ; plus de dette = moins d'equity, sauf si l'arbitrage/les synergies compensent.","en":"Exit equity = EV − net debt; more debt = less equity, unless arbitrage/synergies offset it."}},{"id":"b","text":{"fr":"Parce que la dette augmente le multiple de sortie","en":"Because debt increases the exit multiple"},"correct":false,"why":{"fr":"La structure de financement n'augmente pas mécaniquement le multiple.","en":"The financing structure does not mechanically raise the multiple."}},{"id":"c","text":{"fr":"Parce que les intérêts réduisent directement l'equity d'entrée","en":"Because interest directly reduces entry equity"},"correct":false,"why":{"fr":"L'equity d'entrée est fixée au closing ; les intérêts pèsent sur le cash-flow, pas sur l'equity d'entrée.","en":"Entry equity is fixed at closing; interest weighs on cash flow, not entry equity."}},{"id":"d","text":{"fr":"Parce que la dette est toujours plus chère que l'equity","en":"Because debt is always more expensive than equity"},"correct":false,"why":{"fr":"Faux : la dette est moins chère que l'equity ; ce n'est pas la raison.","en":"False: debt is cheaper than equity; that is not the reason."}}],"explanation":{"fr":"Le levier sert le MoM seulement si le rendement des actifs achetés dépasse le coût de la dette ajoutée.","en":"Leverage helps the MoM only if the return on acquired assets exceeds the cost of the added debt."},"workings":null},{"id":"qcm.l5.buildup.004","type":"qcm","level":5,"topic":"LBO","tags":["platform"],"difficulty":3,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.buildup","stem":{"fr":"Quel rôle joue la plateforme dans un build-up ?","en":"What role does the platform play in a build-up?"},"multi":false,"options":[{"id":"a","text":{"fr":"Elle fournit le management, les systèmes et la taille critique pour absorber les bolt-ons","en":"It provides management, systems and critical mass to absorb bolt-ons"},"correct":true,"why":{"fr":"C'est exactement le rôle de la plateforme, qui justifie son multiple plein.","en":"Exactly the platform's role, justifying its full multiple."}},{"id":"b","text":{"fr":"Elle est toujours la cible la moins chère du groupe","en":"It is always the cheapest target in the group"},"correct":false,"why":{"fr":"Au contraire, elle se paie au multiple le plus élevé.","en":"On the contrary, it is paid at the highest multiple."}},{"id":"c","text":{"fr":"Elle sert uniquement à porter la dette","en":"It only serves to carry the debt"},"correct":false,"why":{"fr":"Porter la dette n'est pas sa fonction industrielle principale.","en":"Carrying debt is not its main industrial function."}},{"id":"d","text":{"fr":"Elle remplace les synergies","en":"It replaces synergies"},"correct":false,"why":{"fr":"Elle permet les synergies, elle ne les remplace pas.","en":"It enables synergies, it does not replace them."}}],"explanation":{"fr":"La plateforme est la base opérationnelle ; sa qualité conditionne la réussite des intégrations.","en":"The platform is the operational base; its quality conditions integration success."},"workings":null},{"id":"qcm.l5.p2p.001","type":"qcm","level":5,"topic":"M&A","tags":["premium"],"difficulty":4,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l5.take-private","stem":{"fr":"Cours non affecté 20 €, prime de 30%, 100 M actions, dette nette 0,4 Md€. Quelle est l'EV de l'offre ?","en":"Unaffected price EUR 20, 30% premium, 100m shares, net debt EUR 0.4bn. What is the offer EV?"},"multi":false,"options":[{"id":"a","text":{"fr":"2,6 Md€","en":"EUR 2.6bn"},"correct":false,"why":{"fr":"C'est l'equity value (26 € × 100 M), il manque la dette nette.","en":"That is the equity value (EUR 26 × 100m); net debt is missing."}},{"id":"b","text":{"fr":"3,0 Md€","en":"EUR 3.0bn"},"correct":true,"why":{"fr":"26 € × 100 M = 2,6 Md€ d'equity + 0,4 Md€ de dette nette = 3,0 Md€ d'EV.","en":"EUR 26 × 100m = EUR 2.6bn equity + EUR 0.4bn net debt = EUR 3.0bn EV."}},{"id":"c","text":{"fr":"2,4 Md€","en":"EUR 2.4bn"},"correct":false,"why":{"fr":"On a oublié d'appliquer la prime et/ou la dette.","en":"The premium and/or debt were omitted."}},{"id":"d","text":{"fr":"3,4 Md€","en":"EUR 3.4bn"},"correct":false,"why":{"fr":"On a ajouté la dette deux fois ou sur-estimé la prime.","en":"Debt was added twice or the premium overstated."}}],"explanation":{"fr":"EV = equity value (prix d'offre × actions) + dette nette reprise.","en":"EV = equity value (offer price × shares) + assumed net debt."},"workings":{"fr":"20 × 1,30 = 26 € ; 26 × 100 M = 2,6 Md€ ; + 0,4 = 3,0 Md€.","en":"20 × 1.30 = EUR 26; 26 × 100m = EUR 2.6bn; + 0.4 = EUR 3.0bn."}},{"id":"qcm.l5.p2p.002","type":"qcm","level":5,"topic":"M&A","tags":["OPA","scheme","squeeze-out"],"difficulty":5,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.take-private","stem":{"fr":"Quelles affirmations sur les mécanismes de P2P sont exactes ?","en":"Which statements about P2P mechanisms are correct?"},"multi":true,"options":[{"id":"a","text":{"fr":"En France, le squeeze-out s'active à ≥90% du capital et des droits de vote","en":"In France, squeeze-out triggers at ≥90% of capital and voting rights"},"correct":true,"why":{"fr":"Seuil AMF du retrait obligatoire.","en":"AMF mandatory buyout threshold."}},{"id":"b","text":{"fr":"Un scheme of arrangement requiert généralement une majorité de ≈75% en valeur, homologuée par un juge","en":"A scheme of arrangement generally requires a ~75% majority by value, court-sanctioned"},"correct":true,"why":{"fr":"Caractéristique du scheme en droit anglais/irlandais.","en":"Characteristic of the scheme under English/Irish law."}},{"id":"c","text":{"fr":"Le financement peut rester non committé jusqu'au résultat de l'offre","en":"Financing can stay uncommitted until the offer result"},"correct":false,"why":{"fr":"Faux : la condition de certain funds impose un financement committé avant lancement.","en":"False: the certain funds condition requires committed financing before launch."}},{"id":"d","text":{"fr":"Un scheme, une fois approuvé et homologué, s'impose à 100% des titres","en":"A scheme, once approved and sanctioned, binds 100% of shares"},"correct":true,"why":{"fr":"C'est l'avantage du scheme : binaire mais total.","en":"That is the scheme's advantage: binary but total."}}],"explanation":{"fr":"OPA + squeeze-out (≥90%) en France ; scheme (≈75% homologué, 100% des titres) en droit anglo-saxon ; certain funds obligatoire.","en":"Tender offer + squeeze-out (≥90%) in France; scheme (~75% sanctioned, 100% of shares) under common law; certain funds mandatory."},"workings":null},{"id":"qcm.l5.p2p.003","type":"qcm","level":5,"topic":"M&A","tags":["irrevocable"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.take-private","stem":{"fr":"Quel est l'intérêt principal des engagements irrévocables pour l'acquéreur ?","en":"What is the main benefit of irrevocable undertakings for the acquirer?"},"multi":false,"options":[{"id":"a","text":{"fr":"Sécuriser l'apport d'un bloc significatif et réduire le risque de contre-offre","en":"Lock up a significant block and reduce counter-bid risk"},"correct":true,"why":{"fr":"C'est exactement leur fonction de dé-risquage avant annonce.","en":"Exactly their de-risking function before announcement."}},{"id":"b","text":{"fr":"Obliger le régulateur à approuver l'offre","en":"Force the regulator to approve the offer"},"correct":false,"why":{"fr":"Ils n'engagent pas le régulateur.","en":"They do not bind the regulator."}},{"id":"c","text":{"fr":"Fixer définitivement le multiple de sortie","en":"Fix the exit multiple definitively"},"correct":false,"why":{"fr":"Ils ne concernent pas la sortie.","en":"They do not concern the exit."}},{"id":"d","text":{"fr":"Supprimer le besoin de financement","en":"Remove the need for financing"},"correct":false,"why":{"fr":"Le financement reste requis (certain funds).","en":"Financing is still required (certain funds)."}}],"explanation":{"fr":"Les irrevocables verrouillent un bloc d'actionnaires clés avant l'annonce, signalant la robustesse de l'offre.","en":"Irrevocables lock up a block of key shareholders before announcement, signalling the offer's robustness."},"workings":null},{"id":"qcm.l5.p2p.004","type":"qcm","level":5,"topic":"M&A","tags":["premium","gotcha"],"difficulty":5,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.take-private","stem":{"fr":"Sur quelle base le board et la fairness opinion apprécient-ils la prime d'offre ?","en":"On what basis do the board and the fairness opinion assess the offer premium?"},"multi":false,"options":[{"id":"a","text":{"fr":"Le cours non affecté et des moyennes pondérées par les volumes","en":"The unaffected price and volume-weighted averages"},"correct":true,"why":{"fr":"On neutralise l'effet des fuites/rumeurs en partant du cours non affecté.","en":"Leak/rumour effects are neutralised by starting from the unaffected price."}},{"id":"b","text":{"fr":"Le plus haut cours des 12 derniers mois uniquement","en":"The 12-month high only"},"correct":false,"why":{"fr":"Un seul point extrême n'est pas une base équitable.","en":"A single extreme point is not a fair basis."}},{"id":"c","text":{"fr":"Le cours du jour de l'annonce, déjà gonflé par la rumeur","en":"The announcement-day price, already inflated by rumour"},"correct":false,"why":{"fr":"Ce cours intègre déjà la spéculation et minorerait la prime affichée.","en":"That price already embeds speculation and would understate the displayed premium."}},{"id":"d","text":{"fr":"La valeur comptable des capitaux propres","en":"The book value of equity"},"correct":false,"why":{"fr":"La book value n'est pas la référence d'une prime de marché.","en":"Book value is not the reference for a market premium."}}],"explanation":{"fr":"Le piège classique est de calculer la prime sur le dernier cours coté plutôt que sur le cours non affecté.","en":"The classic trap is computing the premium on the last quoted price rather than the unaffected price."},"workings":null},{"id":"qcm.l5.ecm.001","type":"qcm","level":5,"topic":"ECM","tags":["greenshoe"],"difficulty":5,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.ecm","stem":{"fr":"Quelle est la taille usuelle d'une option de greenshoe dans une IPO ?","en":"What is the usual size of a greenshoe option in an IPO?"},"multi":false,"options":[{"id":"a","text":{"fr":"Environ 5 % de l'offre","en":"About 5% of the offer"},"correct":false,"why":{"fr":"Trop faible ; la norme de marché est plus élevée.","en":"Too low; the market norm is higher."}},{"id":"b","text":{"fr":"Environ 15 % de l'offre","en":"About 15% of the offer"},"correct":true,"why":{"fr":"C'est la taille standard de la surallocation.","en":"This is the standard over-allotment size."}},{"id":"c","text":{"fr":"Environ 50 % de l'offre","en":"About 50% of the offer"},"correct":false,"why":{"fr":"Beaucoup trop élevé pour une simple stabilisation.","en":"Far too high for mere stabilisation."}},{"id":"d","text":{"fr":"100 % de l'offre","en":"100% of the offer"},"correct":false,"why":{"fr":"Cela doublerait l'opération, ce n'est pas le rôle du greenshoe.","en":"That would double the deal, not the greenshoe's role."}}],"explanation":{"fr":"Le [[greenshoe]] permet de placer jusqu'à ~15 % d'actions supplémentaires pour stabiliser le titre après l'IPO.","en":"The [[greenshoe]] lets ~15% additional shares be placed to stabilise the stock after the IPO."},"workings":null},{"id":"qcm.l5.ecm.002","type":"qcm","level":5,"topic":"ECM","tags":["primary","secondary"],"difficulty":5,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.ecm","stem":{"fr":"Dans une IPO, qui reçoit le produit de la tranche secondaire ?","en":"In an IPO, who receives the proceeds of the secondary tranche?"},"multi":false,"options":[{"id":"a","text":{"fr":"La société émettrice","en":"The issuing company"},"correct":false,"why":{"fr":"C'est le cas de la tranche primaire, pas secondaire.","en":"That is the primary tranche, not secondary."}},{"id":"b","text":{"fr":"Les actionnaires vendeurs","en":"The selling shareholders"},"correct":true,"why":{"fr":"Le secondaire cède des actions existantes au profit des vendeurs.","en":"Secondary sells existing shares for the sellers' benefit."}},{"id":"c","text":{"fr":"Les bookrunners","en":"The bookrunners"},"correct":false,"why":{"fr":"Les banques perçoivent une commission, pas le produit de l'offre.","en":"Banks earn a fee, not the offer proceeds."}},{"id":"d","text":{"fr":"La place de cotation","en":"The exchange"},"correct":false,"why":{"fr":"La place perçoit des frais d'admission, pas le produit.","en":"The exchange charges listing fees, not the proceeds."}}],"explanation":{"fr":"Le produit du secondaire va aux actionnaires vendeurs (souvent fondateurs ou sponsors PE) ; seul le primaire apporte de l'argent à la société.","en":"Secondary proceeds go to selling shareholders (often founders or PE sponsors); only primary brings money to the company."},"workings":null},{"id":"qcm.l5.ecm.003","type":"qcm","level":5,"topic":"ECM","tags":["process"],"difficulty":5,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.ecm","stem":{"fr":"Parmi ces éléments, lesquels font partie du processus d'IPO ? (plusieurs réponses)","en":"Which of these are part of the IPO process? (multiple answers)"},"multi":true,"options":[{"id":"a","text":{"fr":"Le roadshow auprès des investisseurs","en":"The investor roadshow"},"correct":true,"why":{"fr":"Étape clé du marketing de l'opération.","en":"A key marketing step of the deal."}},{"id":"b","text":{"fr":"Le bookbuilding et la constitution du livre d'ordres","en":"Bookbuilding and order-book formation"},"correct":true,"why":{"fr":"Cœur de la fixation du prix.","en":"Core of price setting."}},{"id":"c","text":{"fr":"La fixation d'une fourchette de prix indicative","en":"Setting an indicative price range"},"correct":true,"why":{"fr":"Publiée avant le bookbuilding.","en":"Published before bookbuilding."}},{"id":"d","text":{"fr":"Le calcul du WACC réglementaire imposé par la place","en":"An exchange-mandated regulatory WACC calculation"},"correct":false,"why":{"fr":"Aucune place n'impose de WACC ; c'est un outil de valorisation interne.","en":"No exchange mandates a WACC; it is an internal valuation tool."}}],"explanation":{"fr":"Roadshow, fourchette indicative et [[bookbuilding]] sont des étapes standard ; il n'existe pas de « WACC réglementaire ».","en":"Roadshow, indicative range and [[bookbuilding]] are standard steps; there is no 'regulatory WACC'."},"workings":null},{"id":"qcm.l5.ecm.004","type":"qcm","level":5,"topic":"ECM","tags":["ipo-discount"],"difficulty":5,"source":{"flag":"APPROXIMATE"},"moduleId":"mod.l5.ecm","stem":{"fr":"Qu'indique généralement un pop de +40 % le premier jour de cotation ?","en":"What does a +40% first-day pop generally indicate?"},"multi":false,"options":[{"id":"a","text":{"fr":"Une IPO parfaitement valorisée","en":"A perfectly priced IPO"},"correct":false,"why":{"fr":"Un pop aussi fort traduit au contraire une mauvaise calibration du prix.","en":"Such a large pop signals mispricing, not perfection."}},{"id":"b","text":{"fr":"Une décote d'IPO trop forte, donc de la valeur laissée sur la table","en":"Too large an IPO discount, i.e. value left on the table"},"correct":true,"why":{"fr":"Les vendeurs auraient pu obtenir un prix d'offre plus élevé.","en":"Sellers could have achieved a higher offer price."}},{"id":"c","text":{"fr":"Un échec de l'opération","en":"A failed deal"},"correct":false,"why":{"fr":"L'opération n'a pas échoué ; elle a juste été sous-évaluée.","en":"The deal did not fail; it was simply underpriced."}},{"id":"d","text":{"fr":"Que le greenshoe n'a pas été utilisé","en":"That the greenshoe was not used"},"correct":false,"why":{"fr":"Sans lien direct ; un cours en hausse pousse plutôt à exercer le greenshoe.","en":"No direct link; a rising price actually favours exercising the greenshoe."}}],"explanation":{"fr":"Un pop modéré (~+5 à +15 % APPROXIMATE) est sain ; un pop excessif signale une [[décote d'IPO]] trop forte.","en":"A moderate pop (~+5 to +15% APPROXIMATE) is healthy; an excessive pop signals too large an [[IPO discount]]."},"workings":null},{"id":"qcm.l5.dcm.001","type":"qcm","level":5,"topic":"DCM","tags":["rating"],"difficulty":5,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.dcm","stem":{"fr":"Quelle notation S&P marque le seuil entre investment grade et high yield ?","en":"Which S&P rating marks the boundary between investment grade and high yield?"},"multi":false,"options":[{"id":"a","text":{"fr":"AAA / AA+","en":"AAA / AA+"},"correct":false,"why":{"fr":"Ce sont les meilleures notes IG, loin du seuil.","en":"These are the top IG ratings, far from the boundary."}},{"id":"b","text":{"fr":"BBB- / BB+","en":"BBB- / BB+"},"correct":true,"why":{"fr":"BBB- est la dernière note IG ; BB+ la première HY.","en":"BBB- is the last IG rating; BB+ the first HY."}},{"id":"c","text":{"fr":"B / CCC","en":"B / CCC"},"correct":false,"why":{"fr":"Ce sont des notes profondément HY.","en":"These are deep within HY."}},{"id":"d","text":{"fr":"D / SD","en":"D / SD"},"correct":false,"why":{"fr":"Ce sont des notes de défaut.","en":"These are default ratings."}}],"explanation":{"fr":"Le seuil IG/HY se situe entre BBB- (dernier cran [[investment grade]]) et BB+ (premier cran [[high yield]]).","en":"The IG/HY threshold lies between BBB- (lowest [[investment grade]] notch) and BB+ (highest [[high yield]] notch)."},"workings":null},{"id":"qcm.l5.dcm.002","type":"qcm","level":5,"topic":"DCM","tags":["yield","spread"],"difficulty":5,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l5.dcm","stem":{"fr":"Taux sans risque 5 ans = 2,8 %, spread de crédit = 350 pb. Quel coupon approximatif au pair ?","en":"5-year risk-free rate = 2.8%, credit spread = 350 bps. What approximate coupon at par?"},"multi":false,"options":[{"id":"a","text":{"fr":"≈ 3,5 %","en":"≈ 3.5%"},"correct":false,"why":{"fr":"C'est le spread seul, sans le taux sans risque.","en":"That is the spread alone, without the risk-free rate."}},{"id":"b","text":{"fr":"≈ 6,3 %","en":"≈ 6.3%"},"correct":true,"why":{"fr":"2,8 % + 3,50 % = 6,3 %.","en":"2.8% + 3.50% = 6.3%."}},{"id":"c","text":{"fr":"≈ 2,8 %","en":"≈ 2.8%"},"correct":false,"why":{"fr":"C'est le taux sans risque seul, sans spread.","en":"That is the risk-free rate alone, without spread."}},{"id":"d","text":{"fr":"≈ 9,8 %","en":"≈ 9.8%"},"correct":false,"why":{"fr":"Erreur d'unité : 350 pb = 3,5 %, pas 7 %.","en":"Unit error: 350 bps = 3.5%, not 7%."}}],"explanation":{"fr":"Le rendement = taux sans risque + [[spread de crédit]] = 2,8 % + 3,50 % ≈ 6,3 %. Chiffres EXEMPLE_PEDAGOGIQUE.","en":"Yield = risk-free rate + [[credit spread]] = 2.8% + 3.50% ≈ 6.3%. Figures EXEMPLE_PEDAGOGIQUE."},"workings":{"fr":"2,8 % + 350 pb (= 3,50 %) = 6,30 %.","en":"2.8% + 350 bps (= 3.50%) = 6.30%."}},{"id":"qcm.l5.dcm.003","type":"qcm","level":5,"topic":"DCM","tags":["covenants"],"difficulty":5,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.dcm","stem":{"fr":"Lesquelles de ces affirmations sur les covenants sont correctes ? (plusieurs réponses)","en":"Which of these statements on covenants are correct? (multiple answers)"},"multi":true,"options":[{"id":"a","text":{"fr":"Les incurrence covenants ne se testent que lors d'une action (nouvelle dette, dividende)","en":"Incurrence covenants are tested only on an action (new debt, dividend)"},"correct":true,"why":{"fr":"Définition exacte, typique du high yield.","en":"Exact definition, typical of high yield."}},{"id":"b","text":{"fr":"Les maintenance covenants se testent à chaque période","en":"Maintenance covenants are tested each period"},"correct":true,"why":{"fr":"Typiques des prêts bancaires / leveraged loans.","en":"Typical of bank loans / leveraged loans."}},{"id":"c","text":{"fr":"« Cov-lite » désigne un financement avec covenants allégés","en":"'Cov-lite' refers to a financing with looser covenants"},"correct":true,"why":{"fr":"Plus favorable à l'émetteur.","en":"More favourable to the issuer."}},{"id":"d","text":{"fr":"Les covenants protègent l'émetteur contre ses créanciers","en":"Covenants protect the issuer against its creditors"},"correct":false,"why":{"fr":"C'est l'inverse : ils protègent les créanciers.","en":"It is the opposite: they protect creditors."}}],"explanation":{"fr":"Les [[covenants]] protègent les créanciers ; incurrence (HY) vs maintenance (prêts) ; « cov-lite » = covenants allégés.","en":"[[Covenants]] protect creditors; incurrence (HY) vs maintenance (loans); 'cov-lite' = looser covenants."},"workings":null},{"id":"qcm.l5.dcm.004","type":"qcm","level":5,"topic":"DCM","tags":["bank-debt"],"difficulty":5,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.dcm","stem":{"fr":"Quel est un avantage typique de l'obligataire corporate par rapport à la dette bancaire ?","en":"What is a typical advantage of corporate bonds over bank debt?"},"multi":false,"options":[{"id":"a","text":{"fr":"Une maturité plus longue avec structure bullet","en":"A longer maturity with a bullet structure"},"correct":true,"why":{"fr":"L'obligataire offre souvent un horizon plus long sans amortissement.","en":"Bonds often offer a longer horizon with no amortisation."}},{"id":"b","text":{"fr":"Une renégociation plus facile des termes","en":"Easier renegotiation of terms"},"correct":false,"why":{"fr":"C'est plus difficile avec des porteurs diffus.","en":"It is harder with dispersed holders."}},{"id":"c","text":{"fr":"Des coûts d'émission quasi nuls","en":"Near-zero issuance costs"},"correct":false,"why":{"fr":"Rating et prospectus engendrent des coûts fixes significatifs.","en":"Rating and prospectus create significant fixed costs."}},{"id":"d","text":{"fr":"L'absence totale de covenants","en":"No covenants at all"},"correct":false,"why":{"fr":"Le HY notamment comporte des incurrence covenants.","en":"HY in particular carries incurrence covenants."}}],"explanation":{"fr":"L'obligataire offre typiquement une maturité plus longue et une structure [[bullet]], au prix d'une moindre flexibilité.","en":"Bonds typically offer longer maturity and a [[bullet]] structure, at the cost of less flexibility."},"workings":null},{"id":"qcm.l5.vc.001","type":"qcm","level":5,"topic":"VC","tags":["valuation"],"difficulty":4,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l5.vc","stem":{"fr":"Pre-money de 8 M€, un fonds investit 2 M€. Quel pourcentage le fonds détient-il ?","en":"Pre-money of EUR 8m, a fund invests EUR 2m. What percentage does the fund own?"},"multi":false,"options":[{"id":"a","text":{"fr":"25 % (2 / 8)","en":"25% (2 / 8)"},"correct":false,"why":{"fr":"Erreur classique : le % se calcule sur la post-money, pas la pre-money.","en":"Classic mistake: the % is computed on post-money, not pre-money."}},{"id":"b","text":{"fr":"20 % (2 / 10)","en":"20% (2 / 10)"},"correct":true,"why":{"fr":"Correct : post-money = 8 + 2 = 10, donc 2 / 10 = 20 %.","en":"Correct: post-money = 8 + 2 = 10, so 2 / 10 = 20%."}},{"id":"c","text":{"fr":"10 %","en":"10%"},"correct":false},{"id":"d","text":{"fr":"80 %","en":"80%"},"correct":false}],"explanation":{"fr":"Le % de l'investisseur se calcule toujours sur la post-money valuation = pre-money + montant levé.","en":"The investor's % is always computed on post-money valuation = pre-money + amount raised."},"workings":{"fr":"Post-money = 8 + 2 = 10 ; part = 2 / 10 = 20 %.","en":"Post-money = 8 + 2 = 10; share = 2 / 10 = 20%."}},{"id":"qcm.l5.vc.002","type":"qcm","level":5,"topic":"VC","tags":["liquidation preference"],"difficulty":5,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.vc","stem":{"fr":"Que signifie une liquidation preference « 1x non-participating » ?","en":"What does a '1x non-participating' liquidation preference mean?"},"multi":false,"options":[{"id":"a","text":{"fr":"L'investisseur récupère 1x son investissement ET sa quote-part au prorata.","en":"The investor gets back 1x their investment AND their pro-rata share."},"correct":false,"why":{"fr":"Cela décrit une preference participating, pas non-participating.","en":"That describes a participating preference, not non-participating."}},{"id":"b","text":{"fr":"L'investisseur choisit entre récupérer 1x ou convertir et prendre son %, le plus avantageux.","en":"The investor chooses between getting 1x back or converting and taking their %, whichever is larger."},"correct":true,"why":{"fr":"Exact : c'est le choix « max » sans cumul, le standard de marché.","en":"Exactly: the 'max' choice without stacking, the market standard."}},{"id":"c","text":{"fr":"L'investisseur récupère 1x mais sans aucun droit de conversion.","en":"The investor gets 1x back but with no conversion right."},"correct":false},{"id":"d","text":{"fr":"L'investisseur reçoit 2x son investissement avant tout le monde.","en":"The investor receives 2x their investment ahead of everyone."},"correct":false}],"explanation":{"fr":"Non-participating signifie que l'investisseur prend soit la preference (1x), soit sa quote-part en ordinaire, jamais les deux.","en":"Non-participating means the investor takes either the preference (1x) or their common pro-rata, never both."},"workings":null},{"id":"qcm.l5.vc.003","type":"qcm","level":5,"topic":"VC","tags":["SAFE"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.vc","stem":{"fr":"Lesquels de ces éléments caractérisent un SAFE (par opposition à une convertible note) ?","en":"Which of these characterise a SAFE (as opposed to a convertible note)?"},"multi":true,"options":[{"id":"a","text":{"fr":"Pas d'intérêts.","en":"No interest."},"correct":true,"why":{"fr":"Vrai : le SAFE n'est pas de la dette, donc pas d'intérêts.","en":"True: a SAFE is not debt, so no interest."}},{"id":"b","text":{"fr":"Pas de date de maturité.","en":"No maturity date."},"correct":true,"why":{"fr":"Vrai : contrairement à la note, le SAFE n'a pas d'échéance.","en":"True: unlike the note, a SAFE has no maturity."}},{"id":"c","text":{"fr":"Peut comporter un valuation cap et/ou un discount.","en":"May carry a valuation cap and/or a discount."},"correct":true,"why":{"fr":"Vrai : ces mécanismes existent dans les deux instruments.","en":"True: these mechanisms exist in both instruments."}},{"id":"d","text":{"fr":"C'est un prêt remboursable en cash à échéance.","en":"It is a loan repayable in cash at maturity."},"correct":false,"why":{"fr":"Faux : cela décrit une convertible note, pas un SAFE.","en":"False: that describes a convertible note, not a SAFE."}}],"explanation":{"fr":"Le SAFE n'est ni dette ni intérêts ni maturité ; il convertit en equity au prochain tour, souvent avec cap et/ou discount.","en":"A SAFE is neither debt nor interest nor maturity; it converts to equity at the next round, often with a cap and/or discount."},"workings":null},{"id":"qcm.l5.vc.004","type":"qcm","level":5,"topic":"VC","tags":["multiples"],"difficulty":5,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.vc","stem":{"fr":"Une marketplace en forte croissance a un EBITDA négatif. Quelle approche de valorisation est la plus adaptée ?","en":"A high-growth marketplace has negative EBITDA. Which valuation approach is most suitable?"},"multi":false,"options":[{"id":"a","text":{"fr":"Multiple d'EBITDA","en":"EBITDA multiple"},"correct":false,"why":{"fr":"Inutilisable : l'EBITDA est négatif.","en":"Unusable: EBITDA is negative."}},{"id":"b","text":{"fr":"DCF sur 5 ans","en":"5-year DCF"},"correct":false,"why":{"fr":"Inadapté : cash-flows négatifs et terminal value trop sensible.","en":"Unsuitable: negative cash flows and overly sensitive terminal value."}},{"id":"c","text":{"fr":"Multiple de GMV","en":"GMV multiple"},"correct":true,"why":{"fr":"Correct : pour une marketplace, la GMV est le proxy de traction usuel.","en":"Correct: for a marketplace, GMV is the usual traction proxy."}},{"id":"d","text":{"fr":"Valeur comptable des actifs","en":"Book value of assets"},"correct":false}],"explanation":{"fr":"Quand l'EBITDA est négatif, on valorise sur des proxys de traction : ARR (SaaS), GMV (marketplace) ou valeur par utilisateur.","en":"When EBITDA is negative, you value on traction proxies: ARR (SaaS), GMV (marketplace) or value per user."},"workings":null},{"id":"qcm.l5.fit.001","type":"qcm","level":5,"topic":"Fit","tags":["LBO"],"difficulty":5,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.deal-judgment","stem":{"fr":"Quelles caractéristiques rendent une société attractive pour un LBO ?","en":"Which characteristics make a company attractive for an LBO?"},"multi":true,"options":[{"id":"a","text":{"fr":"Free cash flows récurrents et prévisibles","en":"Recurring and predictable free cash flows"},"correct":true,"why":{"fr":"Vrai : indispensable pour servir la dette.","en":"True: essential to service the debt."}},{"id":"b","text":{"fr":"Besoin de capex élevé et continu","en":"High and continuous capex needs"},"correct":false,"why":{"fr":"Faux : un capex lourd réduit le cash disponible pour la dette.","en":"False: heavy capex reduces cash available for debt."}},{"id":"c","text":{"fr":"Position de marché défendable","en":"Defensible market position"},"correct":true,"why":{"fr":"Vrai : barrières à l'entrée et pricing power sécurisent les flux.","en":"True: entry barriers and pricing power secure the flows."}},{"id":"d","text":{"fr":"Forte cyclicité des revenus","en":"Strong revenue cyclicality"},"correct":false,"why":{"fr":"Faux : la cyclicité met en danger le service de la dette en bas de cycle.","en":"False: cyclicality endangers debt service at the trough."}}],"explanation":{"fr":"Un bon candidat LBO génère des FCF stables, a peu de capex et une position défendable ; cyclicité et capex lourd sont des handicaps.","en":"A good LBO candidate generates stable FCF, has low capex and a defensible position; cyclicality and heavy capex are handicaps."},"workings":null},{"id":"qcm.l5.fit.002","type":"qcm","level":5,"topic":"Fit","tags":["red flag"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.deal-judgment","stem":{"fr":"Lequel de ces éléments est le plus clairement un red flag en due diligence ?","en":"Which of these is most clearly a red flag in due diligence?"},"multi":false,"options":[{"id":"a","text":{"fr":"Un client représente 35 % du chiffre d'affaires.","en":"One client represents 35% of revenue."},"correct":true,"why":{"fr":"Correct : forte concentration client = risque majeur si le client part.","en":"Correct: high customer concentration = major risk if the client leaves."}},{"id":"b","text":{"fr":"Une base de 5 000 clients diversifiés.","en":"A base of 5,000 diversified clients."},"correct":false,"why":{"fr":"C'est plutôt rassurant : faible dépendance.","en":"That is reassuring: low dependency."}},{"id":"c","text":{"fr":"Une marge EBITDA stable sur 5 ans.","en":"A stable EBITDA margin over 5 years."},"correct":false},{"id":"d","text":{"fr":"Un contrat-cadre pluriannuel avec un fournisseur.","en":"A multi-year framework contract with a supplier."},"correct":false}],"explanation":{"fr":"La concentration client (un client > 20-30 % du CA) est un red flag classique : la perte du client fait s'effondrer la thèse.","en":"Customer concentration (one client > 20-30% of revenue) is a classic red flag: losing the client collapses the thesis."},"workings":null},{"id":"qcm.l5.fit.003","type":"qcm","level":5,"topic":"Fit","tags":["thesis"],"difficulty":5,"source":{"flag":"VERIFIED"},"moduleId":"mod.l5.deal-judgment","stem":{"fr":"Quelle est la meilleure façon de conclure une recommandation d'investissement en comité ?","en":"What is the best way to conclude an investment recommendation in committee?"},"multi":false,"options":[{"id":"a","text":{"fr":"Lister tous les faits sans trancher.","en":"List all the facts without taking a stance."},"correct":false,"why":{"fr":"Faux : un comité attend une position défendable, pas un catalogue neutre.","en":"False: a committee expects a defensible stance, not a neutral catalogue."}},{"id":"b","text":{"fr":"Une recommandation nette (go / no-go / conditionnel) appuyée sur thèse, risques et mitigants.","en":"A clear recommendation (go / no-go / conditional) backed by thesis, risks and mitigants."},"correct":true,"why":{"fr":"Correct : c'est exactement ce qu'attend un comité d'investissement.","en":"Correct: this is exactly what an investment committee expects."}},{"id":"c","text":{"fr":"Une opinion sans citer les risques.","en":"An opinion without mentioning the risks."},"correct":false},{"id":"d","text":{"fr":"Uniquement l'IRR du cas de base.","en":"Only the base-case IRR."},"correct":false}],"explanation":{"fr":"Une recommandation efficace articule thèse, risques classés et mitigants, puis conclut par une position nette.","en":"An effective recommendation articulates thesis, ranked risks and mitigants, then concludes with a clear stance."},"workings":null},{"id":"qcm.l5.fit.004","type":"qcm","level":5,"topic":"Fit","tags":["judgment"],"difficulty":5,"source":{"flag":"EXEMPLE_PEDAGOGIQUE"},"moduleId":"mod.l5.deal-judgment","stem":{"fr":"Entrée à 10x EV/EBITDA, EBITDA 20 M€, dette 100 M€. À la sortie : 10x sur EBITDA 28 M€, dette résiduelle 60 M€. Quel est le MoM approximatif ?","en":"Entry at 10x EV/EBITDA, EBITDA EUR 20m, debt EUR 100m. At exit: 10x on EUR 28m EBITDA, residual debt EUR 60m. What is the approximate MoM?"},"multi":false,"options":[{"id":"a","text":{"fr":"1,4x","en":"1.4x"},"correct":false,"why":{"fr":"Erreur : c'est le ratio des EBITDA, pas des equity.","en":"Mistake: that is the EBITDA ratio, not the equity ratio."}},{"id":"b","text":{"fr":"2,2x","en":"2.2x"},"correct":true,"why":{"fr":"Correct : equity entrée = 200 − 100 = 100 ; equity sortie = 280 − 60 = 220 ; MoM = 220/100 = 2,2x.","en":"Correct: entry equity = 200 - 100 = 100; exit equity = 280 - 60 = 220; MoM = 220/100 = 2.2x."}},{"id":"c","text":{"fr":"2,8x","en":"2.8x"},"correct":false},{"id":"d","text":{"fr":"1,9x","en":"1.9x"},"correct":false}],"explanation":{"fr":"MoM = equity de sortie / equity d'entrée, où equity = EV − dette nette.","en":"MoM = exit equity / entry equity, where equity = EV - net debt."},"workings":{"fr":"EV entrée = 10 × 20 = 200 ; equity = 200 − 100 = 100. EV sortie = 10 × 28 = 280 ; equity = 280 − 60 = 220. MoM = 220 / 100 = 2,2x.","en":"Entry EV = 10 x 20 = 200; equity = 200 - 100 = 100. Exit EV = 10 x 28 = 280; equity = 280 - 60 = 220. MoM = 220 / 100 = 2.2x."}},{"id":"qcm.l4.lbo1.001","type":"qcm","level":4,"topic":"LBO","tags":["LBO"],"difficulty":4,"source":{"flag":"VERIFIED"},"moduleId":"mod.l4.lbo1-paper","stem":{"fr":"Quel profil constitue le meilleur candidat à un [[LBO]] ?","en":"Which profile makes the best [[LBO]] candidate?"},"multi":false,"options":[{"id":"a","text":{"fr":"Une start-up en hyper-croissance consommatrice de cash","en":"A cash-burning hyper-growth start-up"},"correct":false,"why":{"fr":"La dette étoufferait une société qui consomme du cash.","en":"Debt would choke a cash-burning company."}},{"id":"b","text":{"fr":"Une société aux cash-flows stables et prévisibles","en":"A company with stable, predictable cash flows"
