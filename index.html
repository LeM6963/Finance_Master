rrectement EV et equity value.","en":"Trading comparables give an instant market value, complementary to the DCF. Every M&A analyst spends hours building them; interviewers want to check that you pick the right multiples, clean outliers, and correctly relate EV and equity value."},"concepts":[{"heading":{"fr":"La palette de multiples","en":"The multiple toolkit"},"body":{"fr":"Les multiples d'[[EV]] (sur base d'entreprise) — EV/EBITDA, EV/EBIT, EV/Sales — sont indépendants de la structure de capital. Les multiples d'equity — [[P/E]] — dépendent du levier et de la fiscalité. EV/EBITDA est le plus universel ; EV/Sales sert aux sociétés non rentables (tech early stage).","en":"EV multiples (enterprise basis) — EV/EBITDA, EV/EBIT, EV/Sales — are independent of capital structure. Equity multiples — [[P/E]] — depend on leverage and tax. EV/EBITDA is the most universal; EV/Sales serves unprofitable companies (early-stage tech)."}},{"heading":{"fr":"Médiane vs moyenne","en":"Median vs mean"},"body":{"fr":"On retient la MÉDIANE de l'échantillon, pas la moyenne, car les outliers (une société survalorisée ou en restructuration) tirent la moyenne et faussent la valorisation. La médiane est robuste : c'est le réflexe attendu en entretien.","en":"We use the MEDIAN of the sample, not the mean, because outliers (an overvalued company or one in restructuring) drag the mean and distort the valuation. The median is robust: it is the expected reflex in interviews."}},{"heading":{"fr":"Le P/E, le moins fiable","en":"P/E, the least reliable"},"body":{"fr":"Le [[P/E]] est le multiple le MOINS fiable : il dépend du levier (charges d'intérêts), du taux d'impôt et d'éléments exceptionnels qui polluent le résultat net. Deux sociétés identiques opérationnellement mais avec des dettes différentes auront des P/E très différents. On préfère donc les multiples d'EV.","en":"[[P/E]] is the LEAST reliable multiple: it depends on leverage (interest expense), tax rate, and exceptional items that pollute net income. Two operationally identical companies with different debt will show very different P/Es. EV multiples are therefore preferred."}},{"heading":{"fr":"Multiples sectoriels","en":"Sector-specific multiples"},"body":{"fr":"Chaque secteur a ses multiples : EV/EBITDAR (avec loyers/leases ajoutés) pour le retail et l'aérien, P/FFO pour les REITs (foncières cotées), EV/EBITDA ajusté pour les telecoms. Utiliser le mauvais multiple sectoriel disqualifie immédiatement.","en":"Each sector has its multiples: EV/EBITDAR (with rents/leases added back) for retail and airlines, P/FFO for REITs (listed property), adjusted EV/EBITDA for telecoms. Using the wrong sector multiple is an immediate disqualifier."}}],"exempleChiffre":{"title":{"fr":"Exemple chiffré — comps du dataroom","en":"Worked example — dataroom comps"},"body":{"fr":"Échantillon de 5 comparables avec EV/EBITDA de 15,2x ; 16,8x ; 17,6x ; 18,9x ; 22,4x. La médiane (valeur centrale) est 17,6x, plus représentative que la moyenne (18,2x) tirée vers le haut par l'outlier à 22,4x. Sur une cible à 200 d'EBITDA : EV = 200 × 17,6 = 3 520. Avec une dette nette de 520, equity value = EV − dette nette = 3 520 − 520 = 3 000.","en":"Sample of 5 comparables with EV/EBITDA of 15.2x; 16.8x; 17.6x; 18.9x; 22.4x. The median (central value) is 17.6x, more representative than the mean (18.2x) pulled up by the 22.4x outlier. On a target with 200 EBITDA: EV = 200 × 17.6 = 3,520. With net debt of 520, equity value = EV − net debt = 3,520 − 520 = 3,000."},"figures":[{"caption":{"fr":"EV/EBITDA des comparables et application","en":"Comparables' EV/EBITDA and application"},"columns":["Comparable","EV/EBITDA"],"rows":[["Comp A","15,2x"],["Comp B","16,8x"],["Comp C","17,6x"],["Comp D","18,9x"],["Comp E","22,4x"],["Médiane / Median","17,6x"],["Moyenne / Mean","18,2x"]]}]},"piegesEntretien":[{"fr":"Utiliser la moyenne plutôt que la médiane et se laisser piéger par un outlier.","en":"Using the mean rather than the median and getting trapped by an outlier."},{"fr":"Mélanger un multiple d'EV avec une métrique d'equity (ex : EV/résultat net) — incohérence dimensionnelle.","en":"Mixing an EV multiple with an equity metric (e.g. EV/net income) — a dimensional inconsistency."},{"fr":"Comparer le P/E entre sociétés à structures de capital différentes sans réaliser qu'il est pollué par le levier.","en":"Comparing P/E across firms with different capital structures without realizing it is polluted by leverage."},{"fr":"Oublier de retrancher la dette nette pour passer de l'EV (donnée par le multiple) à l'equity value.","en":"Forgetting to subtract net debt to bridge from the EV (given by the multiple) to equity value."},{"fr":"Choisir un multiple sectoriel inadapté (P/E pour un REIT au lieu de P/FFO).","en":"Choosing an unsuitable sector multiple (P/E for a REIT instead of P/FFO)."}],"synthese":{"fr":"• Multiples d'EV (EV/EBITDA, EV/EBIT, EV/Sales) indépendants du levier ; P/E le moins fiable. • Médiane, pas moyenne. • Multiples sectoriels : EV/EBITDAR, P/FFO. • EV = EBITDA × multiple ; equity value = EV − dette nette.","en":"• EV multiples (EV/EBITDA, EV/EBIT, EV/Sales) leverage-independent; P/E least reliable. • Median, not mean. • Sector multiples: EV/EBITDAR, P/FFO. • EV = EBITDA × multiple; equity value = EV − net debt."}},"glossaryRefs":["ev","p-e","enterprise-value","equity-value","ebitda"]},{"id":"mod.l3.precedent","type":"module","level":3,"topic":"Valuation","tags":["Valuation","M&A","precedent-transactions","control-premium"],"difficulty":3,"source":{"flag":"VERIFIED","ref":"BIWS precedent transactions guide + Vernimmen"},"title":{"fr":"Transactions précédentes","en":"Precedent transactions"},"objective":{"fr":"Valoriser par les transactions précédentes, comprendre la prime de contrôle et savoir quand le DCF est inadapté.","en":"Value via precedent transactions, understand the control premium, and know when a DCF is inappropriate."},"estMinutes":13,"prerequisites":["mod.l3.trading-comps"],"content":{"contexte":{"fr":"Les transactions précédentes (precedent transactions) ancrent la valorisation sur des deals réellement payés, prime de contrôle incluse. C'est la troisième jambe du triptyque de valorisation avec le DCF et les comparables boursiers, et le jury attend que vous sachiez l'articuler avec les deux autres.","en":"Precedent transactions anchor valuation on deals actually paid, control premium included. They are the third leg of the valuation triptych alongside DCF and trading comparables, and interviewers expect you to articulate it with the other two."},"concepts":[{"heading":{"fr":"Prime de contrôle","en":"Control premium"},"body":{"fr":"Les multiples des transactions précédentes sont généralement SUPÉRIEURS à ceux des comparables boursiers, car un acquéreur paie une prime de contrôle (typiquement 20–40%) pour prendre le contrôle et capter des synergies. Précédents > comparables boursiers est donc la règle.","en":"Precedent transaction multiples are generally HIGHER than trading comparables because an acquirer pays a control premium (typically 20–40%) to take control and capture synergies. Precedents > trading comparables is thus the rule."}},{"heading":{"fr":"Sources","en":"Sources"},"body":{"fr":"On reconstitue les multiples de transactions à partir des communiqués de deal, des prospectus, de Mergermarket, Capital IQ, des rapports d'experts indépendants et des documents d'offre (AMF en France). La difficulté : les conditions financières précises ne sont pas toujours publiques.","en":"Transaction multiples are rebuilt from deal press releases, prospectuses, Mergermarket, Capital IQ, independent expert reports, and offer documents (AMF in France). The challenge: precise financial terms are not always public."}},{"heading":{"fr":"Limites","en":"Limitations"},"body":{"fr":"Les transactions reflètent les conditions de marché de leur époque : un deal signé au pic de 2021 ne dit rien d'un marché 2024 plus tendu. Les multiples sont donc datés. Il faut aussi ajuster pour la taille, le contexte stratégique et le type d'acquéreur (industriel vs financier).","en":"Transactions reflect the market conditions of their time: a deal signed at the 2021 peak says nothing about a tighter 2024 market. The multiples are therefore dated. One must also adjust for size, strategic context, and acquirer type (strategic vs financial)."}},{"heading":{"fr":"Quand le DCF est inadapté","en":"When DCF is inappropriate"},"body":{"fr":"Le DCF du FCFF est inadapté pour les banques, assurances et REITs : leur dette fait partie de l'activité (la dette n'est pas du financement mais de la matière première), et le concept de FCFF n'a pas de sens. On utilise alors le dividend discount model (DDM), le résultat net distribuable, ou des multiples de book value (P/B) et P/FFO.","en":"An FCFF DCF is inappropriate for banks, insurers, and REITs: their debt is part of operations (debt is raw material, not financing), and the FCFF concept makes no sense. Instead one uses the dividend discount model (DDM), distributable earnings, or book-value multiples (P/B) and P/FFO."}}],"exempleChiffre":{"title":{"fr":"Exemple chiffré — prime de contrôle","en":"Worked example — control premium"},"body":{"fr":"Une cible se traite à 17,6x EV/EBITDA en comparables boursiers. Trois transactions précédentes du secteur affichent 20,5x ; 22,0x ; 23,5x, soit une médiane de 22,0x. La prime de contrôle implicite ≈ 22,0 / 17,6 − 1 ≈ 25%, cohérente avec la fourchette 20–40%. Sur un EBITDA de 200, l'approche précédents donne EV = 200 × 22,0 = 4 400, contre 3 520 par les comparables boursiers.","en":"A target trades at 17.6x EV/EBITDA on trading comparables. Three sector precedent transactions show 20.5x; 22.0x; 23.5x, i.e. a median of 22.0x. The implied control premium ≈ 22.0 / 17.6 − 1 ≈ 25%, consistent with the 20–40% range. On a 200 EBITDA, the precedents approach gives EV = 200 × 22.0 = 4,400, versus 3,520 from trading comparables."},"figures":[{"caption":{"fr":"Comparables vs précédents (EBITDA 200)","en":"Comparables vs precedents (EBITDA 200)"},"columns":["Méthode / Method","Multiple médian / Median multiple","EV"],"rows":[["Comparables boursiers / Trading","17,6x","3 520"],["Transactions précédentes / Precedents","22,0x","4 400"],["Prime de contrôle implicite / Implied control premium","~25%",""]]}]},"piegesEntretien":[{"fr":"Oublier que les précédents intègrent une prime de contrôle et donc dépassent les comparables boursiers.","en":"Forgetting that precedents embed a control premium and therefore exceed trading comparables."},{"fr":"Utiliser des transactions trop anciennes dont les conditions de marché ne sont plus pertinentes.","en":"Using transactions too old whose market conditions are no longer relevant."},{"fr":"Appliquer un DCF du FCFF à une banque, une assurance ou un REIT au lieu d'un DDM ou de multiples de book value.","en":"Applying an FCFF DCF to a bank, insurer, or REIT instead of a DDM or book-value multiples."},{"fr":"Ne pas distinguer acquéreur industriel (synergies, prime plus élevée) et acquéreur financier (sponsor LBO).","en":"Failing to distinguish a strategic acquirer (synergies, higher premium) from a financial acquirer (LBO sponsor)."},{"fr":"Prendre les chiffres annoncés sans vérifier s'ils incluent la dette nette et les ajustements.","en":"Taking headline figures without checking whether they include net debt and adjustments."}],"synthese":{"fr":"• Précédents > comparables boursiers à cause de la prime de contrôle (20–40%). • Sources : communiqués, AMF, Mergermarket, Capital IQ. • Limite : multiples datés. • DCF inadapté pour banques/assurances/REITs → DDM, P/B, P/FFO.","en":"• Precedents > trading comparables due to the control premium (20–40%). • Sources: press releases, AMF, Mergermarket, Capital IQ. • Limitation: dated multiples. • DCF inappropriate for banks/insurers/REITs → DDM, P/B, P/FFO."}},"glossaryRefs":["control-premium","ev","ddm","p-ffo"]},{"id":"mod.l5.restructuring","type":"module","level":5,"topic":"Restructuring","tags":["Restructuring","distressed","Chapter11","DIP","waterfall"],"difficulty":5,"source":{"flag":"VERIFIED","ref":"Code de commerce (livre VI) + US Bankruptcy Code + Houlihan Lokey / Lazard restructuring practice"},"title":{"fr":"Restructuration & distressed : procédures FR vs US","en":"Restructuring & distressed: French vs US procedures"},"objective":{"fr":"Comparer les procédures collectives françaises et américaines, situer le rôle des conseils débiteur/créancier et appliquer la waterfall de recouvrement.","en":"Compare French and US insolvency procedures, position debtor/creditor advisory roles and apply the recovery waterfall."},"estMinutes":22,"prerequisites":["mod.l5.distressed-ma"],"content":{"contexte":{"fr":"Quand une société ne peut plus servir sa dette, le terrain bascule du M&A classique vers le restructuring : la valeur ne se partage plus selon le capital mais selon le rang dans la structure de [[capital structure]]. Comprendre les procédures FR et US, et qui conseille qui, est attendu en entretien restructuring (Houlihan Lokey, Lazard, Rothschild, PJT).","en":"When a company can no longer service its debt, the field shifts from classic M&A to restructuring: value is split not by equity but by rank in the [[capital structure]]. Knowing FR and US procedures, and who advises whom, is expected in restructuring interviews (Houlihan Lokey, Lazard, Rothschild, PJT)."},"concepts":[{"heading":{"fr":"Procédures françaises : prévention vs traitement","en":"French procedures: prevention vs treatment"},"body":{"fr":"En droit français, la [[sauvegarde]] est ouverte AVANT la cessation des paiements : le dirigeant garde la main et gèle le passif pour négocier un plan. Le [[redressement judiciaire]] intervient APRÈS la cessation des paiements mais quand le redressement reste possible (période d'observation, plan de continuation ou de cession). La [[liquidation judiciaire]] acte que le redressement est impossible : on réalise les actifs et on désintéresse les créanciers selon leur rang. En amont, le mandat ad hoc et la conciliation offrent un cadre amiable et confidentiel.","en":"Under French law, [[sauvegarde]] (safeguard) is opened BEFORE payment default: management keeps control and freezes liabilities to negotiate a plan. [[redressement judiciaire]] (judicial reorganisation) follows payment default but while recovery is still feasible (observation period, continuation or sale plan). [[liquidation judiciaire]] (judicial liquidation) recognises recovery is impossible: assets are realised and creditors paid by rank. Upstream, mandat ad hoc and conciliation provide amicable, confidential frameworks."}},{"heading":{"fr":"Procédures US : Chapter 11 vs Chapter 7","en":"US procedures: Chapter 11 vs Chapter 7"},"body":{"fr":"Le [[Chapter 11]] est une réorganisation : la société continue d'opérer en [[debtor-in-possession]], bénéficie d'un [[automatic stay]] qui gèle les poursuites, et propose un plan of reorganization voté par classes de créanciers. Le [[Chapter 7]] est une liquidation : un trustee vend les actifs et distribue selon la priorité. L'analogie pédagogique fréquente : Chapter 11 ≈ redressement judiciaire, Chapter 7 ≈ liquidation judiciaire — mais le Chapter 11 est bien plus favorable au débiteur (exclusivité du plan, cram-down possible).","en":"[[Chapter 11]] is a reorganisation: the company keeps operating as [[debtor-in-possession]], enjoys an [[automatic stay]] freezing actions, and proposes a plan of reorganization voted by creditor classes. [[Chapter 7]] is a liquidation: a trustee sells assets and distributes by priority. Common teaching analogy: Chapter 11 ≈ redressement judiciaire, Chapter 7 ≈ liquidation judiciaire — but Chapter 11 is far more debtor-friendly (plan exclusivity, cram-down available)."}},{"heading":{"fr":"Conseil débiteur vs conseil créancier","en":"Debtor-side vs creditor-side advisory"},"body":{"fr":"Les banques de restructuring se positionnent côté débiteur (la société : Lazard, Rothschild & Co, PJT Partners) ou côté créancier (les prêteurs : Houlihan Lokey, leader mondial du conseil créancier). Le conseil débiteur cherche à maximiser la valeur résiduelle pour les actionnaires/management et à étaler la dette ; le conseil créancier cherche à maximiser le recouvrement et accélère souvent vers une conversion [[debt-to-equity swap]] ou un loan-to-own. Les fees ne dépendent pas du volume comme en M&A mais de l'aboutissement de la restructuration.","en":"Restructuring banks sit either debtor-side (the company: Lazard, Rothschild & Co, PJT Partners) or creditor-side (the lenders: Houlihan Lokey, the global leader in creditor advisory). The debtor advisor seeks to preserve residual value for shareholders/management and to reschedule debt; the creditor advisor maximises recovery and often pushes toward a [[debt-to-equity swap]] or loan-to-own. Fees are not volume-based as in M&A but tied to completing the restructuring."}},{"heading":{"fr":"Absolute priority rule & waterfall","en":"Absolute priority rule & waterfall"},"body":{"fr":"La distribution suit l'[[absolute priority rule]] : aucune classe junior n'est servie tant que la classe senior n'est pas intégralement remboursée. La [[waterfall]] typique : frais de procédure et créances super-prioritaires (dont le [[DIP financing]]), puis dette sécurisée senior, puis dette unsecured (obligataire, fournisseurs), puis dette subordonnée/mezzanine, et enfin l'equity (généralement zéro en distressed). Le point de rupture (fulcrum security) est la tranche partiellement remboursée : c'est elle qui prend le contrôle dans une conversion.","en":"Distribution follows the [[absolute priority rule]]: no junior class is paid until the senior class is paid in full. The typical [[waterfall]]: procedure costs and super-priority claims (including [[DIP financing]]), then senior secured debt, then unsecured debt (bonds, trade), then subordinated/mezzanine, and finally equity (usually zero in distressed). The fulcrum security is the partially repaid tranche: it takes control in a conversion."}},{"heading":{"fr":"Valeur de liquidation comme plancher","en":"Liquidation value as a floor"},"body":{"fr":"La [[liquidation value]] est la valeur récupérable si l'on vend les actifs morceau par morceau, hors continuité d'exploitation. Elle constitue le plancher de toute négociation : aucun créancier n'acceptera rationnellement moins que ce qu'il toucherait en liquidation (test du best-interest-of-creditors en Chapter 11). On la compare à la going-concern value (valeur en continuité, généralement supérieure) pour arbitrer entre réorganisation et liquidation.","en":"[[Liquidation value]] is the recoverable value if assets are sold piecemeal, without going concern. It is the floor of any negotiation: no creditor will rationally accept less than they would get in liquidation (the best-interest-of-creditors test in Chapter 11). It is compared to going-concern value (typically higher) to arbitrate between reorganisation and liquidation."}}],"exempleChiffre":{"title":{"fr":"Exemple chiffré : waterfall de recouvrement","en":"Worked example: recovery waterfall"},"body":{"fr":"Société en liquidation, valeur d'entreprise distressed = 100 M€. Passif : DIP/frais 10, dette senior secured 70, dette unsecured 60, equity. Distribution selon waterfall : DIP servi à 100% (10), reste 90 ; senior servi à 100% (70), reste 20 ; unsecured reçoit 20 sur 60, soit un recouvrement de 33% — l'unsecured est la fulcrum security ; subordonné et equity reçoivent 0. C'est la tranche unsecured qui, dans une conversion, prendrait l'equity de la newco.","en":"Company in liquidation, distressed enterprise value = €100m. Liabilities: DIP/costs 10, senior secured 70, unsecured 60, equity. Waterfall distribution: DIP paid 100% (10), 90 left; senior paid 100% (70), 20 left; unsecured gets 20 of 60, a 33% recovery — unsecured is the fulcrum security; subordinated and equity get 0. In a conversion, the unsecured tranche would take the equity of newco."},"figures":[{"caption":{"fr":"Waterfall (valeur disponible 100 M€)","en":"Waterfall (available value €100m)"},"columns":["Tranche","Claim","Récupéré","Recouvrement %"],"rows":[["DIP / frais","10","10","100%"],["Senior secured","70","70","100%"],["Unsecured (fulcrum)","60","20","33%"],["Equity","—","0","0%"]]}]},"piegesEntretien":[{"fr":"Confondre sauvegarde et redressement : la sauvegarde est AVANT la cessation des paiements, le redressement APRÈS.","en":"Confusing safeguard and reorganisation: safeguard is BEFORE payment default, reorganisation is AFTER."},{"fr":"Dire que Chapter 7 = Chapter 11 : le 11 est une réorganisation (la société survit), le 7 une liquidation pure.","en":"Saying Chapter 7 = Chapter 11: 11 is a reorganisation (the company survives), 7 a pure liquidation."},{"fr":"Penser que Houlihan Lokey conseille le débiteur : c'est historiquement LE conseil des créanciers.","en":"Thinking Houlihan Lokey advises the debtor: it is historically THE creditor-side advisor."},{"fr":"Oublier que le DIP financing passe en super-priorité devant la dette pré-existante.","en":"Forgetting that DIP financing ranks super-priority ahead of pre-petition debt."}],"synthese":{"fr":"• FR : sauvegarde (avant défaut) → redressement (après) → liquidation. • US : Chapter 11 (réorg, DIP, automatic stay) vs Chapter 7 (liquidation). • Débiteur : Lazard/Rothschild/PJT ; créancier : Houlihan Lokey. • Absolute priority rule : senior servi avant junior. • Liquidation value = plancher de négociation. • Fulcrum security = tranche pivot qui prend le contrôle.","en":"• FR: safeguard (pre-default) → reorganisation (post) → liquidation. • US: Chapter 11 (reorg, DIP, automatic stay) vs Chapter 7 (liquidation). • Debtor: Lazard/Rothschild/PJT; creditor: Houlihan Lokey. • Absolute priority rule: senior before junior. • Liquidation value = negotiation floor. • Fulcrum security = pivot tranche that takes control."}},"glossaryRefs":["chapter-11","chapter-7","dip-financing","absolute-priority-rule","liquidation-value","fulcrum-security"]},{"id":"mod.l5.distressed-ma","type":"module","level":5,"topic":"Restructuring","tags":["Restructuring","distressed","M&A","loan-to-own","debt-equity"],"difficulty":5,"source":{"flag":"VERIFIED","ref":"Distressed M&A practice + Code de commerce (plan de cession art. L642-1) + special situations funds"},"title":{"fr":"M&A distressed & special situations","en":"Distressed M&A & special situations"},"objective":{"fr":"Maîtriser les leviers d'acquisition d'actifs en difficulté : plan de cession, décote, loan-to-own et conversion dette/equity.","en":"Master the levers of distressed asset acquisition: sale plan, discount, loan-to-own and debt/equity conversion."},"estMinutes":20,"prerequisites":[],"content":{"contexte":{"fr":"Le distressed M&A consiste à acquérir des actifs ou le contrôle d'une société en difficulté à forte décote. Les fonds special situations (Tikehau, Apollo, Oaktree) y déploient des stratégies hybrides dette/equity. C'est un terrain technique où la maîtrise des procédures conditionne le prix payé.","en":"Distressed M&A means acquiring assets or control of a troubled company at a steep discount. Special situations funds (Tikehau, Apollo, Oaktree) deploy hybrid debt/equity strategies. It is a technical field where mastering procedures drives the price paid."},"concepts":[{"heading":{"fr":"Rachat d'actifs en difficulté & plan de cession","en":"Distressed asset purchase & sale plan"},"body":{"fr":"En France, le [[plan de cession]] permet à un repreneur d'acquérir tout ou partie de l'activité dans le cadre d'un redressement ou d'une liquidation, libre du passif laissé derrière (asset deal judiciaire). L'acquéreur ne reprend que les actifs et contrats désignés par le tribunal, ce qui purge la dette : c'est l'équivalent fonctionnel du [[363 sale]] américain (vente d'actifs free and clear sous l'égide de la cour).","en":"In France, the [[plan de cession]] (sale plan) lets a buyer acquire all or part of the business within a reorganisation or liquidation, free of the liabilities left behind (a court-supervised asset deal). The buyer only takes assets and contracts designated by the court, purging the debt: this is the functional equivalent of the US [[363 sale]] (court-supervised free-and-clear asset sale)."}},{"heading":{"fr":"La décote distressed","en":"The distressed discount"},"body":{"fr":"Le prix se forme sous contrainte de temps et d'information : forced seller, due diligence limitée, financement rare. La [[décote]] reflète ce risque et la prime de liquidité exigée par l'acheteur. On valorise souvent par multiple d'EBITDA déprimé puis on applique une décote, ou directement sur la dette décotée (on achète une tranche à 40 cents pour le dollar). Le repère : plus on monte dans la waterfall, plus la décote se resserre.","en":"Price forms under time and information constraints: forced seller, limited due diligence, scarce financing. The [[décote]] (discount) reflects this risk and the liquidity premium the buyer demands. Valuation is often a depressed EBITDA multiple with a discount applied, or directly on discounted debt (buying a tranche at 40 cents on the dollar). Rule of thumb: the higher up the waterfall, the tighter the discount."}},{"heading":{"fr":"Loan-to-own","en":"Loan-to-own"},"body":{"fr":"La stratégie [[loan-to-own]] consiste à acheter sur le marché secondaire la dette décotée d'une société en difficulté — idéalement la fulcrum security — dans le but de convertir cette dette en equity lors de la restructuration et de prendre ainsi le contrôle. On ne veut pas être remboursé : on veut posséder la société post-restructuration, souvent à un coût d'entrée très inférieur à un LBO classique.","en":"The [[loan-to-own]] strategy buys a troubled company's discounted debt on the secondary market — ideally the fulcrum security — aiming to convert that debt into equity during the restructuring and thereby take control. The goal is not repayment but owning the company post-restructuring, often at an entry cost far below a classic LBO."}},{"heading":{"fr":"Conversion dette/equity","en":"Debt/equity conversion"},"body":{"fr":"Le [[debt-to-equity swap]] convertit des créances en actions : les créanciers de la fulcrum security abandonnent leur dette en échange de l'equity de la société désendettée. Les actionnaires historiques sont massivement dilués, voire effacés (wiped out). C'est l'outil central de la restructuration : il transforme un passif intenable en une structure viable et aligne les nouveaux propriétaires (ex-créanciers) sur le redressement.","en":"The [[debt-to-equity swap]] converts claims into shares: fulcrum-security creditors give up their debt in exchange for the equity of the deleveraged company. Legacy shareholders are heavily diluted or wiped out. It is the core restructuring tool: it turns unbearable debt into a viable structure and aligns the new owners (former creditors) with the turnaround."}}],"exempleChiffre":{"title":{"fr":"Exemple chiffré : loan-to-own","en":"Worked example: loan-to-own"},"body":{"fr":"Un fonds achète 60 M€ de dette unsecured (la fulcrum) à 35 cents, soit 21 M€ déboursés. La restructuration efface l'equity historique et convertit l'unsecured en 100% de l'equity d'une newco désendettée valorisée 50 M€. Le fonds détient une participation de 50 M€ pour 21 M€ investis, soit un MoM brut de ~2,4x — sans avoir prêté un euro de new money.","en":"A fund buys €60m of unsecured debt (the fulcrum) at 35 cents, i.e. €21m disbursed. The restructuring wipes out legacy equity and converts the unsecured into 100% of the equity of a deleveraged newco valued at €50m. The fund holds a €50m stake for €21m invested, a gross MoM of ~2.4x — without lending a euro of new money."},"figures":[{"caption":{"fr":"Économie du loan-to-own","en":"Loan-to-own economics"},"columns":["Étape","Montant"],"rows":[["Nominal dette achetée","60 M€"],["Prix d'achat (35c)","21 M€"],["Equity newco reçue","50 M€"],["MoM brut","~2,4x"]]}]},"piegesEntretien":[{"fr":"Croire qu'un plan de cession reprend le passif : non, il purge la dette laissée derrière (asset deal judiciaire).","en":"Believing a sale plan assumes the liabilities: no, it purges the debt left behind (court asset deal)."},{"fr":"Confondre loan-to-own et simple achat de dette pour le rendement : l'objectif est le CONTRÔLE via conversion.","en":"Confusing loan-to-own with buying debt for yield: the goal is CONTROL via conversion."},{"fr":"Acheter une tranche trop senior (remboursée au pair) en croyant prendre le contrôle : il faut cibler la fulcrum.","en":"Buying too-senior a tranche (repaid at par) thinking you gain control: you must target the fulcrum."}],"synthese":{"fr":"• Plan de cession FR ≈ 363 sale US : actifs free and clear. • Décote distressed = risque + prime de liquidité. • Loan-to-own : acheter la fulcrum décotée → convertir → contrôle. • Debt-to-equity swap : créanciers deviennent actionnaires, equity historique dilué/effacé. • Fonds special situations : Tikehau, Oaktree, Apollo.","en":"• French sale plan ≈ US 363 sale: free-and-clear assets. • Distressed discount = risk + liquidity premium. • Loan-to-own: buy the discounted fulcrum → convert → control. • Debt-to-equity swap: creditors become shareholders, legacy equity diluted/wiped. • Special situations funds: Tikehau, Oaktree, Apollo."}},"glossaryRefs":["plan-de-cession","loan-to-own","debt-to-equity-swap","363-sale","fulcrum-security"]},{"id":"mod.l5.buildup","type":"module","level":5,"topic":"LBO","tags":["LBO","build-up","buy-and-build","multiple-arbitrage","M&A"],"difficulty":5,"source":{"flag":"VERIFIED","ref":"Vernimmen + pratique PE européenne (Ardian, Bridgepoint, IK)"},"title":{"fr":"Build-up / buy-and-build","en":"Build-up / buy-and-build"},"objective":{"fr":"Construire une thèse de création de valeur par croissance externe : plateforme, bolt-ons, arbitrage de multiple et impact sur le [[MoM]].","en":"Build a value-creation thesis through external growth: platform, bolt-ons, multiple arbitrage and impact on [[MoM]]."},"estMinutes":18,"prerequisites":["mod.l4.lbo5"],"content":{"contexte":{"fr":"Dans un marché où les multiples d'entrée sont élevés, une large part de la création de valeur en [[LBO]] ne vient plus du seul désendettement mais de la croissance de l'[[EBITDA]]. Le build-up — acheter une plateforme puis enchaîner des acquisitions complémentaires (bolt-ons) — est devenu la thèse dominante des fonds mid-cap européens (Ardian, Bridgepoint, IK, Hivest). En entretien, savoir articuler arbitrage de multiple, intégration et financement des bolt-ons est attendu au niveau senior.","en":"In a market where entry multiples are high, much of [[LBO]] value creation no longer comes from deleveraging alone but from [[EBITDA]] growth. Build-up — buying a platform then chaining complementary acquisitions (bolt-ons) — has become the dominant thesis of European mid-cap funds (Ardian, Bridgepoint, IK, Hivest). In interviews, articulating multiple arbitrage, integration and bolt-on financing is expected at senior level."},"concepts":[{"heading":{"fr":"Plateforme vs bolt-on","en":"Platform vs bolt-on"},"body":{"fr":"La [[platform]] est la première cible : elle apporte l'équipe de management, les systèmes et la taille critique pour absorber des acquisitions. Les [[bolt-on]] (ou add-ons) sont des cibles plus petites rachetées ensuite pour gagner des parts de marché, une géographie, une techno ou des synergies. La plateforme se paie cher (multiple plein), les bolt-ons doivent se payer moins cher.","en":"The [[platform]] is the first target: it brings the management team, systems and critical mass to absorb acquisitions. [[bolt-on]] (or add-ons) are smaller targets bought afterwards to gain market share, geography, technology or synergies. The platform is expensive (full multiple); bolt-ons must be cheaper."}},{"heading":{"fr":"L'arbitrage de multiple","en":"Multiple arbitrage"},"body":{"fr":"Le cœur du build-up est le [[multiple arbitrage]] : on achète des bolt-ons à un multiple [[EV/EBITDA]] inférieur à celui de la plateforme, mais ils sont consolidés et revendus au multiple (plus élevé) de l'ensemble. Exemple : plateforme acquise à 10x, bolt-ons à 6x ; à la sortie le groupe consolidé se valorise à 11x. Chaque euro d'EBITDA acheté à 6x vaut instantanément 11x dans la valorisation du groupe — un gain mécanique avant même toute synergie.","en":"The core of build-up is [[multiple arbitrage]]: you buy bolt-ons at a lower [[EV/EBITDA]] multiple than the platform, but they are consolidated and resold at the (higher) multiple of the whole. Example: platform bought at 10x, bolt-ons at 6x; at exit the consolidated group is valued at 11x. Each euro of EBITDA bought at 6x is instantly worth 11x in the group's valuation — a mechanical gain before any synergy."}},{"heading":{"fr":"Impact sur l'EBITDA consolidé et le MoM","en":"Impact on consolidated EBITDA and MoM"},"body":{"fr":"Le build-up gonfle l'[[EBITDA]] consolidé (croissance externe + synergies de coûts et de revenus), ce qui augmente l'[[Enterprise Value]] de sortie. Comme le [[MoM]] = equity de sortie / equity d'entrée, et que l'equity de sortie = EV de sortie − dette nette, plus l'EBITDA et le multiple de sortie sont élevés, plus le MoM grimpe. L'arbitrage de multiple ajoute en plus une re-rating value : on transforme du petit EBITDA cher en grand EBITDA mieux valorisé.","en":"Build-up inflates consolidated [[EBITDA]] (external growth + cost and revenue synergies), which raises exit [[Enterprise Value]]. Since [[MoM]] = exit equity / entry equity, and exit equity = exit EV − net debt, the higher the EBITDA and exit multiple, the higher the MoM. Multiple arbitrage adds a re-rating value: small expensive EBITDA is turned into large, better-valued EBITDA."}},{"heading":{"fr":"Financement et intégration","en":"Financing and integration"},"body":{"fr":"Les bolt-ons se financent par tirage sur une [[acquisition facility]] / accordéon, par cash-flow disponible ou par equity du fonds (parfois roll-over du vendeur). Côté opérationnel, l'intégration (PMI) est le vrai risque : harmonisation des ERP, rétention du management, capture effective des synergies. Une thèse de build-up crédible chiffre les synergies, le calendrier de capture et le coût de l'intégration (one-off).","en":"Bolt-ons are financed by drawing on an [[acquisition facility]] / accordion, by available cash flow or by fund equity (sometimes seller roll-over). Operationally, integration (PMI) is the real risk: ERP harmonisation, management retention, effective synergy capture. A credible build-up thesis quantifies synergies, the capture timeline and the one-off integration cost."}},{"heading":{"fr":"Risques du build-up","en":"Build-up risks"},"body":{"fr":"Risques majeurs : sur-payer les bolt-ons et détruire l'arbitrage ; sur-endetter le groupe en empilant les tirages ; échouer l'intégration et diluer la marge ; complexifier le reporting au point de décourager les acheteurs en sortie. Un build-up raté ressemble à une holding hétéroclite plutôt qu'à un groupe intégré valorisable à un multiple premium.","en":"Major risks: overpaying bolt-ons and destroying the arbitrage; over-leveraging the group by stacking drawdowns; failing integration and diluting margin; making reporting so complex it deters exit buyers. A failed build-up looks like a ragbag holding rather than an integrated group worth a premium multiple."}}],"exempleChiffre":{"title":{"fr":"Exemple chiffré","en":"Worked example"},"body":{"fr":"Plateforme : EBITDA 20 M€, achetée à 10x soit EV 200 M€, financée 50% dette (100 M€) / 50% equity (100 M€). On réalise 3 bolt-ons totalisant 10 M€ d'EBITDA, payés en moyenne 6x = 60 M€, financés par dette. Synergies : +2 M€ d'EBITDA. EBITDA consolidé de sortie = 20 + 10 + 2 = 32 M€. Sortie à 11x → EV 352 M€. Dette nette de sortie ≈ 100 + 60 − 40 (cash-flow cumulé de désendettement) = 120 M€. Equity de sortie = 352 − 120 = 232 M€. MoM = 232 / 100 = 2,32x.","en":"Platform: EBITDA EUR 20m, bought at 10x i.e. EV EUR 200m, financed 50% debt (EUR 100m) / 50% equity (EUR 100m). Three bolt-ons totalling EUR 10m EBITDA are done, paid on average 6x = EUR 60m, debt-financed. Synergies: +EUR 2m EBITDA. Exit consolidated EBITDA = 20 + 10 + 2 = EUR 32m. Exit at 11x → EV EUR 352m. Exit net debt ≈ 100 + 60 − 40 (cumulative deleveraging cash flow) = EUR 120m. Exit equity = 352 − 120 = EUR 232m. MoM = 232 / 100 = 2.32x."},"figures":[{"caption":{"fr":"Pont de création de valeur (MoM)","en":"Value creation bridge (MoM)"},"columns":["Poste","Entrée","Sortie"],"rows":[["EBITDA (M€)","20","32"],["Multiple EV/EBITDA","10x","11x"],["EV (M€)","200","352"],["Dette nette (M€)","100","120"],["Equity (M€)","100","232"]]}]},"piegesEntretien":[{"fr":"Confondre arbitrage de multiple et synergies : ce sont deux leviers distincts. L'arbitrage existe même sans aucune synergie, tant que le bolt-on est acheté moins cher que le multiple de groupe.","en":"Confusing multiple arbitrage with synergies: they are two distinct levers. Arbitrage exists even with zero synergy, as long as the bolt-on is bought cheaper than the group multiple."},{"fr":"Oublier que financer les bolt-ons en dette augmente la dette nette de sortie et donc ronge l'equity de sortie : l'arbitrage doit dépasser le coût de la dette ajoutée.","en":"Forgetting that debt-financing bolt-ons increases exit net debt and thus erodes exit equity: the arbitrage must exceed the cost of added debt."},{"fr":"Annoncer une re-rating de multiple à la sortie (10x → 11x) sans la justifier par la taille, la diversification ou la qualité du groupe consolidé.","en":"Claiming a multiple re-rating at exit (10x → 11x) without justifying it by the size, diversification or quality of the consolidated group."},{"fr":"Négliger les coûts one-off d'intégration et la dilution temporaire de marge pendant la PMI, qui retardent la capture des synergies.","en":"Neglecting one-off integration costs and the temporary margin dilution during PMI, which delay synergy capture."}],"synthese":{"fr":"• Plateforme = base ; bolt-ons = croissance externe ciblée.\n• Arbitrage de multiple : acheter bas (≈6x), valoriser haut (≈11x).\n• Build-up gonfle l'EBITDA consolidé → EV de sortie → MoM.\n• Financement : accordéon / cash-flow / equity ; surveiller la dette nette.\n• Vrai risque = intégration (PMI), pas l'achat.","en":"• Platform = base; bolt-ons = targeted external growth.\n• Multiple arbitrage: buy low (~6x), value high (~11x).\n• Build-up inflates consolidated EBITDA → exit EV → MoM.\n• Financing: accordion / cash flow / equity; watch net debt.\n• Real risk = integration (PMI), not the purchase."}},"glossaryRefs":["mom","ebitda","multiple-arbitrage","bolt-on","platform"]},{"id":"mod.l5.take-private","type":"module","level":5,"topic":"M&A","tags":["M&A","take-private","P2P","OPA","squeeze-out"],"difficulty":5,"source":{"flag":"VERIFIED","ref":"AMF règlement général + pratique P2P européenne (EQT/Cinven/Permira)"},"title":{"fr":"Public-to-private / [[take-private]]","en":"Public-to-private / [[take-private]]"},"objective":{"fr":"Maîtriser le retrait de cote d'une cible cotée par un fonds : prime, engagements, [[OPA]]/scheme, financement LBO et squeeze-out.","en":"Master the delisting of a listed target by a fund: premium, undertakings, [[OPA]]/scheme, LBO financing and squeeze-out."},"estMinutes":18,"prerequisites":["mod.l4.lbo5"],"content":{"contexte":{"fr":"Un [[take-private]] (public-to-private, P2P) consiste pour un fonds à racheter l'intégralité d'une société cotée pour la sortir de la bourse et la gérer en [[LBO]]. C'est un exercice technique très exposé en entretien M&A/PE senior : il combine droit boursier (offre publique, primes, seuils), financement à effet de levier et négociation avec un board indépendant. Les grands P2P européens (Cinven/Synlab, EQT, Permira, Thoma Bravo en US) sont des cas d'école.","en":"A [[take-private]] (public-to-private, P2P) is a fund buying an entire listed company to delist it and run it as an [[LBO]]. It is a technical exercise heavily tested in senior M&A/PE interviews: it combines securities law (public offer, premiums, thresholds), leveraged financing and negotiation with an independent board. Large European P2Ps (Cinven/Synlab, EQT, Permira, Thoma Bravo in the US) are textbook cases."},"concepts":[{"heading":{"fr":"Le retrait de cote et la prime d'offre","en":"Delisting and the offer premium"},"body":{"fr":"Pour convaincre les actionnaires de céder, l'acquéreur offre une [[prime]] sur le cours de bourse, typiquement de l'ordre de ~30% (parfois 20–40%) sur le cours non affecté ou la moyenne pondérée des derniers mois. La prime rémunère le contrôle et l'illiquidité future. Un [[fairness opinion]] d'une banque indépendante mandatée par le board vient confirmer le caractère équitable du prix.","en":"To convince shareholders to sell, the acquirer offers a [[premium]] over the share price, typically around ~30% (sometimes 20–40%) over the unaffected price or the volume-weighted average of recent months. The premium pays for control and future illiquidity. A [[fairness opinion]] from an independent bank mandated by the board confirms the price is fair."}},{"heading":{"fr":"OPA vs scheme of arrangement","en":"Tender offer vs scheme of arrangement"},"body":{"fr":"Deux mécanismes coexistent. L'[[OPA]] (tender offer) : l'acquéreur lance une offre publique d'achat à laquelle les actionnaires apportent leurs titres ; en France/UE on vise un seuil élevé (90–95%) pour pouvoir squeezer le reliquat. Le [[scheme of arrangement]] (droit anglais/irlandais) : un vote des actionnaires à une majorité qualifiée (souvent 75% en valeur) homologué par un juge, qui s'impose ensuite à 100% des titres — plus rapide pour atteindre le contrôle total, mais binaire.","en":"Two mechanisms coexist. The [[OPA]] (tender offer): the acquirer launches a public offer to which shareholders tender their shares; in France/EU you aim for a high threshold (90–95%) to squeeze out the remainder. The [[scheme of arrangement]] (English/Irish law): a shareholder vote at a qualified majority (often 75% by value) sanctioned by a court, which then binds 100% of shares — faster to reach full control, but binary."}},{"heading":{"fr":"Engagements irrévocables","en":"Irrevocable undertakings"},"body":{"fr":"Avant d'annoncer, l'acquéreur sécurise des [[engagements irrévocables]] (irrevocable undertakings) auprès des principaux actionnaires (fondateurs, family office, grands institutionnels) : ils s'engagent à apporter leurs titres à l'offre. Cela dé-risque l'opération et signale au marché qu'un bloc significatif est acquis, réduisant la probabilité d'une contre-offre.","en":"Before announcing, the acquirer secures [[irrevocable undertakings]] from the main shareholders (founders, family office, large institutionals): they commit to tender their shares. This de-risks the deal and signals to the market that a significant block is locked up, reducing the probability of a counter-bid."}},{"heading":{"fr":"Financement LBO de l'opération","en":"LBO financing of the deal"},"body":{"fr":"Le P2P se finance comme un [[LBO]] : equity du fonds + dette d'acquisition ([[unitranche]] ou TLB + RCF), souscrite via un [[bidco]]. La dette doit être committée (certain funds) avant le lancement de l'offre, car le régulateur exige la certitude de financement. La cible, une fois retirée de la cote, porte la dette (debt push-down) une fois les contraintes de cotation levées.","en":"The P2P is financed like an [[LBO]]: fund equity + acquisition debt ([[unitranche]] or TLB + RCF), drawn through a [[bidco]]. The debt must be committed (certain funds) before launching the offer, because the regulator requires financing certainty. Once delisted, the target carries the debt (debt push-down) after listing constraints are lifted."}},{"heading":{"fr":"Squeeze-out et sortie","en":"Squeeze-out and exit"},"body":{"fr":"Une fois le seuil atteint (≥90% en France, [[AMF]]), l'acquéreur lance un [[squeeze-out]] (retrait obligatoire) pour racheter les minoritaires résiduels au prix de l'offre et détenir 100%. La société est radiée. La sortie se fait ensuite comme un LBO classique : revente à un autre sponsor, à un industriel, ou re-IPO quelques années plus tard.","en":"Once the threshold is reached (≥90% in France, [[AMF]]), the acquirer launches a [[squeeze-out]] (mandatory buyout) to buy residual minorities at the offer price and hold 100%. The company is delisted. Exit then proceeds like a classic LBO: sale to another sponsor, to a strategic, or a re-IPO a few years later."}}],"exempleChiffre":{"title":{"fr":"Exemple chiffré","en":"Worked example"},"body":{"fr":"Cible cotée : 100 M actions, cours non affecté 20 €, soit capitalisation 2,0 Md€. Le fonds offre une prime de 30% → prix d'offre 26 €/action, equity value 2,6 Md€. La cible a 0,4 Md€ de dette nette → EV de l'offre = 2,6 + 0,4 = 3,0 Md€. Financement : 1,4 Md€ d'equity du fonds + 1,6 Md€ de dette d'acquisition (levier ≈ 5,3x si EBITDA ≈ 0,3 Md€). Engagements irrévocables sécurisés sur 35% du capital ; seuil de réussite fixé à 90% avec squeeze-out à suivre.","en":"Listed target: 100m shares, unaffected price EUR 20, i.e. market cap EUR 2.0bn. The fund offers a 30% premium → offer price EUR 26/share, equity value EUR 2.6bn. The target has EUR 0.4bn net debt → offer EV = 2.6 + 0.4 = EUR 3.0bn. Financing: EUR 1.4bn fund equity + EUR 1.6bn acquisition debt (leverage ≈ 5.3x if EBITDA ≈ EUR 0.3bn). Irrevocable undertakings secured on 35% of capital; success threshold set at 90% with squeeze-out to follow."},"figures":[{"caption":{"fr":"Du cours de bourse à l'EV de l'offre","en":"From share price to offer EV"},"columns":["Poste","Valeur"],"rows":[["Cours non affecté","20 €"],["Prime d'offre","+30%"],["Prix d'offre / action","26 €"],["Equity value","2,6 Md€"],["+ Dette nette","0,4 Md€"],["EV de l'offre","3,0 Md€"]]}]},"piegesEntretien":[{"fr":"Calculer la prime sur le dernier cours coté plutôt que sur le cours non affecté (avant la fuite/rumeur) : le régulateur et la fairness opinion raisonnent sur le cours non affecté et des moyennes pondérées.","en":"Computing the premium on the last quoted price rather than the unaffected price (before leak/rumour): the regulator and fairness opinion reason on the unaffected price and volume-weighted averages."},{"fr":"Oublier la condition de certain funds : on ne lance pas une offre publique sans financement committé, sous peine de sanction du régulateur.","en":"Forgetting the certain funds condition: you do not launch a public offer without committed financing, on pain of regulator sanction."},{"fr":"Confondre seuil de squeeze-out (≥90% en France) et majorité d'un scheme (≈75% en valeur, droit anglais) : ce sont des juridictions et mécanismes différents.","en":"Confusing the squeeze-out threshold (≥90% in France) with a scheme majority (~75% by value, English law): different jurisdictions and mechanisms."},{"fr":"Raisonner equity value alors que le LBO se finance sur l'[[Enterprise Value]] (prix des actions + reprise de la dette nette).","en":"Reasoning on equity value when the LBO is financed on [[Enterprise Value]] (share price + assumption of net debt)."}],"synthese":{"fr":"• P2P = racheter une cotée, la sortir de bourse, la gérer en LBO.\n• Prime ~30% sur cours non affecté ; fairness opinion du board.\n• OPA (seuil 90–95%) vs scheme (vote ≈75% homologué).\n• Engagements irrévocables sécurisés avant annonce.\n• Financement LBO committé (certain funds) via bidco.\n• Squeeze-out à ≥90% (AMF) → 100% → radiation → sortie.","en":"• P2P = buy a listed co, delist it, run it as an LBO.\n• Premium ~30% over unaffected price; board fairness opinion.\n• Tender offer (90–95% threshold) vs scheme (~75% vote sanctioned).\n• Irrevocable undertakings secured before announcement.\n• Committed LBO financing (certain funds) via bidco.\n• Squeeze-out at ≥90% (AMF) → 100% → delisting → exit."}},"glossaryRefs":["take-private","opa","scheme-of-arrangement","squeeze-out","irrevocable-undertaking","bidco"]},{"id":"mod.l5.ecm","type":"module","level":5,"topic":"ECM","tags":["ECM","IPO","equity","bookbuilding","Euronext"],"difficulty":5,"source":{"flag":"VERIFIED","ref":"Vernimmen + Euronext Paris listing rules + standard ECM practice"},"title":{"fr":"ECM : IPO et émissions d'actions","en":"ECM: IPOs and equity issuance"},"objective":{"fr":"Comprendre le déroulé d'une introduction en bourse, de la valorisation au pricing, et maîtriser le vocabulaire ECM (bookbuilding, greenshoe, lock-up, free float).","en":"Understand the IPO process from valuation to pricing, and master ECM vocabulary (bookbuilding, greenshoe, lock-up, free float)."},"estMinutes":16,"prerequisites":[],"content":{"contexte":{"fr":"L'[[Equity Capital Markets]] (ECM) couvre la levée de fonds en fonds propres : IPO, augmentations de capital, placements accélérés. L'IPO est l'opération phare — elle transforme une société privée en société cotée, fixe une valorisation publique et permet aux actionnaires existants (fondateurs, fonds de PE) de monétiser tout ou partie de leur participation. En entretien, on attend que vous distinguiez émission primaire (argent neuf pour la société) et cession secondaire (argent pour les vendeurs), et que vous sachiez expliquer le rôle des banques.","en":"[[Equity Capital Markets]] (ECM) covers raising equity financing: IPOs, capital increases, accelerated placements. The IPO is the flagship deal — it turns a private company into a listed one, sets a public valuation and lets existing shareholders (founders, PE funds) monetise part or all of their stake. In interviews you are expected to distinguish primary issuance (new money for the company) from secondary sale (money for selling shareholders), and to explain the banks' role."},"concepts":[{"heading":{"fr":"Le processus d'IPO","en":"The IPO process"},"body":{"fr":"Une IPO suit des étapes ordonnées : mandat et choix des [[bookrunner]]s, due diligence et rédaction du prospectus (visa AMF en France), pré-marketing avec publication de recherche (analyst presentation), puis le [[roadshow]] où le management rencontre les investisseurs institutionnels. S'ouvre alors le [[bookbuilding]] : les banques collectent les ordres dans un livre d'ordres sur une fourchette de prix indicative. À la clôture, le prix d'offre est fixé, les actions allouées, puis cotées. Le calendrier typique court sur plusieurs mois (~3–6 mois) entre kick-off et première cotation.","en":"An IPO follows ordered steps: mandate and choice of [[bookrunner]]s, due diligence and prospectus drafting (AMF visa in France), pre-marketing with published research (analyst presentation), then the [[roadshow]] where management meets institutional investors. The [[bookbuilding]] then opens: banks collect orders into an order book over an indicative price range. At close, the offer price is set, shares are allocated, then listed. A typical timeline runs several months (~3–6 months) from kick-off to first trading."}},{"heading":{"fr":"Fourchette de prix et bookbuilding","en":"Price range and bookbuilding"},"body":{"fr":"La banque propose une fourchette de prix indicative (par ex. 18–22 € APPROXIMATE) dérivée de la valorisation (comparables boursiers, comparables de transactions, DCF). Pendant le [[bookbuilding]], les investisseurs soumettent des ordres limités ou au prix de marché ; la qualité et la profondeur du livre (oversubscription, type d'investisseurs « long-only » vs hedge funds) guident le pricing final. Le prix est généralement fixé pour laisser une légère [[décote d'IPO]] (IPO discount) afin d'assurer une bonne performance le premier jour.","en":"The bank proposes an indicative price range (e.g. €18–22 APPROXIMATE) derived from valuation (trading comps, transaction comps, DCF). During [[bookbuilding]], investors submit limit or market orders; the quality and depth of the book (oversubscription, long-only vs hedge fund mix) guide final pricing. The price is usually set to leave a small [[IPO discount]] to ensure a good first-day performance."}},{"heading":{"fr":"Primaire vs secondaire, free float","en":"Primary vs secondary, free float"},"body":{"fr":"Une IPO peut comporter une tranche primaire (émission d'actions nouvelles : le produit va à la société pour financer croissance ou désendettement) et une tranche secondaire (cession d'actions existantes : le produit va aux actionnaires vendeurs, souvent fondateurs ou sponsors PE). Le [[free float]] désigne la part du capital effectivement négociable sur le marché ; les places exigent un flottant minimum (Euronext : indicativement ~25 % ou un montant minimum APPROXIMATE) pour assurer la liquidité.","en":"An IPO can include a primary tranche (newly issued shares: proceeds go to the company to fund growth or deleveraging) and a secondary tranche (sale of existing shares: proceeds go to selling shareholders, often founders or PE sponsors). The [[free float]] is the portion of capital actually tradable on the market; exchanges require a minimum free float (Euronext: indicatively ~25% or a minimum amount APPROXIMATE) to ensure liquidity."}},{"heading":{"fr":"Greenshoe et stabilisation","en":"Greenshoe and stabilisation"},"body":{"fr":"L'option de [[greenshoe]] (option de surallocation) autorise les [[bookrunner]]s à placer jusqu'à ~15 % d'actions supplémentaires. Mécanisme : le syndicat survend des actions (position courte), puis si le cours baisse, rachète sur le marché pour stabiliser le titre ; si le cours monte, il exerce le greenshoe auprès de la société/des vendeurs pour couvrir sa position. C'est l'outil de stabilisation post-IPO encadré par la réglementation.","en":"The [[greenshoe]] (over-allotment option) lets the [[bookrunner]]s place up to ~15% additional shares. Mechanism: the syndicate over-sells shares (a short position), then if the price falls it buys back in the market to stabilise the stock; if the price rises it exercises the greenshoe from the company/sellers to cover the short. It is the regulated post-IPO stabilisation tool."}},{"heading":{"fr":"Lock-up et décote d'IPO","en":"Lock-up and IPO discount"},"body":{"fr":"Le [[lock-up]] interdit aux initiés (fondateurs, sponsors, management) de vendre leurs actions pendant une période (typiquement ~180 jours APPROXIMATE) après la cotation, pour rassurer le marché sur l'absence d'offre soudaine. La [[décote d'IPO]] est la sous-évaluation volontaire du prix d'offre par rapport à la valeur de marché attendue : elle « laisse de l'argent sur la table » mais récompense les investisseurs primaires et limite le risque d'échec ; un pop modéré au premier jour (par ex. +5 à +15 % APPROXIMATE) est généralement considéré comme une IPO réussie.","en":"The [[lock-up]] bars insiders (founders, sponsors, management) from selling their shares for a period (typically ~180 days APPROXIMATE) after listing, reassuring the market that no sudden supply will hit. The [[IPO discount]] is the deliberate underpricing of the offer relative to expected market value: it 'leaves money on the table' but rewards primary investors and limits deal failure risk; a moderate first-day pop (e.g. +5 to +15% APPROXIMATE) is generally seen as a successful IPO."}}],"exempleChiffre":{"title":{"fr":"Exemple chiffré : dimensionner une IPO","en":"Worked example: sizing an IPO"},"body":{"fr":"Société valorisée 800 M€ d'equity value. On offre 25 % du capital en IPO, dont 60 % primaire et 40 % secondaire, avec un greenshoe de 15 %. Taille de base = 25 % × 800 = 200 M€. Primaire = 120 M€ (vers la société), secondaire = 80 M€ (vers les vendeurs). Greenshoe = 15 % × 200 = 30 M€ d'actions supplémentaires. Taille maximale incluant surallocation = 230 M€. Chiffres EXEMPLE_PEDAGOGIQUE.","en":"Company valued at €800m of equity value. 25% of capital is offered in the IPO, of which 60% primary and 40% secondary, with a 15% greenshoe. Base size = 25% × 800 = €200m. Primary = €120m (to the company), secondary = €80m (to sellers). Greenshoe = 15% × 200 = €30m of additional shares. Maximum size including over-allotment = €230m. Figures EXEMPLE_PEDAGOGIQUE."},"figures":[{"caption":{"fr":"Décomposition de l'offre (M€)","en":"Offer breakdown (€m)"},"columns":["Poste","Montant"],"rows":[["Equity value","800"],["Offre de base (25%)","200"],["dont primaire (60%)","120"],["dont secondaire (40%)","80"],["Greenshoe (15%)","30"],["Taille max","230"]]}]},"piegesEntretien":[{"fr":"Confondre primaire et secondaire : seul le primaire apporte de l'argent à la société ; le secondaire profite aux actionnaires vendeurs.","en":"Confusing primary and secondary: only primary brings money to the company; secondary benefits selling shareholders."},{"fr":"Croire que le greenshoe augmente forcément la taille : c'est une option ; en cas de cours faible, le syndicat rachète plutôt que d'exercer.","en":"Thinking the greenshoe always increases size: it is an option; if the stock is weak the syndicate buys back rather than exercising."},{"fr":"Penser qu'un fort pop au premier jour est toujours bon : un pop excessif (+30 %+) signale une décote d'IPO trop forte, donc de la valeur laissée sur la table par les vendeurs.","en":"Thinking a big first-day pop is always good: an excessive pop (+30%+) signals too large an IPO discount, i.e. value left on the table by sellers."},{"fr":"Oublier le free float minimum exigé par la place : sans liquidité suffisante, pas d'admission.","en":"Forgetting the minimum free float the exchange requires: without enough liquidity, no admission."}],"synthese":{"fr":"• IPO = bookbuilding sur une fourchette, pricing avec légère décote.\n• Primaire = société ; secondaire = vendeurs.\n• Greenshoe ~15 % pour stabiliser le titre.\n• Lock-up ~180 j sur les initiés.\n• Free float minimum pour la liquidité (~25 % Euronext APPROXIMATE).","en":"• IPO = bookbuilding over a range, pricing with a small discount.\n• Primary = company; secondary = sellers.\n• Greenshoe ~15% to stabilise the stock.\n• Lock-up ~180 days on insiders.\n• Minimum free float for liquidity (~25% Euronext APPROXIMATE)."}},"glossaryRefs":["greenshoe","bookrunner","bookbuilding","free-float","lock-up","ipo-discount"]},{"id":"mod.l5.dcm","type":"module","level":5,"topic":"DCM","tags":["DCM","bonds","credit","rating","covenants"],"difficulty":5,"source":{"flag":"VERIFIED","ref":"Vernimmen + rating agency methodologies (Moody's/S&P/Fitch) + standard DCM practice"},"title":{"fr":"DCM : dette obligataire corporate","en":"DCM: corporate bond debt"},"objective":{"fr":"Comprendre l'émission obligataire corporate : investment grade vs high yield, coupon et spread, notation, covenants et use of proceeds, et la comparaison avec la dette bancaire.","en":"Understand corporate bond issuance: investment grade vs high yield, coupon and spread, ratings, covenants and use of proceeds, and the comparison with bank debt."},"estMinutes":16,"prerequisites":[],"content":{"contexte":{"fr":"Le [[Debt Capital Markets]] (DCM) couvre la levée de dette sur les marchés obligataires. Une émission obligataire corporate permet à une entreprise de se financer auprès d'investisseurs (assureurs, fonds, gérants) plutôt que de banques, souvent à plus long terme et sans amortissement. En entretien, on attend que vous compreniez comment le [[spread de crédit]] rémunère le risque, ce que mesure une notation, et pourquoi une société choisit l'obligataire plutôt que le prêt bancaire.","en":"[[Debt Capital Markets]] (DCM) covers raising debt on the bond markets. A corporate bond issue lets a company fund itself from investors (insurers, funds, asset managers) rather than banks, often at longer maturity and bullet (no amortisation). In interviews you are expected to understand how the [[credit spread]] compensates risk, what a rating measures, and why a company picks bonds over a bank loan."},"concepts":[{"heading":{"fr":"Investment grade vs high yield","en":"Investment grade vs high yield"},"body":{"fr":"Les obligations se classent selon la notation : [[investment grade]] (IG) pour les émetteurs solides (S&P/Fitch : BBB- et au-dessus ; Moody's : Baa3 et au-dessus) et [[high yield]] (HY, ou « junk ») en dessous (BB+/Ba1 et en dessous). L'IG offre un spread faible et des conditions souples ; le HY paie un coupon plus élevé, comporte des covenants plus stricts et s'adresse à des investisseurs cherchant du rendement. La frontière BBB-/BB+ est cruciale : un « fallen angel » (passage IG → HY) déclenche souvent des ventes forcées.","en":"Bonds are classified by rating: [[investment grade]] (IG) for solid issuers (S&P/Fitch: BBB- and above; Moody's: Baa3 and above) and [[high yield]] (HY, or 'junk') below (BB+/Ba1 and below). IG offers a low spread and loose terms; HY pays a higher coupon, carries stricter covenants and targets yield-seeking investors. The BBB-/BB+ boundary is crucial: a 'fallen angel' (IG → HY downgrade) often triggers forced selling."}},{"heading":{"fr":"Coupon, spread de crédit et rendement","en":"Coupon, credit spread and yield"},"body":{"fr":"Le coupon est l'intérêt nominal versé périodiquement. Le rendement exigé par le marché se décompose en taux sans risque (par ex. OAT/Bund de maturité équivalente) plus un [[spread de crédit]] qui rémunère le risque de défaut et de liquidité. Plus la notation est basse, plus le spread est large : ordres de grandeur APPROXIMATE — IG ~80–200 pb, HY ~300–600 pb et plus. Si le coupon est fixé à l'émission au pair, prix et rendement varient ensuite inversement sur le marché secondaire.","en":"The coupon is the nominal interest paid periodically. The market-required yield breaks down into a risk-free rate (e.g. matching-maturity OAT/Bund) plus a [[credit spread]] compensating default and liquidity risk. The lower the rating, the wider the spread: orders of magnitude APPROXIMATE — IG ~80–200 bps, HY ~300–600 bps and above. If the coupon is set at par at issuance, price and yield then move inversely on the secondary market."}},{"heading":{"fr":"Notation : Moody's, S&P, Fitch","en":"Rating: Moody's, S&P, Fitch"},"body":{"fr":"Trois grandes agences notent les émetteurs et les émissions : Moody's (échelle Aaa…C), S&P et Fitch (échelle AAA…D). La note reflète la capacité à honorer la dette (probabilité de défaut et recouvrement attendu). Elle dépend de critères quantitatifs (levier net/EBITDA, couverture des intérêts, génération de cash) et qualitatifs (secteur, position concurrentielle, gouvernance). Une notation conditionne directement le spread et donc le coût de financement ; obtenir et défendre son rating est un enjeu stratégique pour l'émetteur.","en":"Three major agencies rate issuers and issues: Moody's (Aaa…C scale), S&P and Fitch (AAA…D scale). The rating reflects ability to service debt (default probability and expected recovery). It depends on quantitative criteria (net leverage/EBITDA, interest coverage, cash generation) and qualitative ones (sector, competitive position, governance). A rating directly drives the spread and thus the cost of funding; obtaining and defending a rating is strategic for the issuer."}},{"heading":{"fr":"Maturité, structure et use of proceeds","en":"Maturity, structure and use of proceeds"},"body":{"fr":"Une obligation corporate a une maturité définie (souvent 5, 7 ou 10 ans) et est généralement [[bullet]] : remboursement intégral du principal in fine, contrairement à la dette bancaire amortissable. Le prospectus précise le [[use of proceeds]] (refinancement, acquisition, capex, finalité ESG pour un green bond). Les obligations HY incluent souvent une option de remboursement anticipé (call) avec prime, et une protection « non-call » initiale interdisant le remboursement pendant les premières années.","en":"A corporate bond has a defined maturity (often 5, 7 or 10 years) and is usually [[bullet]]: full principal repaid at maturity, unlike amortising bank debt. The prospectus states the [[use of proceeds]] (refinancing, acquisition, capex, ESG purpose for a green bond). HY bonds often include a call (early redemption) with premium, plus an initial 'non-call' period barring redemption for the first few years."}},{"heading":{"fr":"Covenants obligataires","en":"Bond covenants"},"body":{"fr":"Les [[covenants]] sont des engagements contractuels protégeant les créanciers. On distingue les incurrence covenants (testés seulement lors d'une action — nouvelle dette, dividende : typiques du HY) des maintenance covenants (testés à chaque période, par ex. levier max : typiques des prêts bancaires/leveraged loans). Les covenants HY classiques limitent l'endettement additionnel, les distributions et les cessions d'actifs. Le marché « cov-lite » désigne des financements avec covenants allégés, plus favorables à l'émetteur.","en":"[[Covenants]] are contractual undertakings protecting creditors. We distinguish incurrence covenants (tested only on an action — new debt, dividend: typical of HY) from maintenance covenants (tested each period, e.g. max leverage: typical of bank loans/leveraged loans). Classic HY covenants restrict additional debt, distributions and asset sales. The 'cov-lite' market refers to financings with looser covenants, more favourable to the issuer."}},{"heading":{"fr":"Obligataire vs dette bancaire","en":"Bonds vs bank debt"},"body":{"fr":"Face au prêt bancaire, l'obligataire offre généralement une maturité plus longue, une structure bullet (pas d'amortissement) et une base d'investisseurs large et liquide, mais avec moins de flexibilité (difficile de renégocier avec un porteur diffus) et des coûts d'émission fixes (rating, prospectus) qui le réservent aux montants significatifs. Le prêt bancaire est plus souple (tirages, remboursement anticipé sans pénalité forte), souvent à taux variable, mais avec maintenance covenants et amortissement. Beaucoup de groupes combinent les deux.","en":"Versus a bank loan, bonds usually offer longer maturity, a bullet structure (no amortisation) and a broad, liquid investor base, but with less flexibility (hard to renegotiate with dispersed holders) and fixed issuance costs (rating, prospectus) that reserve them for sizeable amounts. A bank loan is more flexible (drawdowns, early repayment without heavy penalty), often floating-rate, but with maintenance covenants and amortisation. Many groups combine both."}}],"exempleChiffre":{"title":{"fr":"Exemple chiffré : coût d'une obligation HY","en":"Worked example: cost of a HY bond"},"body":{"fr":"Un émetteur noté BB place une obligation 5 ans bullet de 300 M€. Taux sans risque 5 ans = 2,8 %, spread de crédit = 350 pb. Coupon ≈ 2,8 % + 3,50 % = 6,3 %. Charge d'intérêts annuelle = 6,3 % × 300 = 18,9 M€, remboursement de 300 M€ in fine en année 5. Si plus tard la note tombe à B (fallen angel), le spread se creuse (par ex. à 550 pb) : sur le secondaire le prix de l'obligation baisse pour relever le rendement. Chiffres EXEMPLE_PEDAGOGIQUE.","en":"A BB-rated issuer places a €300m 5-year bullet bond. 5-year risk-free rate = 2.8%, credit spread = 350 bps. Coupon ≈ 2.8% + 3.50% = 6.3%. Annual interest = 6.3% × 300 = €18.9m, with €300m repaid at maturity in year 5. If the rating later drops to B (fallen angel), the spread widens (e.g. to 550 bps): on the secondary market the bond price falls to lift the yield. Figures EXEMPLE_PEDAGOGIQUE."},"figures":[{"caption":{"fr":"Décomposition du rendement","en":"Yield breakdown"},"columns":["Composante","Valeur"],"rows":[["Taux sans risque 5 ans","2,8%"],["Spread de crédit (BB)","350 pb"],["Coupon ~","6,3%"],["Montant émis","300 M€"],["Charge d'intérêts/an","18,9 M€"]]}]},"piegesEntretien":[{"fr":"Confondre coupon et rendement : le coupon est fixe ; le rendement (yield) bouge avec le prix sur le secondaire.","en":"Confusing coupon and yield: the coupon is fixed; the yield moves with the price on the secondary market."},{"fr":"Confondre incurrence et maintenance covenants : les premiers (HY) se testent lors d'une action, les seconds (prêts) à chaque période.","en":"Confusing incurrence and maintenance covenants: the former (HY) are tested on an action, the latter (loans) every period."},{"fr":"Croire que la dette obligataire est toujours moins chère : les coûts fixes (rating, prospectus) et la rigidité peuvent la rendre moins attractive que le bancaire pour des montants modestes.","en":"Thinking bonds are always cheaper: fixed costs (rating, prospectus) and rigidity can make them less attractive than bank debt for modest amounts."},{"fr":"Oublier que la frontière IG/HY (BBB-/BB+) est un seuil de marché majeur, pas une simple nuance de note.","en":"Forgetting the IG/HY boundary (BBB-/BB+) is a major market threshold, not a mere rating nuance."}],"synthese":{"fr":"• IG (≥ BBB-/Baa3) vs HY (≤ BB+/Ba1) : seuil de marché.\n• Rendement = taux sans risque + spread de crédit.\n• Notation (Moody's/S&P/Fitch) pilote le spread.\n• Obligation souvent bullet, maturité 5–10 ans.\n• Covenants : incurrence (HY) vs maintenance (prêts).\n• Vs bancaire : plus long, bullet, liquide, mais moins flexible.","en":"• IG (≥ BBB-/Baa3) vs HY (≤ BB+/Ba1): market threshold.\n• Yield = risk-free rate + credit spread.\n• Rating (Moody's/S&P/Fitch) drives the spread.\n• Bonds often bullet, 5–10 year maturity.\n• Covenants: incurrence (HY) vs maintenance (loans).\n• Vs bank debt: longer, bullet, liquid, but less flexible."}},"glossaryRefs":["investment-grade","high-yield","credit-spread","covenants","use-of-proceeds","bullet"]},{"id":"mod.l5.vc","type":"module","level":5,"topic":"VC","tags":["VC","valuation","cap table","dilution","SAFE"],"difficulty":5,"source":{"flag":"VERIFIED","ref":"Vernimmen + NVCA model docs + Y Combinator SAFE primer"},"title":{"fr":"Venture Capital : valorisation, cap table et dilution","en":"Venture Capital: valuation, cap table and dilution"},"objective":{"fr":"Savoir valoriser une startup pre/post-money, lire une cap table, calculer la dilution par tour et raisonner sur les multiples quand l'EBITDA est négatif.","en":"Be able to value a startup pre/post-money, read a cap table, compute dilution per round and reason on multiples when EBITDA is negative."},"estMinutes":18,"prerequisites":[],"content":{"contexte":{"fr":"Le [[venture capital]] finance des sociétés en forte croissance et souvent non rentables. La logique de valorisation diffère radicalement de celle d'un [[LBO]] : pas de [[DCF]] fiable quand les cash-flows sont négatifs, mais une mécanique de tours successifs, de dilution et de droits préférentiels. En entretien VC ou growth, on attend que vous maîtrisiez le vocabulaire pre/post-money et la lecture d'une [[cap table]].","en":"Venture capital funds high-growth, often unprofitable companies. The valuation logic differs sharply from an LBO: no reliable DCF when cash flows are negative, but a mechanics of successive rounds, dilution and preferred rights. In a VC or growth interview, you are expected to master pre/post-money vocabulary and reading a cap table."},"concepts":[{"heading":{"fr":"Pre-money vs post-money","en":"Pre-money vs post-money"},"body":{"fr":"La [[pre-money valuation]] est la valeur attribuée à la société avant l'injection du nouveau capital. La [[post-money valuation]] = pre-money + montant levé. Le pourcentage acquis par le nouvel investisseur = montant investi / post-money. C'est la relation centrale de tout tour : un investisseur qui met 2 sur une pre-money de 8 obtient 2 / 10 = 20 %.","en":"The pre-money valuation is the value placed on the company before the new capital is injected. Post-money valuation = pre-money + amount raised. The percentage acquired by the new investor = amount invested / post-money. This is the central relationship of any round: an investor putting in 2 at a pre-money of 8 gets 2 / 10 = 20%."}},{"heading":{"fr":"La cap table et la dilution par tour","en":"The cap table and dilution per round"},"body":{"fr":"La [[cap table]] (table de capitalisation) recense qui détient quoi : fondateurs, employés via l'[[ESOP]] (pool d'options), business angels, fonds. À chaque tour (seed, série A, série B), l'émission d'actions nouvelles dilue les actionnaires existants au prorata, sauf clauses anti-dilution. Un fondateur passe typiquement de 100 % à ~50-60 % après seed + A, puis continue de se diluer. La dilution est cumulative : il faut multiplier les fractions résiduelles tour après tour.","en":"The cap table records who owns what: founders, employees via the ESOP (option pool), angels, funds. At each round (seed, Series A, Series B), issuing new shares dilutes existing holders pro rata, except for anti-dilution clauses. A founder typically goes from 100% to ~50-60% after seed + A, then keeps diluting. Dilution is cumulative: you multiply residual fractions round after round."}},{"heading":{"fr":"Liquidation preference","en":"Liquidation preference"},"body":{"fr":"La [[liquidation preference]] détermine l'ordre et le montant que touchent les investisseurs lors d'un événement de liquidité (vente, liquidation). Le standard de marché est 1x non-participating : l'investisseur récupère d'abord 1x son investissement, OU convertit en ordinaire et prend son pourcentage — il choisit le plus avantageux, mais pas les deux. Une preference participating (« double dip ») cumule le remboursement ET la quote-part ; un multiple >1x est agressif et souvent un red flag pour les fondateurs. Cette clause protège l'investisseur surtout dans les sorties faibles.","en":"The liquidation preference sets the order and amount investors receive in a liquidity event (sale, liquidation). The market standard is 1x non-participating: the investor first gets back 1x their investment, OR converts to common and takes their percentage — they pick whichever is larger, but not both. A participating preference ('double dip') stacks the repayment AND the pro-rata share; a multiple >1x is aggressive and often a red flag for founders. This clause protects the investor mostly in low exits."}},{"heading":{"fr":"SAFE et convertible note","en":"SAFE and convertible note"},"body":{"fr":"Au stade très précoce, on évite de fixer une valorisation via deux instruments. Le [[SAFE]] (Simple Agreement for Future Equity, créé par Y Combinator) est un droit de convertir en actions au prochain tour de financement, sans dette ni intérêts. La [[convertible note]] est un prêt qui se convertit en equity, avec intérêts et une maturité. Tous deux comportent généralement un [[valuation cap]] (plafond de valo à la conversion) et/ou un [[discount]] (décote, ex. 20 %) récompensant le risque pris tôt.","en":"At the very early stage, you avoid setting a valuation via two instruments. The SAFE (Simple Agreement for Future Equity, created by Y Combinator) is a right to convert into shares at the next financing round, with no debt or interest. The convertible note is a loan that converts into equity, with interest and a maturity. Both usually carry a valuation cap (a ceiling on the conversion valuation) and/or a discount (e.g. 20%) rewarding the early risk taken."}},{"heading":{"fr":"Multiples quand l'EBITDA est négatif","en":"Multiples when EBITDA is negative"},"body":{"fr":"Une startup en hyper-croissance brûle du cash : l'EBITDA est négatif, donc le [[DCF]] et les multiples d'EBITDA sont inutilisables. On valorise alors sur des proxys de traction : multiple d'[[ARR]] (Annual Recurring Revenue) pour le SaaS, multiple de [[GMV]] (Gross Merchandise Value) pour les marketplaces, ou valeur par utilisateur actif. Ex. SaaS de qualité : 8-15x ARR selon la croissance et la rétention (la [[Rule of 40]] — croissance % + marge % ≥ 40 — sert de filtre qualité).","en":"A hyper-growth startup burns cash: EBITDA is negative, so DCF and EBITDA multiples are unusable. You then value on traction proxies: ARR multiple (Annual Recurring Revenue) for SaaS, GMV multiple (Gross Merchandise Value) for marketplaces, or value per active user. E.g. quality SaaS: 8-15x ARR depending on growth and retention (the Rule of 40 — growth % + margin % >= 40 — acts as a quality filter)."}}],"exempleChiffre":{"title":{"fr":"Exemple chiffré : dilution sur la série A","en":"Worked example: Series A dilution"},"body":{"fr":"Une startup lève une série A. La [[pre-money valuation]] est de 8 M€. Le fonds investit 2 M€. La post-money = 8 + 2 = 10 M€. Le fonds détient donc 2 / 10 = 20 %. Les actionnaires existants (fondateurs + seed) passent de 100 % à 80 % : ils sont dilués de 20 %. Si un fondateur détenait 60 % avant le tour, il en détient 60 % × 80 % = 48 % après.","en":"A startup raises a Series A. The pre-money valuation is EUR 8m. The fund invests EUR 2m. Post-money = 8 + 2 = EUR 10m. The fund therefore owns 2 / 10 = 20%. Existing shareholders (founders + seed) go from 100% to 80%: they are diluted by 20%. If a founder owned 60% before the round, they own 60% x 80% = 48% after."},"figures":[{"caption":{"fr":"Cap table avant / après la série A","en":"Cap table before / after Series A"},"columns":["Détenteur","Avant (%)","Après (%)"],"rows":[["Fondateurs","60","48"],["Seed + ESOP","40","32"],["Fonds série A","0","20"],["Total","100","100"]]}]},"piegesEntretien":[{"fr":"Confondre pre-money et post-money : le % de l'investisseur se calcule TOUJOURS sur la post-money, pas la pre-money.","en":"Confusing pre-money and post-money: the investor's % is ALWAYS computed on post-money, never pre-money."},{"fr":"Oublier que l'ESOP (pool d'options) est souvent créé/élargi AVANT le tour, sur la pre-money — donc il dilue les fondateurs, pas le nouvel investisseur.","en":"Forgetting that the ESOP (option pool) is often created/expanded BEFORE the round, out of the pre-money — so it dilutes founders, not the new investor."},{"fr":"Croire qu'une liquidation preference 1x participating est « standard » : le standard est 1x NON-participating ; participating est plus dur pour les fondateurs.","en":"Believing a 1x participating liquidation preference is 'standard': the standard is 1x NON-participating; participating is harsher on founders."},{"fr":"Appliquer un DCF à une société qui brûle du cash sans cash-flows positifs visibles à horizon raisonnable : inadapté, préférez des multiples de traction (ARR, GMV).","en":"Applying a DCF to a cash-burning company with no positive cash flows visible within a reasonable horizon: inappropriate, prefer traction multiples (ARR, GMV)."}],"synthese":{"fr":"• Post-money = pre-money + montant levé ; % investisseur = montant / post-money.\n• Dilution cumulative : multiplier les fractions résiduelles par tour.\n• [[Liquidation preference]] standard = 1x non-participating.\n• SAFE / convertible note = repousser la valo, avec cap et/ou discount.\n• EBITDA négatif → multiples ARR/GMV/utilisateurs, pas de DCF.","en":"• Post-money = pre-money + amount raised; investor % = amount / post-money.\n• Cumulative dilution: multiply residual fractions per round.\n• Standard liquidation preference = 1x non-participating.\n• SAFE / convertible note = defer the valuation, with cap and/or discount.\n• Negative EBITDA -> ARR/GMV/user multiples, no DCF."}},"glossaryRefs":["pre-money","post-money","cap table","liquidation preference","safe","arr"]},{"id":"mod.l5.deal-judgment","type":"module","level":5,"topic":"Fit","tags":["Fit","deal","interview","investment thesis"],"difficulty":5,"source":{"flag":"VERIFIED","ref":"Standard PE/IB interview frameworks + practitioner consensus"},"title":{"fr":"Jugement sur un deal et négociation en entretien","en":"Deal judgment and negotiation in interviews"},"objective":{"fr":"Savoir parler d'un deal de façon structurée en entretien, reconnaître un bon candidat LBO, articuler qualitatif et quantitatif, repérer les red flags et bâtir une recommandation d'investissement.","en":"Be able to discuss a deal in a structured way in interview, recognise a good LBO candidate, blend qualitative and quantitative, spot red flags and build an investment recommendation."},"estMinutes":16,"prerequisites":[],"content":{"contexte":{"fr":"Au-delà de la technique, les entretiens PE/IB testent votre jugement : est-ce un
