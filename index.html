Coverage Ratio: the NPV of cash flows available over the remaining loan life / outstanding debt. A forward-looking measure of repayment capacity, complementing the DSCR."},"related":["gl.dscr","gl.plcr"]},{"id":"gl.plcr","type":"glossaryTerm","level":4,"topic":"ProjectFinance","tags":["ProjectFinance"],"difficulty":4,"source":{"flag":"VERIFIED"},"term":"PLCR","aliases":["project life coverage ratio","ratio de couverture sur la durée du projet"],"definition":{"fr":"Project Life Coverage Ratio : valeur actuelle des cash flows sur toute la durée du projet (au-delà de la maturité du prêt) / dette en cours. Toujours ≥ LLCR ; capture le cash 'tail' au-delà du prêt.","en":"Project Life Coverage Ratio: the NPV of cash flows over the entire project life (beyond loan maturity) / outstanding debt. Always ≥ LLCR; it captures the cash 'tail' beyond the loan."},"related":["gl.dscr","gl.llcr"]},{"id":"gl.terminal-value","type":"glossaryTerm","level":3,"topic":"DCF","tags":["DCF","Valuation"],"difficulty":3,"source":{"flag":"VERIFIED"},"term":"terminal value","aliases":["valeur terminale","TV","terminal-value","valeur résiduelle","Gordon Shapiro","perpetuity growth"],"definition":{"fr":"Valeur terminale : valeur de l'entreprise au-delà de l'horizon de projection. Méthode de Gordon : TV = FCF·(1+g)/(WACC−g) ; ou méthode du multiple de sortie (EV/EBITDA terminal). Elle représente souvent 60–80% de la valeur d'un DCF.","en":"Terminal value: the firm's value beyond the explicit forecast horizon. Gordon growth: TV = FCF·(1+g)/(WACC−g); or exit-multiple method (terminal EV/EBITDA). It often accounts for 60–80% of a DCF's value."},"related":["gl.dcf","gl.wacc","gl.multiple"]},{"id":"gl.gearing","type":"glossaryTerm","level":2,"topic":"LevFin","tags":["LevFin","Accounting"],"difficulty":2,"source":{"flag":"VERIFIED"},"term":"gearing","aliases":["ratio d'endettement","levier d'endettement","debt-to-equity","D/E","ratio dette/capitaux propres"],"definition":{"fr":"Ratio d'endettement : dette nette / capitaux propres (D/E). Mesure le poids de la dette dans la structure financière ; à distinguer du levier exprimé en dette nette / EBITDA.","en":"Gearing: net debt / equity (D/E). Measures the weight of debt in the capital structure; distinct from leverage expressed as net debt / EBITDA."},"related":["gl.leverage","gl.beta","gl.equity"]},{"id":"gl.roe","type":"glossaryTerm","level":2,"topic":"Accounting","tags":["Accounting"],"difficulty":2,"source":{"flag":"VERIFIED"},"term":"ROE","aliases":["return on equity","rentabilité des capitaux propres","rentabilité financière"],"definition":{"fr":"Rentabilité des capitaux propres : résultat net / capitaux propres. La décomposition de DuPont la relie à la marge, à la rotation de l'actif et au levier : un levier accru gonfle le ROE tant que le ROCE dépasse le coût de la dette.","en":"Return on Equity: net income / shareholders' equity. The DuPont breakdown links it to margin, asset turnover and leverage: more leverage lifts ROE as long as ROCE exceeds the cost of debt."},"related":["gl.roce","gl.leverage","gl.gearing"]},{"id":"gl.roce","type":"glossaryTerm","level":2,"topic":"Accounting","tags":["Accounting"],"difficulty":2,"source":{"flag":"VERIFIED"},"term":"ROCE","aliases":["return on capital employed","rentabilité des capitaux employés","ROIC","return on invested capital","rentabilité économique"],"definition":{"fr":"Rentabilité des capitaux employés : NOPAT (EBIT·(1−T)) / capitaux employés (dette nette + capitaux propres). On crée de la valeur lorsque le ROCE dépasse le WACC.","en":"Return on Capital Employed: NOPAT (EBIT·(1−T)) / capital employed (net debt + equity). Value is created when ROCE exceeds the WACC."},"related":["gl.roe","gl.wacc","gl.ebit"]},{"id":"gl.treasury-stock-method","type":"glossaryTerm","level":3,"topic":"Valuation","tags":["Valuation","Accounting"],"difficulty":3,"source":{"flag":"VERIFIED"},"term":"treasury stock method","aliases":["TSM","méthode du rachat d'actions","treasury-stock-method","méthode des actions auto-détenues"],"definition":{"fr":"Méthode de calcul des actions diluées : les options dans la monnaie sont supposées exercées, et le produit des exercices sert à racheter des actions au cours de marché. Sert à passer du nombre d'actions de base au nombre dilué pour l'equity value.","en":"Treasury Stock Method: in-the-money options are assumed exercised, and the proceeds used to buy back shares at the market price. Used to convert basic shares to fully diluted shares for equity value."},"related":["gl.equity-value","gl.eps"]},{"id":"gl.minority-interest","type":"glossaryTerm","level":3,"topic":"Accounting","tags":["Accounting","Valuation"],"difficulty":3,"source":{"flag":"VERIFIED"},"term":"minority interest","aliases":["intérêts minoritaires","non-controlling interest","NCI","minority-interest","participations ne donnant pas le contrôle"],"definition":{"fr":"Intérêts minoritaires : part des capitaux propres d'une filiale consolidée à 100% qui ne revient pas à la maison mère. On les ajoute à l'equity value pour reconstituer l'enterprise value, car l'EBITDA consolidé inclut 100% de la filiale.","en":"Minority (non-controlling) interest: the portion of a fully consolidated subsidiary's equity not owned by the parent. Added to equity value to build up enterprise value, since consolidated EBITDA includes 100% of the subsidiary."},"related":["gl.enterprise-value","gl.goodwill"]},{"id":"gl.dividend-recap","type":"glossaryTerm","level":4,"topic":"LBO","tags":["LBO","LevFin"],"difficulty":4,"source":{"flag":"VERIFIED"},"term":"dividend recap","aliases":["dividend recapitalization","recapitalisation par dividende","dividend-recap","recap","dividende exceptionnel par dette"],"definition":{"fr":"Recapitalisation par dividende : la société portefeuille lève de la dette supplémentaire pour verser un dividende exceptionnel au sponsor, qui récupère ainsi une partie de sa mise sans céder de parts. Améliore l'IRR mais accroît le levier et le risque.","en":"Dividend recapitalization: the portfolio company raises extra debt to pay a special dividend to the sponsor, returning part of its invested capital without selling. Boosts IRR but increases leverage and risk."},"related":["gl.lbo","gl.leverage","gl.irr"]},{"id":"gl.build-up","type":"glossaryTerm","level":3,"topic":"LBO","tags":["LBO","M&A"],"difficulty":3,"source":{"flag":"VERIFIED"},"term":"build-up","aliases":["buy-and-build","build up","build-up","buy and build","stratégie de croissance externe","roll-up","consolidation"],"definition":{"fr":"Stratégie de croissance externe : une plateforme acquiert plusieurs cibles plus petites (add-ons) pour grossir et se revendre à un multiple supérieur (arbitrage de multiple). Très répandue en mid-cap LBO européen.","en":"Buy-and-build: a platform company acquires several smaller targets (add-ons) to scale up and exit at a higher multiple (multiple arbitrage). Very common in European mid-cap LBOs."},"related":["gl.lbo","gl.multiple-expansion","gl.synergies"]},{"id":"gl.lbo","type":"glossaryTerm","level":2,"topic":"LBO","tags":["LBO"],"difficulty":2,"source":{"flag":"VERIFIED"},"term":"LBO","aliases":["leveraged buyout","rachat avec effet de levier","acquisition par effet de levier","buyout"],"definition":{"fr":"Leveraged Buy-Out : acquisition d'une société financée majoritairement par de la dette portée par la cible elle-même, l'equity du sponsor étant minoritaire. La valeur se crée par la croissance de l'EBITDA, le désendettement et l'expansion de multiple.","en":"Leveraged Buy-Out: acquisition of a company funded mostly by debt serviced by the target itself, with the sponsor's equity as the minority slice. Value is created through EBITDA growth, debt paydown and multiple expansion."},"related":["gl.sponsor","gl.leverage","gl.mom","gl.irr"]},{"id":"gl.secondary-buyout","type":"glossaryTerm","level":3,"topic":"LBO","tags":["LBO"],"difficulty":3,"source":{"flag":"VERIFIED"},"term":"secondary buyout","aliases":["SBO","secondary-buyout","LBO secondaire","rachat secondaire","sponsor-to-sponsor"],"definition":{"fr":"LBO secondaire : un sponsor revend la société portefeuille à un autre fonds de private equity. Voie de sortie très courante en Europe ; on parle de tertiary buyout au tour suivant.","en":"Secondary buyout: a sponsor sells the portfolio company to another private equity fund. A very common exit route in Europe; the next round is a tertiary buyout."},"related":["gl.lbo","gl.sponsor"]},{"id":"gl.gp","type":"glossaryTerm","level":2,"topic":"LBO","tags":["LBO","Fit"],"difficulty":2,"source":{"flag":"VERIFIED"},"term":"GP","aliases":["general partner","société de gestion","gérant","management company"],"definition":{"fr":"General Partner : la société de gestion qui gère le fonds, sélectionne les deals et perçoit les management fees (~2%) et le carried interest. Engage aussi son propre capital (GP commitment) aux côtés des LPs.","en":"General Partner: the management firm that runs the fund, sources deals and earns management fees (~2%) and carried interest. It also invests its own capital (GP commitment) alongside the LPs."},"related":["gl.lp","gl.carried-interest","gl.dry-powder"]},{"id":"gl.lp","type":"glossaryTerm","level":2,"topic":"LBO","tags":["LBO","Fit"],"difficulty":2,"source":{"flag":"VERIFIED"},"term":"LP","aliases":["limited partner","investisseur du fonds","souscripteur","limited partners"],"definition":{"fr":"Limited Partner : investisseur qui souscrit au fonds (assureurs, fonds de pension, fonds souverains, family offices) sans participer à la gestion, à responsabilité limitée à son engagement. Touche les distributions après le carried du GP.","en":"Limited Partner: an investor that commits capital to the fund (insurers, pension funds, sovereign funds, family offices) without managing it, with liability capped at its commitment. Receives distributions after the GP's carry."},"related":["gl.gp","gl.carried-interest","gl.dry-powder"]},{"id":"gl.carried-interest","type":"glossaryTerm","level":3,"topic":"LBO","tags":["LBO","Fit"],"difficulty":3,"source":{"flag":"VERIFIED"},"term":"carried interest","aliases":["carry","carried-interest","intéressement aux plus-values","intérêt différé"],"definition":{"fr":"Part des plus-values du fonds revenant au GP (typiquement 20%), au-delà d'un rendement préférentiel (hurdle ~8%) versé d'abord aux LPs. Aligne les intérêts de l'équipe de gestion avec ceux des investisseurs.","en":"The share of the fund's profits paid to the GP (typically 20%), above a preferred return (hurdle ~8%) paid first to LPs. It aligns the management team with investors."},"related":["gl.gp","gl.lp","gl.management-package"]},{"id":"gl.management-package","type":"glossaryTerm","level":4,"topic":"LBO","tags":["LBO","Fit"],"difficulty":4,"source":{"flag":"VERIFIED"},"term":"management package","aliases":["management-package","package management","intéressement des dirigeants","MIP","management incentive plan","sweet equity"],"definition":{"fr":"Dispositif d'intéressement des dirigeants de la société sous LBO : co-investissement et instruments (sweet equity, actions de préférence, ratchet) leur offrant un rendement surproportionné si le deal réussit. Élément clé de l'alignement sponsor/management.","en":"The incentive scheme for managers of an LBO company: co-investment and instruments (sweet equity, preferred shares, ratchet) giving them outsized returns if the deal succeeds. A key sponsor/management alignment tool."},"related":["gl.carried-interest","gl.sponsor","gl.lbo"]},{"id":"gl.earn-out","type":"glossaryTerm","level":3,"topic":"M&A","tags":["M&A"],"difficulty":3,"source":{"flag":"VERIFIED"},"term":"earn-out","aliases":["earnout","earn out","earn-out","complément de prix","clause d'earn-out","paiement différé conditionnel"],"definition":{"fr":"Complément de prix conditionnel : une partie du prix d'acquisition est versée plus tard si la cible atteint des objectifs (CA, EBITDA). Permet de combler un écart de valorisation entre acheteur et vendeur tout en partageant le risque.","en":"Earn-out: part of the purchase price is paid later if the target hits agreed targets (revenue, EBITDA). Bridges a valuation gap between buyer and seller while sharing risk."},"related":["gl.spa","gl.due-diligence"]},{"id":"gl.opa","type":"glossaryTerm","level":3,"topic":"M&A","tags":["M&A","ECM"],"difficulty":3,"source":{"flag":"VERIFIED"},"term":"OPA","aliases":["offre publique d'achat","tender offer","takeover bid","OPE","offre publique d'échange","public takeover"],"definition":{"fr":"Offre Publique d'Achat : offre adressée aux actionnaires d'une société cotée pour racheter leurs titres en cash (OPA) ou en titres (OPE), généralement avec une prime sur le cours. En France, encadrée par l'AMF.","en":"A public tender offer to a listed company's shareholders to buy their shares in cash (OPA) or in stock (OPE), usually at a premium to the market price. In France it is regulated by the AMF."},"related":["gl.take-private","gl.greenshoe","gl.bookrunner"]},{"id":"gl.synergies","type":"glossaryTerm","level":2,"topic":"M&A","tags":["M&A"],"difficulty":2,"source":{"flag":"VERIFIED"},"term":"synergies","aliases":["synergies","synergie","cost synergies","revenue synergies","synergies de coûts","synergies de revenus"],"definition":{"fr":"Gains de valeur attendus d'un rapprochement : synergies de coûts (économies d'échelle, suppression de doublons) et de revenus (cross-selling, accès marché). Souvent surestimées ; les synergies de coûts sont jugées plus crédibles que celles de revenus.","en":"Value gains expected from a combination: cost synergies (scale, removing overlaps) and revenue synergies (cross-selling, market access). Often overestimated; cost synergies are seen as more credible than revenue synergies."},"related":["gl.accretion-dilution","gl.goodwill","gl.build-up"]},{"id":"gl.due-diligence","type":"glossaryTerm","level":2,"topic":"M&A","tags":["M&A"],"difficulty":2,"source":{"flag":"VERIFIED"},"term":"due diligence","aliases":["due diligence","DD","audit d'acquisition","diligences","due-diligence","VDD","vendor due diligence"],"definition":{"fr":"Diligences : audit approfondi de la cible (financier, juridique, fiscal, commercial, ESG) mené avant l'acquisition pour valider la thèse d'investissement et identifier les risques. La VDD (vendor DD) est commandée par le vendeur en amont.","en":"Due diligence: a thorough audit of the target (financial, legal, tax, commercial, ESG) run before acquisition to validate the investment thesis and surface risks. Vendor due diligence (VDD) is commissioned upfront by the seller."},"related":["gl.dataroom","gl.spa","gl.information-memorandum"]},{"id":"gl.spa","type":"glossaryTerm","level":3,"topic":"M&A","tags":["M&A"],"difficulty":3,"source":{"flag":"VERIFIED"},"term":"SPA","aliases":["share purchase agreement","contrat de cession","protocole de cession","sale and purchase agreement","contrat d'acquisition"],"definition":{"fr":"Share Purchase Agreement : le contrat de cession qui formalise l'acquisition. Il fixe le prix (souvent via un mécanisme locked-box ou completion accounts), les déclarations et garanties (reps & warranties), les conditions suspensives et l'earn-out éventuel.","en":"Share Purchase Agreement: the contract that formalizes the acquisition. It sets the price (often via a locked-box or completion accounts mechanism), reps & warranties, conditions precedent and any earn-out."},"related":["gl.earn-out","gl.due-diligence","gl.nbo"]},{"id":"gl.teaser","type":"glossaryTerm","level":2,"topic":"M&A","tags":["M&A"],"difficulty":2,"source":{"flag":"VERIFIED"},"term":"teaser","aliases":["teaser","blind teaser","profil anonyme","document de présentation anonyme"],"definition":{"fr":"Document de présentation anonymisé d'une cible, envoyé par la banque conseil aux acheteurs potentiels en début de process pour susciter l'intérêt sans révéler l'identité de la société.","en":"A short anonymized one-pager on a target, sent by the sell-side adviser to potential buyers at the start of a process to spark interest without disclosing the company's identity."},"related":["gl.information-memorandum","gl.nbo","gl.nda"]},{"id":"gl.information-memorandum","type":"glossaryTerm","level":2,"topic":"M&A","tags":["M&A"],"difficulty":2,"source":{"flag":"VERIFIED"},"term":"information memorandum","aliases":["IM","CIM","confidential information memorandum","mémorandum d'information","information-memorandum","info memo"],"definition":{"fr":"Mémorandum d'information confidentiel : document détaillé sur la cible (activité, marché, financials, business plan) remis aux acheteurs ayant signé un NDA, après le teaser. Base de la première offre indicative.","en":"Confidential Information Memorandum: a detailed document on the target (business, market, financials, business plan) shared with buyers after they sign an NDA, following the teaser. Basis for the first indicative offer."},"related":["gl.teaser","gl.nbo","gl.due-diligence"]},{"id":"gl.nbo","type":"glossaryTerm","level":3,"topic":"M&A","tags":["M&A"],"difficulty":3,"source":{"flag":"VERIFIED"},"term":"NBO","aliases":["non-binding offer","offre indicative","lettre d'intention","LOI","letter of intent","IOI","indicative offer","binding offer","offre ferme"],"definition":{"fr":"Non-Binding Offer : offre indicative non engageante soumise après lecture de l'IM, fixant une fourchette de prix et les conditions. Les meilleurs candidats passent ensuite en phase 2 (due diligence) puis remettent une binding offer (offre ferme).","en":"Non-Binding Offer: an indicative, non-committal offer submitted after reading the IM, setting a price range and conditions. The best bidders then advance to phase 2 (due diligence) and submit a binding offer."},"related":["gl.information-memorandum","gl.spa","gl.due-diligence"]},{"id":"gl.cash-sweep","type":"glossaryTerm","level":3,"topic":"LevFin","tags":["LevFin","LBO"],"difficulty":3,"source":{"flag":"VERIFIED"},"term":"cash sweep","aliases":["cash-sweep","cash sweep","balayage de trésorerie","excess cash flow sweep","ECF sweep","remboursement anticipé obligatoire"],"definition":{"fr":"Mécanisme par lequel une part du cash flow excédentaire de la société sous LBO sert obligatoirement à rembourser la dette par anticipation. Accélère le désendettement et renforce la création de valeur pour l'equity.","en":"Cash sweep: a mechanism whereby a share of the LBO company's excess cash flow must be used to prepay debt. It speeds up deleveraging and boosts equity value creation."},"related":["gl.paydown","gl.covenant","gl.circularity"]},{"id":"gl.circularity","type":"glossaryTerm","level":4,"topic":"Excel","tags":["Excel","LBO"],"difficulty":4,"source":{"flag":"VERIFIED"},"term":"circularity","aliases":["circular reference","référence circulaire","circularité","circularity","boucle de calcul"],"definition":{"fr":"Référence circulaire dans un modèle : les intérêts dépendent de la dette moyenne, qui dépend du cash flow, qui dépend des intérêts. On la résout en activant le calcul itératif d'Excel ou via un interrupteur de circularité (circuit breaker).","en":"A circular reference in a model: interest depends on average debt, which depends on cash flow, which depends on interest. Resolved by enabling Excel's iterative calculation or using a circularity switch (circuit breaker)."},"related":["gl.cash-sweep","gl.lbo"]},{"id":"gl.nol","type":"glossaryTerm","level":3,"topic":"Accounting","tags":["Accounting","M&A"],"difficulty":3,"source":{"flag":"VERIFIED"},"term":"NOL","aliases":["net operating loss","déficit reportable","carry-forward","report déficitaire","tax loss carryforward","déficits fiscaux"],"definition":{"fr":"Net Operating Loss : déficit fiscal reportable qui réduit l'impôt futur en s'imputant sur les bénéfices à venir. Actif d'impôt différé pris en compte en valorisation et en M&A (avec des limites en cas de changement de contrôle).","en":"Net Operating Loss: a tax loss carryforward that reduces future tax by offsetting upcoming profits. A deferred tax asset considered in valuation and M&A (subject to limits on a change of control)."},"related":["gl.goodwill","gl.due-diligence"]},{"id":"gl.run-rate","type":"glossaryTerm","level":2,"topic":"Accounting","tags":["Accounting","Valuation"],"difficulty":2,"source":{"flag":"VERIFIED"},"term":"run-rate","aliases":["run rate","run-rate","annualisé","annualisation","annualized","rythme annualisé","RR EBITDA"],"definition":{"fr":"Annualisation d'une performance récente comme si elle se maintenait sur 12 mois (ex. EBITDA run-rate = dernier trimestre × 4). Utilisé pour refléter une base normalisée ou pro forma incluant des acquisitions et synergies déjà engagées.","en":"Run-rate: annualizing a recent performance as if it persisted for 12 months (e.g. run-rate EBITDA = last quarter × 4). Used to reflect a normalized or pro forma base including committed acquisitions and synergies."},"related":["gl.ebitda","gl.synergies"]},{"id":"gl.multiple-expansion","type":"glossaryTerm","level":3,"topic":"LBO","tags":["LBO","Valuation"],"difficulty":3,"source":{"flag":"VERIFIED"},"term":"multiple expansion","aliases":["multiple-expansion","expansion de multiple","multiple arbitrage","arbitrage de multiple","multiple uplift","re-rating"],"definition":{"fr":"Création de valeur en revendant la société à un multiple supérieur au multiple d'achat (ex. acheter à 8x, vendre à 10x EV/EBITDA). Levier le plus incertain car dépendant du marché ; les fonds prudents ne le supposent pas dans leur base case.","en":"Value creation from selling the company at a higher multiple than at purchase (e.g. buy at 8x, sell at 10x EV/EBITDA). The least controllable lever as it is market-driven; prudent funds assume none in the base case."},"related":["gl.multiple","gl.lbo","gl.build-up"]},{"id":"gl.take-private","type":"glossaryTerm","level":4,"topic":"M&A","tags":["M&A","LBO"],"difficulty":4,"source":{"flag":"VERIFIED"},"term":"take-private","aliases":["take private","take-private","P2P","public-to-private","retrait de la cote","delisting","sortie de bourse"],"definition":{"fr":"Public-to-Private : un sponsor rachète une société cotée via une OPA pour la retirer de la cote et la gérer en LBO loin des contraintes du marché. Nécessite souvent une prime de 20–40% sur le cours.","en":"Public-to-private: a sponsor buys a listed company via a tender offer to delist it and run it as an LBO away from public market constraints. Usually requires a 20–40% premium to the share price."},"related":["gl.opa","gl.lbo","gl.sponsor"]},{"id":"gl.dip-financing","type":"glossaryTerm","level":4,"topic":"Restructuring","tags":["Restructuring","LevFin"],"difficulty":4,"source":{"flag":"VERIFIED"},"term":"DIP financing","aliases":["debtor-in-possession financing","dip-financing","DIP","financement DIP","financement du débiteur en possession","new money"],"definition":{"fr":"Debtor-In-Possession financing : nouveau financement accordé à une entreprise en procédure (Chapter 11 aux US, équivalents en sauvegarde/redressement en France) avec un rang super-prioritaire, lui permettant de poursuivre son activité pendant la restructuration.","en":"Debtor-In-Possession financing: new money lent to a company in bankruptcy (Chapter 11 in the US, safeguard/redressement equivalents in France) with super-priority status, letting it keep operating during restructuring."},"related":["gl.senior-debt","gl.covenant"]},{"id":"gl.bookrunner","type":"glossaryTerm","level":3,"topic":"ECM","tags":["ECM","DCM"],"difficulty":3,"source":{"flag":"VERIFIED"},"term":"bookrunner","aliases":["bookrunner","book runner","chef de file","teneur de livre","lead manager","joint bookrunner","syndicate"],"definition":{"fr":"Banque chef de file qui dirige le placement d'une émission (IPO, obligation, syndication de dette) : elle constitue le livre d'ordres (book), fixe le prix et alloue les titres. Plusieurs joint bookrunners se partagent souvent un mandat.","en":"Lead bank that runs the placement of an issue (IPO, bond, loan syndication): it builds the order book, sets the price and allocates the securities. Mandates often have several joint bookrunners."},"related":["gl.greenshoe","gl.term-loan-b","gl.bridge"]},{"id":"gl.greenshoe","type":"glossaryTerm","level":4,"topic":"ECM","tags":["ECM"],"difficulty":4,"source":{"flag":"VERIFIED"},"term":"greenshoe","aliases":["greenshoe","green shoe","over-allotment option","option de surallocation","clause de rallonge"],"definition":{"fr":"Option de surallocation lors d'une IPO permettant aux bookrunners de placer jusqu'à ~15% de titres supplémentaires. Utilisée pour stabiliser le cours post-IPO et répondre à une forte demande.","en":"Over-allotment option in an IPO letting bookrunners place up to ~15% extra shares. Used to stabilize the post-IPO price and meet strong demand."},"related":["gl.bookrunner","gl.opa"]},{"id":"gl.cap-table","type":"glossaryTerm","level":2,"topic":"VC","tags":["VC","LBO"],"difficulty":2,"source":{"flag":"VERIFIED"},"term":"cap table","aliases":["cap-table","capitalization table","table de capitalisation","tableau de capitalisation","captable"],"definition":{"fr":"Table de capitalisation : récapitulatif de l'actionnariat d'une société — qui détient quoi (actions ordinaires, préférentielles, options, BSPCE) et selon quel pourcentage, pleinement dilué. Outil clé en VC et pour le management package en LBO.","en":"Capitalization table: a breakdown of a company's ownership — who holds what (common, preferred, options, warrants) and at what fully diluted percentage. A key tool in VC and for the LBO management package."},"related":["gl.liquidation-preference","gl.management-package","gl.treasury-stock-method"]},{"id":"gl.dry-powder","type":"glossaryTerm","level":2,"topic":"LBO","tags":["LBO"],"difficulty":2,"source":{"flag":"VERIFIED"},"term":"dry powder","aliases":["dry-powder","dry powder","capital non investi","poudre sèche","uncalled capital","capital disponible"],"definition":{"fr":"Capital levé mais non encore investi par un fonds, disponible pour de nouveaux deals (uncalled commitments). Un niveau élevé de dry powder dans l'industrie pousse les prix d'acquisition à la hausse.","en":"Capital raised but not yet invested by a fund, available for new deals (uncalled commitments). High industry-wide dry powder pushes acquisition prices up."},"related":["gl.gp","gl.lp","gl.sponsor"]},{"id":"gl.liquidation-preference","type":"glossaryTerm","level":4,"topic":"VC","tags":["VC"],"difficulty":4,"source":{"flag":"VERIFIED"},"term":"liquidation preference","aliases":["liquidation-preference","liq pref","préférence de liquidation","preference de liquidation","1x preference","participating preferred"],"definition":{"fr":"Préférence de liquidation : droit des actionnaires préférentiels (VC) d'être remboursés avant les ordinaires en cas de vente ou liquidation, souvent à 1x leur investissement. Une clause participating leur permet en plus de partager le reliquat.","en":"Liquidation preference: the right of preferred (VC) shareholders to be repaid before common holders on a sale or liquidation, often at 1x their investment. A participating preference also lets them share the remaining proceeds."},"related":["gl.cap-table","gl.equity"]},{"id":"gl.net-debt","type":"glossaryTerm","level":1,"topic":"Valuation","tags":["Valuation","LevFin"],"difficulty":1,"source":{"flag":"VERIFIED"},"term":"net debt","aliases":["dette nette","net-debt","endettement net","DN"],"definition":{"fr":"Dette nette : dette financière brute − trésorerie et équivalents. Pont entre enterprise value et equity value (equity value = EV − dette nette) et base du levier (dette nette / EBITDA).","en":"Net debt: gross financial debt − cash and equivalents. The bridge between enterprise value and equity value (equity value = EV − net debt) and the basis for leverage (net debt / EBITDA)."},"related":["gl.enterprise-value","gl.equity-value","gl.leverage"]},{"id":"gl.dataroom","type":"glossaryTerm","level":2,"topic":"M&A","tags":["M&A"],"difficulty":2,"source":{"flag":"VERIFIED"},"term":"dataroom","aliases":["data room","dataroom","VDR","virtual data room","salle de données virtuelle"],"definition":{"fr":"Salle de données virtuelle sécurisée où le vendeur met à disposition les documents de la cible (contrats, financials, juridique) pour la due diligence des acheteurs, avec un suivi des accès.","en":"A secure virtual data room where the seller hosts the target's documents (contracts, financials, legal) for buyers' due diligence, with access tracking."},"related":["gl.due-diligence","gl.information-memorandum"]},{"id":"gl.nda","type":"glossaryTerm","level":1,"topic":"M&A","tags":["M&A"],"difficulty":1,"source":{"flag":"VERIFIED"},"term":"NDA","aliases":["non-disclosure agreement","accord de confidentialité","NDA","confidentiality agreement","engagement de confidentialité"],"definition":{"fr":"Accord de confidentialité signé par un acheteur potentiel avant de recevoir l'information memorandum et d'accéder à la dataroom. Il encadre l'usage des informations sensibles de la cible.","en":"Non-Disclosure Agreement signed by a prospective buyer before receiving the information memorandum and accessing the dataroom. It governs the use of the target's sensitive information."},"related":["gl.teaser","gl.information-memorandum","gl.dataroom"]},{"id":"gl.income-statement","type":"glossaryTerm","level":1,"topic":"Accounting","tags":["Accounting"],"difficulty":1,"source":{"flag":"VERIFIED"},"term":"income statement","aliases":["P&L","compte de résultat","profit and loss"],"definition":{"fr":"État qui mesure la performance sur une période : du chiffre d'affaires au résultat net, en passant par l'EBITDA et l'EBIT.","en":"Statement measuring performance over a period: from revenue down to net income, via EBITDA and EBIT."},"related":["gl.ebitda","gl.ebit"]},{"id":"gl.balance-sheet","type":"glossaryTerm","level":1,"topic":"Accounting","tags":["Accounting"],"difficulty":1,"source":{"flag":"VERIFIED"},"term":"balance sheet","aliases":["bilan"],"definition":{"fr":"Photographie du patrimoine à un instant donné : actif = passif (capitaux propres + dettes).","en":"Snapshot of the firm at a point in time: assets = liabilities + equity."},"related":["gl.working-capital","gl.goodwill"]},{"id":"gl.cash-flow-statement","type":"glossaryTerm","level":1,"topic":"Accounting","tags":["Accounting"],"difficulty":1,"source":{"flag":"VERIFIED"},"term":"cash flow statement","aliases":["tableau de flux de trésorerie","operating cash flow","flux de trésorerie"],"definition":{"fr":"État reliant le résultat à la variation de trésorerie : flux d'exploitation, d'investissement et de financement.","en":"Statement linking earnings to the change in cash: operating, investing and financing flows."},"related":["gl.fcff","gl.capex"]},{"id":"gl.capex","type":"glossaryTerm","level":1,"topic":"Accounting","tags":["Accounting"],"difficulty":1,"source":{"flag":"VERIFIED"},"term":"capex","aliases":["capital expenditures","investissements","dépenses d'investissement"],"definition":{"fr":"Dépenses d'investissement en actifs durables (machines, immobilier). Sortent de la trésorerie d'investissement, pas du compte de résultat (sauf via l'amortissement).","en":"Capital expenditures on long-lived assets. They hit investing cash flow, not the P&L directly (only via depreciation)."},"related":["gl.fcff"]},{"id":"gl.cogs","type":"glossaryTerm","level":1,"topic":"Accounting","tags":["Accounting"],"difficulty":1,"source":{"flag":"VERIFIED"},"term":"COGS","aliases":["cost of goods sold","coût des ventes","coût des achats"],"definition":{"fr":"Coût des ventes : coûts directement liés à la production des biens/services vendus. Chiffre d'affaires − COGS = marge brute.","en":"Cost of goods sold: costs directly tied to producing what was sold. Revenue − COGS = gross profit."},"related":["gl.income-statement"]},{"id":"gl.dna","type":"glossaryTerm","level":1,"topic":"Accounting","tags":["Accounting"],"difficulty":1,"source":{"flag":"VERIFIED"},"term":"D&A","aliases":["depreciation and amortization","dotations aux amortissements","amortissements","depreciation"],"definition":{"fr":"Dotations aux amortissements et dépréciations : charge non décaissée étalant le coût des actifs. EBITDA − D&A = EBIT.","en":"Depreciation & amortization: a non-cash charge spreading asset cost. EBITDA − D&A = EBIT."},"related":["gl.ebitda","gl.ebit"]},{"id":"gl.net-income","type":"glossaryTerm","level":1,"topic":"Accounting","tags":["Accounting"],"difficulty":1,"source":{"flag":"VERIFIED"},"term":"net income","aliases":["résultat net","bottom line","earnings"],"definition":{"fr":"Résultat net : dernière ligne du compte de résultat, après intérêts et impôts. Base du BPA (EPS).","en":"Net income: the bottom line, after interest and tax. The basis for EPS."},"related":["gl.eps"]},{"id":"gl.gross-margin","type":"glossaryTerm","level":1,"topic":"Accounting","tags":["Accounting"],"difficulty":1,"source":{"flag":"VERIFIED"},"term":"gross margin","aliases":["marge brute","gross profit","bénéfice brut"],"definition":{"fr":"Marge brute = (chiffre d'affaires − COGS) / chiffre d'affaires. Mesure la rentabilité du cœur de production avant charges d'exploitation.","en":"Gross margin = (revenue − COGS) / revenue. Profitability of the core product before operating expenses."},"related":["gl.cogs"]},{"id":"gl.revenue","type":"glossaryTerm","level":1,"topic":"Accounting","tags":["Accounting"],"difficulty":1,"source":{"flag":"VERIFIED"},"term":"revenue","aliases":["chiffre d'affaires","sales","top line","CA"],"definition":{"fr":"Chiffre d'affaires : ventes de biens/services sur la période (hors taxes). Première ligne du compte de résultat.","en":"Revenue: sales of goods/services over the period (ex-VAT). The top line of the income statement."},"related":["gl.income-statement"]},{"id":"gl.sell-side","type":"glossaryTerm","level":1,"topic":"M&A","tags":["M&A"],"difficulty":1,"source":{"flag":"VERIFIED"},"term":"sell-side","aliases":["sell side","côté vendeur"],"definition":{"fr":"Conseil du vendeur dans une transaction (mandat de cession). Pilote le process, le teaser, l'IM, la dataroom et l'enchère.","en":"Advising the seller in a deal. Runs the process, the teaser, the IM, the dataroom and the auction."},"related":["gl.buy-side","gl.teaser"]},{"id":"gl.buy-side","type":"glossaryTerm","level":1,"topic":"M&A","tags":["M&A","LBO"],"difficulty":1,"source":{"flag":"VERIFIED"},"term":"buy-side","aliases":["buy side","côté acheteur"],"definition":{"fr":"Conseil de l'acheteur (ou l'investisseur lui-même, ex. un fonds de PE). Évalue la cible, structure l'offre et négocie.","en":"Advising the buyer (or the investor itself, e.g. a PE fund). Values the target, structures the bid and negotiates."},"related":["gl.sell-side","gl.sponsor"]},{"id":"gl.private-equity","type":"glossaryTerm","level":1,"topic":"LBO","tags":["LBO"],"difficulty":1,"source":{"flag":"VERIFIED"},"term":"private equity","aliases":["PE","capital-investissement"],"definition":{"fr":"Investissement en fonds propres dans des sociétés non cotées, via des fonds levés auprès de LPs, avec un horizon de 3–7 ans et création de valeur opérationnelle + effet de levier.","en":"Equity investment in private companies, via funds raised from LPs, over a 3–7 year horizon, creating value operationally plus leverage."},"related":["gl.lbo","gl.gp","gl.lp"]},{"id":"gl.investment-banking","type":"glossaryTerm","level":1,"topic":"M&A","tags":["M&A","ECM","DCM"],"difficulty":1,"source":{"flag":"VERIFIED"},"term":"investment banking","aliases":["IB","banque d'investissement","banque d'affaires"],"definition":{"fr":"Conseil et intermédiation financière : M&A, levées de fonds (ECM/DCM), restructuring. Rémunéré principalement en commissions (fees).","en":"Financial advisory and intermediation: M&A, capital raising (ECM/DCM), restructuring. Paid mostly in fees."},"related":["gl.ecm","gl.dcm"]},{"id":"gl.investment-thesis","type":"glossaryTerm","level":2,"topic":"LBO","tags":["LBO","Fit"],"difficulty":2,"source":{"flag":"VERIFIED"},"term":"investment thesis","aliases":["thèse d'investissement","equity story"],"definition":{"fr":"Raisonnement justifiant un investissement : pourquoi cette cible, à ce prix, crée de la valeur — leviers, risques, plan de sortie.","en":"The reasoning behind an investment: why this target, at this price, creates value — levers, risks, exit plan."},"related":["gl.sponsor"]},{"id":"gl.holding-period","type":"glossaryTerm","level":1,"topic":"LBO","tags":["LBO"],"difficulty":1,"source":{"flag":"VERIFIED"},"term":"holding period","aliases":["durée de détention","horizon de détention","hold"],"definition":{"fr":"Durée pendant laquelle un fonds détient une participation, typiquement 3–7 ans. Plus elle est courte à MoM égal, plus l'IRR est élevé.","en":"How long a fund holds an investment, typically 3–7 years. Shorter holds raise IRR for a given MoM."},"related":["gl.irr","gl.mom"]},{"id":"gl.shareholder","type":"glossaryTerm","level":1,"topic":"Accounting","tags":["Accounting"],"difficulty":1,"source":{"flag":"VERIFIED"},"term":"shareholder","aliases":["actionnaire","equity holder"],"definition":{"fr":"Détenteur de fonds propres : rémunéré par dividendes et plus-value, après les créanciers (rang junior, risque supérieur).","en":"Equity holder: paid via dividends and capital gains, after creditors (junior rank, higher risk)."},"related":["gl.creditor","gl.equity"]},{"id":"gl.creditor","type":"glossaryTerm","level":1,"topic":"LevFin","tags":["LevFin"],"difficulty":1,"source":{"flag":"VERIFIED"},"term":"creditor","aliases":["créancier","lender","prêteur","debt holder"],"definition":{"fr":"Détenteur de dette : rémunéré par les intérêts, remboursé avant les actionnaires (rang senior, risque moindre).","en":"Debt holder: paid via interest, repaid before shareholders (senior rank, lower risk)."},"related":["gl.shareholder","gl.senior-debt"]},{"id":"gl.nopat","type":"glossaryTerm","level":2,"topic":"Valuation","tags":["Valuation","DCF"],"difficulty":2,"source":{"flag":"VERIFIED"},"term":"NOPAT","aliases":["nopat","net operating profit after tax","résultat opérationnel après impôt","resultat operationnel apres impot","EBIT après impôt","EBIT apres impot"],"definition":{"fr":"Net Operating Profit After Tax : résultat d'exploitation (EBIT) diminué de l'impôt théorique, soit EBIT × (1 − taux d'impôt). C'est le profit opérationnel qu'on obtiendrait sans aucune dette, base du free cash flow non endetté.","en":"Net Operating Profit After Tax: EBIT minus a notional tax charge, i.e. EBIT × (1 − tax rate). It is the unlevered operating profit and the starting point for unlevered free cash flow."},"related":["gl.capital-structure"]},{"id":"gl.operating-lease-finance-lease","type":"glossaryTerm","level":2,"topic":"Accounting","tags":["Accounting"],"difficulty":2,"source":{"flag":"VERIFIED"},"term":"operating lease / finance lease","aliases":["operating lease","finance lease","capital lease","leases","lease","contrats de location","contrat de location","location-financement","location financement","crédit-bail","credit-bail","location simple"],"definition":{"fr":"Un finance lease (location-financement / crédit-bail) transfère l'essentiel des risques et avantages de propriété et est capitalisé au bilan ; un operating lease (location simple) était historiquement hors bilan. Sous IFRS 16, presque tous les contrats sont au bilan côté preneur (droit d'usage + dette de loyer).","en":"A finance lease transfers substantially all the risks and rewards of ownership and is capitalised on the balance sheet; an operating lease was historically off-balance-sheet. Under IFRS 16 nearly all leases sit on the lessee's balance sheet (right-of-use asset plus lease liability)."},"related":[]},{"id":"gl.preferred-stock","type":"glossaryTerm","level":2,"topic":"VC","tags":["VC","Accounting"],"difficulty":2,"source":{"flag":"VERIFIED"},"term":"preferred stock","aliases":["preferred stock","preferred shares","preferred","actions de préférence","actions de preference","action de préférence","actions privilégiées","actions privilegiees"],"definition":{"fr":"Catégorie d'actions assortie de droits prioritaires sur les ordinaires : dividende préférentiel, priorité de liquidation, parfois droits de vote ou conversion renforcés. Très utilisée en venture capital et private equity pour protéger l'investisseur.","en":"A class of shares carrying rights senior to common stock: preferential dividend, liquidation preference, and sometimes enhanced voting or conversion rights. Heavily used in venture capital and private equity to protect the investor."},"related":["gl.absolute-priority-rule"]},{"id":"gl.fully-diluted-shares","type":"glossaryTerm","level":2,"topic":"Valuation","tags":["Valuation","M&A"],"difficulty":2,"source":{"flag":"VERIFIED"},"term":"fully diluted shares","aliases":["fully diluted shares","fully diluted share count","fully diluted","diluted shares","actions pleinement diluées","actions pleinement diluees","nombre d'actions dilué","nombre dactions dilue","actions diluées"],"definition":{"fr":"Nombre total d'actions en circulation en intégrant tous les instruments dilutifs dans la monnaie (options, warrants, convertibles, RSU), généralement via la treasury stock method. Sert au calcul de l'equity value par action.","en":"Total share count including all in-the-money dilutive instruments (options, warrants, convertibles, RSUs), typically via the treasury stock method. Used to compute equity value per share."},"related":["gl.treasury-stock","gl.in-the-money","gl.control-premium"]},{"id":"gl.treasury-stock","type":"glossaryTerm","level":2,"topic":"Accounting","tags":["Accounting","Valuation"],"difficulty":2,"source":{"flag":"VERIFIED"},"term":"treasury stock","aliases":["treasury stock","treasury shares","treasury stock method","actions auto-détenues","actions auto-detenues","auto-détention","auto-detention","actions propres","actions autodétenues"],"definition":{"fr":"Actions rachetées par l'émetteur et détenues par lui-même ; elles ne portent ni droit de vote ni dividende et viennent en déduction des capitaux propres. La treasury stock method estime la dilution nette des options en supposant que le produit d'exercice rachète des actions au cours de marché.","en":"Shares repurchased and held by the issuing company; they carry no voting or dividend rights and reduce equity. The treasury stock method estimates net option dilution by assuming exercise proceeds buy back shares at the market price."},"related":["gl.fully-diluted-shares"]},{"id":"gl.in-the-money","type":"glossaryTerm","level":1,"topic":"Markets","tags":["Markets","Valuation"],"difficulty":1,"source":{"flag":"VERIFIED"},"term":"in the money","aliases":["in the money","in-the-money","ITM","dans la monnaie","en dedans"],"definition":{"fr":"Se dit d'une option (ou d'un instrument dilutif) dont l'exercice est avantageux : prix d'exercice inférieur au cours pour un call, supérieur pour un put. Seuls les instruments dans la monnaie sont retenus dans le nombre d'actions dilué.","en":"Describes an option (or dilutive instrument) whose exercise is profitable: strike below the share price for a call, above it for a put. Only in-the-money instruments are counted in the fully diluted share count."},"related":["gl.fully-diluted-shares"]},{"id":"gl.capital-structure","type":"glossaryTerm","level":1,"topic":"LevFin","tags":["LevFin","LBO"],"difficulty":1,"source":{"flag":"VERIFIED"},"term":"capital structure","aliases":["capital structure","cap structure","structure de capital","structure du capital","structure financière","structure financiere","capitalisation"],"definition":{"fr":"Combinaison de dette et de capitaux propres (et d'instruments hybrides) finançant une entreprise, ordonnée par séniorité. Elle détermine le coût du capital, le risque et l'ordre de remboursement en cas de défaut.","en":"The mix of debt and equity (and hybrid instruments) financing a company, ranked by seniority. It drives the cost of capital, risk profile, and the order of repayment in a default."},"related":["gl.waterfall","gl.fulcrum-security","gl.absolute-priority-rule"]},{"id":"gl.sauvegarde","type":"glossaryTerm","level":2,"topic":"Restructuring","tags":["Restructuring"],"difficulty":2,"source":{"flag":"VERIFIED"},"term":"sauvegarde","aliases":["sauvegarde","procédure de sauvegarde","procedure de sauvegarde","safeguard","sauvegarde accélérée","sauvegarde acceleree"],"definition":{"fr":"Procédure collective préventive de droit français ouverte à la demande d'un débiteur non encore en cessation des paiements, qui suspend les poursuites et permet l'adoption d'un plan de sauvegarde. Le dirigeant conserve la gestion de l'entreprise.","en":"A French preventive insolvency procedure opened at the request of a debtor not yet insolvent (cessation des paiements); it stays creditor actions and allows a safeguard plan. Management stays in control of the business."},"related":["gl.redressement-judiciaire","gl.automatic-stay"]},{"id":"gl.redressement-judiciaire","type":"glossaryTerm","level":2,"topic":"Restructuring","tags":["Restructuring"],"difficulty":2,"source":{"flag":"VERIFIED"},"term":"redressement judiciaire","aliases":["redressement judiciaire","redressement","judicial reorganisation","judicial reorganization"],"definition":{"fr":"Procédure collective française ouverte lorsqu'une entreprise est en cessation des paiements mais que son redressement reste possible. Elle vise la poursuite de l'activité, le maintien de l'emploi et l'apurement du passif via un plan de continuation ou de cession.","en":"A French insolvency procedure opened when a company is in payment default (cessation des paiements) but recovery is still possible. It aims to continue the business, preserve jobs, and clear liabilities through a continuation or disposal plan."},"related":["gl.sauvegarde","gl.liquidation-judiciaire","gl.plan-de-cession"]},{"id":"gl.liquidation-judiciaire","type":"glossaryTerm","level":2,"topic":"Restructuring","tags":["Restructuring"],"difficulty":2,"source":{"flag":"VERIFIED"},"term":"liquidation judiciaire","aliases":["liquidation judiciaire","liquidation","compulsory liquidation","judicial liquidation"],"definition":{"fr":"Procédure collective française ouverte lorsqu'une entreprise est en cessation des paiements et que son redressement est manifestement impossible. L'activité cesse (sauf cession) et les actifs sont réalisés pour désintéresser les créanciers selon leur rang.","en":"A French insolvency procedure opened when a company is insolvent and recovery is clearly impossible. The business stops (unless sold) and assets are realised to repay creditors according to their ranking."},"related":["gl.redressement-judiciaire","gl.liquidation-value","gl.waterfall"]},{"id":"gl.chapter-11","type":"glossaryTerm","level":2,"topic":"Restructuring","tags":["Restructuring"],"difficulty":2,"source":{"flag":"VERIFIED"},"term":"Chapter 11","aliases":["chapter 11","chap 11","ch.11","ch 11","redressement américain","redressement americain"],"definition":{"fr":"Procédure de réorganisation du droit américain des faillites (US Bankruptcy Code) permettant au débiteur de poursuivre son activité en debtor-in-possession, sous protection d'un automatic stay, le temps d'élaborer et faire voter un plan de réorganisation.","en":"A reorganisation procedure under the US Bankruptcy Code allowing the debtor to keep operating as debtor-in-possession, protected by an automatic stay, while it builds and gets creditor approval for a plan of reorganisation."},"related":["gl.chapter-7","gl.debtor-in-possession","gl.automatic-stay","gl.363-sale"]},{"id":"gl.chapter-7","type":"glossaryTerm","level":2,"topic":"Restructuring","tags":["Restructuring"],"difficulty":2,"source":{"flag":"VERIFIED"},"term":"Chapter 7","aliases":["chapter 7","chap 7","ch.7","ch 7","liquidation américaine","liquidation americaine"],"definition":{"fr":"Procédure de liquidation du droit américain des faillites : un trustee réalise les actifs du débiteur et distribue le produit aux créanciers selon l'ordre de priorité. L'entreprise cesse son activité.","en":"A liquidation procedure under the US Bankruptcy Code: a trustee sells the debtor's assets and distributes the proceeds to creditors in priority order. The business ceases to operate."},"related":["gl.chapter-11","gl.liquidation-value","gl.absolute-priority-rule"]},{"id":"gl.debtor-in-possession","type":"glossaryTerm","level":3,"topic":"Restructuring","tags":["Restructuring","LevFin"],"difficulty":3,"source":{"flag":"VERIFIED"},"term":"debtor-in-possession","aliases":["debtor-in-possession","debtor in possession","DIP","DIP financing","financement DIP"],"definition":{"fr":"En Chapter 11, le débiteur qui conserve la gestion et le contrôle de ses actifs pendant la procédure. Le financement DIP (debtor-in-possession) est un crédit nouveau, souvent super-prioritaire, accordé pour financer l'activité pendant la réorganisation.","en":"In Chapter 11, the debtor that keeps managing and controlling its assets during the case. DIP (debtor-in-possession) financing is new, often super-priority, lending provided to fund operations through the reorganisation."},"related":["gl.chapter-11","gl.loan-to-own","gl.fulcrum-security"]},{"id":"gl.automatic-stay","type":"glossaryTerm","level":3,"topic":"Restructuring","tags":["Restructuring"],"difficulty":3,"source":{"flag":"VERIFIED"},"term":"automatic stay","aliases":["automatic stay","stay","suspension des poursuites","gel des poursuites","moratoire"],"definition":{"fr":"Suspension automatique des poursuites des créanciers déclenchée par l'ouverture d'une procédure d'insolvabilité (automatic stay en Chapter 11, suspension des poursuites en droit français). Elle gèle saisies, exécutions et actions en paiement.","en":"An automatic freeze on creditor enforcement triggered by the filing of an insolvency case (the automatic stay in Chapter 11, suspension des poursuites in France). It halts seizures, enforcement, and collection actions."},"related":["gl.chapter-11","gl.sauvegarde"]},{"id":"gl.debt-to-equity-swap","type":"glossaryTerm","level":3,"topic":"Restructuring","tags":["Restructuring","LevFin"],"difficulty":3,"source":{"flag":"VERIFIED"},"term":"debt-to-equity swap","aliases":["debt-to-equity swap","debt to equity swap","debt-equity swap","equitisation","conversion dette/equity","conversion dette equity","conversion de dette en capital","conversion de créances en actions"],"definition":{"fr":"Opération de restructuration par laquelle des créanciers convertissent tout ou partie de leur dette en capitaux propres de l'emprunteur, réduisant l'endettement en échange d'une prise de contrôle au capital. Les actionnaires existants sont fortement dilués.","en":"A restructuring in which creditors convert all or part of their debt into equity of the borrower, cutting leverage in exchange for ownership. Existing shareholders are heavily diluted or wiped out."},"related":["gl.fulcrum-security","gl.loan-to-own","gl.capital-structure"]},{"id":"gl.absolute-priority-rule","type":"glossaryTerm","level":3,"topic":"Restructuring","tags":["Restructuring"],"difficulty":3,"source":{"flag":"VERIFIED"},"term":"absolute priority rule","aliases":["absolute priority rule","APR","absolute priority","règle de priorité absolue","regle de priorite absolue","priorité absolue","priorite absolue"],"definition":{"fr":"Principe selon lequel, en cas de réorganisation ou liquidation, une classe de créanciers doit être intégralement désintéressée avant qu'une classe junior ne reçoive quoi que ce soit. Elle structure la cascade de distribution (waterfall).","en":"The principle that, in a reorganisation or liquidation, a class of claims must be paid in full before any junior class recovers anything. It governs the distribution waterfall."},"related":["gl.waterfall","gl.fulcrum-security","gl.capital-structure"]},{"id":"gl.waterfall","type":"glossaryTerm","level":2,"topic":"Restructuring","tags":["Restructuring","LevFin"],"difficulty":2,"source":{"flag":"VERIFIED"},"term":"waterfall","aliases":["waterfall","recovery waterfall","payment waterfall","cascade de recouvrement","cascade de paiement","cascade","ordre de remboursement"],"definition":{"fr":"Ordre séquentiel de distribution du produit disponible (cession, liquidation, cash) entre les détenteurs de capital, du plus senior au plus junior. Chaque rang est servi entièrement avant le suivant.","en":"The sequential order in which available proceeds (sale, liquidation, cash) are distributed across the capital structure, from most senior to most junior. Each tranche is paid in full before the next receives anything."},"related":["gl.absolute-priority-rule","gl.fulcrum-security","gl.liquidation-value"]},{"id":"gl.liquidation-value","type":"glossaryTerm","level":2,"topic":"Restructuring","tags":["Restructuring","Valuation"],"difficulty":2,"source":{"flag":"VERIFIED"},"term":"liquidation value","aliases":["liquidation value","valeur de liquidation","valeur liquidative","valeur de réalisation","valeur de realisation"],"definition":{"fr":"Valeur estimée des actifs vendus séparément dans un scénario de liquidation, généralement à prix décoté et nette des coûts de réalisation. Elle sert de plancher de recouvrement et de point de comparaison au plan de réorganisation.","en":"The estimated value of assets sold piecemeal in a liquidation scenario, usually at distressed prices net of realisation costs. It serves as a recovery floor and a benchmark against a reorganisation plan."},"related":["gl.waterfall","gl.chapter-7","gl.liquidation-judiciaire"]},{"id":"gl.plan-de-cession","type":"glossaryTerm","level":3,"topic":"Restructuring","tags":["Restructuring","M&A"],"difficulty":3,"source":{"flag":"VERIFIED"},"term":"plan de cession","aliases":["plan de cession","cession totale ou partielle","going-concern sale","sale plan"],"definition":{"fr":"En procédure collective française, plan par lequel tout ou partie de l'activité est cédée à un repreneur en vue d'assurer le maintien de l'emploi et l'apurement du passif. Le tribunal arbitre entre les offres de reprise.","en":"Under French insolvency law, a plan whereby all or part of the business is sold to a buyer to preserve jobs and clear liabilities. The court selects among competing takeover bids."},"related":["gl.redressement-judiciaire","gl.363-sale"]},{"id":"gl.363-sale","type":"glossaryTerm","level":3,"topic":"Restructuring","tags":["Restructuring","M&A"],"difficulty":3,"source":{"flag":"VERIFIED"},"term":"363 sale","aliases":["363 sale","section 363 sale","363","vente 363","vente sous 363"],"definition":{"fr":"Vente d'actifs réalisée sous la section 363 du US Bankruptcy Code pendant une procédure Chapter 11, généralement libre et quitte de la plupart des sûretés et passifs, souvent via une enchère avec stalking horse. Elle est plus rapide qu'un plan complet de réorganisation.","en":"An asset sale conducted under section 363 of the US Bankruptcy Code during Chapter 11, typically free and clear of most liens and liabilities, often via an auction with a stalking-horse bidder. It is faster than a full plan of reorganisation."},"related":["gl.chapter-11","gl.plan-de-cession","gl.loan-to-own"]},{"id":"gl.loan-to-own","type":"glossaryTerm","level":3,"topic":"Restructuring","tags":["Restructuring","LevFin"],"difficulty":3,"source":{"flag":"VERIFIED"},"term":"loan-to-own","aliases":["loan-to-own","loan to own","stratégie loan-to-own","strategie loan-to-own"],"definition":{"fr":"Stratégie d'investisseurs distressed consistant à acheter la dette (souvent la fulcrum security) d'une entreprise en difficulté avec l'objectif de prendre le contrôle du capital via un debt-to-equity swap lors de la restructuration.","en":"A distressed-investing strategy of buying a troubled company's debt (often the fulcrum security) with the goal of taking ownership through a debt-to-equity swap in the restructuring."},"related":["gl.fulcrum er des fonds supplémentaires pour financer des acquisitions complémentaires (bolt-ons) après le closing, généralement soumise à des conditions de levier.","en":"A committed credit line in an LBO financing package allowing further drawdowns to fund bolt-on acquisitions after closing, usually subject to leverage conditions."},"related":["gl.bolt-on","gl.platform","gl.certain-funds"]},{"id":"gl.fairness-opinion","type":"glossaryTerm","level":2,"topic":"M&A","tags":["M&A","ECM"],"difficulty":2,"source":{"flag":"VERIFIED"},"term":"fairness opinion","aliases":["fairness opinion","attestation d'équité","attestation dequite","attestation d equite","expertise indépendante","expertise independante","rapport de l'expert indépendant"],"definition":{"fr":"Avis écrit d'une banque ou d'un expert indépendant attestant que le prix d'une opération est équitable d'un point de vue financier pour les actionnaires. En France, l'attestation d'équité de l'expert indépendant est requise dans certaines offres publiques.","en":"A written opinion from a bank or independent expert stating that the price of a transaction is fair, from a financial point of view, to shareholders. In France an independent expert's attestation d'équité is required in certain public offers."},"related":["gl.amf","gl.squeeze-out","gl.control-premium"]},{"id":"gl.scheme-of-arrangement","type":"glossaryTerm","level":3,"topic":"M&A","tags":["M&A","Restructuring"],"difficulty":3,"source":{"flag":"VERIFIED"},"term":"scheme of arrangement","aliases":["scheme of arrangement","scheme","UK scheme","plan d'arrangement"],"definition":{"fr":"Procédure de droit anglais homologuée par un tribunal permettant de réaliser une acquisition (takeover) ou une restructuration de dette en liant tous les actionnaires ou créanciers d'une classe dès lors qu'une majorité qualifiée a approuvé. Très utilisée pour les rachats de sociétés cotées au Royaume-Uni.","en":"A court-sanctioned procedure under English law used to implement a takeover or de mposé par les règles boursières au Royaume-Uni et apprécié par l'AMF en France.","en":"An acquisition-financing regime (notably for listed targets) where lenders commit on a near-unconditional basis, sharply limiting drawdown conditions so the bidder has assured funds to pay the price. Required by UK takeover rules and expected by the AMF in France."},"related":["gl.bidco","gl.acquisition-facility","gl.amf"]},{"id":"gl.squeeze-out","type":"glossaryTerm","level":2,"topic":"M&A","tags":["M&A","ECM"],"difficulty":2,"source":{"flag":"VERIFIED"},"term":"squeeze-out","aliases":["squeeze-out","squeeze out","retrait obligatoire","rachat forcé","rachat force","expropriation des minoritaires"],"definition":{"fr":"Retrait obligatoire : procédure permettant à un actionnaire majoritaire ayant franchi un seuil élevé (90 % en France) de racheter de force les titres des minoritaires après une offre publique, moyennant une indemnisation jugée équitable.","en":"A squeeze-out: the procedure letting a majority holder above a high threshold (90% in France) compulsorily buy out minority shares after a public offer, against fair compensation."},"related":["gl.amf","gl.fairness-opinion","gl.control-premium"]},{"id":"gl.control-premium","type":"glossaryTerm","level":2,"topic":"M&A","tags":["M&A","Valuation"],"difficulty":2,"source":{"flag":"VERIFIED"},"term":"control premium","aliases":["control premium","prime de contrôle","prime de controle","prime d'acquisition","prime de prise de contrôle"],"definition":{"fr":"Surcoût payé par un acquéreur au-dessus du cours de marché pour obtenir le contrôle d'une société, reflétant la valeur des synergies et du pouvoir de décision. En Europe, les primes d'offre publique se situent souvent autour de 20-40 %.","en":"The premium an acquirer pays above the prevailing market price to gain control of a company, reflecting the value of synergies and decision-making power. European public-offer premia often sit around 20-40%."},"related":["gl.squeeze-out","gl function renderText(raw){
  if(raw==null)return'';

  s=s.replace(/\[\[([^\]]+)\]\]/g,(m,inner)=>{

    return `<span class="term" style="border-color:var(--muted);cursor:default">${esc(inner)}</span>`;
  });

  s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  s=s.replace(/\n{2,}/g,'</p><p>').replace(/\n/g,'<br>');
  return s;
}

/* ---------- 6. GAMIFICATION ---------- */
const RANKS=[['stagiaire','Stagiaire','Intern',0],['analyst','Analyst','Analyst',500],['associate','Associate','Associate',2000],['vp','VP','VP',5000],['director','Director','Director',9000],['md','Managing Partner','Managing Partner',15000]];
function rankFor(xp){let r=RANKS[0];for(const x of RANKS){if(xp>=x[3])r=x;}return r;}
function nextRank(xp){for(const x of RANKS){if(xp<x[3])return x;}return null;}
function rankLabel(id){const r=RANKS.find(x=>x[0]===id)||RANKS[0];return LANG==='fr'?r[1]:r[2];}
function rankIndex(id){return RANKS.findIndex(x=>x[0]===id);}
function addXP(n,reason){
  S.game.xp+=n; const r=rankFor(S.game.xp); const up=r[0]!==S.game.rank; S.game.rank=r[0];
  toast(`+${n} XP${reason?' · '+reason:''}`,'xp');
  if(up)setTimeout(()=>toast((LANG==='fr'?'Nouveau rang : ':'New rank: ')+rankLabel(r[0]),'xp'),900);
  if(r[0]==='vp')awardBadge('level_vp'); if(r[0]==='md')awardBadge('level_md');
  save();
}
function tickActivity(){ // streak + daily
  const t=todayStr(), st=S.game.streak;
  if(st.lastActiveDate!==t){
    const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
    st.current = st.lastActiveDate===y ? st.current+1 : 1;
    st.lastActiveDate=t; st.best=Math.max(st.best,st.current);
    if(st.current>=7)awardBadge('streak_7'); if(st.current>=30)awardBadge('streak_30');
  }
}
function bumpDaily(kind){ const d=S.game.dailyProgress; if(d.date!==todayStr())Object.assign(d,{date:todayStr(),cards:0,sections:0}); d[kind]=(d[kind]||0)+1; }
function recomputeMastery(){
  const m={};
  TOPICS.forEach(t=>{
    const cards=IDX.flashcards.filter(c=>c.topic===t), qs=IDX.qcm.filter(q=>q.topic===t);
    const total=cards.length+qs.length; if(!total){m[t]=0;return;}
    let got=0;
    cards.forEach(c=>{const r=S.srs[c.id]; if(r&&r.reps>0)got+=Math.min(1,r.reps/2);});
    qs.forEach(q=>{ if(S.qcmHistory.some(h=>h.qcmId===q.id&&h.correct))got+=1; });
    m[t]=Math.max(0,Math.min(1,got/total));
  });
  S.game.mastery=m; return m;
}
const BADGES={
  first_module:['🎯',{fr:'1er module',en:'First module'}], first_lbo:['🏗️',{fr:'1er LBO',en:'First LBO'}],
  streak_7:['🔥',{fr:'Série 7 jours',en:'7-day streak'}], streak_30:['🗓️',{fr:'Série 30 jours',en:'30-day streak'}],
  cards_100:['💯',{fr:'100 cartes revues',en:'100 cards reviewed'}], perfect_qcm:['✅',{fr:'QCM parfait',en:'Perfect quiz'}],
  excel_ace:['⚡',{fr:'Excel maîtrisé',en:'Excel ace'}], first_case:['🧩',{fr:'1er case study',en:'First case study'}],
  level_vp:['🎓',{fr:'Niveau VP',en:'VP level'}], level_md:['👑',{fr:'Managing Partner',en:'Managing Partner'}],
};
function awardBadge(id){ if(!BADGES[id]||S.game.badges.includes(id))return; S.game.badges.push(id); const b=BADGES[id]; toast((LANG==='fr'?'Succès débloqué : ':'Achievement: ')+b[0]+' '+L(b[1]),'xp'); save(); }

/* ---------- 7. SRS (SM-2) ---------- */
function srsCard(id){ return S.srs[id]||{ease:2.5,interval:0,reps:0,lapses:0,due:todayStr()}; }
function isDue(id){ const c=S.srs[id]; if(!c)return true; return c.due<=todayStr(); }
function reviewCard(id,grade){ // grade: 0 again,1 hard,2 good,3 easy
  const c=srsCard(id); const q=[0,3,4,5][grade];
  if(grade===0){ c.reps=0; c.interval=1; c.lapses++; }
  else{ if(c.reps===0)c.interval=1; else if(c.reps===1)c.interval=6; else c.interval=Math.round(c.interval*c.ease); c.reps++; }
  c.ease=Math.max(1.3, c.ease+(0.1-(5-q)*(0.08+(5-q)*0.02)));
  const d=new Date(); d.setDate(d.getDate()+c.interval); c.due=d.toISOString().slice(0,10);
  S.srs[id]=c; S.counters.reviews++; if(S.counters.reviews>=100)awardBadge('cards_100');
  tickActivity(); bumpDaily('cards'); addXP(grade===0?3:grade>=2?8:5); recomputeMastery(); save();
}

/* ---------- 8. EXCEL ENGINE (formula evaluator) ---------- */
const XL=(function(){
  function colToNum(c){let n=0;for(let i=0;i<c.length;i++)n=n*26+(c.charCodeAt(i)-64);return n;}
  function tokenize(f){
    const t=[]; let i=0; const s=f;
    while(i<s.length){ const ch=s[i];
      if(ch===' '){i++;continue;}
      if(/[0-9.]/.test(ch)){let j=i;while(j<s.length&&/[0-9.]/.test(s[j]))j++;t.push({t:'num',v:parseFloat(s.slice(i,j))});i=j;continue;}
      if(/[A-Za-z]/.test(ch)){let j=i;while(j<s.length&&/[A-Za-z0-9_]/.test(s[j]))j++;let name=s.slice(i,j);
        if(s[j]==='('){t.push({t:'func',v:name.toUpperCase()});}
        else if(/^[A-Za-z]{1,3}[0-9]{1,4}$/.test(name)){t.push({t:'ref',v:name.toUpperCase()});}

/* ----- Flashcard review session ----- */
function buildQueue(query){
  let pool=IDX.flashcards.slice();
  if(query.module)pool=pool.filter(c=>c.moduleId===query.module);
  if(query.topic)pool=pool.filter(c=>c.topic===query.topic);
  let due=pool.filter(c=>isDue(c.id));
  if(!due.length)due=pool.slice(0,Math.min(20,pool.length)); // free session if nothing due
  return due.sort(()=>Math.random()-0.5);
}
let SESSION=null;
function viewReview(v,query){
  if(!SESSION||SESSION.type!=='review'||SESSION.key!==JSON.stringify(query)){ SESSION={type:'review',key:JSON.stringify(query),queue:buildQueue(query),i:0,flipped:false,done:0}; }
  const s=SESSION;
  if(s.i>=s.queue.length){ return sessionDone(v,`${s.done} ${LANG==='fr'?'cartes revues':'cards reviewed'}`,'#/dashboard'); }
  const card=s.queue[s.i];
  v.innerHTML=`<div class="crumb"><a href="#/dashboard">${tt('dashboard')}</a> › ${tt('review')}</div>
  <div class="progressbar"><div style="width:${Math.round(s.i/s.queue.length*100)}%"></div></div>
  <div class="row" style="justify-content:space-between"><span class="pill">${card.topic}</span><span class="muted">${s.i+1} / ${s.queue.length}</span></div>
  <div class="fc" style="margin-top:12px"><div class="inner" id="fcInner"><div><div class="q">${renderText(card.front)}</div><div class="a" id="fcA">${s.flipped?renderText(card.back):'→ '+tt('reveal')}</div>${s.flipped?corrNote(card.correction):''}</div></div></div>
  ${s.flipped?`<div class="srs"><button class="again" data-g="0">${tt('again')}</button><button class="hard" data-g="1">${tt('hard')}</button><button class="good" data-g="2">${tt('good')}</button><button class="easy" data-g="3">${tt('easy')}</button></div>`:`<div style="margin-top:14px"><button class="btn" id="flip">${tt('reveal')}</button></div>`}`;
  const flip=()=>{s.flipped=true;render();};
  document.getElementById('fcInner').onclick=()=>{if(!s.flipped)flip();};
  if(document.getElementById('flip'))document.getElementById('flip').onclick=flip;
  v.querySelectorAll('.srs button').forEach(b=>b.onclick=()=>{reviewCard(card.id,+b.dataset.g);s.done++;s.i++;s.flipped=false;render();});
}
function sessionDone(v,msg,back){
  v.innerHTML=`<div class="card" style="text-align:center;padding:50px 20px"><div style="font-size:42px">🎉</div><h2>${tt('finishSession')}</h2><p class="muted">${msg}</p><div style="margin-top:14px"><a class="btn" href="${back}">${tt('backDash')}</a></div></div>`;

function viewQuiz(v,query){

  }
  const s=SESSION;
  if(s.i>=s.queue.length){ if(s.queue.length&&s.correct===s.queue.length)awardBadge('perfect_qcm'); return sessionDone(v,`${s.correct} / ${s.queue.length} ${LANG==='fr'?'bonnes réponses':'correct'}`,'#/qcm'); }
  const q=s.queue[s.i];
  v.innerHTML=`<div class="crumb"><a href="#/qcm">${tt('qcm')}</a> › ${q.topic}</div>
  <div class="progressbar"><div style="width:${Math.round(s.i/s.queue.length*100)}%"></div></div>

  <div id="opts">${q.options.map(o=>{let cls='opt';if(s.answered){if(o.correct)cls+=' right';else if(s.sel.includes(o.id))cls+=' wrong';}else if(s.sel.includes(o.id))cls+=' sel';return `<div class="${cls}" data-id="${o.id}"><span class="mk">${s.answered?(o.correct?'✓':(s.sel.includes(o.id)?'✕':'')):''}</span><span>${renderText(o.text)}${s.answered&&o.why?`<span class="why">${renderText(o.why)}</span>`:''}</span></div>`;}).join('')}</div>
  ${s.answered?`<div class="expl"><b>${LANG==='fr'?'Explication':'Explanation'}.</b> ${renderText(q.explanation)}${q.workings?`<br><br><b>${LANG==='fr'?'Calcul':'Working'} :</b> ${renderText(q.workings)}`:''}</div>${corrNote(q.correction)}
  <div style="margin-top:12px"><button class="btn" id="nextq">${tt('next')} →</button></div>`:`<div style="margin-top:12px"><button class="btn" id="validate" disabled>${tt('check')}</button></div>`}</div>`;
  if(!s.answered){
    v.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{const id=el.dataset.id;if(q.multi){s.sel.includes(id)?s.sel=s.sel.filter(x=>x!==id):s.sel.push(id);}else s.sel=[id];render();});
    const val=document.getElementById('validate'); if(s.sel.length)val.disabled=false;
    val.onclick=()=>{s.answered=true;const correctIds=q.options.filter(o=>o.correct).map(o=>o.id).sort();const ok=JSON.stringify(s.sel.slice().sort())===JSON.stringify(correctIds);S.qcmHistory.push({qcmId:q.id,correct:ok,at:new Date().toISOString()});if(ok){s.correct++;S.counters.correctQcm++;tickActivity();addXP(15,LANG==='fr'?'bonne réponse':'correct');}recomputeMastery();save();render();};
  } else { document.getElementById('nextq').onclick=()=>{s.i++;s.sel=[];s.answered=false;render();}; }
}

function colName(n){let c='';while(n>0){c=String.fromCharCode(64+((n-1)%26)+1)+c;n=Math.floor((n-1)/26);}return c;}
function viewExercise(v,id){
  const e=IDX.exerciseById[id]; if(!e){v.innerHTML=`<div class="card">${tt('empty')}</div>`;return;}
  if(!SESSION||SESSION.type!=='xl'||SESSION.id!==id){ SESSION={type:'xl',id,inputs:{},checked:false,revealed:false}; }
  const s=SESSION; const g=e.grid||{rows:1,cols:1,cells:{}};
  // header
  let h=`<div class="crumb"><a href="#/excel">${tt('excel')}</a> › ${e.topic}</div>
  <div class="hello"><div class="row"><span class="pill">N${e.level}</span><span class="pill">${e.topic}</span>${flagBadge(e.source)}</div><h1 style="font-size:20px">${renderText(e.prompt)}</h1></div>`;
  // grid
  h+=`<div class="card"><div class="sheet"><table class="xl"><thead><tr><th></th>${Array.from({length:g.cols},(_,c)=>`<th>${colName(c+1)}</th>`).join('')}</tr></thead><tbody>`;
  for(let r=1;r<=g.rows;r++){ h+=`<tr><th>${r}</th>`;
    for(let c=1;c<=g.cols;c++){ const ref=colName(c)+r; const cell=g.cells[ref];
      if(!cell){h+=`<td></td>`;continue;}
      if(cell.role==='label'){h+=`<td><div class="lbl">${esc(cell.label||L(cell.label)||'')}</div></td>`;}
      else if(cell.role==='input'||cell.role==='link'){h+=`<td class="${cell.role==='link'?'link':''}"><div class="inp">${fmtNum(cell.value,cell.numFmt)}</div></td>`;}
      else if(cell.role==='formula'){const val=s.inputs[ref]!==undefined?s.inputs[ref]:'';const status=s.checked?(checkOk(e,ref,s)?'ok':'ko'):'';h+=`<td class="${status}"><input data-ref="${ref}" value="${esc(val)}" placeholder="=…" autocomplete="off"></td>`;}
      else if(cell.role==='check'){h+=`<td><div class="lbl" style="color:var(--red)">${esc(cell.label||'')}</div></td>`;}
      else h+=`<td></td>`;
    } h+=`</tr>`;
  }
  h+=`</tbody></table></div>
  <div class="row" style="margin-top:14px"><button class="btn" id="xlcheck">${tt('check')}</button><button class="btn ghost" id="xlreveal">${tt('solution')}</button></div>`;
  if(s.checked){ const allok=(e.checks||[]).every(ck=>checkResult(e,ck,s).ok); h+=`<div class="expl" style="margin-top:12px">${(e.checks||[]).map(ck=>{const r=checkResult(e,ck,s);return `<div>${r.ok?'✓':'✕'} <b>${ck.cell}</b> = ${r.ok?'<span style="color:var(--green)">'+fmtNum(r.got,g.cells[ck.cell]?g.cells[ck.cell].numFmt:'')+'</span>':'<span style="color:var(--red)">'+(r.got===''||r.got===undefined?'—':fmtNum(r.got))+'</span> '+(ck.hint?'· '+renderText(ck.hint):'')}</div>`;}).join('')}${allok?`<div style="margin-top:8px;color:var(--green);font-weight:700">✓ ${LANG==='fr'?'Tout est correct !':'All correct!'}</div>`:''}</div>`; }
  if(s.revealed){ h+=`<div class="card prose" style="margin-top:12px"><h4>${LANG==='fr'?'Corrigé':'Solution'}</h4>${prose(e.solution)}<div class="muted" style="margin-top:8px">${Object.keys(g.cells).filter(k=>g.cells[k].role==='formula').map(k=>`<code>${k}</code> = <code>${esc(g.cells[k].formula||'')}</code>`).join(' &nbsp; ')}</div></div>`; }
  h+=`</div>`;
  v.innerHTML=h;
  v.querySelectorAll('table.xl input').forEach(inp=>{inp.oninput=()=>{s.inputs[inp.dataset.ref]=inp.value;};inp.onkeydown=ev=>{if(ev.key==='Enter')document.getElementById('xlcheck').click();};});
  document.getElementById('xlcheck').onclick=()=>{s.checked=true;const allok=(e.checks||[]).every(ck=>checkResult(e,ck,s).ok);if(allok&&!S.completedExercises.includes(id)){S.completedExercises.push(id);tickActivity();addXP(30,LANG==='fr'?'exercice résolu':'drill solved');awardBadge('excel_ace');save();}render();};
  document.getElementById('xlreveal').onclick=()=>{s.revealed=true;render();};
}
function buildEvalCells(e,s){ const g=e.grid; const cells={}; Object.keys(g.cells).forEach(ref=>{const c=g.cells[ref]; if(c.role==='input'||c.role==='link')cells[ref]={value:c.value}; else if(c.role==='formula'){const f=s.inputs[ref]; cells[ref]= (f&&f[0]==='=')?{formula:f}:(f!==undefined&&f!==''?{value:isNaN(+f)?f:+f}:{value:0}); }}); return cells; }
function checkResult(e,ck,s){ const cells=buildEvalCells(e,s); const out=XL.evalSheet(cells); let got=out[ck.cell]; const ok=typeof got==='number'&&Math.abs(got-ck.expected)<=(ck.tolerance||0.01); return {ok,got}; }
function checkOk(e,ref,s){ const ck=(e.checks||[]).find(c=>c.cell===ref); if(!ck)return true; return checkResult(e,ck,s).ok; }
function fmtNum(v,fmt){ if(v===''||v===undefined||v===null)return''; if(typeof v!=='number'){return esc(String(v));} if(fmt&&fmt.indexOf('%')>=0)return (v*100).toFixed(fmt.indexOf('0.0')>=0?1:0)+'%'; if(fmt&&fmt.indexOf('x')>=0)return v.toFixed(1)+'x'; if(fmt&&fmt.indexOf('#,##0')>=0)return Math.round(v).toLocaleString('fr-FR'); return (Math.round(v*100)/100).toLocaleString('fr-FR'); }
