bon deal, et pourquoi ? Savoir bâtir une [[investment thesis]] claire, hiérarchiser les risques et proposer des mitigants distingue un candidat senior d'un simple « calculateur de modèle ». Les fonds comme Hivest, Ardian ou PAI Partners recrutent des gens qui pensent en propriétaire, pas seulement en analyste Excel.","en":"Beyond technicals, PE/IB interviews test your judgment: is this a good deal, and why? Being able to build a clear investment thesis, rank risks and propose mitigants is what separates a senior candidate from a mere 'model cruncher'. Funds like Hivest, Ardian or PAI Partners hire people who think like owners, not just Excel analysts."},"concepts":[{"heading":{"fr":"Parler d'un deal en entretien","en":"Discussing a deal in interview"},"body":{"fr":"Quand on vous demande « parlez-moi d'un deal », structurez : (1) contexte — secteur, taille, acteurs, type ([[LBO]], M&A, fundraise) ; (2) la thèse — pourquoi c'est intéressant en deux ou trois points ; (3) les chiffres clés — valorisation, multiple d'entrée, [[leverage]] ; (4) les risques et ce qui vous a convaincu ou non. Ayez une opinion : un recruteur préfère un avis argumenté à une description neutre. Reliez toujours le qualitatif au chiffre.","en":"When asked 'tell me about a deal', structure it: (1) context — sector, size, players, type (LBO, M&A, fundraise); (2) the thesis — why it's interesting in two or three points; (3) key figures — valuation, entry multiple, leverage; (4) the risks and what convinced you or not. Have an opinion: a recruiter prefers a reasoned view to a neutral description. Always connect the qualitative to the numbers."}},{"heading":{"fr":"Qu'est-ce qu'un bon candidat LBO","en":"What makes a good LBO candidate"},"body":{"fr":"Un bon candidat [[LBO]] présente : des [[free cash flow]] récurrents et prévisibles pour servir la dette ; un faible besoin de [[capex]] ; une position de marché défendable (barrières à l'entrée, pricing power) ; un management de qualité ; une dette nette d'entrée modérée ; et un levier de création de valeur identifiable (croissance, expansion de marge, build-up, [[multiple expansion]]). À l'inverse, une société cyclique, capex-intensive ou à clients concentrés se prête mal au [[leverage]].","en":"A good LBO candidate shows: recurring, predictable free cash flow to service debt; low capex needs; a defensible market position (entry barriers, pricing power); quality management; moderate entry net debt; and an identifiable value-creation lever (growth, margin expansion, buy-and-build, multiple expansion). Conversely, a cyclical, capex-heavy or customer-concentrated business is ill-suited to leverage."}},{"heading":{"fr":"Qualitatif vs quantitatif","en":"Qualitative vs quantitative"},"body":{"fr":"Le quantitatif (modèle, [[IRR]], [[MoM]], sensibilités) répond à « combien » ; le qualitatif répond à « pourquoi ». Les deux doivent se rejoindre : une hypothèse de croissance de 10 % dans le modèle doit être justifiée par une réalité de marché (TAM, parts de marché, pipeline commercial). Un bon candidat ne récite pas son modèle, il explique ce qui doit être vrai dans le monde réel pour que les chiffres tiennent — et teste la robustesse via des sensibilités.","en":"The quantitative (model, IRR, MoM, sensitivities) answers 'how much'; the qualitative answers 'why'. The two must meet: a 10% growth assumption in the model must be justified by a market reality (TAM, market share, sales pipeline). A good candidate does not recite the model, they explain what must be true in the real world for the numbers to hold — and stress-tests robustness via sensitivities."}},{"heading":{"fr":"Repérer les red flags","en":"Spotting red flags"},"body":{"fr":"Les [[red flag]] classiques : concentration client (un client > 20-30 % du CA) ; dépendance à un homme clé ou à un fournisseur unique ; marges en érosion ou qualité d'[[EBITDA]] douteuse (add-backs agressifs, [[EBITDA]] ajusté gonflé) ; [[working capital]] erratique ; litiges ou passifs cachés ; déclin structurel du marché ; churn élevé en SaaS. En due diligence, on cherche l'écart entre l'histoire racontée et les chiffres réels.","en":"Classic red flags: customer concentration (one client > 20-30% of revenue); key-man or single-supplier dependency; eroding margins or dubious EBITDA quality (aggressive add-backs, inflated adjusted EBITDA); erratic working capital; litigation or hidden liabilities; structural market decline; high churn in SaaS. In due diligence, you hunt for the gap between the story told and the real numbers."}},{"heading":{"fr":"Structurer une recommandation d'investissement","en":"Structuring an investment recommendation"},"body":{"fr":"Une recommandation tient en trois blocs : (1) la thèse — pourquoi investir, le levier de création de valeur et le rendement attendu ([[IRR]], [[MoM]]) ; (2) les risques principaux, classés par impact et probabilité ; (3) les mitigants — earn-out, garanties (reps & warranties), clauses contractuelles, structuration de la dette, plan 100 jours. Concluez par une recommandation nette (go / no-go / conditionnel) plutôt qu'un avis tiède. Un comité d'investissement attend une position défendable, pas un catalogue de faits.","en":"A recommendation rests on three blocks: (1) the thesis — why invest, the value-creation lever and the expected return (IRR, MoM); (2) the main risks, ranked by impact and probability; (3) the mitigants — earn-out, representations & warranties, contractual clauses, debt structuring, 100-day plan. Conclude with a clear recommendation (go / no-go / conditional) rather than a lukewarm view. An investment committee expects a defensible stance, not a catalogue of facts."}}],"exempleChiffre":{"title":{"fr":"Exemple : thèse synthétique sur un LBO mid-cap FR","en":"Example: concise thesis on a French mid-cap LBO"},"body":{"fr":"Cible : éditeur de logiciel B2B, EBITDA 20 M€, entrée à 10x EV/EBITDA (EV = 200 M€), [[leverage]] 5x EBITDA (dette 100 M€, equity 100 M€). Thèse : croissance 8 %/an + 200 pb de marge via cross-sell. Risque : churn client. Mitigant : earn-out sur le management et clause de rétention. Sortie à 10x sur EBITDA de ~28 M€ en année 5 → EV 280, dette résiduelle ~60, equity 220, soit [[MoM]] 2,2x et [[IRR]] ≈ 2,2^(1/5) − 1 ≈ 17 %.","en":"Target: B2B software vendor, EBITDA EUR 20m, entry at 10x EV/EBITDA (EV = EUR 200m), leverage 5x EBITDA (debt EUR 100m, equity EUR 100m). Thesis: 8%/yr growth + 200 bps margin via cross-sell. Risk: customer churn. Mitigant: management earn-out and retention clause. Exit at 10x on ~EUR 28m EBITDA in year 5 -> EV 280, residual debt ~60, equity 220, i.e. MoM 2.2x and IRR ~= 2.2^(1/5) - 1 ~= 17%."},"figures":[{"caption":{"fr":"Pont equity entrée / sortie (M€)","en":"Entry / exit equity bridge (EUR m)"},"columns":["Poste","Entrée","Sortie"],"rows":[["EV","200","280"],["Dette nette","100","60"],["Equity","100","220"]]}]},"piegesEntretien":[{"fr":"Décrire un deal sans avoir d'opinion : le recruteur veut votre jugement, pas une fiche Wikipédia.","en":"Describing a deal with no opinion: the recruiter wants your judgment, not a Wikipedia entry."},{"fr":"Lister des risques sans mitigants : un bon analyste propose toujours comment couvrir chaque risque (earn-out, reps & warranties, structuration).","en":"Listing risks without mitigants: a good analyst always proposes how to cover each risk (earn-out, reps & warranties, structuring)."},{"fr":"Justifier une croissance par « le modèle le dit » : il faut une raison de marché (TAM, parts, pipeline), pas une cellule Excel.","en":"Justifying growth with 'the model says so': you need a market reason (TAM, share, pipeline), not an Excel cell."},{"fr":"Ignorer la qualité de l'EBITDA : un EBITDA ajusté gonflé d'add-backs agressifs fausse le multiple et le levier réel.","en":"Ignoring EBITDA quality: an adjusted EBITDA inflated by aggressive add-backs distorts the multiple and the real leverage."},{"fr":"Confondre un bon business et un bon deal : une excellente société payée trop cher peut donner un mauvais [[IRR]].","en":"Confusing a good business with a good deal: an excellent company bought too expensively can deliver a poor IRR."}],"synthese":{"fr":"• Parler d'un deal : contexte → thèse → chiffres → risques, avec une opinion.\n• Bon candidat [[LBO]] : FCF prévisibles, capex faible, position défendable, levier de valeur clair.\n• Relier le quantitatif (modèle) au qualitatif (marché, management).\n• Red flags : concentration client, qualité d'EBITDA, churn, dépendances.\n• Recommandation = thèse + risques + mitigants + position nette.","en":"• Discussing a deal: context -> thesis -> figures -> risks, with an opinion.\n• Good LBO candidate: predictable FCF, low capex, defensible position, clear value lever.\n• Connect the quantitative (model) to the qualitative (market, management).\n• Red flags: customer concentration, EBITDA quality, churn, dependencies.\n• Recommendation = thesis + risks + mitigants + clear stance."}},"glossaryRefs":["lbo","free-cash-flow","irr","mom","investment-thesis","red-flag"]},{"id":"mod.l4.lbo1-paper","type":"module","level":4,"topic":"LBO","tags":["LBO","EV","equity value","structuration"],"difficulty":4,"source":{"flag":"VERIFIED","ref":"BIWS LBO guide + Vernimmen (logique LBO)"},"title":{"fr":"Le paper [[LBO]]","en":"The paper [[LBO]]"},"objective":{"fr":"Savoir poser un LBO sur le papier : logique, candidat idéal et architecture HoldCo/BidCo.","en":"Be able to set up an LBO on paper: rationale, ideal candidate and HoldCo/BidCo architecture."},"estMinutes":15,"prerequisites":[],"content":{"contexte":{"fr":"Le paper LBO est l'exercice de base en entretien private equity : on vous demande de raisonner l'achat d'une société financé majoritairement par de la dette, sans Excel. Maîtriser la logique et la structure capitalistique avant de toucher aux chiffres distingue un candidat crédible.","en":"The paper LBO is the core private equity interview exercise: you reason through buying a company funded mostly by debt, without Excel. Mastering the rationale and the capital structure before touching numbers is what makes a candidate deal-credible."},"concepts":[{"heading":{"fr":"La logique du [[LBO]]","en":"The [[LBO]] rationale"},"body":{"fr":"Un [[LBO]] (Leveraged Buy-Out) consiste à racheter une entreprise en finançant le prix majoritairement par de la dette portée par la cible elle-même, l'apport en [[equity]] du [[sponsor]] ne couvrant qu'une fraction. Le rendement vient de trois leviers : le désendettement (les [[free cash flow]] remboursent la dette et transfèrent de la valeur à l'actionnaire), la croissance de l'[[EBITDA]], et l'expansion du multiple de sortie. L'[[effet de levier]] amplifie le rendement sur fonds propres car la dette a un coût fixe inférieur à la rentabilité opérationnelle.","en":"An [[LBO]] (Leveraged Buy-Out) means buying a company by funding the price mostly with debt carried by the target itself, the [[sponsor]]'s [[equity]] covering only a fraction. Returns come from three levers: deleveraging ([[free cash flow]] repays debt and transfers value to the shareholder), [[EBITDA]] growth, and multiple expansion at exit. [[Leverage]] amplifies the return on equity because debt has a fixed cost below the operating profitability."}},{"heading":{"fr":"Le candidat idéal","en":"The ideal candidate"},"body":{"fr":"La cible idéale n'est pas la plus dynamique mais la plus prévisible : des [[cash flow]] stables et récurrents priment sur une forte croissance, car ils sécurisent le service de la dette. On recherche une position de marché défendable, un faible besoin en capex, un [[working capital]] maîtrisé, une faible cyclicité et une équipe de management solide. Une entreprise hyper-croissance mais consommatrice de cash est un mauvais candidat LBO : la dette l'étoufferait.","en":"The ideal target is not the fastest-growing but the most predictable: stable, recurring [[cash flow]] beats high growth, because it secures debt service. You look for a defensible market position, low capex needs, controlled [[working capital]], low cyclicality and a strong management team. A hyper-growth but cash-burning company is a poor LBO candidate: debt would choke it."}},{"heading":{"fr":"Structure HoldCo / BidCo","en":"HoldCo / BidCo structure"},"body":{"fr":"Le sponsor crée une holding d'acquisition (HoldCo) qui reçoit l'[[equity]] des fonds et des managers, puis une société de reprise (BidCo) qui porte la dette d'acquisition et rachète la cible (OpCo). Cette cascade permet de loger la dette au plus près des cash-flows opérationnels (souvent garantie par les actifs de l'OpCo), d'organiser la subordination entre tranches, et d'optimiser la déductibilité fiscale des intérêts. En France, le rabot fiscal (limite de déduction des intérêts) encadre cet avantage.","en":"The sponsor sets up an acquisition holding (HoldCo) that receives equity from the funds and managers, then a bid vehicle (BidCo) that carries the acquisition debt and buys the target (OpCo). This cascade lets debt sit close to the operating cash flows (often secured on OpCo's assets), organises subordination between tranches, and optimises interest tax deductibility. In France, the interest-deduction cap frames this benefit."}},{"heading":{"fr":"De l'[[EV]] à l'[[equity value]]","en":"From [[EV]] to [[equity value]]"},"body":{"fr":"Le prix d'entreprise ([[Enterprise Value]]) est valorisé en multiple de l'[[EBITDA]] : EV = multiple × EBITDA. L'[[equity value]] (valeur des fonds propres) se déduit par le pont : Equity Value = EV − dette nette = EV − dette + cash. À l'entrée d'un LBO, on paie l'equity value au vendeur ; la dette nette de la cible influe directement sur le chèque equity à sortir.","en":"Enterprise Value is priced as a multiple of [[EBITDA]]: EV = multiple × EBITDA. [[Equity value]] is derived via the bridge: Equity Value = EV − net debt = EV − debt + cash. At LBO entry you pay the equity value to the seller; the target's net debt directly affects the equity cheque to write."}}],"exempleChiffre":{"title":{"fr":"Paper LBO : poser la valorisation d'entrée","en":"Paper LBO: setting up the entry valuation"},"body":{"fr":"Une société réalise Sales 100 en année 0, croissant de +20%/an. La marge [[EBITDA]] est de 20%, soit un EBITDA de 20 en année 0. On entre à 12,0x l'EBITDA : [[EV]] = 12 × 20 = 240. La cible dispose de 10 de cash net positif, donc Equity Value = EV + cash = 240 + 10 = 250. C'est le chèque equity (valeur des fonds propres) que vaut la cible à l'entrée.","en":"A company posts Sales 100 in year 0, growing +20%/year. The [[EBITDA]] margin is 20%, i.e. EBITDA of 20 in year 0. We enter at 12.0x EBITDA: [[EV]] = 12 × 20 = 240. The target holds 10 of net cash, so Equity Value = EV + cash = 240 + 10 = 250. That is the equity value the target is worth at entry."},"figures":[{"caption":{"fr":"Du chiffre d'affaires à l'equity value","en":"From revenue to equity value"},"columns":["Poste","Valeur"],"rows":[["Sales (an 0)","100"],["Croissance Sales","+20%/an"],["Marge EBITDA","20%"],["EBITDA (an 0)","20"],["Multiple d'entree","12,0x"],["EV","240"],["(+) Cash net","10"],["Equity Value","250"]]}]},"piegesEntretien":[{"fr":"Confondre EV et equity value : on valorise en multiple d'EBITDA → c'est l'EV ; le vendeur encaisse l'equity value après pont de dette nette.","en":"Confusing EV and equity value: the EBITDA multiple gives you EV; the seller cashes the equity value after the net-debt bridge."},{"fr":"Croire que le meilleur candidat LBO est la société à plus forte croissance : c'est la prévisibilité des cash-flows qui prime, pas la croissance brute.","en":"Believing the best LBO candidate is the fastest-growing company: cash-flow predictability matters more than raw growth."},{"fr":"Oublier le signe du cash net : un cash net positif augmente l'equity value (EV + cash), une dette nette la réduit (EV − dette).","en":"Forgetting the sign of net cash: net cash increases equity value (EV + cash), net debt reduces it (EV − debt)."},{"fr":"Mélanger HoldCo et BidCo : la dette d'acquisition se loge en BidCo, l'equity des fonds et managers en HoldCo.","en":"Mixing up HoldCo and BidCo: acquisition debt sits in BidCo, the funds' and managers' equity in HoldCo."},{"fr":"Penser que l'effet de levier crée de la valeur intrinsèque : il amplifie le rendement et le risque, il ne crée pas de cash-flow.","en":"Thinking leverage creates intrinsic value: it amplifies return and risk, it does not create cash flow."}],"synthese":{"fr":"• LBO = rachat financé majoritairement par dette portée par la cible. • 3 leviers de rendement : désendettement, croissance EBITDA, expansion de multiple. • Candidat idéal = cash-flows stables et prévisibles > forte croissance. • Structure : sponsor → HoldCo (equity) → BidCo (dette) → OpCo. • EV = multiple × EBITDA ; Equity Value = EV − dette nette. • Exemple : EBITDA 20 × 12x = EV 240, +10 cash = equity value 250.","en":"• LBO = acquisition funded mostly by debt carried by the target. • 3 return levers: deleveraging, EBITDA growth, multiple expansion. • Ideal candidate = stable, predictable cash flows > high growth. • Structure: sponsor → HoldCo (equity) → BidCo (debt) → OpCo. • EV = multiple × EBITDA; Equity Value = EV − net debt. • Example: EBITDA 20 × 12x = EV 240, +10 cash = equity value 250."}},"glossaryRefs":["lbo","ev","equity-value","ebitda","leverage"]},{"id":"mod.l4.lbo2-sources-uses","type":"module","level":4,"topic":"LBO","tags":["LBO","Sources & Uses","unitranche","levier"],"difficulty":4,"source":{"flag":"VERIFIED","ref":"BIWS LBO guide + WSO LBO modeling (Sources & Uses)"},"title":{"fr":"Sources & Uses","en":"Sources & Uses"},"objective":{"fr":"Construire un tableau Sources & Uses qui équilibre emplois et ressources d'une opération LBO.","en":"Build a Sources & Uses table that balances the uses and sources of an LBO transaction."},"estMinutes":14,"prerequisites":["mod.l4.lbo1-paper"],"content":{"contexte":{"fr":"Le tableau Sources & Uses (Emplois & Ressources) est la première brique chiffrée d'un modèle LBO : il dit combien coûte l'opération (emplois) et d'où vient l'argent (ressources). En entretien, savoir l'équilibrer en 60 secondes et en déduire le chèque equity du sponsor est attendu.","en":"The Sources & Uses table is the first numeric building block of an LBO model: it states what the deal costs (uses) and where the money comes from (sources). In interviews, balancing it in 60 seconds and backing out the sponsor's equity cheque is expected."},"concepts":[{"heading":{"fr":"Emplois vs Ressources","en":"Uses vs Sources"},"body":{"fr":"Les Emplois (Uses) recensent tout ce qu'il faut payer : l'[[equity value]] versée au vendeur, le refinancement de la dette existante, et les frais (conseils M&A, financement, due diligence). Les Ressources (Sources) recensent le financement : la dette levée ([[term loan B]], [[unitranche]], etc.) et l'[[equity]] du sponsor, qui est la variable d'ajustement. Par construction, Total Emplois = Total Ressources.","en":"Uses list everything to be paid: the [[equity value]] to the seller, refinancing of existing debt, and fees (M&A advisory, financing, due diligence). Sources list the funding: debt raised ([[term loan B]], [[unitranche]], etc.) and the sponsor's [[equity]], which is the plug. By construction, Total Uses = Total Sources."}},{"heading":{"fr":"Le sponsor equity comme plug","en":"Sponsor equity as the plug"},"body":{"fr":"On fixe d'abord la dette par le [[levier]] cible (ex. 3,0x EBITDA), puis l'equity du sponsor est le solde : Equity sponsor = Total Emplois − Dette levée. C'est le montant que le fonds décaisse réellement et la base du calcul de [[MoM]] et d'[[IRR]] à la sortie. Plus le levier est élevé, plus le chèque equity est faible — et plus le rendement (et le risque) est amplifié.","en":"You first set debt via the target [[leverage]] (e.g. 3.0x EBITDA), then the sponsor's equity is the balancing figure: Sponsor equity = Total Uses − Debt raised. That is the cash the fund actually disburses and the base for [[MoM]] and [[IRR]] at exit. The higher the leverage, the smaller the equity cheque — and the more return (and risk) is amplified."}},{"heading":{"fr":"Les frais d'opération","en":"Transaction fees"},"body":{"fr":"Les frais (conseils financiers, juridiques, due diligence, frais de financement) gonflent les emplois et doivent être financés comme le reste. En France mid-cap, les honoraires M&A représentent ordre de grandeur 1–2% de la valeur d'opération ; les frais de financement (arrangement fee) s'ajoutent. Les oublier sous-estime le chèque equity réel.","en":"Fees (financial and legal advisors, due diligence, financing fees) inflate the uses and must be funded like everything else. In French mid-cap, M&A fees are roughly 1–2% of deal value; financing arrangement fees come on top. Forgetting them understates the real equity cheque."}},{"heading":{"fr":"Lecture du [[levier]]","en":"Reading [[leverage]]"},"body":{"fr":"Le levier s'exprime en multiple d'EBITDA : Dette nette / EBITDA. Un levier de 3,0x sur un EBITDA de 20 signifie 60 de dette. Sur le mid-cap français, le levier total observé s'établit en ordre de grandeur autour de 4,5–5,5x EBITDA selon le cycle de crédit ; un levier de 3,0x est donc conservateur. L'[[unitranche]] est souvent utilisée pour porter en une seule ligne ce levier.","en":"Leverage is expressed as an EBITDA multiple: Net debt / EBITDA. Leverage of 3.0x on EBITDA of 20 means 60 of debt. In French mid-cap, observed total leverage runs roughly 4.5–5.5x EBITDA depending on the credit cycle; 3.0x is therefore conservative. [[Unitranche]] is often used to carry this leverage in a single line."}}],"exempleChiffre":{"title":{"fr":"Deux Sources & Uses : conservateur et variante WSO","en":"Two Sources & Uses: conservative and WSO variant"},"body":{"fr":"Cas conservateur (suite du paper LBO) : Emplois = equity value 250 + frais 10 = 260. Côté ressources, on lève une [[unitranche]] de 60 (levier 3,0x sur EBITDA 20), l'equity sponsor est le solde : 260 − 60 = 200. Variante WSO : [[TEV]] de 562,5 (7,5x un EBITDA de 75), dette levée à 5,0x soit 375, equity sponsor = 562,5 − 375 = 187,5… mais avec frais l'apport sponsor ressort à 202,5. Dans les deux cas, Emplois = Ressources.","en":"Conservative case (following the paper LBO): Uses = equity value 250 + fees 10 = 260. On the sources side, raise a [[unitranche]] of 60 (3.0x leverage on EBITDA 20); sponsor equity is the balance: 260 − 60 = 200. WSO variant: [[TEV]] of 562.5 (7.5x an EBITDA of 75), debt raised at 5.0x = 375, sponsor equity = 562.5 − 375 = 187.5… but with fees the sponsor contribution comes to 202.5. In both cases, Uses = Sources."},"figures":[{"caption":{"fr":"Cas conservateur : Emplois = Ressources = 260","en":"Conservative case: Uses = Sources = 260"},"columns":["Emplois","Montant","Ressources","Montant"],"rows":[["Equity value","250","Unitranche (3,0x)","60"],["Frais","10","Equity sponsor","200"],["Total Emplois","260","Total Ressources","260"]]},{"caption":{"fr":"Variante WSO : TEV 562,5, dette 5,0x","en":"WSO variant: TEV 562.5, debt 5.0x"},"columns":["Poste","Valeur"],"rows":[["EBITDA","75"],["Multiple","7,5x"],["TEV","562,5"],["Dette (5,0x)","375"],["Equity sponsor (avec frais)","202,5"]]}]},"piegesEntretien":[{"fr":"Oublier les frais dans les emplois : ils doivent être financés, donc augmentent le chèque equity.","en":"Forgetting fees in the uses: they must be funded, so they increase the equity cheque."},{"fr":"Calculer la dette sur l'equity value au lieu de l'EBITDA : le levier est un multiple d'EBITDA, pas un % du prix.","en":"Sizing debt off equity value instead of EBITDA: leverage is an EBITDA multiple, not a % of price."},{"fr":"Ne pas équilibrer le tableau : si Emplois ≠ Ressources, l'equity sponsor (le plug) a été mal calculé.","en":"Not balancing the table: if Uses ≠ Sources, the sponsor equity (the plug) was miscomputed."},{"fr":"Confondre TEV/EV et equity value côté emplois : on paie l'equity value au vendeur, pas l'EV brute (sauf refinancement de dette existante explicité).","en":"Confusing TEV/EV with equity value in the uses: you pay the seller the equity value, not gross EV (unless refinancing existing debt is shown explicitly)."}],"synthese":{"fr":"• Emplois (equity value + refinancement + frais) = Ressources (dette + equity sponsor). • Equity sponsor = plug = Total emplois − dette levée. • Dette dimensionnée par le levier (multiple d'EBITDA). • Cas conservateur : 250 + 10 = 260 = 60 unitranche + 200 equity. • Variante WSO : TEV 562,5 (7,5x×75), dette 375 (5,0x), equity sponsor 202,5. • Frais M&A FR ~1–2% de la valeur d'opération.","en":"• Uses (equity value + refinancing + fees) = Sources (debt + sponsor equity). • Sponsor equity = plug = Total uses − debt raised. • Debt sized by leverage (EBITDA multiple). • Conservative case: 250 + 10 = 260 = 60 unitranche + 200 equity. • WSO variant: TEV 562.5 (7.5x×75), debt 375 (5.0x), sponsor equity 202.5. • French M&A fees ~1–2% of deal value."}},"glossaryRefs":["sources-uses","unitranche","leverage","equity-value","tev"]},{"id":"mod.l4.lbo3-levfin","type":"module","level":4,"topic":"LevFin","tags":["LevFin","term loan B","mezzanine","PIK","covenants"],"difficulty":4,"source":{"flag":"VERIFIED","ref":"Moody's/S&P LevFin primers + Vernimmen (tranches de dette)"},"title":{"fr":"Tranches de dette & LevFin","en":"Debt tranches & LevFin"},"objective":{"fr":"Identifier les tranches de dette LBO, leur hiérarchie de coût et la distinction covenants maintenance vs incurrence.","en":"Identify LBO debt tranches, their cost hierarchy, and the maintenance vs incurrence covenant distinction."},"estMinutes":16,"prerequisites":["mod.l4.lbo2-sources-uses"],"content":{"contexte":{"fr":"Le financement à effet de levier (LevFin) structure la dette d'un LBO en tranches de séniorité et de coût croissants. Savoir nommer ces tranches, classer leur coût et expliquer les covenants est un marqueur de crédibilité en entretien LBO et en équipe debt advisory.","en":"Leveraged finance (LevFin) structures LBO debt into tranches of increasing seniority and cost. Naming these tranches, ranking their cost, and explaining covenants is a credibility marker in LBO interviews and debt advisory teams."},"concepts":[{"heading":{"fr":"Dette senior secured","en":"Senior secured debt"},"body":{"fr":"Au sommet de la structure : le [[revolver]] (RCF, ligne renouvelable pour le besoin en fonds de roulement, souvent non tirée), puis le [[term loan B]] (TLB, prêt à terme amortissable in fine, à taux variable). Cette [[senior debt]] est garantie (secured) par les actifs et premier servie : c'est la tranche la moins chère car la moins risquée. Les senior secured notes sont l'équivalent obligataire émis sur le marché.","en":"At the top of the structure: the [[revolver]] (RCF, a revolving line for working capital, often undrawn), then the [[term loan B]] (TLB, a bullet term loan at a floating rate). This [[senior debt]] is secured on the assets and first to be served: it is the cheapest tranche because the least risky. Senior secured notes are the bond-market equivalent."}},{"heading":{"fr":"Dette subordonnée et [[mezzanine]]","en":"Subordinated and [[mezzanine]] debt"},"body":{"fr":"Sous la dette senior se trouvent les subordinated notes et la [[mezzanine]] : remboursées après la dette senior en cas de défaut, donc plus risquées et plus chères. La mezzanine combine souvent un coupon cash, une part [[PIK]] et parfois des warrants (equity kicker). Elle comble l'écart entre la dette senior et l'equity quand le levier visé dépasse ce que la dette senior accepte.","en":"Below senior debt sit subordinated notes and [[mezzanine]]: repaid after senior debt in a default, hence riskier and pricier. Mezzanine often combines a cash coupon, a [[PIK]] portion and sometimes warrants (equity kicker). It bridges the gap between senior debt and equity when target leverage exceeds what senior debt accepts."}},{"heading":{"fr":"Cash interest vs [[PIK]]","en":"Cash interest vs [[PIK]]"},"body":{"fr":"Les intérêts cash sont décaissés chaque période et pèsent sur le [[free cash flow]] disponible pour le désendettement. Les intérêts [[PIK]] (Payment-In-Kind) ne sont pas payés en cash : ils capitalisent dans le principal, préservant la trésorerie à court terme mais gonflant la dette à rembourser à terme. Le PIK est l'instrument le plus cher car le prêteur supporte le risque le plus longtemps et le plus subordonné.","en":"Cash interest is disbursed each period and weighs on the [[free cash flow]] available for deleveraging. [[PIK]] interest (Payment-In-Kind) is not paid in cash: it capitalises into principal, preserving short-term liquidity but inflating the debt to repay later. PIK is the most expensive instrument because the lender bears the most subordinated risk for the longest time."}},{"heading":{"fr":"Covenants : maintenance vs incurrence","en":"Covenants: maintenance vs incurrence"},"body":{"fr":"Les covenants maintenance imposent de respecter des ratios financiers à chaque période de test (ex. levier net < 5,5x testé chaque trimestre) — un dérapage déclenche un défaut technique. Les covenants incurrence ne sont testés qu'à l'occasion d'une action (nouvelle dette, dividende, acquisition) : ils sont plus souples. Les financements 'cov-lite' (typiques du TLB de marché) n'ont quasiment que de l'incurrence, donnant plus de latitude à l'emprunteur.","en":"Maintenance covenants require meeting financial ratios at each test date (e.g. net leverage < 5.5x tested each quarter) — a breach triggers a technical default. Incurrence covenants are only tested when the borrower takes an action (new debt, dividend, acquisition): they are looser. 'Cov-lite' financings (typical of market TLB) carry essentially only incurrence covenants, giving the borrower more latitude."}},{"heading":{"fr":"Hiérarchie de coût et levier mid-cap","en":"Cost hierarchy and mid-cap leverage"},"body":{"fr":"Le coût suit la séniorité inversée : [[senior debt]] (revolver, TLB) la moins chère, puis [[unitranche]] (qui fond senior + junior en une ligne, donc à coût intermédiaire), puis mezzanine, et enfin le [[PIK]] le plus cher. Sur le mid-cap français, le levier total se situe en ordre de grandeur autour de 4,5–5,5x EBITDA, l'unitranche étant l'instrument dominant des deals sponsorisés par les fonds de dette privée.","en":"Cost follows inverted seniority: [[senior debt]] (revolver, TLB) cheapest, then [[unitranche]] (which merges senior + junior into one line, hence intermediate cost), then mezzanine, and finally [[PIK]] the most expensive. In French mid-cap, total leverage runs roughly 4.5–5.5x EBITDA, with unitranche the dominant instrument in private-debt-sponsored deals."}}],"exempleChiffre":{"title":{"fr":"Classer les tranches par coût","en":"Ranking tranches by cost"},"body":{"fr":"Sur un EBITDA de 20 et un levier total de 5,0x (100 de dette), une structure mixte pourrait combiner un TLB senior à marge faible, une unitranche à coût intermédiaire et une poche mezzanine/PIK à coût élevé. Les fourchettes de marge ci-dessous sont des ordres de grandeur indicatifs, variables selon le cycle de crédit ; elles illustrent la hiérarchie senior < unitranche < mezzanine < PIK.","en":"On EBITDA of 20 and total leverage of 5.0x (100 of debt), a blended structure might combine a low-margin senior TLB, an intermediate-cost unitranche and a high-cost mezzanine/PIK pocket. The margin ranges below are indicative orders of magnitude, varying with the credit cycle; they illustrate the hierarchy senior < unitranche < mezzanine < PIK."},"figures":[{"caption":{"fr":"Hiérarchie de coût des tranches (ordres de grandeur, marge sur Euribor)","en":"Tranche cost hierarchy (orders of magnitude, margin over Euribor)"},"columns":["Tranche","Seniorite","Cout indicatif"],"rows":[["Revolver / TLB (senior secured)","1ere","le moins cher (~+3-4%)"],["Unitranche","fusion senior+junior","intermediaire (~+6-7%)"],["Mezzanine","subordonnee","eleve (~+8-12%, cash+PIK)"],["PIK pur","la plus junior","le plus cher (~+10-15%)"]]}]},"piegesEntretien":[{"fr":"Classer le coût à l'envers : la dette senior secured est la MOINS chère, le PIK la PLUS chère ; l'unitranche est entre les deux.","en":"Ranking cost backwards: senior secured debt is the CHEAPEST, PIK the MOST expensive; unitranche sits in between."},{"fr":"Croire que le PIK améliore le rendement gratuitement : il préserve le cash court terme mais gonfle la dette finale, donc réduit l'equity de sortie.","en":"Thinking PIK boosts returns for free: it preserves short-term cash but inflates the final debt, reducing exit equity."},{"fr":"Inverser maintenance et incurrence : maintenance = testé périodiquement (plus strict) ; incurrence = testé sur action (plus souple, cov-lite).","en":"Swapping maintenance and incurrence: maintenance = tested periodically (stricter); incurrence = tested on an action (looser, cov-lite)."},{"fr":"Présenter l'unitranche comme de la dette junior : c'est une tranche unique fusionnant senior et junior, à coût et séniorité intermédiaires.","en":"Presenting unitranche as junior debt: it is a single tranche merging senior and junior, at intermediate cost and seniority."},{"fr":"Donner un levier mid-cap FR précis comme un fait : c'est un ordre de grandeur (~4,5–5,5x) qui bouge avec le cycle de crédit.","en":"Quoting a precise French mid-cap leverage as fact: it is an order of magnitude (~4.5–5.5x) that moves with the credit cycle."}],"synthese":{"fr":"• Tranches : revolver, term loan B, senior secured notes, subordinated, mezzanine, PIK. • Cash interest pèse sur le FCF ; PIK capitalise dans le principal. • Covenants maintenance (testés périodiquement, stricts) vs incurrence (sur action, souples, cov-lite). • Coût croissant : senior debt < unitranche < mezzanine < PIK. • Levier total mid-cap FR ~4,5–5,5x EBITDA.","en":"• Tranches: revolver, term loan B, senior secured notes, subordinated, mezzanine, PIK. • Cash interest weighs on FCF; PIK capitalises into principal. • Maintenance covenants (periodic, strict) vs incurrence (on action, loose, cov-lite). • Rising cost: senior debt < unitranche < mezzanine < PIK. • French mid-cap total leverage ~4.5–5.5x EBITDA."}},"glossaryRefs":["revolver","term-loan-b","mezzanine","pik","senior-debt","unitranche","covenant"]},{"id":"mod.l4.lbo4-paydown","type":"module","level":4,"topic":"LBO","tags":["LBO","cash sweep","debt paydown","deleveraging"],"difficulty":4,"source":{"flag":"VERIFIED","ref":"BIWS LBO guide + Vernimmen + dataroom LBO Paper Bridgepoint"},"title":{"fr":"Paydown de dette & cash sweep","en":"Debt paydown & cash sweep"},"objective":{"fr":"Comprendre comment le free cash flow rembourse la dette d'un LBO et crée de la valeur pour l'equity par désendettement.","en":"Understand how free cash flow repays LBO debt and creates equity value through deleveraging."},"estMinutes":16,"prerequisites":[],"content":{"contexte":{"fr":"Dans un LBO, la dette représente souvent 50–70% du prix d'achat. Pendant la période de détention, le [[free cash flow]] de la société sert à rembourser cette dette : c'est le moteur silencieux de la création de valeur. En entretien, savoir dérouler un schéma de remboursement et le mécanisme du [[cash sweep]] distingue un candidat sérieux.","en":"In an LBO, debt often represents 50–70% of the purchase price. During the holding period, the company's [[free cash flow]] is used to repay that debt: this is the silent engine of value creation. In interviews, being able to walk through a repayment schedule and the [[cash sweep]] mechanism sets a serious candidate apart."},"concepts":[{"heading":{"fr":"Le FCF rembourse la dette","en":"FCF repays debt"},"body":{"fr":"Le [[free cash flow]] disponible après intérêts, impôts et capex sert prioritairement à rembourser le capital de la dette. Chaque euro remboursé réduit la dette nette, donc augmente la part d'equity dans la structure de capital. À EV constante, moins de dette nette signifie mécaniquement plus de valeur pour l'actionnaire à la sortie.","en":"The [[free cash flow]] available after interest, taxes and capex is used first to repay debt principal. Each euro repaid reduces net debt, thereby increasing the equity share of the capital structure. At constant EV, less net debt mechanically means more value for the shareholder at exit."}},{"heading":{"fr":"Le cash sweep","en":"The cash sweep"},"body":{"fr":"Le [[cash sweep]] est une clause contractuelle obligeant l'emprunteur à affecter tout ou partie de l'[[excess cash flow]] au remboursement anticipé de la dette, au-delà de l'amortissement contractuel. Concrètement, le cash de clôture excédentaire (au-dessus d'un solde minimum d'exploitation) « balaie » la tranche la plus chère ou la plus prioritaire. Cela accélère le désendettement et réduit la charge d'intérêts des années suivantes.","en":"The [[cash sweep]] is a contractual clause obliging the borrower to apply all or part of [[excess cash flow]] to prepay debt, beyond the contractual amortization. In practice, excess closing cash (above a minimum operating balance) sweeps the most expensive or most senior tranche. This accelerates deleveraging and lowers interest expense in following years."}},{"heading":{"fr":"Capital restant dû","en":"Outstanding principal"},"body":{"fr":"Le capital restant dû en fin d'année = capital d'ouverture − amortissement obligatoire − cash sweep. Il faut le suivre tranche par tranche (Senior, [[unitranche]], mezzanine) car chacune a sa séniorité et son coût. Le solde de dette en fin de période de détention détermine directement la dette nette de sortie.","en":"The outstanding principal at year-end = opening principal − mandatory amortization − cash sweep. It must be tracked tranche by tranche (Senior, [[unitranche]], mezzanine) because each has its own seniority and cost. The debt balance at the end of the holding period directly drives exit net debt."}},{"heading":{"fr":"Désendettement = création de valeur","en":"Deleveraging = value creation"},"body":{"fr":"Le désendettement est l'un des trois leviers de création de valeur en LBO. Même sans croissance de l'EBITDA ni [[multiple expansion]], rembourser la dette transfère de la valeur des créanciers vers les actionnaires. C'est pourquoi les sponsors privilégient des cibles très [[cash generative]] avec un capex faible.","en":"Deleveraging is one of the three value-creation levers in an LBO. Even without EBITDA growth or [[multiple expansion]], repaying debt transfers value from creditors to shareholders. This is why sponsors favor highly [[cash generative]] targets with low capex."}}],"exempleChiffre":{"title":{"fr":"Exemple chiffré — paydown Bridgepoint","en":"Worked example — Bridgepoint paydown"},"body":{"fr":"On part d'une dette brute initiale et d'un FCF croissant (en M€) : Y1 2,0 ; Y2 3,2 ; Y3 4,6 ; Y4 6,0 ; Y5 8,0. Avec un solde de cash d'ouverture, on accumule le cash disponible chaque année (cash sweep partiel : le cash s'accumule au bilan avant balayage). Le cash cumulé de clôture en fin d'année 3 s'établit à environ 27,7 M€ (≈ solde initial + 2,0 + 3,2 + 4,6 et capitalisation des soldes). Ce cash réduit la dette nette : dette nette = dette brute − cash. Plus le FCF est élevé et croissant, plus le désendettement est rapide.","en":"We start from an initial gross debt and growing FCF (in €m): Y1 2.0; Y2 3.2; Y3 4.6; Y4 6.0; Y5 8.0. With an opening cash balance, available cash accumulates each year (partial cash sweep: cash builds on the balance sheet before sweeping). Cumulative closing cash at the end of year 3 stands at roughly €27.7m (≈ opening balance + 2.0 + 3.2 + 4.6 and carried balances). This cash reduces net debt: net debt = gross debt − cash. The higher and faster-growing the FCF, the faster the deleveraging."},"figures":[{"caption":{"fr":"FCF annuel et cash cumulé (M€)","en":"Annual FCF and cumulative cash (€m)"},"columns":["Année","FCF","Cash cumulé clôture"],"rows":[["Y1","2,0","~17,9"],["Y2","3,2","~21,1"],["Y3","4,6","~27,7"],["Y4","6,0","~33,7"],["Y5","8,0","~41,7"]]}]},"piegesEntretien":[{"fr":"Confondre amortissement obligatoire et cash sweep : l'amortissement est contractuel et fixe, le cash sweep est conditionnel à l'excès de cash.","en":"Confusing mandatory amortization with cash sweep: amortization is contractual and fixed, the cash sweep is conditional on excess cash."},{"fr":"Oublier qu'on rembourse le capital, pas les intérêts : les intérêts sont une charge du compte de résultat, le remboursement de principal réduit le bilan.","en":"Forgetting that you repay principal, not interest: interest is a P&L expense, principal repayment reduces the balance sheet."},{"fr":"Croire que la dette doit être totalement remboursée à la sortie : on revend souvent avec un solde de dette résiduel, repris ou refinancé par l'acheteur.","en":"Believing debt must be fully repaid at exit: companies are often sold with a residual debt balance, assumed or refinanced by the buyer."},{"fr":"Ne pas garder un solde de cash minimum d'exploitation avant de balayer : un cash sweep à 100% peut assécher la trésorerie opérationnelle.","en":"Failing to keep a minimum operating cash balance before sweeping: a 100% cash sweep can starve operating liquidity."}],"synthese":{"fr":"• Le [[free cash flow]] rembourse le principal de la dette → désendettement.\n• [[cash sweep]] = remboursement anticipé conditionnel de l'excès de cash.\n• Dette nette = dette brute − cash ; chez Bridgepoint, cash clôture Y3 ≈ 27,7 M€.\n• Désendettement = levier de valeur même sans croissance d'EBITDA.\n• Suivre le capital restant dû tranche par tranche.","en":"• [[free cash flow]] repays debt principal → deleveraging.\n• [[cash sweep]] = conditional prepayment of excess cash.\n• Net debt = gross debt − cash; for Bridgepoint, Y3 closing cash ≈ €27.7m.\n• Deleveraging is a value lever even without EBITDA growth.\n• Track outstanding principal tranche by tranche."}},"glossaryRefs":["cash-sweep","free-cash-flow","net-debt","deleveraging"]},{"id":"mod.l4.lbo5-returns","type":"module","level":4,"topic":"LBO","tags":["LBO","MoM","IRR","value creation","exit"],"difficulty":4,"source":{"flag":"VERIFIED","ref":"BIWS LBO guide + WSO + Vernimmen + dataroom LBO Paper Bridgepoint"},"title":{"fr":"Retours du fonds : MoM, IRR et leviers de valeur","en":"Fund returns: MoM, IRR and value levers"},"objective":{"fr":"Calculer le [[MoM]] et l'[[IRR]] d'un LBO et identifier les trois vrais leviers de création de valeur.","en":"Compute the [[MoM]] and [[IRR]] of an LBO and identify the three real value-creation levers."},"estMinutes":18,"prerequisites":["mod.l4.lbo4-paydown"],"content":{"contexte":{"fr":"Le rendement d'un fonds de [[private equity]] se mesure d'abord par le [[MoM]] (multiple sur la mise) et l'[[IRR]] (taux de rentabilité interne). Savoir les calculer sans erreur — et surtout ne pas oublier de déduire la dette nette à la sortie — est le test le plus fréquent en entretien LBO.","en":"A [[private equity]] fund's return is measured first by [[MoM]] (multiple on invested capital) and [[IRR]] (internal rate of return). Computing them without error — and crucially not forgetting to deduct exit net debt — is the most common LBO interview test."},"concepts":[{"heading":{"fr":"MoM et equity de sortie","en":"MoM and exit equity"},"body":{"fr":"Le [[MoM]] (Multiple of Money, aussi [[MOIC]]) = equity de sortie / equity d'entrée. L'equity de sortie = EV de sortie − dette nette de sortie. L'erreur classique est de prendre l'EV de sortie comme equity en oubliant de soustraire la dette nette résiduelle. L'EV de sortie = EBITDA de sortie × multiple de sortie.","en":"[[MoM]] (Multiple of Money, also [[MOIC]]) = exit equity / entry equity. Exit equity = exit EV − exit net debt. The classic mistake is to take exit EV as equity, forgetting to subtract residual net debt. Exit EV = exit EBITDA × exit multiple."}},{"heading":{"fr":"IRR","en":"IRR"},"body":{"fr":"Pour un flux unique entrée/sortie, l'[[IRR]] = [[MoM]]^(1/n) − 1, où n est le nombre d'années de détention. L'IRR pénalise la durée : un même MoM atteint plus vite donne un IRR plus élevé. Un [[dividend recap]] en cours de détention améliore l'IRR en avançant un flux de cash aux actionnaires.","en":"For a single in/out cash flow, [[IRR]] = [[MoM]]^(1/n) − 1, where n is the number of holding years. IRR penalizes duration: the same MoM reached faster gives a higher IRR. A [[dividend recap]] during the hold improves IRR by pulling forward a cash flow to shareholders."}},{"heading":{"fr":"Les trois leviers de création de valeur","en":"The three value-creation levers"},"body":{"fr":"La valeur en LBO vient de trois leviers : (1) la croissance de l'EBITDA (amélioration opérationnelle, marges), (2) le [[multiple expansion]] (revendre à un multiple supérieur), (3) le désendettement (remboursement de la dette par le [[free cash flow]]). Attention : la croissance du chiffre d'affaires seule n'est PAS un levier — c'est la croissance de l'EBITDA (CA × marge) qui crée de la valeur, pas le top-line en soi.","en":"LBO value comes from three levers: (1) EBITDA growth (operational improvement, margins), (2) [[multiple expansion]] (selling at a higher multiple), (3) deleveraging (debt repayment via [[free cash flow]]). Note: revenue growth alone is NOT a lever — it is EBITDA growth (revenue × margin) that creates value, not the top line per se."}},{"heading":{"fr":"La sortie : l'acheteur stratégique","en":"The exit: the strategic buyer"},"body":{"fr":"La meilleure sortie est généralement la vente à un acheteur stratégique (un industriel du secteur) car il peut payer les [[synergies]] — économies de coûts et revenus croisés — qu'un fonds financier ne valorise pas. Les autres voies : [[secondary buyout]] (revente à un autre fonds), IPO, ou [[dividend recap]] pour cristalliser du rendement sans vendre.","en":"The best exit is generally a sale to a strategic buyer (an industry player) because it can pay for [[synergies]] — cost savings and cross-revenues — that a financial buyer does not value. Other routes: [[secondary buyout]] (resale to another fund), IPO, or a [[dividend recap]] to crystallize returns without selling."}},{"heading":{"fr":"Règles de pouce","en":"Rules of thumb"},"body":{"fr":"Pour calibrer un IRR mentalement : 3x sur 3 ans ≈ 45% d'[[IRR]] ; 2x sur 3 ans ≈ 25% d'IRR ; 2x sur 5 ans ≈ 15%. Ces repères permettent de sanity-checker un modèle en entretien sans calculatrice.","en":"To gauge IRR mentally: 3x over 3 years ≈ 45% [[IRR]]; 2x over 3 years ≈ 25% IRR; 2x over 5 years ≈ 15%. These benchmarks let you sanity-check a model in an interview without a calculator."}}],"exempleChiffre":{"title":{"fr":"Exemple chiffré — sortie Bridgepoint","en":"Worked example — Bridgepoint exit"},"body":{"fr":"EV de sortie = 415 M€. Dette nette de sortie = dette brute 60 − cash 27,7 = 32,3 M€. Equity de sortie = 415 − 32,3 = 382,7 M€. Equity injectée à l'entrée = 200 M€. [[MoM]] = 382,7 / 200 ≈ 1,9x. C'est le calcul correct. La dataroom annonçait 2,1x en oubliant de déduire la dette nette de sortie — une erreur de méthode, pas d'arithmétique. Sur 3 ans, un MoM de 1,9x correspond à un IRR ≈ 1,9^(1/3) − 1 ≈ 24%.","en":"Exit EV = €415m. Exit net debt = gross debt 60 − cash 27.7 = €32.3m. Exit equity = 415 − 32.3 = €382.7m. Equity injected at entry = €200m. [[MoM]] = 382.7 / 200 ≈ 1.9x. That is the correct computation. The dataroom reported 2.1x by forgetting to deduct exit net debt — a method error, not an arithmetic one. Over 3 years, a 1.9x MoM corresponds to an IRR ≈ 1.9^(1/3) − 1 ≈ 24%."},"figures":[{"caption":{"fr":"Pont de l'equity de sortie (M€)","en":"Exit equity bridge (€m)"},"columns":["Poste","Valeur"],"rows":[["EV de sortie","415,0"],["− Dette brute","60,0"],["+ Cash","27,7"],["= Dette nette sortie","32,3"],["= Equity de sortie","382,7"],["Equity d'entrée","200,0"],["MoM","≈ 1,9x"]]}]},"piegesEntretien":[{"fr":"Oublier de déduire la dette nette à la sortie : c'est l'erreur exacte de la dataroom Bridgepoint (2,1x annoncé au lieu de 1,9x).","en":"Forgetting to deduct exit net debt: this is the exact Bridgepoint dataroom error (2.1x reported instead of 1.9x)."},{"fr":"Confondre croissance du CA et croissance de l'EBITDA : seule la seconde est un levier de valeur.","en":"Confusing revenue growth with EBITDA growth: only the latter is a value lever."},{"fr":"Penser qu'un acheteur financier paie autant qu'un stratégique : le stratégique paie les synergies, pas le fonds.","en":"Thinking a financial buyer pays as much as a strategic one: the strategic pays for synergies, the fund does not."},{"fr":"Calculer l'IRR comme MoM/n au lieu de MoM^(1/n)−1 : c'est un taux composé, pas linéaire.","en":"Computing IRR as MoM/n instead of MoM^(1/n)−1: it is a compound rate, not linear."},{"fr":"Confondre [[MoM]] et IRR : un MoM élevé sur 10 ans peut donner un IRR médiocre.","en":"Confusing [[MoM]] and IRR: a high MoM over 10 years can yield a mediocre IRR."}],"synthese":{"fr":"• [[MoM]] = equity sortie / equity entrée ; equity sortie = EV sortie − dette nette sortie.\n• [[IRR]] = MoM^(1/n) − 1 ; 3x/3 ans ≈ 45%, 2x/3 ans ≈ 25%.\n• 3 leviers : EBITDA, [[multiple expansion]], désendettement. CA seul ≠ levier.\n• Meilleure sortie = acheteur stratégique (paie les synergies).\n• [[dividend recap]] = rendement avancé sans vendre.\n• Bridgepoint : MoM correct ≈ 1,9x (pas 2,1x).","en":"• [[MoM]] = exit equity / entry equity; exit equity = exit EV − exit net debt.\n• [[IRR]] = MoM^(1/n) − 1; 3x/3y ≈ 45%, 2x/3y ≈ 25%.\n• 3 levers: EBITDA, [[multiple expansion]], deleveraging. Revenue alone ≠ lever.\n• Best exit = strategic buyer (pays for synergies).\n• [[dividend recap]] = returns pulled forward without selling.\n• Bridgepoint: correct MoM ≈ 1.9x (not 2.1x)."}},"correction":{"kind":"error","needsReview":false,"note":{"fr":"corrigé : la source indiquait 2,1x en oubliant la dette nette à la sortie ; la valeur exacte est ≈ 1,9x.","en":"corrected: the source reported 2.1x by omitting exit net debt; the exact value is ≈ 1.9x."}},"glossaryRefs":["mom","irr","multiple-expansion","dividend-recap","moic"]},{"id":"mod.l4.ma1-process","type":"module","level":4,"topic":"M&A","tags":["M&A","process","due diligence","SPA"],"difficulty":4,"source":{"flag":"VERIFIED","ref":"Vernimmen + pratique M&A sell-side / buy-side"},"title":{"fr":"Le process M&A, de l'origination au closing","en":"The M&A process, from origination to closing"},"objective":{"fr":"Dérouler les étapes d'une cession ou acquisition et savoir quand intervient chaque document clé.","en":"Walk through the steps of a sale or acquisition and know when each key document comes into play."},"estMinutes":16,"prerequisites":[],"content":{"contexte":{"fr":"En entretien M&A, on attend de vous que vous récitiez le déroulé d'un deal sans hésiter : quel document, à quel moment, signé par qui. Maîtriser ce séquencement distingue le candidat sérieux du candidat qui a seulement lu un blog. C'est aussi la trame de votre quotidien d'analyste, du pitch jusqu'au closing.","en":"In an M&A interview, you are expected to recite the flow of a deal without hesitation: which document, at which moment, signed by whom. Mastering this sequencing separates the serious candidate from the one who merely read a blog. It is also the backbone of an analyst's daily life, from the pitch to closing."},"concepts":[{"heading":{"fr":"Le séquencement standard","en":"The standard sequencing"},"body":{"fr":"Une cession structurée suit un ordre précis : le banquier diffuse d'abord un [[teaser]] anonyme pour susciter l'intérêt, puis fait signer un [[NDA]] (accord de confidentialité) avant de remettre l'[[information memorandum]] (IM, ou mémorandum d'information) détaillé. Les acquéreurs intéressés déposent une lettre d'intention non engageante, le [[NBO]] (non-binding offer). Les candidats retenus accèdent à la dataroom pour la [[due diligence]], puis remettent une offre ferme (binding offer). Les négociations aboutissent à la signature du [[SPA]] (Share Purchase Agreement), suivie du closing.","en":"A structured sale follows a precise order: the banker first circulates an anonymous [[teaser]] to spark interest, then has buyers sign an [[NDA]] (non-disclosure agreement) before handing over the detailed [[information memorandum]] (IM). Interested buyers submit a non-binding letter, the [[NBO]] (non-binding offer). Shortlisted candidates access the dataroom for [[due diligence]], then submit a binding offer. Negotiations lead to signing the [[SPA]] (Share Purchase Agreement), followed by closing."}},{"heading":{"fr":"Sell-side vs buy-side","en":"Sell-side vs buy-side"},"body":{"fr":"En mandat sell-side, la banque représente le vendeur : elle prépare l'IM, organise le process et cherche à maximiser le prix et la certitude d'exécution. En buy-side, elle conseille l'acquéreur : sourcing de cibles, valorisation, structuration du financement et négociation à la baisse. Un même deal a presque toujours des conseils des deux côtés, avec des intérêts opposés.","en":"On a sell-side mandate, the bank represents the seller: it prepares the IM, runs the process, and seeks to maximise price and execution certainty. On buy-side, it advises the buyer: target sourcing, valuation, financing structuring, and negotiating the price down. The same deal almost always has advisers on both sides, with opposing interests."}},{"heading":{"fr":"Enchères vs gré à gré","en":"Auction vs bilateral"},"body":{"fr":"Une vente aux enchères (auction) met plusieurs acheteurs en concurrence pour faire monter le prix ; elle est plus longue, plus formelle, et risque de fuites. Le gré à gré (negotiated / bilateral deal) traite avec un seul acquéreur : plus rapide, plus confidentiel, mais sans tension concurrentielle pour soutenir le prix. Le vendeur arbitre entre prix maximal et discrétion.","en":"An auction puts several buyers in competition to push the price up; it is longer, more formal, and carries leak risk. A negotiated (bilateral) deal works with a single buyer: faster, more confidential, but without competitive tension to support the price. The seller trades off maximum price against discretion."}},{"heading":{"fr":"Mécanismes de prix : l'earn-out","en":"Price mechanisms: the earn-out"},"body":{"fr":"Quand vendeur et acquéreur divergent sur la valeur (souvent sur les projections futures), un [[earn-out]] permet d'indexer une partie du prix sur la performance post-acquisition (EBITDA ou chiffre d'affaires à N+1, N+2). Cela comble l'écart de valorisation mais crée des conflits sur le pilotage de la société pendant la période d'earn-out.","en":"When seller and buyer diverge on value (often on future projections), an [[earn-out]] indexes part of the price to post-acquisition performance (EBITDA or revenue at Y+1, Y+2). It bridges the valuation gap but creates conflicts over how the company is run during the earn-out period."}}],"exempleChiffre":{"title":{"fr":"Exemple chiffré : les frais M&A","en":"Worked example: M&A fees"},"body":{"fr":"Sur une cession d'entreprise valorisée 200 M€, des frais M&A de 1 à 2 % de la valeur de transaction représentent 2 à 4 M€ de commission conseil (success fee), généralement complétés d'un retainer mensuel. Les frais en pourcentage diminuent sur les très gros deals et augmentent sur les small-caps.","en":"On a sale valued at €200m, M&A fees of 1 to 2% of the transaction value represent €2m to €4m of advisory commission (success fee), usually plus a monthly retainer. The percentage fee shrinks on very large deals and rises on small-caps."},"figures":[{"caption":{"fr":"Frais conseil selon le taux","en":"Advisory fee by rate"},"columns":["Valeur (M€)","1%","2%"],"rows":[["200","2,0","4,0"],["500","5,0","10,0"]]}]},"piegesEntretien":[{"fr":"Confondre teaser et IM : le teaser est anonyme et court, l'IM est nominatif et détaillé, remis seulement après NDA.","en":"Confusing teaser and IM: the teaser is anonymous and short, the IM is named and detailed, handed over only after the NDA."},{"fr":"Croire que le NBO est engageant : il ne l'est pas, seule la binding offer (après due diligence) engage l'acquéreur.","en":"Believing the NBO is binding: it is not; only the binding offer (after due diligence) commits the buyer."},{"fr":"Oublier la distinction signing / closing : on signe le SPA puis on attend les conditions suspensives (autorisations antitrust) avant le closing effectif.","en":"Forgetting the signing / closing distinction: the SPA is signed, then one waits for conditions precedent (antitrust approvals) before actual closing."},{"fr":"Annoncer un earn-out comme une solution sans risque : il génère des litiges fréquents sur le calcul et la gestion post-deal.","en":"Pitching an earn-out as risk-free: it frequently generates disputes over the calculation and post-deal management."}],"synthese":{"fr":"• Ordre : teaser → NDA → IM → NBO → due diligence → binding offer → SPA → closing.\n• Sell-side = vendeur, buy-side = acheteur.\n• Enchères = prix max ; gré à gré = discrétion et rapidité.\n• Earn-out = comble l'écart de valeur mais sources de litiges.\n• Frais M&A ≈ 1–2 % de la valeur de transaction.","en":"• Order: teaser → NDA → IM → NBO → due diligence → binding offer → SPA → closing.\n• Sell-side = seller, buy-side = buyer.\n• Auction = max price; bilateral = discretion and speed.\n• Earn-out = bridges value gap but a source of disputes.\n• M&A fees ≈ 1–2% of transaction value."}},"glossaryRefs":["teaser","information-memorandum","nda","due-diligence","nbo","spa","earn-out"]},{"id":"mod.l4.ma2-accretion","type":"module","level":4,"topic":"M&A","tags":["M&A","accretion/dilution","EPS","synergies"],"difficulty":4,"source":{"flag":"VERIFIED","ref":"BIWS Merger Model + pratique accretion/dilution"},"title":{"fr":"Synergies et accretion / dilution du BPA","en":"Synergies and EPS accretion / dilution"},"objective":{"fr":"Déterminer si une acquisition est relutive ou dilutive et expliquer pourquoi le ratio d'échange peut dominer le simple écart de P/E.","en":"Determine whether an acquisition is accretive or dilutive and explain why the exchange ratio can dominate a simple P/E gap."},"estMinutes":18,"prerequisites":["mod.l4.ma1-process"],"content":{"contexte":{"fr":"L'analyse [[accretion/dilution]] est le premier réflexe de tout banquier M&A : un deal est accretive s'il augmente le BPA ([[EPS]]) pro forma de l'acquéreur, dilutive s'il le réduit. Les comités d'investissement et les marchés y réagissent immédiatement. C'est aussi le calcul mental classique en entretien.","en":"The [[accretion/dilution]] analysis is every M&A banker's first reflex: a deal is accretive if it raises the acquirer's pro forma EPS ([[EPS]]), dilutive if it lowers it. Investment committees and markets react to it instantly. It is also the classic mental-math question in interviews."},"concepts":[{"heading":{"fr":"La règle de base","en":"The basic rule"},"body":{"fr":"Un deal est relutif (accretive) si le BPA post-deau de l'acquéreur monte, dilutif s'il baisse. La règle de pouce souvent citée : acheter une cible à un P/E plus bas que le sien est relutif si le deal est financé en cash ou en dette, car le rendement de la cible (l'inverse de son P/E) dépasse le coût après impôt du financement. Mais cette règle de pouce n'est qu'une approximation : le mode et le ratio de financement comptent.","en":"A deal is accretive if the acquirer's post-deal EPS rises, dilutive if it falls. The often-quoted rule of thumb: buying a target at a lower P/E than your own is accretive if the deal is funded with cash or debt, because the target's yield (the inverse of its P/E) exceeds the after-tax cost of financing. But this rule of thumb is only an approximation: the financing mix and ratio matter."}},{"heading":{"fr":"Pourquoi le ratio d'échange domine en paiement actions","en":"Why the exchange ratio dominates in stock deals"},"body":{"fr":"En financement par actions, l'acquéreur émet de nouvelles actions pour payer la cible. Le résultat dépend alors du nombre d'actions émises par rapport au résultat net apporté : c'est le ratio d'échange (exchange ratio) qui pilote la relution. Une cible « moins chère » en P/E peut être dilutive si l'acquéreur doit émettre proportionnellement trop d'actions au regard du bénéfice qu'elle apporte.","en":"In stock financing, the acquirer issues new shares to pay for the target. The outcome then depends on the number of shares issued relative to the net income brought in: it is the exchange ratio that drives accretion. A target that looks 'cheaper' on P/E can still be dilutive if the acquirer must issue proportionally too many shares for the earnings it contributes."}},{"heading":{"fr":"Synergies de coûts et de revenus","en":"Cost and revenue synergies"},"body":{"fr":"Les synergies de coûts (suppression de doublons, achats, sites) sont les plus crédibles et les plus rapides à réaliser. Les synergies de revenus (cross-selling, accès à de nouveaux marchés) sont réelles mais bien plus incertaines : les analystes les escomptent fortement. En entretien, soulignez qu'on modélise toujours les synergies nettes des coûts de réalisation (intégration, restructuration).","en":"Cost synergies (removing duplications, procurement, sites) are the most credible and fastest to realise. Revenue synergies (cross-selling, access to new markets) are real but far more uncertain: analysts heavily discount them. In interviews, stress that synergies are always modelled net of the costs to achieve them (integration, restructuring)."}},{"heading":{"fr":"Défenses anti-OPA et seuils","en":"Anti-takeover defences and thresholds"},"body":{"fr":"En France, le franchissement du seuil de 30 % du capital ou des droits de vote déclenche l'obligation de lancer une [[OPA]] (offre publique d'achat) sur le reste des titres. Les défenses classiques contre une offre hostile incluent la poison pill (dilution déclenchée pour renchérir la prise de contrôle) et le white knight (acquéreur ami sollicité pour contrer l'assaillant).","en":"In France, crossing the 30% threshold of capital or voting rights triggers the obligation to launch a mandatory [[OPA]] (tender offer) for the remaining shares. Classic defences against a hostile bid include the poison pill (a triggered dilution that makes the takeover costlier) and the white knight (a friendly acquirer brought in to counter the raider)."}}],"exempleChiffre":{"title":{"fr":"Exemple chiffré (corrigé) : un deal dilutif malgré une cible « moins chère »","en":"Worked example (corrected): a dilutive deal despite a 'cheaper' target"},"body":{"fr":"Acquéreur : résultat net 100, 10 actions, donc BPA = 10. Cible : résultat net 60. Le deal en actions porte le résultat net pro forma à 100 + 60 = 160 mais le nombre d'actions à 10 + 10 = 20 (l'acquéreur a dû émettre 10 actions). BPA pro forma = 160 / 20 = 8, contre 10 avant le deal : le deal est DILUTIF (−20 %), malgré une cible apparemment « moins chère ». Le ratio d'échange (10 actions émises pour 60 de bénéfice) domine l'écart de P/E.","en":"Acquirer: net income 100, 10 shares, so EPS = 10. Target: net income 60. The all-stock deal raises pro forma net income to 100 + 60 = 160 but shares to 10 + 10 = 20 (the acquirer had to issue 10 shares). Pro forma EPS = 160 / 20 = 8, versus 10 before the deal: the deal is DILUTIVE (−20%), despite an apparently 'cheaper' target. The exchange ratio (10 shares issued for 60 of earnings) dominates the P/E gap."},"figures":[{"caption":{"fr":"BPA avant / après","en":"EPS before / after"},"columns":["","Résultat net","Actions","BPA"],"rows":[["Acquéreur seul","100","10","10,0"],["Pro forma","160","20","8,0"]]}]},"piegesEntretien":[{"fr":"Appliquer la règle « P/E plus bas = relutif » à un deal en actions : elle ne vaut proprement que pour un financement cash/dette ; en actions, c'est le ratio d'échange qui décide.","en":"Applying the 'lower P/E = accretive' rule to a stock deal: it only holds cleanly for cash/debt financing; in stock, the exchange ratio decides."},{"fr":"Oublier de comparer le rendement de la cible (1/P/E) au coût APRÈS impôt de la dette, pas au coût brut.","en":"Forgetting to compare the target's yield (1/P/E) to the AFTER-tax cost of debt, not the gross cost."},{"fr":"Prendre les synergies de revenus pour argent comptant : elles sont les plus fragiles et les premières contestées.","en":"Taking revenue synergies at face value: they are the most fragile and the first to be challenged."},{"fr":"Ignorer le seuil français de 30 % qui déclenche l'OPA obligatoire.","en":"Ignoring the French 30% threshold that triggers a mandatory tender offer."}],"synthese":{"fr":"• Accretive si BPA pro forma ↑, dilutive si ↓.\n• Règle de pouce (cash/dette) : cible à P/E plus bas = relutif si rendement cible > coût après impôt du financement.\n• En actions : le ratio d'échange domine — une cible « moins chère » peut être dilutive (ex. BPA 10 → 8).\n• Synergies coûts > synergies revenus en crédibilité ; toujours nettes des coûts d'intégration.\n• France : OPA obligatoire au seuil de 30 % ; défenses : poison pill, white knight.","en":"• Accretive if pro forma EPS rises, dilutive if it falls.\n• Rule of thumb (cash/debt): lower-P/E target = accretive if target yield > after-tax financing cost.\n• In stock: the exchange ratio dominates — a 'cheaper' target can be dilutive (e.g. EPS 10 → 8).\n• Cost synergies more credible than revenue synergies; always net of integration costs.\n• France: mandatory tender offer at the 30% threshold; defences: poison pill, white knight."}},"glossaryRefs":["accretion-dilution","eps","opa","synergies"]},{"id":"mod.l4.project-finance","type":"module","level":4,"topic":"ProjectFinance","tags":["ProjectFinance","DSCR","LLCR","non-recourse"],"difficulty":4,"source":{"flag":"VERIFIED","ref":"Yescombe Principles of Project Finance"},"title":{"fr":"Project finance : ratios de couverture et dette sans recours","en":"Project finance: coverage ratios and non-recourse debt"},"objective":{"fr":"Calculer et distinguer DSCR, ICR, LLCR et PLCR, et comprendre la logique de la dette non-recourse adossée aux cash-flows d'un projet.","en":"Compute and distinguish DSCR, ICR, LLCR and PLCR, and grasp the logic of non-recourse debt secured on a project's cash flows."},"estMinutes":17,"prerequisites":[],"content":{"contexte":{"fr":"Le project finance finance des actifs longs (infrastructures, énergie, transports) via une société dédiée dont la dette est remboursée par les seuls cash-flows du projet. Les prêteurs scrutent des ratios de couverture spécifiques : DSCR, ICR, LLCR, PLCR. Les confondre en entretien est rédhibitoire.","en":"Project finance funds long-lived assets (infrastructure, energy, transport) via a dedicated company whose debt is repaid solely from the project's cash flows. Lenders scrutinise specific coverage ratios: DSCR, ICR, LLCR, PLCR. Confusing them in an interview is a deal-breaker."},"concepts":[{"heading":{"fr":"DSCR : le ratio central","en":"DSCR: the central ratio"},"body":{"fr":"Le [[DSCR]] (Debt Service Coverage Ratio) = CFADS / service de la dette, où le CFADS (Cash Flow Available for Debt Service) est le cash-flow disponible pour le service de la dette et le service de la dette = intérêts + principal exigible sur la période. Un DSCR de 1,0x signifie que le cash couvre tout juste les échéances ; les banques exigent typiquement un minimum bancaire autour de 1,0x à 1,3x selon le risque du projet, avec une marge de sécurité au-dessus.","en":"The [[DSCR]] (Debt Service Coverage Ratio) = CFADS / debt service, where CFADS (Cash Flow Available for Debt Service) is the cash available to service debt and debt service = interest + principal due over the period. A DSCR of 1.0x means cash just covers the instalments; banks typically require a minimum around 1.0x to 1.3x depending on project risk, with headroom above."}},{"heading":{"fr":"ICR : ne pas confondre avec le DSCR","en":"ICR: do not confuse it with DSCR"},"body":{"fr":"L'ICR (Interest Coverage Ratio) = EBIT / intérêts. Il ne couvre que les intérêts, pas le principal. C'est une mesure distincte du DSCR : un projet peut afficher un bon ICR (beaucoup de marge sur les intérêts) mais un DSCR tendu si le remboursement du principal est lourd sur la période. Confondre les deux est une erreur classique.","en":"The ICR (Interest Coverage Ratio) = EBIT / interest. It only covers interest, not principal. It is a measure distinct from DSCR: a project can show a healthy ICR (plenty of headroom on interest) yet a tight DSCR if principal repayment is heavy in the period. Confusing the two is a classic mistake."}},{"heading":{"fr":"LLCR vs PLCR","en":"LLCR vs PLCR"},"body":{"fr":"Le [[LLCR]] (Loan Life Coverage Ratio) = VAN du CFADS sur la durée résiduelle du PRÊT, divisée par la dette en cours. Le [[PLCR]] (Project Life Coverage Ratio) = VAN du CFADS sur la durée résiduelle du PROJET (au-delà du prêt), divisée par la dette en cours. Le PLCR est donc toujours ≥ LLCR car il capte le tail (les cash-flows après remboursement intégral du prêt), une réserve de sécurité pour les prêteurs.","en":"The [[LLCR]] (Loan Life Coverage Ratio) = NPV of CFADS over the remaining LOAN life, divided by outstanding debt. The [[PLCR]] (Project Life Coverage Ratio) = NPV of CFADS over the remaining PROJECT life (beyond the loan), divided by outstanding debt. The PLCR is therefore always ≥ LLCR because it captures the tail (cash flows after the loan is fully repaid), a safety buffer for lenders."}},{"heading":{"fr":"DSRA, dette non-recourse et PPP","en":"DSRA, non-recourse debt and PPP"},"body":{"fr":"La dette est typiquement [[non-recourse]] : les prêteurs ne se remboursent que sur les cash-flows et les actifs du projet, sans recours sur le bilan des sponsors. Un DSRA (Debt Service Reserve Account) immobilise l'équivalent de 6 à 12 mois de service de la dette en sécurité. Les PPP (partenariats public-privé) sont une application fréquente : un consortium privé finance et exploite une infrastructure publique en se remboursant sur des paiements de disponibilité ou des péages.","en":"Debt is typically [[non-recourse]]: lenders are repaid only from the project's cash flows and assets, with no recourse to the sponsors' balance sheets. A DSRA (Debt Service Reserve Account) sets aside the equivalent of 6 to 12 months of debt service as a buffer. PPPs (public-private partnerships) are a frequent application: a private consortium finances and operates a public asset, repaid through availability payments or tolls."}}],"exempleChiffre":{"title":{"fr":"Exemple chiffré : DSCR et ICR sur une année","en":"Worked example: DSCR and ICR for one year"},"body":{"fr":"Sur une année donnée : CFADS = 100, service de la dette (intérêts 50 + principal) tel que le service total = 50 pour cet exemple → DSCR = 100 / 50 = 2,0x, confortablement au-dessus du minimum bancaire d'environ 1,0x. Côté ICR : EBIT = 150, intérêts = 50 → ICR = 150 / 50 = 3,0x. Les deux ratios sont distincts : le DSCR mesure la couverture du service total de la dette, l'ICR uniquement celle des intérêts.","en":"For a given year: CFADS = 100, debt service = 50 → DSCR = 100 / 50 = 2.0x, comfortably above the ~1.0x bank minimum. For the ICR: EBIT = 150, interest = 50 → ICR = 150 / 50 = 3.0x. The two ratios are distinct: DSCR measures coverage of total debt service, ICR only of interest."},"figures":[{"caption":{"fr":"DSCR vs ICR","en":"DSCR vs ICR"},"columns":["Ratio","Numérateur","Dénominateur","Résultat"],"rows":[["DSCR","CFADS = 100","Service dette = 50","2,0x"],["ICR","EBIT = 150","Intérêts = 50","3,0x"]]}]},"piegesEntretien":[{"fr":"Confondre DSCR (couvre intérêts + principal) et ICR (couvre les seuls intérêts) — ce sont deux ratios différents.","en":"Confusing DSCR (covers interest + principal) and ICR (covers interest only) — they are two different ratios."},{"fr":"Inverser LLCR et PLCR : le PLCR couvre toute la durée du projet, donc ≥ LLCR, car il inclut le tail.","en":"Swapping LLCR and PLCR: the PLCR covers the whole project life, hence ≥ LLCR, because it includes the tail."},{"fr":"Oublier que la dette est non-recourse : aucun recours sur les sponsors, d'où l'exigence de ratios de couverture stricts et d'un DSRA.","en":"Forgetting that the debt is non-recourse: no recourse to sponsors, hence the strict coverage ratios and a DSRA."},{"fr":"Utiliser le résultat net plutôt que le CFADS au numérateur du DSCR.","en":"Using net income rather than CFADS in the DSCR numerator."}],"synthese":{"fr":"• DSCR = CFADS / service de la dette (ex. 100/50 = 2,0x ; minimum bancaire ~1,0x).\n• ICR = EBIT / intérêts (ex. 150/50 = 3,0x) — distinct du DSCR.\n• LLCR = VAN CFADS sur la durée du prêt ; PLCR = sur la durée du projet ; PLCR ≥ LLCR.\n• DSRA = réserve de service de la dette ; dette non-recourse adossée aux cash-flows.\n• PPP = application courante du project finance.","en":"• DSCR = CFADS / debt service (e.g. 100/50 = 2.0x; bank minimum ~1.0x).\n• ICR = EBIT / interest (e.g. 150/50 = 3.0x) — distinct from DSCR.\n• LLCR = NPV of CFADS over loan life; PLCR = over project life; PLCR ≥ LLCR.\n• DSRA = debt service reserve account; non-recourse debt secured on cash flows.\n• PPP = a common project-finance application."}},"glossaryRefs":["dscr","llcr","plcr","non-recourse"]},{"id":"mod.l4.three-statement-model","type":"module","level":4,"topic":"Accounting","tags":["Accounting","three-statement","modelling"],"difficulty":4,"source":{"flag":"EXEMPLE_PEDAGOGIQUE","ref":"Cas AirNeo — modèle 3 états liés (dataroom corrigée)"},"title":{"fr":"Modélisation des 3 états liés : le cas AirNeo","en":"Linked three-statement modelling: the AirNeo case"},"objective":{"fr":"Construire un mini-modèle 3 états cohérent (compte de résultat, tableau d'amortissement de dette) et repérer les erreurs qui cassent le lien entre états.","en":"Build a coherent mini three-statement model (P&L, debt amortisation schedule) and spot the errors that break the link between statements."},"estMinutes":20,"prerequisites":[],"content":{"contexte":{"fr":"Le modèle à trois états liés (compte de résultat, bilan, tableau de flux) est la compétence socle du métier : tout doit s'articuler et le bilan doit équilibrer. Le cas AirNeo (achat d'un avion financé en dette) illustre comment une seule erreur d'input — un chiffre d'affaires figé à zéro — propage des absurdités dans tout le modèle.","en":"The linked three-statement model (P&L, balance sheet, cash flow statement) is the core skill of the job: everything must tie out and the balance sheet must balance. The AirNeo case (a debt-financed aircraft purchase) shows how a single input error — revenue frozen at zero — propagates absurdities through the whole model."},"concepts":[{"heading":{"fr":"Le montage AirNeo","en":"The AirNeo setup"},"body":{"fr":"AirNeo acquiert un avion à 50 M€, financé à 10 % par apport en fonds propres (5 M€) et 90 % par dette (45 M€) sur 10 ans à un taux de 4 %. L'avion s'amortit économiquement en linéaire sur 25 ans, soit 2 M€ par an de dotation aux amortissements. Les revenus démarrent à 15 M€ (croissance +5 % la première année puis +3 %), les charges opérationnelles (opex) à 7 M€ (+2,5 % par an), et l'IS France est de 25 %.","en":"AirNeo buys an aircraft for €50m, funded 10% by equity (€5m) and 90% by debt (€45m) over 10 years at a 4% rate. The aircraft depreciates on a straight-line basis over 25 years, i.e. €2m per year. Revenue starts at €15m (growth +5% in year 1, then +3%), operating expenses (opex) at €7m (+2.5% per year), and the French corporate tax is 25%."}},{"heading":{"fr":"Lier les trois états","en":"Linking the three statements"},"body":{"fr":"Le résultat net du compte de résultat alimente les capitaux propres au bilan et démarre le tableau de flux. Les amortissements sont rajoutés dans le flux d'exploitation (charge non décaissée). Le remboursement du principal de la dette réduit le passif au bilan et sort en flux de financement. La trésorerie finale du tableau de flux doit égaler la trésorerie du bilan — c'est le contrôle d'équilibre.","en":"Net income from the P&L feeds equity on the balance sheet and starts the cash flow statement. Depreciation is added back in operating cash flow (a non-cash charge). Debt principal repayment reduces the liability on the balance sheet and flows out in financing. The ending cash of the cash flow statement must equal balance-sheet cash — that is the balancing check."}},{"heading":{"fr":"La correction de la dataroom","en":"The dataroom correction"},"body":{"fr":"Le fichier « corrigé » fourni dans la dataroom (BP_Airbus_Model.xlsx) était cassé : le chiffre d'affaires était figé à 0 sur toutes les années. Conséquences en chaîne : des marges absurdes (négatives car opex sans revenus), un DSCR et un ICR rendus identiques à tort (le numérateur s'effondrait de la même manière), des dettes fournisseurs portées à 5 au lieu de 1,25 (soit 60 jours d'opex + taxes), et une trésorerie de −70. Le bon point de départ est un CA de 15 M€ qui croît, pas un CA nul.","en":"The 'corrected' file provided in the dataroom (BP_Airbus_Model.xlsx) was broken: revenue was frozen at 0 across all years. Chain effects: absurd margins (negative, opex with no revenue), a DSCR and ICR wrongly made identical (the numerator collapsed the same way), accounts payable booked at 5 instead of 1.25 (i.e. 60 days of opex + taxes), and cash of −70. The correct starting point is revenue of €15m that grows, not zero revenue."}}],"exempleChiffre":{"title":{"fr":"Mini-version correcte : tableau d'amortissement + P&L sur 3 ans","en":"Correct mini-version: amortisation schedule + P&L over 3 years"},"body":{"fr":"Dette : 45 M€ à 4 % sur 10 ans, remboursement linéaire du principal de 4,5 M€/an. Année 1 : intérêts = 45 × 4 % = 1,80 ; année 2 : encours 40,5 → intérêts = 1,62 ; année 3 : encours 36,0 → intérêts = 1,44.\n\nCompte de résultat : revenus 15,00 puis +5 % = 15,75 puis +3 % = 16,22. Opex 7,00 puis +2,5 % = 7,18 puis 7,36. Amortissement 2,00 constant. EBIT = revenus − opex − amortissement. Résultat avant impôt = EBIT − intérêts. IS = 25 % du résultat avant impôt. Année 1 : EBIT = 15,00 − 7,00 − 2,00 = 6,00 ; RAI = 6,00 − 1,80 = 4,20 ; IS = 1,05 ; résultat net = 3,15. Les marges sont positives et plausibles — l'inverse du fichier cassé.","en":"Debt: €45m at 4% over 10 years, straight-line principal repayment of €4.5m/yr. Year 1: interest = 45 × 4% = 1.80; year 2: balance 40.5 → interest = 1.62; year 3: balance 36.0 → interest = 1.44.\n\nP&L: revenue 15.00 then +5% = 15.75 then +3% = 16.22. Opex 7.00 then +2.5% = 7.18 then 7.36. Depreciation 2.00 flat. EBIT = revenue − opex − depreciation. Pre-tax income = EBIT − interest. Tax = 25% of pre-tax income. Year 1: EBIT = 15.00 − 7.00 − 2.00 = 6.00; pre-tax = 6.00 − 1.80 = 4.20; tax = 1.05; net income = 3.15. Margins are positive and plausible — the opposite of the broken file."},"figures":[{"caption":{"fr":"Tableau d'amortissement de la dette (M€)","en":"Debt amortisation schedule (€m)"},"columns":["Année","Encours début","Intérêts 4%","Principal","Encours fin"],"rows":[["1","45,0","1,80","4,5","40,5"],["2","40,5","1,62","4,5","36,0"],["3","36,0","1,44","4,5","31,5"]]},{"caption":{"fr":"Compte de résultat (M€)","en":"P&L (€m)"},"columns":["","An 1","An 2","An 3"],"rows":[["Revenus","15,00","15,75","16,22"],["Opex","7,00","7,18","7,36"],["Amortissement","2,00","2,00","2,00"],["EBIT","6,00","6,57","6,86"],["Intérêts","1,80","1,62","1,44"],["RAI","4,20","4,95","5,42"],["IS 25%","1,05","1,24","1,36"],["Résultat net","3,15","3,71","4,07"]]}]},"piegesEntretien":[{"fr":"Laisser un input cassé (CA = 0) se propager : toujours faire un sanity-check des marges et des ratios.","en":"Letting a broken input (revenue = 0) propagate: always sanity-check margins and ratios."},{"fr":"Obtenir un DSCR = ICR : signal d'alerte, ce sont des ratios distincts qui ne peuvent être égaux par hasard que si une variable est figée.","en":"Getting DSCR = ICR: a red flag; these are distinct ratios that can only coincide by accident if a variable is frozen.
